1: |-
    ज्यायसी चेत् कर्मणस्ते मता बुद्धिर्जनार्दन ।
    तत् किं कर्मणि घोरे मां नि-योजयसि केशव ॥

2: |-
    व्यामिश्रेणैव वाक्येन बुद्धिं मोहयसीव मे ।
    तदेकं वद निश्चित्य येन श्रेयोऽहमाप्नुयाम् ॥

3: |-
    लोकेऽस्मिन् द्विविधा निष्ठा पुरा प्रोक्ता मयाऽनघ ।
    ज्ञान-योगेन सांख्यानां कर्म-योगेन योगिनाम्

4: |-
    न कर्मणामनारंभात् नैष्कर्म्यं पुरुषोऽश्नुते ।
    न च सं-न्यसनादेव सिद्धिं समधि-गच्छति ॥

5: |-
    न हि कश्चित् क्षणमपि जातु तिष्ठत्यकर्म-कृत् ।
    कार्यते ह्यवशः कर्म सर्वः प्रकृति-जैर्गुणैः ॥

6: |-
    कर्मेंद्रियाणि संयम्य य आस्ते मनसा चरन् ।
    इंद्रियार्थान् विमूढात्मा मिथ्याचारः स उच्यते ॥

7: |-
    यस्त्विंद्रियाणि मनसा नियम्यारभतेऽर्जुन ।
    कर्मेंद्रियैः कर्म-योगं असक्तः स विशिष्यते ॥

8: |-
    नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः ।
    शरीर-यात्रापि च ते न प्रसिद्ध्येदकर्मणः ॥

9: |-
    यज्ञार्थात् कर्मणोऽन्यत्र लोकोऽयं कर्म-बंधनः ।
    तदर्थं कर्म कौंतेय मुक्त-संगः समाचर ॥

10: |-
    सह-यज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजा-पतिः ।
    अनेन प्र-सविष्यध्वं एष वोऽस्त्विष्ट-काम-धुक् ॥

11: |-
    देवान् भावयतानेन ते देवा भावयंतु वः ।
    परस्परं भावयंतः श्रेयः परमवाप्स्यथ ॥

12: |-
    इष्टान् भोगान् हि वो देवाः दास्यंते यज्ञ-भाविताः ।
    तैर्दत्तानप्रदायैभ्यो यो भुंक्ते स्तेन एव सः ॥

13: |-
    यज्ञ-शिष्टाशिनः संतो मुच्यंते सर्व-किल्बिषैः ।
    भुंजते ते त्वघं पापाः ये पचंत्यात्म-कारणात् ॥

14: |-
    अन्नाद् भवंति भूतानि पर्जन्यादन्न-संभवः ।
    यज्ञाद् भवति पर्जन्यो यज्ञः कर्म-समुद्भवः ॥

15: |-
    कर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षर-समुद्भवम् ॥
    तस्मात् सर्व-गतं ब्रह्म नित्यं यज्ञे प्र-तिष्ठितम् ॥

16: |-
    एवं प्र-वर्तितं चक्रं नानु-वर्तयतीह यः ।
    अघायुरिंद्रियारामो मोघं पार्थ स जीवति ॥

17: |-
    यस्त्वात्म-रतिरेव स्यात् आत्म-तृप्तश्च मानवः ।
    आत्मन्येव च संतुष्टः तस्य कार्यं न विद्यते ॥

18: |-
    नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन ।
    नचास्य सर्व-भूतेषु कश्चिदर्थ-व्यपाश्रयः ॥

19: |-
    तस्मादसक्तः सततं कार्यं कर्म समाचर ।
    असक्तो ह्याचरन् कर्म परमाप्नोति पूरुषः ॥

20: |-
    कर्मणैव हि संसिद्धिं आस्थिता जनकादयः ।
    लोक-सं-ग्रहमेवापि सं-पश्यन् कर्तुमर्हसि ॥

21: |-
    यद्यदाचरति श्रेष्ठः तत्तदेवेतरो जनः ।
    स यत् प्रमाणं कुरुते लोकस्तदनु-वर्तते ॥

22: |-
    न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किंचन ।
    नानवाप्तमवाप्तव्यं वर्त एव च कर्मणि ॥

23: |-
    यदि ह्यहं न वर्तेयं जातु कर्मण्यतंद्रितः ।
    मम वर्त्मानु-वर्तंते मनुष्याः पार्थ सर्वशः ॥

24: |-
    उत्सीदेयुरिमे लोकाः न कुर्यां कर्म चेदहम् ।
    संकरस्य च कर्ता स्यां उपहन्यामिमाः प्रजाः ॥

25: |-
    सक्ताः कर्मण्यविद्वांसो यथा कुर्वंति भारत ॥
    कुर्याद् विद्वांस्तथासक्तः चिकीर्षुर्लोक-संग्रहम् ॥

26: |-
    न बुद्धि-भेदं जनयेत् अज्ञानां कर्म-संगिनाम् ।
    जोषयेत् सर्व-कर्माणि विद्वान् युक्तः समाचरन् ॥

27: |-
    प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः ।
    अहंकार-विमूढात्मा कर्ताहमिति मन्यते ॥

28: |-
    तत्त्व-वित्तु महाबाहो गुण-कर्म-विभागयोः ।
    गुणा गुणेषु वर्तंते इति मत्वा न सज्जते ॥

29: |-
    प्रकृतेर्गुण-सम्मूढाः सज्जंते गुण-कर्मसु ।
    तानकृत्स्न-विदो मंदान् कृत्स्न-विन्न विचालयेत् ॥

30: |-
    मयि सर्वाणि कर्माणि संन्यस्याध्यात्म-चेतसा ।
    निराशीर्निर्ममो भूत्वा युध्यस्व विगत-ज्वरः ॥        

31: |-
    ये मे मतमिदं नित्यं अनु-तिष्ठंति मानवाः ।
    श्र्रद्धावंतोऽनसूयंतो मुच्यंते तेऽपि कर्मभिः ॥

32: |-
    ये त्वेतदभ्यसूयंतो नानु-तिष्ठंति मे मतम् ।
    सर्व-ज्ञान-विमूढांस्तान् विद्धि नष्टानचेतसः ॥

33: |-
    सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञान-वानपि ।
    प्रकृतिं यांति भूतानि निग्रहः किं करिष्यति ॥

34: |-
    इंद्रियस्येंद्रियस्यार्थे राग-द्वेषौ व्यवस्थितौ ।
    तयोर्न वशमागच्छेत् तौ ह्यस्य परि-पंथिनौ ॥

35: |-
    श्रेयान् स्व-धर्मो विगुणः पर-धर्मात् स्वनुष्ठितात् ।
    स्व-धर्मे निधनं श्रेयः पर-धर्मो भयावहः ॥

36: |-
    अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः ।
    अनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः ॥

37: |-
    काम एषः क्रोध एषः रजोगुण-समुद्भवः ।
    महाशनो महापाप्मा विद्ध्येनमिह वैरिणम् ॥

38: |-
    धूमेनाव्रियते वह्निः यथादर्शो मलेन च ।
    यथोल्बेनावृतो गर्भः तथा तेनेदमावृतम् ॥

39: |-
    आवृतं ज्ञानमेतेन ज्ञानिनो नित्य-वैरिणा ।
    काम-रूपेण कौंतेय दुष्पूरेणानलेन च ॥

40: |-
    इंद्रियाणि मनो बुद्धिः अस्याधिष्ठानमुच्यते ।
    एतैर्विमोहयत्येषः ज्ञानमावृत्य देहिनम् ॥

41: |-
    तस्मात् त्वमिंद्रियाण्यादौ नियम्य भरतर्षभ ।
    पाप्मानं प्रजहि ह्येनं ज्ञान-विज्ञान-नाशनम् ॥

42: |-
    इंद्रियाणि पराण्याहुः इंद्रियेभ्यः परं मनः ।
    मनस्तस्तु परा बुद्धिः यो बुद्धेः परतस्तु सः ॥

43: |-
    एवं बुद्धेः परं बुद्ध्वासंस्तभ्यात्मानमात्मना ।
    जहि शत्रुं महाबाहो काम-रूपं दुरासदम् ॥

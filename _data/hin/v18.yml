1: |-
    संन्यासस्य महाबाहो तत्वमिच्छामि वेदितुम् ।
    त्यागस्य च हृषीकेश पृथक् केशि-निषूदन ॥

2: |-
    काम्यानां कर्मणां न्यासं संन्यासं कवयो विदुः ।
    सर्व-कर्म-फल-त्यागं प्राहुस्त्यागं विचक्षणाः ॥

3: |-
    त्याज्यं दोष-वदित्येके कर्म प्राहुर्मनीषिणः ।
    यज्ञ-दान-तपः-कर्म न त्याज्यमिति चापरे ॥

4: |-
    निश्श्चयं शृणु मे तत्र त्यागे भरत-सत्तम ।
    त्यागो हि पुरुष-व्याघ्र त्रि-विधः संप्र-कीर्तितः ॥

5: |-
    यज्ञ-दान-तपः-कर्म न त्याज्यं कार्यमेव तत् ।
    यज्ञो दानं तपश्चैव पावनानि मनीषिणाम् ॥

6: |-
    एतान्यपि तु कर्माणि संगं त्यक्त्वा फलानि च ।
    कर्तव्यानीति मे पार्थ निश्चितं मतमुत्तमम् ॥

7: |-
    नियतस्य तु संन्यासः कर्मणो नोप-पद्यते ।
    मोहात् तस्य परित्यागः तामसः परि-कीर्तितः ॥

8: |-
    दुःखमित्येव यत् कर्म काय-क्लेश-भयात् त्यजेत् ।
    स कृत्वा राजसं त्यागं नैव त्याग-फलं लभेत् ॥

9: |-
    कार्यमित्येव यत् कर्म नियतं क्रियतेऽर्जुन ।
    संगं त्यक्त्वा फलं चैव स त्यागः सात्त्विको मतः ॥

10: |-
    न द्वेष्ट्यकुशलं कर्म कुशले नानु-षज्जते ।
    त्यागी सत्त्व-समाविष्टो मेधावी छिन्न-संशयः ॥

11: |-
    न हि देह-भृता शक्यं त्यक्तुं कर्माण्यशेषतः ।
    यस्तु कर्म-फल-त्यागी स त्यागीत्यभि-धीयते ॥

12: |-
    अनिष्टमिष्टं मिश्रं च त्रि-विधं कर्मणः फलम् ।
    भवत्यत्यागिनां प्रेत्य न तु संन्यासिनां क्वचित् ॥

13: |-
    पंचैतानि महा-बाहो कारणानि निबोध मे ।
    सांख्ये कृतांते प्रोक्तानि सिद्धये सर्व-कर्मणाम् ॥

14: |-
    अधिष्ठानं तथा कर्ता करणं च पृथग्विधम् ।
    विविधाश्च पृथक् चेष्टा दैवं चैवात्र पंचमम् ॥

15: |-
    शरीर-वाङ्मनोभिर्यत् कर्म प्रारभते नरः ।
    न्याय्यं वा विपरीतं वा पंचैते तस्य हेतवः ॥

16: |-
    तत्रैवं सति कर्तारं आत्मानं केवलं तु यः ।
    पश्यत्यकृत-बुद्धित्वात् न स पश्यति दुर्मतिः ॥

17: |-
    यस्य नाहं-कृतो भावो बुद्धिर्यस्य न लिप्यते ।
    हत्वाऽपि स इमान् लोकान् न हंति न निबध्यते ॥

18: |-
    ज्ञानं ज्ञेयं परि-ज्ञाता त्रि-विधा कर्म-चोदना ।
    करणं कर्म कर्तेति त्रि-विधः कर्म-संग्रहः ॥

19: |-
    ज्ञानं कर्म च कर्ता च त्रि-धैव गुण-भेदतः ।
    प्रोच्यते गुण-संख्याने यथावच्छृणु तान्यपि ॥

20: |-
    सर्व-भूतेषु येनैकं भावमव्ययमीक्षते ।
    अविभक्तं विभक्तेषु तज्ज्ञानं विद्धि सात्त्विकम् ॥

21: |-
    पृथक्त्वेन तु यज्ज्ञानं नाना-भावान् पृथग्विधान् ।
    वेत्ति सर्वेषु भूतेषु तज्ज्ञानं विद्धि राजसम् ॥

22: |-
    यत् तु कृत्स्न-वदेकस्मिन् कार्ये सक्तमहैतुकम् ।
    अतत्वार्थ-वदल्पं च तत् तामसमुदाहृतम् ॥

23: |-
    नियतं संग-रहितं अराग-द्वेषतः कृतम् ।
    अफल-प्रेप्सुना कर्म यत् तत् सात्त्विकमुच्यते ॥

24: |-
    यत् तु कामेप्सुना कर्म साहं-कारेण वा पुनः ।
    क्रियते बहुलायासं तद् राजसमुदाहृतम् ॥

25: |-
    अनुबंधं क्षयं हिंसां अनपेक्ष्य च पौरुषम् ।
    मोहादारभ्यते कर्म यत् तत् तामसमुच्यते ॥

26: |-
    मुक्त-संगोऽनहं-वादी धृत्युत्साह-समन्वितः ।
    सिद्ध्यसिद्ध्योर्निर्विकारः कर्ता सात्त्विक उच्यते ॥

27: |-
    रागी कर्म-फल-प्रेप्सुः लुब्धो हिंसात्मकोऽशुचिः ।
    हर्ष-शोकान्वितः कर्ता राजसः परिकीर्तितः ॥

28: |-
    अयुक्तः प्राकृतः स्तब्धः शठो नैकृतिकोऽलसः ।
    विषादी दीर्घ-सूत्री च कर्ता तामस उच्यते ॥

29: |-
    बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रि-विधं शृणु ।
    प्रोच्यमानमशेषेण पृथक्त्वेन धनं-जय ॥

30: |-
    प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये ।
    बंधं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी ॥

31: |-
    यया धर्ममधर्मं च कार्यं चाकार्यमेव च ।
    अयथा-वत् प्रजानाति बुद्धिः सा पार्थ राजसी ॥

32: |-
    अधर्मं धर्ममिति या मन्यते तमसाऽऽवृता ।
    सर्वार्थान् विपरीतांश्च बुद्धिः सा पार्थ तामसी ॥

33: |-
    धृत्या यया धारयते मनः-प्राणेंद्रिय-क्रियाः ।
    योगेनाव्यभि-चारिण्या धृतिः सा पार्थ सात्त्विकी ॥

34: |-
    यया तु धर्म-कामार्थान् धृत्या धारयतेऽर्जुन ।
    प्रसंगेन फलाकांक्षी धृतिः सा पार्थ राजसी ॥

35: |-
    यया स्वप्नं भयं शोकं विषादं मदमेव च ।
    न विमुंचति दुर्मेधा धृतिः सा पार्थ तामसी ॥

36: |-
    सुखं त्विदानीं त्रि-विधं शृणु मे भरतर्षभ ।
    अभ्यासाद् रमते यत्र दुःखांतं च निगच्छति ॥

37: |-
    यत् तदग्रे विषमिव परिणामेऽमृतोपमम् ।
    तत् सुखं सात्विकं प्रोक्तं आत्म-बुद्धि-प्रसाद-जम् ॥

38: |-
    विषयेंद्रिय-संयोगात् यत् तदग्रेऽमृतोपमम् ।
    परिणामे विषमिव तत् सुखं राजसं स्मृतम् ॥

39: |-
    यदग्रे चानुबंधे च सुखं मोहनमात्मनः ।
    निद्रालस्य-प्रमादोत्थं तत् तामसमुदाहृतम् ॥

40: |-
    न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः ।
    सत्वं प्रकृति-जैर्मुक्तं यदेभिः स्यात् त्रिभिर्गुणैः ॥

41: |-
    ब्राह्मण-क्षत्रिय-विशां शूद्राणां च परं-तप ।
    कर्माणि प्रवि-भक्तानि स्व-भाव-प्रभवैर्गुणैः ॥

42: |-
    शमो दमस्तपः शौचं क्षांतिरार्जवमेव च ।
    ज्ञानं विज्ञानमास्तिक्यं ब्रह्म-कर्म स्व-भाव-जम् ॥

43: |-
    शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम् ।
    दानमीश्वर-भावश्च क्षात्रं कर्म स्व-भाव-जम् ॥

44: |-
    कृषि-गो-रक्ष-वाणिज्यं वैश्य-कर्म स्व-भाव-जम् ।
    परिचर्यात्मकं कर्म शूद्रस्यापि स्व-भाव-जम् ॥

45: |-
    स्वे स्वे कर्मण्यभि-रतः संसिद्धिं लभते नरः ।
    स्व-कर्म-निरतः सिद्धिं यथा विंदति तच्छृणु ॥

46: |-
    यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम् ।
    स्व-कर्मणा तमभ्यर्च्य सिद्धिं विंदति मानवः ॥

47: |-
    श्रेयान् स्व-धर्मो विगुणः पर-धर्मात् स्वनुष्ठितात् ।
    स्व-भाव-नियतं कर्म कुर्वन् नाऽप्नोति किल्बिषम् ॥

48: |-
    सह-जं कर्म कौंतेय स-दोषमपि न त्यजेत् ।
    सर्वारंभा हि दोषेण धूमेनाग्निरिवाऽमृताः ॥

49: |-
    असक्त-बुद्धिः सर्वत्र जितात्मा विगत-स्पृहः ।
    नैष्कर्म्य-सिद्धिं परमां संन्यासेनाधिगच्छति ॥

50: |-
    सिद्धिं प्राप्तो यथा ब्रह्म तथाऽऽप्नोति निबोध मे ।
    समासेनैव कौंतेय निष्ठा ज्ञानस्य या परा ॥

51: |-
    बुद्ध्याविशुद्धया युक्तो धृत्याऽऽत्मानं नियम्य च ।
    शब्दादीन् विषयांस्त्यक्त्वा राग-द्वेषौ व्युदस्य च ॥

52: |-
    विविक्त-सेवी लघ्वाशी यत-वाक्काय-मानसः ।
    ध्यान-योग-परो नित्यं वैराग्यं समुपाश्रितः ॥

53: |-
    अहं-कारं बलं दर्पं कामं क्रोधं परिग्रहम् ।
    विमुच्य निर्ममः शांतो ब्रह्म-भूयाय कल्पते ॥

54: |-
    ब्रह्म-भूतः प्रसन्नात्मा न शोचति न कांक्षति ।
    समः सर्वेषु भूतेषु मद्भक्तिं लभते पराम् ॥

55: |-
    भक्त्या मामभि-जानाति यावान् यश्चास्मि तत्त्वतः ।
    ततो मां तत्त्वतो ज्ञात्वा विशते तदनंतरम् ॥

56: |-
    सर्व-कर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः ।
    मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम् ॥

57: |-
    चेतसा सर्व-कर्माणि मयि संन्यस्य मत्परः ।
    बुद्धि-योगमुपाश्रित्य मच्चित्तः सततं भव ॥

58: |-
    मच्चित्तः सर्व-दुर्गाणि मत्प्रसादात् तरिष्यसि ।
    अथ चेत् त्वमहं-कारात् न श्रोष्यसि विनंक्ष्यसि ॥

59: |-
    यदहं-कारमाश्रित्य न योत्स्य इति मन्यसे ।
    मिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति ॥

60: |-
    स्व-भाव-जेन कौंतेय निबद्धः स्वेन कर्मणा ।
    कर्तुं नेच्छसि यन्मोहात् करिष्यस्यवशोऽपि तत् ॥

61: |-
    ईश्वरः सर्व-भूतानां हृद्देशेऽर्जुन तिष्ठति ।
    भ्रामयन् सर्व-भूतानि यंत्रारूढानि मायया ॥

62: |-
    तमेव शरणं गच्छ सर्व-भावेन भारत ।
    तत्-प्रसादात् परां शांतिं स्थानं प्राप्स्यसि शाश्वतम् ॥

63: |-
    इति ते ज्ञानमाख्यातं गुह्याद् गुह्य-तरं मया ।
    विमृश्शैतदशेषेण यथेच्छसि तथा कुरु ॥

64: |-
    सर्व-गुह्य-तमं भूयः शृणु मे परमं वचः ।
    इष्टोऽसि मे दृढमिति ततो वक्ष्यामि ते हितम् ॥

65: |-
    मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु ।
    मामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे ॥

66: |-
    सर्व-धर्मान् परित्यज्य मामेकं शरणं व्रज ।
    अहं त्वा सर्व-पापेभ्यो मोक्षयिष्यामि मा शुचः ॥

67: |-
    इदं ते नातपस्काय नाभक्ताय कदाचन ।
    न चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति ॥

68: |-
    य इमं परमं गुह्यं मद्-भक्तेष्वभि-धास्यति ।
    भक्तिं मयि परां कृत्वा मामेवैष्यत्यसंशयः ॥

69: |-
    न च तस्मान्मनुष्येषु कश्चिन्मे प्रिय-कृत्तमः ।
    भविता न च मे तस्मात् अन्यः प्रिय-तरो भुवि ॥

70: |-
    अध्येष्यते च य इमं धर्म्यं संवादमावयोः ।
    ज्ञान-यज्ञेन तेनाहं इष्टः स्यामिति मे मतिः ॥

71: |-
    श्र्रद्धा-वाननसूयश्च शृणुयादपि यो नरः ।
    सोऽपि मुक्तः शुभान् लोकान् प्राप्नुयात्पुण्य-कर्मणाम् ॥

72: |-
    कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा ।
    कच्चिदज्ञान-संमोहः प्रनष्टस्ते धनं-जय ॥

73: |-
    नष्टो मोहः स्मृतिर्लब्धा त्वत्-प्रसादान्मयाऽच्युत ।
    स्थितोऽस्मि गत-संदेहः करिष्ये वचनं तव ॥

74: |-
    इत्यहं वासु-देवस्य पार्थस्य च महात्मनः ।
    संवादमिममश्रौषं अद्भुतं रोम-हर्षणम् ॥

75: |-
    व्यास-प्रसादाच्छ्रुतवान् एतद् गुह्यमहं परम् ।
    योगं योगेश्वरात् कृष्णात् साक्षात् कथयतः स्वयम् ॥

76: |-
    राजन् संस्मृत्य-संस्मृत्य संवादमिममद्भुतम् ।
    केशवार्जुनयोः पुण्यं हृष्यामि च मुहुर्मुहुः ॥

77: |-
    तच्च संस्मृत्य-संस्मृत्य रूपमत्यद्भुतं हरेः ।
    विस्मयो मे महान् राजन् हृष्यामि च पुनः-पुनः ॥

78: |-
    यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः ।
    तत्र श्रीर्विजयो भूतिः ध्रुवा नीतिर्मतिर्मम ॥

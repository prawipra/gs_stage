1: |-
    भूय एव महा-बाहो शृणु मे परमं वचः ।
    यत् तेऽहं प्रीयमाणाय वक्ष्यामि हित-काम्यया ॥

2: |-
    न मे विदुः सुर-गणाः प्रभवं न महर्षयः ।
    अहमादिर्हि देवानां महर्षीणां च सर्वशः ॥

3: |-
    यो मामजमनादिं च वेत्ति लोक-महेश्वरम् ।
    असम्मूढः स मर्त्येषु सर्व-पापैः प्रमुच्यते ॥

4: |-
    बुद्धिर्ज्ञानमसम्मोहः क्षमा सत्यं दमः शमः ।
    सुखं दुःखं भवोऽभावो भयं चाभयमेव च ॥

5: |-
    अहिंसा समता तुष्टिः तपो दानं यशोऽयशः ।
    भवंति भावा भूतानां मत्त एव पृथग्विधाः ॥

6: |-
    महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा ।
    मद्भावा मानसा जाताः येषां लोक इमाः प्रजाः ॥

7: |-
    एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः ।
    सोऽवि-कंपेन योगेन युज्यते नात्र संशयः ॥

8: |-
    अहं सर्वस्य प्रभवो मत्तः सर्वं प्रवर्तते ।
    इति मत्वा भजंते मां बुधा भाव-समन्विताः ॥

9: |-
    मच्चित्ता मद्गत-प्राणाः बोधयंतः परस्परम् ।
    कथयंतश्च मां नित्यं तुष्यंति च रमंति च ॥

10: |-
    तेषां सतत-युक्तानां भजतां प्रीति-पूर्वकम् ।
    ददामि बुद्धि-योगं तं येन मामुपयांति ते ॥

11: |-
    तेषामेवानु-कंपार्थं अहमज्ञान-जं तमः ।
    नाशयाम्यात्म-भावस्थो ज्ञान-दीपेन भास्वता ॥

12: |-
    परं ब्रह्म परं धाम पवित्रं परमं भवान् ।
    पुरुषं शाश्वतं दिव्यं आदि-देवमजं विभुम् ॥

13: |-
    आहुस्त्वामृषयः सर्वे देवर्षिर्नारदस्तथा ।
    असितो देवलो व्यासः स्वयं चैव ब्रवीषि मे ॥

14: |-
    सर्वमेतदृतं मन्ये यन्मां वदसि केशव ।
    नहि ते भगवन् व्यक्तिं विदुर्देवा न दानवाः ॥

15: |-
    स्वयमेवात्मनाऽऽत्मानं वेत्थ त्वं पुरुषोत्तम ।
    भूत-भावन भूतेश देव-देव जगत्पते ॥

16: |-
    वक्तुमर्हस्यशेषेण दिव्या ह्यात्म-विभूतयः ।
    याभिर्विभूतिभिर्लोकान् इमांस्त्वं व्याप्य तिष्ठसि ॥

17: |-
    कथं विद्यामहं योगिन् त्वां सदा परि-चिंतयन् ।
    केषु-केषु च भावेषु चिंत्योऽसि भगवन् मया ॥

18: |-
    विस्तरेणात्मनो योगं विभूतिं च जनार्दन ।
    भूयः कथय तृप्तिर्हि शृण्वतो नास्ति मेऽमृतम् ॥

19: |-
    हंत ते कथयिष्यामि दिव्या ह्यात्म-विभूतयः ।
    प्राधान्यतः कुरु-श्रेष्ठ नास्त्यंतो विस्तरस्य मे ॥

20: |-
    अहमात्मा गुडाकेश सर्व-भूताशय-स्थितः ।
    अहमादिश्च मध्यं च भूतानामंत एव च ॥

21: |-
    आदित्यानामहं विष्णुः ज्योतिषां रविरंशुमान् ।
    मरीचिर्मरुतामस्मि नक्षत्राणामहं शशी ॥

22: |-
    वेदानां साम-वेदोऽस्मि देवानामस्मि वासवः ।
    इंद्रियाणां मनश्चास्मि भूतानामस्मि चेतना ॥

23: |-
    रुद्राणां शंकरश्चास्मि वित्तेशो यक्ष-रक्षसाम् ।
    वसूनां पावकश्चास्मि मेरुः शिखरिणामहम् ॥

24: |-
    पुरोधसां च मुख्यं मां विद्धि पार्थ बृहस्पतिम् ।
    सेनानीनामहं स्कंदः सरसामस्मि सागरः ॥

25: |-
    महर्षीणां भृगुरहं गिरामस्म्यैकमक्षरम् ।
    यज्ञानां जप-यज्ञोऽस्मि स्थावराणां हिमालयः ॥

26: |-
    अश्वत्थः सर्व-वृक्षाणां देवर्षीणां च नारदः ।
    गंधर्वाणां चित्र-रथः सिद्धानां कपिलो मुनिः ॥

27: |-
    उच्चैःश्रवसमश्वानां विद्धि माममृतोद्भवम् ।
    ऐरावतं गजेंद्राणां नराणां च नराधिपम् ॥

28: |-
    आयुधानामहं वज्रं धेनूनामस्मि काम-धुक् ।
    प्रजनश्चास्मि कंदर्पः सर्पाणामस्मि वासुकिः ॥

29: |-
    अनंतश्चास्मि नागानां वरुणो यादसामहम् ।
    पितॄणामर्यमा चास्मि यमः संयमतामहम् ॥

30: |-
    प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम् ।
    मृगाणां च मृगेंद्रोऽहं वैनतेयश्च पक्षिणाम् ॥

31: |-
    पवनः पवतामस्मि रामः शस्त्र-भृतामहम् ।
    झषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी ॥

32: |-
    सर्गाणामादिरंतश्च मध्यं चैवाहमर्जुन ।
    अध्यात्म-विद्या विद्यानां वादः प्रवदतामहम् ॥

33: |-
    अक्षराणामकारोऽस्मि द्वंद्वः सामासिकस्य च ।
    अहमेवाक्षयः कालो धाताऽहं विश्वतो-मुखः ॥

34: |-
    मृत्युः सर्व-हरश्चाहं उद्भवश्च भविष्यताम् ।
    कीर्तिः श्रीर्वाक् च नारीणां स्मृतिर्मेधा धृतिः क्षमा ॥

35: |-
    बृहत्साम तथा साम्नां गायत्त्री छंदसामहम् ।
    मासानां मार्ग-शीर्षोऽहं ऋतूनां कुसुमाकरः ॥

36: |-
    द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम् ।
    जयोऽस्मि व्यवसायोऽस्मि सत्वं सत्त्व-वतामहम् ॥

37: |-
    वृष्णीनां वासु-देवोऽस्मि पांडवानां धनं-जयः ।
    मुनीनामप्यहं व्यासः कवीनामुशना कविः ॥

38: |-
    दंडो दमयतामस्मि नीतिरस्मि जिगीषताम् ।
    मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञान-वतामहम् ॥

39: |-
    यच्चापि सर्व-भूतानां बीजं तदहमर्जुन ।
    न तदस्ति विना यत् स्यात् मया भूतं चराचरम् ॥

40: |-
    नांतोऽस्ति मम दिव्यानां विभूतीनां परं तप ।
    एष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया ॥

41: |-
    यद्यद् विभूति-मत् सत्वं श्री-मदूर्जितमेव वा ।
    तत्तदेवाव-गच्छ त्वं मम तेजोऽंश-संभवम् ॥

42: |-
    अथवा बहुनैतेन किं ज्ञातेन तवार्जुन ।
    विष्टभ्याहमिदं कृत्स्नं एकांशेन स्थितो जगत् ॥

1: >-
  धृतराष्ट्र संजय से पूचता है। पुण्य भूमि कुरुक्षेत्र में युद्ध के लिए जमा हुए मेरे बच्चे और मेरे छोटे भाई पांडु के बच्चे
  क्या किए हैं।

2: >-
  सञ्जय बोले। युद्धसन्नद्ध हुए पाण्डव सेना को देखतेहुए राजा दुर्योधन आचार्य द्रोण के पास जाकर एसे बोले।

3: >-
  हे आचार्य, पाण्डवों की बडी सेना को देखो। द्रुपद राजा का बेटा, तुम्हारा शिष्य,
  धृष्टद्युन्म, भली चतुराई से उस सेना को सजाया है।

6: >-
  इस सेना में रहनेवाले सबके सब महारथियाँ ही है। वैसे ही वे शूर, वीर, महाशूर तीर
  चमानेवाले योद्धा और भीमार्जुन के समान महारथि योद्धा भी हैं। युयुधान, (सात्यकि),
  विराट, द्रपद, शिशुपाल का पुत्र द्रष्टकेतु, यदुवंश का चेकितान, भीम का माल काशिराजा,
  कुंतिभोज का पुत्र पुरुजित, कुंतिभोज, केकेयोंका पिता शैभ्य, सुभद्रापुत्र अभिमन्यु तथाच
  द्रौपदी के पांच बेटे - प्रतिविंध्य, सुतसोम, श्रुतकीर्ति, शतानीक, श्रुतक्रिय भी हैं।

7: >-
  हे आचार्य, हमारे यहाँ के श्रेष्ठों को भी तुम्हारे स्मरण केलिए बताता हूँ।

8: >-
  आप, भीष्म, कर्ण, युद्ध जितानेवाला कृप, अश्वत्थाम, विकर्ण (दुर्योधन का छोटा भाई),
  सोमदत्त का पुत्र भूरिश्रवस्।

9: >-
  मेरेलिए प्राण देनेवाले और भी बहुत योद्धा हैं। वे सबके सब विविध अस्त्र-शस्त्रों युद्ध
  करनेवाले है; युद्ध निपुण भी हैं।

10: >-
  भीष्म पितामह के संरक्षण में रहनेवाली हमारी सेना न के बराबर है। भीमसेन के
  नेतृत्व में रहनेवाला सेना बहुत बडिया है।

11: >-
  युद्धक्षेत्र के सभी स्थानों में अपने अपने को नियुक्त किया हुवा क्षेत्र में रहते भीष्म
  पितामह की रक्षा करना है।

12: >-
  कुरुवंश के पितामह भीष्म ने दुर्योधन की खुशी केलिए सिंहनाद जैसे गरजते हुए
  शंखनाद किया और वैरिंगण के दिल हिला रखा।

13: >-
  तदुपरांत कोने कोने से शंखनाद, पटह, डोल, भेरी, इत्यादि दम हिलानेवाले नाद गए।
  इससे परिसर गूंज उठा।

15: >-
  इस के बाद चार धवल छोडेवाले, बडे रथ में बैटे हुए कृष्णार्जुन अपने अपने शंख बजाए।
  कृष्ण ने समुंदर में मिला हुवा पंचजन नामक एक राक्षस को मारकर उससे पाया हुवा
  पांचजन्य नामक शंख को बजाया। स्वर्गाधिपति देवेंद्र से पायाहुवा देवदत्त नामक शंख को
  अर्जुन ने बजाया। दुर्जनों में भय पैदाकरनेवाला और सज्जनों को शास्त्रोपदेश देनेवाला
  भीमसेन पौण्ड्र नामक बडा शंख बजाया।

16: >-
  कुन्ति पुत्र युद्धिष्टिर ने अनंतविजय नामवाला शंखनाद किया।

18: >-
  हे महाराज, श्रेष्ट धनुर्योद्धा काशीराज, महारथि शिखंडि, धृष्टध्युम्न, विराट, अजेय सात्यकि, द्रुपद,
  द्रौपदि के बेटे, आजानुबाहु अभिमन्यु इन सभी ने एक के बाद एक अपने अपने शंखखनाद किए।

19: >-
  वह भयंकर ध्वनि भूम्याकाश को गूञ्जते हुए प्रतिफलित होकर कौरवोंके हृदयों को प्रताडते हुए
  चली गई।

21: >-
  हे प्रभो, तदुपरांत युद्धसन्नद्ध कौरवों को देखकर हनुमध्वजवाले अर्जुन् अपना धनुष उठाते
  हुए कृष्ण को संभोदित किए - हे अच्युत, मेरे रथ को दोनो सेनावों के बीच रहा करो।

22: >-
  युद्धोत्साह से भरे हुए इन को देखना चाहता हूँ। इस युद्ध में किन किन के साथ मुझे लडना है?

23: >-
  युद्धापेक्षी इन सब को एक बार मैं देखसकूँ। जो जो यहाँ जमा हुए हैं वे सब के सब दुष्ट
  सुयोधन को विजय दिलानेकेलिए लडनेवाले हैं।

25: >-
  संञ्जय बोले - हे राजन्, अर्जुन के इच्छानुसार दोनों सेना के बीच तथा भीष्म और द्रोणाचार्य
  के सामने कृष्ण रथ को रखकर बोले - हे अर्जुन, इकट्टे हुए कुरुगण को देखलो।

26: >-
  वहाँ उपस्थित दोनों सेना के बीच रहनेवाले पित्रसमान लोगों को, दादाओं को, गुरुजनों को,
  भाईगण को, बच्चों को, पौत्रों को, मित्रों को और मामागण को तथा हितैशियों को अर्जुन ने देखा।

27: >-
  वहाँ इकट्टे हुए समस्त बंधुगण को नजदीक से देखकर, करुणापूर्ण और शोकाकुल बनकर
  वेदनापूर्वक अर्जुन बोले।

29: >-
  हे कृष्ण, युद्धापेक्षा से आएगए मेरे हर एक स्वजनों को देखते देखते मेरे अंग शिथिल होरहे हैं।
  मुख सूख रहा है। शरीर कांप उठा है। रोंगटे खडे हुए हैं।

30: >-
  गाण्डीव हाथ से फिसल रहा है। शरीर गरम होते जलरहा है। खडेरहना मुशिकलसा दिखता है।
  मन यहाँ कहाँ घूमता रहा है।

31: >-
  हे केशव, बुरी सूचनाएँ ही दिखरहे हैं। युद्ध में अपनों को मारकाटके भलाई कैसे देख सकूँ?
  कभी नहीं।

32: >-
  हे कृष्ण, मै विजय न चाहूँगा। वेसे ही न राज्य चाहूँगा; न भौत सुख। हे गोविंद,
  हत्यासे मिलवेवाला राज्य से क्या प्रयोजन? भोग सुखसे क्या लाभ?

33: >-
  जिन के लिए हम राज्य, भोग- भाग्यों को अभीष्ट मानकर बैठे हैं, वे ही धन और जीवमी
  त्यागने के लिए युद्ध में कूदपडे हैं।

34: >-
  आर्यगण, पित्रृसमान लोग, बच्चे, दादाजन, मामागण, ससुरजीवाले पौत्रगण सा तथा सगे
  संबंधी भी हैं।

35: >-
  हे मधुसूदन, तीन लोक प्राप्त होता है तो भी युद्धोन्मत्त इन लोगो को मै मारना न चाहता हूँ;
  छोटे भूखण्डकेलिए क्यो लडना है?

36: >-
  हे जनार्धन,कौरवों को मारडालनेसे हमें कैसी खुशी मिलेगी? इन आग लगाये हुए, विशप्राशन
  कराये हुए, संपत्ति चुरानेवालों को इन आतताई शत्रुगणों को मारने से पाप ही मिलेगी।

37: >-
  इसलिए हमारे सगे-संबन्धि कौरवो को मारने की योग्यता हम को है ही नहीं। हे माधव हमारे
  ही लोगों को मारकर हम कैसे सुखी बनेंगे?

38: >-
  दुराशा से भरे हुए इनकी बुद्धि बहुत खराब हुई है। इसलिए वंशनाश से उत्पन्न होनेवाली
  बुराई को और मित्रवर्ग को कियाहुवा दोखे से उत्पन्न पापराशि को ये जानते है नहीं।

39: >-
  हे जनार्दन, वंशनाश से उपजनेवाला पाप को पहले ही समझपानेवाले हम को इस बुरे युद्ध
  से पीछे हटने की इच्छा क्यों न बनती?

40: >-
  कुल नाश हुवा तो परंपरा से आया हुवा कुलधर्म भी विनाश के पथ पर चलेगा।
  धर्माचरण शून्य बनते ही अधर्म ही कुल धर्म बनेगा।

41: >-
  वृष्णि वंशवाले हे कृष्ण, अधर्म के प्रभाव से कुल स्त्रियाँ बुरीरास्ता अपनाएंगी।
  औरतें दूषित हुए तो वर्णसंकर बनता है। तब मिश्रसमाज की उपज होती है।

42: >-
  यह अशुद्धता कुल घातक और वंशजों को नरक भुगतने को बाध्य बनता है। एसे लोग
  पिण्डदान और तिलतर्पण से वंचित बनते हैं। इससे उनकी दुर्गति होती है।

43: >-
  वर्णसंकर को जो कारण हैंउनका जनांग गलत संकलीकरण के कारण वंशाधारित आचारण
  और अनुवंशीय वृत्ति दोनो शास्त्र परिधि से फिसलकर बरबाद होंगे।

44: >-
  हे जनार्धन, वंशधर्मों को विधि-विधान से धूटे हुए वंशधर्माचरण पालन करने से लोगों को,
  सुनिश्चित ही, नरक प्राप्त होगा इति सुना है।

45: >-
  हाँ ! राज्य-भोग - -सुख के लालच से अपने ही लोगों की हत्या करनेकेलिए आगे बडनेवाले
  हमें बडिया पाप मिलने में कोई संदेह नहीं।

46: >-
  यदि निहत्या मुझ पर शस्त्रलिए हुये कौरव वारकर मारते तो भी वह मुझे भला ही होगा।

47: >-
  एसे बोलकर व्याकुलित तथा दुखी अर्जुन धनुर्बान को छोडकर रथमध्य में बैट गया।

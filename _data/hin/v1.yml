1: |-
    धर्म-क्षेत्रे कुरु-क्षेत्रे समवेता युयुत्सवः ।
    मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥

2: |-
    दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा ।
    आचार्यमुप सङ्गभ्य राजा वचनमब्रवीत् ॥

3: |-
    पश्शैतां पाण्डु-पुत्राणाम् आचार्य महतीं चमूम् ।
    व्यूढां द्रुपद-पुत्रेण तव शिष्येण धीमता ॥

4: |-
    अत्र शूरा महेष्वासाः भीमार्जुन-समा युधि ।
    युयुधानो विराटश्च द्रुपदश्च महारथः ॥

5: |-
    धृष्टकेतुश्चेकित्तानः काशि-राजश्च वीर्य-वान् ।
    पुरु-जित् कुन्ति-भोजश्च शैब्यश्च नर-पुङ्गवः ॥

6: |-
    युधामन्युश्च विक्रान्तः उत्तमौजाश्च वीर्य-वान् ।
    सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः ॥

7: |-
    अस्माकं तु विशिष्टा ये तान् निबोध द्विजोत्तम ।
    नायका मम सैन्यस्य संज्ञार्थं तान् ब्रवीमि ते ॥

8: |-
    भवान भीष्मश्च कर्णश्च कृपश्च समितिं-जयः ।
    अश्वत्थामा विकर्णश्च सौमदत्तिस्तथैव च ॥

9: |-
    अन्ये च बहवः शूराः मदर्थे त्यक्त-जीविताः ।
    नाना-शस्त्र-प्रहरणाः सर्वे युद्ध-विशारदाः ॥

10: |-
    अपर्याप्तं तदस्माकं बलं भीष्माभि-रक्षितम् ।
    पर्याप्तं त्विदमेतेषां बलं भीमाभि-रक्षितम् ॥

11: |-
    अयनेषु च सर्वेषु यथा-भागमव-स्थिताः ।
    भीष्ममेवाभि रक्षन्तु भवन्तः सर्व एव हि ॥

12: |-
    तस्य सं-जनयन् हर्षं कुरु-वृद्धः पितामहः ।
    सिंह-नादं विनद्योच्चैः शङ्खं दध्मौ प्रताप-वान् ॥

13: |-
    ततः शङ्खाश्च भेर्यश्च पणवानक-गोमुखाः ।
    सहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत् ॥

14: |-
    ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ ।
    माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः ॥

15: |-
    पाञ्चजन्यं हृषीकेशो देव-दत्तं धनं-जयः ।
    पौण्ड्रं दध्मौ महाशङ्खं भीम-कर्मा वृकोदरः ॥

16: |-
    अनन्त-विजयं राजा कुन्ती-पुत्रो युधिष्ठिरः ।
    नकुलः सह-देवश्च सुघोष-मणि-पुष्पकौ ॥

17: |-
    काश्यश्च परमेष्वासः शिखण्डी च महारथः ।
    धृष्ट-द्युम्नो विराटश्च सात्यकिश्चापराजितः ॥

18: |-
    द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवी-पते ।
    सौभद्रश्च महाबाहुः शङ्खान् दध्मुः पृथक्-पृथक् ॥

19: |-
    स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत् ।
    नभश्च पृथिवीं चैव तुमुलो व्यनु-नादयन् ॥

20: |-
    अथ व्यवस्थितान् दृष्ट्वाधार्तराष्ट्रान् कपि-ध्वजः ।
    प्रवृत्ते शस्त्र-सम्पाते धनुरुद्यम्य पाण्डवः ॥

21: |-
    हृषीकेशं तदा वाक्यम् इदमाह मही-पते ।
    सेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत ॥

22: |-
    यावदेतान् निरीक्षेऽहं योद्धु-कामानव-स्थितान् ।
    कैर्मया सह योद्धव्यम् अस्मिन् रण-समुद्यमे ॥

23: |-
    योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः ।
    धार्तराष्ट्रस्य दुर्बुद्धेः युद्धे प्रिय-चिकीर्षवः ॥

24: |-
    एवमुक्तो हृषीकेशो गुडाकेशेन भारत ।
    सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तभम् ॥

25: |-
    भीष्म-द्रोण-प्रमुखतः सर्वेषां च मही-क्षिताम् ।
    उवाच पार्थ पश्शैतान् समवेतान् कुरूनिति ॥

26: |-
    तत्रापश्यत् स्थितन् पार्थः पितॄनथ पितामहान् ।
    आचार्यान् मातुलान् भ्रातॄन्
    पुत्रान् पौत्रान् सखींस्तथा ॥

27: |-
    श्वशुरान् सुहृदश्चैव सेनयोरुभयोरपि ।

27.5: |-
    कृपया परयाऽऽविष्टो विषीदन्निदमब्रवीत् ॥

28: |-
    तान् समीक्ष्य स कौन्तेयः सर्वान् बन्धूनव-स्थितान् ।

28.5: |-
    दृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुप-स्थितम् ॥

29: |-
    सीदन्ति मम गात्राणि मुखं च परि-शुष्यति ।
    वेपथुश्च शरीरे मे रोम-हर्षश्च जायते ॥

30: |-
    गाण्डीवं स्रंसते हस्तात् त्वक् चैव परि-दह्यते ।
    नच शक्नोम्यव-स्थातुं भ्रमतीव च मे मनः ॥

31: |-
    निमित्तानि च पश्यामि विपरीतनि केशव ।
    नच श्रेयोऽनु पश्यामि हत्वा स्व-जनमाहवे ॥

32: |-
    न काङ्क्षे विजयं कृष्ण नच राज्यं सुखानि च ।
    किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा ॥

33: |-
    येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च ।
    त इमेऽव-स्थिता युद्धे प्राणान्स्त्यक्तौव्व धनानि च ॥

34: |-
    आचार्याः पितरः पुत्राः तथैव च पितामहाः ।
    मातुलाः श्वशुराः पौत्राः स्यालाः सम्बन्धिनस्तथा ॥

35: |-
    एतान् न हन्तुमिच्छामि घ्नतोऽपि मधु-सूदन ।
    अपि त्रैलोक्य-राज्यस्य हेतोः किं नु मही-कृते ॥

36: |-
    निहत्य धार्तराष्ट्रान् नः का प्रीतिः स्याज्जनार्दन ।
    पापमेवाऽश्रयेदस्मान् हत्वैतानात्तातयिनः ॥

37: |-
    तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान् स्व-बान्धवान् ।
    स्व-जनं हि कथं हत्वा सुखिनः स्याम माधव ॥

38: |-
    यद्यप्येते न पश्यन्ति लोभोप-हत-चेतसः ।
    कुल-क्षय-कृतं दोषं मित्र-द्रोहे च पातकम् ॥

39: |-
    कथं न ज्ञेयमस्माभिः पापावस्मान्निवर्तितुम् ।
    कुल-क्षय-कृतं दोषं प्र-पश्यद्भिर्जनार्दन ॥

40: |-
    कुल-क्षये प्रणश्यन्ति कुल-धर्माः सनातनाः ।
    धर्मे नष्टे कुलं कृत्स्नम् अधर्मोऽभि-भवत्युत ॥

41: |-
    अधर्माभि-भवात् कृष्ण प्र-दुष्यन्ति कुल-स्त्रियः ।
    स्त्रीषु दुष्टासु वार्ष्णेय जायते वर्ण-सङ्करः ॥

42: |-
    सङ्करो नरकायैव कुल-घ्नानां कुलस्य च ।
    पतन्ति पितरो ह्येषाम् लुप्त-पिण्डोदक-क्रियाः ॥

43: |-
    दोषैरेतैः कुल-घ्नानां वर्ण-सङ्कर-कारकैः ।
    उत्सार्द्यन्ते जाति-धर्माः कुल-धर्माश्च शाश्वताः ॥

44: |-
    उत्सन्न-कुल-धर्माणाम् मनुष्याणां जनार्दन ।
    नरके नियतं वासो भवतीत्यनु शुश्रुम ॥

45: |-
    अहो बत महत् पापं कर्तुं व्यवसिता वयम् ।
    यद्राज्य-सुख-लोभेन हन्तुं स्व-जनमुद्यताः ॥

46: |-
    यदि मामप्रतीकारम् अशस्त्रं शस्त्र-पाणयः ।
    धार्तराष्ट्रा रणे हन्युः तन्मे क्षेम-तरं भवेत् ॥

47: |-
    एवमुक्त्वाऽर्जुनः सङ्ख्ये रथोपस्थ उपाविशत् ।
    विसृज्य स-शरं चापं शोक-संविग्न-मानसः ॥
    
1: |-
    मय्यासक्त-मनाः पार्थ योगं युंजन् मदाश्रयः ।
    असंशयं समग्रं मां यथा ज्ञास्यसि तच्छृणु ॥

2: |-
    ज्ञानं तेऽहं स-विज्ञानं इदं वक्ष्याम्यशेषतः ।
    यजाज्ञत्वा नेह भूयोऽन्यत् ज्ञातव्यमव-शिष्यते ॥

3: |-
    मनुष्याणां सहस्रेषु कश्चिद् यतति सिद्धये ।
    यततामपि सिद्धानां कश्चिन्मां वेत्ति तत्त्वतः ॥

4: |-
    भूमिरापोऽनलो वायुः खं मनो बुद्धिरेव च ।
    अहं-कार इतीयं मे भिन्ना प्रकृतिरष्ट-धा ॥

5: |-
    अपरेयमितस्त्वन्यां प्रकृतिं विद्धि मे पराम् ।
    जीव-भूतां महाबाहो ययेदं धार्यते जगत् ॥

6: |-
    एतद्योनीनि भूतानि सर्वाणीत्युप-धारय ।
    अहं कृत्स्नस्य जगतः प्रभवः प्रळयस्तथा ॥

7: |-
    मत्तः पर-तरं नान्यत् किंचिदस्ति धनं-जय ।
    मयि सर्वमिदं प्रोतं सूत्रे मणि-गणा इव ॥

8: |-
    रसोऽहमप्सु कौंतेय प्रभाऽस्मि शशि-सूर्ययोः ।
    प्रणवः सर्व-वेदेषु शब्दः खे पौरुषं नृषु ॥

9: |-
    पुण्यो गंधः पृथिव्यां च तेजश्चास्मि विभावसौ ।
    जीवनं सर्व-भूतेषु तपश्चास्मि तपस्विषु ॥

10: |-
    बीजं मां सर्व-भूतानां विद्धि पार्थ सनातनम् ।
    बुद्धिर्बुद्धि-मतामस्मि तेजस्तेजस्विनामहम् ॥

11: |-
    बलं बल-वतां चाहं काम-राग-विवर्जितम् ।
    धर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ ॥

12: |-
    ये चैव सात्त्विका भावाः राजसास्तामसाश्च ये ।
    मत्त एवेति तान् विद्धि न त्वहं तेषु ते मयि ॥

13: |-
    त्रिभिर्गुण-मयैर्भावैः एभिः सर्वमिदं जगत् ।
    मोहितं नाभि-जानाति मामेभ्यः परमव्ययम् ॥

14: |-
    दैवी ह्येषा गुण-मयी मम माया दुरत्यया ।
    मामेव ये प्र-पद्यंते मायामेतां तरंति ते ॥

15: |-
    न मां दुष्कृतिनो मूढाः प्र-पद्यंते नराधमाः ।
    माययाऽप-हृत-ज्ञानाः आसुरं भावमाश्रिताः ॥

16: |-
    चतुर्विधा भजंते मां जनाः सु-कृतिनोऽर्जुन ।
    आर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ ॥

17: |-
    तेषां ज्ञानी नित्य-युक्तः एक-भक्तिर्विशिष्यते ।
    प्रियो हि ज्ञानिनोऽत्यर्थं अहं स च मम प्रियः ॥

18: |-
    उदाराः सर्व एवैते ज्ञानी त्वात्मैव मे मतम् ।
    आस्थितः स हि युक्तात्मा मामेवानुत्तमां गतिम् ॥

19: |-
    बहूनां जन्मनामंते ज्ञान-वान् मां प्र-पद्यते ।
    वासु-देवः सर्वमिति स महात्मा सु-दुर्लभः ॥

20: |-
    कामैस्तैस्तैर्हृत-ज्ञानाः प्र-पद्यंतेऽन्य-देवताः ।
    तं-तं नियममास्थाय प्रकृत्या नियताः स्वया ॥

21: |-
    यो-यो यां-यां तनुं भक्तः श्रद्धयाऽर्चितुमिच्छति ।
    तस्य-तस्याचलां श्रद्धां तामेव वि-दधाम्यहम् ॥

22: |-
    स तया श्रद्धया युक्तः तस्याऽराधनमीहते ।
    लभते च ततः कामान् मयैव विहितान् हितान् ॥

23: |-
    अंत-वत्तु फलं तेषां तद् भवत्यल्प-चेतसाम् ।
    देवान् देव-यजो यांति मद्भक्ता यांति मामपि ॥

24: |-
    अव्यक्तं व्यक्तिमापन्नं मन्यंते मामबुद्धयः ।
    परं भावमजानंतो ममाव्ययमनुत्तमम् ॥

25: |-
    नाहं प्रकाशः सर्वस्य योग-माया-समावृतः ।
    मूढोऽयं नाभि-जानाति लोको मामजमव्ययम् ॥

26: |-
    वेदाहं समतीतानि वर्तमानानि चार्जुन ।
    भविष्याणि च भूतानि मां तु वेद न कश्चन ॥

27: |-
    इच्छा-द्वेष-समुत्थेन द्वंद्व-मोहेन भारत ।
    सर्व-भूतानि सम्मोहं सर्गे यांति परं तप ॥

28: |-
    येषां त्वंत-गतं पापं जनानां पुण्य-कर्मणाम् ।
    ते द्वंद्व-मोह-निर्मुक्ताः भजंते मां दृढ-व्रताः ॥

29: |-
    जरा-मरण-मोक्षाय मामाश्रित्य यतंति ये ।
    ते ब्रह्म तद् विदुः कृत्स्नं अध्यात्मं कर्म चाखिलम् ॥

30: |-
    साधि-भूताधि-दैवं मां साधि-यज्ञं च ये विदुः ।
    प्रयाण-कालेऽपि च मां ते विदुर्युक्त-चेतसः ॥

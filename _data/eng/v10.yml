1: ।-
    bhūya eva mahā-bāho śṛṇu me paramaṃ vacaḥ ।
    yat te'haṃ prīyamāṇāya vakṣyāmi hita-kāmyayā ॥

2: ।-
    na me viduḥ sura-gaṇāḥ prabhavaṃ na maharṣayaḥ ।
    ahamādirhi devānāṃ maharṣīṇāṃ ca sarvaśaḥ ॥

3: ।-
    yo māmajamanādiṃ ca vetti loka-maheśvaram ।
    asammūḍhaḥ sa martyeṣu sarva-pāpaiḥ pramucyate ॥

4: ।-
    buddhirjñānamasammohaḥ kṣamā satyaṃ damaḥ śamaḥ ।
    sukhaṃ duḥkhaṃ bhavo'bhāvo bhayaṃ cābhayameva ca ॥

5: ।-
    ahiṃsā samatā tuṣṭiḥ tapo dānaṃ yaśo'yaśaḥ ।
    bhavanti bhāvā bhūtānāṃ matta eva pṛthagvidhāḥ ॥

6: ।-
    maharṣayaḥ sapta pūrve catvāro manavastathā ।
    madbhāvā mānasā jātāḥ yeṣāṃ loka imāḥ prajāḥ ॥

7: ।-
    etāṃ vibhūtiṃ yogaṃ ca mama yo vetti tattvataḥ ।
    so'vi-kampena yogena yujyate nātra saṃśayaḥ ॥

8: ।-
    ahaṃ sarvasya prabhavo mattaḥ sarvaṃ pravartate ।
    iti matvā bhajante māṃ budhā bhāva-samanvitāḥ ॥

9: ।-
    maccittā madgata-prāṇāḥ bodhayantaḥ parasparam ।
    kathayantaśca māṃ nityaṃ tuṣyanti ca ramanti ca ॥

10: ।-
    teṣāṃ satata-yuktānāṃ bhajatāṃ prīti-pūrvakam ।
    dadāmi buddhi-yogaṃ taṃ yena māmupayānti te ॥

11: ।-
    teṣāmevānu-kampārthaṃ ahamajñāna-jaṃ tamaḥ ।
    nāśayāmyātma-bhāvastho jñāna-dīpena bhāsvatā ॥

12: ।-
    paraṃ brahma paraṃ dhāma pavitraṃ paramaṃ bhavān ।
    puruṣaṃ śāśvataṃ divyaṃ ādi-devamajaṃ vibhum ॥

13: ।-
    āhustvāmṛṣayaḥ sarve devarṣirnāradastathā ।
    asito devalo vyāsaḥ svayaṃ caiva bravīṣi me ॥

14: ।-
    sarvametadṛtaṃ manye yanmāṃ vadasi keśava ।
    nahi te bhagavan vyaktiṃ vidurdevā na dānavāḥ ॥

15: ।-
    svayamevātmanā''tmānaṃ vettha tvaṃ puruṣottama ।
    bhūta-bhāvana bhūteśa deva-deva jagatpate ॥

16: ।-
    vaktumarhasyaśeṣeṇa divyā hyātma-vibhūtayaḥ ।
    yābhirvibhūtibhirlokān imāṃstvaṃ vyāpya tiṣṭhasi ॥

17: ।-
    kathaṃ vidyāmahaṃ yogin tvāṃ sadā pari-cintayan ।
    keṣu-keṣu ca bhāveṣu cintyo'si bhagavan mayā ॥

18: ।-
    vistareṇātmano yogaṃ vibhūtiṃ ca janārdana ।
    bhūyaḥ kathaya tṛptirhi śṛṇvato nāsti me'mṛtam ॥

19: ।-
    hanta te kathayiṣyāmi divyā hyātma-vibhūtayaḥ ।
    prādhānyataḥ kuru-śreṣṭha nāstyanto vistarasya me ॥

20: ।-
    ahamātmā guḍākeśa sarva-bhūtāśaya-sthitaḥ ।
    ahamādiśca madhyaṃ ca bhūtānāmanta eva ca ॥

21: ।-
    ādityānāmahaṃ viṣṇuḥ jyotiṣāṃ raviraṃśumān ।
    marīcirmarutāmasmi nakṣatrāṇāmahaṃ śaśī ॥

22: ।-
    vedānāṃ sāma-vedo'smi devānāmasmi vāsavaḥ ।
    indriyāṇāṃ manaścāsmi bhūtānāmasmi cetanā ॥

23: ।-
    rudrāṇāṃ śaṅkaraścāsmi vitteśo yakṣa-rakṣasām ।
    vasūnāṃ pāvakaścāsmi meruḥ śikhariṇāmaham ॥

24: ।-
    purodhasāṃ ca mukhyaṃ māṃ viddhi pārtha bṛhaspatim ।
    senānīnāmahaṃ skandaḥ sarasāmasmi sāgaraḥ ॥

25: ।-
    maharṣīṇāṃ bhṛgurahaṃ girāmasmyaikamakṣaram ।
    yajñānāṃ japa-yajño'smi sthāvarāṇāṃ himālayaḥ ॥

26: ।-
    aśvatthaḥ sarva-vṛkṣāṇāṃ devarṣīṇāṃ ca nāradaḥ ।
    gandharvāṇāṃ citra-rathaḥ siddhānāṃ kapilo muniḥ ॥

27: ।-
    uccaiḥśravasamaśvānāṃ viddhi māmamṛtodbhavam ।
    airāvataṃ gajendrāṇāṃ narāṇāṃ ca narādhipam ॥

28: ।-
    āyudhānāmahaṃ vajraṃ dhenūnāmasmi kāma-dhuk ।
    prajanaścāsmi kandarpaḥ sarpāṇāmasmi vāsukiḥ ॥

29: ।-
    anantaścāsmi nāgānāṃ varuṇo yādasāmaham ।
    pitṝṇāmaryamā cāsmi yamaḥ saṃyamatāmaham ॥

30: ।-
    prahlādaścāsmi daityānāṃ kālaḥ kalayatāmaham ।
    mṛgāṇāṃ ca mṛgendro'haṃ vainateyaśca pakṣiṇām ॥

31: ।-
    pavanaḥ pavatāmasmi rāmaḥ śastra-bhṛtāmaham ।
    jhaṣāṇāṃ makaraścāsmi srotasāmasmi jāhnavī ॥

32: ।-
    sargāṇāmādirantaśca madhyaṃ caivāhamarjuna ।
    adhyātma-vidyā vidyānāṃ vādaḥ pravadatāmaham ॥

33: ।-
    akṣarāṇāmakāro'smi dvandvaḥ sāmāsikasya ca ।
    ahamevākṣayaḥ kālo dhātā'haṃ viśvato-mukhaḥ ॥

34: ।-
    mṛtyuḥ sarva-haraścāhaṃ udbhavaśca bhaviṣyatām ।
    kīrtiḥ śrīrvāk ca nārīṇāṃ smṛtirmedhā dhṛtiḥ kṣamā ॥

35: ।-
    bṛhatsāma tathā sāmnāṃ gāyattrī chandasāmaham ।
    māsānāṃ mārga-śīrṣo'haṃ ṛtūnāṃ kusumākaraḥ ॥

36: ।-
    dyūtaṃ chalayatāmasmi tejastejasvināmaham ।
    jayo'smi vyavasāyo'smi satvaṃ sattva-vatāmaham ॥

37: ।-
    vṛṣṇīnāṃ vāsu-devo'smi pāṇḍavānāṃ dhanaṃ-jayaḥ ।
    munīnāmapyahaṃ vyāsaḥ kavīnāmuśanā kaviḥ ॥

38: ।-
    daṇḍo damayatāmasmi nītirasmi jigīṣatām ।
    maunaṃ caivāsmi guhyānāṃ jñānaṃ jñāna-vatāmaham ॥

39: ।-
    yaccāpi sarva-bhūtānāṃ bījaṃ tadahamarjuna ।
    na tadasti vinā yat syāt mayā bhūtaṃ carācaram ॥

40: ।-
    nānto'sti mama divyānāṃ vibhūtīnāṃ paraṃ tapa ।
    eṣa tūddeśataḥ prokto vibhūtervistaro mayā ॥

41: ।-
    yadyad vibhūti-mat satvaṃ śrī-madūrjitameva vā ।
    tattadevāva-gaccha tvaṃ mama tejo'ṃśa-sambhavam ॥

42: ।-
    athavā bahunaitena kiṃ jñātena tavārjuna ।
    viṣṭabhyāhamidaṃ kṛtsnaṃ ekāṃśena sthito jagat ॥

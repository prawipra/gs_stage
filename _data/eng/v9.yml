1: |-
    idaṃ tu te guhya-tamaṃ pravakṣyāmyanasūyave ।
    jñānaṃ vijñāna-sahitaṃ yajjñātvā mokṣyase'śubhāt ॥

2: |-
    rāja-vidyā rāja-guhyaṃ pavitramidamuttamam ।
    pratyakṣāva-gamaṃ dharmyaṃ susukhaṃ kartumavyayam ॥

3: |-
    aśraddadhānāḥ puruṣāḥ dharmasyāsya paraṃ-tapa ।
    aprāpya māṃ nivartante mṛtyu-saṃsāra-vartmani ॥

4: |-
    mayā tatamidaṃ sarvaṃ jagadavyakta-mūrtinā ।
    matsthāni sarva-bhūtāni nacāhaṃ teṣvavasthitaḥ ॥

5: |-
    na ca matsthāni bhūtāni paśya me yogamaiśvaram ।
    bhūta-bhṛnna ca bhūta-stho mamā'tmā bhūta-bhāvanaḥ ॥

6: |-
    yathā''kāśa-sthito nityaṃ vāyuḥ sarvatra-go mahān ।
    tathā sarvāṇi bhūtāni matsthānītyupa-dhāraya ॥

7: |-
    sarva-bhūtāni kaunteya prakṛtiṃ yānti māmikām ।
    kalpa-kṣaye punastāni kalpādau vi-sṛjāmyaham ॥

8: |-
    prakṛtiṃ svāmavaṣṭabhya vi-sṛjāmi punaḥ-punaḥ ।
    bhūta-grāmamimaṃ kṛtsnaṃ avaśaṃ prakṛtervaśāt ॥

9: |-
    na ca māṃ tāni karmāṇi nibadhnanti dhanaṃ-jaya ।
    udāsīnavadāsīnaṃ asaktaṃ teṣu karmasu ॥

10: |-
    mayā'dhyakṣeṇa prakṛtiḥ sūyate sa-carācaram ।
    hetunā'nena kaunteya jagad vipari-vartate ॥

11: |-
    ava-jānanti māṃ mūḍhā mānuṣīṃ tanumāśritam ।
    paraṃ bhāvamajānanto mama bhūta-maheśvaram ॥

12: |-
    moghāśā mogha-karmāṇo mogha-jñānā vicetasaḥ ।
    rākṣasīmāsurīṃ caiva prakṛtiṃ mohinīṃ śritāḥ ॥

13: |-
    mahātmānastu māṃ pārtha daivīṃ prakṛtimāśritāḥ ।
    bhajantyananya-manaso jñātvā bhūtādimavyayam ॥

14: |-
    satataṃ kīrtayanto māṃ yatantaśca dṛḍha-vratāḥ ।
    namasyantaśca māṃ bhaktyā nitya-yuktā upāsate ॥

15: |-
    jñāna-yajñena cāpyanye yajanto māmupāsate ।
    ekatvena pṛthaktvena bahudhā viśvato-mukham ॥

16: |-
    ahaṃ kraturahaṃ yajñaḥ svadhā'hamahamauṣadham ।
    mantro'hamahamevā'jyaṃ ahamagnirahaṃ hutam ॥

17: |-
    pitā'hamasya jagato mātā dhātā pitāmahaḥ ।
    vedyaṃ pavitramoṅkāraḥ ṛk sāma yajureva ca ॥

18: |-
    gatirbhartā prabhuḥ sākṣī nivāsaḥ śaraṇaṃ suhṛt ।
    prabhavaḥ pral̤ayaḥ sthānaṃ nidhānaṃ bījamavyayam ॥

19: |-
    tapāmyahamahaṃ varṣaṃ nigṛhṇāmyutsṛjāmi ca ।
    amṛtaṃ caiva mṛtyuśca sadasaccāhamarjuna ॥

20: |-
    traividyā māṃ soma-pāḥ pūta-pāpāḥ 
    yajñairiṣṭvāsvargatiṃ prārthayante ।
    te puṇyamāsādhya surendra-lokaṃ 
    aśnanti divyān divi deva-bhogān ॥

21: |-
    te taṃ bhuktvā svarga-lokaṃ viśālaṃ 
    kṣīṇe puṇye martya-lokaṃ viśanti ।
    evaṃ trayī-dharmamanu-prapannāḥ 
    gatāgataṃ kāma-kāmā labhante ॥

22: |-
    ananyāścintayanto māṃ ye janāḥ paryupāsate ।
    teṣāṃ nityābhi-yuktānāṃ yoga-kṣemaṃ vahāmyaham ॥

23: |-
    ye'pyanya-devatā-bhaktāḥ yajante śraddhayā'nvitāḥ ।
    te'pi māmeva kaunteya yajantyavidhi-pūrvakam ॥

24: |-
    ahaṃ hi sarva-yajñānāṃ bhoktā ca prabhureva ca ।
    natu māmabhi-jānanti tattvenātaścyavanti te ॥

25: |-
    yānti deva-vratā devān pitṝn yānti pitṛ-vratāḥ ।
    bhūtejyā yānti bhūtāni yānti madyājino'pi mām ॥

26: |-
    patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyāprayacchati ।
    tadahaṃ bhaktyupa-hṛtaṃ aśnāmi prayatātmanaḥ ॥

27: |-
    yat karoṣi yadaśnāsi yajjuhoṣi dadāsi yat ।
    yattapasyasi kaunteya tat kuruṣva madarpaṇam ॥

28: |-
    śubhāśubha-phalairevaṃ mokṣyase karma-bandhanaiḥ ।
    saṃnyāsa-yoga-yuktātmā vimukto māmupaiṣyasi ॥

29: |-
    samo'haṃ sarva-bhūteṣu na me dveṣyo'sti na priyaḥ ।
    ye bhajanti tu māṃ bhaktyā mayi te teṣu cāpyaham ॥

30: |-
    api cet su-durācāro bhajate māmananya-bhāk ।
    sādhureva sa mantavyaḥ samyag vyavasito hi saḥ ॥

31: |-
    kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati ।
    kaunteya prati-jānīhi na me bhaktaḥ praṇaśyati ॥

32: |-
    māṃ hi pārtha vyapāśritya ye'pi syuḥ pāpa-yonayaḥ ।
    striyo vaiśyāstathā śūdrāḥ te'pi yānti parāṃ gatim ॥

33: |-
    kiṃ punarbrāhmaṇāḥ puṇyāḥ bhaktā rājarṣayastathā ।
    anityamasukhaṃ lokaṃ imaṃ prāpya bhajasva mām ॥

34: |-
    manmanā bhava madbhakto madyājī māṃ namaskuru ।
    māmevaiṣyasi yuktvaivaṃ ātmānaṃ matparāyaṇaḥ ॥

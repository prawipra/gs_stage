1: ।-
    paraṃ bhūyaḥ pravakṣyāmi jñānānāṃ jñānamuttamam ।
    yajjñātvā munayaḥ sarve parāṃ siddhimito gatāḥ ॥

2: ।-
    idaṃ jñānamupāśritya mama sādharmyamāgatāḥ ।
    sarge'pi nopa-jāyante pral̤aye na vyathanti ca ॥

3: ।-
    mama yonirmahad-brahma tasmin garbhaṃ dadhāmyaham ।
    sambhavaḥ sarva-bhūtānāṃ tato bhavati bhārata ॥

4: ।-
    sarva-yoniṣu kaunteya mūrtayaḥ sambhavanti yāḥ ।
    tāsāṃ brahma mahadyoniḥ ahaṃ bīja-pradaḥ pitā ॥

5: ।-
    satvaṃ rajastama iti guṇāḥ prakṛti-sambhavāḥ ।
    nibadhnanti mahā-bāho dehe dehinamavyayam ॥

6: ।-
    tatra satvaṃ nirmalatvāt prakāśakamanāmayam ।
    sukha-saṅgena badhnāti jñāna-saṅgena cānagha ॥

7: ।-
    rajo rāgātmakaṃ viddhi tṛṣṇā-saṅga-samudbhavam ।
    tannibadhnāti kaunteya karma-saṅgena dehinam ॥

8: ।-
    tamastvajñāna-jaṃ viddhi mohanaṃ sarva-dehinām ।
    pramādālasya-nidrābhiḥ tannibadhnāti bhārata ॥

9: ।-
    satvaṃ sukhe sañjayati rajaḥ karmaṇi bhārata ।
    jñānamāvṛtya tu tamaḥ pramāde sañjayatyuta ॥

10: ।-
    rajastamaścābhi-bhūya satvaṃ bhavati bhārata ।
    rajaḥ satvaṃ tamaścaiva tamaḥ satvaṃ rajastathā ॥

11: ।-
    sarva-dvāreṣu dehe'smin prakāśa upa-jāyate ।
    jñānaṃ yadā tadā vidyāt vivṛddhaṃ satvamityuta ॥

12: ।-
    lobhaḥ pravṛttirārambhaḥ karmaṇāmaśamaḥ spṛhā ।
    rajasyetāni jāyante vivṛddhe bharatarṣabha ॥

13: ।-
    aprakāśo'pravṛttiśca pramādo moha eva ca ।
    tamasyetāni jāyante vivṛddhe kuru-nandana ॥

14: ।-
    yadā satve pravṛddhe tu pral̤ayaṃ yāti deha-bhṛt ।
    tadottama-vidāṃ lokān amalān pratipadyate ॥

15: ।-
    rajasi pral̤ayaṃ gatvā karma-saṅgiṣu jāyate ।
    tathā pralīnastamasi mūḍha-yoniṣu jāyate ॥

16: ।-
    karmaṇaḥ sukṛtasyāhuḥ sātvikaṃ nirmalaṃ phalam ।
    rajasastu phalaṃ duḥkhaṃ ajñānaṃ tamasaḥ phalam ॥

17: ।-
    satvāt sañjāyate jñānaṃ rajaso lobha eva ca ।
    pramāda-mohau tamaso bhavato'jñānameva ca ॥

18: ।-
    ūrdhvaṃ gacchanti satva-sthāḥ madhye tiṣṭhanti rājasāḥ ।
    jaghanya-guṇa-vṛtti-sthāḥ adho gacchanti tāmasāḥ ॥

19: ।-
    nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭā'nu-paśyati ।
    guṇebhyaśca paraṃ vetti madbhāvaṃ so'dhigacchati ॥

20: ।-
    guṇānetānatītya trīn dehī deha-samudbhavān ।
    janma-mṛtyu-jarā-duḥkhaiḥ vimukto'mṛtamaśnute ॥

21: ।-
    kairliṅgaistrīn guṇānetān atīto bhavati prabho ।
    kimācāraḥ kathaṃ caitān trīn guṇānati-vartate ॥

22: ।-
    prakāśaṃ ca pravṛttiṃ ca mohameva ca pāṇḍava ।
    na dveṣṭi sampravṛttāni na nivṛttāni kāṅkṣati ॥

23: ।-
    udāsīnavadāsīno guṇairyo na vicālyate ।
    guṇā vartanta ityeva yo'va-tiṣṭhati neṅgate ॥

24: ।-
    sama-duḥkha-sukhaḥ svasthaḥ sama-loṣṭāśma-kāñcanaḥ ।
    tulya-priyāpriyo dhīraḥ tulya-nindātma-saṃstutiḥ ॥

25: ।-
    mānāpa-mānayostulyaḥ tulyo mitrāri-pakṣayoḥ ।
    sarvārambha-parityāgī guṇātītaḥ sa ucyate ॥

26: ।-
    māṃ ca yo'vyabhicāreṇa bhakti-yogena sevate ।
    sa guṇān samatītyaitān brahma-bhūyāya kalpate ॥

27: ।-
    brahmaṇo hi pratiṣṭhā'haṃ amṛtasyāvyayasya ca ।
    śāśvatasya ca dharmasya sukhasyaikāntikasya ca ॥

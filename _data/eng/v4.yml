1: |-
    imaṃ vivasvate yogaṃ proktavānahamavyayam ।
    vivasvān manave prāha manurikṣvākave'bravīt ॥

2: |-
    evaṃ paramparā-prāptaṃ imaṃ rājarṣayo viduḥ ।
    sa kāleneha mahatā yogo naṣṭaḥ paraṃ-tapa ॥

3: |-
    sa evāyaṃ mayā te'dya yogaḥ proktaḥ purātanaḥ ।
    bhakto'si me sakhā ceti rahasyaṃ hyetaduttamam ॥

4: |-
    aparaṃ bhavato janma paraṃ janma vivasvataḥ ।
    kathametad vi-jānīyāṃ tvamādau proktavāniti ॥

5: |-
    bahūni me vyatītāni janmāni tava cārjuna ।
    tānyahaṃ veda sarvāṇi na tvaṃ vettha paraṃ tapa ॥

6: |-
    ajo'pi sannavyayātmā bhūtānāmīśvaro'pi san ।
    prakṛtiṃ svāmadhiṣṭhāya saṃ-bhavāmyātma-māyayā ॥

7: |-
    yadā yadā hi dharmasya glānirbhavati bhārata ।
    abhyutthānamadharmasya tadā''tmānaṃ sṛjāmyaham ॥

8: |-
    pari-trāṇāya sādhūnāṃ vi-nāśāya ca duṣkṛtām ।
    dharma-saṃ-sthāpanārthāya saṃ-bhavāmi yuge-yuge ॥

9: |-
    janma karma ca me divyaṃ evaṃ yo vetti tatvataḥ ।
    tyaktvā dehaṃ punarjanma naiti māmeti so'rjuna ॥

10: |-
    vīta-rāga-bhaya-krodhāḥ manmayā māmupāśritāḥ ।
    bahavo jñāna-tapasā pūtā madbhāvamāgatāḥ ॥

11: |-
    ye yathā māṃ prapadyante tāṃstathaiva bhajāmyaham ।
    mama vartmānu-vartante manuṣyāḥ pārtha sarvaśaḥ ॥

12: |-
    kāṅkṣantaḥ karmaṇāṃ siddhiṃ yajanta iha devatāḥ ।
    kṣipraṃ hi mānuṣe loke siddhirbhavati karma-jā ॥

13: |-
    cāturvarṇyaṃ mayā sṛṣṭaṃ guṇa-karma-vibhāgaśaḥ ।
    tasya kartāramapi māṃ viddhyakartāramavyayam ॥

14: |-
    na māṃ karmāṇi limpanti na me karma-phale spṛhā ।
    iti māṃ yo'bhi-jānāti karmabhirna sa badhyate ॥

15: |-
    evaṃ jñātvā kṛtaṃ karma pūrvairapi mumukṣubhiḥ ।
    kuru karmaiva tasmāt tvaṃ pūrvaiḥ pūrva-taraṃ kṛtam ॥

16: |-
    kiṃ karma kimakarmeti kavayo'pyatra mohitāḥ ।
    tat te karma pravakṣyāmi yajñatvā mokṣyase'śubhāt ॥

17: |-
    karmaṇo hyapi boddhavyaṃ boddhavyaṃ ca vi-karmaṇaḥ ।
    akarmaṇaśca boddhavyaṃ gahanā karmaṇo gatiḥ ॥

18: |-
    karmaṇyakarma yaḥ paśyet akarmaṇi ca karma yaḥ ।
    sa buddhi-mān manuṣyeṣu sa yuktaḥ kṛtsna-karma-kṛt ॥

19: |-
    yasya sarve samārambhāḥ kāma-saṅkalpa-varjitāḥ ।
    jñānāgni-dagdha-karmāṇaṃ tamāhuḥ paṇḍitaṃ budhāḥ ॥

20: |-
    tyaktvā karma-phalāsaṅgaṃ nitya-tṛpto nirāśrayaḥ ।
    karmaṇyabhi-pravṛtto'pi naiva kiñcit karoti saḥ ॥

21: |-
    nirāśīryata-cittātmā tyakta-sarva-parigrahaḥ ।
    śārīraṃ kevalaṃ karma kurvan nā'pnoti kilbiṣam ॥

22: |-
    yadṛcchā-lābha-santuṣṭo dvandvātīto vi-matsaraḥ ।
    samaḥ siddhāvasiddhau ca kṛtvā'pi na ni-baddhyate ॥

23: |-
    gata-saṅgasya muktasya jñānāvasthita-cetasaḥ ।
    yajñāyā'carataḥ karma samagraṃ pravi-līyate ॥

24: |-
    brahmārpaṇaṃ brahma-haviḥ brahmāgnau brahmaṇā hutam ।
    brahmĕaiva tena gantavyaṃ brahma-karma-samādhinā ॥

25: |-
    daivamevāpare yajñaṃ yoginaḥ paryupāsate ।
    brahmāgnāvapare yajñaṃ yajñenaivopa-juhvati ॥

26: |-
    śrotrādīnīndriyāṇyanye saṃ-yamāgniṣu juhvati ।
    śabdādīn viṣayānanye indriyāgniṣu juhvati ॥

27: |-
    sarvāṇīndriya-karmāṇi prāṇa-karmāṇi cāpare ।
    ātma-saṃyama-yogāgnau juhvati jñāna-dīpite ॥

28: |-
    dravya-yajñāstapo-yajñāḥ yoga-yajñāstathā pare ।
    svādhyāya-jñāna-yajñāśca yatayaḥ saṃśita-vratāḥ ॥

29: |-
    apāne juhvati prāṇaṃ prāṇe'pānaṃ tathā pare ।
    prāṇāpāna-gatī ruddhvā prāṇāyāma-parāyaṇāḥ ॥

30: |-
    apare niyatāhārāḥ prāṇān prāṇeṣu juhvati ।
    sarve'pyete yajña-vido yajña-kṣapita-kalmaṣāḥ ॥

31: |-
    yajña-śiṣṭāmṛta-bhujo yānti brahma sanātanam ।
    nāyaṃ loko'styayajñasya kuto'nyaḥ kuru-sattama ॥

32: |-
    evaṃ bahu-vidhā yajñāḥ vitatā brahmaṇo mukhe ।
    karma-jān viddhi tān sarvān evaṃ jñātvā vimokṣyase ॥

33: |-
    śreyān dravya-mayād yajñāt jñāna-yajñaḥ paraṃ-tapa ।
    sarvaṃ karmākhilaṃ pārtha jñāne pari-samāpyate ॥

34: |-
    tad viddhi praṇipātena pari-praśnena sevayā ।
    upadekṣyanti te jñānaṃ jñāninastattva-darśinaḥ ॥

35: |-
    yajjñātvā na punarmohaṃ evaṃ yāsyasi pāṇḍava ।
    yena bhūtānyaśeṣeṇa drakṣyasyātmanyatho mayi ॥

36: |-
    api cedasi pāpebhyaḥ sarvebhyaḥ pāpa-kṛttamaḥ ।
    sarvaṃ jñāna-plavenaiva vṛjinaṃ saṃ-tariṣyasi ॥

37: |-
    yathaidhāṃsi samiddho'gniḥ bhasmasāt kurute'rjuna ।
    jñānāgniḥ sarva-karmāṇi bhasmasāt kurute tathā ॥

38: |-
    na hi jñānena sadṛśaṃ pavitramiha vidyate ।
    tat svayaṃ yoga-saṃsiddhaḥ kālenā'tmani vindati ॥

39: |-
    śraddhā-vān labhate jñānaṃ matparaḥ saṃ-yatendriyaḥ ।
    jñānaṃ labdhvā parāṃ śāntiṃ acireṇādhi-gacchati ॥

40: |-
    ajñaścāśraddadhānaśca saṃśayātmā vi-naśyati ।
    nāyaṃ loko'sti na paro na sukhaṃ saṃśayātmanaḥ ॥

41: |-
    yoga-saṃnyasta-karmāṇaṃ jñāna-sañchinna-saṃśayam ।
    ātma-vantaṃ na karmāṇi ni-badhnanti dhanaṃ-jaya ॥

42: |-
    tasmādajñāna-sambhūtaṃ hṛt-sthaṃ jñānāsinā''tmanaḥ ।
    chitvainaṃ saṃśayaṃ yogaṃ ātiṣṭhottiṣṭha bhārata ॥

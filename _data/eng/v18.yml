1: |-
    saṃnyāsasya mahābāho tatvamicchāmi veditum ।
    tyāgasya ca hṛṣīkeśa pṛthak keśi-niṣūdana ॥

2: |-
    kāmyānāṃ karmaṇāṃ nyāsaṃ saṃnyāsaṃ kavayo viduḥ ।
    sarva-karma-phala-tyāgaṃ prāhustyāgaṃ vicakṣaṇāḥ ॥

3: |-
    tyājyaṃ doṣa-vadityeke karma prāhurmanīṣiṇaḥ ।
    yajña-dāna-tapaḥ-karma na tyājyamiti cāpare ॥

4: |-
    niśścayaṃ śṛṇu me tatra tyāge bharata-sattama ।
    tyāgo hi puruṣa-vyāghra tri-vidhaḥ sampra-kīrtitaḥ ॥

5: |-
    yajña-dāna-tapaḥ-karma na tyājyaṃ kāryameva tat ।
    yajño dānaṃ tapaścaiva pāvanāni manīṣiṇām ॥

6: |-
    etānyapi tu karmāṇi saṅgaṃ tyaktvā phalāni ca ।
    kartavyānīti me pārtha niścitaṃ matamuttamam ॥

7: |-
    niyatasya tu saṃnyāsaḥ karmaṇo nopa-padyate ।
    mohāt tasya parityāgaḥ tāmasaḥ pari-kīrtitaḥ ॥

8: |-
    duḥkhamityeva yat karma kāya-kleśa-bhayāt tyajet ।
    sa kṛtvā rājasaṃ tyāgaṃ naiva tyāga-phalaṃ labhet ॥

9: |-
    kāryamityeva yat karma niyataṃ kriyate'rjuna ।
    saṅgaṃ tyaktvā phalaṃ caiva sa tyāgaḥ sāttviko mataḥ ॥

10: |-
    na dveṣṭyakuśalaṃ karma kuśale nānu-ṣajjate ।
    tyāgī sattva-samāviṣṭo medhāvī chinna-saṃśayaḥ ॥

11: |-
    na hi deha-bhṛtā śakyaṃ tyaktuṃ karmāṇyaśeṣataḥ ।
    yastu karma-phala-tyāgī sa tyāgītyabhi-dhīyate ॥

12: |-
    aniṣṭamiṣṭaṃ miśraṃ ca tri-vidhaṃ karmaṇaḥ phalam ।
    bhavatyatyāgināṃ pretya na tu saṃnyāsināṃ kvacit ॥

13: |-
    pañcaitāni mahā-bāho kāraṇāni nibodha me ।
    sāṅkhye kṛtānte proktāni siddhaye sarva-karmaṇām ॥

14: |-
    adhiṣṭhānaṃ tathā kartā karaṇaṃ ca pṛthagvidham ।
    vividhāśca pṛthak ceṣṭā daivaṃ caivātra pañcamam ॥

15: |-
    śarīra-vāṅmanobhiryat karma prārabhate naraḥ ।
    nyāyyaṃ vā viparītaṃ vā pañcaite tasya hetavaḥ ॥

16: |-
    tatraivaṃ sati kartāraṃ ātmānaṃ kevalaṃ tu yaḥ ।
    paśyatyakṛta-buddhitvāt na sa paśyati durmatiḥ ॥

17: |-
    yasya nāhaṃ-kṛto bhāvo buddhiryasya na lipyate ।
    hatvā'pi sa imān lokān na hanti na nibadhyate ॥

18: |-
    jñānaṃ jñeyaṃ pari-jñātā tri-vidhā karma-codanā ।
    karaṇaṃ karma karteti tri-vidhaḥ karma-saṅgrahaḥ ॥

19: |-
    jñānaṃ karma ca kartā ca tri-dhaiva guṇa-bhedataḥ ।
    procyate guṇa-saṅkhyāne yathāvacchṛṇu tānyapi ॥

20: |-
    sarva-bhūteṣu yenaikaṃ bhāvamavyayamīkṣate ।
    avibhaktaṃ vibhakteṣu tajjñānaṃ viddhi sāttvikam ॥

21: |-
    pṛthaktvena tu yajjñānaṃ nānā-bhāvān pṛthagvidhān ।
    vetti sarveṣu bhūteṣu tajjñānaṃ viddhi rājasam ॥

22: |-
    yat tu kṛtsna-vadekasmin kārye saktamahaitukam ।
    atatvārtha-vadalpaṃ ca tat tāmasamudāhṛtam ॥

23: |-
    niyataṃ saṅga-rahitaṃ arāga-dveṣataḥ kṛtam ।
    aphala-prepsunā karma yat tat sāttvikamucyate ॥

24: |-
    yat tu kāmepsunā karma sāhaṃ-kāreṇa vā punaḥ ।
    kriyate bahulāyāsaṃ tad rājasamudāhṛtam ॥

25: |-
    anubandhaṃ kṣayaṃ hiṃsāṃ anapekṣya ca pauruṣam ।
    mohādārabhyate karma yat tat tāmasamucyate ॥

26: |-
    mukta-saṅgo'nahaṃ-vādī dhṛtyutsāha-samanvitaḥ ।
    siddhyasiddhyornirvikāraḥ kartā sāttvika ucyate ॥

27: |-
    rāgī karma-phala-prepsuḥ lubdho hiṃsātmako'śuciḥ ।
    harṣa-śokānvitaḥ kartā rājasaḥ parikīrtitaḥ ॥

28: |-
    ayuktaḥ prākṛtaḥ stabdhaḥ śaṭho naikṛtiko'lasaḥ ।
    viṣādī dīrgha-sūtrī ca kartā tāmasa ucyate ॥

29: |-
    buddherbhedaṃ dhṛteścaiva guṇatastri-vidhaṃ śṛṇu ।
    procyamānamaśeṣeṇa pṛthaktvena dhanaṃ-jaya ॥

30: |-
    pravṛttiṃ ca nivṛttiṃ ca kāryākārye bhayābhaye ।
    bandhaṃ mokṣaṃ ca yā vetti buddhiḥ sā pārtha sāttvikī ॥

31: |-
    yayā dharmamadharmaṃ ca kāryaṃ cākāryameva ca ।
    ayathā-vat prajānāti buddhiḥ sā pārtha rājasī ॥

32: |-
    adharmaṃ dharmamiti yā manyate tamasā''vṛtā ।
    sarvārthān viparītāṃśca buddhiḥ sā pārtha tāmasī ॥

33: |-
    dhṛtyā yayā dhārayate manaḥ-prāṇendriya-kriyāḥ ।
    yogenāvyabhi-cāriṇyā dhṛtiḥ sā pārtha sāttvikī ॥

34: |-
    yayā tu dharma-kāmārthān dhṛtyā dhārayate'rjuna ।
    prasaṅgena phalākāṅkṣī dhṛtiḥ sā pārtha rājasī ॥

35: |-
    yayā svapnaṃ bhayaṃ śokaṃ viṣādaṃ madameva ca ।
    na vimuñcati durmedhā dhṛtiḥ sā pārtha tāmasī ॥

36: |-
    sukhaṃ tvidānīṃ tri-vidhaṃ śṛṇu me bharatarṣabha ।
    abhyāsād ramate yatra duḥkhāntaṃ ca nigacchati ॥

37: |-
    yat tadagre viṣamiva pariṇāme'mṛtopamam ।
    tat sukhaṃ sātvikaṃ proktaṃ ātma-buddhi-prasāda-jam ॥

38: |-
    viṣayendriya-saṃyogāt yat tadagre'mṛtopamam ।
    pariṇāme viṣamiva tat sukhaṃ rājasaṃ smṛtam ॥

39: |-
    yadagre cānubandhe ca sukhaṃ mohanamātmanaḥ ।
    nidrālasya-pramādotthaṃ tat tāmasamudāhṛtam ॥

40: |-
    na tadasti pṛthivyāṃ vā divi deveṣu vā punaḥ ।
    satvaṃ prakṛti-jairmuktaṃ yadebhiḥ syāt tribhirguṇaiḥ ॥

41: |-
    brāhmaṇa-kṣatriya-viśāṃ śūdrāṇāṃ ca paraṃ-tapa ।
    karmāṇi pravi-bhaktāni sva-bhāva-prabhavairguṇaiḥ ॥

42: |-
    śamo damastapaḥ śaucaṃ kṣāntirārjavameva ca ।
    jñānaṃ vijñānamāstikyaṃ brahma-karma sva-bhāva-jam ॥

43: |-
    śauryaṃ tejo dhṛtirdākṣyaṃ yuddhe cāpyapalāyanam ।
    dānamīśvara-bhāvaśca kṣātraṃ karma sva-bhāva-jam ॥

44: |-
    kṛṣi-go-rakṣa-vāṇijyaṃ vaiśya-karma sva-bhāva-jam ।
    paricaryātmakaṃ karma śūdrasyāpi sva-bhāva-jam ॥

45: |-
    sve sve karmaṇyabhi-rataḥ saṃsiddhiṃ labhate naraḥ ।
    sva-karma-nirataḥ siddhiṃ yathā vindati tacchṛṇu ॥

46: |-
    yataḥ pravṛttirbhūtānāṃ yena sarvamidaṃ tatam ।
    sva-karmaṇā tamabhyarcya siddhiṃ vindati mānavaḥ ॥

47: |-
    śreyān sva-dharmo viguṇaḥ para-dharmāt svanuṣṭhitāt ।
    sva-bhāva-niyataṃ karma kurvan nā'pnoti kilbiṣam ॥

48: |-
    saha-jaṃ karma kaunteya sa-doṣamapi na tyajet ।
    sarvārambhā hi doṣeṇa dhūmenāgnirivā'mṛtāḥ ॥

49: |-
    asakta-buddhiḥ sarvatra jitātmā vigata-spṛhaḥ ।
    naiṣkarmya-siddhiṃ paramāṃ saṃnyāsenādhigacchati ॥

50: |-
    siddhiṃ prāpto yathā brahma tathā''pnoti nibodha me ।
    samāsenaiva kaunteya niṣṭhā jñānasya yā parā ॥

51: |-
    buddhyāviśuddhayā yukto dhṛtyā''tmānaṃ niyamya ca ।
    śabdādīn viṣayāṃstyaktvā rāga-dveṣau vyudasya ca ॥

52: |-
    vivikta-sevī laghvāśī yata-vākkāya-mānasaḥ ।
    dhyāna-yoga-paro nityaṃ vairāgyaṃ samupāśritaḥ ॥

53: |-
    ahaṃ-kāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ parigraham ।
    vimucya nirmamaḥ śānto brahma-bhūyāya kalpate ॥

54: |-
    brahma-bhūtaḥ prasannātmā na śocati na kāṅkṣati ।
    samaḥ sarveṣu bhūteṣu madbhaktiṃ labhate parām ॥

55: |-
    bhaktyā māmabhi-jānāti yāvān yaścāsmi tattvataḥ ।
    tato māṃ tattvato jñātvā viśate tadanantaram ॥

56: |-
    sarva-karmāṇyapi sadā kurvāṇo madvyapāśrayaḥ ।
    matprasādādavāpnoti śāśvataṃ padamavyayam ॥

57: |-
    cetasā sarva-karmāṇi mayi saṃnyasya matparaḥ ।
    buddhi-yogamupāśritya maccittaḥ satataṃ bhava ॥

58: |-
    maccittaḥ sarva-durgāṇi matprasādāt tariṣyasi ।
    atha cet tvamahaṃ-kārāt na śroṣyasi vinaṅkṣyasi ॥

59: |-
    yadahaṃ-kāramāśritya na yotsya iti manyase ।
    mithyaiṣa vyavasāyaste prakṛtistvāṃ niyokṣyati ॥

60: |-
    sva-bhāva-jena kaunteya nibaddhaḥ svena karmaṇā ।
    kartuṃ necchasi yanmohāt kariṣyasyavaśo'pi tat ॥

61: |-
    īśvaraḥ sarva-bhūtānāṃ hṛddeśe'rjuna tiṣṭhati ।
    bhrāmayan sarva-bhūtāni yantrārūḍhāni māyayā ॥

62: |-
    tameva śaraṇaṃ gaccha sarva-bhāvena bhārata ।
    tat-prasādāt parāṃ śāntiṃ sthānaṃ prāpsyasi śāśvatam ॥

63: |-
    iti te jñānamākhyātaṃ guhyād guhya-taraṃ mayā ।
    vimṛśśaitadaśeṣeṇa yathecchasi tathā kuru ॥

64: |-
    sarva-guhya-tamaṃ bhūyaḥ śṛṇu me paramaṃ vacaḥ ।
    iṣṭo'si me dṛḍhamiti tato vakṣyāmi te hitam ॥

65: |-
    manmanā bhava madbhakto madyājī māṃ namaskuru ।
    māmevaiṣyasi satyaṃ te pratijāne priyo'si me ॥

66: |-
    sarva-dharmān parityajya māmekaṃ śaraṇaṃ vraja ।
    ahaṃ tvā sarva-pāpebhyo mokṣayiṣyāmi mā śucaḥ ॥

67: |-
    idaṃ te nātapaskāya nābhaktāya kadācana ।
    na cāśuśrūṣave vācyaṃ na ca māṃ yo'bhyasūyati ॥

68: |-
    ya imaṃ paramaṃ guhyaṃ mad-bhakteṣvabhi-dhāsyati ।
    bhaktiṃ mayi parāṃ kṛtvā māmevaiṣyatyasaṃśayaḥ ॥

69: |-
    na ca tasmānmanuṣyeṣu kaścinme priya-kṛttamaḥ ।
    bhavitā na ca me tasmāt anyaḥ priya-taro bhuvi ॥

70: |-
    adhyeṣyate ca ya imaṃ dharmyaṃ saṃvādamāvayoḥ ।
    jñāna-yajñena tenāhaṃ iṣṭaḥ syāmiti me matiḥ ॥

71: |-
    śrraddhā-vānanasūyaśca śṛṇuyādapi yo naraḥ ।
    so'pi muktaḥ śubhān lokān prāpnuyātpuṇya-karmaṇām ॥

72: |-
    kaccidetacchrutaṃ pārtha tvayaikāgreṇa cetasā ।
    kaccidajñāna-saṃmohaḥ pranaṣṭaste dhanaṃ-jaya ॥

73: |-
    naṣṭo mohaḥ smṛtirlabdhā tvat-prasādānmayā'cyuta ।
    sthito'smi gata-sandehaḥ kariṣye vacanaṃ tava ॥

74: |-
    ityahaṃ vāsu-devasya pārthasya ca mahātmanaḥ ।
    saṃvādamimamaśrauṣaṃ adbhutaṃ roma-harṣaṇam ॥

75: |-
    vyāsa-prasādācchrutavān etad guhyamahaṃ param ।
    yogaṃ yogeśvarāt kṛṣṇāt sākṣāt kathayataḥ svayam ॥

76: |-
    rājan saṃsmṛtya-saṃsmṛtya saṃvādamimamadbhutam ।
    keśavārjunayoḥ puṇyaṃ hṛṣyāmi ca muhurmuhuḥ ॥

77: |-
    tacca saṃsmṛtya-saṃsmṛtya rūpamatyadbhutaṃ hareḥ ।
    vismayo me mahān rājan hṛṣyāmi ca punaḥ-punaḥ ॥

78: |-
    yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ ।
    tatra śrīrvijayo bhūtiḥ dhruvā nītirmatirmama ॥

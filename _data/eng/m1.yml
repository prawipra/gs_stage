1: >-
    Dhrutarashtra queries Sanjaya: My sons and those of [my] younger brother Pandu assembled
    in the hallowed grounds of Kurukshetra, eager for battle. What did they do?

2: >-
    Sanjaya replies: Upon seeing the Pandava army prepared to battle, King Duryodhana approached
    Dronacharya and said the following.

3: >-
    O Teacher, look at this large Pandava army. King Drupada's son Dhrushtadyumna, your student,
    has wisely readied this army. See.

6: >-
    All in this army are skilled chariot fighters; fearless, heroic, and mighty warriors;
    accomplished archers; and equal Bhima and Arjuna in battle. Yuyudhana (Satyaki), Virata,
    Drupada, Shishupala's son Dhrushtaketu, Yadu clan's Chekitana, Bhima's father-in-law Kashiraja, 
    Kuntibhoja and his son Purujit, Kekayas' father Shaibya, Panchala sons Yudhamanyu and Uttamojas,
    Subhadra's son Abhimanyu; and Draupadi's five sons Prativindhya, Sutasoma, Shrutakeerti,
    Shataaneeka, Shrutakriya.

7: >-
    O Teacher, I mention also the outstanding among us. These are leaders in my army. I say this to
    jog your memory.

8: >-
    Yourself, Bhishma, Karna, war-winning Kripa; Ashwatthama, Vikarna (Duryodhana's younger brother),
    Somadatta's son Bhoorishravas.

9: >-
    There are many other brave warriors ready to give their life for me. They all can fight with
    varieties of weapons, skilled in battle.

10: >-
    That army, ours, under Bhishma's protection is insufficient. This army, theirs, under Bhima's
    protection is sufficient.

11: >-
    In all parts of the fight, staying in your designated places, you all should protect Bhishma
    without fail.

12: >-
    To please Duryodhana, gradfather Bhishma, an elder in the Kuru clan, roared loudly like a lion
    and blew a conch causing agony in the enemy.

13: >-
    Conchs, war drums, hand drums, barrel drums, and bugles were all sounded all at once immediately
    after, which caused tumult.

14: >-
    Thereafter, Krishna and Arjuna, who were in a large chariot drawn by four white horses, blew the
    finest conchs.

15: >-
    Krishna blew the conch named Paanchajanya, a conch he had obtained by himself killing a demon named
    Panchajana who was in a sea. Arjuna blew Devadatta, a conch Indra had given him in Heaven. Bhimasena,
    who instills fear in evil people and gives precepts to good people, blew the large conch called
    Poundra.

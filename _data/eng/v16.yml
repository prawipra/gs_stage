1: |-
    abhayaṃ sattva-saṃśuddhiḥ jñāna-yoga-vyavasthitiḥ ।
    dānaṃ damaśca yajñaśca svādhyāyastapa ārjavam ॥

2: |-
    ahiṃsā satyamakrodhaḥ tyāgaḥ śāntirapaiśunam ।
    dayā bhūteṣvalolutvaṃ mārdavaṃ hrīracāpalam ॥

3: |-
    tejaḥ kṣamā dhṛtiḥ śaucaṃ adroho nāti-mānitā ।
    bhavanti sampadaṃ daivīṃ abhi-jātasya bhārata ॥

4: |-
    ḍambho darpo'bhi-mānaśca krodhaḥ pāruṣyameva ca ।
    ajñānaṃ cābhi-jātasya pārtha sampadamāsurīm ॥

5: |-
    daivī sampad vimokṣāya nibandhāyā'surī matā ।
    mā śucaḥ sampadaṃ daivīṃ abhi-jāto'si pāṇḍava ॥

6: |-
    dvau bhūta-sargau loke'smin daiva āsura eva ca ।
    daivo vistaraśaḥ proktaḥ āsuraṃ pārtha me śṛṇu ॥

7: |-
    pravṛttiṃ ca nivṛttiṃ ca janā na vidurāsurāḥ ।
    na śaucaṃ nāpi cā'cāro na satyaṃ teṣu vidyate ॥

8: |-
    asatyamapratiṣṭhaṃ te jagadāhuranīśvaram ।
    aparaspara-sambhūtaṃ kimanyat kāma-haitukam ॥

9: |-
    etāṃ dṛṣṭimavaṣṭabhya naṣṭātmāno'lpa-buddhayaḥ ।
    prabhavantyugra-karmāṇaḥ kṣayāya jagato'hitāḥ ॥

10: |-
    kāmamāśritya duṣpūraṃ ḍambha-māna-madānvitāḥ ।
    mohād gṛhītvā'sad-grāhān pravartante'śuci-vratāḥ ॥

11: |-
    cintāmapari-meyāṃ ca pral̤ayāntāmupāśritāḥ ।
    kāmopa-bhoga-paramāḥ etāvaditi niścitāḥ ॥

12: |-
    āśā-pāśa-śatairbaddhāḥ kāma-krodha-parāyaṇāḥ ।
    īhante kāma-bhogārthaṃ anyāyenārtha-sañcayān ॥

13: |-
    idamadya mayā labdhaṃ imaṃ prāpsye mano-ratham ।
    idamastīdamapi me bhaviṣyati punardhanam ॥

14: |-
    asau mayā hataḥ śatruḥ haniṣye cāparānapi ।
    īśvaro'hamahaṃ bhogī siddho'haṃ bala-vān sukhī ॥

15: |-
    āḍhyo'bhijana-vānasmi ko'nyo'sti sadṛśo mayā ।
    yakṣye dāsyāmi modiṣya ityajñāna-vimohitāḥ ॥

16: |-
    aneka-citta-vibhrāntā moha-jāla-samāvṛtāḥ ।
    prasaktāḥ kāma-bhogeṣu patanti narake'śucau ॥

17: |-
    ātma-sambhāvitāḥ stabdhāḥ dhana-māna-madānvitāḥ ।
    yajante nāma yajñaiste ḍambhenāvidhi-pūrvakam ॥

18: |-
    ahaṃ-kāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ ca saṃśritāḥ ।
    māmātma-para-deheṣu pradviṣanto'bhyasūyakāḥ ॥

19: |-
    tānahaṃ dviṣataḥ krūrān saṃ-sāreṣu narādhamān ।
    kṣipāmyajasramaśubhān āsurīṣveva yoniṣu ॥

20: |-
    āsurīṃ yonimāpannā mūḍhā janmani-janmani ।
    māmaprāpyaiva kaunteya tato yāntyadhamāṃ gatim ॥

21: |-
    tri-vidhaṃ narakasyedaṃ dvāraṃ nāśanamātmanaḥ ।
    kāmaḥ krodhastathā lobhaḥ tasmādetat trayaṃ tyajet ॥

22: |-
    etairvimuktaḥ kaunteya tamo-dvāraistribhirnaraḥ ।
    ācaratyātmanaḥ śreyaḥ tato yāti parāṃ gatim ॥

23: |-
    yaḥ śāstra-vidhimutsṛjya vartate kāma-kārataḥ ।
    na sa siddhimavāpnoti na sukhaṃ na parāṃ gatim ॥

24: |-
    tasmācchāstraṃ pramāṇaṃ te kāryākārya-vyavasthitau ।
    jñātvā śāstra-vidhānoktaṃ karma kartumihārhasi ॥

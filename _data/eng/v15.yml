1: ।-
    ūrdhva-mūlamadhaḥ-śākhaṃ aśvatthaṃ prāhuravyayam ।
    chandāṃsi yasya parṇāni yastaṃ veda sa veda-vit ॥

2: ।-
    adhaścordhvaṃ ca prasṛtāstasya śākhāḥ
    guṇa-pravṛddhā viṣaya-pravāl̤āḥ ।
    adhaśca mūlānyanu-santatāni
    karmānubandhīni manuṣya-loke ॥

3: ।-
    na rūpamasyeha tathopa-labhyate
    nānto na cādirna ca saṃ-pratiṣṭhā ।
    aścatthamenaṃ suvirūḍha-mūlaṃ
    asaṅga-śastreṇa dṛḍhena chitvā ॥

4: ।-
    tataḥ paraṃ tatparimārgitavyaṃ
    yasmin gatā na nivartanti bhūyaḥ ।
    tameva cādyaṃ puruṣaṃ prapadye
    yataḥ pravṛttiḥ prasṛtā purāṇī ॥

5: ।-
    nirmāna-mohā jita-saṅga-doṣāḥ
    adhyātma-nityā vinivṛtta-kāmāḥ ।
    dvandvairvi-muktāḥ sukha-duḥkha-sañjñaiḥ
    gacchantyamūḍhāḥ padamavyayaṃ tat ॥

6: ।-
    na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ ।
    yadgatvā na nivartante taddhāma paramaṃ mama ॥

7: ।-
    mamaivāṃśo jīva-loke jīva-bhūtaḥ sanātanaḥ ।
    manaḥ-ṣaṣṭhānīndriyāṇi prakṛti-sthāni karṣati ॥

8: ।-
    śarīraṃ yadavāpnoti yaccāpyutkrāmatīśvaraḥ ।
    gṛhītvaitāni saṃyāti vāyurgandhānivāśayāt ॥

9: ।-
    śrotraṃ cakṣuḥ sparśanaṃ ca rasanaṃ ghrāṇameva ca ।
    adhiṣṭhāya manaścāyaṃ viṣayānupa-sevate ॥

10: ।-
    utkrāmantaṃ sthitaṃ vāpi bhuñjānaṃ vā guṇānvitam ।
    vimūḍhā nānu-paśyanti paśyanti jñāna-cakṣuṣaḥ ॥

11: ।-
    yatanto yoginaścainaṃ paśyantyātmanyavasthitam ।
    yatanto'pyakṛtātmāno nainaṃ paśyantyacetasaḥ ॥

12: ।-
    yadāditya-gataṃ tejo jagad bhāsayate'khilam ।
    yaccandramasi yaccāgnau tattejo viddhi māmakam ॥

13: ।-
    gāmāviśya ca bhūtāni dhārayāmyahamojasā ।
    puṣṇāmi cauṣadhīḥ sarvāḥ somo bhūtvā rasātmakaḥ ॥

14: ।-
    ahaṃ vaiśvānaro bhūtvā prāṇināṃ dehamāśritaḥ ।
    prāṇāpāna-samāyuktaḥ pacāmyannaṃ caturvidham ॥

15: ।-
    sarvasya cāhaṃ hṛdi saṃniviṣṭo
    mattaḥ smṛtirjñānamapohanaṃ ca ।
    vedaiśca sarvairahameva vedyo
    vedānta-kṛd veda-videva cāham ॥

16: ।-
    dvāvimau puruṣau loke kṣaraścākṣara eva ca ।
    kṣaraḥ sarvāṇi bhūtāni kūṭa-stho'kṣara ucyate ॥

17: ।-
    uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ ।
    yo loka-trayamāviśya bibhartyavyaya īśvaraḥ ॥

18: ।-
    yasmāt kṣaramatīto'haṃ akṣarādapi cottamaḥ ।
    ato'smi loke vede ca prathitaḥ puruṣottamaḥ ॥

19: ।-
    yo māmevamasaṃ-mūḍho jānāti puruṣottamam ।
    sa sarva-vid bhajati māṃ sarva-bhāvena bhārataḥ ॥

20: ।-
    iti guhya-tamaṃ śāstraṃ idamuktaṃ mayānagha ।
    etad buddhvābuddhi-mān syāt kṛta-kṛtyaśca bhārata ॥

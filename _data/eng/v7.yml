1: |-
    mayyāsakta-manāḥ pārtha yogaṃ yuñjan madāśrayaḥ ।
    asaṃśayaṃ samagraṃ māṃ yathā jñāsyasi tacchṛṇu ॥

2: |-
    jñānaṃ te'haṃ sa-vijñānaṃ idaṃ vakṣyāmyaśeṣataḥ ।
    yajājñatvā neha bhūyo'nyat jñātavyamava-śiṣyate ॥

3: |-
    manuṣyāṇāṃ sahasreṣu kaścid yatati siddhaye ।
    yatatāmapi siddhānāṃ kaścinmāṃ vetti tattvataḥ ॥

4: |-
    bhūmirāpo'nalo vāyuḥ khaṃ mano buddhireva ca ।
    ahaṃ-kāra itīyaṃ me bhinnā prakṛtiraṣṭa-dhā ॥

5: |-
    apareyamitastvanyāṃ prakṛtiṃ viddhi me parām ।
    jīva-bhūtāṃ mahābāho yayedaṃ dhāryate jagat ॥

6: |-
    etadyonīni bhūtāni sarvāṇītyupa-dhāraya ।
    ahaṃ kṛtsnasya jagataḥ prabhavaḥ pral̤ayastathā ॥

7: |-
    mattaḥ para-taraṃ nānyat kiñcidasti dhanaṃ-jaya ।
    mayi sarvamidaṃ protaṃ sūtre maṇi-gaṇā iva ॥

8: |-
    raso'hamapsu kaunteya prabhā'smi śaśi-sūryayoḥ ।
    praṇavaḥ sarva-vedeṣu śabdaḥ khe pauruṣaṃ nṛṣu ॥

9: |-
    puṇyo gandhaḥ pṛthivyāṃ ca tejaścāsmi vibhāvasau ।
    jīvanaṃ sarva-bhūteṣu tapaścāsmi tapasviṣu ॥

10: |-
    bījaṃ māṃ sarva-bhūtānāṃ viddhi pārtha sanātanam ।
    buddhirbuddhi-matāmasmi tejastejasvināmaham ॥

11: |-
    balaṃ bala-vatāṃ cāhaṃ kāma-rāga-vivarjitam ।
    dharmāviruddho bhūteṣu kāmo'smi bharatarṣabha ॥

12: |-
    ye caiva sāttvikā bhāvāḥ rājasāstāmasāśca ye ।
    matta eveti tān viddhi na tvahaṃ teṣu te mayi ॥

13: |-
    tribhirguṇa-mayairbhāvaiḥ ebhiḥ sarvamidaṃ jagat ।
    mohitaṃ nābhi-jānāti māmebhyaḥ paramavyayam ॥

14: |-
    daivī hyeṣā guṇa-mayī mama māyā duratyayā ।
    māmeva ye pra-padyante māyāmetāṃ taranti te ॥

15: |-
    na māṃ duṣkṛtino mūḍhāḥ pra-padyante narādhamāḥ ।
    māyayā'pa-hṛta-jñānāḥ āsuraṃ bhāvamāśritāḥ ॥

16: |-
    caturvidhā bhajante māṃ janāḥ su-kṛtino'rjuna ।
    ārto jijñāsurarthārthī jñānī ca bharatarṣabha ॥

17: |-
    teṣāṃ jñānī nitya-yuktaḥ eka-bhaktirviśiṣyate ।
    priyo hi jñānino'tyarthaṃ ahaṃ sa ca mama priyaḥ ॥

18: |-
    udārāḥ sarva evaite jñānī tvātmaiva me matam ।
    āsthitaḥ sa hi yuktātmā māmevānuttamāṃ gatim ॥

19: |-
    bahūnāṃ janmanāmante jñāna-vān māṃ pra-padyate ।
    vāsu-devaḥ sarvamiti sa mahātmā su-durlabhaḥ ॥

20: |-
    kāmaistaistairhṛta-jñānāḥ pra-padyante'nya-devatāḥ ।
    taṃ-taṃ niyamamāsthāya prakṛtyā niyatāḥ svayā ॥

21: |-
    yo-yo yāṃ-yāṃ tanuṃ bhaktaḥ śraddhayā'rcitumicchati ।
    tasya-tasyācalāṃ śraddhāṃ tāmeva vi-dadhāmyaham ॥

22: |-
    sa tayā śraddhayā yuktaḥ tasyā'rādhanamīhate ।
    labhate ca tataḥ kāmān mayaiva vihitān hitān ॥

23: |-
    anta-vattu phalaṃ teṣāṃ tad bhavatyalpa-cetasām ।
    devān deva-yajo yānti madbhaktā yānti māmapi ॥

24: |-
    avyaktaṃ vyaktimāpannaṃ manyante māmabuddhayaḥ ।
    paraṃ bhāvamajānanto mamāvyayamanuttamam ॥

25: |-
    nāhaṃ prakāśaḥ sarvasya yoga-māyā-samāvṛtaḥ ।
    mūḍho'yaṃ nābhi-jānāti loko māmajamavyayam ॥

26: |-
    vedāhaṃ samatītāni vartamānāni cārjuna ।
    bhaviṣyāṇi ca bhūtāni māṃ tu veda na kaścana ॥

27: |-
    icchā-dveṣa-samutthena dvandva-mohena bhārata ।
    sarva-bhūtāni sammohaṃ sarge yānti paraṃ tapa ॥

28: |-
    yeṣāṃ tvanta-gataṃ pāpaṃ janānāṃ puṇya-karmaṇām ।
    te dvandva-moha-nirmuktāḥ bhajante māṃ dṛḍha-vratāḥ ॥

29: |-
    jarā-maraṇa-mokṣāya māmāśritya yatanti ye ।
    te brahma tad viduḥ kṛtsnaṃ adhyātmaṃ karma cākhilam ॥

30: |-
    sādhi-bhūtādhi-daivaṃ māṃ sādhi-yajñaṃ ca ye viduḥ ।
    prayāṇa-kāle'pi ca māṃ te viduryukta-cetasaḥ ॥

1: ।-
    saṃnyāsaṃ karmaṇāṃ kṛṣṇa punaryogaṃ ca śaṃsasi ।
    yacchreya etayorekaṃ tanme brūhi su-niścitam ॥

2: ।-
    saṃnyāsaḥ karma-yogaśca niḥśreyasa-karāvubhau ।
    tayostu karma-saṃnyāsāt karma-yogo viśiṣyate ॥

3: ।-
    jñeyaḥ sa nitya-saṃnyāsī yo na dveṣṭi na kāṅkṣati ।
    nirdvandvo hi mahābāho sukhaṃ bandhāt pramucyate ॥

4: ।-
    sāṅkhya-yogau pṛthag bālāḥ pra-vadanti na paṇḍitāḥ ।
    ekamapyāsthitaḥ samyak ubhayorvindate phalam ॥

5: ।-
    yat sāṅkhyaiḥ prāpyate sthānaṃ tad yogairapi gamyate ।
    ekaṃ sāṅkhyaṃ ca yogaṃ ca yaḥ paśyati sa paśyati ॥

6: ।-
    saṃ-nyāsastu mahābāho duḥkhamāptumayogataḥ ।
    yoga-yukto munirbrahma na cireṇādhigacchati ॥

7: ।-
    yoga-yukto vi-śuddhātmā vi-jitātmā jitendriyaḥ ।
    sarva-bhūtātma-bhūtātmā kurvannapi na lipyate ॥

8: ।-
    naiva kiñcit karomīti yukto manyeta tattva-vit ।
    paśyan śṛṇvan spṛśan jighran aśnan gacchan svapan śvasan ॥

9: ।-
    pralapan visṛjan gṛhṇan unmiṣan nimiṣannapi ।
    indriyāṇīndriyārtheṣu vartanta iti dhārayan ॥

10: ।-
    brahmaṇyādhāya karmāṇi saṅgaṃ tyaktvā karoti yaḥ ।
    lipyate na sa pāpena padma-patramivāmbhasā ॥

11: ।-
    kāyena manasā buddhyā kevalairindriyairapi ।
    yoginaḥ karma kurvanti saṅgaṃ tyaktvā''tma-śuddhaye ॥

12: ।-
    yuktaḥ karma-phalaṃ tyaktvā śāntimāpnoti naiṣṭhikīm ।
    ayuktaḥ kāma-kāreṇa phale sakto ni-baddhyate ॥

13: ।-
    sarva-karmāṇi manasā sannyasyā'ste sukhaṃ vaśī ।
    nava-dvāre pure dehī naiva kurvan na kārayan ॥

14: ।-
    na kartṛtvaṃ na karmāṇi lokasya sṛjati prabhuḥ ।
    na karma-phala-saṃyogaṃ sva-bhāvastu pra-vartate ॥

15: ।-
    nā'datte kasya-cit pāpaṃ na caiva su-kṛtaṃ vibhuḥ ।
    ajñānenā'vṛtaṃ jñānaṃ tena muhyanti jantavaḥ ॥

16: ।-
    jñānena tu tadajñānaṃ yeṣāṃ nāśitamātmanaḥ ।
    teṣāmādityavajjñānaṃ pra-kāśayati tat param ॥

17: ।-
    tadbuddhayastadātmānaḥ tanniṣṭhāstatparāyaṇāḥ ।
    gacchantyapunarāvṛttiṃ jñāna-nirdhūta-kalmaṣāḥ ॥

18: ।-
    vidyā-vinaya-sampanne brāhmaṇe gavi hastini ।
    śuni caiva śvapāke ca paṇḍitāḥ sama-darśinaḥ ॥

19: ।-
    ihaiva tairjitaḥ sargo yeṣāṃ sāmye sthitaṃ manaḥ ।
    nirdoṣaṃ hi samaṃ brahma tasmād brahmaṇi te sthitāḥ ॥

20: ।-
    na pra-hṛṣyet priyaṃ prāpya nodvijet prāpya cāpriyam ।
    sthira-buddhirasammūḍho brahma-vid brahmaṇi sthitaḥ ॥

21: ।-
    bāhya-sparśeṣvasaktātmā vindatyātmani yat sukham ।
    sa brahma-yoga-yuktātmā sukhamakṣayamaśnute ॥

22: ।-
    ye hi saṃ-sparśajā bhogāḥ duḥkha-yonaya eva te ।
    ādyantavantaḥ kaunteya na teṣu ramate budhaḥ ॥

23: ।-
    śaknotīhaiva yaḥ soḍhuṃ prāk śarīra-vimokṣaṇāt ।
    kāma-krodhodbhavaṃ vegaṃ sa yuktaḥ sa sukhī naraḥ ॥

24: ।-
    yo'ntaḥ-sukho'ntarārāmaḥ tathāṃ'tarjyotireva yaḥ ।
    sa yogī brahma nirbāṇaṃ brahma-bhūto'dhi-gacchati ॥

25: ।-
    labhante brahma nirbāṇaṃ ṛṣayaḥ kṣīṇa-kalmaṣāḥ ।
    chinnadvĕaidhā yatātmānaḥ sarva-bhūta-hite ratāḥ ॥

26: ।-
    kāma-krodha-viyuktānāṃ yatīnāṃ yata-cetasām ।
    abhito brahma nirbāṇaṃ vartate viditātmanām ॥

27: ।-
    sparśān kṛtvā bahirbāhyān cakṣuścaivāntare bhruvoḥ ।
    prāṇāpānau samau kṛtvā nāsābhyantara-cāriṇau ॥

28: ।-
    yatendriya-manovṛttiḥ munirmokṣa-parāyaṇaḥ ।
    vi-gatecchā-bhaya-krodho yaḥ sadā mukta eva saḥ ॥

29: ।-
    bhoktāraṃ yajña-tapasāṃ sarva-loka-maheśvaram ।
    suhṛdaṃ sarva-bhūtānāṃ jñātvā māṃ śāntimṛcchati ॥

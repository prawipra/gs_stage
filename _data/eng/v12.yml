1: ।-
    evaṃ satata-yuktā ye bhaktāstvāṃ paryupāsate ।
    ye cāpyakṣaramavyaktaṃ teṣāṃ ke yoga-vittamāḥ ॥

2: ।-
    mayyāveśya mano ye māṃ nitya-yuktā upāsate ।
    śraddhayā parayopetāḥ te me yukta-tamā matāḥ ॥

3: ।-
    ye tvakṣaramanirdeśyaṃ avyaktaṃ paryupāsate ।
    sarvatra-gamacintyaṃ ca kūṭa-sthamacalaṃ dhruvam ॥

4: ।-
    sanniyamyendriya-grāmaṃ sarvatra sama-buddhayaḥ ।
    te prāpnuvanti māmeva sarva-bhūta-hite ratāḥ ॥

5: ।-
    kleśo'dhika-tarasteṣāṃ avyaktāsakta-cetasām ।
    avyaktā hi gatirduḥkhaṃ deha-vadbhiravāpyate ॥

6: ।-
    ye tu sarvāṇi karmāṇi mayi saṃnyasya mat-parāḥ ।
    ananyenaiva yogena māṃ dhyāyanta upāsate ॥

7: ।-
    teṣāmahaṃ samuddhartā mṛtyu-saṃsāra-sāgarāt ।
    bhavāmi na-cirāt pārtha mayyāveśita-cetasām ॥

8: ।-
    mayyeva mana ādhatsva mayi buddhiṃ niveśaya ।
    nivasiṣyasi mayyeva ata ūrdhvaṃ na saṃśayaḥ ॥

9: ।-
    atha cittaṃ samādhātuṃ na śaknoṣi mayi sthiram ।
    abhyāsa-yogena tato māmicchāsptuṃ dhanaṃ-jaya ॥

10: ।-
    abhyāse'pyasamartho'si mat-karma-paramo bhava ।
    madarthamapi karmāṇi kurvan siddhimavāpsyasi ॥

11: ।-
    athaitadapyaśakto'si kartuṃ madyogamāśritaḥ ।
    sarva-karma-phala-tyāgaṃ tataḥ kuru yatātma-vān ॥

12: ।-
    śreyo hi jñānamabhyāsāt jñānād dhyānaṃ viśiṣyate ।
    dhyānāt karma-phala-tyāgaḥ tyāgācchāntiranantaram ॥

13: ।-
    adveṣṭā sarva-bhūtānāṃ maitraḥ karuṇa eva ca ।
    nirmamo nirahaṅkāraḥ sama-duḥkha-sukhaḥ kṣamī ॥

14: ।-
    santuṣṭaḥ satataṃ yogī yatātmā dṛḍha-niścayaḥ ।
    mayyarpita-mano-buddhiḥ yo madbhaktaḥ sa me priyaḥ ॥

15: ।-
    yasmānnodvijate loko lokānnodvijate ca yaḥ ।
    harṣāmarṣa-bhayodvegaiḥ mukto yaḥ sa ca me priyaḥ ॥

16: ।-
    anapekṣaḥ śucirdakṣaḥ udāsīno gata-vyathaḥ ।
    sarvārambha-parityāgī yo mad-bhaktaḥ sa me prriyaḥ ॥

17: ।-
    yo na hṛṣyati na dveṣṭi na śocati na kāṅkṣati ।
    śubhāśubha-parityāgī bhakti-mān yaḥ sa me priyaḥ ॥

18: ।-
    samaḥ śatrau ca mitre ca tathā mānāpa-mānayoḥ ।
    śītoṣṇa-sukha-duḥkheṣu samaḥ saṅga-vivarjitaḥ ॥

19: ।-
    tulya-nindā-stutirmaunī santuṣṭo yena-kena-cit ।
    aniketaḥ sthira-matiḥ bhakti-mān me priyo naraḥ ॥

20: ।-
    ye tu dharmyāmṛtamidaṃ yathoktaṃ paryupāsate ।
    śraddadhānā mat-paramāḥ bhaktāste'tīva me priyāḥ ॥

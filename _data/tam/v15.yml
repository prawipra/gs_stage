1: |-
    ஊர்த்⁴வ-மூலமத⁴꞉-ஶாக²ம்ʼ அஶ்வத்த²ம்ʼ ப்ராஹுரவ்யயம் ।
    ச²ந்தா³ம்ʼஸி யஸ்ய பர்ணானி யஸ்தம்ʼ வேத³ ஸ வேத³-வித் ॥

2: |-
    அத⁴ஶ்சோர்த்⁴வம்ʼ ச ப்ரஸ்ருʼதாஸ்தஸ்ய ஶாகா²꞉
    கு³ண-ப்ரவ்ருʼத்³தா⁴ விஷய-ப்ரவாளா꞉ ।
    அத⁴ஶ்ச மூலான்யனு-ஸந்ததானி
    கர்மானுப³ந்தீ⁴னி மனுஷ்ய-லோகே ॥

3: |-
    ந ரூபமஸ்யேஹ ததோ²ப-லப்⁴யதே
    நாந்தோ ந சாதி³ர்ன ச ஸம்ʼ-ப்ரதிஷ்டா² ।
    அஶ்சத்த²மேனம்ʼ ஸுவிரூட⁴-மூலம்ʼ
    அஸங்க³-ஶஸ்த்ரேண த்³ருʼடே⁴ன சி²த்வா ॥

4: |-
    தத꞉ பரம்ʼ தத்பரிமார்கி³தவ்யம்ʼ
    யஸ்மின் க³தா ந நிவர்தந்தி பூ⁴ய꞉ ।
    தமேவ சாத்³யம்ʼ புருஷம்ʼ ப்ரபத்³யே
    யத꞉ ப்ரவ்ருʼத்தி꞉ ப்ரஸ்ருʼதா புராணீ ॥

5: |-
    நிர்மான-மோஹா ஜித-ஸங்க³-தோ³ஷா꞉
    அத்⁴யாத்ம-நித்யா விநிவ்ருʼத்த-காமா꞉ ।
    த்³வந்த்³வைர்வி-முக்தா꞉ ஸுக²-து³꞉க²-ஸஞ்ஜ்ஞை꞉
    க³ச்ச²ந்த்யமூடா⁴꞉ பத³மவ்யயம்ʼ தத் ॥

6: |-
    ந தத்³பா⁴ஸயதே ஸூர்யோ ந ஶஶாங்கோ ந பாவக꞉ ।
    யத்³க³த்வா ந நிவர்தந்தே தத்³தா⁴ம பரமம்ʼ மம ॥

7: |-
    மமைவாம்ʼஶோ ஜீவ-லோகே ஜீவ-பூ⁴த꞉ ஸனாதன꞉ ।
    மன꞉-ஷஷ்டா²னீந்த்³ரியாணி ப்ரக்ருʼதி-ஸ்தா²னி கர்ஷதி ॥

8: |-
    ஶரீரம்ʼ யத³வாப்னோதி யச்சாப்யுத்க்ராமதீஶ்வர꞉ ।
    க்³ருʼஹீத்வைதானி ஸம்ʼயாதி வாயுர்க³ந்தா⁴னிவாஶயாத் ॥

9: |-
    ஶ்ரோத்ரம்ʼ சக்ஷு꞉ ஸ்பர்ஶனம்ʼ ச ரஸனம்ʼ க்⁴ராணமேவ ச ।
    அதி⁴ஷ்டா²ய மனஶ்சாயம்ʼ விஷயானுப-ஸேவதே ॥

10: |-
    உத்க்ராமந்தம்ʼ ஸ்தி²தம்ʼ வாபி பு⁴ஞ்ஜானம்ʼ வா கு³ணான்விதம் ।
    விமூடா⁴ நானு-பஶ்யந்தி பஶ்யந்தி ஜ்ஞான-சக்ஷுஷ꞉ ॥

11: |-
    யதந்தோ யோகி³னஶ்சைனம்ʼ பஶ்யந்த்யாத்மன்யவஸ்தி²தம் ।
    யதந்தோ(அ)ப்யக்ருʼதாத்மானோ நைனம்ʼ பஶ்யந்த்யசேதஸ꞉ ॥

12: |-
    யதா³தி³த்ய-க³தம்ʼ தேஜோ ஜக³த்³ பா⁴ஸயதே(அ)கி²லம் ।
    யச்சந்த்³ரமஸி யச்சாக்³னௌ தத்தேஜோ வித்³தி⁴ மாமகம் ॥

13: |-
    கா³மாவிஶ்ய ச பூ⁴தானி தா⁴ரயாம்யஹமோஜஸா ।
    புஷ்ணாமி சௌஷதீ⁴꞉ ஸர்வா꞉ ஸோமோ பூ⁴த்வா ரஸாத்மக꞉ ॥

14: |-
    அஹம்ʼ வைஶ்வானரோ பூ⁴த்வா ப்ராணினாம்ʼ தே³ஹமாஶ்ரித꞉ ।
    ப்ராணாபான-ஸமாயுக்த꞉ பசாம்யன்னம்ʼ சதுர்வித⁴ம் ॥

15: |-
    ஸர்வஸ்ய சாஹம்ʼ ஹ்ருʼதி³ ஸம்ʼநிவிஷ்டோ
    மத்த꞉ ஸ்ம்ருʼதிர்ஜ்ஞானமபோஹனம்ʼ ச ।
    வேதை³ஶ்ச ஸர்வைரஹமேவ வேத்³யோ
    வேதா³ந்த-க்ருʼத்³ வேத³-விதே³வ சாஹம் ॥

16: |-
    த்³வாவிமௌ புருஷௌ லோகே க்ஷரஶ்சாக்ஷர ஏவ ச ।
    க்ஷர꞉ ஸர்வாணி பூ⁴தானி கூட-ஸ்தோ²(அ)க்ஷர உச்யதே ॥

17: |-
    உத்தம꞉ புருஷஸ்த்வன்ய꞉ பரமாத்மேத்யுதா³ஹ்ருʼத꞉ ।
    யோ லோக-த்ரயமாவிஶ்ய பி³ப⁴ர்த்யவ்யய ஈஶ்வர꞉ ॥

18: |-
    யஸ்மாத் க்ஷரமதீதோ(அ)ஹம்ʼ அக்ஷராத³பி சோத்தம꞉ ।
    அதோ(அ)ஸ்மி லோகே வேதே³ ச ப்ரதி²த꞉ புருஷோத்தம꞉ ॥

19: |-
    யோ மாமேவமஸம்ʼ-மூடோ⁴ ஜானாதி புருஷோத்தமம் ।
    ஸ ஸர்வ-வித்³ ப⁴ஜதி மாம்ʼ ஸர்வ-பா⁴வேன பா⁴ரத꞉ ॥

20: |-
    இதி கு³ஹ்ய-தமம்ʼ ஶாஸ்த்ரம்ʼ இத³முக்தம்ʼ மயானக⁴ ।
    ஏதத்³ பு³த்³த்⁴வாபு³த்³தி⁴-மான் ஸ்யாத் க்ருʼத-க்ருʼத்யஶ்ச பா⁴ரத ॥

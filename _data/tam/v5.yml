1: |-
    ஸம்ʼந்யாஸம்ʼ கர்மணாம்ʼ க்ருʼஷ்ண புனர்யோக³ம்ʼ ச ஶம்ʼஸஸி ।
    யச்ச்²ரேய ஏதயோரேகம்ʼ தன்மே ப்³ரூஹி ஸு-நிஶ்சிதம் ॥

2: |-
    ஸம்ʼந்யாஸ꞉ கர்ம-யோக³ஶ்ச நி꞉ஶ்ரேயஸ-கராவுபௌ⁴ ।
    தயோஸ்து கர்ம-ஸம்ʼந்யாஸாத் கர்ம-யோகோ³ விஶிஷ்யதே ॥

3: |-
    ஜ்ஞேய꞉ ஸ நித்ய-ஸம்ʼந்யாஸீ யோ ந த்³வேஷ்டி ந காங்க்ஷதி ।
    நிர்த்³வந்த்³வோ ஹி மஹாபா³ஹோ ஸுக²ம்ʼ ப³ந்தா⁴த் ப்ரமுச்யதே ॥

4: |-
    ஸாங்க்²ய-யோகௌ³ ப்ருʼத²க்³ பா³லா꞉ ப்ர-வத³ந்தி ந பண்டி³தா꞉ ।
    ஏகமப்யாஸ்தி²த꞉ ஸம்யக் உப⁴யோர்விந்த³தே ப²லம் ॥

5: |-
    யத் ஸாங்க்²யை꞉ ப்ராப்யதே ஸ்தா²னம்ʼ தத்³ யோகை³ரபி க³ம்யதே ।
    ஏகம்ʼ ஸாங்க்²யம்ʼ ச யோக³ம்ʼ ச ய꞉ பஶ்யதி ஸ பஶ்யதி ॥

6: |-
    ஸம்ʼ-ந்யாஸஸ்து மஹாபா³ஹோ து³꞉க²மாப்துமயோக³த꞉ ।
    யோக³-யுக்தோ முநிர்ப்³ரஹ்ம ந சிரேணாதி⁴க³ச்ச²தி ॥

7: |-
    யோக³-யுக்தோ வி-ஶுத்³தா⁴த்மா வி-ஜிதாத்மா ஜிதேந்த்³ரிய꞉ ।
    ஸர்வ-பூ⁴தாத்ம-பூ⁴தாத்மா குர்வன்னபி ந லிப்யதே ॥

8: |-
    நைவ கிஞ்சித் கரோமீதி யுக்தோ மன்யேத தத்த்வ-வித் ।
    பஶ்யன் ஶ்ருʼண்வன் ஸ்ப்ருʼஶன் ஜிக்⁴ரன் அஶ்னன் க³ச்ச²ன் ஸ்வபன் ஶ்வஸன் ॥

9: |-
    ப்ரலபன் விஸ்ருʼஜன் க்³ருʼஹ்ணன் உன்மிஷன் நிமிஷன்னபி ।
    இந்த்³ரியாணீந்த்³ரியார்தே²ஷு வர்தந்த இதி தா⁴ரயன் ॥

10: |-
    ப்³ரஹ்மண்யாதா⁴ய கர்மாணி ஸங்க³ம்ʼ த்யக்த்வா கரோதி ய꞉ ।
    லிப்யதே ந ஸ பாபேன பத்³ம-பத்ரமிவாம்ப⁴ஸா ॥

11: |-
    காயேன மனஸா பு³த்³த்⁴யா கேவலைரிந்த்³ரியைரபி ।
    யோகி³ன꞉ கர்ம குர்வந்தி ஸங்க³ம்ʼ த்யக்த்வா(ஆ)த்ம-ஶுத்³த⁴யே ॥

12: |-
    யுக்த꞉ கர்ம-ப²லம்ʼ த்யக்த்வா ஶாந்திமாப்னோதி நைஷ்டி²கீம் ।
    அயுக்த꞉ காம-காரேண ப²லே ஸக்தோ நி-ப³த்³த்⁴யதே ॥

13: |-
    ஸர்வ-கர்மாணி மனஸா ஸன்ன்யஸ்யா(அ)ஸ்தே ஸுக²ம்ʼ வஶீ ।
    நவ-த்³வாரே புரே தே³ஹீ நைவ குர்வன் ந காரயன் ॥

14: |-
    ந கர்த்ருʼத்வம்ʼ ந கர்மாணி லோகஸ்ய ஸ்ருʼஜதி ப்ரபு⁴꞉ ।
    ந கர்ம-ப²ல-ஸம்ʼயோக³ம்ʼ ஸ்வ-பா⁴வஸ்து ப்ர-வர்ததே ॥

15: |-
    நா(அ)த³த்தே கஸ்ய-சித் பாபம்ʼ ந சைவ ஸு-க்ருʼதம்ʼ விபு⁴꞉ ।
    அஜ்ஞானேனா(அ)வ்ருʼதம்ʼ ஜ்ஞானம்ʼ தேன முஹ்யந்தி ஜந்தவ꞉ ॥

16: |-
    ஜ்ஞானேன து தத³ஜ்ஞானம்ʼ யேஷாம்ʼ நாஶிதமாத்மன꞉ ।
    தேஷாமாதி³த்யவஜ்ஜ்ஞானம்ʼ ப்ர-காஶயதி தத் பரம் ॥

17: |-
    தத்³பு³த்³த⁴யஸ்ததா³த்மான꞉ தந்நிஷ்டா²ஸ்தத்பராயணா꞉ ।
    க³ச்ச²ந்த்யபுனராவ்ருʼத்திம்ʼ ஜ்ஞான-நிர்தூ⁴த-கல்மஷா꞉ ॥

18: |-
    வித்³யா-வினய-ஸம்பன்னே ப்³ராஹ்மணே க³வி ஹஸ்தினி ।
    ஶுனி சைவ ஶ்வபாகே ச பண்டி³தா꞉ ஸம-த³ர்ஶின꞉ ॥

19: |-
    இஹைவ தைர்ஜித꞉ ஸர்கோ³ யேஷாம்ʼ ஸாம்யே ஸ்தி²தம்ʼ மன꞉ ।
    நிர்தோ³ஷம்ʼ ஹி ஸமம்ʼ ப்³ரஹ்ம தஸ்மாத்³ ப்³ரஹ்மணி தே ஸ்தி²தா꞉ ॥

20: |-
    ந ப்ர-ஹ்ருʼஷ்யேத் ப்ரியம்ʼ ப்ராப்ய நோத்³விஜேத் ப்ராப்ய சாப்ரியம் ।
    ஸ்தி²ர-பு³த்³தி⁴ரஸம்மூடோ⁴ ப்³ரஹ்ம-வித்³ ப்³ரஹ்மணி ஸ்தி²த꞉ ॥

21: |-
    பா³ஹ்ய-ஸ்பர்ஶேஷ்வஸக்தாத்மா விந்த³த்யாத்மனி யத் ஸுக²ம் ।
    ஸ ப்³ரஹ்ம-யோக³-யுக்தாத்மா ஸுக²மக்ஷயமஶ்னுதே ॥

22: |-
    யே ஹி ஸம்ʼ-ஸ்பர்ஶஜா போ⁴கா³꞉ து³꞉க²-யோனய ஏவ தே ।
    ஆத்³யந்தவந்த꞉ கௌந்தேய ந தேஷு ரமதே பு³த⁴꞉ ॥

23: |-
    ஶக்னோதீஹைவ ய꞉ ஸோடு⁴ம்ʼ ப்ராக் ஶரீர-விமோக்ஷணாத் ।
    காம-க்ரோதோ⁴த்³ப⁴வம்ʼ வேக³ம்ʼ ஸ யுக்த꞉ ஸ ஸுகீ² நர꞉ ॥

24: |-
    யோ(அ)ந்த꞉-ஸுகோ²(அ)ந்தராராம꞉ ததா²ம்ʼ(அ)தர்ஜ்யோதிரேவ ய꞉ ।
    ஸ யோகீ³ ப்³ரஹ்ம நிர்பா³ணம்ʼ ப்³ரஹ்ம-பூ⁴தோ(அ)தி⁴-க³ச்ச²தி ॥

25: |-
    லப⁴ந்தே ப்³ரஹ்ம நிர்பா³ணம்ʼ ருʼஷய꞉ க்ஷீண-கல்மஷா꞉ ।
    சி²ன்னத்³வெைதா⁴ யதாத்மான꞉ ஸர்வ-பூ⁴த-ஹிதே ரதா꞉ ॥

26: |-
    காம-க்ரோத⁴-வியுக்தானாம்ʼ யதீனாம்ʼ யத-சேதஸாம் ।
    அபி⁴தோ ப்³ரஹ்ம நிர்பா³ணம்ʼ வர்ததே விதி³தாத்மனாம் ॥

27: |-
    ஸ்பர்ஶான் க்ருʼத்வா ப³ஹிர்பா³ஹ்யான் சக்ஷுஶ்சைவாந்தரே ப்⁴ருவோ꞉ ।
    ப்ராணாபானௌ ஸமௌ க்ருʼத்வா நாஸாப்⁴யந்தர-சாரிணௌ ॥

28: |-
    யதேந்த்³ரிய-மனோவ்ருʼத்தி꞉ முநிர்மோக்ஷ-பராயண꞉ ।
    வி-க³தேச்சா²-ப⁴ய-க்ரோதோ⁴ ய꞉ ஸதா³ முக்த ஏவ ஸ꞉ ॥

29: |-
    போ⁴க்தாரம்ʼ யஜ்ஞ-தபஸாம்ʼ ஸர்வ-லோக-மஹேஶ்வரம் ।
    ஸுஹ்ருʼத³ம்ʼ ஸர்வ-பூ⁴தானாம்ʼ ஜ்ஞாத்வா மாம்ʼ ஶாந்திம்ருʼச்ச²தி ॥

1: |-
    ப்ரக்ருʼதிம்ʼ புருஷம்ʼ சைவ க்ஷேத்ரம்ʼ க்ஷேத்ரஜ்ஞமேவ ச
    ஏதத்³ வேதி³துமிச்சா²மி ஜ்ஞானம்ʼ ஜ்ஞேயம்ʼ ச கேஶவ ॥

2: |-
    இத³ம்ʼ ஶரீரம்ʼ கௌந்தேய க்ஷேத்ரமித்யபி⁴-தீ⁴யதே ।
    ஏதத்³ யோ வேத்தி தம்ʼ ப்ராஹு꞉ க்ஷேத்ரஜ்ஞ இதி தத்³வித³꞉ ॥

3: |-
    க்ஷேத்ரஜ்ஞம்ʼ சாபி மாம்ʼ வித்³தி⁴ ஸர்வ-க்ஷேத்ரேஷு பா⁴ரத ।
    க்ஷேத்ர-க்ஷேத்ரஜ்ஞயோர்ஜ்ஞானம்ʼ யத் தஜ்ஜ்ஞானம்ʼ மதம்ʼ மம ॥

4: |-
    தத் க்ஷேத்ரம்ʼ யச்ச யாத்³ருʼக் ச யத்³விகாரி யதஶ்ச யத் ।
    ஸ ச யோ யத்ப்ரபா⁴வஶ்ச தத் ஸமாஸேன மே ஶ்ருʼணு ॥

5: |-
    ருʼஷிபி⁴ர்ப³ஹுதா⁴ கீ³தம்ʼ ச²ந்தோ³பி⁴ர்விவிதை⁴꞉ ப்ருʼத²க் ।
    ப்³ரஹ்ம-ஸூத்ர-பதை³ஶ்சைவ ஹேது-மத்³பி⁴ர்வி-நிஶ்சிதை꞉ ॥

6: |-
    மஹா-பூ⁴தான்யஹம்ʼ-காரோ பு³த்³தி⁴ரவ்யக்தமேவ ச ।
    இந்த்³ரியாணி த³ஶைகம்ʼ ச பஞ்ச சேந்த்³ரிய-கோ³சரா꞉ ॥

7: |-
    இச்சா² த்³வேஷ꞉ ஸுக²ம்ʼ து³꞉க²ம்ʼ ஸங்கா⁴தஶ்சேதனா த்⁴ருʼதி꞉ ।
    ஏதத் க்ஷேத்ரம்ʼ ஸமாஸேன ஸ-விகாரமுதா³ஹ்ருʼதம் ॥

8: |-
    அமானித்வமட³ம்பி⁴த்வம்ʼ அஹிம்ʼஸா க்ஷாந்திரார்ஜவம் ।
    ஆசார்யோபாஸனம்ʼ ஶௌசம்ʼ ஸ்தை²ர்யமாத்ம-விநிக்³ரஹ꞉ ॥

9: |-
    இந்த்³ரியார்தே²ஷு வைராக்³யம்ʼ அனஹங்கார ஏவ ச ।
    ஜன்ம-ம்ருʼத்யு-ஜரா-வ்யாதி⁴-து³꞉க²-தோ³ஷானு-த³ர்ஶனம் ॥

10: |-
    அஸக்திரனபி⁴ஷ்வங்க³꞉ புத்ர-தா³ர-க்³ருʼஹாதி³ஷு ।
    நித்யம்ʼ ச ஸம-சித்தத்வம்ʼ இஷ்டாநிஷ்டோப-பத்திஷு ॥

11: |-
    மயி சானன்ய-யோகே³ன ப⁴க்திரவ்யபி⁴-சாரிணீ ।
    விவிக்த-தே³ஶ-ஸேவித்வம்ʼ அரதிர்ஜன-ஸம்ʼஸதி³ ॥

12: |-
    அத்⁴யாத்ம-ஜ்ஞான-நித்யத்வம்ʼ தத்த்வ-ஜ்ஞானார்த²-த³ர்ஶனம் ।
    ஏதஜ்ஜ்ஞானமிதி ப்ரோக்தம்ʼ அஜ்ஞானம்ʼ யத³தோ(அ)ன்யதா² ॥

13: |-
    ஜ்ஞேயம்ʼ யத் தத் ப்ரவக்ஷ்யாமி யஜ்ஜ்ஞாத்வா(அ)ம்ருʼதமஶ்னுதே ।
    அநாதி³-மத் பரம்ʼ ப்³ரஹ்ம ந ஸத் தன்னாஸது³ச்யதே ॥

14: |-
    ஸர்வத꞉-பாணி-பாத³ம்ʼ தத் ஸர்வதோ(அ)க்ஷி-ஶிரோ-முக²ம் ।
    ஸர்வத꞉-ஶ்ருதிமல்லோகே ஸர்வமாவ்ருʼத்ய திஷ்ட²தி ॥

15: |-
    ஸர்வேந்த்³ரிய-கு³ணாபா⁴ஸம்ʼ ஸர்வேந்த்³ரிய-விவர்ஜிதம் ।
    அஸக்தம்ʼ ஸர்வ-ப்⁴ருʼச்சைவ நிர்கு³ணம்ʼ கு³ண-போ⁴க்த்ருʼ ச ॥

16: |-
    ப³ஹிரந்தஶ்ச பூ⁴தானாம்ʼ அசரம்ʼ சரமேவ ச ।
    ஸூக்ஷ்மத்வாத் தத³விஜ்ஞேயம்ʼ தூ³ர-ஸ்த²ம்ʼ சாந்திகே ச தத் ॥

17: |-
    அவிப⁴க்தம்ʼ ச பூ⁴தேஷு விப⁴க்தமிவ ச ஸ்தி²தம் ।
    பூ⁴த-ப⁴ர்த்ருʼ ச தஜ்ஜ்ஞேயம்ʼ க்³ரஸிஷ்ணு ப்ரப⁴விஷ்ணு ச ॥

18: |-
    ஜ்யோதிஷாமபி தஜ்ஜ்யோதி꞉ தமஸ꞉ பரமுச்யதே ।
    ஜ்ஞானம்ʼ ஜ்ஞேயம்ʼ ஜ்ஞான-க³ம்யம்ʼ ஹ்ருʼதி³ ஸர்வஸ்ய தி⁴ஷ்டி²தம் ॥

19: |-
    இதி க்ஷேத்ரம்ʼ ததா² ஜ்ஞானம்ʼ ஜ்ஞேயம்ʼ சோக்தம்ʼ ஸமாஸத꞉ ।
    மத்³ப⁴க்த ஏதத்³ விஜ்ஞாய மத்³பா⁴வாயோப-பத்³யதே ॥

20: |-
    ப்ரக்ருʼதிம்ʼ புருஷம்ʼ சைவ வித்³த்⁴யநாதீ³ உபா⁴வபி ।
    விகாராம்ʼஶ்ச கு³ணாம்ʼஶ்சைவ வித்³தி⁴ ப்ரக்ருʼதி-ஸம்ப⁴வான் ॥

21: |-
    கார்ய-காரண-கர்த்ருʼத்வே ஹேது꞉ ப்ரக்ருʼதிருச்யதே ।
    புருஷ꞉ ஸுக²-து³꞉கா²னாம்ʼ போ⁴க்த்ருʼத்வே ஹேதுருச்யதே ॥

22: |-
    புருஷ꞉ ப்ரக்ருʼதி-ஸ்தோ² ஹி பு⁴ங்க்தே ப்ரக்ருʼதி-ஜான் கு³ணான் ।
    காரணம்ʼ கு³ண-ஸங்கோ³(அ)ஸ்ய ஸத³ஸத்³யோனி-ஜன்மஸு ॥

23: |-
    உப-த்³ரஷ்டா(அ)னு-மந்தா ச ப⁴ர்தா போ⁴க்தா மஹேஶ்வர꞉ ।
    பரமாத்மேதி சாப்யுக்தோ தே³ஹே(அ)ஸ்மின் புருஷ꞉ பர꞉ ॥

24: |-
    ய ஏவம்ʼ வேத்தி புருஷம்ʼ ப்ரக்ருʼதிம்ʼ ச கு³ணை꞉ ஸஹ ।
    ஸர்வதா² வர்த-மானோ(அ)பி ந ஸ பூ⁴யோ(அ)பி⁴-ஜாயதே ॥

25: |-
    த்⁴யானேனா(அ)த்மனி பஶ்யந்தி கேசிதா³த்மானமாத்மனா ।
    அன்யே ஸாங்க்²யேன யோகே³ன கர்ம-யோகே³ன சாபரே ॥

26: |-
    அன்யே த்வேவமஜானந்த꞉ ஶ்ருத்வா(அ)ன்யேப்⁴ய உபாஸதே ।
    தே(அ)பி சாதி-தரந்த்யேவ ம்ருʼத்யும்ʼ ஶ்ருதி-பராயணா꞉ ॥

27: |-
    யாவத் ஸஞ்ஜாயதே கிஞ்சித் ஸத்வம்ʼ ஸ்தா²வர-ஜங்க³மம் ।
    க்ஷேத்ர-க்ஷேத்ரஜ்ஞ-ஸம்ʼயோகா³த் தத்³ வித்³தி⁴ ப⁴ரதர்ஷப⁴ ॥

28: |-
    ஸமம்ʼ ஸர்வேஷு பூ⁴தேஷு திஷ்ட²ந்தம்ʼ பரமேஶ்வரம் ।
    வினஶ்யத்ஸ்வவி-நஶ்யந்தம்ʼ ய꞉ பஶ்யதி ஸ பஶ்யதி ॥

29: |-
    ஸமம்ʼ பஶ்யன் ஹி ஸர்வத்ர ஸமவ-ஸ்தி²தமீஶ்வரம் ।
    ந ஹினஸ்த்யாத்மனா(ஆ)த்மானம்ʼ ததோ யாதி பராம்ʼ க³திம் ॥

30: |-
    ப்ரக்ருʼத்யைவ ச கர்மாணி க்ரியமாணானி ஸர்வஶ꞉ ।
    ய꞉ பஶ்யதி ததா²(ஆ)த்மானம்ʼ அகர்தாரம்ʼ ஸ பஶ்யதி ॥

31: |-
    யதா³ பூ⁴த-ப்ருʼத²க்³பா⁴வம்ʼ ஏக-ஸ்த²மனு-பஶ்யதி ।
    தத ஏவ ச விஸ்தாரம்ʼ ப்³ரஹ்ம ஸம்பத்³யதே ததா³ ॥

32: |-
    அநாதி³-த்வாந்நிர்கு³ண-த்வாத் பரமாத்மா(அ)யமவ்யய꞉ ।
    ஶரீர-ஸ்தோ²(அ)பி கௌந்தேய ந கரோதி ந லிப்யதே ॥

33: |-
    யதா² ஸர்வ-க³தம்ʼ ஸௌக்ஷ்யாத் ஆகாஶம்ʼ நோப-லிப்யதே ।
    ஸர்வத்ராவ-ஸ்தி²தோ தே³ஹே ததா²(ஆ)த்மா நோப-லிப்யதே ॥

34: |-
    யதா² ப்ரகாஶயத்யேக꞉ க்ருʼத்ஸ்னம்ʼ லோகமிமம்ʼ ரவி꞉ ।
    க்ஷேத்ரம்ʼ க்ஷேத்ரீ ததா² க்ருʼத்ஸ்னம்ʼ ப்ரகாஶயதி பா⁴ரத ॥

35: |-
    க்ஷேத்ர-க்ஷேத்ரஜ்ஞயோரேவம்ʼ அந்தரம்ʼ ஜ்ஞான-சக்ஷுஷா ।
    பூ⁴த-ப்ரக்ருʼதி-மோக்ஷம்ʼ ச யே விது³ர்யாந்தி தே பரம் ॥

1: |-
    ஜ்யாயஸீ சேத் கர்மணஸ்தே மதா பு³த்³தி⁴ர்ஜனார்த³ன ।
    தத் கிம்ʼ கர்மணி கோ⁴ரே மாம்ʼ நி-யோஜயஸி கேஶவ ॥

2: |-
    வ்யாமிஶ்ரேணைவ வாக்யேன பு³த்³தி⁴ம்ʼ மோஹயஸீவ மே ।
    ததே³கம்ʼ வத³ நிஶ்சித்ய யேன ஶ்ரேயோ(அ)ஹமாப்னுயாம் ॥

3: |-
    லோகே(அ)ஸ்மின் த்³விவிதா⁴ நிஷ்டா² புரா ப்ரோக்தா மயா(அ)னக⁴ ।
    ஜ்ஞான-யோகே³ன ஸாங்க்²யானாம்ʼ கர்ம-யோகே³ன யோகி³னாம்

4: |-
    ந கர்மணாமனாரம்பா⁴த் நைஷ்கர்ம்யம்ʼ புருஷோ(அ)ஶ்னுதே ।
    ந ச ஸம்ʼ-ந்யஸநாதே³வ ஸித்³தி⁴ம்ʼ ஸமதி⁴-க³ச்ச²தி ॥

5: |-
    ந ஹி கஶ்சித் க்ஷணமபி ஜாது திஷ்ட²த்யகர்ம-க்ருʼத் ।
    கார்யதே ஹ்யவஶ꞉ கர்ம ஸர்வ꞉ ப்ரக்ருʼதி-ஜைர்கு³ணை꞉ ॥

6: |-
    கர்மேந்த்³ரியாணி ஸம்ʼயம்ய ய ஆஸ்தே மனஸா சரன் ।
    இந்த்³ரியார்தா²ன் விமூடா⁴த்மா மித்²யாசார꞉ ஸ உச்யதே ॥

7: |-
    யஸ்த்விந்த்³ரியாணி மனஸா நியம்யாரப⁴தே(அ)ர்ஜுன ।
    கர்மேந்த்³ரியை꞉ கர்ம-யோக³ம்ʼ அஸக்த꞉ ஸ விஶிஷ்யதே ॥

8: |-
    நியதம்ʼ குரு கர்ம த்வம்ʼ கர்ம ஜ்யாயோ ஹ்யகர்மண꞉ ।
    ஶரீர-யாத்ராபி ச தே ந ப்ரஸித்³த்⁴யேத³கர்மண꞉ ॥

9: |-
    யஜ்ஞார்தா²த் கர்மணோ(அ)ன்யத்ர லோகோ(அ)யம்ʼ கர்ம-ப³ந்த⁴ன꞉ ।
    தத³ர்த²ம்ʼ கர்ம கௌந்தேய முக்த-ஸங்க³꞉ ஸமாசர ॥

10: |-
    ஸஹ-யஜ்ஞா꞉ ப்ரஜா꞉ ஸ்ருʼஷ்ட்வா புரோவாச ப்ரஜா-பதி꞉ ।
    அனேன ப்ர-ஸவிஷ்யத்⁴வம்ʼ ஏஷ வோ(அ)ஸ்த்விஷ்ட-காம-து⁴க் ॥

11: |-
    தே³வான் பா⁴வயதானேன தே தே³வா பா⁴வயந்து வ꞉ ।
    பரஸ்பரம்ʼ பா⁴வயந்த꞉ ஶ்ரேய꞉ பரமவாப்ஸ்யத² ॥

12: |-
    இஷ்டான் போ⁴கா³ன் ஹி வோ தே³வா꞉ தா³ஸ்யந்தே யஜ்ஞ-பா⁴விதா꞉ ।
    தைர்த³த்தானப்ரதா³யைப்⁴யோ யோ பு⁴ங்க்தே ஸ்தேன ஏவ ஸ꞉ ॥

13: |-
    யஜ்ஞ-ஶிஷ்டாஶின꞉ ஸந்தோ முச்யந்தே ஸர்வ-கில்பி³ஷை꞉ ।
    பு⁴ஞ்ஜதே தே த்வக⁴ம்ʼ பாபா꞉ யே பசந்த்யாத்ம-காரணாத் ॥

14: |-
    அந்நாத்³ ப⁴வந்தி பூ⁴தானி பர்ஜன்யாத³ன்ன-ஸம்ப⁴வ꞉ ।
    யஜ்ஞாத்³ ப⁴வதி பர்ஜன்யோ யஜ்ஞ꞉ கர்ம-ஸமுத்³ப⁴வ꞉ ॥

15: |-
    கர்ம ப்³ரஹ்மோத்³ப⁴வம்ʼ வித்³தி⁴ ப்³ரஹ்மாக்ஷர-ஸமுத்³ப⁴வம் ॥
    தஸ்மாத் ஸர்வ-க³தம்ʼ ப்³ரஹ்ம நித்யம்ʼ யஜ்ஞே ப்ர-திஷ்டி²தம் ॥

16: |-
    ஏவம்ʼ ப்ர-வர்திதம்ʼ சக்ரம்ʼ நானு-வர்தயதீஹ ய꞉ ।
    அகா⁴யுரிந்த்³ரியாராமோ மோக⁴ம்ʼ பார்த² ஸ ஜீவதி ॥

17: |-
    யஸ்த்வாத்ம-ரதிரேவ ஸ்யாத் ஆத்ம-த்ருʼப்தஶ்ச மானவ꞉ ।
    ஆத்மன்யேவ ச ஸந்துஷ்ட꞉ தஸ்ய கார்யம்ʼ ந வித்³யதே ॥

18: |-
    நைவ தஸ்ய க்ருʼதேனார்தோ² நாக்ருʼதேனேஹ கஶ்சன ।
    நசாஸ்ய ஸர்வ-பூ⁴தேஷு கஶ்சித³ர்த²-வ்யபாஶ்ரய꞉ ॥

19: |-
    தஸ்மாத³ஸக்த꞉ ஸததம்ʼ கார்யம்ʼ கர்ம ஸமாசர ।
    அஸக்தோ ஹ்யாசரன் கர்ம பரமாப்னோதி பூருஷ꞉ ॥

20: |-
    கர்மணைவ ஹி ஸம்ʼஸித்³தி⁴ம்ʼ ஆஸ்தி²தா ஜனகாத³ய꞉ ।
    லோக-ஸம்ʼ-க்³ரஹமேவாபி ஸம்ʼ-பஶ்யன் கர்துமர்ஹஸி ॥

21: |-
    யத்³யதா³சரதி ஶ்ரேஷ்ட²꞉ தத்ததே³வேதரோ ஜன꞉ ।
    ஸ யத் ப்ரமாணம்ʼ குருதே லோகஸ்தத³னு-வர்ததே ॥

22: |-
    ந மே பார்தா²ஸ்தி கர்தவ்யம்ʼ த்ரிஷு லோகேஷு கிஞ்சன ।
    நானவாப்தமவாப்தவ்யம்ʼ வர்த ஏவ ச கர்மணி ॥

23: |-
    யதி³ ஹ்யஹம்ʼ ந வர்தேயம்ʼ ஜாது கர்மண்யதந்த்³ரித꞉ ।
    மம வர்த்மானு-வர்தந்தே மனுஷ்யா꞉ பார்த² ஸர்வஶ꞉ ॥

24: |-
    உத்ஸீதே³யுரிமே லோகா꞉ ந குர்யாம்ʼ கர்ம சேத³ஹம் ।
    ஸங்கரஸ்ய ச கர்தா ஸ்யாம்ʼ உபஹன்யாமிமா꞉ ப்ரஜா꞉ ॥

25: |-
    ஸக்தா꞉ கர்மண்யவித்³வாம்ʼஸோ யதா² குர்வந்தி பா⁴ரத ॥
    குர்யாத்³ வித்³வாம்ʼஸ்ததா²ஸக்த꞉ சிகீர்ஷுர்லோக-ஸங்க்³ரஹம் ॥

26: |-
    ந பு³த்³தி⁴-பே⁴த³ம்ʼ ஜனயேத் அஜ்ஞானாம்ʼ கர்ம-ஸங்கி³னாம் ।
    ஜோஷயேத் ஸர்வ-கர்மாணி வித்³வான் யுக்த꞉ ஸமாசரன் ॥

27: |-
    ப்ரக்ருʼதே꞉ க்ரியமாணானி கு³ணை꞉ கர்மாணி ஸர்வஶ꞉ ।
    அஹங்கார-விமூடா⁴த்மா கர்தாஹமிதி மன்யதே ॥

28: |-
    தத்த்வ-வித்து மஹாபா³ஹோ கு³ண-கர்ம-விபா⁴க³யோ꞉ ।
    கு³ணா கு³ணேஷு வர்தந்தே இதி மத்வா ந ஸஜ்ஜதே ॥

29: |-
    ப்ரக்ருʼதேர்கு³ண-ஸம்மூடா⁴꞉ ஸஜ்ஜந்தே கு³ண-கர்மஸு ।
    தானக்ருʼத்ஸ்ன-விதோ³ மந்தா³ன் க்ருʼத்ஸ்ன-வின்ன விசாலயேத் ॥

30: |-
    மயி ஸர்வாணி கர்மாணி ஸம்ʼந்யஸ்யாத்⁴யாத்ம-சேதஸா ।
    நிராஶீர்நிர்மமோ பூ⁴த்வா யுத்⁴யஸ்வ விக³த-ஜ்வர꞉ ॥        

31: |-
    யே மே மதமித³ம்ʼ நித்யம்ʼ அனு-திஷ்ட²ந்தி மானவா꞉ ।
    ஶ்ர்ரத்³தா⁴வந்தோ(அ)னஸூயந்தோ முச்யந்தே தே(அ)பி கர்மபி⁴꞉ ॥

32: |-
    யே த்வேதத³ப்⁴யஸூயந்தோ நானு-திஷ்ட²ந்தி மே மதம் ।
    ஸர்வ-ஜ்ஞான-விமூடா⁴ம்ʼஸ்தான் வித்³தி⁴ நஷ்டானசேதஸ꞉ ॥

33: |-
    ஸத்³ருʼஶம்ʼ சேஷ்டதே ஸ்வஸ்யா꞉ ப்ரக்ருʼதேர்ஜ்ஞான-வானபி ।
    ப்ரக்ருʼதிம்ʼ யாந்தி பூ⁴தானி நிக்³ரஹ꞉ கிம்ʼ கரிஷ்யதி ॥

34: |-
    இந்த்³ரியஸ்யேந்த்³ரியஸ்யார்தே² ராக³-த்³வேஷௌ வ்யவஸ்தி²தௌ ।
    தயோர்ன வஶமாக³ச்சே²த் தௌ ஹ்யஸ்ய பரி-பந்தி²னௌ ॥

35: |-
    ஶ்ரேயான் ஸ்வ-த⁴ர்மோ விகு³ண꞉ பர-த⁴ர்மாத் ஸ்வனுஷ்டி²தாத் ।
    ஸ்வ-த⁴ர்மே நித⁴னம்ʼ ஶ்ரேய꞉ பர-த⁴ர்மோ ப⁴யாவஹ꞉ ॥

36: |-
    அத² கேன ப்ரயுக்தோ(அ)யம்ʼ பாபம்ʼ சரதி பூருஷ꞉ ।
    அனிச்ச²ன்னபி வார்ஷ்ணேய ப³லாதி³வ நியோஜித꞉ ॥

37: |-
    காம ஏஷ꞉ க்ரோத⁴ ஏஷ꞉ ரஜோகு³ண-ஸமுத்³ப⁴வ꞉ ।
    மஹாஶனோ மஹாபாப்மா வித்³த்⁴யேனமிஹ வைரிணம் ॥

38: |-
    தூ⁴மேனாவ்ரியதே வஹ்னி꞉ யதா²த³ர்ஶோ மலேன ச ।
    யதோ²ல்பே³னாவ்ருʼதோ க³ர்ப⁴꞉ ததா² தேனேத³மாவ்ருʼதம் ॥

39: |-
    ஆவ்ருʼதம்ʼ ஜ்ஞானமேதேன ஜ்ஞானினோ நித்ய-வைரிணா ।
    காம-ரூபேண கௌந்தேய து³ஷ்பூரேணானலேன ச ॥

40: |-
    இந்த்³ரியாணி மனோ பு³த்³தி⁴꞉ அஸ்யாதி⁴ஷ்டா²னமுச்யதே ।
    ஏதைர்விமோஹயத்யேஷ꞉ ஜ்ஞானமாவ்ருʼத்ய தே³ஹினம் ॥

41: |-
    தஸ்மாத் த்வமிந்த்³ரியாண்யாதௌ³ நியம்ய ப⁴ரதர்ஷப⁴ ।
    பாப்மானம்ʼ ப்ரஜஹி ஹ்யேனம்ʼ ஜ்ஞான-விஜ்ஞான-நாஶனம் ॥

42: |-
    இந்த்³ரியாணி பராண்யாஹு꞉ இந்த்³ரியேப்⁴ய꞉ பரம்ʼ மன꞉ ।
    மனஸ்தஸ்து பரா பு³த்³தி⁴꞉ யோ பு³த்³தே⁴꞉ பரதஸ்து ஸ꞉ ॥

43: |-
    ஏவம்ʼ பு³த்³தே⁴꞉ பரம்ʼ பு³த்³த்⁴வாஸம்ʼஸ்தப்⁴யாத்மானமாத்மனா ।
    ஜஹி ஶத்ரும்ʼ மஹாபா³ஹோ காம-ரூபம்ʼ து³ராஸத³ம் ॥

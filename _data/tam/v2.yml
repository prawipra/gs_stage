1: |-
    தம்ʼ ததா² க்ருʼபயா(ஆ)விஷ்டம்ʼ அஶ்ரு-பூர்ணாகுலேக்ஷணம் ।
    விஷீத³ந்தமித³ம்ʼ வாக்யம்ʼ உவாச மது⁴-ஸூத³ன꞉ ॥

2: |-
    குதஸ்த்வா கஶ்மலமித³ம்ʼ விஷமே ஸமுபஸ்தி²தம் ।
    அனார்ய-ஜுஷ்டமஸ்வர்க்³யம்ʼ அகீர்தி-கரமர்ஜுன ॥

3: |-
    க்லைப்³யம்ʼ மாஸ்ம க³ம꞉ பார்த² நைதத் த்வய்யுப-பத்³யதே ।
    க்ஷுத்³ரம்ʼ ஹ்ருʼத³ய-தௌ³ர்ப³ல்யம்ʼ த்யக்த்வோத்திஷ்ட² பரம்ʼ தப ॥

4: |-
    கத²ம்ʼ பீ⁴ஷ்மமஹம்ʼ ஸங்கே² த்³ரோணம்ʼ ச மது⁴-ஸூத³ன ।
    இஷுபி⁴꞉ ப்ரதி-யோத்ஸ்யாமி பூஜார்ஹாவரி-ஸூத³ன ॥

5: |-
    கு³ரூனஹத்வா ஹி மஹானு-பா⁴வான்
    ஶ்ரேயோ போ⁴க்தும்ʼ பை⁴க்ஷ்யமபீஹ லோகே ।
    ஹத்வா(அ)ர்த²-காமாம்ʼஸ்து கு³ரூனிஹைவ
    பு⁴ஞ்ஜீய போ⁴கா³ன் ருதி⁴ர-ப்ரதி³க்³தா⁴ன் ॥

6: |-
    ந சைதத்³ வித்³ம꞉ கதரன்னோ க³ரீயோ
    யத்³வா ஜயேம யதி³ வா நோ ஜயேயு꞉ ।
    யானேவ ஹத்வா ந ஜிஜீவிஷாம꞉
    தே(அ)வ-ஸ்தி²தா꞉ ப்ரமுகே² தா⁴ர்தராஷ்ட்ரா꞉ ॥

7: |-
    கார்பண்ய-தோ³ஷோபஹத-ஸ்வபா⁴வ꞉
    ப்ருʼச்சா²மி த்வா த⁴ர்ம-ஸம்மூட⁴-சேதா꞉ ।
    யச்ச்²ரேய꞉ ஸ்யாந்நிஶ்சிதம்ʼ ப்³ரூஹி தன்மே
    ஶிஷ்யஸ்தே(அ)ஹம்ʼ ஶாதி⁴ மாம்ʼ த்வாம்ʼ ப்ரபன்னம் ॥

8: |-
    ந ஹி ப்ர-பஶ்யாமி மமாப-நுத்³யாத்
    யச்சோ²கமுச்சோ²ஷணமிந்த்³ரியாணாம் ।
    அவாப்ய பூ⁴மாவஸபத்னம்ருʼத்³த⁴ம்ʼ
    ராஜ்யம்ʼ ஸுராணாமபி சா(அ)தி⁴பத்யம் ॥

9: |-
    ஏவமுக்த்வா ஹ்ருʼஷீகேஶம்ʼ கு³டா³கேஶ꞉ பரம்ʼ-தப꞉ ।
    ந யோத்ஸ்ய இதி கோ³விந்த³ம்ʼ உக்த்வா தூஷ்ணீம்ʼ ப³பூ⁴வ ஹ ॥

10: |-
    தமுவாச ஹ்ருʼஷீகேஶ꞉ ப்ரஹஸன்னிவ பா⁴ரத ।
    ஸேனயோருப⁴யோர்மத்⁴யே விஷீத³ந்தமித³ம்ʼ வச꞉ ॥

11: |-
    அஶோச்யானன்வஶோசஸ்த்வம்ʼ ப்ரஜ்ஞாவாதா³ம்ʼஶ்ச பா⁴ஷஸே ।
    க³தாஸூனக³தாஸூம்ʼஶ்ச நானு-ஶோசந்தி பண்டி³தா꞉ ॥

12: |-
    நத்வேவாஹம்ʼ ஜாது நா(அ)ஸம்ʼ ந த்வம்ʼ நேமே ஜனாதி⁴-பா꞉ ।
    ந சைவ ந ப⁴விஷ்யாம꞉ ஸர்வே வயமத꞉ பரம் ॥

13: |-
    தே³ஹினோ(அ)ஸ்மின் யதா² தே³ஹே கௌமாரம்ʼ யௌவனம்ʼ ஜரா ।
    ததா² தே³ஹாந்தர-ப்ராப்தி꞉ தீ⁴ரஸ்தத்ர ந முஹ்யதி ॥

14: |-
    மாத்ரா-ஸ்பர்ஶாஸ்து கௌந்தேய ஶீதோஷ்ண-ஸுக²-து³꞉க²-தா³꞉ ।
    ஆக³மாபாயினோ(அ)நித்யா꞉ தாம்ʼஸ்திதிக்ஷஸ்வ பா⁴ரத ॥

15: |-
    யம்ʼ ஹி ந வ்யத²யந்த்யேதே புருஷம்ʼ புருஷர்ஷப⁴ ।
    ஸம-து³꞉க²-ஸுக²ம்ʼ தீ⁴ரம்ʼ ஸோ(அ)ம்ருʼத-த்வாய கல்பதே ॥

16: |-
    நாஸதோ வித்³யதே(அ)பா⁴வோ நாபா⁴வோ வித்³யதே ஸத꞉ ।
    உப⁴யோரபி த்³ருʼஷ்டோம்ʼ(அ)த꞉ த்வனயோஸ்தத்த்வ-த³ர்ஶிபி⁴꞉ ॥

17: |-
    அவிநாஶி து தத்³ வித்³தி⁴ யேன ஸர்வமித³ம்ʼ ததம் ।
    விநாஶமவ்யயஸ்யாஸ்ய ந கஶ்சித் கர்துமர்ஹதி ॥

18: |-
    அந்த-வந்த இமே தே³ஹா꞉ நித்யஸ்யோக்தா꞉ ஶரீரிண꞉ ।
    அநாஶினோ(அ)ப்ர-மேயஸ்ய தஸ்மாத்³ யுத்⁴யஸ்வ பா⁴ரத ॥

19: |-
    ய ஏனம்ʼ வேத்தி ஹந்தாரம்ʼ யஶ்சைனம்ʼ மன்யதே ஹதம் ।
    உபௌ⁴ தௌ ந விஜானீதோ நாயம்ʼ ஹந்தி ந ஹன்யதே ॥

20: |-
    ந ஜாயதே ம்ரியதே வா கதா³சித்
    நாயம்ʼ பூ⁴த்வா ப⁴விதா வா ந பூ⁴ய꞉ ।
    அஜோ நித்ய꞉ ஶாஶ்வதோ(அ)யம்ʼ புராணோ
    ந ஹன்யதே ஹன்யமானே ஶரீரே ॥

21: |-
    வேதா³வி-நாஶினம்ʼ நித்யம்ʼ ய ஏனமஜமவ்யயம் ।
    கத²ம்ʼ ஸ புருஷ꞉ பார்த² கம்ʼ கா⁴தயதி ஹந்தி கம் ॥

22: |-
    வாஸாம்ʼஸி ஜீர்ணானி யதா² விஹாய
    நவானி க்³ருʼஹ்ணாதி நரோ(அ)பராணி ।
    ததா² ஶரீராணி விஹாய ஜீர்ணானி
    அன்யானி ஸம்ʼயாதி நவானி தே³ஹீ ॥

23: |-
    நைனம்ʼ சி²ந்த³ந்தி ஶஸ்த்ராணி நைனம்ʼ த³ஹதி பாவக꞉ ।
    ந சைனம்ʼ க்லேத³யந்த்யாபோ ந ஶோஷயதி மாருத꞉ ॥

24: |-
    அச்சே²த்³யோ(அ)யமதா³ஹ்யோ(அ)யம்ʼ அக்லேத்³யோ(அ)ஶோஷ்ய ஏவ ச ।
    நித்ய꞉ ஸர்வ-க³த-ஸ்தா²ணு꞉ அசலோ(அ)யம்ʼ ஸனாதன꞉ ॥

25: |-
    அவ்யக்தோ(அ)யமசிந்த்யோ(அ)யம்ʼ அவிகார்யோ(அ)யமுச்யதே ।
    தஸ்மாதே³வம்ʼ விதி³த்வைனம்ʼ நானு-ஶோசிதுமர்ஹஸி ॥

26: |-
    அத² சைனம்ʼ நித்ய-ஜாதம்ʼ நித்யம்ʼ வா மன்யஸே ம்ருʼதம் ।
    ததா²(அ)பி த்வம்ʼ மஹாபா³ஹோ நைனம்ʼ ஶோசிதுமர்ஹஸி ॥

27: |-
    ஜாதஸ்ய ஹி த்⁴ருவோ ம்ருʼத்யு꞉ த்⁴ருவம்ʼ ஜன்ம ம்ருʼதஸ்ய ச ।
    தஸ்மாத³பரி-ஹார்யே(அ)ர்தே² ந த்வம்ʼ ஶோசிதுமர்ஹஸி ॥

28: |-
    அவ்யக்தாதீ³னி பூ⁴தானி வ்யக்த-மத்⁴யானி பா⁴ரத ।
    அவ்யக்த-நித⁴னான்யேவ தத்ர கா பரி-தே³வனா ॥

29: |-
    ஆஶ்சர்ய-வத் பஶ்யதி கஶ்சிதே³னம்ʼ
    ஆஶ்சர்ய-வத்³ வத³தி ததை²வ சான்ய꞉ ।
    ஆஶ்சர்ய-வச்செைனமன்ய꞉ ஶ்ருʼணோதி
    ஶ்ருத்வா(அ)ப்யேனம்ʼ வேத³ நசைவ கஶ்சித் ॥

30: |-
    தே³ஹீ நித்யமவத்⁴யோ(அ)யம்ʼ தே³ஹே ஸர்வஸ்ய பா⁴ரத ।
    தஸ்மாத் ஸர்வாணி பூ⁴தானி ந த்வம்ʼ ஶோசிதுமர்ஹஸி ॥

31: |-
    ஸ்வ-த⁴ர்மமபி சாவேக்ஷ்ய ந வி-கம்பிதுமர்ஹஸி ।
    த⁴ர்ம்யாத்³தி⁴ யுத்³தா⁴ச்ச்²ரேயோ(அ)ன்யத் க்ஷத்ரியஸ்ய ந வித்³யதே ॥

32: |-
    யத்³ருʼச்ச²யா சோப-பன்னம்ʼ ஸ்வர்க³-த்³வாரமபாவ்ருʼதம் ।
    ஸுகி²ன꞉ க்ஷத்ரியா꞉ பார்த² லப⁴ந்தே யுத்³த⁴மீத்³ருʼஶம் ॥

33: |-
    அத² சேத் த்வம்ʼ த⁴ர்ம்யமிமம்ʼ ஸங்க்³ராமம்ʼ ந கரிஷ்யஸி ।
    தத꞉ ஸ்வ-த⁴ர்மம்ʼ கீர்திம்ʼ ச ஹித்வா பாபமவாப்ஸ்யஸி ॥

34: |-
    அகீர்திம்ʼ சாபி பூ⁴தானி கத²யிஷ்யந்தி தே(அ)வ்யயாம் ।
    ஸம்ʼ-பா⁴விதஸ்ய சாகீர்தி꞉ மரணாத³தி-ரிச்யதே ॥

35: |-
    ப⁴யாத்³ ரணாது³ப-ரதம்ʼ மம்ʼஸ்யந்தே த்வாம்ʼ மஹாரதா²꞉ ।
    யேஷாம்ʼ ச த்வம்ʼ ப³ஹு-மதோ பூ⁴த்வா யாஸ்யஸி லாக⁴வம் ॥

36: |-
    அவாச்ய-வாதா³ம்ʼஶ்ச ப³ஹூன் வதி³ஷ்யந்தி தவாஹிதா꞉ ।
    நிந்த³ந்தஸ்தவ ஸாமர்த்²யம்ʼ ததோ து³꞉க²-தரம்ʼ நு கிம் ॥

37: |-
    ஹதோ வா ப்ராப்ஸ்யஸி ஸ்வர்க³ம்ʼ ஜித்வா வா போ⁴க்ஷ்யஸே மஹீம் ।
    தஸ்மாது³த்திஷ்ட² கௌந்தேய யுத்³தா⁴ய க்ருʼத-நிஶ்சய꞉ ॥

38: |-
    ஸுக²-து³꞉கே² ஸமே க்ருʼத்வா லாபா⁴லாபௌ⁴ ஜயாஜயௌ ।
    ததோ யுத்³தா⁴ய யுஜ்யஸ்வ நைவம்ʼ பாபமவாப்ஸ்யஸி ॥

39: |-
    ஏஷா தே(அ)பி⁴-ஹிதா ஸாங்க்²யே பு³த்³தி⁴ர்யோகே³ த்விமாம்ʼ ஶ்ருʼணு ।
    பு³த்³த்⁴யாயுக்தோ யயா பார்த² கர்ம-ப³ந்த⁴ம்ʼ ப்ரஹாஸ்யஸி ॥

40: |-
    நேஹாபி⁴-க்ரம-நாஶோ(அ)ஸ்தி ப்ரத்யவாயோ ந வித்³யதே ।
    ஸ்வல்பமப்யஸ்ய த⁴ர்மஸ்ய த்ராயதே மஹதோ ப⁴யாத் ॥

41: |-
    வ்யவஸாயாத்மிகா பு³த்³தி⁴꞉ ஏகேஹ குரு-நந்த³ன ।
    ப³ஹு-ஶாகா² ஹ்யனந்தாஶ்ச பு³த்³த⁴யோ(அ)வ்யவஸாயினாம் ॥

42: |-
    யாமிமாம்ʼ புஷ்பிதாம்ʼ வாசம்ʼ ப்ரவத³ந்த்யவிபஶ்சித꞉ ।
    வேத³-வாத³-ரதா꞉ பார்த² நான்யத³ஸ்தீதி வாதி³ன꞉ ॥

43: |-
    காமாத்மான꞉ ஸ்வர்க³-பரா ஜன்ம-கர்ம-ப²ல-ப்ரதா³ம் ।
    க்ரியா-விஶேஷ-ப³ஹுலாம்ʼ போ⁴கை³ஶ்வர்ய-க³திம்ʼ ப்ரதி ॥

44: |-
    போ⁴கை³ஶ்வர்ய-ப்ரஸக்தானாம்ʼ தயா(அ)ப-ஹ்ருʼத-சேதஸாம் ।
    வ்யவஸாயாத்மிகா பு³த்³தி⁴꞉ ஸமாதௌ⁴ ந விதீ⁴யதே ॥

45: |-
    த்ரைகு³ண்ய-விஷயா வேதா³꞉ நிஸ்த்ரைகு³ண்யோ ப⁴வார்ஜுன ।
    நிர்த்³வந்த்³வோ நித்ய-ஸத்த்வ-ஸ்தோ² நிர்யோக³-க்ஷேம ஆத்ம-வான் ॥

46: |-
    யாவானர்த² உத³-பானே ஸர்வத꞉ ஸம்ʼ-ப்லுதோத³கே ।
    தாவான் ஸர்வேஷு வேதே³ஷு ப்³ராஹ்மணஸ்ய வி-ஜானத꞉ ॥

47: |-
    கர்மண்யேவாதி⁴-காரஸ்தே மா ப²லேஷு கதா³சன ।
    மா கர்ம-ப²ல-ஹேதுர்பூ⁴꞉ மா தே ஸங்கோ³(அ)ஸ்த்வகர்மணி ॥

48: |-
    யோக³-ஸ்த²꞉ குரு கர்மாணி ஸங்க³ம்ʼ த்யக்த்வா த⁴னம்ʼ-ஜய ।
    ஸித்³த்⁴யஸித்³த்⁴யோ꞉ ஸமோ பூ⁴த்வா ஸமத்வம்ʼ யோக³ உச்யதே ॥

49: |-
    தூ³ரேண ஹ்யவரம்ʼ கர்ம பு³த்³தி⁴-யோகா³த்³ த⁴னம்ʼ-ஜய ।
    பு³த்³தௌ⁴ ஶரணமன்விச்ச² க்ருʼபணா꞉ ப²ல-ஹேதவ꞉ ॥

50: |-
    பு³த்³தி⁴-யுக்தோ ஜஹாதீஹ உபே⁴ ஸுக்ருʼத-து³ஷ்க்ருʼதே ।
    தஸ்மாத்³ யோகா³ய யுஜ்யஸ்வ யோக³꞉ கர்மஸு கௌஶலம் ॥

51: |-
    கர்ம-ஜம்ʼ பு³த்³தி⁴-யுக்தா ஹி ப²லம்ʼ த்யக்த்வா மனீஷிண꞉ ।
    ஜன்ம-ப³ந்த⁴-விநிர்முக்தா꞉ பத³ம்ʼ க³ச்ச²ந்த்யநாமயம் ॥

52: |-
    யதா³ தே மோஹ-கலிலம்ʼ பு³த்³தி⁴ர்வ்யதி-தரிஷ்யதி ।
    ததா³ க³ந்தாஸி நிர்வேத³ம்ʼ ஶ்ரோதவ்யஸ்ய ஶ்ருதஸ்ய ச ॥

53: |-
    ஶ்ருதி-விப்ரதி-பன்னா தே யதா³ ஸ்தா²ஸ்யதி நிஶ்சலா ।
    ஸமாதா⁴வசலா பு³த்³தி⁴꞉ ததா³ யோக³மவாப்ஸ்யஸி ॥

54: |-
    ஸ்தி²த-ப்ரஜ்ஞஸ்ய கா பா⁴ஷா ஸமாதி⁴-ஸ்த²ஸ்ய கேஶவ ।
    ஸ்தி²த-தீ⁴꞉ கிம்ʼ ப்ர-பா⁴ஷேத கிமாஸீத வ்ரஜேத கிம் ॥

55: |-
    ப்ர-ஜஹாதி யதா³ காமான் ஸர்வான் பார்த² மனோக³தான் ।
    ஆத்மன்யேவா(அ)த்மனா துஷ்ட꞉ ஸ்தி²த-ப்ரஜ்ஞஸ்ததோ³ச்யதே ॥

56: |-
    து³꞉கே²ஷ்வனுத்³விக்³ன-மனா꞉ ஸுகே²ஷு விக³த-ஸ்ப்ருʼஹ꞉ ।
    வீத-ராக³-ப⁴ய-க்ரோத⁴꞉ ஸ்தி²த-தீ⁴ர்முநிருச்யதே ॥

57: |-
    ய꞉ ஸர்வத்ரானபி⁴ஸ்னேஹ꞉ தத்தத் ப்ராப்ய ஶுபா⁴ஶுப⁴ம் ।
    நாபி⁴ நந்த³தி ந த்³வேஷ்டி தஸ்ய ப்ரஜ்ஞா ப்ரதிஷ்டி²தா ॥

58: |-
    யதா³ ஸம்ʼ-ஹரதே சாயம்ʼ கூர்மோ(அ)ங்கா³னீவ ஸர்வஶ꞉ ।
    இந்த்³ரியாணீந்த்³ரியார்தே²ப்⁴ய꞉ தஸ்ய ப்ரஜ்ஞா ப்ரதிஷ்டி²தா ॥

59: |-
    விஷயா வினி-வர்தந்தே நிராஹாரஸ்ய தே³ஹின꞉ ।
    ரஸ-வர்ஜம்ʼ ரஸோ(அ)ப்யஸ்ய பரம்ʼ த்³ருʼஷ்ட்வா நிவர்ததே ॥

60: |-
    யததோ ஹ்யபி கௌந்தேய புருஷஸ்ய விபஶ்சித꞉ ।
    இந்த்³ரியாணி ப்ரமாதீ²னி ஹரந்தி ப்ரஸப⁴ம்ʼ மன꞉ ॥

61: |-
    தானி ஸர்வாணி ஸம்ʼயம்ய யுக்த ஆஸீத மத்பர꞉ ।
    வஶே ஹி யஸ்யேந்த்³ரியாணி தஸ்ய ப்ரஜ்ஞா ப்ரதிஷ்டி²தா ॥

62: |-
    த்⁴யாயதோ விஷயான் பும்ʼஸ꞉ ஸங்க³ஸ்தேஷூப-ஜாயதே ।
    ஸங்கா³த் ஸஞ்ஜாயதே காம꞉ காமாத் க்ரோதோ⁴(அ)பி⁴-ஜாயதே ॥

63: |-
    க்ரோதா⁴த்³ ப⁴வதி ஸம்மோஹ꞉ ஸம்மோஹாத் ஸ்ம்ருʼதி-விப்⁴ரம꞉ ।
    ஸ்ம்ருʼதி-ப்⁴ரம்ʼஶாத்³ பு³த்³தி⁴-நாஶோ பு³த்³தி⁴-நாஶாத்³ வினஶ்யதி ॥

64: |-
    ராக³-த்³வேஷ-விமுக்தைஸ்து விஷயானிந்த்³ரியைஶ்சரன் ।
    ஆத்ம-வஶ்ஶைர்விதே⁴யாத்மா ப்ரஸாத³மதி⁴-க³ச்ச²தி ॥

65: |-
    ப்ரஸாதே³ ஸர்வ-து³꞉கா²னாம்ʼ ஹாநிரஸ்யோப-ஜாயதே ।
    ப்ரஸன்ன-சேதஸோ ஹ்யாஶு பு³த்³தி⁴꞉ பர்யவ-திஷ்ட²தி ॥

66: |-
    நாஸ்தி பு³த்³தி⁴ரயுக்தஸ்ய நசாயுக்தஸ்ய பா⁴வனா ॥
    நசாபா⁴வயத꞉ ஶாந்தி꞉ அஶாந்தஸ்ய குத꞉ ஸுக²ம் ॥

67: |-
    இந்த்³ரியாணாம்ʼ ஹி சரதாம்ʼ யன்மனோ(அ)னு விதீ⁴யதே ।
    தத³ஸ்ய ஹரதி ப்ரஜ்ஞாம்ʼ வாயுர்னாவமிவாம்ப⁴ஸி ॥

68: |-
    தஸ்மாத்³ யஸ்ய மஹாபா³ஹோ நிக்³ருʼஹீதானி ஸர்வஶ꞉ ।
    இந்த்³ரியாணீந்த்³ரியார்தே²ப்⁴ய꞉ தஸ்ய ப்ரஜ்ஞா ப்ரதிஷ்டி²தா ॥

69: |-
    யா நிஶா ஸர்வ-பூ⁴தானாம்ʼ தஸ்யாம்ʼ ஜாக³ர்தி ஸம்ʼயமீ ।
    யஸ்யாம்ʼ ஜாக்³ரதி பூ⁴தானி ஸா நிஶா பஶ்யதோ முனே꞉ ॥

70: |-
    ஆபூர்யமாணமசல-ப்ரதிஷ்ட²ம்ʼ
    ஸமுத்³ரமாப꞉ ப்ரவிஶந்தி யத்³வத் ।
    தத்³வத் காமா யம்ʼ ப்ரவிஶந்தி ஸர்வே
    ஸ ஶாந்திமாப்னோதி ந காம-காமீ ॥

71: |-
    விஹாய காமான் ய꞉ ஸர்வான் புமாம்ʼஶ்சரதி நிஸ்ப்ருʼஹ꞉ ।
    நிர்மமோ நிரஹங்கார꞉ ஸ ஶாந்திமதி⁴-க³ச்ச²தி ॥

72: |-
    ஏஷா ப்³ராஹ்மீ ஸ்தி²தி꞉ பார்த² நைனாம்ʼ ப்ராப்ய வி-முஹ்யதி ।
    ஸ்தி²த்வா(அ)ஸ்யாமந்த-காலே(அ)பி ப்³ரஹ்ம நிர்பா³ணம்ருʼச்ச²தி ॥

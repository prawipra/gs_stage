1: |-
    அப⁴யம்ʼ ஸத்த்வ-ஸம்ʼஶுத்³தி⁴꞉ ஜ்ஞான-யோக³-வ்யவஸ்தி²தி꞉ ।
    தா³னம்ʼ த³மஶ்ச யஜ்ஞஶ்ச ஸ்வாத்⁴யாயஸ்தப ஆர்ஜவம் ॥

2: |-
    அஹிம்ʼஸா ஸத்யமக்ரோத⁴꞉ த்யாக³꞉ ஶாந்திரபைஶுனம் ।
    த³யா பூ⁴தேஷ்வலோலுத்வம்ʼ மார்த³வம்ʼ ஹ்ரீரசாபலம் ॥

3: |-
    தேஜ꞉ க்ஷமா த்⁴ருʼதி꞉ ஶௌசம்ʼ அத்³ரோஹோ நாதி-மானிதா ।
    ப⁴வந்தி ஸம்பத³ம்ʼ தை³வீம்ʼ அபி⁴-ஜாதஸ்ய பா⁴ரத ॥

4: |-
    ட³ம்போ⁴ த³ர்போ(அ)பி⁴-மானஶ்ச க்ரோத⁴꞉ பாருஷ்யமேவ ச ।
    அஜ்ஞானம்ʼ சாபி⁴-ஜாதஸ்ய பார்த² ஸம்பத³மாஸுரீம் ॥

5: |-
    தை³வீ ஸம்பத்³ விமோக்ஷாய நிப³ந்தா⁴யா(அ)ஸுரீ மதா ।
    மா ஶுச꞉ ஸம்பத³ம்ʼ தை³வீம்ʼ அபி⁴-ஜாதோ(அ)ஸி பாண்ட³வ ॥

6: |-
    த்³வௌ பூ⁴த-ஸர்கௌ³ லோகே(அ)ஸ்மின் தை³வ ஆஸுர ஏவ ச ।
    தை³வோ விஸ்தரஶ꞉ ப்ரோக்த꞉ ஆஸுரம்ʼ பார்த² மே ஶ்ருʼணு ॥

7: |-
    ப்ரவ்ருʼத்திம்ʼ ச நிவ்ருʼத்திம்ʼ ச ஜனா ந விது³ராஸுரா꞉ ।
    ந ஶௌசம்ʼ நாபி சா(அ)சாரோ ந ஸத்யம்ʼ தேஷு வித்³யதே ॥

8: |-
    அஸத்யமப்ரதிஷ்ட²ம்ʼ தே ஜக³தா³ஹுரனீஶ்வரம் ।
    அபரஸ்பர-ஸம்பூ⁴தம்ʼ கிமன்யத் காம-ஹைதுகம் ॥

9: |-
    ஏதாம்ʼ த்³ருʼஷ்டிமவஷ்டப்⁴ய நஷ்டாத்மானோ(அ)ல்ப-பு³த்³த⁴ய꞉ ।
    ப்ரப⁴வந்த்யுக்³ர-கர்மாண꞉ க்ஷயாய ஜக³தோ(அ)ஹிதா꞉ ॥

10: |-
    காமமாஶ்ரித்ய து³ஷ்பூரம்ʼ ட³ம்ப⁴-மான-மதா³ன்விதா꞉ ।
    மோஹாத்³ க்³ருʼஹீத்வா(அ)ஸத்³-க்³ராஹான் ப்ரவர்தந்தே(அ)ஶுசி-வ்ரதா꞉ ॥

11: |-
    சிந்தாமபரி-மேயாம்ʼ ச ப்ரளயாந்தாமுபாஶ்ரிதா꞉ ।
    காமோப-போ⁴க³-பரமா꞉ ஏதாவதி³தி நிஶ்சிதா꞉ ॥

12: |-
    ஆஶா-பாஶ-ஶதைர்ப³த்³தா⁴꞉ காம-க்ரோத⁴-பராயணா꞉ ।
    ஈஹந்தே காம-போ⁴கா³ர்த²ம்ʼ அந்யாயேனார்த²-ஸஞ்சயான் ॥

13: |-
    இத³மத்³ய மயா லப்³த⁴ம்ʼ இமம்ʼ ப்ராப்ஸ்யே மனோ-ரத²ம் ।
    இத³மஸ்தீத³மபி மே ப⁴விஷ்யதி புனர்த⁴னம் ॥

14: |-
    அஸௌ மயா ஹத꞉ ஶத்ரு꞉ ஹநிஷ்யே சாபரானபி ।
    ஈஶ்வரோ(அ)ஹமஹம்ʼ போ⁴கீ³ ஸித்³தோ⁴(அ)ஹம்ʼ ப³ல-வான் ஸுகீ² ॥

15: |-
    ஆட்⁴யோ(அ)பி⁴ஜன-வானஸ்மி கோ(அ)ன்யோ(அ)ஸ்தி ஸத்³ருʼஶோ மயா ।
    யக்ஷ்யே தா³ஸ்யாமி மோதி³ஷ்ய இத்யஜ்ஞான-விமோஹிதா꞉ ॥

16: |-
    அனேக-சித்த-விப்⁴ராந்தா மோஹ-ஜால-ஸமாவ்ருʼதா꞉ ।
    ப்ரஸக்தா꞉ காம-போ⁴கே³ஷு பதந்தி நரகே(அ)ஶுசௌ ॥

17: |-
    ஆத்ம-ஸம்பா⁴விதா꞉ ஸ்தப்³தா⁴꞉ த⁴ன-மான-மதா³ன்விதா꞉ ।
    யஜந்தே நாம யஜ்ஞைஸ்தே ட³ம்பே⁴னாவிதி⁴-பூர்வகம் ॥

18: |-
    அஹம்ʼ-காரம்ʼ ப³லம்ʼ த³ர்பம்ʼ காமம்ʼ க்ரோத⁴ம்ʼ ச ஸம்ʼஶ்ரிதா꞉ ।
    மாமாத்ம-பர-தே³ஹேஷு ப்ரத்³விஷந்தோ(அ)ப்⁴யஸூயகா꞉ ॥

19: |-
    தானஹம்ʼ த்³விஷத꞉ க்ரூரான் ஸம்ʼ-ஸாரேஷு நராத⁴மான் ।
    க்ஷிபாம்யஜஸ்ரமஶுபா⁴ன் ஆஸுரீஷ்வேவ யோநிஷு ॥

20: |-
    ஆஸுரீம்ʼ யோனிமாபன்னா மூடா⁴ ஜன்மனி-ஜன்மனி ।
    மாமப்ராப்யைவ கௌந்தேய ததோ யாந்த்யத⁴மாம்ʼ க³திம் ॥

21: |-
    த்ரி-வித⁴ம்ʼ நரகஸ்யேத³ம்ʼ த்³வாரம்ʼ நாஶனமாத்மன꞉ ।
    காம꞉ க்ரோத⁴ஸ்ததா² லோப⁴꞉ தஸ்மாதே³தத் த்ரயம்ʼ த்யஜேத் ॥

22: |-
    ஏதைர்விமுக்த꞉ கௌந்தேய தமோ-த்³வாரைஸ்த்ரிபி⁴ர்னர꞉ ।
    ஆசரத்யாத்மன꞉ ஶ்ரேய꞉ ததோ யாதி பராம்ʼ க³திம் ॥

23: |-
    ய꞉ ஶாஸ்த்ர-விதி⁴முத்ஸ்ருʼஜ்ய வர்ததே காம-காரத꞉ ।
    ந ஸ ஸித்³தி⁴மவாப்னோதி ந ஸுக²ம்ʼ ந பராம்ʼ க³திம் ॥

24: |-
    தஸ்மாச்சா²ஸ்த்ரம்ʼ ப்ரமாணம்ʼ தே கார்யாகார்ய-வ்யவஸ்தி²தௌ ।
    ஜ்ஞாத்வா ஶாஸ்த்ர-விதா⁴னோக்தம்ʼ கர்ம கர்துமிஹார்ஹஸி ॥

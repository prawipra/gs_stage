1: |-
    இமம்ʼ விவஸ்வதே யோக³ம்ʼ ப்ரோக்தவானஹமவ்யயம் ।
    விவஸ்வான் மனவே ப்ராஹ மனுரிக்ஷ்வாகவே(அ)ப்³ரவீத் ॥

2: |-
    ஏவம்ʼ பரம்பரா-ப்ராப்தம்ʼ இமம்ʼ ராஜர்ஷயோ விது³꞉ ।
    ஸ காலேனேஹ மஹதா யோகோ³ நஷ்ட꞉ பரம்ʼ-தப ॥

3: |-
    ஸ ஏவாயம்ʼ மயா தே(அ)த்³ய யோக³꞉ ப்ரோக்த꞉ புராதன꞉ ।
    ப⁴க்தோ(அ)ஸி மே ஸகா² சேதி ரஹஸ்யம்ʼ ஹ்யேதது³த்தமம் ॥

4: |-
    அபரம்ʼ ப⁴வதோ ஜன்ம பரம்ʼ ஜன்ம விவஸ்வத꞉ ।
    கத²மேதத்³ வி-ஜானீயாம்ʼ த்வமாதௌ³ ப்ரோக்தவானிதி ॥

5: |-
    ப³ஹூனி மே வ்யதீதானி ஜன்மானி தவ சார்ஜுன ।
    தான்யஹம்ʼ வேத³ ஸர்வாணி ந த்வம்ʼ வேத்த² பரம்ʼ தப ॥

6: |-
    அஜோ(அ)பி ஸந்நவ்யயாத்மா பூ⁴தாநாமீஶ்வரோ(அ)பி ஸன் ।
    ப்ரக்ருʼதிம்ʼ ஸ்வாமதி⁴ஷ்டா²ய ஸம்ʼ-ப⁴வாம்யாத்ம-மாயயா ॥

7: |-
    யதா³ யதா³ ஹி த⁴ர்மஸ்ய க்³லாநிர்ப⁴வதி பா⁴ரத ।
    அப்⁴யுத்தா²னமத⁴ர்மஸ்ய ததா³(ஆ)த்மானம்ʼ ஸ்ருʼஜாம்யஹம் ॥

8: |-
    பரி-த்ராணாய ஸாதூ⁴னாம்ʼ வி-நாஶாய ச து³ஷ்க்ருʼதாம் ।
    த⁴ர்ம-ஸம்ʼ-ஸ்தா²பனார்தா²ய ஸம்ʼ-ப⁴வாமி யுகே³-யுகே³ ॥

9: |-
    ஜன்ம கர்ம ச மே தி³வ்யம்ʼ ஏவம்ʼ யோ வேத்தி தத்வத꞉ ।
    த்யக்த்வா தே³ஹம்ʼ புனர்ஜன்ம நைதி மாமேதி ஸோ(அ)ர்ஜுன ॥

10: |-
    வீத-ராக³-ப⁴ய-க்ரோதா⁴꞉ மன்மயா மாமுபாஶ்ரிதா꞉ ।
    ப³ஹவோ ஜ்ஞான-தபஸா பூதா மத்³பா⁴வமாக³தா꞉ ॥

11: |-
    யே யதா² மாம்ʼ ப்ரபத்³யந்தே தாம்ʼஸ்ததை²வ ப⁴ஜாம்யஹம் ।
    மம வர்த்மானு-வர்தந்தே மனுஷ்யா꞉ பார்த² ஸர்வஶ꞉ ॥

12: |-
    காங்க்ஷந்த꞉ கர்மணாம்ʼ ஸித்³தி⁴ம்ʼ யஜந்த இஹ தே³வதா꞉ ।
    க்ஷிப்ரம்ʼ ஹி மானுஷே லோகே ஸித்³தி⁴ர்ப⁴வதி கர்ம-ஜா ॥

13: |-
    சாதுர்வர்ண்யம்ʼ மயா ஸ்ருʼஷ்டம்ʼ கு³ண-கர்ம-விபா⁴க³ஶ꞉ ।
    தஸ்ய கர்தாரமபி மாம்ʼ வித்³த்⁴யகர்தாரமவ்யயம் ॥

14: |-
    ந மாம்ʼ கர்மாணி லிம்பந்தி ந மே கர்ம-ப²லே ஸ்ப்ருʼஹா ।
    இதி மாம்ʼ யோ(அ)பி⁴-ஜானாதி கர்மபி⁴ர்ன ஸ ப³த்⁴யதே ॥

15: |-
    ஏவம்ʼ ஜ்ஞாத்வா க்ருʼதம்ʼ கர்ம பூர்வைரபி முமுக்ஷுபி⁴꞉ ।
    குரு கர்மைவ தஸ்மாத் த்வம்ʼ பூர்வை꞉ பூர்வ-தரம்ʼ க்ருʼதம் ॥

16: |-
    கிம்ʼ கர்ம கிமகர்மேதி கவயோ(அ)ப்யத்ர மோஹிதா꞉ ।
    தத் தே கர்ம ப்ரவக்ஷ்யாமி யஜ்ஞத்வா மோக்ஷ்யஸே(அ)ஶுபா⁴த் ॥

17: |-
    கர்மணோ ஹ்யபி போ³த்³த⁴வ்யம்ʼ போ³த்³த⁴வ்யம்ʼ ச வி-கர்மண꞉ ।
    அகர்மணஶ்ச போ³த்³த⁴வ்யம்ʼ க³ஹனா கர்மணோ க³தி꞉ ॥

18: |-
    கர்மண்யகர்ம ய꞉ பஶ்யேத் அகர்மணி ச கர்ம ய꞉ ।
    ஸ பு³த்³தி⁴-மான் மனுஷ்யேஷு ஸ யுக்த꞉ க்ருʼத்ஸ்ன-கர்ம-க்ருʼத் ॥

19: |-
    யஸ்ய ஸர்வே ஸமாரம்பா⁴꞉ காம-ஸங்கல்ப-வர்ஜிதா꞉ ।
    ஜ்ஞாநாக்³னி-த³க்³த⁴-கர்மாணம்ʼ தமாஹு꞉ பண்டி³தம்ʼ பு³தா⁴꞉ ॥

20: |-
    த்யக்த்வா கர்ம-ப²லாஸங்க³ம்ʼ நித்ய-த்ருʼப்தோ நிராஶ்ரய꞉ ।
    கர்மண்யபி⁴-ப்ரவ்ருʼத்தோ(அ)பி நைவ கிஞ்சித் கரோதி ஸ꞉ ॥

21: |-
    நிராஶீர்யத-சித்தாத்மா த்யக்த-ஸர்வ-பரிக்³ரஹ꞉ ।
    ஶாரீரம்ʼ கேவலம்ʼ கர்ம குர்வன் நா(அ)ப்னோதி கில்பி³ஷம் ॥

22: |-
    யத்³ருʼச்சா²-லாப⁴-ஸந்துஷ்டோ த்³வந்த்³வாதீதோ வி-மத்ஸர꞉ ।
    ஸம꞉ ஸித்³தா⁴வஸித்³தௌ⁴ ச க்ருʼத்வா(அ)பி ந நி-ப³த்³த்⁴யதே ॥

23: |-
    க³த-ஸங்க³ஸ்ய முக்தஸ்ய ஜ்ஞானாவஸ்தி²த-சேதஸ꞉ ।
    யஜ்ஞாயா(அ)சரத꞉ கர்ம ஸமக்³ரம்ʼ ப்ரவி-லீயதே ॥

24: |-
    ப்³ரஹ்மார்பணம்ʼ ப்³ரஹ்ம-ஹவி꞉ ப்³ரஹ்மாக்³னௌ ப்³ரஹ்மணா ஹுதம் ।
    ப்³ரஹ்மெைவ தேன க³ந்தவ்யம்ʼ ப்³ரஹ்ம-கர்ம-ஸமாதி⁴னா ॥

25: |-
    தை³வமேவாபரே யஜ்ஞம்ʼ யோகி³ன꞉ பர்யுபாஸதே ।
    ப்³ரஹ்மாக்³னாவபரே யஜ்ஞம்ʼ யஜ்ஞேனைவோப-ஜுஹ்வதி ॥

26: |-
    ஶ்ரோத்ராதீ³னீந்த்³ரியாண்யன்யே ஸம்ʼ-யமாக்³நிஷு ஜுஹ்வதி ।
    ஶப்³தா³தீ³ன் விஷயானன்யே இந்த்³ரியாக்³நிஷு ஜுஹ்வதி ॥

27: |-
    ஸர்வாணீந்த்³ரிய-கர்மாணி ப்ராண-கர்மாணி சாபரே ।
    ஆத்ம-ஸம்ʼயம-யோகா³க்³னௌ ஜுஹ்வதி ஜ்ஞான-தீ³பிதே ॥

28: |-
    த்³ரவ்ய-யஜ்ஞாஸ்தபோ-யஜ்ஞா꞉ யோக³-யஜ்ஞாஸ்ததா² பரே ।
    ஸ்வாத்⁴யாய-ஜ்ஞான-யஜ்ஞாஶ்ச யதய꞉ ஸம்ʼஶித-வ்ரதா꞉ ॥

29: |-
    அபானே ஜுஹ்வதி ப்ராணம்ʼ ப்ராணே(அ)பானம்ʼ ததா² பரே ।
    ப்ராணாபான-க³தீ ருத்³த்⁴வா ப்ராணாயாம-பராயணா꞉ ॥

30: |-
    அபரே நியதாஹாரா꞉ ப்ராணான் ப்ராணேஷு ஜுஹ்வதி ।
    ஸர்வே(அ)ப்யேதே யஜ்ஞ-விதோ³ யஜ்ஞ-க்ஷபித-கல்மஷா꞉ ॥

31: |-
    யஜ்ஞ-ஶிஷ்டாம்ருʼத-பு⁴ஜோ யாந்தி ப்³ரஹ்ம ஸனாதனம் ।
    நாயம்ʼ லோகோ(அ)ஸ்த்யயஜ்ஞஸ்ய குதோ(அ)ன்ய꞉ குரு-ஸத்தம ॥

32: |-
    ஏவம்ʼ ப³ஹு-விதா⁴ யஜ்ஞா꞉ விததா ப்³ரஹ்மணோ முகே² ।
    கர்ம-ஜான் வித்³தி⁴ தான் ஸர்வான் ஏவம்ʼ ஜ்ஞாத்வா விமோக்ஷ்யஸே ॥

33: |-
    ஶ்ரேயான் த்³ரவ்ய-மயாத்³ யஜ்ஞாத் ஜ்ஞான-யஜ்ஞ꞉ பரம்ʼ-தப ।
    ஸர்வம்ʼ கர்மாகி²லம்ʼ பார்த² ஜ்ஞானே பரி-ஸமாப்யதே ॥

34: |-
    தத்³ வித்³தி⁴ ப்ரணிபாதேன பரி-ப்ரஶ்னேன ஸேவயா ।
    உபதே³க்ஷ்யந்தி தே ஜ்ஞானம்ʼ ஜ்ஞானினஸ்தத்த்வ-த³ர்ஶின꞉ ॥

35: |-
    யஜ்ஜ்ஞாத்வா ந புனர்மோஹம்ʼ ஏவம்ʼ யாஸ்யஸி பாண்ட³வ ।
    யேன பூ⁴தான்யஶேஷேண த்³ரக்ஷ்யஸ்யாத்மன்யதோ² மயி ॥

36: |-
    அபி சேத³ஸி பாபேப்⁴ய꞉ ஸர்வேப்⁴ய꞉ பாப-க்ருʼத்தம꞉ ।
    ஸர்வம்ʼ ஜ்ஞான-ப்லவேனைவ வ்ருʼஜினம்ʼ ஸம்ʼ-தரிஷ்யஸி ॥

37: |-
    யதை²தா⁴ம்ʼஸி ஸமித்³தோ⁴(அ)க்³னி꞉ ப⁴ஸ்மஸாத் குருதே(அ)ர்ஜுன ।
    ஜ்ஞாநாக்³னி꞉ ஸர்வ-கர்மாணி ப⁴ஸ்மஸாத் குருதே ததா² ॥

38: |-
    ந ஹி ஜ்ஞானேன ஸத்³ருʼஶம்ʼ பவித்ரமிஹ வித்³யதே ।
    தத் ஸ்வயம்ʼ யோக³-ஸம்ʼஸித்³த⁴꞉ காலேனா(அ)த்மனி விந்த³தி ॥

39: |-
    ஶ்ரத்³தா⁴-வான் லப⁴தே ஜ்ஞானம்ʼ மத்பர꞉ ஸம்ʼ-யதேந்த்³ரிய꞉ ।
    ஜ்ஞானம்ʼ லப்³த்⁴வா பராம்ʼ ஶாந்திம்ʼ அசிரேணாதி⁴-க³ச்ச²தி ॥

40: |-
    அஜ்ஞஶ்சாஶ்ரத்³த³தா⁴னஶ்ச ஸம்ʼஶயாத்மா வி-நஶ்யதி ।
    நாயம்ʼ லோகோ(அ)ஸ்தி ந பரோ ந ஸுக²ம்ʼ ஸம்ʼஶயாத்மன꞉ ॥

41: |-
    யோக³-ஸம்ʼந்யஸ்த-கர்மாணம்ʼ ஜ்ஞான-ஸஞ்சி²ன்ன-ஸம்ʼஶயம் ।
    ஆத்ம-வந்தம்ʼ ந கர்மாணி நி-ப³த்⁴னந்தி த⁴னம்ʼ-ஜய ॥

42: |-
    தஸ்மாத³ஜ்ஞான-ஸம்பூ⁴தம்ʼ ஹ்ருʼத்-ஸ்த²ம்ʼ ஜ்ஞானாஸினா(ஆ)த்மன꞉ ।
    சி²த்வைனம்ʼ ஸம்ʼஶயம்ʼ யோக³ம்ʼ ஆதிஷ்டோ²த்திஷ்ட² பா⁴ரத ॥

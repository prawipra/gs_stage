1: |-
    மய்யாஸக்த-மனா꞉ பார்த² யோக³ம்ʼ யுஞ்ஜன் மதா³ஶ்ரய꞉ ।
    அஸம்ʼஶயம்ʼ ஸமக்³ரம்ʼ மாம்ʼ யதா² ஜ்ஞாஸ்யஸி தச்ச்²ருʼணு ॥

2: |-
    ஜ்ஞானம்ʼ தே(அ)ஹம்ʼ ஸ-விஜ்ஞானம்ʼ இத³ம்ʼ வக்ஷ்யாம்யஶேஷத꞉ ।
    யஜாஜ்ஞத்வா நேஹ பூ⁴யோ(அ)ன்யத் ஜ்ஞாதவ்யமவ-ஶிஷ்யதே ॥

3: |-
    மனுஷ்யாணாம்ʼ ஸஹஸ்ரேஷு கஶ்சித்³ யததி ஸித்³த⁴யே ।
    யததாமபி ஸித்³தா⁴னாம்ʼ கஶ்சின்மாம்ʼ வேத்தி தத்த்வத꞉ ॥

4: |-
    பூ⁴மிராபோ(அ)னலோ வாயு꞉ க²ம்ʼ மனோ பு³த்³தி⁴ரேவ ச ।
    அஹம்ʼ-கார இதீயம்ʼ மே பி⁴ன்னா ப்ரக்ருʼதிரஷ்ட-தா⁴ ॥

5: |-
    அபரேயமிதஸ்த்வன்யாம்ʼ ப்ரக்ருʼதிம்ʼ வித்³தி⁴ மே பராம் ।
    ஜீவ-பூ⁴தாம்ʼ மஹாபா³ஹோ யயேத³ம்ʼ தா⁴ர்யதே ஜக³த் ॥

6: |-
    ஏதத்³யோனீனி பூ⁴தானி ஸர்வாணீத்யுப-தா⁴ரய ।
    அஹம்ʼ க்ருʼத்ஸ்னஸ்ய ஜக³த꞉ ப்ரப⁴வ꞉ ப்ரளயஸ்ததா² ॥

7: |-
    மத்த꞉ பர-தரம்ʼ நான்யத் கிஞ்சித³ஸ்தி த⁴னம்ʼ-ஜய ।
    மயி ஸர்வமித³ம்ʼ ப்ரோதம்ʼ ஸூத்ரே மணி-க³ணா இவ ॥

8: |-
    ரஸோ(அ)ஹமப்ஸு கௌந்தேய ப்ரபா⁴(அ)ஸ்மி ஶஶி-ஸூர்யயோ꞉ ।
    ப்ரணவ꞉ ஸர்வ-வேதே³ஷு ஶப்³த³꞉ கே² பௌருஷம்ʼ ந்ருʼஷு ॥

9: |-
    புண்யோ க³ந்த⁴꞉ ப்ருʼதி²வ்யாம்ʼ ச தேஜஶ்சாஸ்மி விபா⁴வஸௌ ।
    ஜீவனம்ʼ ஸர்வ-பூ⁴தேஷு தபஶ்சாஸ்மி தபஸ்விஷு ॥

10: |-
    பீ³ஜம்ʼ மாம்ʼ ஸர்வ-பூ⁴தானாம்ʼ வித்³தி⁴ பார்த² ஸனாதனம் ।
    பு³த்³தி⁴ர்பு³த்³தி⁴-மதாமஸ்மி தேஜஸ்தேஜஸ்விநாமஹம் ॥

11: |-
    ப³லம்ʼ ப³ல-வதாம்ʼ சாஹம்ʼ காம-ராக³-விவர்ஜிதம் ।
    த⁴ர்மாவிருத்³தோ⁴ பூ⁴தேஷு காமோ(அ)ஸ்மி ப⁴ரதர்ஷப⁴ ॥

12: |-
    யே சைவ ஸாத்த்விகா பா⁴வா꞉ ராஜஸாஸ்தாமஸாஶ்ச யே ।
    மத்த ஏவேதி தான் வித்³தி⁴ ந த்வஹம்ʼ தேஷு தே மயி ॥

13: |-
    த்ரிபி⁴ர்கு³ண-மயைர்பா⁴வை꞉ ஏபி⁴꞉ ஸர்வமித³ம்ʼ ஜக³த் ।
    மோஹிதம்ʼ நாபி⁴-ஜானாதி மாமேப்⁴ய꞉ பரமவ்யயம் ॥

14: |-
    தை³வீ ஹ்யேஷா கு³ண-மயீ மம மாயா து³ரத்யயா ।
    மாமேவ யே ப்ர-பத்³யந்தே மாயாமேதாம்ʼ தரந்தி தே ॥

15: |-
    ந மாம்ʼ து³ஷ்க்ருʼதினோ மூடா⁴꞉ ப்ர-பத்³யந்தே நராத⁴மா꞉ ।
    மாயயா(அ)ப-ஹ்ருʼத-ஜ்ஞானா꞉ ஆஸுரம்ʼ பா⁴வமாஶ்ரிதா꞉ ॥

16: |-
    சதுர்விதா⁴ ப⁴ஜந்தே மாம்ʼ ஜனா꞉ ஸு-க்ருʼதினோ(அ)ர்ஜுன ।
    ஆர்தோ ஜிஜ்ஞாஸுரர்தா²ர்தீ² ஜ்ஞானீ ச ப⁴ரதர்ஷப⁴ ॥

17: |-
    தேஷாம்ʼ ஜ்ஞானீ நித்ய-யுக்த꞉ ஏக-ப⁴க்திர்விஶிஷ்யதே ।
    ப்ரியோ ஹி ஜ்ஞானினோ(அ)த்யர்த²ம்ʼ அஹம்ʼ ஸ ச மம ப்ரிய꞉ ॥

18: |-
    உதா³ரா꞉ ஸர்வ ஏவைதே ஜ்ஞானீ த்வாத்மைவ மே மதம் ।
    ஆஸ்தி²த꞉ ஸ ஹி யுக்தாத்மா மாமேவானுத்தமாம்ʼ க³திம் ॥

19: |-
    ப³ஹூனாம்ʼ ஜன்மநாமந்தே ஜ்ஞான-வான் மாம்ʼ ப்ர-பத்³யதே ।
    வாஸு-தே³வ꞉ ஸர்வமிதி ஸ மஹாத்மா ஸு-து³ர்லப⁴꞉ ॥

20: |-
    காமைஸ்தைஸ்தைர்ஹ்ருʼத-ஜ்ஞானா꞉ ப்ர-பத்³யந்தே(அ)ன்ய-தே³வதா꞉ ।
    தம்ʼ-தம்ʼ நியமமாஸ்தா²ய ப்ரக்ருʼத்யா நியதா꞉ ஸ்வயா ॥

21: |-
    யோ-யோ யாம்ʼ-யாம்ʼ தனும்ʼ ப⁴க்த꞉ ஶ்ரத்³த⁴யா(அ)ர்சிதுமிச்ச²தி ।
    தஸ்ய-தஸ்யாசலாம்ʼ ஶ்ரத்³தா⁴ம்ʼ தாமேவ வி-த³தா⁴ம்யஹம் ॥

22: |-
    ஸ தயா ஶ்ரத்³த⁴யா யுக்த꞉ தஸ்யா(அ)ராத⁴னமீஹதே ।
    லப⁴தே ச தத꞉ காமான் மயைவ விஹிதான் ஹிதான் ॥

23: |-
    அந்த-வத்து ப²லம்ʼ தேஷாம்ʼ தத்³ ப⁴வத்யல்ப-சேதஸாம் ।
    தே³வான் தே³வ-யஜோ யாந்தி மத்³ப⁴க்தா யாந்தி மாமபி ॥

24: |-
    அவ்யக்தம்ʼ வ்யக்திமாபன்னம்ʼ மன்யந்தே மாமபு³த்³த⁴ய꞉ ।
    பரம்ʼ பா⁴வமஜானந்தோ மமாவ்யயமனுத்தமம் ॥

25: |-
    நாஹம்ʼ ப்ரகாஶ꞉ ஸர்வஸ்ய யோக³-மாயா-ஸமாவ்ருʼத꞉ ।
    மூடோ⁴(அ)யம்ʼ நாபி⁴-ஜானாதி லோகோ மாமஜமவ்யயம் ॥

26: |-
    வேதா³ஹம்ʼ ஸமதீதானி வர்தமானானி சார்ஜுன ।
    ப⁴விஷ்யாணி ச பூ⁴தானி மாம்ʼ து வேத³ ந கஶ்சன ॥

27: |-
    இச்சா²-த்³வேஷ-ஸமுத்தே²ன த்³வந்த்³வ-மோஹேன பா⁴ரத ।
    ஸர்வ-பூ⁴தானி ஸம்மோஹம்ʼ ஸர்கே³ யாந்தி பரம்ʼ தப ॥

28: |-
    யேஷாம்ʼ த்வந்த-க³தம்ʼ பாபம்ʼ ஜனானாம்ʼ புண்ய-கர்மணாம் ।
    தே த்³வந்த்³வ-மோஹ-நிர்முக்தா꞉ ப⁴ஜந்தே மாம்ʼ த்³ருʼட⁴-வ்ரதா꞉ ॥

29: |-
    ஜரா-மரண-மோக்ஷாய மாமாஶ்ரித்ய யதந்தி யே ।
    தே ப்³ரஹ்ம தத்³ விது³꞉ க்ருʼத்ஸ்னம்ʼ அத்⁴யாத்மம்ʼ கர்ம சாகி²லம் ॥

30: |-
    ஸாதி⁴-பூ⁴தாதி⁴-தை³வம்ʼ மாம்ʼ ஸாதி⁴-யஜ்ஞம்ʼ ச யே விது³꞉ ।
    ப்ரயாண-காலே(அ)பி ச மாம்ʼ தே விது³ர்யுக்த-சேதஸ꞉ ॥

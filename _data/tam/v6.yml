1: |-
    அநாஶ்ரித꞉ கர்ம-ப²லம்ʼ கார்யம்ʼ கர்ம கரோதி ய꞉ ।
    ஸ ஸம்ʼ-ந்யாஸீ ச யோகீ³ ச ந நிரக்³நிர்ன சாக்ரிய꞉ ॥

2: |-
    யம்ʼ ஸம்ʼ-ந்யாஸமிதி ப்ராஹு꞉ யோக³ம்ʼ தம்ʼ வித்³தி⁴ பாண்ட³வ ।
    நஹ்யஸம்ʼ-ந்யஸ்த-ஸங்கல்போ யோகீ³ ப⁴வதி கஶ்சன ॥

3: |-
    ஆருருக்ஷோர்முனேர்யோக³ம்ʼ கர்ம காரணமுச்யதே ।
    யோகா³ரூட⁴ஸ்ய தஸ்யைவ ஶம꞉ காரணமுச்யதே ॥

4: |-
    யதா³ ஹி நேந்த்³ரியார்தே²ஷு ந கர்மஸ்வனு-ஷஜ்ஜதே ।
    ஸர்வ-ஸங்கல்ப-ஸம்ʼந்யாஸீ யோகா³ரூட⁴ஸ்ததோ³ச்யதே ॥

5: |-
    உத்³த⁴ரேதா³த்மனா(ஆ)த்மானம்ʼ நா(அ)த்மானமவஸாத³யேத் ।
    ஆத்மைவ ஹ்யாத்மனோ ப³ந்து⁴꞉ ஆத்மைவ ரிபுராத்மன꞉ ॥

6: |-
    ப³ந்து⁴ராத்மா(ஆ)த்மனஸ்தஸ்ய யேனா(அ)த்மைவா(அ)த்மனா ஜித꞉ ।
    அனாத்மனஸ்து ஶத்ருத்வே வர்தேதா(அ)த்மைவ ஶத்ரு-வத் ॥

7: |-
    ஜிதாத்மன꞉ ப்ரஶாந்தஸ்ய பரமாத்மா ஸமாஹித꞉ ।
    ஶீதோஷ்ண-ஸுக²-து³꞉கே²ஷு ததா² மானாப-மானயோ꞉ ॥

8: |-
    ஜ்ஞான-விஜ்ஞான-த்ருʼப்தாத்மா கூட-ஸ்தோ² விஜிதேந்த்³ரிய꞉ ।
    யுக்த இத்யுச்யதே யோகீ³ ஸம-லோஷ்டாஶ்ம-காஞ்சன꞉ ॥

9: |-
    ஸுஹ்ருʼன்மித்ரார்யுதா³ஸீன-மத்⁴யஸ்த²-த்³வேஷ்ய-ப³ந்து⁴ஷு ।
    ஸாது⁴ஷ்வபி ச பாபேஷு ஸம-பு³த்³தி⁴ர்விஶிஷ்யதே ॥

10: |-
    யோகீ³ யுஞ்ஜீத ஸததம்ʼ ஆத்மானம்ʼ ரஹஸி ஸ்தி²த꞉ ।
    ஏகாகீ யத-சித்தாத்மா நிராஶீரபரி-க்³ரஹ꞉ ॥

11: |-
    ஶுசௌ தே³ஶே ப்ரதிஷ்டா²ப்ய ஸ்தி²ரமாஸனமாத்மன꞉ ।
    நாத்யுச்ச்²ரிதம்ʼ நாதி-நீசம்ʼ சேலாஜின-குஶோத்தரம் ॥

12: |-
    தத்ரைகாக்³ரம்ʼ மன꞉ க்ருʼத்வா யத-சித்தேந்த்³ரிய-க்ரிய꞉ ।
    உபவிஶ்யா(அ)ஸனே யுஞ்ஜ்யாத் யோக³மாத்ம-விஶுத்³த⁴யே ॥

13: |-
    ஸமம்ʼ காய-ஶிரோ-க்³ரீவம்ʼ தா⁴ரயன்னசலம்ʼ ஸ்தி²ர꞉ ।
    ஸம்ப்ரேக்ஷ்ய நாஸிகாக்³ரம்ʼ ஸ்வம்ʼ தி³ஶஶ்சானவ-லோகயன் ॥

14: |-
    ப்ர-ஶாந்தாத்மா விக³த-பீ⁴꞉ ப்³ரஹ்ம-சாரி-வ்ரதே ஸ்தி²த꞉ ।
    மன꞉ ஸம்ʼயம்ய மச்சித்தோ யுக்த ஆஸீத மத்பர꞉ ॥

15: |-
    யுஞ்ஜன்னேவம்ʼ ஸதா³(ஆ)த்மானம்ʼ யோகீ³ நியத-மானஸ꞉ ।
    ஶாந்திம்ʼ நிர்பா³ண-பரமாம்ʼ மத்ஸம்ʼஸ்தா²மதி⁴-க³ச்ச²தி ॥

16: |-
    நாத்யஶ்னதஸ்து யோகோ³(அ)ஸ்தி ந சாத்யந்தமனஶ்னத꞉ ।
    ந சாதி-ஸ்வப்ன-ஶீலஸ்ய ஜாக்³ரதோ நைவ சார்ஜுன ॥

17: |-
    யுக்தாஹார-விஹாரஸ்ய யுக்த-சேஷ்டஸ்ய கர்மஸு ।
    யுக்த-ஸ்வப்னாவ-போ³த⁴ஸ்ய யோகோ³ ப⁴வதி து³꞉க²-ஹா ॥

18: |-
    யதா³ வி-நியதம்ʼ சித்தம்ʼ ஆத்மன்யேவாவ-திஷ்ட²தே ।
    நிஸ்ப்ருʼஹ꞉ ஸர்வ-காமேப்⁴யோ யுக்த இத்யுச்யதே ததா³ ॥

19: |-
    யதா² தீ³போ நிவாத-ஸ்தோ² நேங்க³தே ஸோபமா மதா ।
    யோகி³னோ யத-சித்தஸ்ய யுஞ்ஜதோ யோக³மாத்மன꞉ ॥

20: |-
    யத்ரோப-ரமதே சித்தம்ʼ நி-ருத்³த⁴ம்ʼ யோக³-ஸேவயா ।
    யத்ர சைவா(அ)த்மனா(ஆ)த்மானம்ʼ பஶ்யன்னாத்மனி துஷ்யதி ॥

21: |-
    ஸுக²மாத்யந்திகம்ʼ யத்தத் பு³த்³தி⁴-க்³ராஹ்யமதீந்த்³ரியம் ।
    வேத்தி யத்ர ந சைவாயம்ʼ ஸ்தி²தஶ்சலதி தத்த்வத꞉ ॥

22: |-
    யம்ʼ லப்³த்⁴வா சாபரம்ʼ லாப⁴ம்ʼ மன்யதே நாதி⁴கம்ʼ தத꞉ ।
    யஸ்மின் ஸ்தி²தோ ந து³꞉கே²ன கு³ருணா(அ)பி வி-சால்யதே ॥

23: |-
    தம்ʼ வித்³யாத்³ து³꞉க²-ஸம்ʼயோக³-வியோக³ம்ʼ யோக³-ஸஞ்ஜ்ஞிதம் ।
    ஸ நிஶ்சயேன யோக்தவ்யோ யோகோ³ நிர்விண்ண-சேதஸா ॥

24: |-
    ஸங்கல்ப-ப்ரப⁴வான் காமான் த்யக்த்வா ஸர்வானஶேஷத꞉ ।
    மனஸைவேந்த்³ரிய-க்³ராமம்ʼ வி-நியம்ய ஸமந்தத꞉ ॥

25: |-
    ஶனை꞉-ஶனைருப-ரமேத் பு³த்³த்⁴யாத்⁴ருʼதி-க்³ருʼஹீதயா ।
    ஆத்ம-ஸம்ʼஸ்த²ம்ʼ மன꞉ க்ருʼத்வா ந கிஞ்சித³பி சிந்தயேத் ॥

26: |-
    யதோ யதோ நிஶ்சரதி மனஶ்சஞ்சலமஸ்தி²ரம் ।
    ததஸ்ததோ நியம்யைதத் ஆத்மன்யேவ வஶம்ʼ நயேத் ॥

27: |-
    ப்ரஶாந்த-மனஸம்ʼ ஹ்யேனம்ʼ யோகி³னம்ʼ ஸுக²முத்தமம் ।
    உபைதி ஶாந்த-ரஜஸம்ʼ ப்³ரஹ்ம-பூ⁴தமகல்மஷம் ॥

28: |-
    ஏவம்ʼ யுஞ்ஜன் ஸதா³த்மானம்ʼ யோகீ³ விக³த-கல்மஷ꞉ ।
    ஸுகே²ன ப்³ரஹ்ம-ஸம்ʼஸ்பர்ஶம்ʼ அத்யந்தம்ʼ ஸுக²மஶ்னுதே ॥

29: |-
    ஸர்வ-பூ⁴த-ஸ்த²மாத்மானம்ʼ ஸர்வ-பூ⁴தானி சா(அ)த்மனி ।
    ஈக்ஷதே யோக³-யுக்தாத்மா ஸர்வத்ர ஸம-த³ர்ஶன꞉ ॥

30: |-
    யோ மாம்ʼ பஶ்யதி ஸர்வத்ர ஸர்வம்ʼ ச மயி பஶ்யதி ।
    தஸ்யாஹம்ʼ ந ப்ரணஶ்யாமி ஸ ச மே ந ப்ரணஶ்யதி ॥

31: |-
    ஸர்வ-பூ⁴த-ஸ்தி²தம்ʼ யோ மாம்ʼ ப⁴ஜத்யேகத்வமாஸ்தி²த꞉ ।
    ஸர்வதா² வர்தமானோ(அ)பி ஸ யோகீ³ மயி வர்ததே ॥

32: |-
    ஆத்மௌபம்யேன ஸர்வத்ர ஸமம்ʼ பஶ்யதி யோ(அ)ர்ஜுன ।
    ஸுக²ம்ʼ வா யதி³ வா து³꞉க²ம்ʼ ஸ யோகீ³ பரமோ மத꞉ ॥

33: |-
    யோ(அ)யம்ʼ யோக³ஸ்த்வயா ப்ரோக்த꞉ ஸாம்யேன மது⁴-ஸூத³ன ।
    ஏதஸ்யாஹம்ʼ ந பஶ்யாமி சஞ்சலத்வாத் ஸ்தி²திம்ʼ ஸ்தி²ராம் ॥

34: |-
    சஞ்சலம்ʼ ஹி மன꞉ க்ருʼஷ்ண ப்ரமாதி² ப³ல-வத்³ த்³ருʼட⁴ம் ।
    தஸ்யாஹம்ʼ நிக்³ரஹம்ʼ மன்யே வாயோரிவ ஸு-து³ஷ்கரம் ॥

35: |-
    அஸம்ʼஶயம்ʼ மஹாபா³ஹோ மனோ து³ர்நிக்³ரஹம்ʼ சலம் ।
    அப்⁴யாஸேன து கௌந்தேய வைராக்³யேண ச க்³ருʼஹ்யதே ॥

36: |-
    அஸம்ʼ-யதாத்மனா யோகோ³ து³ஷ்ப்ராப இதி மே மதி꞉ ।
    வஶ்யாத்மனா து ஸததம்ʼ ஶக்யோ(அ)வாப்துமஶேஷத꞉ ॥

37: |-
    அயதி꞉ ஶ்ரத்³த⁴யோபேதோ யோகா³ச்சலித-மானஸ꞉ ।
    அப்ராப்ய யோக³-ஸம்ʼஸித்³தி⁴ம்ʼ காம்ʼ க³திம்ʼ க்ருʼஷ்ண க³ச்ச²தி ॥

38: |-
    கச்சின்னோப⁴ய-விப்⁴ரஷ்ட꞉ சி²ந்நாப்⁴ரமிவ நஶ்யதி ।
    அப்ரதிஷ்டோ² மஹாபா³ஹோ விமூடோ⁴ ப்³ரஹ்மண꞉ பதி² ॥

39: |-
    ஏதன்மே ஸம்ʼஶயம்ʼ க்ருʼஷ்ண ச்சே²த்துமர்ஹஸ்யஶேஷத꞉ ।
    த்வத³ன்ய꞉ ஸம்ʼஶயஸ்யாஸ்ய சே²த்தா ந ஹ்யுபபத்³யதே ॥

40: |-
    பார்த² நைவேஹ நாமுத்ர விநாஶஸ்தஸ்ய வித்³யதே ।
    நஹி கல்யாண-க்ருʼத் கஶ்சித்³ து³ர்க³திம்ʼ தாத க³ச்ச²தி ॥

41: |-
    ப்ராப்ய புண்ய-க்ருʼதாம்ʼ லோகான் உஷித்வா ஶாஶ்வதீ꞉ ஸமா꞉ ।
    ஶுசீனாம்ʼ ஶ்ரீமதாம்ʼ கே³ஹே யோக³-ப்⁴ரஷ்டோ(அ)பி⁴-ஜாயதே ॥

42: |-
    அத²வா யோகி³நாமேவ குலே ப⁴வதி தீ⁴-மதாம் ।
    ஏதத்³தி⁴ து³ர்லப⁴-தரம்ʼ லோகே ஜன்ம யதீ³த்³ருʼஶம் ॥

43: |-
    தத்ர தம்ʼ பு³த்³தி⁴-ஸம்ʼயோக³ம்ʼ லப⁴தே பௌர்வதை³ஹிகம் ।
    யததே ச ததோ பூ⁴ய꞉ ஸம்ʼஸித்³தௌ⁴ குரு-நந்த³ன ॥

44: |-
    பூர்வாப்⁴யாஸேன தேனைவ ஹ்ரியதே ஹ்யவஶோ(அ)பி ஸ꞉ ।
    ஜிஜ்ஞாஸுரபி யோக³ஸ்ய ஶப்³த³-ப்³ரஹ்மாதி-வர்ததே ॥

45: |-
    ப்ரயத்நாத்³ யதமானஸ்து யோகீ³ ஸம்ʼஶுத்³த⁴-கில்பி³ஷ꞉ ।
    அனேக-ஜன்ம-ஸம்ʼஸித்³த⁴꞉ ததோ யாதி பராம்ʼ க³திம் ॥

46: |-
    தபஸ்விப்⁴யோ(அ)தி⁴கோ யோகீ³ ஜ்ஞானிப்⁴யோ(அ)பி மதோ(அ)தி⁴க꞉ ।
    கர்மிப்⁴யஶ்சாதி⁴கோ யோகீ³ தஸ்மாத்³ யோகீ³ ப⁴வார்ஜுன ॥

47: |-
    யோகி³நாமபி ஸர்வேஷாம்ʼ மத்³க³தேனாந்தராத்மனா ।
    ஶ்ர்ரத்³தா⁴-வான் ப⁴ஜதே யோ மாம்ʼ ஸ மே யுக்த-தமோ மத꞉ ॥

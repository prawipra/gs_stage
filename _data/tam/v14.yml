1: |-
    பரம்ʼ பூ⁴ய꞉ ப்ரவக்ஷ்யாமி ஜ்ஞானானாம்ʼ ஜ்ஞானமுத்தமம் ।
    யஜ்ஜ்ஞாத்வா முனய꞉ ஸர்வே பராம்ʼ ஸித்³தி⁴மிதோ க³தா꞉ ॥

2: |-
    இத³ம்ʼ ஜ்ஞானமுபாஶ்ரித்ய மம ஸாத⁴ர்ம்யமாக³தா꞉ ।
    ஸர்கே³(அ)பி நோப-ஜாயந்தே ப்ரளயே ந வ்யத²ந்தி ச ॥

3: |-
    மம யோநிர்மஹத்³-ப்³ரஹ்ம தஸ்மின் க³ர்ப⁴ம்ʼ த³தா⁴ம்யஹம் ।
    ஸம்ப⁴வ꞉ ஸர்வ-பூ⁴தானாம்ʼ ததோ ப⁴வதி பா⁴ரத ॥

4: |-
    ஸர்வ-யோநிஷு கௌந்தேய மூர்தய꞉ ஸம்ப⁴வந்தி யா꞉ ।
    தாஸாம்ʼ ப்³ரஹ்ம மஹத்³யோனி꞉ அஹம்ʼ பீ³ஜ-ப்ரத³꞉ பிதா ॥

5: |-
    ஸத்வம்ʼ ரஜஸ்தம இதி கு³ணா꞉ ப்ரக்ருʼதி-ஸம்ப⁴வா꞉ ।
    நிப³த்⁴னந்தி மஹா-பா³ஹோ தே³ஹே தே³ஹினமவ்யயம் ॥

6: |-
    தத்ர ஸத்வம்ʼ நிர்மலத்வாத் ப்ரகாஶகமநாமயம் ।
    ஸுக²-ஸங்கே³ன ப³த்⁴னாதி ஜ்ஞான-ஸங்கே³ன சானக⁴ ॥

7: |-
    ரஜோ ராகா³த்மகம்ʼ வித்³தி⁴ த்ருʼஷ்ணா-ஸங்க³-ஸமுத்³ப⁴வம் ।
    தந்நிப³த்⁴னாதி கௌந்தேய கர்ம-ஸங்கே³ன தே³ஹினம் ॥

8: |-
    தமஸ்த்வஜ்ஞான-ஜம்ʼ வித்³தி⁴ மோஹனம்ʼ ஸர்வ-தே³ஹினாம் ।
    ப்ரமாதா³லஸ்ய-நித்³ராபி⁴꞉ தந்நிப³த்⁴னாதி பா⁴ரத ॥

9: |-
    ஸத்வம்ʼ ஸுகே² ஸஞ்ஜயதி ரஜ꞉ கர்மணி பா⁴ரத ।
    ஜ்ஞானமாவ்ருʼத்ய து தம꞉ ப்ரமாதே³ ஸஞ்ஜயத்யுத ॥

10: |-
    ரஜஸ்தமஶ்சாபி⁴-பூ⁴ய ஸத்வம்ʼ ப⁴வதி பா⁴ரத ।
    ரஜ꞉ ஸத்வம்ʼ தமஶ்சைவ தம꞉ ஸத்வம்ʼ ரஜஸ்ததா² ॥

11: |-
    ஸர்வ-த்³வாரேஷு தே³ஹே(அ)ஸ்மின் ப்ரகாஶ உப-ஜாயதே ।
    ஜ்ஞானம்ʼ யதா³ ததா³ வித்³யாத் விவ்ருʼத்³த⁴ம்ʼ ஸத்வமித்யுத ॥

12: |-
    லோப⁴꞉ ப்ரவ்ருʼத்திராரம்ப⁴꞉ கர்மணாமஶம꞉ ஸ்ப்ருʼஹா ।
    ரஜஸ்யேதானி ஜாயந்தே விவ்ருʼத்³தே⁴ ப⁴ரதர்ஷப⁴ ॥

13: |-
    அப்ரகாஶோ(அ)ப்ரவ்ருʼத்திஶ்ச ப்ரமாதோ³ மோஹ ஏவ ச ।
    தமஸ்யேதானி ஜாயந்தே விவ்ருʼத்³தே⁴ குரு-நந்த³ன ॥

14: |-
    யதா³ ஸத்வே ப்ரவ்ருʼத்³தே⁴ து ப்ரளயம்ʼ யாதி தே³ஹ-ப்⁴ருʼத் ।
    ததோ³த்தம-விதா³ம்ʼ லோகான் அமலான் ப்ரதிபத்³யதே ॥

15: |-
    ரஜஸி ப்ரளயம்ʼ க³த்வா கர்ம-ஸங்கி³ஷு ஜாயதே ।
    ததா² ப்ரலீனஸ்தமஸி மூட⁴-யோநிஷு ஜாயதே ॥

16: |-
    கர்மண꞉ ஸுக்ருʼதஸ்யாஹு꞉ ஸாத்விகம்ʼ நிர்மலம்ʼ ப²லம் ।
    ரஜஸஸ்து ப²லம்ʼ து³꞉க²ம்ʼ அஜ்ஞானம்ʼ தமஸ꞉ ப²லம் ॥

17: |-
    ஸத்வாத் ஸஞ்ஜாயதே ஜ்ஞானம்ʼ ரஜஸோ லோப⁴ ஏவ ச ।
    ப்ரமாத³-மோஹௌ தமஸோ ப⁴வதோ(அ)ஜ்ஞானமேவ ச ॥

18: |-
    ஊர்த்⁴வம்ʼ க³ச்ச²ந்தி ஸத்வ-ஸ்தா²꞉ மத்⁴யே திஷ்ட²ந்தி ராஜஸா꞉ ।
    ஜக⁴ன்ய-கு³ண-வ்ருʼத்தி-ஸ்தா²꞉ அதோ⁴ க³ச்ச²ந்தி தாமஸா꞉ ॥

19: |-
    நான்யம்ʼ கு³ணேப்⁴ய꞉ கர்தாரம்ʼ யதா³ த்³ரஷ்டா(அ)னு-பஶ்யதி ।
    கு³ணேப்⁴யஶ்ச பரம்ʼ வேத்தி மத்³பா⁴வம்ʼ ஸோ(அ)தி⁴க³ச்ச²தி ॥

20: |-
    கு³ணானேதானதீத்ய த்ரீன் தே³ஹீ தே³ஹ-ஸமுத்³ப⁴வான் ।
    ஜன்ம-ம்ருʼத்யு-ஜரா-து³꞉கை²꞉ விமுக்தோ(அ)ம்ருʼதமஶ்னுதே ॥

21: |-
    கைர்லிங்கை³ஸ்த்ரீன் கு³ணானேதான் அதீதோ ப⁴வதி ப்ரபோ⁴ ।
    கிமாசார꞉ கத²ம்ʼ சைதான் த்ரீன் கு³ணானதி-வர்ததே ॥

22: |-
    ப்ரகாஶம்ʼ ச ப்ரவ்ருʼத்திம்ʼ ச மோஹமேவ ச பாண்ட³வ ।
    ந த்³வேஷ்டி ஸம்ப்ரவ்ருʼத்தானி ந நிவ்ருʼத்தானி காங்க்ஷதி ॥

23: |-
    உதா³ஸீனவதா³ஸீனோ கு³ணைர்யோ ந விசால்யதே ।
    கு³ணா வர்தந்த இத்யேவ யோ(அ)வ-திஷ்ட²தி நேங்க³தே ॥

24: |-
    ஸம-து³꞉க²-ஸுக²꞉ ஸ்வஸ்த²꞉ ஸம-லோஷ்டாஶ்ம-காஞ்சன꞉ ।
    துல்ய-ப்ரியாப்ரியோ தீ⁴ர꞉ துல்ய-நிந்தா³த்ம-ஸம்ʼஸ்துதி꞉ ॥

25: |-
    மானாப-மானயோஸ்துல்ய꞉ துல்யோ மித்ராரி-பக்ஷயோ꞉ ।
    ஸர்வாரம்ப⁴-பரித்யாகீ³ கு³ணாதீத꞉ ஸ உச்யதே ॥

26: |-
    மாம்ʼ ச யோ(அ)வ்யபி⁴சாரேண ப⁴க்தி-யோகே³ன ஸேவதே ।
    ஸ கு³ணான் ஸமதீத்யைதான் ப்³ரஹ்ம-பூ⁴யாய கல்பதே ॥

27: |-
    ப்³ரஹ்மணோ ஹி ப்ரதிஷ்டா²(அ)ஹம்ʼ அம்ருʼதஸ்யாவ்யயஸ்ய ச ।
    ஶாஶ்வதஸ்ய ச த⁴ர்மஸ்ய ஸுக²ஸ்யைகாந்திகஸ்ய ச ॥

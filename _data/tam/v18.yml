1: |-
    ஸம்ʼந்யாஸஸ்ய மஹாபா³ஹோ தத்வமிச்சா²மி வேதி³தும் ।
    த்யாக³ஸ்ய ச ஹ்ருʼஷீகேஶ ப்ருʼத²க் கேஶி-நிஷூத³ன ॥

2: |-
    காம்யானாம்ʼ கர்மணாம்ʼ ந்யாஸம்ʼ ஸம்ʼந்யாஸம்ʼ கவயோ விது³꞉ ।
    ஸர்வ-கர்ம-ப²ல-த்யாக³ம்ʼ ப்ராஹுஸ்த்யாக³ம்ʼ விசக்ஷணா꞉ ॥

3: |-
    த்யாஜ்யம்ʼ தோ³ஷ-வதி³த்யேகே கர்ம ப்ராஹுர்மனீஷிண꞉ ।
    யஜ்ஞ-தா³ன-தப꞉-கர்ம ந த்யாஜ்யமிதி சாபரே ॥

4: |-
    நிஶ்ஶ்சயம்ʼ ஶ்ருʼணு மே தத்ர த்யாகே³ ப⁴ரத-ஸத்தம ।
    த்யாகோ³ ஹி புருஷ-வ்யாக்⁴ர த்ரி-வித⁴꞉ ஸம்ப்ர-கீர்தித꞉ ॥

5: |-
    யஜ்ஞ-தா³ன-தப꞉-கர்ம ந த்யாஜ்யம்ʼ கார்யமேவ தத் ।
    யஜ்ஞோ தா³னம்ʼ தபஶ்சைவ பாவனானி மனீஷிணாம் ॥

6: |-
    ஏதான்யபி து கர்மாணி ஸங்க³ம்ʼ த்யக்த்வா ப²லானி ச ।
    கர்தவ்யாநீதி மே பார்த² நிஶ்சிதம்ʼ மதமுத்தமம் ॥

7: |-
    நியதஸ்ய து ஸம்ʼந்யாஸ꞉ கர்மணோ நோப-பத்³யதே ।
    மோஹாத் தஸ்ய பரித்யாக³꞉ தாமஸ꞉ பரி-கீர்தித꞉ ॥

8: |-
    து³꞉க²மித்யேவ யத் கர்ம காய-க்லேஶ-ப⁴யாத் த்யஜேத் ।
    ஸ க்ருʼத்வா ராஜஸம்ʼ த்யாக³ம்ʼ நைவ த்யாக³-ப²லம்ʼ லபே⁴த் ॥

9: |-
    கார்யமித்யேவ யத் கர்ம நியதம்ʼ க்ரியதே(அ)ர்ஜுன ।
    ஸங்க³ம்ʼ த்யக்த்வா ப²லம்ʼ சைவ ஸ த்யாக³꞉ ஸாத்த்விகோ மத꞉ ॥

10: |-
    ந த்³வேஷ்ட்யகுஶலம்ʼ கர்ம குஶலே நானு-ஷஜ்ஜதே ।
    த்யாகீ³ ஸத்த்வ-ஸமாவிஷ்டோ மேதா⁴வீ சி²ன்ன-ஸம்ʼஶய꞉ ॥

11: |-
    ந ஹி தே³ஹ-ப்⁴ருʼதா ஶக்யம்ʼ த்யக்தும்ʼ கர்மாண்யஶேஷத꞉ ।
    யஸ்து கர்ம-ப²ல-த்யாகீ³ ஸ த்யாகீ³த்யபி⁴-தீ⁴யதே ॥

12: |-
    அநிஷ்டமிஷ்டம்ʼ மிஶ்ரம்ʼ ச த்ரி-வித⁴ம்ʼ கர்மண꞉ ப²லம் ।
    ப⁴வத்யத்யாகி³னாம்ʼ ப்ரேத்ய ந து ஸம்ʼந்யாஸினாம்ʼ க்வசித் ॥

13: |-
    பஞ்சைதானி மஹா-பா³ஹோ காரணானி நிபோ³த⁴ மே ।
    ஸாங்க்²யே க்ருʼதாந்தே ப்ரோக்தானி ஸித்³த⁴யே ஸர்வ-கர்மணாம் ॥

14: |-
    அதி⁴ஷ்டா²னம்ʼ ததா² கர்தா கரணம்ʼ ச ப்ருʼத²க்³வித⁴ம் ।
    விவிதா⁴ஶ்ச ப்ருʼத²க் சேஷ்டா தை³வம்ʼ சைவாத்ர பஞ்சமம் ॥

15: |-
    ஶரீர-வாங்மனோபி⁴ர்யத் கர்ம ப்ராரப⁴தே நர꞉ ।
    ந்யாய்யம்ʼ வா விபரீதம்ʼ வா பஞ்சைதே தஸ்ய ஹேதவ꞉ ॥

16: |-
    தத்ரைவம்ʼ ஸதி கர்தாரம்ʼ ஆத்மானம்ʼ கேவலம்ʼ து ய꞉ ।
    பஶ்யத்யக்ருʼத-பு³த்³தி⁴த்வாத் ந ஸ பஶ்யதி து³ர்மதி꞉ ॥

17: |-
    யஸ்ய நாஹம்ʼ-க்ருʼதோ பா⁴வோ பு³த்³தி⁴ர்யஸ்ய ந லிப்யதே ।
    ஹத்வா(அ)பி ஸ இமான் லோகான் ந ஹந்தி ந நிப³த்⁴யதே ॥

18: |-
    ஜ்ஞானம்ʼ ஜ்ஞேயம்ʼ பரி-ஜ்ஞாதா த்ரி-விதா⁴ கர்ம-சோத³னா ।
    கரணம்ʼ கர்ம கர்தேதி த்ரி-வித⁴꞉ கர்ம-ஸங்க்³ரஹ꞉ ॥

19: |-
    ஜ்ஞானம்ʼ கர்ம ச கர்தா ச த்ரி-தை⁴வ கு³ண-பே⁴த³த꞉ ।
    ப்ரோச்யதே கு³ண-ஸங்க்²யானே யதா²வச்ச்²ருʼணு தான்யபி ॥

20: |-
    ஸர்வ-பூ⁴தேஷு யேனைகம்ʼ பா⁴வமவ்யயமீக்ஷதே ।
    அவிப⁴க்தம்ʼ விப⁴க்தேஷு தஜ்ஜ்ஞானம்ʼ வித்³தி⁴ ஸாத்த்விகம் ॥

21: |-
    ப்ருʼத²க்த்வேன து யஜ்ஜ்ஞானம்ʼ நானா-பா⁴வான் ப்ருʼத²க்³விதா⁴ன் ।
    வேத்தி ஸர்வேஷு பூ⁴தேஷு தஜ்ஜ்ஞானம்ʼ வித்³தி⁴ ராஜஸம் ॥

22: |-
    யத் து க்ருʼத்ஸ்ன-வதே³கஸ்மின் கார்யே ஸக்தமஹைதுகம் ।
    அதத்வார்த²-வத³ல்பம்ʼ ச தத் தாமஸமுதா³ஹ்ருʼதம் ॥

23: |-
    நியதம்ʼ ஸங்க³-ரஹிதம்ʼ அராக³-த்³வேஷத꞉ க்ருʼதம் ।
    அப²ல-ப்ரேப்ஸுனா கர்ம யத் தத் ஸாத்த்விகமுச்யதே ॥

24: |-
    யத் து காமேப்ஸுனா கர்ம ஸாஹம்ʼ-காரேண வா புன꞉ ।
    க்ரியதே ப³ஹுலாயாஸம்ʼ தத்³ ராஜஸமுதா³ஹ்ருʼதம் ॥

25: |-
    அனுப³ந்த⁴ம்ʼ க்ஷயம்ʼ ஹிம்ʼஸாம்ʼ அனபேக்ஷ்ய ச பௌருஷம் ।
    மோஹாதா³ரப்⁴யதே கர்ம யத் தத் தாமஸமுச்யதே ॥

26: |-
    முக்த-ஸங்கோ³(அ)னஹம்ʼ-வாதீ³ த்⁴ருʼத்யுத்ஸாஹ-ஸமன்வித꞉ ।
    ஸித்³த்⁴யஸித்³த்⁴யோர்நிர்விகார꞉ கர்தா ஸாத்த்விக உச்யதே ॥

27: |-
    ராகீ³ கர்ம-ப²ல-ப்ரேப்ஸு꞉ லுப்³தோ⁴ ஹிம்ʼஸாத்மகோ(அ)ஶுசி꞉ ।
    ஹர்ஷ-ஶோகான்வித꞉ கர்தா ராஜஸ꞉ பரிகீர்தித꞉ ॥

28: |-
    அயுக்த꞉ ப்ராக்ருʼத꞉ ஸ்தப்³த⁴꞉ ஶடோ² நைக்ருʼதிகோ(அ)லஸ꞉ ।
    விஷாதீ³ தீ³ர்க⁴-ஸூத்ரீ ச கர்தா தாமஸ உச்யதே ॥

29: |-
    பு³த்³தே⁴ர்பே⁴த³ம்ʼ த்⁴ருʼதேஶ்சைவ கு³ணதஸ்த்ரி-வித⁴ம்ʼ ஶ்ருʼணு ।
    ப்ரோச்யமானமஶேஷேண ப்ருʼத²க்த்வேன த⁴னம்ʼ-ஜய ॥

30: |-
    ப்ரவ்ருʼத்திம்ʼ ச நிவ்ருʼத்திம்ʼ ச கார்யாகார்யே ப⁴யாப⁴யே ।
    ப³ந்த⁴ம்ʼ மோக்ஷம்ʼ ச யா வேத்தி பு³த்³தி⁴꞉ ஸா பார்த² ஸாத்த்விகீ ॥

31: |-
    யயா த⁴ர்மமத⁴ர்மம்ʼ ச கார்யம்ʼ சாகார்யமேவ ச ।
    அயதா²-வத் ப்ரஜானாதி பு³த்³தி⁴꞉ ஸா பார்த² ராஜஸீ ॥

32: |-
    அத⁴ர்மம்ʼ த⁴ர்மமிதி யா மன்யதே தமஸா(ஆ)வ்ருʼதா ।
    ஸர்வார்தா²ன் விபரீதாம்ʼஶ்ச பு³த்³தி⁴꞉ ஸா பார்த² தாமஸீ ॥

33: |-
    த்⁴ருʼத்யா யயா தா⁴ரயதே மன꞉-ப்ராணேந்த்³ரிய-க்ரியா꞉ ।
    யோகே³னாவ்யபி⁴-சாரிண்யா த்⁴ருʼதி꞉ ஸா பார்த² ஸாத்த்விகீ ॥

34: |-
    யயா து த⁴ர்ம-காமார்தா²ன் த்⁴ருʼத்யா தா⁴ரயதே(அ)ர்ஜுன ।
    ப்ரஸங்கே³ன ப²லாகாங்க்ஷீ த்⁴ருʼதி꞉ ஸா பார்த² ராஜஸீ ॥

35: |-
    யயா ஸ்வப்னம்ʼ ப⁴யம்ʼ ஶோகம்ʼ விஷாத³ம்ʼ மத³மேவ ச ।
    ந விமுஞ்சதி து³ர்மேதா⁴ த்⁴ருʼதி꞉ ஸா பார்த² தாமஸீ ॥

36: |-
    ஸுக²ம்ʼ த்விதா³னீம்ʼ த்ரி-வித⁴ம்ʼ ஶ்ருʼணு மே ப⁴ரதர்ஷப⁴ ।
    அப்⁴யாஸாத்³ ரமதே யத்ர து³꞉கா²ந்தம்ʼ ச நிக³ச்ச²தி ॥

37: |-
    யத் தத³க்³ரே விஷமிவ பரிணாமே(அ)ம்ருʼதோபமம் ।
    தத் ஸுக²ம்ʼ ஸாத்விகம்ʼ ப்ரோக்தம்ʼ ஆத்ம-பு³த்³தி⁴-ப்ரஸாத³-ஜம் ॥

38: |-
    விஷயேந்த்³ரிய-ஸம்ʼயோகா³த் யத் தத³க்³ரே(அ)ம்ருʼதோபமம் ।
    பரிணாமே விஷமிவ தத் ஸுக²ம்ʼ ராஜஸம்ʼ ஸ்ம்ருʼதம் ॥

39: |-
    யத³க்³ரே சானுப³ந்தே⁴ ச ஸுக²ம்ʼ மோஹனமாத்மன꞉ ।
    நித்³ராலஸ்ய-ப்ரமாதோ³த்த²ம்ʼ தத் தாமஸமுதா³ஹ்ருʼதம் ॥

40: |-
    ந தத³ஸ்தி ப்ருʼதி²வ்யாம்ʼ வா தி³வி தே³வேஷு வா புன꞉ ।
    ஸத்வம்ʼ ப்ரக்ருʼதி-ஜைர்முக்தம்ʼ யதே³பி⁴꞉ ஸ்யாத் த்ரிபி⁴ர்கு³ணை꞉ ॥

41: |-
    ப்³ராஹ்மண-க்ஷத்ரிய-விஶாம்ʼ ஶூத்³ராணாம்ʼ ச பரம்ʼ-தப ।
    கர்மாணி ப்ரவி-ப⁴க்தானி ஸ்வ-பா⁴வ-ப்ரப⁴வைர்கு³ணை꞉ ॥

42: |-
    ஶமோ த³மஸ்தப꞉ ஶௌசம்ʼ க்ஷாந்திரார்ஜவமேவ ச ।
    ஜ்ஞானம்ʼ விஜ்ஞானமாஸ்திக்யம்ʼ ப்³ரஹ்ம-கர்ம ஸ்வ-பா⁴வ-ஜம் ॥

43: |-
    ஶௌர்யம்ʼ தேஜோ த்⁴ருʼதிர்தா³க்ஷ்யம்ʼ யுத்³தே⁴ சாப்யபலாயனம் ।
    தா³னமீஶ்வர-பா⁴வஶ்ச க்ஷாத்ரம்ʼ கர்ம ஸ்வ-பா⁴வ-ஜம் ॥

44: |-
    க்ருʼஷி-கோ³-ரக்ஷ-வாணிஜ்யம்ʼ வைஶ்ய-கர்ம ஸ்வ-பா⁴வ-ஜம் ।
    பரிசர்யாத்மகம்ʼ கர்ம ஶூத்³ரஸ்யாபி ஸ்வ-பா⁴வ-ஜம் ॥

45: |-
    ஸ்வே ஸ்வே கர்மண்யபி⁴-ரத꞉ ஸம்ʼஸித்³தி⁴ம்ʼ லப⁴தே நர꞉ ।
    ஸ்வ-கர்ம-நிரத꞉ ஸித்³தி⁴ம்ʼ யதா² விந்த³தி தச்ச்²ருʼணு ॥

46: |-
    யத꞉ ப்ரவ்ருʼத்திர்பூ⁴தானாம்ʼ யேன ஸர்வமித³ம்ʼ ததம் ।
    ஸ்வ-கர்மணா தமப்⁴யர்ச்ய ஸித்³தி⁴ம்ʼ விந்த³தி மானவ꞉ ॥

47: |-
    ஶ்ரேயான் ஸ்வ-த⁴ர்மோ விகு³ண꞉ பர-த⁴ர்மாத் ஸ்வனுஷ்டி²தாத் ।
    ஸ்வ-பா⁴வ-நியதம்ʼ கர்ம குர்வன் நா(அ)ப்னோதி கில்பி³ஷம் ॥

48: |-
    ஸஹ-ஜம்ʼ கர்ம கௌந்தேய ஸ-தோ³ஷமபி ந த்யஜேத் ।
    ஸர்வாரம்பா⁴ ஹி தோ³ஷேண தூ⁴மேநாக்³நிரிவா(அ)ம்ருʼதா꞉ ॥

49: |-
    அஸக்த-பு³த்³தி⁴꞉ ஸர்வத்ர ஜிதாத்மா விக³த-ஸ்ப்ருʼஹ꞉ ।
    நைஷ்கர்ம்ய-ஸித்³தி⁴ம்ʼ பரமாம்ʼ ஸம்ʼந்யாஸேனாதி⁴க³ச்ச²தி ॥

50: |-
    ஸித்³தி⁴ம்ʼ ப்ராப்தோ யதா² ப்³ரஹ்ம ததா²(ஆ)ப்னோதி நிபோ³த⁴ மே ।
    ஸமாஸேனைவ கௌந்தேய நிஷ்டா² ஜ்ஞானஸ்ய யா பரா ॥

51: |-
    பு³த்³த்⁴யாவிஶுத்³த⁴யா யுக்தோ த்⁴ருʼத்யா(ஆ)த்மானம்ʼ நியம்ய ச ।
    ஶப்³தா³தீ³ன் விஷயாம்ʼஸ்த்யக்த்வா ராக³-த்³வேஷௌ வ்யுத³ஸ்ய ச ॥

52: |-
    விவிக்த-ஸேவீ லக்⁴வாஶீ யத-வாக்காய-மானஸ꞉ ।
    த்⁴யான-யோக³-பரோ நித்யம்ʼ வைராக்³யம்ʼ ஸமுபாஶ்ரித꞉ ॥

53: |-
    அஹம்ʼ-காரம்ʼ ப³லம்ʼ த³ர்பம்ʼ காமம்ʼ க்ரோத⁴ம்ʼ பரிக்³ரஹம் ।
    விமுச்ய நிர்மம꞉ ஶாந்தோ ப்³ரஹ்ம-பூ⁴யாய கல்பதே ॥

54: |-
    ப்³ரஹ்ம-பூ⁴த꞉ ப்ரஸன்னாத்மா ந ஶோசதி ந காங்க்ஷதி ।
    ஸம꞉ ஸர்வேஷு பூ⁴தேஷு மத்³ப⁴க்திம்ʼ லப⁴தே பராம் ॥

55: |-
    ப⁴க்த்யா மாமபி⁴-ஜானாதி யாவான் யஶ்சாஸ்மி தத்த்வத꞉ ।
    ததோ மாம்ʼ தத்த்வதோ ஜ்ஞாத்வா விஶதே தத³னந்தரம் ॥

56: |-
    ஸர்வ-கர்மாண்யபி ஸதா³ குர்வாணோ மத்³வ்யபாஶ்ரய꞉ ।
    மத்ப்ரஸாதா³த³வாப்னோதி ஶாஶ்வதம்ʼ பத³மவ்யயம் ॥

57: |-
    சேதஸா ஸர்வ-கர்மாணி மயி ஸம்ʼந்யஸ்ய மத்பர꞉ ।
    பு³த்³தி⁴-யோக³முபாஶ்ரித்ய மச்சித்த꞉ ஸததம்ʼ ப⁴வ ॥

58: |-
    மச்சித்த꞉ ஸர்வ-து³ர்கா³ணி மத்ப்ரஸாதா³த் தரிஷ்யஸி ।
    அத² சேத் த்வமஹம்ʼ-காராத் ந ஶ்ரோஷ்யஸி வினங்க்ஷ்யஸி ॥

59: |-
    யத³ஹம்ʼ-காரமாஶ்ரித்ய ந யோத்ஸ்ய இதி மன்யஸே ।
    மித்²யைஷ வ்யவஸாயஸ்தே ப்ரக்ருʼதிஸ்த்வாம்ʼ நியோக்ஷ்யதி ॥

60: |-
    ஸ்வ-பா⁴வ-ஜேன கௌந்தேய நிப³த்³த⁴꞉ ஸ்வேன கர்மணா ।
    கர்தும்ʼ நேச்ச²ஸி யன்மோஹாத் கரிஷ்யஸ்யவஶோ(அ)பி தத் ॥

61: |-
    ஈஶ்வர꞉ ஸர்வ-பூ⁴தானாம்ʼ ஹ்ருʼத்³தே³ஶே(அ)ர்ஜுன திஷ்ட²தி ।
    ப்⁴ராமயன் ஸர்வ-பூ⁴தானி யந்த்ராரூடா⁴னி மாயயா ॥

62: |-
    தமேவ ஶரணம்ʼ க³ச்ச² ஸர்வ-பா⁴வேன பா⁴ரத ।
    தத்-ப்ரஸாதா³த் பராம்ʼ ஶாந்திம்ʼ ஸ்தா²னம்ʼ ப்ராப்ஸ்யஸி ஶாஶ்வதம் ॥

63: |-
    இதி தே ஜ்ஞானமாக்²யாதம்ʼ கு³ஹ்யாத்³ கு³ஹ்ய-தரம்ʼ மயா ।
    விம்ருʼஶ்ஶைதத³ஶேஷேண யதே²ச்ச²ஸி ததா² குரு ॥

64: |-
    ஸர்வ-கு³ஹ்ய-தமம்ʼ பூ⁴ய꞉ ஶ்ருʼணு மே பரமம்ʼ வச꞉ ।
    இஷ்டோ(அ)ஸி மே த்³ருʼட⁴மிதி ததோ வக்ஷ்யாமி தே ஹிதம் ॥

65: |-
    மன்மனா ப⁴வ மத்³ப⁴க்தோ மத்³யாஜீ மாம்ʼ நமஸ்குரு ।
    மாமேவைஷ்யஸி ஸத்யம்ʼ தே ப்ரதிஜானே ப்ரியோ(அ)ஸி மே ॥

66: |-
    ஸர்வ-த⁴ர்மான் பரித்யஜ்ய மாமேகம்ʼ ஶரணம்ʼ வ்ரஜ ।
    அஹம்ʼ த்வா ஸர்வ-பாபேப்⁴யோ மோக்ஷயிஷ்யாமி மா ஶுச꞉ ॥

67: |-
    இத³ம்ʼ தே நாதபஸ்காய நாப⁴க்தாய கதா³சன ।
    ந சாஶுஶ்ரூஷவே வாச்யம்ʼ ந ச மாம்ʼ யோ(அ)ப்⁴யஸூயதி ॥

68: |-
    ய இமம்ʼ பரமம்ʼ கு³ஹ்யம்ʼ மத்³-ப⁴க்தேஷ்வபி⁴-தா⁴ஸ்யதி ।
    ப⁴க்திம்ʼ மயி பராம்ʼ க்ருʼத்வா மாமேவைஷ்யத்யஸம்ʼஶய꞉ ॥

69: |-
    ந ச தஸ்மான்மனுஷ்யேஷு கஶ்சின்மே ப்ரிய-க்ருʼத்தம꞉ ।
    ப⁴விதா ந ச மே தஸ்மாத் அன்ய꞉ ப்ரிய-தரோ பு⁴வி ॥

70: |-
    அத்⁴யேஷ்யதே ச ய இமம்ʼ த⁴ர்ம்யம்ʼ ஸம்ʼவாத³மாவயோ꞉ ।
    ஜ்ஞான-யஜ்ஞேன தேனாஹம்ʼ இஷ்ட꞉ ஸ்யாமிதி மே மதி꞉ ॥

71: |-
    ஶ்ர்ரத்³தா⁴-வானனஸூயஶ்ச ஶ்ருʼணுயாத³பி யோ நர꞉ ।
    ஸோ(அ)பி முக்த꞉ ஶுபா⁴ன் லோகான் ப்ராப்னுயாத்புண்ய-கர்மணாம் ॥

72: |-
    கச்சிதே³தச்ச்²ருதம்ʼ பார்த² த்வயைகாக்³ரேண சேதஸா ।
    கச்சித³ஜ்ஞான-ஸம்ʼமோஹ꞉ ப்ரநஷ்டஸ்தே த⁴னம்ʼ-ஜய ॥

73: |-
    நஷ்டோ மோஹ꞉ ஸ்ம்ருʼதிர்லப்³தா⁴ த்வத்-ப்ரஸாதா³ன்மயா(அ)ச்யுத ।
    ஸ்தி²தோ(அ)ஸ்மி க³த-ஸந்தே³ஹ꞉ கரிஷ்யே வசனம்ʼ தவ ॥

74: |-
    இத்யஹம்ʼ வாஸு-தே³வஸ்ய பார்த²ஸ்ய ச மஹாத்மன꞉ ।
    ஸம்ʼவாத³மிமமஶ்ரௌஷம்ʼ அத்³பு⁴தம்ʼ ரோம-ஹர்ஷணம் ॥

75: |-
    வ்யாஸ-ப்ரஸாதா³ச்ச்²ருதவான் ஏதத்³ கு³ஹ்யமஹம்ʼ பரம் ।
    யோக³ம்ʼ யோகே³ஶ்வராத் க்ருʼஷ்ணாத் ஸாக்ஷாத் கத²யத꞉ ஸ்வயம் ॥

76: |-
    ராஜன் ஸம்ʼஸ்ம்ருʼத்ய-ஸம்ʼஸ்ம்ருʼத்ய ஸம்ʼவாத³மிமமத்³பு⁴தம் ।
    கேஶவார்ஜுனயோ꞉ புண்யம்ʼ ஹ்ருʼஷ்யாமி ச முஹுர்முஹு꞉ ॥

77: |-
    தச்ச ஸம்ʼஸ்ம்ருʼத்ய-ஸம்ʼஸ்ம்ருʼத்ய ரூபமத்யத்³பு⁴தம்ʼ ஹரே꞉ ।
    விஸ்மயோ மே மஹான் ராஜன் ஹ்ருʼஷ்யாமி ச புன꞉-புன꞉ ॥

78: |-
    யத்ர யோகே³ஶ்வர꞉ க்ருʼஷ்ணோ யத்ர பார்தோ² த⁴னுர்த⁴ர꞉ ।
    தத்ர ஶ்ரீர்விஜயோ பூ⁴தி꞉ த்⁴ருவா நீதிர்மதிர்மம ॥

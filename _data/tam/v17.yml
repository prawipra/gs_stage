1: |-
    யே ஶாஸ்த்ர-விதி⁴முத்ஸ்ருʼஜ்ய யஜந்தே ஶ்ரத்³த⁴யா(அ)ன்விதா꞉ ।
    தேஷாம்ʼ நிஷ்டா² து கா க்ருʼஷ்ண ஸத்த்வமாஹோ ரஜஸ்தம꞉ ॥

2: |-
    த்ரி-விதா⁴ ப⁴வதி ஶ்ரத்³தா⁴ தே³ஹினாம்ʼ ஸா ஸ்வ-பா⁴வ-ஜா ।
    ஸாத்த்விகீ ராஜஸீ சைவ தாமஸீ சேதி தாம்ʼ ஶ்ருʼணு ॥

3: |-
    ஸத்வானுரூபா ஸர்வஸ்ய ஶ்ரத்³தா⁴ ப⁴வதி பா⁴ரத ।
    ஶ்ரத்³தா⁴-மயோ(அ)யம்ʼ புருஷோ யோ யச்ச்²ரத்³த⁴꞉ ஸ ஏவ ஸ꞉ ॥

4: |-
    யஜந்தே ஸாத்த்விகா தே³வான் யக்ஷ-ரக்ஷாம்ʼஸி ராஜஸா꞉ ।
    ப்ரேதான் பூ⁴த-க³ணாம்ʼஶ்சான்யே யஜந்தே தாமஸா ஜனா꞉ ॥

5: |-
    அஶாஸ்த்ர-விஹிதம்ʼ கோ⁴ரம்ʼ தப்யந்தே யே தபோ ஜனா꞉ ।
    ட³ம்பா⁴ஹங்கார-ஸம்ʼயுக்தா꞉ காம-ராக³-ப³லான்விதா꞉ ॥

6: |-
    கர்ஶயந்த꞉ ஶரீர-ஸ்த²ம்ʼ பூ⁴த-க்³ராமமசேதஸ꞉ ।
    மாம்ʼ சைவாந்த꞉-ஶரீர-ஸ்த²ம்ʼ தான் வித்⁴யாஸுர-நிஶ்சயான் ॥

7: |-
    ஆஹாரஸ்த்வபி ஸர்வஸ்ய த்ரி-விதோ⁴ ப⁴வதி ப்ரிய꞉ ।
    யஜ்ஞஸ்தபஸ்ததா² தா³னம்ʼ தேஷாம்ʼ பே⁴த³மிமம்ʼ ஶ்ருʼணு ॥

8: |-
    ஆயுஸ்ஸத்த்வ-ப³லாரோக்³ய-ஸுக²-ப்ரீதி-விவர்த⁴னா꞉ ।
    ரஸ்யா꞉ ஸ்னிக்³தா⁴꞉ ஸ்தி²ரா ஹ்ருʼத்³யா꞉ ஆஹாரா꞉ ஸாத்த்விக-ப்ரியா꞉ ॥

9: |-
    கட்வம்ல-லவணாத்யுஷ்ண-தீக்ஷ்ண-ரூக்ஷ-விதா³ஹின꞉ ।
    ஆஹாரா ராஜஸஸ்யேஷ்டா꞉ து³꞉க²-ஶோகாமய-ப்ரதா³꞉ ॥

10: |-
    யாத-யாமம்ʼ க³த-ரஸம்ʼ பூதி பர்யுஷிதம்ʼ ச யத் ।
    உச்சி²ஷ்டமபி சாமேத்⁴யம்ʼ போ⁴ஜனம்ʼ தாமஸ-ப்ரியம் ॥

11: |-
    அப²லாகாங்க்ஷிபி⁴ர்யஜ்ஞோ விதி⁴-த்³ருʼஷ்டோ ய இஜ்யதே ।
    யஷ்டவ்யமேவேதி மன꞉ ஸமாதா⁴ய ஸ ஸாத்த்விக꞉ ॥

12: |-
    அபி⁴-ஸந்தா⁴ய து ப²லம்ʼ ட³ம்பா⁴ர்த²மபி சைவ யத் ।
    இஜ்யதே ப⁴ரத-ஶ்ரேஷ்ட² தம்ʼ யஜ்ஞம்ʼ வித்³தி⁴ ராஜஸம் ॥

13: |-
    விதி⁴-ஹீநமஸ்ருʼஷ்டான்னம்ʼ மந்த்ர-ஹீனமத³க்ஷிணம் ।
    ஶ்ரத்³தா⁴-விரஹிதம்ʼ யஜ்ஞம்ʼ தாமஸம்ʼ பரி-சக்ஷதே ॥

14: |-
    தே³வ-த்³விஜ-கு³ரு-ப்ராஜ்ஞ-பூஜனம்ʼ ஶௌசமார்ஜவம் ।
    ப்³ரஹ்ம-சர்யமஹிம்ʼஸா ச ஶாரீரம்ʼ தப உச்யதே ॥

15: |-
    அனுத்³வேக³-கரம்ʼ வாக்யம்ʼ ஸத்யம்ʼ ப்ரிய-ஹிதம்ʼ ச யத் ।
    ஸ்வாத்⁴யாயாப்⁴யஸனம்ʼ சைவ வாங்மயம்ʼ தப உச்யதே ॥

16: |-
    மன꞉-ப்ரஸாத³꞉ ஸௌம்யத்வம்ʼ மௌனமாத்ம-விநிக்³ரஹ꞉ ।
    பா⁴வ-ஸம்ʼஶுத்³தி⁴ரித்யேதத் தபோ மானஸமுச்யதே ॥

17: |-
    ஶ்ரத்³த⁴யா பரயா தப்தம்ʼ தபஸ்தத் த்ரி-வித⁴ம்ʼ நரை꞉ ।
    அப²லாகாங்க்ஷிபி⁴ர்யுக்தை꞉ ஸாத்த்விகம்ʼ பரி-சக்ஷதே ॥

18: |-
    ஸத்கார-மான-பூஜார்த²ம்ʼ தபோ ட³ம்பே⁴ன சைவ யத் ।
    க்ரியதே ததி³ஹ ப்ரோக்தம்ʼ ராஜஸம்ʼ சலமத்⁴ருவம் ॥

19: |-
    மூட⁴-க்³ராஹேணா(அ)த்மனோ யத் பீட³யா க்ரியதே தப꞉ ।
    பரஸ்யோத்ஸாத³னார்த²ம்ʼ வா தத்தாமஸமுதா³ஹ்ருʼதம் ॥

20: |-
    தா³தவ்யமிதி யத்³தா³னம்ʼ தீ³யதே(அ)னுப-காரிணே ।
    தே³ஶே காலே ச பாத்ரே ச தத்³தா³னம்ʼ ஸாத்த்விகம்ʼ ஸ்ம்ருʼதம் ॥

21: |-
    யத்து ப்ரத்யுப-காரார்த²ம்ʼ ப²லமுத்³தி³ஶ்ய வா புன꞉ ।
    தீ³யதே ச பரி-க்லிஷ்டம்ʼ தத்³ ராஜஸமுதா³ஹ்ருʼதம் ॥

22: |-
    அதே³ஶ-காலே யத்³தா³னம்ʼ அபாத்ரேப்⁴யஶ்ச தீ³யதே ।
    அஸத்க்ருʼதமவ-ஜ்ஞாதம்ʼ தத்தாமஸமுதா³ஹ்ருʼதம் ॥

23: |-
    ௐ தத் ஸதி³தி நிர்தே³ஶோ ப்³ரஹ்மணஸ்த்ரி-வித⁴꞉ ஸ்ம்ருʼத꞉ ।
    ப்³ராஹ்மணாஸ்தேன வேதா³ஶ்ச யஜ்ஞாஶ்ச விஹிதா꞉ புரா ॥

24: |-
    தஸ்மாதோ³மித்யுதா³ஹ்ருʼத்ய யஜ்ஞ-தா³ன-தப꞉-க்ரியா꞉ ।
    ப்ரவர்தந்தே விதா⁴னோக்தா꞉ ஸததம்ʼ ப்³ரஹ்ம-வாதி³னாம் ॥

25: |-
    ததி³த்யனபி⁴-ஸந்தா⁴ய ப²லம்ʼ யஜ்ஞ-தப꞉-க்ரியா꞉ ।
    தா³ன-க்ரியாஶ்ச விவிதா⁴꞉ க்ரியந்தே மோக்ஷ-காங்க்ஷிபி⁴꞉ ॥

26: |-
    ஸத்³பா⁴வே ஸாது⁴-பா⁴வே ச ஸதி³த்யேதத் ப்ரயுஜ்யதே ।
    ப்ரஶஸ்தே கர்மணி ததா² ஸச்ச²ப்³த³꞉ பார்த² யுஜ்யதே ॥

27: |-
    யஜ்ஞே தபஸி தா³னே ச ஸ்தி²தி꞉ ஸதி³தி சோச்யதே ।
    கர்ம சைவ தத³ர்தீ²யம்ʼ ஸதி³த்யேவாபி⁴-தீ⁴யதே ॥

28: |-
    அஶ்ரத்³த⁴யா ஹுதம்ʼ த³த்தம்ʼ தபஸ்தப்தம்ʼ க்ருʼதம்ʼ ச யத் ।
    அஸதி³த்யுச்யதே பார்த² ந ச தத் ப்ரேத்ய நோ இஹ ॥

1: |-
    இத³ம்ʼ து தே கு³ஹ்ய-தமம்ʼ ப்ரவக்ஷ்யாம்யனஸூயவே ।
    ஜ்ஞானம்ʼ விஜ்ஞான-ஸஹிதம்ʼ யஜ்ஜ்ஞாத்வா மோக்ஷ்யஸே(அ)ஶுபா⁴த் ॥

2: |-
    ராஜ-வித்³யா ராஜ-கு³ஹ்யம்ʼ பவித்ரமித³முத்தமம் ।
    ப்ரத்யக்ஷாவ-க³மம்ʼ த⁴ர்ம்யம்ʼ ஸுஸுக²ம்ʼ கர்துமவ்யயம் ॥

3: |-
    அஶ்ரத்³த³தா⁴னா꞉ புருஷா꞉ த⁴ர்மஸ்யாஸ்ய பரம்ʼ-தப ।
    அப்ராப்ய மாம்ʼ நிவர்தந்தே ம்ருʼத்யு-ஸம்ʼஸார-வர்த்மனி ॥

4: |-
    மயா ததமித³ம்ʼ ஸர்வம்ʼ ஜக³த³வ்யக்த-மூர்தினா ।
    மத்ஸ்தா²னி ஸர்வ-பூ⁴தானி நசாஹம்ʼ தேஷ்வவஸ்தி²த꞉ ॥

5: |-
    ந ச மத்ஸ்தா²னி பூ⁴தானி பஶ்ய மே யோக³மைஶ்வரம் ।
    பூ⁴த-ப்⁴ருʼன்ன ச பூ⁴த-ஸ்தோ² மமா(அ)த்மா பூ⁴த-பா⁴வன꞉ ॥

6: |-
    யதா²(ஆ)காஶ-ஸ்தி²தோ நித்யம்ʼ வாயு꞉ ஸர்வத்ர-கோ³ மஹான் ।
    ததா² ஸர்வாணி பூ⁴தானி மத்ஸ்தா²னீத்யுப-தா⁴ரய ॥

7: |-
    ஸர்வ-பூ⁴தானி கௌந்தேய ப்ரக்ருʼதிம்ʼ யாந்தி மாமிகாம் ।
    கல்ப-க்ஷயே புனஸ்தானி கல்பாதௌ³ வி-ஸ்ருʼஜாம்யஹம் ॥

8: |-
    ப்ரக்ருʼதிம்ʼ ஸ்வாமவஷ்டப்⁴ய வி-ஸ்ருʼஜாமி புன꞉-புன꞉ ।
    பூ⁴த-க்³ராமமிமம்ʼ க்ருʼத்ஸ்னம்ʼ அவஶம்ʼ ப்ரக்ருʼதேர்வஶாத் ॥

9: |-
    ந ச மாம்ʼ தானி கர்மாணி நிப³த்⁴னந்தி த⁴னம்ʼ-ஜய ।
    உதா³ஸீனவதா³ஸீனம்ʼ அஸக்தம்ʼ தேஷு கர்மஸு ॥

10: |-
    மயா(அ)த்⁴யக்ஷேண ப்ரக்ருʼதி꞉ ஸூயதே ஸ-சராசரம் ।
    ஹேதுனா(அ)னேன கௌந்தேய ஜக³த்³ விபரி-வர்ததே ॥

11: |-
    அவ-ஜானந்தி மாம்ʼ மூடா⁴ மானுஷீம்ʼ தனுமாஶ்ரிதம் ।
    பரம்ʼ பா⁴வமஜானந்தோ மம பூ⁴த-மஹேஶ்வரம் ॥

12: |-
    மோகா⁴ஶா மோக⁴-கர்மாணோ மோக⁴-ஜ்ஞானா விசேதஸ꞉ ।
    ராக்ஷஸீமாஸுரீம்ʼ சைவ ப்ரக்ருʼதிம்ʼ மோஹினீம்ʼ ஶ்ரிதா꞉ ॥

13: |-
    மஹாத்மானஸ்து மாம்ʼ பார்த² தை³வீம்ʼ ப்ரக்ருʼதிமாஶ்ரிதா꞉ ।
    ப⁴ஜந்த்யனன்ய-மனஸோ ஜ்ஞாத்வா பூ⁴தாதி³மவ்யயம் ॥

14: |-
    ஸததம்ʼ கீர்தயந்தோ மாம்ʼ யதந்தஶ்ச த்³ருʼட⁴-வ்ரதா꞉ ।
    நமஸ்யந்தஶ்ச மாம்ʼ ப⁴க்த்யா நித்ய-யுக்தா உபாஸதே ॥

15: |-
    ஜ்ஞான-யஜ்ஞேன சாப்யன்யே யஜந்தோ மாமுபாஸதே ।
    ஏகத்வேன ப்ருʼத²க்த்வேன ப³ஹுதா⁴ விஶ்வதோ-முக²ம் ॥

16: |-
    அஹம்ʼ க்ரதுரஹம்ʼ யஜ்ஞ꞉ ஸ்வதா⁴(அ)ஹமஹமௌஷத⁴ம் ।
    மந்த்ரோ(அ)ஹமஹமேவா(அ)ஜ்யம்ʼ அஹமக்³நிரஹம்ʼ ஹுதம் ॥

17: |-
    பிதா(அ)ஹமஸ்ய ஜக³தோ மாதா தா⁴தா பிதாமஹ꞉ ।
    வேத்³யம்ʼ பவித்ரமோங்கார꞉ ருʼக் ஸாம யஜுரேவ ச ॥

18: |-
    க³திர்ப⁴ர்தா ப்ரபு⁴꞉ ஸாக்ஷீ நிவாஸ꞉ ஶரணம்ʼ ஸுஹ்ருʼத் ।
    ப்ரப⁴வ꞉ ப்ரளய꞉ ஸ்தா²னம்ʼ நிதா⁴னம்ʼ பீ³ஜமவ்யயம் ॥

19: |-
    தபாம்யஹமஹம்ʼ வர்ஷம்ʼ நிக்³ருʼஹ்ணாம்யுத்ஸ்ருʼஜாமி ச ।
    அம்ருʼதம்ʼ சைவ ம்ருʼத்யுஶ்ச ஸத³ஸச்சாஹமர்ஜுன ॥

20: |-
    த்ரைவித்³யா மாம்ʼ ஸோம-பா꞉ பூத-பாபா꞉ 
    யஜ்ஞைரிஷ்ட்வாஸ்வர்க³திம்ʼ ப்ரார்த²யந்தே ।
    தே புண்யமாஸாத்⁴ய ஸுரேந்த்³ர-லோகம்ʼ 
    அஶ்னந்தி தி³வ்யான் தி³வி தே³வ-போ⁴கா³ன் ॥

21: |-
    தே தம்ʼ பு⁴க்த்வா ஸ்வர்க³-லோகம்ʼ விஶாலம்ʼ 
    க்ஷீணே புண்யே மர்த்ய-லோகம்ʼ விஶந்தி ।
    ஏவம்ʼ த்ரயீ-த⁴ர்மமனு-ப்ரபன்னா꞉ 
    க³தாக³தம்ʼ காம-காமா லப⁴ந்தே ॥

22: |-
    அனன்யாஶ்சிந்தயந்தோ மாம்ʼ யே ஜனா꞉ பர்யுபாஸதே ।
    தேஷாம்ʼ நித்யாபி⁴-யுக்தானாம்ʼ யோக³-க்ஷேமம்ʼ வஹாம்யஹம் ॥

23: |-
    யே(அ)ப்யன்ய-தே³வதா-ப⁴க்தா꞉ யஜந்தே ஶ்ரத்³த⁴யா(அ)ன்விதா꞉ ।
    தே(அ)பி மாமேவ கௌந்தேய யஜந்த்யவிதி⁴-பூர்வகம் ॥

24: |-
    அஹம்ʼ ஹி ஸர்வ-யஜ்ஞானாம்ʼ போ⁴க்தா ச ப்ரபு⁴ரேவ ச ।
    நது மாமபி⁴-ஜானந்தி தத்த்வேனாதஶ்ச்யவந்தி தே ॥

25: |-
    யாந்தி தே³வ-வ்ரதா தே³வான் பித்ரூʼன் யாந்தி பித்ருʼ-வ்ரதா꞉ ।
    பூ⁴தேஜ்யா யாந்தி பூ⁴தானி யாந்தி மத்³யாஜினோ(அ)பி மாம் ॥

26: |-
    பத்ரம்ʼ புஷ்பம்ʼ ப²லம்ʼ தோயம்ʼ யோ மே ப⁴க்த்யாப்ரயச்ச²தி ।
    தத³ஹம்ʼ ப⁴க்த்யுப-ஹ்ருʼதம்ʼ அஶ்நாமி ப்ரயதாத்மன꞉ ॥

27: |-
    யத் கரோஷி யத³ஶ்னாஸி யஜ்ஜுஹோஷி த³தா³ஸி யத் ।
    யத்தபஸ்யஸி கௌந்தேய தத் குருஷ்வ மத³ர்பணம் ॥

28: |-
    ஶுபா⁴ஶுப⁴-ப²லைரேவம்ʼ மோக்ஷ்யஸே கர்ம-ப³ந்த⁴னை꞉ ।
    ஸம்ʼந்யாஸ-யோக³-யுக்தாத்மா விமுக்தோ மாமுபைஷ்யஸி ॥

29: |-
    ஸமோ(அ)ஹம்ʼ ஸர்வ-பூ⁴தேஷு ந மே த்³வேஷ்யோ(அ)ஸ்தி ந ப்ரிய꞉ ।
    யே ப⁴ஜந்தி து மாம்ʼ ப⁴க்த்யா மயி தே தேஷு சாப்யஹம் ॥

30: |-
    அபி சேத் ஸு-து³ராசாரோ ப⁴ஜதே மாமனன்ய-பா⁴க் ।
    ஸாது⁴ரேவ ஸ மந்தவ்ய꞉ ஸம்யக்³ வ்யவஸிதோ ஹி ஸ꞉ ॥

31: |-
    க்ஷிப்ரம்ʼ ப⁴வதி த⁴ர்மாத்மா ஶஶ்வச்சா²ந்திம்ʼ நிக³ச்ச²தி ।
    கௌந்தேய ப்ரதி-ஜானீஹி ந மே ப⁴க்த꞉ ப்ரணஶ்யதி ॥

32: |-
    மாம்ʼ ஹி பார்த² வ்யபாஶ்ரித்ய யே(அ)பி ஸ்யு꞉ பாப-யோனய꞉ ।
    ஸ்த்ரியோ வைஶ்யாஸ்ததா² ஶூத்³ரா꞉ தே(அ)பி யாந்தி பராம்ʼ க³திம் ॥

33: |-
    கிம்ʼ புனர்ப்³ராஹ்மணா꞉ புண்யா꞉ ப⁴க்தா ராஜர்ஷயஸ்ததா² ।
    அநித்யமஸுக²ம்ʼ லோகம்ʼ இமம்ʼ ப்ராப்ய ப⁴ஜஸ்வ மாம் ॥

34: |-
    மன்மனா ப⁴வ மத்³ப⁴க்தோ மத்³யாஜீ மாம்ʼ நமஸ்குரு ।
    மாமேவைஷ்யஸி யுக்த்வைவம்ʼ ஆத்மானம்ʼ மத்பராயண꞉ ॥

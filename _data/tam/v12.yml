1: |-
    ஏவம்ʼ ஸதத-யுக்தா யே ப⁴க்தாஸ்த்வாம்ʼ பர்யுபாஸதே ।
    யே சாப்யக்ஷரமவ்யக்தம்ʼ தேஷாம்ʼ கே யோக³-வித்தமா꞉ ॥

2: |-
    மய்யாவேஶ்ய மனோ யே மாம்ʼ நித்ய-யுக்தா உபாஸதே ।
    ஶ்ரத்³த⁴யா பரயோபேதா꞉ தே மே யுக்த-தமா மதா꞉ ॥

3: |-
    யே த்வக்ஷரமநிர்தே³ஶ்யம்ʼ அவ்யக்தம்ʼ பர்யுபாஸதே ।
    ஸர்வத்ர-க³மசிந்த்யம்ʼ ச கூட-ஸ்த²மசலம்ʼ த்⁴ருவம் ॥

4: |-
    ஸந்நியம்யேந்த்³ரிய-க்³ராமம்ʼ ஸர்வத்ர ஸம-பு³த்³த⁴ய꞉ ।
    தே ப்ராப்னுவந்தி மாமேவ ஸர்வ-பூ⁴த-ஹிதே ரதா꞉ ॥

5: |-
    க்லேஶோ(அ)தி⁴க-தரஸ்தேஷாம்ʼ அவ்யக்தாஸக்த-சேதஸாம் ।
    அவ்யக்தா ஹி க³திர்து³꞉க²ம்ʼ தே³ஹ-வத்³பி⁴ரவாப்யதே ॥

6: |-
    யே து ஸர்வாணி கர்மாணி மயி ஸம்ʼந்யஸ்ய மத்-பரா꞉ ।
    அனன்யேனைவ யோகே³ன மாம்ʼ த்⁴யாயந்த உபாஸதே ॥

7: |-
    தேஷாமஹம்ʼ ஸமுத்³த⁴ர்தா ம்ருʼத்யு-ஸம்ʼஸார-ஸாக³ராத் ।
    ப⁴வாமி ந-சிராத் பார்த² மய்யாவேஶித-சேதஸாம் ॥

8: |-
    மய்யேவ மன ஆத⁴த்ஸ்வ மயி பு³த்³தி⁴ம்ʼ நிவேஶய ।
    நிவஸிஷ்யஸி மய்யேவ அத ஊர்த்⁴வம்ʼ ந ஸம்ʼஶய꞉ ॥

9: |-
    அத² சித்தம்ʼ ஸமாதா⁴தும்ʼ ந ஶக்னோஷி மயி ஸ்தி²ரம் ।
    அப்⁴யாஸ-யோகே³ன ததோ மாமிச்சா²sப்தும்ʼ த⁴னம்ʼ-ஜய ॥

10: |-
    அப்⁴யாஸே(அ)ப்யஸமர்தோ²(அ)ஸி மத்-கர்ம-பரமோ ப⁴வ ।
    மத³ர்த²மபி கர்மாணி குர்வன் ஸித்³தி⁴மவாப்ஸ்யஸி ॥

11: |-
    அதை²தத³ப்யஶக்தோ(அ)ஸி கர்தும்ʼ மத்³யோக³மாஶ்ரித꞉ ।
    ஸர்வ-கர்ம-ப²ல-த்யாக³ம்ʼ தத꞉ குரு யதாத்ம-வான் ॥

12: |-
    ஶ்ரேயோ ஹி ஜ்ஞானமப்⁴யாஸாத் ஜ்ஞாநாத்³ த்⁴யானம்ʼ விஶிஷ்யதே ।
    த்⁴யானாத் கர்ம-ப²ல-த்யாக³꞉ த்யாகா³ச்சா²ந்திரனந்தரம் ॥

13: |-
    அத்³வேஷ்டா ஸர்வ-பூ⁴தானாம்ʼ மைத்ர꞉ கருண ஏவ ச ।
    நிர்மமோ நிரஹங்கார꞉ ஸம-து³꞉க²-ஸுக²꞉ க்ஷமீ ॥

14: |-
    ஸந்துஷ்ட꞉ ஸததம்ʼ யோகீ³ யதாத்மா த்³ருʼட⁴-நிஶ்சய꞉ ।
    மய்யர்பித-மனோ-பு³த்³தி⁴꞉ யோ மத்³ப⁴க்த꞉ ஸ மே ப்ரிய꞉ ॥

15: |-
    யஸ்மான்னோத்³விஜதே லோகோ லோகான்னோத்³விஜதே ச ய꞉ ।
    ஹர்ஷாமர்ஷ-ப⁴யோத்³வேகை³꞉ முக்தோ ய꞉ ஸ ச மே ப்ரிய꞉ ॥

16: |-
    அனபேக்ஷ꞉ ஶுசிர்த³க்ஷ꞉ உதா³ஸீனோ க³த-வ்யத²꞉ ।
    ஸர்வாரம்ப⁴-பரித்யாகீ³ யோ மத்³-ப⁴க்த꞉ ஸ மே ப்ர்ரிய꞉ ॥

17: |-
    யோ ந ஹ்ருʼஷ்யதி ந த்³வேஷ்டி ந ஶோசதி ந காங்க்ஷதி ।
    ஶுபா⁴ஶுப⁴-பரித்யாகீ³ ப⁴க்தி-மான் ய꞉ ஸ மே ப்ரிய꞉ ॥

18: |-
    ஸம꞉ ஶத்ரௌ ச மித்ரே ச ததா² மானாப-மானயோ꞉ ।
    ஶீதோஷ்ண-ஸுக²-து³꞉கே²ஷு ஸம꞉ ஸங்க³-விவர்ஜித꞉ ॥

19: |-
    துல்ய-நிந்தா³-ஸ்துதிர்மௌனீ ஸந்துஷ்டோ யேன-கேன-சித் ।
    அநிகேத꞉ ஸ்தி²ர-மதி꞉ ப⁴க்தி-மான் மே ப்ரியோ நர꞉ ॥

20: |-
    யே து த⁴ர்ம்யாம்ருʼதமித³ம்ʼ யதோ²க்தம்ʼ பர்யுபாஸதே ।
    ஶ்ரத்³த³தா⁴னா மத்-பரமா꞉ ப⁴க்தாஸ்தே(அ)தீவ மே ப்ரியா꞉ ॥

1: |-
    பூ⁴ய ஏவ மஹா-பா³ஹோ ஶ்ருʼணு மே பரமம்ʼ வச꞉ ।
    யத் தே(அ)ஹம்ʼ ப்ரீயமாணாய வக்ஷ்யாமி ஹித-காம்யயா ॥

2: |-
    ந மே விது³꞉ ஸுர-க³ணா꞉ ப்ரப⁴வம்ʼ ந மஹர்ஷய꞉ ।
    அஹமாதி³ர்ஹி தே³வானாம்ʼ மஹர்ஷீணாம்ʼ ச ஸர்வஶ꞉ ॥

3: |-
    யோ மாமஜமநாதி³ம்ʼ ச வேத்தி லோக-மஹேஶ்வரம் ।
    அஸம்மூட⁴꞉ ஸ மர்த்யேஷு ஸர்வ-பாபை꞉ ப்ரமுச்யதே ॥

4: |-
    பு³த்³தி⁴ர்ஜ்ஞானமஸம்மோஹ꞉ க்ஷமா ஸத்யம்ʼ த³ம꞉ ஶம꞉ ।
    ஸுக²ம்ʼ து³꞉க²ம்ʼ ப⁴வோ(அ)பா⁴வோ ப⁴யம்ʼ சாப⁴யமேவ ச ॥

5: |-
    அஹிம்ʼஸா ஸமதா துஷ்டி꞉ தபோ தா³னம்ʼ யஶோ(அ)யஶ꞉ ।
    ப⁴வந்தி பா⁴வா பூ⁴தானாம்ʼ மத்த ஏவ ப்ருʼத²க்³விதா⁴꞉ ॥

6: |-
    மஹர்ஷய꞉ ஸப்த பூர்வே சத்வாரோ மனவஸ்ததா² ।
    மத்³பா⁴வா மானஸா ஜாதா꞉ யேஷாம்ʼ லோக இமா꞉ ப்ரஜா꞉ ॥

7: |-
    ஏதாம்ʼ விபூ⁴திம்ʼ யோக³ம்ʼ ச மம யோ வேத்தி தத்த்வத꞉ ।
    ஸோ(அ)வி-கம்பேன யோகே³ன யுஜ்யதே நாத்ர ஸம்ʼஶய꞉ ॥

8: |-
    அஹம்ʼ ஸர்வஸ்ய ப்ரப⁴வோ மத்த꞉ ஸர்வம்ʼ ப்ரவர்ததே ।
    இதி மத்வா ப⁴ஜந்தே மாம்ʼ பு³தா⁴ பா⁴வ-ஸமன்விதா꞉ ॥

9: |-
    மச்சித்தா மத்³க³த-ப்ராணா꞉ போ³த⁴யந்த꞉ பரஸ்பரம் ।
    கத²யந்தஶ்ச மாம்ʼ நித்யம்ʼ துஷ்யந்தி ச ரமந்தி ச ॥

10: |-
    தேஷாம்ʼ ஸதத-யுக்தானாம்ʼ ப⁴ஜதாம்ʼ ப்ரீதி-பூர்வகம் ।
    த³தா³மி பு³த்³தி⁴-யோக³ம்ʼ தம்ʼ யேன மாமுபயாந்தி தே ॥

11: |-
    தேஷாமேவானு-கம்பார்த²ம்ʼ அஹமஜ்ஞான-ஜம்ʼ தம꞉ ।
    நாஶயாம்யாத்ம-பா⁴வஸ்தோ² ஜ்ஞான-தீ³பேன பா⁴ஸ்வதா ॥

12: |-
    பரம்ʼ ப்³ரஹ்ம பரம்ʼ தா⁴ம பவித்ரம்ʼ பரமம்ʼ ப⁴வான் ।
    புருஷம்ʼ ஶாஶ்வதம்ʼ தி³வ்யம்ʼ ஆதி³-தே³வமஜம்ʼ விபு⁴ம் ॥

13: |-
    ஆஹுஸ்த்வாம்ருʼஷய꞉ ஸர்வே தே³வர்ஷிர்நாரத³ஸ்ததா² ।
    அஸிதோ தே³வலோ வ்யாஸ꞉ ஸ்வயம்ʼ சைவ ப்³ரவீஷி மே ॥

14: |-
    ஸர்வமேதத்³ருʼதம்ʼ மன்யே யன்மாம்ʼ வத³ஸி கேஶவ ।
    நஹி தே ப⁴க³வன் வ்யக்திம்ʼ விது³ர்தே³வா ந தா³னவா꞉ ॥

15: |-
    ஸ்வயமேவாத்மனா(ஆ)த்மானம்ʼ வேத்த² த்வம்ʼ புருஷோத்தம ।
    பூ⁴த-பா⁴வன பூ⁴தேஶ தே³வ-தே³வ ஜக³த்பதே ॥

16: |-
    வக்துமர்ஹஸ்யஶேஷேண தி³வ்யா ஹ்யாத்ம-விபூ⁴தய꞉ ।
    யாபி⁴ர்விபூ⁴திபி⁴ர்லோகான் இமாம்ʼஸ்த்வம்ʼ வ்யாப்ய திஷ்ட²ஸி ॥

17: |-
    கத²ம்ʼ வித்³யாமஹம்ʼ யோகி³ன் த்வாம்ʼ ஸதா³ பரி-சிந்தயன் ।
    கேஷு-கேஷு ச பா⁴வேஷு சிந்த்யோ(அ)ஸி ப⁴க³வன் மயா ॥

18: |-
    விஸ்தரேணாத்மனோ யோக³ம்ʼ விபூ⁴திம்ʼ ச ஜனார்த³ன ।
    பூ⁴ய꞉ கத²ய த்ருʼப்திர்ஹி ஶ்ருʼண்வதோ நாஸ்தி மே(அ)ம்ருʼதம் ॥

19: |-
    ஹந்த தே கத²யிஷ்யாமி தி³வ்யா ஹ்யாத்ம-விபூ⁴தய꞉ ।
    ப்ராதா⁴ன்யத꞉ குரு-ஶ்ரேஷ்ட² நாஸ்த்யந்தோ விஸ்தரஸ்ய மே ॥

20: |-
    அஹமாத்மா கு³டா³கேஶ ஸர்வ-பூ⁴தாஶய-ஸ்தி²த꞉ ।
    அஹமாதி³ஶ்ச மத்⁴யம்ʼ ச பூ⁴தாநாமந்த ஏவ ச ॥

21: |-
    ஆதி³த்யாநாமஹம்ʼ விஷ்ணு꞉ ஜ்யோதிஷாம்ʼ ரவிரம்ʼஶுமான் ।
    மரீசிர்மருதாமஸ்மி நக்ஷத்ராணாமஹம்ʼ ஶஶீ ॥

22: |-
    வேதா³னாம்ʼ ஸாம-வேதோ³(அ)ஸ்மி தே³வாநாமஸ்மி வாஸவ꞉ ।
    இந்த்³ரியாணாம்ʼ மனஶ்சாஸ்மி பூ⁴தாநாமஸ்மி சேதனா ॥

23: |-
    ருத்³ராணாம்ʼ ஶங்கரஶ்சாஸ்மி வித்தேஶோ யக்ஷ-ரக்ஷஸாம் ।
    வஸூனாம்ʼ பாவகஶ்சாஸ்மி மேரு꞉ ஶிக²ரிணாமஹம் ॥

24: |-
    புரோத⁴ஸாம்ʼ ச முக்²யம்ʼ மாம்ʼ வித்³தி⁴ பார்த² ப்³ருʼஹஸ்பதிம் ।
    ஸேனானீநாமஹம்ʼ ஸ்கந்த³꞉ ஸரஸாமஸ்மி ஸாக³ர꞉ ॥

25: |-
    மஹர்ஷீணாம்ʼ ப்⁴ருʼகு³ரஹம்ʼ கி³ராமஸ்ம்யைகமக்ஷரம் ।
    யஜ்ஞானாம்ʼ ஜப-யஜ்ஞோ(அ)ஸ்மி ஸ்தா²வராணாம்ʼ ஹிமாலய꞉ ॥

26: |-
    அஶ்வத்த²꞉ ஸர்வ-வ்ருʼக்ஷாணாம்ʼ தே³வர்ஷீணாம்ʼ ச நாரத³꞉ ।
    க³ந்த⁴ர்வாணாம்ʼ சித்ர-ரத²꞉ ஸித்³தா⁴னாம்ʼ கபிலோ முனி꞉ ॥

27: |-
    உச்சை꞉ஶ்ரவஸமஶ்வானாம்ʼ வித்³தி⁴ மாமம்ருʼதோத்³ப⁴வம் ।
    ஐராவதம்ʼ க³ஜேந்த்³ராணாம்ʼ நராணாம்ʼ ச நராதி⁴பம் ॥

28: |-
    ஆயுதா⁴நாமஹம்ʼ வஜ்ரம்ʼ தே⁴னூநாமஸ்மி காம-து⁴க் ।
    ப்ரஜனஶ்சாஸ்மி கந்த³ர்ப꞉ ஸர்பாணாமஸ்மி வாஸுகி꞉ ॥

29: |-
    அனந்தஶ்சாஸ்மி நாகா³னாம்ʼ வருணோ யாத³ஸாமஹம் ।
    பித்ரூʼணாமர்யமா சாஸ்மி யம꞉ ஸம்ʼயமதாமஹம் ॥

30: |-
    ப்ரஹ்லாத³ஶ்சாஸ்மி தை³த்யானாம்ʼ கால꞉ கலயதாமஹம் ।
    ம்ருʼகா³ணாம்ʼ ச ம்ருʼகே³ந்த்³ரோ(அ)ஹம்ʼ வைனதேயஶ்ச பக்ஷிணாம் ॥

31: |-
    பவன꞉ பவதாமஸ்மி ராம꞉ ஶஸ்த்ர-ப்⁴ருʼதாமஹம் ।
    ஜ²ஷாணாம்ʼ மகரஶ்சாஸ்மி ஸ்ரோதஸாமஸ்மி ஜாஹ்னவீ ॥

32: |-
    ஸர்கா³ணாமாதி³ரந்தஶ்ச மத்⁴யம்ʼ சைவாஹமர்ஜுன ।
    அத்⁴யாத்ம-வித்³யா வித்³யானாம்ʼ வாத³꞉ ப்ரவத³தாமஹம் ॥

33: |-
    அக்ஷராணாமகாரோ(அ)ஸ்மி த்³வந்த்³வ꞉ ஸாமாஸிகஸ்ய ச ।
    அஹமேவாக்ஷய꞉ காலோ தா⁴தா(அ)ஹம்ʼ விஶ்வதோ-முக²꞉ ॥

34: |-
    ம்ருʼத்யு꞉ ஸர்வ-ஹரஶ்சாஹம்ʼ உத்³ப⁴வஶ்ச ப⁴விஷ்யதாம் ।
    கீர்தி꞉ ஶ்ரீர்வாக் ச நாரீணாம்ʼ ஸ்ம்ருʼதிர்மேதா⁴ த்⁴ருʼதி꞉ க்ஷமா ॥

35: |-
    ப்³ருʼஹத்ஸாம ததா² ஸாம்னாம்ʼ கா³யத்த்ரீ ச²ந்த³ஸாமஹம் ।
    மாஸானாம்ʼ மார்க³-ஶீர்ஷோ(அ)ஹம்ʼ ருʼதூனாம்ʼ குஸுமாகர꞉ ॥

36: |-
    த்³யூதம்ʼ ச²லயதாமஸ்மி தேஜஸ்தேஜஸ்விநாமஹம் ।
    ஜயோ(அ)ஸ்மி வ்யவஸாயோ(அ)ஸ்மி ஸத்வம்ʼ ஸத்த்வ-வதாமஹம் ॥

37: |-
    வ்ருʼஷ்ணீனாம்ʼ வாஸு-தே³வோ(அ)ஸ்மி பாண்ட³வானாம்ʼ த⁴னம்ʼ-ஜய꞉ ।
    முனீநாமப்யஹம்ʼ வ்யாஸ꞉ கவீநாமுஶனா கவி꞉ ॥

38: |-
    த³ண்டோ³ த³மயதாமஸ்மி நீதிரஸ்மி ஜிகீ³ஷதாம் ।
    மௌனம்ʼ சைவாஸ்மி கு³ஹ்யானாம்ʼ ஜ்ஞானம்ʼ ஜ்ஞான-வதாமஹம் ॥

39: |-
    யச்சாபி ஸர்வ-பூ⁴தானாம்ʼ பீ³ஜம்ʼ தத³ஹமர்ஜுன ।
    ந தத³ஸ்தி வினா யத் ஸ்யாத் மயா பூ⁴தம்ʼ சராசரம் ॥

40: |-
    நாந்தோ(அ)ஸ்தி மம தி³வ்யானாம்ʼ விபூ⁴தீனாம்ʼ பரம்ʼ தப ।
    ஏஷ தூத்³தே³ஶத꞉ ப்ரோக்தோ விபூ⁴தேர்விஸ்தரோ மயா ॥

41: |-
    யத்³யத்³ விபூ⁴தி-மத் ஸத்வம்ʼ ஶ்ரீ-மதூ³ர்ஜிதமேவ வா ।
    தத்ததே³வாவ-க³ச்ச² த்வம்ʼ மம தேஜோ(அ)ம்ʼஶ-ஸம்ப⁴வம் ॥

42: |-
    அத²வா ப³ஹுனைதேன கிம்ʼ ஜ்ஞாதேன தவார்ஜுன ।
    விஷ்டப்⁴யாஹமித³ம்ʼ க்ருʼத்ஸ்னம்ʼ ஏகாம்ʼஶேன ஸ்தி²தோ ஜக³த் ॥

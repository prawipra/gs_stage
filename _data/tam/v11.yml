1: |-
    மத³னுக்³ரஹாய பரமம்ʼ கு³ஹ்யமத்⁴யாத்ம-ஸஞ்ஜ்ஞிதம் ।
    யத் த்வயோக்தம்ʼ வசஸ்தேன மோஹோ(அ)யம்ʼ விக³தோ மம ॥

2: |-
    ப⁴வாப்யயௌ ஹி பூ⁴தானாம்ʼ ஶ்ருதௌ விஸ்தரஶோ மயா ।
    த்வத்த꞉ கமல-பத்ராக்ஷ மாஹாத்ம்யமபி சாவ்யயம் ॥

3: |-
    ஏவமேதத்³ யதா²(ஆ)த்த² த்வம்ʼ ஆத்மானம்ʼ பரமேஶ்வர ।
    த்³ரஷ்டுமிச்சா²மி தே ரூபம்ʼ ஐஶ்வரம்ʼ புருஷோத்தம ॥

4: |-
    மன்யஸே யதி³ தச்ச²க்யம்ʼ மயா த்³ரஷ்டுமிதி ப்ரபோ⁴ ।
    யோகே³ஶ்வர ததோ மே த்வம்ʼ த³ர்ஶயா(அ)த்மானமவ்யயம் ॥

5: |-
    பஶ்ய மே பார்த² ரூபாணி ஶதஶோ(அ)த² ஸஹஸ்ரஶ꞉ ।
    நானா-விதா⁴னி தி³வ்யானி நானா-வர்ணாக்ருʼதீனி ச ॥

6: |-
    பஶ்யா(அ)தி³த்யான் வஸூன் ருத்³ரான் அஶ்வினௌ மருதஸ்ததா² ।
    ப³ஹூன்யத்³ருʼஷ்ட-பூர்வாணி பஶ்யா(அ)ஶ்சர்யாணி பா⁴ரத ॥

7: |-
    இஹைக-ஸ்த²ம்ʼ ஜக³த் க்ருʼத்ஸ்னம்ʼ பஶ்யாத்³ய ஸ-சராசரம் ।
    மம தே³ஹே கு³டா³கேஶ யச்சான்யத்³ த்³ரஷ்டுமிச்ச²ஸி ॥

8: |-
    நது மாம்ʼ ஶக்யஸே த்³ரஷ்டும்ʼ அனேனைவ ஸ்வ-சக்ஷுஷா ।
    தி³வ்யம்ʼ த³தா³மி தே சக்ஷு꞉ பஶ்ய மே யோக³மைஶ்வரம் ॥

9: |-
    ஏவமுக்த்வா ததோ ராஜன் மஹா-யோகே³ஶ்வரோ ஹரி꞉ ।
    த³ர்ஶயாமாஸ பார்தா²ய பரமம்ʼ ரூபமைஶ்வரம் ॥

10: |-
    அனேக-வக்த்ர-நயனம்ʼ அனேகாத்³பு⁴த-த³ர்ஶனம் ।
    அனேக-தி³வ்யாப⁴ரணம்ʼ தி³வ்யானேகோத்³யதாயுத⁴ம் ॥

11: |-
    தி³வ்ய-மால்யாம்ப³ர-த⁴ரம்ʼ தி³வ்ய-க³ந்தா⁴னு-லேபனம் ।
    ஸர்வாஶ்சர்ய-மயம்ʼ தே³வம்ʼ அனந்தம்ʼ விஶ்வதோ-முக²ம் ॥

12: |-
    தி³வி ஸூர்ய-ஸஹஸ்ரஸ்ய ப⁴வேத்³ யுக³பது³த்தி²தா ।
    யதி³ பா⁴꞉ ஸத்³ருʼஶீ ஸா ஸ்யாத் பா⁴ஸஸ்தஸ்ய மஹாத்மன꞉ ॥

13: |-
    தத்ரைக-ஸ்த²ம்ʼ ஜக³த் க்ருʼத்ஸ்னம்ʼ ப்ரவிப⁴க்தமனேக-தா⁴ ।
    அபஶ்யத்³ தே³வ-தே³வஸ்ய ஶரீரே பாண்ட³வஸ்ததா³ ॥

14: |-
    தத꞉ ஸ விஸ்மயாவிஷ்டோ ஹ்ருʼஷ்ட-ரோமா த⁴னம்ʼ-ஜய꞉ ।
    ப்ரணம்ய ஶிரஸா தே³வம்ʼ க்ருʼதாஞ்ஜலிரபா⁴ஷத ॥

15: |-
    பஶ்யாமி தே³வாம்ʼஸ்தவ தே³வ தே³ஹே
    ஸர்வாம்ʼஸ்ததா² பூ⁴த-விஶேஷ-ஸங்கா⁴ன் ।
    ப்³ரஹ்மாணமீஶம்ʼ கமலாஸன-ஸ்த²ம்ʼ
    ருʼஷீம்ʼஶ்ச ஸர்வானுரகா³ம்ʼஶ்ச தி³வ்யான் ॥

16: |-
    அனேக-பா³ஹூத³ர-வக்த்ர-நேத்ரம்ʼ
    பஶ்யாமி த்வாம்ʼ ஸர்வதோ(அ)னந்த-ரூபம் ।
    நாந்தம்ʼ ந மத்⁴யம்ʼ ந புனஸ்தவா(அ)தி³ம்ʼ
    பஶ்யாமி விஶ்வேஶ்வர விஶ்வ-ரூப ॥

17: |-
    கிரீடினம்ʼ க³தி³னம்ʼ சக்ரிணம்ʼ ச
    தேஜோ-ராஶிம்ʼ ஸர்வதோ தீ³ப்தி-மந்தம் ।
    பஶ்யாமி த்வா து³ர்நிரீக்ஷ்யம்ʼ ஸமந்தாத்
    தீ³ப்தானலார்க-த்³யுதிமப்ரமேயம் ॥

18: |-
    த்வமக்ஷரம்ʼ பரமம்ʼ வேதி³தவ்யம்ʼ
    த்வமஸ்ய விஶ்வஸ்ய பரம்ʼ நிதா⁴னம் ।
    த்வமவ்யய꞉ ஶாஶ்வத-த⁴ர்ம-கோ³ப்தா
    ஸனாதனஸ்த்வம்ʼ புருஷோ மதோ மே ॥

19: |-
    அநாதி³-மத்⁴யாந்தமனந்த-வீர்யம்ʼ
    அனந்த-பா³ஹும்ʼ ஶஶி-ஸூர்ய-நேத்ரம் ।
    பஶ்யாமி த்வா தீ³ப்த-ஹுதாஶ-வக்த்ரம்ʼ
    ஸ்வ-தேஜஸா விஶ்வமித³ம்ʼ தபந்தம் ॥

20: |-
    த்³யாவா-ப்ருʼதி²வ்யோரித³மந்தரம்ʼ ஹி
    வ்யாப்தம்ʼ த்வயைகேன தி³ஶஶ்ச ஸர்வா꞉ ।
    த்³ருʼஷ்ட்வா(அ)த்³பு⁴தம்ʼ ரூபமுக்³ரம்ʼ தவேத³ம்ʼ
    லோக-த்ரயம்ʼ ப்ரவ்யதி²தம்ʼ மஹாத்மன் ॥

21: |-
    அமீ ஹி த்வாஸுர-ஸங்கா⁴ விஶந்தி
    கேசித்³ பீ⁴தா꞉ ப்ராஞ்ஜலயோ க்³ருʼணந்தி ।
    ஸ்வஸ்தீத்யுக்த்வா மஹர்ஷி-ஸித்³த⁴-ஸங்கா⁴꞉
    ஸ்துவந்தி த்வா ஸ்துதிபி⁴꞉ புஷ்களாபி⁴꞉ ॥

22: |-
    ருத்³ராதி³த்யா வஸவோ யே ச ஸாத்⁴யா꞉
    விஶ்வே(அ)ஶ்வினௌ மருதஶ்சோஷ்மபாஶ்ச ।
    க³ந்த⁴ர்வ-யக்ஷாஸுர-ஸித்³த⁴-ஸங்கா⁴꞉
    வீக்ஷந்தே த்வா விஸ்மிதாஶ்சைவ ஸர்வே ॥

23: |-
    ரூபம்ʼ மஹத்தே ப³ஹு-வக்த்ர-நேத்ரம்ʼ
    மஹா-பா³ஹோ ப³ஹு-பா³ஹூரு-பாத³ம் ।
    ப³ஹூத³ரம்ʼ ப³ஹு-த³ம்ʼஷ்ட்ரா-கராளம்ʼ
    த்³ருʼஷ்ட்வா லோகா꞉ ப்ர-வ்யதி²தாஸ்ததா²(அ)ஹம் ॥

24: |-
    நப⁴꞉-ஸ்ப்ருʼஶம்ʼ தீ³ப்தமனேக-வர்ணம்ʼ
    வ்யாத்தானனம்ʼ தீ³ப்த-விஶால-நேத்ரம் ।
    த்³ருʼஷ்ட்வாஹி த்வா ப்ர-வ்யதி²தாந்தராத்மா
    த்⁴ருʼதிம்ʼ ந விந்தா³மி ஶமம்ʼ ச விஷ்ணோ ॥

25: |-
    த³ம்ʼஷ்ட்ரா-கராளானி ச தே முகா²னி
    த்³ருʼஷ்ட்வைவ காலானல-ஸன்னிபா⁴னி ।
    தி³ஶோ ந ஜானே ந லபே⁴ ச ஶர்ம
    ப்ரஸீத³ தே³வேஶ ஜக³ந்நிவாஸ ॥

26: |-
    அமீ ச த்வா த்⁴ருʼதராஷ்ட்ரஸ்ய புத்ரா꞉
    ஸர்வே ஸஹைவாவனி-பால-ஸங்கை⁴꞉ ।
    பீ⁴ஷ்மோ த்³ரோண꞉ ஸூத-புத்ரஸ்ததா²(அ)ஸௌ
    ஸஹாஸ்மதீ³யைரபி யோத⁴-முக்²யை꞉ ॥

27: |-
    வக்த்ராணி தே த்வரமாணா விஶந்தி
    த³ம்ʼஷ்ட்ரா-கராளானி ப⁴யானகானி ।
    கேசித்³ விலக்³னா த³ஶனாந்தரேஷு
    ஸந்த்³ருʼஶ்யந்தே சூர்ணிதைருத்தமாங்கை³꞉ ॥

28: |-
    யதா² நதீ³னாம்ʼ ப³ஹவோம்ʼ(அ)பு³-வேகா³꞉
    ஸமுத்³ரமேவாபி⁴-முகா² த்³ரவந்தி ।
    ததா² தவாமீ நர-லோக-வீரா꞉
    விஶந்தி வக்த்ராண்யபி⁴-விஜ்வலந்தி ॥

29: |-
    யதா² ப்ரதீ³ப்தம்ʼ ஜ்வலனம்ʼ பதங்கா³꞉
    விஶந்தி நாஶாய ஸம்ருʼத்³த⁴-வேகா³꞉ ।
    ததை²வ நாஶாய விஶந்தி லோகா꞉
    தவாபி வக்த்ராணி ஸம்ருʼத்³த⁴-வேகா³꞉ ॥

30: |-
    லேலிஹ்யஸே க்³ரஸ-மான꞉ ஸமந்தாத்
    லோகான் ஸமக்³ரான் வத³னைர்ஜ்வலத்³பி⁴꞉ ।
    தேஜோபி⁴ராபூர்ய ஜக³த் ஸமக்³ரம்ʼ
    பா⁴ஸஸ்தவோக்³ரா꞉ ப்ரதபந்தி விஷ்ணோ ॥

31: |-
    ஆக்²யாஹி மே கோ ப⁴வானுக்³ர-ரூபோ
    நமோ(அ)ஸ்து தே தே³வ-வர ப்ரஸீத³ ।
    விஜ்ஞாதுமிச்சா²மி ப⁴வந்தமாத்³யம்ʼ
    ந ஹி ப்ரஜாநாமி தவ ப்ரவ்ருʼத்திம் ॥

32: |-
    காலோ(அ)ஸ்மி லோக-க்ஷய-க்ருʼத் ப்ரவ்ருʼத்³தோ⁴
    லோகான் ஸமாஹர்துமிஹ ப்ரவ்ருʼத்த꞉ ।
    ருʼதே(அ)பி த்வா ந ப⁴விஷ்யந்தி ஸர்வே
    யே(அ)வஸ்தி²தா꞉ ப்ரத்யனீகேஷு யோதா⁴꞉ ॥

33: |-
    தஸ்மாத் த்வமுத்திஷ்ட² யஶோ லப⁴ஸ்வ
    ஜித்வா ஶத்ரூன் பு⁴ங்க்ஷ்வ ராஜ்யம்ʼ ஸம்ருʼத்³த⁴ம் ।
    மயைவைதே நிஹதா꞉ பூர்வமேவ
    நிமித்த-மாத்ரம்ʼ ப⁴வ ஸவ்ய-ஸாசின் ॥

34: |-
    த்³ரோணம்ʼ ச பீ⁴ஷ்மம்ʼ ச ஜயத்³ரத²ம்ʼ ச
    கர்ணம்ʼ ததா²(அ)ன்யானபி யோத⁴-வீரான் ।
    மயா ஹதாம்ʼஸ்த்வம்ʼ ஜஹி மா வ்யதி²ஷ்டா²꞉
    யுத்³த்⁴யஸ்வ ஜேதாஸி ரணே ஸபத்னான் ॥

35: |-
    ஏதச்ச்²ருத்வா வசனம்ʼ கேஶவஸ்ய
    க்ருʼதாஞ்ஜலிர்வேபமான꞉ கிரீடீ ।
    நமஸ்க்ருʼத்வா பூ⁴ய ஏவா(அ)ஹ க்ருʼஷ்ணம்ʼ
    ஸக³த்³க³த³ம்ʼ பீ⁴த-பீ⁴த꞉ ப்ரணம்ய ॥

36: |-
    ஸ்தா²னே ஹ்ருʼஷீகேஶ தவ ப்ரகீர்த்யா
    ஜக³த் ப்ரஹ்ருʼஷ்யத்யனு-ரஜ்யதே ச ।
    ரக்ஷாம்ʼஸி பீ⁴தானி தி³ஶோ த்³ரவந்தி
    ஸர்வே நமஸ்யந்தி ச ஸித்³த⁴-ஸங்கா⁴꞉ ॥

37: |-
    கஸ்மாச்ச தே ந நமேரன் மஹாத்மன்
    க³ரீயஸே ப்³ரஹ்மணோ(அ)ப்யாதி³-கர்த்ரே ।
    அனந்த தே³வேஶ ஜக³ந்நிவாஸ
    த்வமக்ஷரம்ʼ ஸத³ஸத் தத்பரம்ʼ யத் ॥

38: |-
    த்வமாதி³-தே³வ꞉ புருஷ꞉ புராண꞉
    த்வமஸ்ய விஶ்வஸ்ய பரம்ʼ நிதா⁴னம் ।
    வேத்தா(அ)ஸி வேத்³யம்ʼ ச பரம்ʼ ச தா⁴ம
    த்வயா ததம்ʼ விஶ்வமனந்த-ரூப ॥

39: |-
    வாயுர்யமோ(அ)க்³நிர்வருண꞉ ஶஶாங்க꞉
    ப்ரஜாபதிஸ்த்வம்ʼ ப்ரபிதாமஹஶ்ச ।
    நமோ நமஸ்தே(அ)ஸ்து ஸஹஸ்ர-க்ருʼத்வ꞉
    புனஶ்ச பூ⁴யோ(அ)பி நமோ-நமஸ்தே ॥

40: |-
    நம꞉ புரஸ்தாத³த² ப்ருʼஷ்ட²தஸ்தே
    நமோ(அ)ஸ்து தே ஸர்வத ஏவ ஸர்வ ।
    அனந்த-வீர்யாமித-விக்ரமஸ்த்வம்ʼ
    ஸர்வம்ʼ ஸமாப்னோஷி ததோ(அ)ஸி ஸர்வ꞉ ॥

41: |-
    ஸகே²தி மத்வா ப்ரஸப⁴ம்ʼ யது³க்தம்ʼ
    ஹே க்ருʼஷ்ண ஹே யாத³வ ஹே ஸகே²தி ।
    அஜானதா மஹிமானம்ʼ தவேத³ம்ʼ
    மயா ப்ரமாதா³த் ப்ரணயேன வா(அ)பி ॥

42: |-
    யச்சாப-ஹாஸார்த²மஸத்க்ருʼதோ(அ)ஸி
    விஹார-ஶய்யாஸன-போ⁴ஜனேஷு ।
    ஏகோ(அ)த²வா(அ)ப்யச்யுத தத் ஸமக்ஷம்ʼ
    தத் க்ஷாமயே த்வாமஹமப்ர-மேயம் ॥

43: |-
    பிதா(அ)ஸி லோகஸ்ய சராசரஸ்ய
    த்வமஸ்ய பூஜ்யஶ்ச கு³ருர்க³ரீயான் ।
    ந த்வத் ஸமோ(அ)ஸ்த்யப்⁴யதி⁴க꞉ குதோ(அ)ன்யோ
    லோக-த்ரயே(அ)ப்யப்ரதிம-ப்ரபா⁴வ ॥

44: |-
    தஸ்மாத் ப்ரணம்ய ப்ரணிதா⁴ய காயம்ʼ
    ப்ரஸாத³யே த்வாமஹமீஶமீட்³யம் ।
    பிதேவ புத்ரஸ்ய ஸகே²வ ஸக்²யு꞉
    ப்ரிய꞉ ப்ரியாயார்ஹஸி தே³வ ஸோடு⁴ம் ॥

45: |-
    அத்³ருʼஷ்ட-பூர்வம்ʼ ஹ்ருʼஷிதோ(அ)ஸ்மி த்³ருʼஷ்ட்வா
    ப⁴யேன ச ப்ரவ்யதி²தம்ʼ மனோ மே ।
    ததே³வ மே த³ர்ஶய தே³வ ரூபம்ʼ
    ப்ரஸீத³ தே³வேஶ ஜக³ந்நிவாஸ ॥

46: |-
    கிரீடினம்ʼ க³தி³னம்ʼ சக்ர-ஹஸ்தம்ʼ
    இச்சா²மி த்வாம்ʼ த்³ரஷ்டுமஹம்ʼ ததை²வ ।
    தேனைவ ரூபேண சதுர்பு⁴ஜேன
    ஸஹஸ்ர-பா³ஹோ ப⁴வ விஶ்வ-மூர்தே ॥

47: |-
    மயா ப்ரஸன்னேன தவார்ஜுனேத³ம்ʼ
    ரூபம்ʼ பரம்ʼ த³ர்ஶிதமாத்ம-யோகா³த் ।
    தேஜோ-மயம்ʼ விஶ்வமனந்தமாத்³யம்ʼ
    யன்மே த்வத³ன்யேன ந த்³ருʼஷ்ட-பூர்வம் ॥

48: |-
    ந வேத³-யஜ்ஞாத்⁴யயனைர்ன தா³னை꞉
    ந ச க்ரியாபி⁴ர்ன தபோபி⁴ருக்³ரை꞉ ।
    ஏவம்ʼ-ரூப꞉ ஶக்ய அஹம்ʼ ந்ருʼ-லோகே
    த்³ரஷ்டும்ʼ த்வத³ன்யேன குரு-ப்ரவீர ॥

49: |-
    மா தே வ்யதா² மா ச விமூட⁴-பா⁴வோ
    த்³ருʼஷ்ட்வாரூபம்ʼ கோ⁴ரமீத்³ருʼங்மமேத³ம் 
    வ்யபேத-பீ⁴꞉ ப்ரீத-மனா꞉ புனஸ்த்வம்ʼ
    ததே³வ மே ரூபமித³ம்ʼ ப்ரபஶ்ய ॥

50: |-
    இத்யர்ஜுனம்ʼ வாஸுதே³வஸ்ததோ²க்த்வா
    ஸ்வகம்ʼ ரூபம்ʼ த³ர்ஶயாமாஸ பூ⁴ய꞉ ।
    ஆஶ்வாஸயாமாஸ ச பீ⁴தமேனம்ʼ
    பூ⁴த்வா புன꞉ ஸௌம்ய-வபுர்மஹாத்மா ॥

51: |-
    த்³ருʼஷ்ட்வேத³ம்ʼ மானுஷம்ʼ ரூபம்ʼ தவ ஸௌம்யம்ʼ ஜனார்த³ன ।
    இதா³னீமஸ்மி ஸம்ʼ-வ்ருʼத்த꞉ ஸ-சேதா꞉ ப்ரக்ருʼதிம்ʼ க³த꞉ ॥

52: |-
    ஸு-து³ர்த³ர்ஶமித³ம்ʼ ரூபம்ʼ த்³ருʼஷ்ட-வானஸி யன்மம ।
    தே³வா அப்யஸ்ய ரூபஸ்ய நித்யம்ʼ த³ர்ஶன-காங்க்ஷிண꞉ ॥

53: |-
    நாஹம்ʼ வேதை³ர்ன தபஸா ந தா³னேன ந சேஜ்யயா ।
    ஶக்ய ஏவம்ʼ-விதோ⁴ த்³ரஷ்டும்ʼ த்³ருʼஷ்ட-வானஸி மாம்ʼ யதா² ॥

54: |-
    ப⁴க்த்யாத்வனன்யயா ஶக்ய அஹமேவம்ʼ-விதோ⁴(அ)ர்ஜுன ।
    ஜ்ஞாதும்ʼ த்³ரஷ்டும்ʼ ச தத்த்வேன ப்ரவேஷ்டும்ʼ ச பரம்ʼ தப ॥

55: |-
    மத்கர்ம-க்ருʼன்மத்பரமோ மத்³ப⁴க்த꞉ ஸங்க³-வர்ஜித꞉ ।
    நிர்வைர꞉ ஸர்வ-பூ⁴தேஷு ய꞉ ஸ மாமேதி பாண்ட³வ ॥

1: |-
    தர்ம-க்ஷேத்ரே குரு-க்ஷேத்ரே ஸமவேதா யுயுத்ஸவஃ ।
    மாமகாஃ பாண்டவாஶ்சைவ கிமகுர்வத ஸஞ்ஜய ॥

2: |-
    த்ருஷ்ட்வா து பாண்டவாநீகம் வ்யூடம் துர்யோதனஸ்ததா ।
    ஆசார்யமுப ஸங்க³ம்ய ராஜா வசனமப்³ரவீத் ॥

3: |-
    பஶ்யைதாம் பாண்டு-புத்ராணாம் ஆசார்ய மஹதீம் சமூம் ।
    வ்யூடாம் த்ருபத-புத்ரேண தவ ஶிஷ்யேண தீ⁴மதா ॥

4: |-
    அத்ர ஶூரா மஹேஷ்வாஸாஃ பீ⁴மார்ஜுன-ஸமா யுதி⁴ ।
    யுயுதானோ விராடஶ்ச த்ருபதஶ்ச மஹாரதஃ ॥

5: |-
    த்⁴ருஷ்டகேதுஶ்சேகிதானஃ காஶி-ராஜஶ்ச வீர்ய-வான் ।
    புரு-ஜித் குந்தி-போ⁴ஜஶ்ச ஶைப்³யஶ்ச நர-புங்க³வஃ ॥

6: |-
    யுதாமன்யுஶ்ச விக்ராந்தஃ உத்தமௌஜாஶ்ச வீர்ய-வான் ।
    ஸௌப⁴த்³ரோ த்ரௌபதே³யாஶ்ச ஸர்வ ஏவ மஹாரதாஃ ॥

7: |-
    அஸ்மாகம் து விஶிஷ்டா யே தான் நிபோ³த⁴ த்³விஜோத்தம ।
    நாயகா மம ஸைன்யஸ்ய ஸஞ்ஜ்ஞார்த²ம் தான் ப்³ரவீமி தே ॥

8: |-
    ப⁴வான் பீ⁴ஷ்மஶ்ச கர்ணஶ்ச க்ருபஶ்ச ஸமிதிம்-ஜயஃ ।
    அஶ்வத்தாமா விகர்ணஶ்ச ஸௌமத³த்திஸ்ததை²வ ச ॥

9: |-
    அன்யே ச ப³ஹவஃ ஶூராஃ மத³ர்தே² த்யக்த-ஜீவிதாஃ ।
    நானா-ஶஸ்த்ர-ப்ரஹரணாஃ ஸர்வே யுத்³த⁴-விஶாரதாஃ ॥

10: |-
    அபர்யாப்தம் தத³ஸ்மாகம் ப³லம் பீ⁴ஷ்மாபி⁴-ரக்ஷிதம் ।
    பர்யாப்தம் த்வித³மேதேஷாம் ப³லம் பீ⁴மாபி⁴-ரக்ஷிதம் ॥

11: |-
    அயனேஷு ச ஸர்வேஷு யதா²-பா⁴க³மவ-ஸ்தி²தாஃ ।
    பீ⁴ஷ்மமேவாபி⁴ ரக்ஷந்து ப⁴வந்தஃ ஸர்வ ஏவ ஹி ॥

12: |-
    தஸ்ய ஸம்-ஜனயன் ஹர்ஷம் குரு-வ்ருத்³த⁴ஃ பிதாமஹஃ ।
    ஸிம்ஹ-நாத³ம் வினத்³யோச்சை⁴ஃ ஶங்க²ம் த³த்⁴மௌ ப்ரதாப-வான் ॥

13: |-
    ததஃ ஶங்கா²ஶ்ச பே⁴ர்யஶ்ச பணவானக-கோ³முகா²ஃ ।
    ஸஹஸைவாப்⁴யஹன்யந்த ஸ ஶப்³த³ஸ்துமுலோऽப⁴வத் ॥

14: |-
    ததஃ ஶ்வேதைர்ஹயைர்யுக்தே மஹதி ஸ்யந்த³னே ஸ்தி²தௌ ।
    மாத⁴வஃ பாண்ட³வஶ்சைவ தி³வ்யௌ ஶங்கௌ² ப்ரத³த்⁴மதுஃ ॥

15: |-
    பாஞ்சஜன்யம் ஹ்ருஷீகேஶோ தே³வ-த³த்தம் த⁴னம்-ஜயஃ ।
    பௌண்ட்³ரம் த³த்⁴மௌ மஹாஶங்க²ம் பீ⁴ம-கர்மா வ்ருகோத³ரஃ ॥

16: |-
    அனந்த-விஜயம் ராஜா குந்தீ-புத்ரோ யுதி⁴ஷ்டி²ரஃ ।
    நகுலஃ ஸஹ-தே³வஶ்ச ஸுகோ⁴ஷ-மணி-புஷ்பகௌ ॥

17: |-
    காஶ்யஶ்ச பரமேஷ்வாஸஃ ஶிக²ண்டீ³ ச மஹாரதஃ ।
    த்⁴ருஷ்ட-த்³யும்னோ விராடஶ்ச ஸாத்யகிஶ்சாபராஜிதஃ ॥

18: |-
    த்ருபதோ த்ரௌபதே³யாஶ்ச ஸர்வை³ஶஃ ப்ருதி²வீ-பதே ।
    ஸௌப⁴த்³ரஶ்ச மஹாபா³ஹுஃ ஶங்கா²ன் த³த்⁴முஃ ப்ருத²க்-ப்ருத²க் ॥

19: |-
    ஸ கோ⁴ஷோ தா⁴ர்தராஷ்ட்ராணாம் ஹ்ருத³யானி வ்யதா³ரயத் ।
    நப⁴ஶ்ச ப்ருதி²வீம் சை⁴வ துமுலோ வ்யனு-னாத³யன் ॥

20: |-
    அத² வ்யவஸ்தி²தான் த்ருஷ்ட்வாதா⁴ர்தராஷ்ட்ரான் கபி-த்⁴வஜஃ ।
    ப்ரவ்ருத்தே ஶஸ்த்ர-ஸம்பாதே த⁴னுருத்³யம்ய பாண்ட³வஃ ॥

21: |-
    ஹ்ருஷீகேஶம் ததா³ வாக்யம் இத³மாஹ மஹீ-பதே ।
    ஸேனயோருப⁴யோர்மத்⁴யே ரத²ம் ஸ்தா²பய மேऽச்யுத ॥

22: |-
    யாவதே³தான் நிரீக்ஷேऽஹம் யோத்³து⁴-காமானவ-ஸ்தி²தான் ।
    கைர்மயா ஸஹ யோத்³த⁴வ்யம் அஸ்மின் ரண-ஸமுத்³யமே ॥

23: |-
    யோத்ஸ்யமானானவேக்ஷேऽஹம் ய ஏதேऽத்ர ஸமாக³தாஃ ।
    தா⁴ர்தராஷ்ட்ரஸ்ய து³ர்பு³த்³தே⁴ஃ யுத்³தே⁴ ப்ரிய-சிகீர்ஷவஃ ॥

24: |-
    ஏவமுக்தோ ஹ்ருஷீகேஶோ கு³டா³கேஶேன பா⁴ரத ।
    ஸேனயோருப⁴யோர்மத்⁴யே ஸ்தா²பயித்வா ரதோ²த்தமम् ॥

25: |-
    பீ⁴ஷ்ம-த்³ரோண-ப்ரமுக²தஃ ஸர்வேஷாம் ச மஹீ-க்ஷிதாம் ।
    உவாச பார்த² பஶ்யைதான் ஸமவேதான் குரூனிதி ॥

26: |-
    தத்ராபஶ்யத் ஸ்தி²தான் பார்த²ஃ பித்ரூனத² பிதாமஹான் ।
    ஆசார்யான் மாதுலான் ப்⁴ராத்ரூன்
    புத்ரான் பௌத்ரான் ஸகீ²ம்ஸ்ததா² ॥

27: |-
    ஶ்வஶுரான் ஸுஹ்ருத³ஶ்சைவ ஸேனயோருப⁴யோ-ரபி ।

27.5: |-
    க்ருபயா பரயாऽऽவிஷ்டோ விஷீத³ன்னித³மப்³ரவீத் ॥

28: |-
    தான் ஸமீக்ஷ்ய ஸ கௌந்தேயஃ ஸர்வான் ப³ந்தூ⁴னவ-ஸ்தி²தான் ।

28.5: |-
    த்ருஷ்ட்வேமம் ஸ்வஜனம் க்ருஷ்ண யுயுத்ஸும் ஸமுப-ஸ்தி²தమ్ ॥

29: |-
    ஸீத³ந்தி மம கா³த்ராணி முக²ம் ச பரி-ஶுஷ்யதி ।
    வேபது²ஶ்ச ஶரீரே மே ரோம-ஹர்ஷஶ்ச ஜாயதே ॥

30: |-
    கா³ண்டீ³வம் ஸ்ரம்ஸதே ஹஸ்தாத் த்வக் சை⁴வ பரி-த³ஹ்யதே ।
    நச ஶக்னோமவ-ஸ்தா²தும் ப்⁴ரமதீவ ச மே மனஃ ॥

31: |-
    நிமித்தானி ச பஶ்யாமி விபரீதானி கேஶவ ।
    நச ஶ்ரேயோऽனு பஶ்யாமி ஹத்வா ஸ்வ-ஜனமாஹவே ॥

32: |-
    ந காங்க்ஷே விஜயம் க்ருஷ்ண நச ராஜ்யம் ஸுகா²னி ச ।
    கிம் நோ ராஜ்யேன கோ³விந்த³ கிம் போ⁴கை³ர்ஜீவிதேன வா ॥

33: |-
    யேஷாமர்தே² காங்க்ஷிதம் நோ ராஜ்யம் போ⁴கா³ஃ ஸுகா²னி ச ।
    த இமேऽவ-ஸ்தி²தா யுத்³தே⁴ ப்ராணாம்ஸ்த்யக்த்வா த⁴னானி ச ॥

34: |-
    ஆசார்யாஃ பிதரஃ புத்ராஃ ததை²வ ச பிதாமஹாஃ ।
    மாதுலாஃ ஶ்வஶுராஃ பௌத்ராஃ ஶ்யாலாஃ ஸம்ப³ந்தி⁴னஸ்ததா² ॥

35: |-
    ஏதான் ந ஹந்துமிச்சா²மி க்⁴னதோऽபி மது⁴-ஸூத³ன ।
    அபி த்ரைலோக்ய-ராஜ்யஸ்ய ஹேதோஃ கிம் நு மஹீ-க்ருதே ॥

36: |-
    நிஹத்ய தா⁴ர்தராஷ்ட்ரான் நஃ கா ப்ரீதிஃ ஸ்யாஜ்ஜனார்த³ன ।
    பாபமேவாऽऽஶ்ரயேத³ஸ்மான் ஹத்வைதானாததாயினஃ ॥

37: |-
    தஸ்மான்னார்ஹா வயம் ஹந்தும் தா⁴ர்தராஷ்ட்ரான் ஸ்வ-பா³ந்த⁴வான் ।
    ஸ்வ-ஜனம் ஹி கதம் ஹத்வா ஸுகி²னஃ ஸ்யாம மாத⁴வ ॥

38: |-
    யத்³யப்யேதே ந பஶ்யந்தி லோபோ⁴ப-ஹத-சேதஸஃ ।
    குல-க்ஷய-க்ருதம் தோ³ஷம் மித்ர-த்³ரோஹே ச பாதகம் ॥

39: |-
    கதம் ந ஜ்ஞேயமஸ்மாபி⁴ஃ பாபாத்³அஸ்மான்னிவர்திதும் ।
    குல-க்ஷய-க்ருதம் தோ³ஷம் ப்ர-பஶ்யத்³பி⁴ர்ஜனார்த³ன ॥

40: |-
    குல-க்ஷயே ப்ரணஶ்யந்தி குல-த⁴ர்மாஃ ஸனாதனாஃ ।
    த⁴ர்மே நஷ்டே குலம் க்ருத்ஸ்னம் அத⁴ர்மோऽபி⁴-ப⁴வத்யுத ॥

41: |-
    அத⁴ர்மாபி⁴-ப⁴வாத் க்ருஷ்ண ப்ர-து³ஷ்யந்தி குல-ஸ்த்ரியஃ ।
    ஸ்த்ரீஷு து³ஷ்டாஸு வார்ஷ்ணேய ஜாயதே வர்ண-ஸங்கரஃ ॥

42: |-
    ஸங்கரோ நரகாயைவ குல-க்⁴னானாம் குலஸ்ய ச ।
    பதந்தி பிதரோ ஹ்யேஷாம் லுப்த-பிண்டோ³த³க-க்ரியாஃ ॥

43: |-
    தோ³ஷைரேதைஃ குல-க்⁴னானாம் வர்ண-ஸங்கர-காரகைஃ ।
    உத்ஸாத்³யந்தே ஜாதி-த⁴ர்மாஃ குல-த⁴ர்மாஶ்ச ஶாஶ்வதாஃ ॥

44: |-
    உத்ஸன்ன-குல-த⁴ர்மாணாம் மனுஷ்யாணாம் ஜனார்த³ன ।
    நரகே நியதம் வாஸோ ப⁴வதீத்யனு ஶுஶ்ரும ॥

45: |-
    அஹோ ப³த மஹத் பாபம் கர்தும் வ்யவஸிதா வயம் ।
    யத்³ராஜ்ய-ஸுக²-லோபே⁴ன ஹந்தும் ஸ்வ-ஜனமுத்³யதாஃ ॥

46: |-
    யதி³ மாமப்ரதீகாரம் அஶஸ்த்ரம் ஶஸ்த்ர-பாணயஃ ।
    தா⁴ர்தராஷ்ட்ரா ரணே ஹன்யுஃ தன்மே க்ஷேம-தரம் ப⁴வேத் ॥

47: |-
    ஏவமுக்த்வாऽர்ஜுனஃ ஸங்கே² ரதோ²பஸ்த² உபாவிஶத் ।
    விஸ்ருஜ்ய ஸ-ஶரம் சாபம் ஶோக-ஸம்விக்³ன-மானஸஃ ॥
    
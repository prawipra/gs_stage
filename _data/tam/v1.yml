1: |-
    த⁴ர்ம-க்ஷேத்ரே குரு-க்ஷேத்ரே ஸமவேதா யுயுத்ஸவ꞉ ।
    மாமகா꞉ பாண்ட³வாஶ்சைவ கிமகுர்வத ஸஞ்ஜய ॥

2: |-
    த்³ருʼஷ்ட்வா து பாண்ட³வானீகம்ʼ வ்யூட⁴ம்ʼ து³ர்யோத⁴னஸ்ததா³ ।
    ஆசார்யமுப ஸங்க³ம்ய ராஜா வசனமப்³ரவீத் ॥

3: |-
    பஶ்ஶைதாம்ʼ பாண்டு³-புத்ராணாம்ʼ ஆசார்ய மஹதீம்ʼ சமூம் ।
    வ்யூடா⁴ம்ʼ த்³ருபத³-புத்ரேண தவ ஶிஷ்யேண தீ⁴மதா ॥

4: |-
    அத்ர ஶூரா மஹேஷ்வாஸா꞉ பீ⁴மார்ஜுன-ஸமா யுதி⁴ ।
    யுயுதா⁴னோ விராடஶ்ச த்³ருபத³ஶ்ச மஹாரத²꞉ ॥

5: |-
    த்⁴ருʼஷ்டகேதுஶ்சேகிதான꞉ காஶி-ராஜஶ்ச வீர்ய-வான் ।
    புரு-ஜித் குந்தி-போ⁴ஜஶ்ச ஶைப்³யஶ்ச நர-புங்க³வ꞉ ॥

6: |-
    யுதா⁴மன்யுஶ்ச விக்ராந்த꞉ உத்தமௌஜாஶ்ச வீர்ய-வான் ।
    ஸௌப⁴த்³ரோ த்³ரௌபதே³யாஶ்ச ஸர்வ ஏவ மஹாரதா²꞉ ॥

7: |-
    அஸ்மாகம்ʼ து விஶிஷ்டா யே தான் நிபோ³த⁴ த்³விஜோத்தம ।
    நாயகா மம ஸைன்யஸ்ய ஸஞ்ஜ்ஞார்த²ம்ʼ தான் ப்³ரவீமி தே ॥

8: |-
    ப⁴வான் பீ⁴ஷ்மஶ்ச கர்ணஶ்ச க்ருʼபஶ்ச ஸமிதிம்ʼ-ஜய꞉ ।
    அஶ்வத்தா²மா விகர்ணஶ்ச ஸௌமத³த்திஸ்ததை²வ ச ॥

9: |-
    அன்யே ச ப³ஹவ꞉ ஶூரா꞉ மத³ர்தே² த்யக்த-ஜீவிதா꞉ ।
    நானா-ஶஸ்த்ர-ப்ரஹரணா꞉ ஸர்வே யுத்³த⁴-விஶாரதா³꞉ ॥

10: |-
    அபர்யாப்தம்ʼ தத³ஸ்மாகம்ʼ ப³லம்ʼ பீ⁴ஷ்மாபி⁴-ரக்ஷிதம் ।
    பர்யாப்தம்ʼ த்வித³மேதேஷாம்ʼ ப³லம்ʼ பீ⁴மாபி⁴-ரக்ஷிதம் ॥

11: |-
    அயனேஷு ச ஸர்வேஷு யதா²-பா⁴க³மவ-ஸ்தி²தா꞉ ।
    பீ⁴ஷ்மமேவாபி⁴ ரக்ஷந்து ப⁴வந்த꞉ ஸர்வ ஏவ ஹி ॥

12: |-
    தஸ்ய ஸம்ʼ-ஜநயன் ஹர்ஷம்ʼ குரு-வ்ருʼத்³த⁴꞉ பிதாமஹ꞉ ।
    ஸிம்ʼஹ-நாத³ம்ʼ வினத்³யோச்சை꞉ ஶங்க²ம்ʼ த³த்⁴மௌ ப்ரதாப-வான் ॥

13: |-
    தத꞉ ஶங்கா²ஶ்ச பே⁴ர்யஶ்ச பணவானக-கோ³முகா²꞉ ।
    ஸஹஸைவாப்⁴யஹன்யந்த ஸ ஶப்³த³ஸ்துமுலோ(அ)ப⁴வத் ॥

14: |-
    தத꞉ ஶ்வேதைர்ஹயைர்யுக்தே மஹதி ஸ்யந்த³னே ஸ்தி²தௌ ।
    மாத⁴வ꞉ பாண்ட³வஶ்சைவ தி³வ்யௌ ஶங்கௌ² ப்ரத³த்⁴மது꞉ ॥

15: |-
    பாஞ்சஜன்யம்ʼ ஹ்ருʼஷீகேஶோ தே³வ-த³த்தம்ʼ த⁴னம்ʼ-ஜய꞉ ।
    பௌண்ட்³ரம்ʼ த³த்⁴மௌ மஹாஶங்க²ம்ʼ பீ⁴ம-கர்மா வ்ருʼகோத³ர꞉ ॥

16: |-
    அனந்த-விஜயம்ʼ ராஜா குந்தீ-புத்ரோ யுதி⁴ஷ்டி²ர꞉ ।
    நகுல꞉ ஸஹ-தே³வஶ்ச ஸுகோ⁴ஷ-மணி-புஷ்பகௌ ॥

17: |-
    காஶ்யஶ்ச பரமேஷ்வாஸ꞉ ஶிக²ண்டீ³ ச மஹாரத²꞉ ।
    த்⁴ருʼஷ்ட-த்³யும்னோ விராடஶ்ச ஸாத்யகிஶ்சாபராஜித꞉ ॥

18: |-
    த்³ருபதோ³ த்³ரௌபதே³யாஶ்ச ஸர்வஶ꞉ ப்ருʼதி²வீ-பதே ।
    ஸௌப⁴த்³ரஶ்ச மஹாபா³ஹு꞉ ஶங்கா²ன் த³த்⁴மு꞉ ப்ருʼத²க்-ப்ருʼத²க் ॥

19: |-
    ஸ கோ⁴ஷோ தா⁴ர்தராஷ்ட்ராணாம்ʼ ஹ்ருʼத³யானி வ்யதா³ரயத் ।
    நப⁴ஶ்ச ப்ருʼதி²வீம்ʼ சைவ துமுலோ வ்யனு-நாத³யன் ॥

20: |-
    அத² வ்யவஸ்தி²தான் த்³ருʼஷ்ட்வா தா⁴ர்தராஷ்ட்ரான் கபி-த்⁴வஜ꞉ ।
    ப்ரவ்ருʼத்தே ஶஸ்த்ர-ஸம்பாதே த⁴னுருத்³யம்ய பாண்ட³வ꞉ ॥

21: |-
    ஹ்ருʼஷீகேஶம்ʼ ததா³ வாக்யம்ʼ இத³மாஹ மஹீ-பதே ।
    ஸேனயோருப⁴யோர்மத்⁴யே ரத²ம்ʼ ஸ்தா²பய மே(அ)ச்யுத ॥

22: |-
    யாவதே³தான் நிரீக்ஷே(அ)ஹம்ʼ யோத்³து⁴-காமானவ-ஸ்தி²தான் ।
    கைர்மயா ஸஹ யோத்³த⁴வ்யம்ʼ அஸ்மின் ரண-ஸமுத்³யமே ॥

23: |-
    யோத்ஸ்யமானானவேக்ஷே(அ)ஹம்ʼ ய ஏதே(அ)த்ர ஸமாக³தா꞉ ।
    தா⁴ர்தராஷ்ட்ரஸ்ய து³ர்பு³த்³தே⁴꞉ யுத்³தே⁴ ப்ரிய-சிகீர்ஷவ꞉ ॥

24: |-
    ஏவமுக்தோ ஹ்ருʼஷீகேஶோ கு³டா³கேஶேன பா⁴ரத ।
    ஸேனயோருப⁴யோர்மத்⁴யே ஸ்தா²பயித்வா ரதோ²த்தமம் ॥

25: |-
    பீ⁴ஷ்ம-த்³ரோண-ப்ரமுக²த꞉ ஸர்வேஷாம்ʼ ச மஹீ-க்ஷிதாம் ।
    உவாச பார்த² பஶ்ஶைதான் ஸமவேதான் குரூனிதி ॥

26: |-
    தத்ராபஶ்யத் ஸ்தி²தான் பார்த²꞉ பித்ரூʼனத² பிதாமஹான் । 
    ஆசார்யான் மாதுலான் ப்⁴ராத்ரூʼன் புத்ரான் பௌத்ரான் ஸகீ²ம்ʼஸ்ததா² ॥

27: |-
    ஶ்வஶுரான் ஸுஹ்ருʼத³ஶ்சைவ ஸேனயோருப⁴யோரபி ।

27.5: |-
    க்ருʼபயா பரயா(ஆ)விஷ்டோ விஷீத³ன்னித³மப்³ரவீத் ॥

28: |-
    தான் ஸமீக்ஷ்ய ஸ கௌந்தேய꞉ ஸர்வான் ப³ந்தூ⁴னவ-ஸ்தி²தான் ।

28.5: |-
    த்³ருʼஷ்ட்வேமம்ʼ ஸ்வஜனம்ʼ க்ருʼஷ்ண யுயுத்ஸும்ʼ ஸமுப-ஸ்தி²தம் ॥

29: |-
    ஸீத³ந்தி மம கா³த்ராணி முக²ம்ʼ ச பரி-ஶுஷ்யதி ।
    வேபது²ஶ்ச ஶரீரே மே ரோம-ஹர்ஷஶ்ச ஜாயதே ॥

30: |-
    கா³ண்டீ³வம்ʼ ஸ்ரம்ʼஸதே ஹஸ்தாத் த்வக் சைவ பரி-த³ஹ்யதே ।
    நச ஶக்னோம்யவ-ஸ்தா²தும்ʼ ப்⁴ரமதீவ ச மே மன꞉ ॥

31: |-
    நிமித்தானி ச பஶ்யாமி விபரீதானி கேஶவ ।
    நச ஶ்ரேயோ(அ)னு பஶ்யாமி ஹத்வா ஸ்வ-ஜனமாஹவே ॥

32: |-
    ந காங்க்ஷே விஜயம்ʼ க்ருʼஷ்ண நச ராஜ்யம்ʼ ஸுகா²னி ச ।
    கிம்ʼ நோ ராஜ்யேன கோ³விந்த³ கிம்ʼ போ⁴கை³ர்ஜீவிதேன வா ॥

33: |-
    யேஷாமர்தே² காங்க்ஷிதம்ʼ நோ ராஜ்யம்ʼ போ⁴கா³꞉ ஸுகா²னி ச ।
    த இமே(அ)வ-ஸ்தி²தா யுத்³தே⁴ ப்ராணாம்ʼஸ்த்யக்த்வா த⁴னானி ச ॥

34: |-
    ஆசார்யா꞉ பிதர꞉ புத்ரா꞉ ததை²வ ச பிதாமஹா꞉ ।
    மாதுலா꞉ ஶ்வஶுரா꞉ பௌத்ரா꞉ ஸ்யாலா꞉ ஸம்ப³ந்தி⁴னஸ்ததா² ॥

35: |-
    ஏதான் ந ஹந்துமிச்சா²மி க்⁴னதோ(அ)பி மது⁴-ஸூத³ன ।
    அபி த்ரைலோக்ய-ராஜ்யஸ்ய ஹேதோ꞉ கிம்ʼ நு மஹீ-க்ருʼதே ॥

36: |-
    நிஹத்ய தா⁴ர்தராஷ்ட்ரான் ந꞉ கா ப்ரீதி꞉ ஸ்யாஜ்ஜனார்த³ன ।
    பாபமேவா(அ)ஶ்ரயேத³ஸ்மான் ஹத்வைதானாததாயின꞉ ॥

37: |-
    தஸ்மான்னார்ஹா வயம்ʼ ஹந்தும்ʼ தா⁴ர்தராஷ்ட்ரான் ஸ்வ-பா³ந்த⁴வான் ।
    ஸ்வ-ஜனம்ʼ ஹி கத²ம்ʼ ஹத்வா ஸுகி²ன꞉ ஸ்யாம மாத⁴வ ॥

38: |-
    யத்³யப்யேதே ந பஶ்யந்தி லோபோ⁴ப-ஹத-சேதஸ꞉ ।
    குல-க்ஷய-க்ருʼதம்ʼ தோ³ஷம்ʼ மித்ர-த்³ரோஹே ச பாதகம் ॥

39: |-
    கத²ம்ʼ ந ஜ்ஞேயமஸ்மாபி⁴꞉ பாபாத³ஸ்மாந்நிவர்திதும் ।
    குல-க்ஷய-க்ருʼதம்ʼ தோ³ஷம்ʼ ப்ர-பஶ்யத்³பி⁴ர்ஜனார்த³ன ॥

40: |-
    குல-க்ஷயே ப்ரணஶ்யந்தி குல-த⁴ர்மா꞉ ஸனாதனா꞉ ।
    த⁴ர்மே நஷ்டே குலம்ʼ க்ருʼத்ஸ்னம்ʼ அத⁴ர்மோ(அ)பி⁴-ப⁴வத்யுத ॥

41: |-
    அத⁴ர்மாபி⁴-ப⁴வாத் க்ருʼஷ்ண ப்ர-து³ஷ்யந்தி குல-ஸ்த்ரிய꞉ ।
    ஸ்த்ரீஷு து³ஷ்டாஸு வார்ஷ்ணேய ஜாயதே வர்ண-ஸங்கர꞉ ॥

42: |-
    ஸங்கரோ நரகாயைவ குல-க்⁴னானாம்ʼ குலஸ்ய ச ।
    பதந்தி பிதரோ ஹ்யேஷாம்ʼ லுப்த-பிண்டோ³த³க-க்ரியா꞉ ॥

43: |-
    தோ³ஷைரேதை꞉ குல-க்⁴னானாம்ʼ வர்ண-ஸங்கர-காரகை꞉ ।
    உத்ஸாத்³யந்தே ஜாதி-த⁴ர்மா꞉ குல-த⁴ர்மாஶ்ச ஶாஶ்வதா꞉ ॥

44: |-
    உத்ஸன்ன-குல-த⁴ர்மாணாம்ʼ மனுஷ்யாணாம்ʼ ஜனார்த³ன ।
    நரகே நியதம்ʼ வாஸோ ப⁴வதீத்யனு ஶுஶ்ரும ॥

45: |-
    அஹோ ப³த மஹத் பாபம்ʼ கர்தும்ʼ வ்யவஸிதா வயம் ।
    யத்³ராஜ்ய-ஸுக²-லோபே⁴ன ஹந்தும்ʼ ஸ்வ-ஜனமுத்³யதா꞉ ॥

46: |-
    யதி³ மாமப்ரதீகாரம்ʼ அஶஸ்த்ரம்ʼ ஶஸ்த்ர-பாணய꞉ ।
    தா⁴ர்தராஷ்ட்ரா ரணே ஹன்யு꞉ தன்மே க்ஷேம-தரம்ʼ ப⁴வேத் ॥

47: |-
    ஏவமுக்த்வா(அ)ர்ஜுன꞉ ஸங்கே² ரதோ²பஸ்த² உபாவிஶத் ।
    விஸ்ருʼஜ்ய ஸ-ஶரம்ʼ சாபம்ʼ ஶோக-ஸம்ʼவிக்³ன-மானஸ꞉ ॥

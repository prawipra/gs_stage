geetaa_lead:
  kan: |
    ಶ್ರೀ ವೇದವ್ಯಾಸರು ರಚಿಸಿದ ಮಹಾಭಾರತದ ಭೀಷ್ಮಪರ್ವದಲ್ಲಿನ
  eng: |
    From the Bhishma Book of Sri Veda Vyasa's Mahabharata
  hin: |
    श्री वेद व्यास द्वारा रचित महाभारत के भीष्म पर्व की
  tam: |
    ஸ்ரீ வேதவ்யாசர் எழுதிய மஹாபாரதத்தில் உள்ள பீஷ்ம பருவத்திலுள்ள
  tel: |
    శ్రీ వేదవ్యాసుడు రచించిన మహాభారతంలోని భీష్మపర్వంలో ఉన్న
  mal: |
    ശ്രീ വേദവ്യാസൻ രചിച്ച മഹാഭാരതത്തിലെ ഭീഷ്മപർവത്തിൽ ഉൾപ്പെട്ട



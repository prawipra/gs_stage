common_cc_license_statement:
  kan: |
    ಈ ಸೈಟ್‌ನ ವಿನ್ಯಾಸ ಮತ್ತು ಕಾರ್ಯಾನ್ವಯ, ಹಾಗೂ ಇಲ್ಲಿ ಪ್ರದರ್ಶಿಸಿದ ಅನುವಾದಗಳು 
    ಮತ್ತು ಇತರ ಪಠ್ಯ, ಎಲ್ಲವೂ ಕ್ರಿಯೇಟಿವ್ ಕಾಮನ್ಸ್ ಪರವಾನಿಗೆಯಡಿ ಹಂಚಲ್ಪಟ್ಟಿವೆ.

  eng: |
    This site's design and implementation as well as the translations and other
    text presented are all distributed under a Creative Commons license.

  hin: |
    इस साइट का विन्यास और कार्यान्वयन, तथा यहाँ प्रदर्शित अनुवाद और
    अन्य पाठ, सभी क्रिएटिव कॉमन्स लाइसेंस के तहत वितरित किए गए हैं।
    
  tam: |
    இந்த சைட்‑இன் வடிவமைப்பு மற்றும் செயலாக்கம், மற்றும் இங்கு 
    காண்பிக்கப்பட்ட மொழிபெயர்ப்புகள் மற்றும் பிற உரைகள் 
    அனைத்தும் கிரியேட்டிவ் காமன்ஸ் உரிமையின் கீழ் பகிரப்படுகின்றன.    

  tel: |
    ఈ సైట్ డిజైన్ మరియు అమలు, అలాగే ఇక్కడ చూపించిన అనువాదాలు మరియు
    ఇతర పాఠ్యాలు అన్నీ క్రియేటివ్ కామన్స్ లైసెన్స్ కింద పంపిణీ చేయబడ్డాయి.


  mal: |
    ഈ സൈറ്റ്‌ന്റെ രൂപകൽപ്പനയും നടപ്പാക്കലും, ഇവിടെ പ്രദർശിപ്പിച്ച
    വിവർത്തനങ്ങളും മറ്റ് പാഠ്യങ്ങളും എല്ലാം ക്രിയേറ്റീവ് കോമൺസ്
    ലൈസൻസിന്റെ കീഴിലാണ് വിതരണം ചെയ്യപ്പെടുന്നത്.


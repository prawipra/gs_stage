# localized site description
site_description:
  kan: ಶ್ರೀ ವೇದವ್ಯಾಸರು ರಚಿಸಿದ ಮಹಾಭಾರತದ ಭೀಷ್ಮಪರ್ವದಲ್ಲಿನ ಭಗವದ್ಗೀತೆಯ ಅನುವಾದ
    # ಶ್ರೀ ವೇದವ್ಯಾಸರು ರಚಿಸಿದ ಮಹಾಭಾರತದ ಭೀಷ್ಮಪರ್ವದಲ್ಲಿನ ಭಗವದ್ಗೀತಾ
  eng: A translation of the Bhagavad Gita in the Bhishma Book of Sri Veda Vyasa's Mahabharata
    # The Bhagavad Gita in the Bhishma Book of Sri Veda Vyasa's Mahabharata
  hin: श्री वेद व्यास द्वारा रचित महाभारत के भीष्म पर्व की भगवद्गीता का अनुवाद
    # श्री वेद व्यास द्वारा रचित महाभारत के भीष्म पर्व की भगवद्गीता
  tam: ஸ்ரீ வேதவ்யாசர் எழுதிய மஹாபாரதத்தில் உள்ள பீஷ்ம பருவத்திலுள்ள பகவத்கீதாவின் மொழிபெயர்ப்பு
    # ஸ்ரீ வேதவ்யாசர் எழுதிய மஹாபாரதத்தில் உள்ள பீஷ்ம பருவத்திலுள்ள பகவத்கீதா
  tel: శ్రీ వేదవ్యాసుడు రచించిన మహాభారతంలోని భీష్మపర్వంలో ఉన్న భగవద్గీతా అనువాదం
    # శ్రీ వేదవ్యాసుడు రచించిన మహాభారతంలోని భీష్మపర్వంలో ఉన్న భగవద్గీత
  mal: ശ്രീ വേദവ്യാസൻ രചിച്ച മഹാഭാരതത്തിലെ ഭീഷ്മപർവത്തിൽ ഉൾപ്പെട്ട ഭഗവദ്ഗീതയുടെ പരിഭാഷ
    # ശ്രീ വേദവ്യാസൻ രചിച്ച മഹാഭാരതത്തിലെ ഭീഷ്മപർവത്തിൽ ഉൾപ്പെട്ട ഭഗവദ്ഗീതാ


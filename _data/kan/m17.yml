1: >-
    ಅರ್ಜುನನು ಕೇಳಿದನು - ಓ ಕೃಷ್ಣನೆ, ಕೆಲವರು ನಂಬಿಕೆ ಉಳ್ಳವರು ಶಾಸ್ತ್ರದ ನಿಯಮವನ್ನು ಬಿಟ್ಟು
    ಪೂಜಿಸುತ್ತಾರೆ. ಅಂಥವರ ನೆಲೆ ಎಂಥದು? ಸತ್ವವೆ? ರಜಸ್ಸೇ? ಅಥವಾ ತಮಸ್ಸೇ?

2: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಜೀವಿಗಳಿಗೆ ತಮ್ಮತನದಿಂದಲೆ ಹುಟ್ಟಿಬಂದ ನಂಬಿಕೆಯು ಸಾತ್ವಿಕ ರಾಜಸ
    ಮತ್ತು ತಾಮಸ ಎಂಬ ಮೂರು ಬಗೆಯದ್ದು ಆಗಿದೆ. ಆ ನಂಬಿಕೆಯ ಬಗ್ಗೆ ಕೇಳು.

3: >-
    ಓ ಭಾರತನೆ, ಎಲ್ಲರ ಶ್ರದ್ಧೆಯೂ ಅವರ ಸ್ವಭಾವಕ್ಕೆ ಅನುಗುಣವಾಗಿಯೆ ಇರುತ್ತದೆ. ಈ ಜೀವನು
    ಶ್ರದ್ಧೆಯ ರೂಪನು. ಶ್ರದ್ಧೆ ಯಾವ ರೀತಿಯದ್ದೋ ಅವನು ಅಂಥವನು.

4: >-
    ಸಾತ್ವಿಕರು ದೇವತೆಗಳನ್ನು ಪೂಜಿಸುತ್ತಾರೆ. ಮತ್ತೆ ರಾಜಸರು ಯಕ್ಷ-ರಾಕ್ಷಸರನ್ನು ಪೂಜಿಸುತ್ತಾರೆ.
    ಇತರರು ತಾಮಸ ಶ್ರದ್ಧೆಯವರು ಪ್ರೇತಗಳನ್ನು ಹಾಗೆಯೇ ಭೂತಗಡಣಗಳನ್ನು ಪೂಜಿಸುತ್ತಾರೆ.

6: >-
    ಬೂಟಾಟಿಕೆ ಮತ್ತು ಗರ್ವವುಳ್ಳ ಕೆಲವು ಜನರು ಆಸೆ-ಆಕಾಂಕ್ಷೆಗಳ ಬಲದೊಂದಿಗೆ ದೇಹವನ್ನು
    ದುಡಿಸುವ ದೇವತೆಗಳ ಸಮೂಹವನ್ನು ಮತ್ತು ದೇಹದೊಳಗಿರುವ ನನ್ನನ್ನೂ ಲೆಕ್ಕಿಸದೆ ಶಾಸ್ತ್ರ ಹೇಳದ
    ಹಾಳು ತಪಸ್ಸನ್ನು ಆಚರಿಸುವರು, ಆ ಅವಿವೇಕಿಗಳನ್ನು ಅಸುರಸ್ವಭಾವದವರೆಂದು ತಿಳಿ.

7: >-
    ಎಲ್ಲರ ಆಹಾರವೂ ಮೂರು ಬಗೆಯಾಗಿ ಇಷ್ಟ ಆಗುತ್ತದೆ. ಎಲ್ಲರ ಯಜ್ಞ, ತಪಸ್, ದಾನಗಳೂ ಮೂರು
    ವಿಧದಲ್ಲಿ ಪ್ರಿಯವಾಗಿವೆ. ಅವುಗಳ ಈ ವ್ಯತ್ಯಾಸವನ್ನು ಕೇಳು.

8: >-
    ಆಯುಷ್ಯ, ಮನೋಬಲ, ದೇಹಬಲ, ಆರೋಗ್ಯ, ಸುಖ ಮತ್ತು ಪ್ರೀತಿಗಳನ್ನು ಹೆಚ್ಚಿಸುವ ಆಹಾರಗಳು,
    ರುಚಿಯಾದ, ಪಸೆಯುಳ್ಳ, ಬಹಳ ಕಾಲ ಪರಿಣಾಮ ಕೊಡುವ, ಮನೋಹರವಾದ ಆಹಾರಗಳೂ ಸಾತ್ವಿಕರಿಗೆ
    ಇಷ್ಟವಾದವುಗಳು.

9: >-
    ಹೆಚ್ಚಿನ ಖಾರ, ಹುಳಿ, ಉಪ್ಪು, ಬಿಸಿ, ಕಟ್ಟಗೆ, ರಸಹೀನ (ಒಣ) ಮತ್ತು ಶೀತ ತಿನಿಸುಗಳು
    (ದೇಹಕ್ಕೆ) ದುಃಖ, (ಮನಸ್ಸಿಗೆ) ಸಂಕಟ ಮತ್ತು ರೋಗಗಳನ್ನು ತರುವ ತಿನಿಸುಗಳೂ ರಾಜಸರಿಗೆ
    ಪ್ರಿಯವಾದವುಗಳು.

10: >-
    ಹೊತ್ತು ಮೀರಿದ್ದು, ರುಚಿ ಇಲ್ಲದ್ದು, ಹಳಸಿದ್ದು, ಕೊಳಕಾದದ್ದು, ತಂಗಳು ಮತ್ತು ಎಂಜಲು ಇವು
    ತಾಮಸರಿಗೆ ಪ್ರಿಯವಾದ ಊಟ.

11: >-
    ಫಲದ ಆಸೆ ಇಲ್ಲದೆ, ಶಾಸ್ತ್ರ ಹೇಳಿದಂತೆ, ಕರ್ತವ್ಯ ಎಂಬ ನೆಲೆಯಲ್ಲಿ ಇಷ್ಟವಾದ ಮನಸ್ಸಿನಿಂದ
    ಮಾಡಿದ ಯಜ್ಞ ಸಾತ್ವಿಕ.

12: >-
    ಫಲದ ಆಸೆಯಿಂದ ಮಾಡಿದ ಯಜ್ಞ ರಾಜಸ. ಓ ಭರತಶ್ರೇಷ್ಠನೆ, ತೋರಿಕೆಗಾಗಿ ಮಾಡಿದ ಯಜ್ಞವನ್ನೂ
    ರಾಜಸವೆಂದೆ ತಿಳಿ.

13: >-
    ಶಾಸ್ತ್ರನಿಯಮ ಬಿಟ್ಟು ಮಾಡಿದ ಯಜ್ಞವನ್ನು ತಾಮಸ ಎನ್ನುವರು. ಅನ್ನದಾನ, ಮಂತ್ರ, ದಕ್ಷಿಣೆ,
    ದೇವನಲ್ಲಿ ನಂಬಿಕೆ ಯಾವುದೊಂದೂ ಇಲ್ಲದೆ ಮಾಡಿದ ಯಜ್ಞವೂ ತಾಮಸ.

14: >-
    ವೇದಶಾಸ್ತ್ರದ ದೇವತೆಗಳು, ಅಧ್ಯಯನಯೋಗ್ಯರು, ಅಧ್ಯಾಪಕರು, ವೇದಾರ್ಥ ತಿಳಿದವರು ಇವರನ್ನು
    ಗೌರವಿಸುವುದು, ತೀರ್ಥಗಳಲ್ಲಿ ಮುಳುಗಿ ಮೀಯುವುದು, ನೇರ ನಡೆ, ಬ್ರಹ್ಮಚರ್ಯ ಮತ್ತು ಯಾರಿಗೂ
    ಹೊಡೆಯದಿರುವುದು ಶರೀರದ ತಪಸ್ಸು ಎನಿಸುತ್ತದೆ.

15: >-
    ಕೆರಳಿಸದ, ಸತ್ಯವಾದ (ಸುಳ್ಳಿರದ), ಕೇಳಲು ಇಷ್ಟವಾದ, ಹಾಗೆಯೆ ಒಳ್ಳೆಯದು ಮಾಡುವ ಮಾತು ಮತ್ತು
    ಶಾಸ್ತ್ರಗಳ ಕಲಿಕೆಯೂ ಮಾತಿನ ತಪಸ್ಸು ಎನಿಸುತ್ತದೆ.

16: >-
    ಕೋಪಿಸದಿರುವುದು, ಮೃದುತನ, ಮನನ, ತನ್ನ ಮೇಲೆ ಹಿಡಿತ ಮತ್ತು ಒಳ್ಳೆಯ ಅಭಿಪ್ರಾಯ - ಇವು ಮನದ
    ತಪಸ್ಸು ಎನಿಸುತ್ತವೆ.

17: >-
    ಈ ಮೂರೂ ಬಗೆಯ ತಪಸ್ಸು, ಫಲದ ಆಸೆ ತೊರೆದ ಮನುಜರಿಂದ ಪೂರ್ತಿ ನಂಬಿಕೆಯಿಂದ ದೇವರಿಗಾಗಿ
    ನಡೆಸಲ್ಪಟ್ಟರೆ ಅದನ್ನು ಸಾತ್ವಿಕ ತಪಸ್ಸು ಎನ್ನುತ್ತಾರೆ.

18: >-
    ಇಲ್ಲಿ ಸಾಧು ಎನಿಸಲು, ಸಂಮಾನ ಪಡೆಯಲು, ಗೌರವಕ್ಕಾಗಿ ಬೂಟಾಟಿಕೆಯಿಂದ ಮಾಡುವ ಚಂಚಲವಾದ,
    ಶಾಶ್ವತವಲ್ಲದ ಆ ತಪಸ್ಸು ರಾಜಸ ಎನಿಸಿದೆ.

19: >-
    ಶಾಸ್ತ್ರದ ಮಾತನ್ನು ತಪ್ಪಾಗಿ ತಿಳಿದಿದ್ದರಿಂದ ತನ್ನನ್ನೆ ಹಿಂಸಿಸುವ ಮೂಲಕ ಮಾಡಿದ ತಪಸ್ಸು
    ತಾಮಸ ಎನಿಸಿದೆ ಅಥವಾ ಪರನ ಪೀಡೆಗಾಗಿ ಮಾಡಿದ್ದೂ ತಾಮಸವೆ.

20: >-
    ಪ್ರತ್ಯುಪಕಾರಕ್ಕಾಗಿ ಅಲ್ಲದೆ, ಕರ್ತವ್ಯ ಎಂದು ಕೊಡುವ ದಾನವು, ಪುಣ್ಯದೇಶದಲ್ಲಿ ಪ್ರಶಸ್ತಕಾಲದಲ್ಲಿ
    ಯೋಗ್ಯವ್ಯಕ್ತಿಗೆ ನೀಡಲ್ಪಟ್ಟಾಗ ಅದು ಸಾತ್ವಿಕ ದಾನ ಎನಿಸುವುದು.

21: >-
    ಪ್ರತ್ಯುಪಕಾರಕ್ಕಾಗಿ ಅಥವಾ ಫಲದ ಆಸೆಯಿಂದ ಒಳಗೆ ಸಂಕಟಪಡುತ್ತ ನೀಡುವ ದಾನ ರಾಜಸ ಎನಿಸಿದೆ.

22: >-
    ಶಾಸ್ತ್ರ ಹೇಳದ ದೇಶ-ಕಾಲಗಳಲ್ಲಿ ಅಯೋಗ್ಯನಿಗೆ, ಗೌರವಿಸದೆ ಅವಹೇಳನೆಯೊಂದಿಗೆ ನೀಡಿದ ದಾನ ತಾಮಸ
    ಎನಿಸಿದೆ.

23: >-
    ಓಂ (ಅಂತರ್ಯಾಮಿ) ತತ್ (ವ್ಯಾಪ್ತ) ಸತ್ (ನಿರ್ದೋಷ) ಎಂದು ದೇವನ ಮೂರು ರೀತಿಯ ಹೆಸರುಗಳು
    ಎನಿಸಿವೆ. ಆ ದೇವನಿಂದಲೆ ಹಿಂದೆ ವೇದಜ್ಞರು ವೇದಗಳು ಮತ್ತು ಯಜ್ಞಗಳು ಆದವು.

24: >-
    ಆದ್ದರಿಂದ ವೇದದಲ್ಲಿ ದೇವನನ್ನು ಚಿಂತಿಸುವ ವೈದಿಕರ ವೇದೋಕ್ತ ಕರ್ಮಗಳು
    ಯಜ್ಞದಾನತಪಸ್ಸುಗಳು ಯಾವಾಗಲೂ ಓಂ ಎಂದು ದೇವನ ನಾಮಸ್ಮರಣೆಯ ಜತೆಗೆ ಆರಂಭವಾಗುತ್ತವೆ.

25: >-
    ಮೋಕ್ಷ ಬಯಸುವವರು, ಫಲವನ್ನು ಬಯಸದೆ ತತ್ ಎಂದು ದೇವನ ನಾಮಸ್ಮರಣೆಯ ಜೊತೆಗೆ ಬಗೆಬಗೆಯ
    ಯಜ್ಞದಾನತಪಸ್ಸುಗಳನ್ನು ಮಾಡುತ್ತಾರೆ.

26: >-
    ಓ ಪಾರ್ಥನೆ, ಹುಟ್ಟು ಮತ್ತು ಒಳ್ಳೆಯತನ ಎಂಬ ಅರ್ಥದಲ್ಲಿ ಸತ್ ಎಂಬ ಶಬ್ದ ಉಪಯೋಗಿಸಲ್ಪಡುತ್ತದೆ.
    ಹಾಗೆಯೆ ಒಳ್ಳೆಯ ಕೆಲಸ ಎಂಬ ಅರ್ಥದಲ್ಲಿಯೂ ಸತ್ ಶಬ್ದ ಬಳಸಲ್ಪಡುತ್ತದೆ.

27: >-
    ಯಜ್ಞ, ದಾನ, ತಪಸ್ಸುಗಳಲ್ಲಿ ನಿಷ್ಠೆಯು ಸತ್ ಎನಿಸುತ್ತದೆ. ದೇವರಿಗಾಗಿ ನಡೆಸುವ ಕರ್ಮವೂ ಸತ್
    ಎಂದೇ ಕರೆಯಲ್ಪಡುತ್ತದೆ.

28: >-
    ಓ ಪಾರ್ಥನೆ, ನಂಬಿಕೆ ಇಲ್ಲದೆ (ಅಸಡ್ಡೆಯಿಂದ) ಮಾಡಿದ ಹೋಮ, ದಾನ, ತಪಸ್ಸು ಮತ್ತು ಯಾವುದೇ
    ಕರ್ಮವು ಅಸತ್ (ಹಾಳು) ಎಂದು ಹೇಳಲ್ಪಡುವುದು. ಆ ಕರ್ಮ ಸತ್ತ ಬಳಿಕವೂ ಫಲ ಕೊಡದು, ಈ
    ಲೋಕದಲ್ಲಿಯೂ ಫಲ ನೀಡದು.

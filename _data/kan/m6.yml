1: >-
    ಕರ್ಮದ ಫಲವನ್ನು ಬಯಸದೆ ಕರ್ತವ್ಯವನ್ನು ಮಾಡುವವನೆ ಸಂನ್ಯಾಸಿಯು, ಅವನೇ ಯೋಗಿಯು. ಅಗ್ನಿಯಲ್ಲಿ
    ಹೋಮ ನಡೆಸದವನಾಗಲಿ, ಕರ್ಮ ಬಿಟ್ಟವನಾಗಲಿ ಸಂನ್ಯಾಸಿಯಲ್ಲ, ಯೋಗಿಯಲ್ಲ.

2: >-
    ಓ ಪಾಂಡವನೆ, ಯಾವುದನ್ನು ಸಂನ್ಯಾಸ ಎನ್ನುವರೋ ಅದನ್ನೇ ಯೋಗ ಎಂದು ತಿಳಿ. ಬಯಕೆಗಳನ್ನು
    ಬಿಡದವ (ಸಂನ್ಯಾಸ ಮಾಡದವ) ಕರ್ಮಯೋಗಿ ಎನಿಸಲಾರ.

3: >-
    ಯೋಗದ ಹಂತಕ್ಕೆ ಏರಲು ಸಾಧಕನಿಗೆ ಕರ್ಮವೇ ಕಾರಣವಾಗಿದೆ. ಯೋಗದ ಹಂತ ತಲುಪಿದ ಅವನಿಗೆ ದೇವರ
    ಧ್ಯಾನ ಕಾರಣವಾಗಿದೆ.

4: >-
    ಇಂದ್ರಿಯ ವಿಷಯಗಳನ್ನು ಅಂಟಿಸಿಕೊಳ್ಳದೆ, ಕರ್ಮದ ಫಲಗಳಲ್ಲಿ ಆಸಕ್ತನಾಗದೆ, ಎಲ್ಲವನ್ನು ದೇವರು
    ನಡೆಸುವನೆಂದು ತಿಳಿದವನು ಯೋಗದ ಹಂತವನ್ನು ತಲುಪಿದ್ದಾನೆಂದು ಅರ್ಥ.

5: >-
    ಮನಸ್ಸಿನಿಂದಲೇ ಜೀವನನ್ನು ಮೇಲೆತ್ತಬೇಕು. ಜೀವನನ್ನು ಕೆಳಕ್ಕೆ ತಳ್ಳಬಾರದು. ಜೀವನಿಗೆ
    ಮನಸ್ಸೇ ಬಂಧು, ಜೀವನಿಗೆ ಮನಸೇ ಶತ್ರು.

6: >-
    ಬುದ್ಧಿಯಿಂದ ಮನಸ್ಸನ್ನು ಗೆಲ್ಲಬೇಕು. ಆಗ ಮನಸ್ಸು ಜೀವನಿಗೆ ಬಂಧು ಎನಿಸುತ್ತದೆ.
    ಬುದ್ಧಿಯಿಲ್ಲದವನಿಗೆ ಮನಸ್ಸೇ ವೈರಿಯಂತೆ ವಿರೋಧ ಮಾಡುತ್ತದೆ.

8: >-
    ಮನಸ್ಸನ್ನು ಗೆದ್ದು ಸುಖವಾಗಿರುವವನಿಗೆ ದೇವರು ನೆನಪಿನಲ್ಲಿರುತ್ತಾನೆ. ಈ ಯೋಗಿಯು
    ತಂಪು-ಬಿಸಿ, ಸುಖ-ದುಃಖ, ಸಂಮಾನ-ಅಪಮಾನ ಮುಂತಾದ ದ್ವಂದಗಳಲ್ಲಿ ವಿಕಾರಗೊಳ್ಳನು.
    ಇಂದ್ರಿಯಗಳನ್ನು ಗೆದ್ದವ ದೇವರ ಸಾಮಾನ್ಯ ಮತ್ತು ವಿಶೇಷವಾದ ತಿಳಿವಿನಿಂದ ಸುಖವಾಗಿರುವನು.
    ಮಣ್ಣು, ಕಲ್ಲು, ಚಿನ್ನ ಎಲ್ಲವನ್ನೂ ಸಮನಾಗಿ ಕಾಣಬಲ್ಲ ಈತ ಯೋಗಸಿದ್ಧನು ಎನಿಸುತ್ತಾನೆ.

9: >-
    ಹಿತೈಷಿ, ಮಿತ್ರ, ಶತ್ರು, ಉದಾಸೀನ, ಮಧ್ಯಸ್ಥ, ದ್ವೇಷಿ, ಬಂಧು, ಸಾಧು, ಕೆಟ್ಟವ ಇವರಲ್ಲಿ
    ಎಲ್ಲರಲ್ಲೂ ದೇವರ ಇರವನ್ನು ಸರಿಯಾಗಿ ತಿಳಿದವನೆ ಹೆಚ್ಚಿನವನು.

10: >-
    ಮನಸ್ಸಿನಲ್ಲಿ ಏನನ್ನೂ ಆಸೆಪಡದೆ, ದೇಹಸುಖಕ್ಕಾಗಿ ಏನನ್ನೂ ಯಾರಿಂದಲೂ ಪಡೆಯದೆ, ಯೋಗಿಯು
    ತಾನೊಬ್ಬನೇ ಯಾವಾಗಲೂ ಯಾರಿಗೂ ತಿಳಿಯದ ಜಾಗದಲ್ಲಿದ್ದು ಧ್ಯಾನ ನಡೆಸಬೇಕು.

12: >-
    ಹೆಚ್ಚು ಎತ್ತರವಾಗದಂತೆ, ಹೆಚ್ಚು ತಗ್ಗೂ ಆಗದಂತೆ ಬಟ್ಟೆಯ ಮೇಲೆ ಜಿಂಕೆಯ ಚರ್ಮ, ಅದರ
    ಮೇಲೆ ದರ್ಭೆ ಹಾಸಿ, ತನಗಾಗಿ ಶುದ್ಧ ಜಾಗದಲ್ಲಿ ಅಲುಗಾಡದಂತೆ ಆಸನವನ್ನು ತಯಾರಿಸಿಕೊಂಡು,
    ಆಸನದಲ್ಲಿ ಕುಳಿತು, ಮನದ ಮತ್ತು ಇಂದ್ರಿಯಗಳ ಹೊರ ಕೆಲಸಗಳನ್ನು ನಿಲ್ಲಿಸಿ, ಆತ್ಮಶುದ್ಧಿಗಾಗಿ
    ಏಕಾಗ್ರತೆಯಿಂದ ಧ್ಯಾನ ಮಾಡಬೇಕು.

14: >-
    ಬೆನ್ನು, ತಲೆ, ಕುತ್ತಿಗೆಗಳನ್ನು ನೇರವಾಗಿಸಿ ಅಲುಗಾಡದೆ ಕುಳಿತು, ಅತ್ತಿತ್ತ ನೋಡದೆ ತನ್ನ
    ಮೂಗಿನ ತುದಿಯನ್ನೇ ನೋಡುತ್ತಾ, ಬ್ರಹ್ಮಚರ್ಯದಲ್ಲಿದ್ದು, ನಾನೇ ಎಲ್ಲರಿಗಿಂತ ದೊಡ್ಡವನೆಂದು
    ನನ್ನನ್ನೇ ನೆನೆಯುತ್ತಾ ಮತ್ತೆ ಮತ್ತೆ ಮನಸ್ಸನ್ನು ಎಳೆದು ಹಿಡಿದು ನಡುದೇಹದಲ್ಲಿ ನನ್ನನ್ನು
    ಅಂಜದೆ ಧ್ಯಾನಿಸಬೇಕು.

15: >-
    ಹೀಗೆ ಮನಸ್ಸನ್ನೂ ನಿಗ್ರಹಿಸಿ ದೇವರನ್ನು ನಿತ್ಯ ಧ್ಯಾನಿಸುತ್ತಾ, ಯೋಗಿಯು ದೇಹ ಬಿಟ್ಟ ಮೇಲೆ
    ನನ್ನ ಲೋಕವನ್ನು ಸೇರುತ್ತಾನೆ.

16: >-
    ಓ ಅರ್ಜುನನೆ, ತುಂಬಾ ತಿನ್ನುತ್ತಲೆ ಇರುವವನಿಗೆ ಧ್ಯಾನಯೋಗ ಸಾಧ್ಯವಿಲ್ಲ. ಹೆಚ್ಚಾಗಿ
    ಉಪವಾಸ ಮಾಡುತ್ತಿದ್ದರೂ ಧ್ಯಾನ ನಡೆಯದು. ಅತಿ ನಿದ್ದೆಯವನಿಗೂ ಧ್ಯಾನ ಆಗದು. ನಿದ್ದೆ
    ಬಿಟ್ಟವನಿಗೂ ಧ್ಯಾನ ಮಾಡಲಾಗದು.

17: >-
    ಯೋಗ್ಯವಾದ ಆಹಾರ, ಮತ್ತೆ ವಿಹಾರ, ಹೇಳಿದ್ದಷ್ಟೆ ಕೆಲಸಗಳು, ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ನಿದ್ದೆ,
    ಮತ್ತೆ ಎಚ್ಚರ, ಹೀಗಿದ್ದವನಿಗೆ ಧ್ಯಾನಯೋಗ ಕಷ್ಟವಿಲ್ಲ.

18: >-
    ಎಲ್ಲ ಆಸೆಗಳನ್ನು ಬಿಟ್ಟು, ಮನಸ್ಸನ್ನು ಚೆನ್ನಾಗಿ ನಿಗ್ರಹಿಸಿ, ದೇವರಲ್ಲೆ ನೆಲೆಗೊಳಿಸಿದವನು
    ಧ್ಯಾನಯೋಗಿ ಎಂದು ಕರೆಯಲ್ಪಡುತ್ತಾನೆ.

19: >-
    ಗಾಳಿ ಬೀಸದಲ್ಲಿ ಇರುವ ದೀಪವು ಅಲ್ಲಾಡುವುದಿಲ್ಲ. ಇದು ಮನಸ್ಸನ್ನು ನಿಗ್ರಹಿಸಿ ದೇವರಲ್ಲಿ
    ನೆಲೆಗೊಂಡ ಯೋಗಿಗೆ ಹೋಲಿಕೆ ಆಗಿದೆ.

20: >-
    ಧ್ಯಾನಯೋಗದಿಂದ ಹೊರಗೆ ಹೋಗದಂತೆ ನಿಗ್ರಹಿಸಲ್ಪಟ್ಟ ಮನಸ್ ಆನಂದವಾಗಿರುತ್ತದೆ. ಇಂಥ ಮನದಿಂದ
    ದೇವನನ್ನು ಕಂಡು ತನ್ನಲ್ಲೇ ಸಂತಸಪಡುತ್ತಾನೆ.

21: >-
    ಈಗ ಹೊರ ಇಂದ್ರಿಯಗಳಿಗೆ ಸಿಗದ, ಒಳಮನಸ್ಸಿಗೆ ಸಿಗುವ ಅತಿಶಯ ಸುಖವನ್ನು ಅನುಭವಿಸುತ್ತಾನೆ.
    ಆಗ ದೇವನನ್ನು ಮರೆಯುವುದೇ ಇಲ್ಲ.

22: >-
    ದೇವರನ್ನು ಧ್ಯಾನದಲ್ಲಿ ಪಡೆದವನು ಇದಕ್ಕಿಂತ ದೊಡ್ಡ ಲಾಭ ಬೇರೆ ಇದೆ ಎಂದು ತಿಳಿಯುವುದಿಲ್ಲ.
    ಈ ಹಂತದಲ್ಲಿರುವವನು ಎಂತಹ ದೊಡ್ಡ ದುಃಖ ಬಂದರೂ ಯೋಗವನ್ನು ಬಿಡುವುದಿಲ್ಲ.

23: >-
    ಇದುವೇ, ಬಂದ ದುಃಖಗಳ ದೂರಮಾಡುವ ಯೋಗ ಎನಿಸಿದೆ ಎಂದು ತಿಳಿಯಬೇಕು. ವಿಷಯಗಳಲ್ಲಿ ವೈರಾಗ್ಯ
    ಬಂದಾಗ ನಿಶ್ಚಯವಾಗಿ ಈ ಯೋಗದಲ್ಲಿ ತೊಡಗಬೇಕು.

25: >-
    ಮನಸ್ಸಿನಲ್ಲಿ ಬಂದಿರುವ ಎಲ್ಲ ಆಸೆಗಳನ್ನು ಪೂರ್ತಿಯಾಗಿ ಬಿಡಬೇಕು. ಹೊರಗಿನ
    ಇಂದ್ರಿಯಗಳನ್ನೆಲ್ಲ ಎಲ್ಲ ಕಡೆಯಿಂದಲೂ ಮನಸ್ಸಿನಿಂದಲೆ ನಿಗ್ರಹಿಸಿಡಬೇಕು. ಧೈರ್ಯವಹಿಸಿ,
    ವಿವೇಕದಿಂದ ಮನಸ್ಸನ್ನು ನಿಧಾನವಾಗಿ ದೇವರಲ್ಲಿ ನೆಲೆಗೊಳಿಸಿ ಶಾಂತನಾಗಬೇಕು. ಬೇರೇನನ್ನೂ
    ನೆನೆಯಬಾರದು.

26: >-
    ಗಟ್ಟಿ ನಿಲ್ಲದೆ ಎಲ್ಲೆಲ್ಲಿಗೋ ಓಡಿದ ಚಂಚಲ ಮನಸ್ಸನ್ನು ಅಲ್ಲಲ್ಲಿಂದ ಎಳೆದೆಳೆದು ದೇವರಲ್ಲಿಯೆ
    ನಿಲ್ಲುವಂತೆ ತನ್ನ ವಶಕ್ಕೆ ತರಬೇಕು.

27: >-
    ರಾಜಸ-ತಾಮಸಭಾವಗಳಿಂದ ದೂರನಾದ ಯೋಗಿಯ ಮನಸ್ಸು ದೇವರಲ್ಲಿ ನೆಲೆಗೊಂಡು ಸಾತ್ವಿಕವಾದಾಗ ಯೋಗಿ
    ಉತ್ತಮ ಸುಖವನ್ನು ಪಡೆವನು.

28: >-
    ಹೀಗೆ ಮನೋದೋಷ ಇಲ್ಲದೆ ಯೋಗಿ ದೇವರನ್ನು ನಿರಂತರ ಆಯಾಸಪಡದೆ ಧ್ಯಾನಿಸುತ್ತಾ ದೇವರನ್ನು
    ಮುಟ್ಟಿದ ಭಾರೀ ಸುಖವನ್ನು ಅನುಭವಿಸುವನು.

29: >-
    ಎಲ್ಲೆಡೆ ದೇವನನ್ನು ಸಮನಾಗಿ ಕಾಣುವ ಧ್ಯಾನಯೋಗದ ಸಾಧಕನು ಎಲ್ಲದರಲ್ಲೂ ದೇವನನ್ನು ಕಾಣುತ್ತಾನೆ.
    ಎಲ್ಲವನ್ನೂ ದೇವರಲ್ಲಿ ಕಾಣುತ್ತಾನೆ.

30: >-
    ಯಾರು ನನ್ನನ್ನು ಎಲ್ಲೆಡೆ ಕಾಣುತ್ತಾನೆ ಮತ್ತು ನನ್ನಲ್ಲಿ ಎಲ್ಲವನ್ನೂ ಕಾಣುತ್ತಾನೆ,
    ಅವನಿಗೆ ನಾನು ಮರೆಯಾಗುವುದಿಲ್ಲ. ಅವನೂ ನನಗೆ ಮರೆಯಾಗಲಾರ.

31: >-
    ನನಗೆ ಯಾರೂ ಸಮನು ಇಲ್ಲ. ನನಗಿಂತ ಯಾರೊಬ್ಬನೂ ಉತ್ತಮನಿಲ್ಲ. ಹೀಗೆ ನಾನು ಎಲ್ಲರಿಗಿಂತ
    ಶ್ರೇಷ್ಠನು, ಚರಾಚರದಲ್ಲೆಲ್ಲ ಇರುವೆನು. ಹೀಗೆ ತಿಳಿದು ನನ್ನನ್ನು ಸೇವೆಗೈಯುವ ಯೋಗಿ ಹೇಗೆ
    ಬೇಕೋ ಹಾಗೆ ಇದ್ದರೂ ನನ್ನಲ್ಲೇ ಇರುತ್ತಾನೆ.

32: >-
    ಓ ಅರ್ಜುನನೇ, ಸುಖವನ್ನಾಗಲಿ ದುಃಖವನ್ನಾಗಲಿ ತನ್ನಂತೆಯೆ ಎಲ್ಲೆಡೆ ಸಮಾನವಾಗಿ ಕಾಣುವವನೇ
    ಪರಮಯೋಗಿ ಎನಿಸುತ್ತಾನೆ.

33: >-
    ಅರ್ಜುನ ಹೇಳುತ್ತಾನೆ - ಓ ಮಧುಸೂದನನೇ, ನೀನು ಸಮದೃಷ್ಟಿಯ ಧ್ಯಾನಯೋಗವನ್ನು ಹೇಳಿದೆ.
    ಮನಸ್ಸು ಚಂಚಲವಾದ್ದರಿಂದ ಇದು ಗಟ್ಟಿಯಾಗಿ ನಿಲ್ಲುತ್ತೆ ಎಂದು ನಾನು ಭಾವಿಸಲಾರೆ.

34: >-
    ಓ ಕೃಷ್ಣನೇ, ಚಂಚಲವಾದ ಮನಸ್ಸು ಬಲವುಳ್ಳದ್ದು, ತುಂಬಾ ಕಲಡಿಸುತ್ತದೆ. ಗಾಳಿಯನ್ನು ಹೇಗೆ
    ಹಿಡಿಯಲಾಗದೋ, ಹಾಗೆ ಮನದ ನಿಗ್ರಹ ಕಷ್ಟವೆಂದೇ ನಾನು ತಿಳಿದಿರುವೆ.

35: >-
    ಕೃಷ್ಣನು ಹೇಳುತ್ತಾನೆ - ಓ ಮಹಾವೀರನೆ, ಚಂಚಲವಾದ ಮನಸ್ಸನ್ನು ನಿಗ್ರಹಿಸುವುದು ಕಷ್ಟಸಾಧ್ಯ
    ಎನ್ನುವುದು ನಿಶ್ಚಿತ. ಓ ಕುಂತೀಪುತ್ರನೆ, ಮತ್ತೆ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸುವುದರಿಂದ ಹಾಗೆಯೆ
    ವೈರಾಗ್ಯದಿಂದ ಮನವನ್ನು ನಿಗ್ರಹ ಮಾಡಬಹುದು.

36: >-
    ಮನೋನಿಗ್ರಹ ಇಲ್ಲದವನಿಂದ ಧ್ಯಾನಯೋಗ ಆಗದು ಎಂದು ನನ್ನ ಮತ. ಮನಸ್ಸನ್ನು ವಶಮಾಡಿದವನಿಂದ
    ಧ್ಯಾನವು ಪೂರ್ತಿಯಾಗಿ ಯಾವಾಗಲೂ ಸಾಧ್ಯ.

37: >-
    ಅರ್ಜುನನ ಪ್ರಶ್ನೆ - ಓ ಕೃಷ್ಣನೇ, ಶ್ರದ್ಧೆವುಳ್ಳವನು ಪ್ರಯತ್ನಿಸಲಾಗದೆ ಮನಸ್ಸಿನಿಂದ
    ಧ್ಯಾನವನ್ನು ನಡೆಸಿಲ್ಲ. ಯೋಗಸಿದ್ಧಿಯನ್ನು ಪಡೆಯದ ಈತನು ಯಾವ ಗತಿಯನ್ನು ಪಡೆಯುವನು?

38: >-
    ಓ ತುಂಬುತೋಳಿನ ಕೃಷ್ಣನೆ, ಯೋಗಸಾಧನೆಯಲ್ಲಿ ದೇವರೆಡೆಗೆ ತೆರಳಿದ್ದಾನೆ ಆದರೆ ಮಾನಸ
    ತೊಂದರೆಯಿಂದಾಗಿ ಸಿದ್ಧಿಯನ್ನು ಪಡೆದಿಲ್ಲ. ಈಗವನು ಎರಡೂ ಕಡೆ ಇಲ್ಲದೆ ನಡುವೆ ಸಿಲುಕಿದ್ದಾನೆ.
    ಮೋಡದ ತುಂಡೊಂದು ಅತ್ತ ಮಳೆಯೂ ಆಗದೆ, ಇತ್ತ ಆಕಾಶದಲ್ಲೂ ತೇಲದೆ ಕೆಳಗೆ ಬಿದ್ದು ಹಾಳಾದಂತೆ
    ನಾಶವಾಗುವನೋ ಏನು?

39: >-
    ಓ ಕೃಷ್ಣನೆ, ನನ್ನ ಈ ಸಂಶಯವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಪರಿಹರಿಸು. ನೀನಲ್ಲದೆ ಬೇರೆ ಯಾರೂ ಈ
    ಸಂಶಯವನ್ನು ತೆಗೆಯುವವರು ಇಲ್ಲ.

40: >-
    ಕೃಷ್ಣನ ಉತ್ತರ - ಓ ಪಾರ್ಥನೆ, ಇಲ್ಲಿಯಾಗಲಿ ಪರಲೋಕದಲ್ಲಾಗಲಿ ಅವನಿಗೆ ನಾಶವಿಲ್ಲ. ಒಳ್ಳೆಯದು
    ಮಾಡಿದ ಯಾರೊಬ್ಬನೂ ಕೆಟ್ಟದ್ದನ್ನು ಪಡೆಯುವುದೇ ಇಲ್ಲ ತಾನೆ!

41: >-
    ಹೀಗೆ ಯೋಗಸಾಧನೆಯಲ್ಲಿ ತಪ್ಪಿದವನು ಒಳ್ಳೆಯದು ಮಾಡಿದವರ (ಪಾಲಿಗೆ ಸಿಗುವ ೨೧ ಬಗೆಯ ಸ್ವರ್ಗದ)
    ಲೋಕಗಳನ್ನು ಪಡೆದು, ಅಲ್ಲಿ ಬಹಳ ಕಾಲ ವಾಸವಿದ್ದು, ಮತ್ತೆ ಆಚಾರ-ವಿಚಾರ ಶುದ್ಧವುಳ್ಳ ಶ್ರೀಮಂತರ
    ಮನೆಯಲ್ಲಿ ಹುಟ್ಟುತ್ತಾನೆ.

42: >-
    ಅಥವಾ ಬುದ್ಧಿವಂತರಾದ ಯೋಗಿಗಳ ವಂಶದಲ್ಲಿ ಹುಟ್ಟುತ್ತಾನೆ. ಈ ಲೋಕದಲ್ಲಿ ಈ ರೀತಿಯ ಹುಟ್ಟು
    ಹೆಚ್ಚಾಗಿ ಸಿಗುವುದಿಲ್ಲ.

43: >-
    ಓ ಕುರುಕುಮಾರನೆ, ಆ ಜನ್ಮದಲ್ಲಿಯೂ ಹಿಂದಿನ ಜನ್ಮದ ಶರೀರದಲ್ಲಿ ಮಾಡಿದ ಧ್ಯಾನಸಾಧನೆಯನ್ನು
    ಹೊಂದುತ್ತಾನೆ. ಪೂರ್ತಿ ಸಿದ್ಧಿಗಾಗಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸುತ್ತಾನೆ.

44: >-
    ಅದೇ ಹಿಂದಿನ ಅಭ್ಯಾಸದಿಂದ ದೇವರ ವಶವಾಗಿ ಆತ ಯೋಗಕ್ಕೇ ಎಳೆಯಲ್ಪಡುತ್ತಾನೆ. ಯೋಗವನ್ನು
    ತಿಳಿಯಲೇಬೇಕೆಂದು ಇಚ್ಛಿಸಿದವನು ವೇದವೇದ್ಯನಾದ ದೇವನನ್ನು ಪಡೆಯುತ್ತಾನೆ.

45: >-
    ಧ್ಯಾನಯೋಗಿಯು ಪ್ರಯತ್ನಪಟ್ಟು ಮನಸ್ಸಿನ ದೋಷವನ್ನು ದೂರ ಮಾಡಿ ತುಂಬಾ ಜನ್ಮಗಳ ಸಾಧನೆಯಿಂದ
    ಸಿದ್ದಿ ಹೊಂದಿ, ಮೋಕ್ಷವನ್ನು ಪಡೆವನು.

46: >-
    ತಪಸ್ವಿಗಳಿಗಿಂತ ಧ್ಯಾನಯೋಗಿ ಶ್ರೇಷ್ಠ. ತಿಳಿದವರಿಗಿಂತಲೂ ಧ್ಯಾನಿ ಶ್ರೇಷ್ಠ.
    ಕರ್ಮಯೋಗಿಗಳಿಗಿಂತಲೂ ಧ್ಯಾನಸಾಧಕ ಶ್ರೇಷ್ಠನೇ. ಆದ್ದರಿಂದ, ಓ ಅರ್ಜುನ ಧ್ಯಾನಯೋಗಿ ಆಗು.

47: >-
    ಶ್ರದ್ಧೆಯಿಂದ ನನ್ನಲ್ಲೆ ಮನಸ್ಸಿಟ್ಟು ಯಾರು ನನ್ನನ್ನೆ ಸೇವಿಸುವನೋ ಅವನು ಇತರ ಎಲ್ಲ ಬಗೆಯ
    ಯೋಗಿಗಳಲ್ಲಿ ಶ್ರೇಷ್ಠಯೋಗಿ ಎಂದೇ ನನ್ನ ಮತ.
    
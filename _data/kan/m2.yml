1: >-
    ಹೀಗೆ ಕರುಣೆಗೆ ಒಳಗಾಗಿ ಕಣ್ಣೀರು ತುಂಬಿ ಕಣ್ಣು ಮಸುಕಾಗಿ, ದುಃಖದಿಂದ ಕೂತಿರುವ
    ಅರ್ಜುನನಿಗೆ ಕೃಷ್ಣನು ಹೇಳುತ್ತಾನೆ-

2: >-
    ಓ ಅರ್ಜುನಾ, ಅಪಕೀರ್ತಿ ಕೊಡುವ, ಸ್ವರ್ಗ ತಪ್ಪುವ, ತಿಳಿದವರು ಒಪ್ಪದ ಈ ತಪ್ಪುಕಲ್ಪನೆ
    ಈ ಯುದ್ಧಕಾಲದಲ್ಲಿ ನಿನ್ನನ್ನು ಏಕೆ ಕಾಡಿತು?

3: >-
    ಪೃಥೆಯ ಮಗನೇ, ಷಂಡತನವನ್ನು ಹೊಂದಬೇಡ. ನಿನ್ನಲ್ಲಿ ಇದು ಸೇರುವುದಿಲ್ಲ. ಶತ್ರುಸಂಹಾರಕನೇ,
    ಈ ಅತಿ ಕ್ಷುಲ್ಲಕ ಮಾನಸಿಕ ತುಮುಲವನ್ನು ಬಿಟ್ಟು ಎದ್ದು ನಿಲ್ಲು.

4: >-
    ಅರ್ಜುನನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ - ಓ ಮಧುಸೂದನನೇ, ಯುದ್ಧದಲ್ಲಿ ಭೀಷ್ಮನನ್ನು ಮತ್ತೆ
    ದ್ರೋಣನನ್ನು ನಾನು ಹೇಗೆ ಬಾಣಗಳಿಂದ ಚುಚ್ಚಲಿ? ಅರಿಸೂದನನೇ, ಅವರು ಗೌರವಕ್ಕೆ ಪಾತ್ರರಲ್ಲವೇ ?

5: >-
    ಜ್ಞಾನಿಗಳಾದ ಗುರುಗಳನ್ನು ಕೊಲ್ಲದೇ ಈ ನೆಲದಲ್ಲಿ ಭಿಕ್ಷೆ ಬೇಡಿ ತಿನ್ನುವುದು ಒಳ್ಳೆಯದು ತಾನೆ!
    ರಾಜ್ಯಸಂಪತ್ತು ಬಯಸಿದ ಈ ಗುರುಗಳನ್ನೇ ಕೊಂದು ರಕ್ತಸಿಕ್ತವಾದ ಭೋಗವನ್ನು ಉಣ್ಣಬೇಕಾ !

6: >-
    ಇವೆರಡರಲ್ಲಿ ಯಾವುದು ನಮಗೆ ಹೆಚ್ಚು ಎಂದೇ ಗೊತ್ತಾಗುತ್ತಿಲ್ಲ. ನಾವು ಗೆಲ್ಲುವೆವೋ ಅಥವಾ
    ನಮ್ಮನ್ನು ಗೆಲ್ಲುವರೋ ಎಂದೂ ತಿಳಿಯದು! ಯಾರನ್ನು ಕೊಂದು ಬದುಕಲು ಬಯಸುವುದಿಲ್ಲವೋ
    ಅವರೇ ಕೌರವರು ನಮ್ಮೆದುರು ಹೋರಾಟಕ್ಕೆ ತಯಾರಾಗಿದ್ದಾರೆ.

7: >-
    ನನ್ನದೇ ದೌರ್ಬಲ್ಯದ ದೋಷ ನನ್ನತನವನ್ನು ಮುಚ್ಚಿದೆ. ಧರ್ಮ ಯಾವುದೆಂದು ತೀರ್ಮಾನಿಸಲಾಗದೆ
    ನಿನ್ನನ್ನೇ ಪ್ರಶ್ನಿಸುತ್ತಿರುವೆನು. ಯಾವುದು ನನಗೆ ಒಳಿತೆಂದು ಸಂಶಯ ಹೋಗುವಂತೆ ಹೇಳು.
    ನಾನು ನಿನ್ನ ಶಿಷ್ಯ, ನಿನ್ನನ್ನೆ ಶರಣಾದ ನನ್ನನ್ನು ತಿದ್ದು.

8: >-
    ಈ ನೆಲದಲ್ಲಿ ವೈರಿಗಳೆ ಇಲ್ಲದ ಸಮೃದ್ಧವಾದ ರಾಜ್ಯ ಸಿಕ್ಕರೂ ಮತ್ತೆ ಸ್ವರ್ಗದ ದೊರೆತನ ದಕ್ಕಿದರೂ
    ನನಗೆ ಇಂದ್ರಿಯಗಳ ಹಿಂಡುವ ಈ ದುಃಖ ಹೇಗೆ ಕಳೆದೀತು ಎಂದೇ ತಿಳಿಯದಾಗಿದೆ.

9: >-
    ಶತ್ರುಗಳ ತರಿವ ಅರ್ಜುನನು ಇಂದ್ರಿಯಗಳ ಸ್ವಾಮಿಯಾದ ಗೋವಿಂದನಲ್ಲಿ ಹೀಗೆ ಹೇಳಿ,
    ನಾನು ಯುದ್ಧ ಮಾಡುವುದಿಲ್ಲ ಎಂದು ತಿಳಿಸಿ ಸುಮ್ಮನೆ ಇದ್ದನು.

10: >-
    ಓ ಧೃತರಾಷ್ಟ್ರನೇ, ಎರಡು ಸೈನ್ಯದ ನಡುವೆ ದುಃಖಗೊಂಡು ಕೂತ ಅರ್ಜುನನಿಗೆ ಕೃಷ್ಣನು
    ನಗುತ್ತಲೇ ಹೀಗೆ ಹೇಳಿದನು -

11: >-
    ನೀನು ದುಃಖ ಪಡಬಾರದವರಿಗಾಗಿ ದುಃಖಿಸುತ್ತಿರುವೆ. ತಿಳಿದವರು ಆಡದ ಮಾತುಗಳನ್ನು ಹೇಳುತ್ತಿರುವೆ.
    ತಿಳಿದವರಾರೂ ಸತ್ತವರ ಬಗ್ಗೆ ಮತ್ತು ಸಾಯದವರ ಬಗ್ಗೆ ದುಃಖಿಸುವುದಿಲ್ಲ.

12: >-
    ನಾನು, ನೀನು, ಮತ್ತೆ ಈ ರಾಜರೂ ಹಿಂದೆ ಇದ್ದವರೆ. ಮುಂದೆಯೂ ನಾವೆಲ್ಲರೂ ಎಂದೂ ಇರುವವರೇ.

13: >-
    ದೇಹದಲ್ಲಿರುವ ಜೀವನಿಗೆ ಈ ದೇಹದಲ್ಲಿ ಕೌಮಾರ ಕಳೆದು ಯೌವ್ವನ ಬರಲಿದೆ, ಬಳಿಕ ಮುಪ್ಪು.
    ಹಾಗೆಯೇ ಮತ್ತೆ ಬೇರೆ ದೇಹ ಬರಲಿದೆ. ಈ ಬದಲಾವಣೆ ವಿಷಯದಲ್ಲಿ ತಿಳಿದವನು ಮೋಹಗೊಳ್ಳನು.

14: >-
    ಓ ಕುಂತಿಪುತ್ರನೇ, ಶಬ್ದ-ಸ್ಪರ್ಶ-ರೂಪ-ರಸ-ಗಂಧಗಳು ಎಂಬ ಐದು ವಿಷಯಗಳ ಸಂಪರ್ಕಗಳೇ
    ತಂಪು-ಬಿಸಿಗಳಿಗೆ, ಸುಖ-ದುಃಖಗಳಿಗೆ ಕಾರಣಗಳು. ಇವು ಬರುತ್ತವೆ, ಹೋಗುತ್ತವೆ. ನಿರಂತರವಾಗಿ
    ಇರವು. ಓ ಭರತವಂಶದವನೇ, ಅವುಗಳನ್ನು ಸಹಿಸಿಕೋ.

15: >-
    ಓ ಪುರುಷಶ್ರೇಷ್ಠನೇ, ಯಾವ ವ್ಯಕ್ತಿ ಧೀರನಾಗಿ ಸುಖ-ದುಃಖಗಳನ್ನು ಸಮವಾಗಿ ಅನುಭವಿಸುತ್ತಾನೋ,
    ಆತನನ್ನು ಈ ವಿಷಯಗಳು ವ್ಯಥೆಪಡಿಸುವುದಿಲ್ಲ. ಆತ ಸಾವನ್ನು ಗೆಲ್ಲುತ್ತಾನೆ.

16: >-
    ಅಸತ್ (ಇಲ್ಲದ) ವಸ್ತುವಿಗೆ ಎಂದೂ ಇರುವಿಕೆ ಇಲ್ಲ. ಸತ್ (ಇರುವ) ವಸ್ತು ಯಾವುದೂ ಎಂದೂ ಇಲ್ಲವಾಗದು.
    ವಸ್ತುವಿನ ನೈಜತೆಯನ್ನು ಅರಿತವರು ಈ ಎರಡೂ ಸಂಗತಿಗಳ ನಿಶ್ಚಯ ಕಂಡವರು.

17: >-
    ಇದೆಲ್ಲವನ್ನು ತುಂಬಿ ಮೀರಿ ನಿಂತವನು ನಾಶವಿಲ್ಲದವನು. ಯಾವುದೇ ವಿಕಾರಕ್ಕೂ ಬಗ್ಗದ ದೇವನ
    ನಾಶವನ್ನು ಯಾರಿಂದಲೂ ಮಾಡಲಾಗದು.

18: >-
    ದೇಹ ಹೊತ್ತ ಈ ಜೀವನ ಈ ದೇಹಗಳೆಲ್ಲ ನಾಶವಾಗುವವುಗಳೆ ಆಗಿವೆ. ಓ ಭಾರತನೆ, ಹಾಗಾಗಿ ಯಾವ
    ಬಗೆಯ ನಾಶವೇ ಇಲ್ಲದ ದೇವರ ಸೇವೆಯೆಂದು ಯುದ್ಧಮಾಡು.

19: >-
    ಈತ ಕೊಂದವನೆಂದು, ಮತ್ತೆ ಈತ ಸತ್ತವನೆಂದು ತಿಳಿದವರಿಬ್ಬರೂ ಚೆನ್ನಾಗಿ ತಿಳಿದಿಲ್ಲ. ಇವನು
    ಕೊಲ್ಲುವುದೂ ಇಲ್ಲ, ಇವನು ಸಾಯುವುದೂ ಇಲ್ಲ.

20: >-
    ಈ ಜೀವ ಎಂದೂ ಹುಟ್ಟುವುದಿಲ್ಲ, ಸಾಯುವುದೂ ಇಲ್ಲ. ಈತ ಹಿಂದೆ ಇಲ್ಲದವನಾಗಿ, ಮುಂದೆ ಬಂದವನೆಂಬುದೂ
    ಸರಿಯಿಲ್ಲ. ಈ ಜೀವನಿಗೆ ಹುಟ್ಟಿಲ್ಲ, ಸಾವಿಲ್ಲ, ವಿಕಾರವಿಲ.್ಲ ದೇಹದಿಂದ ದೇಹಕ್ಕೆ
    ಪಯಣಿಸುವವನು. ದೇಹಕ್ಕೆ ಹೊಡೆದರೂ ಜೀವ ಸಾಯನು.

21: >-
    ಓ ಪಾರ್ಥ, ಯಾರು ಈ ಜೀವನನ್ನು ಹುಟ್ಟು, ಸಾವು, ವಿಕಾರಗಳಿಲ್ಲದ ನಿತ್ಯನನ್ನಾಗಿ ತಿಳಿದಿದ್ದಾನೋ
    ಆ ವ್ಯಕ್ತಿ ಯಾರನ್ನು ಹೇಗೆ ಕೊಲ್ಲುವನು? ಯಾರನ್ನು ಹೇಗೆ ಕೊಲ್ಲಿಸುವನು?

22: >-
    ಮನುಷ್ಯನು ಹಳೆಯ ಬಟ್ಟೆಗಳನ್ನು ತೊರೆದು ಬೇರೆ ಹೊಸ ಬಟ್ಟೆಗಳನ್ನು ಉಡುತ್ತಾನೆ.
    ಅದರಂತೆ ಜೀವನು ಹಳತಾದ ದೇಹಗಳನ್ನು ಬಿಟ್ಟು ಬೇರೆ ಹೊಸ ದೇಹಗಳನ್ನು ಸೇರುತ್ತಾನೆ.

23: >-
    ಈ ಜೀವನನ್ನು ಆಯುಧಗಳು ತುಂಡರಿಸವು, ಬೆಂಕಿ ಸುಡದು, ನೀರು ತೋಯಿಸದು,
    ಗಾಳಿ ಒಣಗಿಸದು.

24: >-
    ಕಡಿಯಲಾಗದ, ಸುಡಲಾಗದ, ತೋಯಿಸಲಾಗದ, ಒಣಗಿಸಲಾಗದ ಇವನು ಜೀವನು ನಿತ್ಯನೂ,
    ನಿರ್ವಿಕಾರನೂ, ವೇದಶಾಸನಕ್ಕೆ ಬದ್ಧನೂ ಆಗಿದ್ದಾನೆ. ಎಲ್ಲೆಡೆ ಇರುವ ದೇವನ
    ಪ್ರತಿಬಿಂಬನಿವನು ಜೀವನು ಅಣುವಾಗಿದ್ದಾನೆ.

25: >-
    ಕಣ್ಣಿಗೆ ಕಾಣಿಸದ, ಚಿಂತನೆಗೆ ಸಿಗದ, ವಿಕಾರವಿಲ್ಲದವನು ಇವನು ಎಂದು ಶಾಸ್ತ್ರ ತಿಳಿಸಿದೆ.
    ಹಾಗಾಗಿ ಹೀಗೆಯೇ ಆತನನ್ನು ನೀನು ತಿಳಿದರೆ ಜೀವನ ಬಗ್ಗೆ ದುಃಖಿಸಬೇಕಾಗಿಲ್ಲ.

26: >-
    ಓ ಆಜಾನುಬಾಹು ಅರ್ಜುನನೇ, ಈ ಜೀವ ದೇಹದಿಂದ ಹುಟ್ಟುತ್ತಾನೆ ಮತ್ತೆ ಸಾಯುತ್ತಾನೆ
    ಎಂದು ತಿಳಿದರೂ ಈ ಜೀವನ ಬಗ್ಗೆ ನೀನು ದುಃಖಿಸುವುದು ತರವಲ್ಲ.

27: >-
    ಹುಟ್ಟಿದವನಿಗೆ ಸಾವು ನಿಶ್ಚಿತ. ಸತ್ತವಗೆ ಹುಟ್ಟೂ ನಿಶ್ಚಿತ. ಹೀಗಿದ್ದಾಗ ಪರಿಹರಿಸಲು
    ಆಗದ ಈ ವಿಷಯದಲ್ಲಿ ನೀನು ದುಃಖಗೊಳ್ಳುವುದು ಸರಿಯಿಲ್ಲ.

28: >-
    ಓ ಭಾರತನೆ, ಜೀವಿಗಳ ಹುಟ್ಟು ಕಾಣದು, ಸಾವೂ ಕಾಣದು. ಹುಟ್ಟು-ಸಾವುಗಳ ಮಧ್ಯ ಮಾತ್ರ
    ವ್ಯಕ್ತವಾಗಿದೆ. ಹೀಗಿರುವಾಗ ಈ ಪರಿಯ ಗೋಳಾಟವೇನು?

29: >-
    ಯಾರಾದರೂ ಈ ಜೀವನನ್ನು ಕಂಡರೆ ಅಚ್ಚರಿಯಂತೆ! ಇನ್ನೊಬ್ಬ ಜೀವನನ್ನು ಹೀಗಂತ ಹೇಳಿದರೂ
    ಅಚ್ಚರಿಯೆ! ಮತ್ತೊಬ್ಬ ಆತನನ್ನು ಕೇಳಿಕೊಂಡರೂ ಆಶ್ಚರ್ಯವೇ ಸರಿ. ಇವನನ್ನು ಕೇಳಿದರೂ
    ಯಾರೊಬ್ಬನೂ ಏನೊಂದೂ ತಿಳಿಯಲಾರ.

30: >-
    ಓ ಭಾರತ, ಈ ದೇಹದೊಳಗಿನ ಜೀವ ಎಂದಿಗೂ ಯಾರಿಗೂ ಕೊಲ್ಲಲಾಗದ್ದು. ಆದ್ದರಿಂದ ಎಲ್ಲ
    ಜೀವಿಗಳ ಬಗೆಗೂ ನೀನು ದುಃಖಿಸುವಂತಿಲ್ಲ.

31: >-
    ನಿನ್ನ ಧರ್ಮ ಕ್ಷಾತ್ರವೆಂದು ನೆನೆದುಕೊಂಡರೂ ನೀನು ಗೊಂದಲಪಡಲಾರೆ. ಕ್ಷತ್ರಿಯನಿಗೆ
    ಧರ್ಮಕ್ಕಾಗಿ ಹೋರಾಟಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಒಳಿತು ಬೇರೆ ಕರ್ಮದಿಂದ ಇಲ್ಲ.

32: >-
    ದೈವೇಚ್ಛೆಯಿಂದ ಈ ಯುದ್ಧಕರ್ಮ ಬಂದೊದಗಿದೆ. ಸ್ವರ್ಗದ ಬಾಗಿಲು ತೆರೆದಿದೆ.
    ಓ ಪಾರ್ಥನೆ, ದುಃಖಪಡದ ಕ್ಷತ್ರಿಯರು ಇಂಥ ಯುದ್ಧವನ್ನು ಎದುರಿಸುತ್ತಾರೆ.

33: >-
    ಒಂದೊಮ್ಮೆ ನೀನು ಈ ಧರ್ಮಯುದ್ಧವನ್ನು ಮಾಡದಿದ್ದರೆ ಸ್ವಧರ್ಮ ಬಿಟ್ಟವನೆಂಬ ಅಪಕೀರ್ತಿ
    ಪಡೆವೆ, ಸ್ವಧರ್ಮ ತೊರೆದ ಪಾಪವನ್ನೂ ಪಡೆವೆ.

34: >-
    ನಿನ್ನ ಬಗ್ಗೆ ಜನರು ಆಡುವ ನಿಂದೆಯ ಮಾತೂ ಮುಗಿಯದು. ಸಮಾಜದಲ್ಲಿ ಒಳ್ಳೆಯವನೆಂದು
    ಪ್ರಸಿದ್ಧನಾದವನಿಗೆ ನಿಂದೆ ಸಾವಿಗಿಂತ ಮಿಗಿಲು.

35: >-
    ಯುದ್ಧಕ್ಕೆ ಹೆದರಿ ಹಿಂದೆ ಹೋದನೆಂದು ನಿನ್ನನ್ನು ಮಹಾರಥರು ನಂಬುತ್ತಾರೆ.
    ಈ ಮೊದಲು ಯಾರಿಗೆಲ್ಲ ನೀನು ದೊಡ್ಡವನೆನಿಸಿ ಗೌರವಕ್ಕೆ ಪಾತ್ರನಾಗಿದ್ದೀಯೊ,
    ಅವರಿಗೆ ಈಗ ನೀನು ಏನೂ ಅಲ್ಲದ ಸಣ್ಣವನಾಗುತ್ತೀಯ.

36: >-
    ನಿನ್ನ ವೈರಿಗಳು ನಿನ್ನ ಬಲವನ್ನು ಹೀಯಾಳಿಸುತ್ತ ನಿನ್ನ ಬಗ್ಗೆ ಬಹಳ ಕೆಟ್ಟ ಪದಗಳನ್ನು
    ಹೇಳುತ್ತಲೇ ಇರುತ್ತಾರೆ. ಇದಕ್ಕಿಂತ ಬೇರೆ ದುಃಖದ ಸಂಗತಿ ಏನಿದೆ?

37: >-
    ಸತ್ತರೆ ಸ್ವರ್ಗ ಪಡೆವೆ, ಗೆದ್ದರೆ ನೆಲವನ್ನು ಆಳುವೆ. ಹಾಗಾಗಿ ಓ ಕೌಂತೇಯನೇ,
    ಯುದ್ಧಮಾಡುವೆನೆಂದು ನಿಶ್ಚೈಸಿ ಎದ್ದುನಿಲ್ಲು.

38: >-
    ಸುಖ-ದುಃಖಗಳನ್ನು, ಲಾಭ-ನಷ್ಟಗಳನ್ನು, ಗೇಲು-ಸೋಲುಗಳನ್ನು ಸಮವಾಗಿಸಿಕೊಂಡು ಮತ್ತೆ
    ಯುದ್ಧಕ್ಕೆ ಸಿದ್ಧನಾಗು, ಹೀಗಾದರೆ ಪಾಪವನ್ನು ಹೊಂದಲಾರೆ.

39: >-
    ಪಾರ್ಥನೆ, ಜ್ಞಾನದ ವಿಷಯದಲ್ಲಿ ನಿನಗೆ ಹೀಗೆ ಬುದ್ಧಿ ಹೇಳಿದೆ. ಅದನ್ನು ಪ್ರಾಯೋಗಿಕವಾಗಿ
    ಹೇಗೆ ಎನ್ನುವುದನ್ನು ಈಗ ಕೇಳು. ಕೇಳಿ, ತಿಳಿದದ್ದರಿಂದ ಕರ್ಮದ ಗಂಟನ್ನು ಬಿಚ್ಚಿಕೊಳ್ಳಬಲ್ಲೆ.

40: >-
    ಇಲ್ಲಿ ಆರಂಭ ಮಾತ್ರ ಮಾಡಿದರೂ ನಿಂತು ಹೋಗದು, ದೋಷ ಬರದು. ಶಾಸ್ತ್ರ ಹೇಳಿದ ಈ ಧರ್ಮವನ್ನು
    ಅತಿಕಡಿಮೆ ನಡೆಸಿದರೂ ದೊಡ್ಡ ಆಪತ್ತಿನಿಂದ ರಕ್ಷಣೆ ಇದೆ.

41: >-
    ಕುರುಕುಮಾರನೇ, ಶಾಸ್ತ್ರ ಕೇಳಿ ಕಲಿತು ದೃಢವಾದ ಬುದ್ಧಿ ಒಂದೇ ರೀತಿಯದ್ದು.
    ಕೇಳಿ-ಕಲಿಯದವರ ಬುದ್ಧಿ ಹಲವು ರೀತಿಯದ್ದು, ಬುಡ-ಕೊನೆಯಿಲ್ಲದ್ದು.

43: >-
    ಓ ಪಾರ್ಥನೇ, ಅರ್ಥವನ್ನು ತಿಳಿಯದೆ ಬರಿಯ ವೇದದ ಸೊಲ್ಲಿನಲ್ಲಷ್ಟೇ ಗಟ್ಟಿಯಾದವರು
    ದಡ್ಡರಿವರು, ಕೆಟ್ಟ ಕಾಮನೆಗಳಿಗೆ ಒಳಗಾಗಿ ಸ್ವರ್ಗವೇ ಮುಖ್ಯ ಎನ್ನುವವರು. ಭೋಗ-ಭಾಗ್ಯಕ್ಕಾಗಿ,
    ಒಡೆತನಕ್ಕಾಗಿ ಬಗೆ-ಬಗೆಯ ಬಹಳ ಕರ್ಮಗಳನ್ನು ವೇದ ಹೇಳಿದೆ ಎನ್ನುವರು. ಕರ್ಮದ ಫಲವಾಗಿ
    ಮತ್ತೆ ಮತ್ತೆ ಹುಟ್ಟು ಕೊಡಲಿದೆ ಎನ್ನುವ (ಅರಳಿ ಉದುರುವ) ಹೂವಿನಂಥ ಮಾತನ್ನು ಹೇಳುತ್ತಾರೆ.

44: >-
    ಔತಣ-ಒಡೆತನ ಇದರಲ್ಲೆ ಮುಳುಗಿದವರಿಗೆ ವೇದದ ಈ ಚೌಕಟ್ಟಿನಲ್ಲೆ ತಲೆ ಓಡಿಸಿದವರಿಗೆ
    ಕೇಳಿ-ಕಲಿತ ಬುದ್ಧಿಮಾತು ಸಮಾಧಾನವನ್ನು ಕೊಡದು.

45: >-
    ವೇದಗಳು ಹೊರನೋಟಕ್ಕೆ ತ್ರಿಗುಣಗಳ ಸಂಬಂಧವನ್ನೆ ಹೊತ್ತಿವೆ. ಓ ಅರ್ಜುನ, ನೀನು ಗುಣತ್ರಯದ
    ಸಂಪರ್ಕದಿಂದ ದೂರನಾಗು. ದ್ವಂದ್ವಗಳಿಗೆ ವಾಲದೆ ನಿತ್ಯನಾದ ದೇವನಲ್ಲಿ ಮನಸ್ಸಿಡು. ಅವನ
    ನಿಯಮನದಲ್ಲಿ ನಿನ್ನ ಪ್ರಾಪ್ತಿಯನ್ನು ನೋಡು. ನಿನ್ನ ರಕ್ಷೆಯನ್ನು ತಿಳಿ.

46: >-
    ಬಾವಿಯಿಂದ ಏನೆಲ್ಲ ಪ್ರಯೋಜನವಾಗಲಿದೆಯೋ, ಅವೆಲ್ಲವೂ ಹರಿಯುವ ನೀರರಾಶಿಯಲ್ಲಿ ಆಗಿಯೇ ಆಗಲಿದೆ.
    ಹಾಗೆ ದೇವನನ್ನು ವೇದದಲ್ಲಿ ತಿಳಿದವನಿಗೆ ಎಲ್ಲ ಫಲಗಳೂ ದೊರಕಲಿವೆ.

47: >-
    ಕರ್ಮದಲ್ಲಿ ಮಾತ್ರವೇ ನಿನಗೆ ಹಕ್ಕು. ಕರ್ಮದಿಂದ ಉಂಟಾದ ಫಲಗಳನ್ನು ಪಡೆವಲ್ಲಿ ಎಂದಿಗೂ
    ನಿನಗೆ ಅಧಿಕಾರವಿಲ್ಲ. ಫಲವನ್ನೇ ಕಾರಣವನ್ನಾಗಿಸಿ ಕರ್ಮ ಮಾಡಬೇಡ. ಕರ್ಮ ಮಾಡದಿರುವ
    ಯೋಚನೆಯೂ ನಿನಗೆ ಬೇಡ.

48: >-
    ಓ ಧನಂಜಯನೆ, ಫಲಾಸಕ್ತಿಯನ್ನು ಬಿಟ್ಟು ಯೋಗಿಯಾಗಿ ಕೆಲಸ ಮಾಡು. ಕೆಲಸ ಆದರೂ-ಆಗದಿದ್ದರೂ
    ಒಂದೇ ರೀತಿಯಲ್ಲಿರು. ಇಂತಹ ಸಮಸ್ಥಿತಿಯೆ ಯೋಗ.

49: >-
    ಓ ಧನಂಜಯನೆ, ಬುದ್ಧಿಯೋಗಕ್ಕಿಂತ ಕರ್ಮಯೋಗ ತುಂಬಾ ಕೀಳು. ಜ್ಞಾನಯೋಗಕ್ಕೆ ಸಿದ್ಧನಾಗು.
    ಫಲವನ್ನೇ ನಂಬಿದವರ ಬಗ್ಗೆ ಮರುಗಬೇಕು.

50: >-
    ಬುದ್ಧಿಮಂತನು ಒಳಿತು-ಕೆಡುಕುಗಳನ್ನು ಇಲ್ಲೇ ಬಿಡುತ್ತಾನೆ. ಆದ್ದರಿಂದ ಬುದ್ಧಿಯೋಗಕ್ಕೆ
    ಮನಸ್ಸು ಮಾಡು. ಯೋಗ ಎಂದರೆ ತಿಳಿದು ಕರ್ಮ ಮಾಡುವ ಕಲೆ.

51: >-
    ದೇವರನ್ನು ತಿಳಿದವರು ಜ್ಞಾನಯೋಗದಿಂದಾಗಿ ಕರ್ಮದ ಫಲವನ್ನು ತೊರೆದು, ಸಂಸಾರದ
    ಹುಟ್ಟು-ಸಾವುಗಳ ಕಟ್ಟಿನಿಂದ ಬಿಡುಗಡೆಗೊಂಡು, ತೊಂದರೆಯೆ ಇಲ್ಲದ ಪದವೆನಿಸಿದ ಮೋಕ್ಷವನ್ನು
    ಪಡೆಯುತ್ತಾರೆ.

52: >-
    ಯಾವಾಗ ನಿನ್ನ ಬುದ್ಧಿಯು ಅಜ್ಞಾನದ ಕೊಳೆಯನ್ನು ಕಳೆದುಕೊಳ್ಳುವುದೋ ಆಗ ಹಿಂದೆ ಕೇಳಿದ್ದರ
    ಮತ್ತು ಮುಂದೆ ಕೇಳಲಿರುವ ಶಾಸ್ತ್ರಪಾಠದ ಪೂರ್ತಿ ಲಾಭವನ್ನು ಪಡೆಯುವೆ.

53: >-
    ಕೇಳಿದ್ದಕ್ಕೆ ವಿರೋಧಿಯಾಗಿದ್ದ ನಿನ್ನ ಬುದ್ಧಿ ಯಾವಾಗ ಚಂಚಲರಹಿತವಾಗಿ ಸ್ಥಿರವಾಗಿ
    ಸಮಾಧಿಯಲ್ಲಿ ಗಟ್ಟಿ ನಿಲ್ಲುತ್ತೋ, ಆಗ ಯೋಗವನ್ನು ಹೊಂದುವೆ.

54: >-
    ಅರ್ಜುನನ ಪ್ರಶ್ನೆ - ಓ ಕೇಶವನೆ, ಸಮಾಧಿ ಸ್ಥಿತಿಯಲ್ಲಿರುವವನ ಸ್ಥಿತಪ್ರಜ್ಞನ ಲಕ್ಷಣವೇನು?
    ಸ್ಥಿತಪ್ರಜ್ಞನ ಮಾತು-ನಡೆ-ಇರವುಗಳು ಏನೇನು?

55: >-
    ಕೃಷ್ಣನ ಉತ್ತರ - ಓ ಪಾರ್ಥನೆ, ಮನಸ್ಸಿನಲ್ಲಿನ ಬಯಕೆಗಳನ್ನೆಲ್ಲ ತೊರೆದು ಪರಮಾತ್ಮನಲ್ಲೇ
    ಮನಸ್ಸಿಟ್ಟು ಸಂತಸಪಡುವವ ಸ್ಥಿತಪ್ರಜ್ಞನೆನಿಸುತ್ತಾನೆ.

56: >-
    ನಾನಾವಿಧ ದುಃಖಗಳಲ್ಲಿ ಉದ್ವೇಗಕ್ಕೆ ಒಳಗಾಗದವ, ಸುಖಸನ್ನಿವೇಶಗಳಲ್ಲಿ ಆಸೆ ಪಡೆದವ,
    ಅತಿಯಾಸೆ-ಹೆದರಿಕೆ-ಕೋಪಗಳನ್ನು ತೊರೆದವ, ಮುನಿಯಂತೆ ಇರುವವನೇ ಸ್ಥಿತಪ್ರಜ್ಞನು -
    ಬುದ್ಧಿಸ್ಥಿತನು.

57: >-
    ಯಾವುದರಲ್ಲೂ ಹೆಚ್ಚಿನ ಸಂಬಂಧವಿಲ್ಲ, ಒಳಿತು ಆದರೂ ಹೆಚ್ಚಿಗೆ ಸಂತಸವಿಲ್ಲ, ಕೆಡುಕಾದರೂ
    ಅತಿಯಾಗಿ ವಿರೋಧವಿಲ್ಲ. ಇಂಥವನು ಸ್ಥಿತಪ್ರಜ್ಞನು-ಅರಿವು ಗಟ್ಟಿಯಾದವನು.

58: >-
    ಆಮೆ ತನ್ನ ತಲೆ, ಕೈ-ಕಾಲುಗಳನ್ನು ಒಳಗೆ ಎಳೆದುಕೊಳ್ಳುತ್ತದೆ. ಹಾಗೆ ಪ್ರಾಪಂಚಿಕ ವಿಷಯಗಳ
    ಸೆಳೆತಕ್ಕೆ ಒಳಗಾಗದೆ ತನ್ನ ಐದು ಜ್ಞಾನೇಂದ್ರಿಯಗಳನ್ನು ಒಳಗೆ ಇರಿಸಿಕೊಳ್ಳುವವನ ಪ್ರಜ್ಞೆ
    ಸ್ಥಿರವಾಗಿದೆ.

59: >-
    ದೇಹ ಹೊತ್ತವನು ಆಹಾರ ಕಡಿಮೆ ಮಾಡಿದಾಗ ವಿಷಯಗಳು ಮುತ್ತಲಾರವು. ಕಣ್ಣು-ಕಿವಿ-ಕೈಕಾಲುಗಳೆಲ್ಲ
    ಸುಮ್ಮನಾದರೂ ತಿನ್ನುವ ಸುಖಭೋಗದ ಆಸೆ ನಿಲ್ಲದು. ಇದು ಮಾತ್ರ ದೇವರನ್ನು ಕಂಡಾಗಲೇ ನಿಲ್ಲಲಿದೆ.

60: >-
    ಓ ಕೌಂತೇಯನೇ, ತಿಳಿದು ಎಷ್ಟೇ ಪ್ರಯತ್ನಿಸಿದರೂ ವ್ಯಕ್ತಿಯ ಇಂದ್ರಿಯಗಳು ಮನಸ್ಸನ್ನು
    ಕಲಡಿಸಿ ಎಲ್ಲಿಗೋ ಒಯ್ದು ಬಿಡುತ್ತವೆ.

61: >-
    ಆ ಇಂದ್ರಿಯಗಳನ್ನೆಲ್ಲ ನಿಗ್ರಹಿಸಿ ನಾನು ಸರ್ವೋತ್ತಮನು ಎಂದು ನಂಬಿ ನನ್ನಲ್ಲೆ ಮನಸ್ಸು ಇಡಬೇಕು.
    ಹೀಗೆ ಇಂದ್ರಿಯಗಳನ್ನು ಗೆದ್ದವನ ಪ್ರಜ್ಞೆ ಸ್ಥಿರವಾಗಿದೆ ಎಂದೇ ಅರ್ಥ

63: >-
    ವಿಷಯ ಪದಾರ್ಥಗಳನ್ನೇ ನೆನೆವ ವ್ಯಕ್ತಿಗೆ ಅವುಗಳಲ್ಲೆ ನಂಟು ಬೆಳೆಯುತ್ತಾ ಹೋಗುತ್ತದೆ.
    ನಂಟಿನಿಂದ ಆಸೆ ಮೂಡುತ್ತದೆ. ಆಸೆ ಕೈತಪ್ಪಿದರೆ ಕೋಪ ಏಳುತ್ತದೆ. ಕೋಪದಿಂದ ತಪ್ಪು ಯಾವುದು
    ಸರಿ ಯಾವುದು ಎಂದು ತಿಳಿಯದವನಾಗುತ್ತಾನೆ. ಇಂಥ ಅರೆಜ್ಞಾನದಿಂದ ತಪ್ಪನ್ನೇ ಸರಿಯೆಂಬ ಸರಿಯನ್ನೆ
    ತಪ್ಪೆಂಬ ಭ್ರಮೆಗೆ ಒಳಗಾಗುವನು. ಇಂಥ ಭ್ರಮೆಯು ಬುದ್ಧಿಯನ್ನು ನಾಶಮಾಡಲಿದೆ. ಹೀಗೆ
    ಬುದ್ಧಿನಾಶದಿಂದ ಎಲ್ಲವೂ ನಾಶವಾಗಲಿದೆ.

64: >-
    ಬೇಕು-ಬೇಡಗಳಿಗೆ ಬಲಿಬೀಳದಂತೆ ಇಂದ್ರಿಯಗಳನ್ನು ತನ್ನ ವಶದಲ್ಲಿಟ್ಟುಕೊಂಡವನು ಗರ್ವ ಪಡದೆ
    ಅಂಥ ಇಂದ್ರಿಯಗಳಿಂದ ವಿಷಯಗಳನ್ನು ದೇವರಿಗೊಪ್ಪಿಸಿ ಅನುಭವಿಸಿದರೆ ಆತ ನೆಮ್ಮದಿಯನ್ನು ಪಡೆಯುವನು.

65: >-
    ಈ ಬಗೆಯ ಮನಸ್ಸಿನ ನೆಮ್ಮದಿಯಿಂದ ಇವನ ಎಲ್ಲ ರೀತಿಯ ದುಃಖಗಳು ಇಲ್ಲವಾಗುತ್ತವೆ.
    ಮನಸ್ಸು ತಿಳಿಯಾದವನ ಬುದ್ಧಿ ಕೂಡಲೇ ದೇವರ ಸುತ್ತಲೇ ಸುತ್ತುತ್ತದೆ.

66: >-
    ಮನಸ್ಸನ್ನು ಬಗ್ಗಿಸದಿದ್ದರೆ ಬುದ್ಧಿ ಶುದ್ಧವಾಗದು. ಮನಸ್ಸು ಅಯೋಗ್ಯವಾದರೆ ಧ್ಯಾನವೂ ನಡೆಯದು.
    ಧ್ಯಾನವಿಲ್ಲದಿರೆ ಮೋಕ್ಷವಿಲ್ಲ. ಮೋಕ್ಷವಿಲ್ಲದಿದ್ದರೆ ಸುಖವಿಲ್ಲ.

67: >-
    ನೀರಿನಲ್ಲಿ ದೋಣಿಯನ್ನು ಗಾಳಿ ಎಲ್ಲೆಲ್ಲಿಗೋ ಎಳೆದೊಯ್ಯುತ್ತದೆ. ಹಾಗೆಯೇ ವಿಷಯಗಳನ್ನು
    ಮೆಲ್ಲುತ್ತಿರುವ ಇಂದ್ರಿಯಗಳೆಡೆಗೆ ಮನಸ್ಸು ಸಾಗಿಸಿದವನ ಪ್ರಜ್ಞೆಯೂ ದಿಕ್ಕು ತಪ್ಪಲಿದೆ.

68: >-
    ಓ ಅರ್ಜುನನೇ, ಇಂದ್ರಿಯಗಳು ಎಲ್ಲ ರೀತಿಯಿಂದಲೂ, ಇಂದ್ರಿಯಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ವಿಷಯಗಳಿಂದ
    ಸಿಲುಕದಿದ್ದರೆ ಅವನು ಸ್ಥಿತಪ್ರಜ್ಞನೆ.

69: >-
    ಎಲ್ಲ ಜೀವರು ಯಾವ ವಿಷಯದಲ್ಲಿ ಎಚ್ಚರ ತಪ್ಪಿರುವರೋ ಅಲ್ಲಿ ಇಂದ್ರಿಯಗಳನ್ನು ಗೆದ್ದವ ಎಚ್ಚರ
    ಇರುತ್ತಾನೆ. ಜೀವರು ಎಚ್ಚರವಿರುವ ಈ ಲೋಕದ ವಿಷಯದಲ್ಲಿ ದೇವರನ್ನು ಕಂಡ ಚಿಂತಕನಿಗೆ
    ಅದು ರಾತ್ರಿಯಂತೆ.

70: >-
    ನೀರುಗಳು ಎಲ್ಲೆಡೆಯಿಂದ ತುಂಬಿಕೊಳ್ಳಲು ಹರಿದು ಬಂದು ಸಮುದ್ರವನ್ನು ಧುಮುಕಿದರೂ ಸಮುದ್ರ ದಡ
    ಮೀರದೆ ಗಂಭೀರವಾಗಿ ಅಲ್ಲೇ ನಿಂತಿರುತ್ತದೆ. ಹೀಗೆಯೇ ಎಲ್ಲ ವಿಷಯಗಳು ಬಂದು ಸೇರಿದರೂ
    ಹದ್ದುಮೀರದೆ ಇರುವವನು ಮುಕ್ತಿ ಪಡೆಯುತ್ತಾನೆ. ಕೆಟ್ಟ ಬಯಕೆಯ ಬಯಸುವವ ಮುಕ್ತಿ ಪಡೆಯಲಾರ.

71: >-
    ಸಂಕಲ್ಪ-ವಿಕಲ್ಪಗಳ ತೊರೆದು ಮಮಕಾರ-ಅಹಂಕಾರವಿಲ್ಲದೆ ವಿಷಯಗಳನ್ನೆಲ್ಲ ಆಸೆ ಪಡದೆ
    ಅನುಭವಿಸುವವನು ಮುಕ್ತಿ ಪಡೆವನು.

72: >-
    ಓ ಪಾರ್ಥನೆ, ಇದು ಬ್ರಹ್ಮನನ್ನು ತಿಳಿದವರ ಲಕ್ಷಣ. ಹೀಗಾದವನು ಮತ್ತೆ ಗೊಂದಲಪಡನು.
    ಕೊನೆಯ ಕಾಲದಲ್ಲಿಯೂ ಹೀಗೆಯೇ ಇರುವವನು ಭೌತದೇಹವಿರದ ದೇವನನ್ನು ಪಡೆವನು.

1: |-
    ಭೂಯ ಏವ ಮಹಾ-ಬಾಹೋ ಶೃಣು ಮೇ ಪರಮಂ ವಚಃ ।
    ಯತ್ ತೇಽಹಂ ಪ್ರೀಯಮಾಣಾಯ ವಕ್ಷ್ಯಾಮಿ ಹಿತ-ಕಾಮ್ಯಯಾ ॥

2: |-
    ನ ಮೇ ವಿದುಃ ಸುರ-ಗಣಾಃ ಪ್ರಭವಂ ನ ಮಹರ್ಷಯಃ ।
    ಅಹಮಾದಿರ್ಹಿ ದೇವಾನಾಂ ಮಹರ್ಷೀಣಾಂ ಚ ಸರ್ವಶಃ ॥

3: |-
    ಯೋ ಮಾಮಜಮನಾದಿಂ ಚ ವೇತ್ತಿ ಲೋಕ-ಮಹೇಶ್ವರಮ್ ।
    ಅಸಮ್ಮೂಢಃ ಸ ಮರ್ತ್ಯೇಷು ಸರ್ವ-ಪಾಪೈಃ ಪ್ರಮುಚ್ಯತೇ ॥

4: |-
    ಬುದ್ಧಿರ್ಜ್ಞಾನಮಸಮ್ಮೋಹಃ ಕ್ಷಮಾ ಸತ್ಯಂ ದಮಃ ಶಮಃ ।
    ಸುಖಂ ದುಃಖಂ ಭವೋಽಭಾವೋ ಭಯಂ ಚಾಭಯಮೇವ ಚ ॥

5: |-
    ಅಹಿಂಸಾ ಸಮತಾ ತುಷ್ಟಿಃ ತಪೋ ದಾನಂ ಯಶೋಽಯಶಃ ।
    ಭವಂತಿ ಭಾವಾ ಭೂತಾನಾಂ ಮತ್ತ ಏವ ಪೃಥಗ್‌ವಿಧಾಃ ॥

6: |-
    ಮಹರ್ಷಯಃ ಸಪ್ತ ಪೂರ್ವೇ ಚತ್ವಾರೋ ಮನವಸ್ತಥಾ ।
    ಮದ್ಭಾವಾ ಮಾನಸಾ ಜಾತಾಃ ಯೇಷಾಂ ಲೋಕ ಇಮಾಃ ಪ್ರಜಾಃ ॥

7: |-
    ಏತಾಂ ವಿಭೂತಿಂ ಯೋಗಂ ಚ ಮಮ ಯೋ ವೇತ್ತಿ ತತ್ತ್ವತಃ ।
    ಸೋಽವಿ-ಕಂಪೇನ ಯೋಗೇನ ಯುಜ್ಯತೇ ನಾತ್ರ ಸಂಶಯಃ ॥

8: |-
    ಅಹಂ ಸರ್ವಸ್ಯ ಪ್ರಭವೋ ಮತ್ತಃ ಸರ್ವಂ ಪ್ರವರ್ತತೇ ।
    ಇತಿ ಮತ್ವಾ ಭಜಂತೇ ಮಾಂ ಬುಧಾ ಭಾವ-ಸಮನ್ವಿತಾಃ ॥

9: |-
    ಮಚ್ಚಿತ್ತಾ ಮದ್ಗತ-ಪ್ರಾಣಾಃ ಬೋಧಯಂತಃ ಪರಸ್ಪರಮ್ ।
    ಕಥಯಂತಶ್ಚ ಮಾಂ ನಿತ್ಯಂ ತುಷ್ಯಂತಿ ಚ ರಮಂತಿ ಚ ॥

10: |-
    ತೇಷಾಂ ಸತತ-ಯುಕ್ತಾನಾಂ ಭಜತಾಂ ಪ್ರೀತಿ-ಪೂರ್ವಕಮ್ ।
    ದದಾಮಿ ಬುದ್ಧಿ-ಯೋಗಂ ತಂ ಯೇನ ಮಾಮುಪಯಾಂತಿ ತೇ ॥

11: |-
    ತೇಷಾಮೇವಾನು-ಕಂಪಾರ್ಥಂ ಅಹಮಜ್ಞಾನ-ಜಂ ತಮಃ ।
    ನಾಶಯಾಮ್ಯಾತ್ಮ-ಭಾವಸ್ಥೋ ಜ್ಞಾನ-ದೀಪೇನ ಭಾಸ್ವತಾ ॥

12: |-
    ಪರಂ ಬ್ರಹ್ಮ ಪರಂ ಧಾಮ ಪವಿತ್ರಂ ಪರಮಂ ಭವಾನ್ ।
    ಪುರುಷಂ ಶಾಶ್ವತಂ ದಿವ್ಯಂ ಆದಿ-ದೇವಮಜಂ ವಿಭುಮ್ ॥

13: |-
    ಆಹುಸ್ತ್ವಾಮೃಷಯಃ ಸರ್ವೇ ದೇವರ್ಷಿರ್ನಾರದಸ್ತಥಾ ।
    ಅಸಿತೋ ದೇವಲೋ ವ್ಯಾಸಃ ಸ್ವಯಂ ಚೈವ ಬ್ರವೀಷಿ ಮೇ ॥

14: |-
    ಸರ್ವಮೇತದೃತಂ ಮನ್ಯೇ ಯನ್ಮಾಂ ವದಸಿ ಕೇಶವ ।
    ನಹಿ ತೇ ಭಗವನ್ ವ್ಯಕ್ತಿಂ ವಿದುರ್ದೇವಾ ನ ದಾನವಾಃ ॥

15: |-
    ಸ್ವಯಮೇವಾತ್ಮನಾಽಽತ್ಮಾನಂ ವೇತ್ಥ ತ್ವಂ ಪುರುಷೋತ್ತಮ ।
    ಭೂತ-ಭಾವನ ಭೂತೇಶ ದೇವ-ದೇವ ಜಗತ್‌ಪತೇ ॥

16: |-
    ವಕ್ತುಮರ್ಹಸ್ಯಶೇಷೇಣ ದಿವ್ಯಾ ಹ್ಯಾತ್ಮ-ವಿಭೂತಯಃ ।
    ಯಾಭಿರ್ವಿಭೂತಿಭಿರ್ಲೋಕಾನ್ ಇಮಾಂಸ್ತ್ವಂ ವ್ಯಾಪ್ಯ ತಿಷ್ಠಸಿ ॥

17: |-
    ಕಥಂ ವಿದ್ಯಾಮಹಂ ಯೋಗಿನ್ ತ್ವಾಂ ಸದಾ ಪರಿ-ಚಿಂತಯನ್ ।
    ಕೇಷು-ಕೇಷು ಚ ಭಾವೇಷು ಚಿಂತ್ಯೋಽಸಿ ಭಗವನ್ ಮಯಾ ॥

18: |-
    ವಿಸ್ತರೇಣಾತ್ಮನೋ ಯೋಗಂ ವಿಭೂತಿಂ ಚ ಜನಾರ್ದನ ।
    ಭೂಯಃ ಕಥಯ ತೃಪ್ತಿರ್ಹಿ ಶೃಣ್ವತೋ ನಾಸ್ತಿ ಮೇಽಮೃತಮ್ ॥

19: |-
    ಹಂತ ತೇ ಕಥಯಿಷ್ಯಾಮಿ ದಿವ್ಯಾ ಹ್ಯಾತ್ಮ-ವಿಭೂತಯಃ ।
    ಪ್ರಾಧಾನ್ಯತಃ ಕುರು-ಶ್ರೇಷ್ಠ ನಾಸ್ತ್ಯಂತೋ ವಿಸ್ತರಸ್ಯ ಮೇ ॥

20: |-
    ಅಹಮಾತ್ಮಾ ಗುಡಾಕೇಶ ಸರ್ವ-ಭೂತಾಶಯ-ಸ್ಥಿತಃ ।
    ಅಹಮಾದಿಶ್ಚ ಮಧ್ಯಂ ಚ ಭೂತಾನಾಮಂತ ಏವ ಚ ॥

21: |-
    ಆದಿತ್ಯಾನಾಮಹಂ ವಿಷ್ಣುಃ ಜ್ಯೋತಿಷಾಂ ರವಿರಂಶುಮಾನ್ ।
    ಮರೀಚಿರ್ಮರುತಾಮಸ್ಮಿ ನಕ್ಷತ್ರಾಣಾಮಹಂ ಶಶೀ ॥

22: |-
    ವೇದಾನಾಂ ಸಾಮ-ವೇದೋಽಸ್ಮಿ ದೇವಾನಾಮಸ್ಮಿ ವಾಸವಃ ।
    ಇಂದ್ರಿಯಾಣಾಂ ಮನಶ್ಚಾಸ್ಮಿ ಭೂತಾನಾಮಸ್ಮಿ ಚೇತನಾ ॥

23: |-
    ರುದ್ರಾಣಾಂ ಶಂಕರಶ್ಚಾಸ್ಮಿ ವಿತ್ತೇಶೋ ಯಕ್ಷ-ರಕ್ಷಸಾಮ್ ।
    ವಸೂನಾಂ ಪಾವಕಶ್ಚಾಸ್ಮಿ ಮೇರುಃ ಶಿಖರಿಣಾಮಹಮ್ ॥

24: |-
    ಪುರೋಧಸಾಂ ಚ ಮುಖ್ಯಂ ಮಾಂ ವಿದ್ಧಿ ಪಾರ್ಥ ಬೃಹಸ್ಪತಿಮ್ ।
    ಸೇನಾನೀನಾಮಹಂ ಸ್ಕಂದಃ ಸರಸಾಮಸ್ಮಿ ಸಾಗರಃ ॥

25: |-
    ಮಹರ್ಷೀಣಾಂ ಭೃಗುರಹಂ ಗಿರಾಮಸ್ಮ್ಯೈಕಮಕ್ಷರಮ್ ।
    ಯಜ್ಞಾನಾಂ ಜಪ-ಯಜ್ಞೋಽಸ್ಮಿ ಸ್ಥಾವರಾಣಾಂ ಹಿಮಾಲಯಃ ॥

26: |-
    ಅಶ್ವತ್ಥಃ ಸರ್ವ-ವೃಕ್ಷಾಣಾಂ ದೇವರ್ಷೀಣಾಂ ಚ ನಾರದಃ ।
    ಗಂಧರ್ವಾಣಾಂ ಚಿತ್ರ-ರಥಃ ಸಿದ್ಧಾನಾಂ ಕಪಿಲೋ ಮುನಿಃ ॥

27: |-
    ಉಚ್ಚೈಃಶ್ರವಸಮಶ್ವಾನಾಂ ವಿದ್ಧಿ ಮಾಮಮೃತೋದ್ಭವಮ್ ।
    ಐರಾವತಂ ಗಜೇಂದ್ರಾಣಾಂ ನರಾಣಾಂ ಚ ನರಾಧಿಪಮ್ ॥

28: |-
    ಆಯುಧಾನಾಮಹಂ ವಜ್ರಂ ಧೇನೂನಾಮಸ್ಮಿ ಕಾಮ-ಧುಕ್ ।
    ಪ್ರಜನಶ್ಚಾಸ್ಮಿ ಕಂದರ್ಪಃ ಸರ್ಪಾಣಾಮಸ್ಮಿ ವಾಸುಕಿಃ ॥

29: |-
    ಅನಂತಶ್ಚಾಸ್ಮಿ ನಾಗಾನಾಂ ವರುಣೋ ಯಾದಸಾಮಹಮ್ ।
    ಪಿತೄಣಾಮರ್ಯಮಾ ಚಾಸ್ಮಿ ಯಮಃ ಸಂಯಮತಾಮಹಮ್ ॥

30: |-
    ಪ್ರಹ್ಲಾದಶ್ಚಾಸ್ಮಿ ದೈತ್ಯಾನಾಂ ಕಾಲಃ ಕಲಯತಾಮಹಮ್ ।
    ಮೃಗಾಣಾಂ ಚ ಮೃಗೇಂದ್ರೋಽಹಂ ವೈನತೇಯಶ್ಚ ಪಕ್ಷಿಣಾಮ್ ॥

31: |-
    ಪವನಃ ಪವತಾಮಸ್ಮಿ ರಾಮಃ ಶಸ್ತ್ರ-ಭೃತಾಮಹಮ್ ।
    ಝಷಾಣಾಂ ಮಕರಶ್ಚಾಸ್ಮಿ ಸ್ರೋತಸಾಮಸ್ಮಿ ಜಾಹ್ನವೀ ॥

32: |-
    ಸರ್ಗಾಣಾಮಾದಿರಂತಶ್ಚ ಮಧ್ಯಂ ಚೈವಾಹಮರ್ಜುನ ।
    ಅಧ್ಯಾತ್ಮ-ವಿದ್ಯಾ ವಿದ್ಯಾನಾಂ ವಾದಃ ಪ್ರವದತಾಮಹಮ್ ॥

33: |-
    ಅಕ್ಷರಾಣಾಮಕಾರೋಽಸ್ಮಿ ದ್ವಂದ್ವಃ ಸಾಮಾಸಿಕಸ್ಯ ಚ ।
    ಅಹಮೇವಾಕ್ಷಯಃ ಕಾಲೋ ಧಾತಾಽಹಂ ವಿಶ್ವತೋ-ಮುಖಃ ॥

34: |-
    ಮೃತ್ಯುಃ ಸರ್ವ-ಹರಶ್ಚಾಹಂ ಉದ್ಭವಶ್ಚ ಭವಿಷ್ಯತಾಮ್ ।
    ಕೀರ್ತಿಃ ಶ್ರೀರ್ವಾಕ್ ಚ ನಾರೀಣಾಂ ಸ್ಮೃತಿರ್ಮೇಧಾ ಧೃತಿಃ ಕ್ಷಮಾ ॥

35: |-
    ಬೃಹತ್ಸಾಮ ತಥಾ ಸಾಮ್ನಾಂ ಗಾಯತ್ತ್ರೀ ಛಂದಸಾಮಹಮ್ ।
    ಮಾಸಾನಾಂ ಮಾರ್ಗ-ಶೀರ್ಷೋಽಹಂ ಋತೂನಾಂ ಕುಸುಮಾಕರಃ ॥

36: |-
    ದ್ಯೂತಂ ಛಲಯತಾಮಸ್ಮಿ ತೇಜಸ್ತೇಜಸ್ವಿನಾಮಹಮ್ ।
    ಜಯೋಽಸ್ಮಿ ವ್ಯವಸಾಯೋಽಸ್ಮಿ ಸತ್ವಂ ಸತ್ತ್ವ-ವತಾಮಹಮ್ ॥

37: |-
    ವೃಷ್ಣೀನಾಂ ವಾಸು-ದೇವೋಽಸ್ಮಿ ಪಾಂಡವಾನಾಂ ಧನಂ-ಜಯಃ ।
    ಮುನೀನಾಮಪ್ಯಹಂ ವ್ಯಾಸಃ ಕವೀನಾಮುಶನಾ ಕವಿಃ ॥

38: |-
    ದಂಡೋ ದಮಯತಾಮಸ್ಮಿ ನೀತಿರಸ್ಮಿ ಜಿಗೀಷತಾಮ್ ।
    ಮೌನಂ ಚೈವಾಸ್ಮಿ ಗುಹ್ಯಾನಾಂ ಜ್ಞಾನಂ ಜ್ಞಾನ-ವತಾಮಹಮ್ ॥

39: |-
    ಯಚ್ಚಾಪಿ ಸರ್ವ-ಭೂತಾನಾಂ ಬೀಜಂ ತದಹಮರ್ಜುನ ।
    ನ ತದಸ್ತಿ ವಿನಾ ಯತ್ ಸ್ಯಾತ್ ಮಯಾ ಭೂತಂ ಚರಾಚರಮ್ ॥

40: |-
    ನಾಂತೋಽಸ್ತಿ ಮಮ ದಿವ್ಯಾನಾಂ ವಿಭೂತೀನಾಂ ಪರಂತಪ ।
    ಏಷ ತೂದ್ದೇಶತಃ ಪ್ರೋಕ್ತೋ ವಿಭೂತೇರ್ವಿಸ್ತರೋ ಮಯಾ ॥

41: |-
    ಯದ್ಯದ್ ವಿಭೂತಿ-ಮತ್ ಸತ್ವಂ ಶ್ರೀ-ಮದೂರ್ಜಿತಮೇವ ವಾ ।
    ತತ್ತದೇವಾವ-ಗಚ್ಛ ತ್ವಂ ಮಮ ತೇಜೋಽಂಶ-ಸಂಭವಮ್ ॥

42: |-
    ಅಥವಾ ಬಹುನೈತೇನ ಕಿಂ ಜ್ಞಾತೇನ ತವಾರ್ಜುನ ।
    ವಿಷ್ಟಭ್ಯಾಹಮಿದಂ ಕೃತ್ಸ್ನಂ ಏಕಾಂಶೇನ ಸ್ಥಿತೋ ಜಗತ್ ॥

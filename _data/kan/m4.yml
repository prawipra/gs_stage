1: >-
    ನಾಶ ಹೊಂದದ ಈ ಯೋಗವಿದ್ಯೆಯನ್ನು ನಾನು ಸೂರ್ಯನಿಗೆ ಹೇಳಿದ್ದೆ. ಸೂರ್ಯ ತನ್ನ ಮಗನಾದ
    ವೈವಸ್ವತಮನುವಿಗೆ ಹೇಳಿದ್ದ. ಮನುವು ತನ್ನ ಮಗನಾದ ಇಕ್ಷ್ವಾಕುವಿಗೆ ಹೇಳಿದ.

2: >-
    ಓ ತಿಳಿದವನೆ, ಹೀಗೆ ಒಬ್ಬರಿಂದೊಬ್ಬರು ಕಲಿತುಕೊಂಡು ಬಂದ ಈ ಯೋಗವನ್ನು ಜ್ಞಾನಿಗಳಾದ
    ದೊರೆಗಳು ತಿಳಿದಿದ್ದರು. ಈಗ ಈ ಯೋಗಮಾರ್ಗವು ಬಹಳ ಕಾಲ ಕಳೆದಿದ್ದರಿಂದ ಇಲ್ಲವಾಗಿದೆ.

3: >-
    ನೀನು ನನ್ನ ಭಕ್ತ ಮತ್ತು ಗೆಳೆಯನೆಂದು ನಾನು ನಿನಗೆ ಈಗ ಅದೇ ಹಿಂದಿನ ಯೋಗವನ್ನು ಹೇಳಿದೆ.
    ಇದು ತುಂಬಾ ಗುಟ್ಟಿನ ವಿಷಯ.

4: >-
    ಅರ್ಜುನನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ - ನೀನು ಈಗ ಹುಟ್ಟಿದವನು. ಸೂರ್ಯ ಹಿಂದೆಯೆ ಹುಟ್ಟಿದ್ದಾನೆ.
    ನೀನು ಮೊದಲು ಇದನ್ನು ಹೇಳಿದ್ದೆಂದು ಹೇಗೆ ತಿಳಿಯಲಿ?

5: >-
    ಕೃಷ್ಣನು ಉತ್ತರಿಸುತ್ತಾನೆ - ಓ ಅರ್ಜುನನೇ, ನಾನು ಬಹಳ ಬಾರಿ ಅವತರಿಸಿದ್ದೇನೆ. ನಿನಗೂ
    ಬಹಳ ಜನ್ಮಗಳಾಗಿವೆ. ನಾನು ಅದೆಲ್ಲವನ್ನು ತಿಳಿದಿದ್ದೇನೆ. ನೀನು ತಿಳಿದಿಲ್ಲ.

6: >-
    ನನಗೆ ಹುಟ್ಟಿಲ್ಲ. ನನ್ನ ದೇಹಕ್ಕೆ ನಾಶವಾಗಲಿ, ವಿಕಾರವಾಗಲಿ ಇಲ್ಲ. ನಾನು ಎಲ್ಲ ಜಡ-ಜೀವಿಗಳಿಗೂ
    ದೊಡ್ಡ ದೊರೆ. ಹೀಗಿದ್ದರೂ ನಾನು ನನ್ನ ಇಚ್ಛೆಯಿಂದಲೇ ಜ್ಞಾನಸ್ವರೂಪದಿಂದ ಅವತರಿಸುವೆನು.

7: >-
    ಓ ಭಾರತನೆ, ಧರ್ಮಕ್ಕೆ ಹಾನಿ ಆದಾಗ ಮತ್ತೆ ಅಧರ್ಮ ಮೆರೆದಾಗ ನಾನು ಅವತರಿಸುತ್ತೇನೆ.

8: >-
    ಸಜ್ಜನರನ್ನು ರಕ್ಷಿಸಲು, ದುರುಳರನ್ನು ಮುಗಿಸಲು, ಧರ್ಮವನ್ನು ಗಟ್ಟಿಯಾಗಿ ನೆಲೆಗೊಳಿಸಲು
    ನಾನು ಪ್ರತಿ ಯುಗದಲ್ಲಿಯೂ ಅವತರಿಸುತ್ತೇನೆ.

9: >-
    ನನ್ನ ಈ ಬಗೆಯ ಪ್ರಶಸ್ತವಾದ ಹುಟ್ಟನ್ನು ಮತ್ತು ನನ್ನ ಲೀಲೆಗಳನ್ನು ತಪ್ಪಿಲ್ಲದೆ ತಿಳಿದವನು
    ದೇಹ ತೊರೆದ ಮೇಲೆ ಮರಳಿ ಹುಟ್ಟುವುದಿಲ್ಲ. ಓ ಅರ್ಜುನನೆ, ಅವನು ನನ್ನನ್ನೇ ಸೇರುತ್ತಾನೆ.

10: >-
    ನನ್ನನ್ನು ಸರ್ವೋತ್ತಮನೆಂದು ತಿಳಿದ ಅನೇಕರು ನನ್ನನ್ನೇ ಆಶ್ರಯಿಸಿ ಆಸೆ-ಸಿಟ್ಟು-ಅಂಜಿಕೆಗಳಿಂದ
    ದೂರರಾಗಿದ್ದಾರೆ. ಜ್ಞಾನಸಾಧನೆಯಿಂದ ಶುದ್ಧ ಮನಸ್ಕರಾಗಿ ನನ್ನನ್ನು ಸೇರಿದ್ದಾರೆ.

11: >-
    ಓ ಪಾರ್ಥನೆ, ನನ್ನನ್ನು ಯಾವ ರೀತಿಯಲ್ಲಿ ಸೇವೆಗೈಯುವರೊ ಹಾಗೆಯೇ ನಾನು ಅವರನ್ನು
    ಅನುಗ್ರಹಿಸುತ್ತೇನೆ. ಎಲ್ಲಾ ಮನುಷ್ಯರೂ ನನ್ನ ನಡೆಯನ್ನೆ ಅನುಸರಿಸುತ್ತಾರೆ.

12: >-
    ಕರ್ಮಗಳ ಫಲವನ್ನು ಬಯಸಿ ಈ ಲೋಕದಲ್ಲಿ ಬಗೆಬಗೆಯ ದೇವತೆಗಳನ್ನು ಆರಾಧಿಸುತ್ತಾರೆ.
    ನಿಶ್ಚಿತವಾಗಿಯೂ ಇಲ್ಲಿ ಕರ್ಮದಿಂದ ಫಲಪ್ರಾಪ್ತಿ ಬೇಗನೆ ಆಗುತ್ತದೆ.

13: >-
    ತ್ರಿಗುಣಗಳ ಮತ್ತು ಕರ್ಮಗಳ ವ್ಯತ್ಯಾಸದಲ್ಲಿ ನಾನು ನಾಲ್ಕು ವರ್ಣಗಳನ್ನು ಸೃಷ್ಟಿಸಿದ್ದೇನೆ.
    ನಾನು ಅದನ್ನು ಮಾಡಿದವನೆಂದು ತಿಳಿ ಮತ್ತು ನನ್ನನ್ನು ಯಾರೂ ನಿರ್ಮಿಸಿದವರು ಇಲ್ಲ. ಏಕೆಂದರೆ
    ನಾನು ವಿಕಾರವಿಲ್ಲದವನು.

14: >-
    ನನಗೆ ಕರ್ಮಗಳ ಲೇಪವಿಲ್ಲ. ನನಗೆ ಕರ್ಮಫಲದ ಆಸೆಯೂ ಇಲ್ಲ. ಹೀಗೆ ನನ್ನನ್ನು ತಿಳಿದವನು
    ಕರ್ಮದ ಬಂಧನದಲ್ಲಿ ಸಿಲುಕುವುದಿಲ್ಲ.

15: >-
    ಹೀಗೆ ತಿಳಿದೇ ಹಿಂದಿನವರು ಮೋಕ್ಷವನ್ನು ಬಯಸಿ ಕರ್ಮವನ್ನು ಮಾಡಿದ್ದರು. ಆದ್ದರಿಂದ ನೀನೂ
    ಹಿಂದಿನವರು ಮಾಡಿದ, ಹಿಂದಿನಿಂದ ಬಂದ ಕರ್ಮವನ್ನೇ ಮಾಡು.

16: >-
    ಕರ್ಮ ಯಾವುದು? ಅಕರ್ಮ ಯಾವುದು? ಎಂಬ ವಿಷಯದಲ್ಲಿ ತಿಳಿದವರೂ ಗೊಂದಲಪಡುವರು. ಆದ್ದರಿಂದ
    ಕರ್ಮ ಯಾವುದೆಂದು ನಿನಗೆ ಹೇಳುತ್ತೇನೆ. ನೀನು ತಿಳಿದರೆ ಕೆಡುಕಿನಿಂದ ಪಾರಾಗುವೆ.

17: >-
    ಕರ್ಮ (ಸ್ವ-ವಿಹಿತ-ವೃತ್ತಿ), ವಿಕರ್ಮ (ಮಾಡಬಾರದ ಕೆಲಸ) ಮತ್ತು ಅಕರ್ಮ (ಕರ್ಮತ್ಯಾಗ)
    ಈ ಮೂರನ್ನೂ ನಮ್ಮಿಂದ ತಿಳಿಯಬೇಕು. ಕರ್ಮದ ಬಗ್ಗೆ ನಿಖರವಾಗಿ ತಿಳಿಯುವುದು ತುಂಬಾ ಕಷ್ಟವೆ.

18: >-
    ತನ್ನಲ್ಲಿ ಮಾಡಿದ ಆ ಕರ್ಮಗಳನ್ನು ಸ್ವತಂತ್ರವಾಗಿ ತಾನು ಮಾಡಿದ್ದಲ್ಲ ಎಂದು ತಿಳಿದವನು,
    ಕರ್ಮಬದ್ಧನಲ್ಲವಾದರೂ ಎಲ್ಲರ ಕರ್ಮಗಳನ್ನು ದೇವರು ಮಾಡುವನೆಂದು ತಿಳಿದವನು ಮನುಷ್ಯರಲ್ಲಿ
    ಬುದ್ಧಿಮಂತನು ಎನಿಸುವನು. ಕರ್ಮಯೋಗಿ ಈತ ಎಲ್ಲ ಕರ್ಮಗಳ ಫಲವನ್ನು ಪಡೆವನು.

19: >-
    ಫಲದ ಆಸೆ ಮತ್ತು ಕರ್ಮ ಮಾಡುವ ಇಚ್ಛೆ ಇವೆರಡನ್ನು ಬಿಟ್ಟು ಎಲ್ಲ ಕರ್ಮಗಳನ್ನು ಚೆನ್ನಾಗಿ
    ನಡೆಸುವವನ ಕರ್ಮಗಳು ಅವನನ್ನು ಬಂಧಿಸುವುದಿಲ್ಲ. ಆತನ ಅರಿವು ಬೆಂಕಿಯಂತೆ ಆತನ ಕರ್ಮಗಳ
    ಲೋಪ-ದೋಷಗಳನ್ನೆಲ್ಲ ಸುಟ್ಟುಹಾಕಲಿದೆ. ಈತನನ್ನೆ ತಿಳಿದವರು ಪಂಡಿತನೆಂದು ಹೇಳುವರು.

20: >-
    ಕರ್ಮದ ಫಲದ ಅಪೇಕ್ಷೆ ಬಿಟ್ಟು ದೇವರು ನೀಡಿದ್ದರಲ್ಲಿ ತೃಪ್ತಿಪಟ್ಟು ಬೇರೆ ಯಾರ ಹಂಗೂ ಇರದೆ
    ಸ್ವಕರ್ಮವನ್ನು ಬಿಡದೆ ಮಾಡುತ್ತಿದ್ದರೂ ಆತ ಏನು ಮಾಡಿಲ್ಲದಂತೆಯೆ ಸರಿ.

21: >-
    ಗಟ್ಟಿಮನಸ್ಸು ಮಾಡಿ ಆಸೆ ತೊರೆದು, ಯಾರಿಂದಲೂ ಏನನ್ನೂ ಪಡೆಯದೆ, ತನ್ನ ದೇಹಯಾತ್ರೆಗಷ್ಟೆ
    ನಿತ್ಯಕರ್ಮವನ್ನು ಮಾಡುವವನು (ಕರ್ಮದಲ್ಲಾದ) ಪಾಪವನ್ನು ಪಡೆಯುವುದಿಲ್ಲ.

22: >-
    ದೇವರು ನೀಡಿದ್ದರಲ್ಲಿ ತೃಪ್ತಿಪಟ್ಟವನು, ಬೇಕು-ಬೇಡಗಳಲ್ಲಿ ಗೊಂದಲ ಇಲ್ಲದವನು,
    ಹೊಟ್ಟೆಕಿಚ್ಚು ಪಡದವನು, ಕಾರ್ಯ ಆಗಲಿ-ಆಗದಿರಲಿ ವಿಕಾರಗೊಳ್ಳದವನು, ಏನು ಕರ್ಮ ಮಾಡಿದರೂ
    ಕರ್ಮಬಂಧನಕ್ಕೆ ಒಳಗಾಗನು.

23: >-
    ಫಲದಾಸೆ ಬಿಟ್ಟು ದೇಹಾಭಿಮಾನವಿಲ್ಲದೆ ದೇವರ ನೆನಪಿನಲ್ಲಿ ದೇವರ ಸೇವೆಯೆಂದು ಕರ್ಮ
    ಮಾಡುವವನ ಎಲ್ಲ ಕರ್ಮ ನಾಶವಾಗಲಿದೆ (ಆತನಿಗೆ ಲೇಪವಿರದು)

24: >-
    ದೇವರ ಪ್ರತೀಕವಾದ ಬೆಂಕಿಯಲ್ಲಿ ದೇವರ ಪ್ರೇರಣೆಯಿಂದಲೇ ಹೋಮಿಸಿದ ದೇವರ ಅಧೀನವಾದ
    ಸೊತ್ತು-ಹವಿಸ್ಸೆಲ್ಲವೂ ದೇವರಿಗೇನೇ ಸಮರ್ಪಿತವಾಗಲಿದೆ. ದೇವರ ಎಚ್ಚರದಲ್ಲಿ ಮಾಡಿದ ದೇವರ
    ಸೇವಾರೂಪಕರ್ಮವೂ ದೇವರನ್ನೇ ಸೇರಲಿದೆ.

25: >-
    ಕೆಲವರು ಯೋಗಿಗಳು ದೇವರನ್ನೇ ಯಜ್ಞವೆಂದು ಅಂತರಂಗದಲ್ಲಿ ಆರಾಧನೆ ನಡೆಸುತ್ತಾರೆ. ಇತರರು
    ದೇವರ ಪ್ರತೀಕವಾಗಿ ಬೆಂಕಿಯಲ್ಲಿ ಬಾಹ್ಯದಲ್ಲಿ ಯಾಗರೂಪದಲ್ಲಿ ಆಹುತಿ ನೀಡಿ ಯಜ್ಞನಾರಾಯಣನನ್ನು
    ಉಪಾಸನೆಗೈಯುತ್ತಾರೆ.

26: >-
    ಕೆಲವರು ವಿಷಯಗಳನ್ನು ಇಂದ್ರಿಯಗಳಿಗೆ ನೀಡದವರು, ವಿಷಯಗಳೆಡೆಗೆ ಇಂದ್ರಿಯಗಳನ್ನು ಹೋಗದಂತೆ
    ನಿಯಂತ್ರಣವೆಂಬ ಬೆಂಕಿಯಲ್ಲಿ ಹೋಮಿಸುತ್ತಾರೆ. ಇನ್ನು ಕೆಲವರು ಕಿವಿ, ಕಣ್ಣು ಮುಂತಾದ
    ಇಂದ್ರಿಯಗಳನ್ನೇ ಬೆಂಕಿ ಎಂದು ಭಾವಿಸಿ, ಶಬ್ದ ರೂಪ ಮುಂತಾದ ವಿಷಯಗಳನ್ನು ಹೋಮಿಸುತ್ತಾರೆ.

27: >-
    ಮತ್ತೆ ಕೆಲವರು ಇಂದ್ರಿಯಕರ್ಮಗಳೆಲ್ಲವನ್ನೂ ಪ್ರಾಣವಾಯುವಿನ ಚೇಷ್ಟೆಗಳನ್ನೂ ಜ್ಞಾನದಿಂದ
    ಚೆನ್ನಾಗಿ ಉರಿವ ಆತ್ಮನಿಗ್ರಹದ ಯೋಗಸಾಧನೆಯೆಂಬ ಬೆಂಕಿಯಲ್ಲಿ ಹೋಮಿಸುತ್ತಾರೆ.

28: >-
    ಕೆಲವರು ಸಾಕ್ಷಾತ್ತಾಗಿಯೇ ಬೆಂಕಿಯಲ್ಲಿ ಬಗೆಬಗೆಯ ವಸ್ತುಗಳನ್ನು ಹೋಮಿಸಿ ಯಜ್ಞ ನಡೆಸುವರು.
    ವ್ರತೋಪವಾಸನಿಯಮಗಳೆ ಕೆಲವರ ಯಜ್ಞವಾಗಿದೆ. ಮತ್ತಿತರರು ಸ್ವಕರ್ಮವನ್ನೇ ಯಜ್ಞವಾಗಿಸಿದ್ದಾರೆ.
    (ಹಲವರು) ಪ್ರಯತ್ನಪಟ್ಟು ನಡೆಸುವ ಶಾಸ್ತ್ರಾಧ್ಯಯನವು ಯಜ್ಞ. ಪಾಠ-ಪ್ರವಚನವಂತು ಉತ್ತಮ
    ಯಜ್ಞ.

29: >-
    ಕೆಲವರು ಪ್ರಾಣಾಯಾಮವನ್ನು ಚೆನ್ನಾಗಿ ತಿಳಿದವರು ಪ್ರಾಣ ಮತ್ತು ಅಪಾನದ ನಡೆಯನ್ನು
    ತಡೆಹಿಡಿದು ಅಪಾನದಲ್ಲಿ ಪ್ರಾಣವನ್ನು ಹೋಮಿಸುತ್ತಾರೆ. ಹಾಗೆಯೇ ಪ್ರಾಣದಲ್ಲಿ ಅಪಾನವನ್ನು
    ಹೋಮಿಸುತ್ತಾರೆ.

30: >-
    ಕೆಲವರು ಉಪವಾಸವಿರುವವರು ಕಿರಿಯರಾದ ಇಂದ್ರಿಯೇಶರನ್ನು ಹಿರಿಯರಾದ ಇಂದ್ರಿಯೇಶರಲ್ಲಿ
    ಲಯ(ಹೋಮ)ವನ್ನು ಚಿಂತನೆ ಮಾಡುವರು. ಇವರೆಲ್ಲರೂ ಯಜ್ಞವನ್ನು ಬಲ್ಲವರು, ಯಜ್ಞದಿಂದ ಪಾಪವನ್ನು
    ಕಳೆದುಕೊಂಡವರು.

31: >-
    ಯಜ್ಞದಲ್ಲಿ ಅರ್ಪಿಸಿ ಉಳಿದದ್ದು ಅಮೃತ ಎನಿಸಿದೆ. ಆ ಯಜ್ಞಶೇಷವನ್ನು ದೇವರ ಪ್ರಸಾದವನ್ನು
    ತಿನ್ನುವವರು ಶಾಶ್ವತವಾದ ದೇವನಲ್ಲಿಗೆ ತೆರಳುತ್ತಾರೆ. ಓ ಅರ್ಜುನನೆ, ದೇವರ ಆರಾಧನೆ ಎನಿಸುವ
    ಯಜ್ಞವನ್ನು ಮಾಡದವನಿಗೆ ಈ ಲೋಕವೇ ಇಲ್ಲ, ಪರಲೋಕ ಹೇಗೆ ಸಿಗಲಿದೆ?

32: >-
    ಹೀಗೆ ಬಹಳ ರೀತಿಯ ಯಜ್ಞಗಳು ದೇವರ ಬಾಯಲ್ಲಿ ನೆಲೆಗೊಂಡಿವೆ. ಎಲ್ಲವೂ ಕರ್ಮದಿಂದಲೇ
    ಆಗುವಂಥವು ಎಂದೇ ತಿಳಿ. ಹೀಗೆ ತಿಳಿದಾಗ ಬಿಡುಗಡೆಯನ್ನು ಪಡೆಯುವೆ.

33: >-
    ಓ ಶ್ರೇಷ್ಠತಪಸ್ವಿಯೆ, ದ್ರವ್ಯಗಳ ಹೋಮಕ್ಕಿಂತ ಜ್ಞಾನಯಜ್ಞ ಶ್ರೇಷ್ಠ. ಓ ಪಾರ್ಥನೆ, ಎಲ್ಲ
    ಕರ್ಮವೂ ಜ್ಞಾನದಲ್ಲಿಯೇ ಪೂರ್ತಿ ಆಗಲಿದೆ.

34: >-
    ದಂಡಪ್ರಣಾಮಗೈದು, ಮತ್ತೆಮತ್ತೆ ಪ್ರಶ್ನೆ ಕೇಳಿ, ಗುರುಸೇವೆಯಿಂದ ಆ ಜ್ಞಾನವನ್ನು ತಿಳಿ.
    ಎಲ್ಲವನ್ನು ಸರಿಯಾಗಿ ಕಂಡವರು ಜ್ಞಾನಿಗಳು ನಿನಗೆ ಆ ತಿಳಿವನ್ನು ತಿಳಿಸಿಕೊಡುತ್ತಾರೆ

35: >-
    ಓ ಪಾಂಡವನೆ, ಹಾಗೆ ತಿಳಿದಾಗ ಮತ್ತೆ ತಪ್ಪು ಚಿಂತನೆಗಳಿಗೆ ಒಳಗಾಗುವುದಿಲ್ಲ. ಇದರಿಂದಾಗಿ
    ವ್ಯಾಪ್ತನಾದ ನನ್ನಲ್ಲಿ ಎಲ್ಲವನ್ನು ಪೂರ್ತಿಯಾಗಿ ಕಾಣಬಲ್ಲೆ.

36: >-
    ಎಲ್ಲ ಪಾಪಿಗಳಿಗಿಂತಲೂ ಹೆಚ್ಚಿನ ಪಾಪಿ ನೀನೆ ಆಗಿದ್ದರೂ, ಎಲ್ಲ ಪಾಪಗಳನ್ನೂ ಜ್ಞಾನವೆಂಬ
    ದೋಣಿಯಿಂದ ದಾಟಿಬಿಡುವೆ.

37: >-
    ಓ ಅರ್ಜುನನೆ, ಜೋರಾಗಿ ಉರಿಯುವ ಬೆಂಕಿ ಕಟ್ಟಿಗೆಗಳನ್ನೆಲ್ಲ ಸುಟ್ಟುಬಿಡುವ ಹಾಗೆ
    ಜ್ಞಾನವೆಂಬ ಬೆಂಕಿ ಕರ್ಮಗಳನ್ನೆಲ್ಲ ಸುಟ್ಟು ಭಸ್ಮ ಮಾಡುತ್ತದೆ.

38: >-
    ಈ ಲೋಕದಲ್ಲಿ ಜ್ಞಾನಕ್ಕೆ ಸರಿಯಾದ ಪವಿತ್ರವಾದ್ದು ಇನ್ನೊಂದಿಲ್ಲ. ಯೋಗಸಾಧನೆಯಿಂದ ಚೆನ್ನಾಗಿ
    ತಯಾರಾದವನು ಬಹಳ ಕಾಲದ ಬಳಿಕ ತನ್ನಲ್ಲಿಯೇ ಅಂಥ ಜ್ಞಾನವನ್ನು ಪಡೆಯುತ್ತಾನೆ.

39: >-
    ಇಂದ್ರಿಯಗಳನ್ನು ನಿಯಂತ್ರಿಸಿದವನು, ನಾನೇ ಸರ್ವೋತ್ತಮನೆಂಬ ಆಸ್ತಿಕನು ಜ್ಞಾನವನ್ನು
    ಹೊಂದುತ್ತಾನೆ. ಜ್ಞಾನವನ್ನು ಪಡೆದ ಕೂಡಲೆ ಉತ್ತಮ ಸುಖದ ಮುಕ್ತಿಯನ್ನು ಹೊಂದುವನು.

40: >-
    ತಿಳಿವು ಇಲ್ಲದವನು ನಾಸ್ತಿಕನು ಸಂಶಯ ಸ್ವಭಾವದವನು ನಾಶ ಹೊಂದುತ್ತಾನೆ. ಬುದ್ಧಿಯಲ್ಲಿ
    ಸಂಶಯವನ್ನೇ ಕೊನೆಯವರೆಗೂ ಕಟ್ಟಿಕೊಂಡವನಿಗೆ ಈ ಲೋಕವೂ ಇಲ್ಲ, ಪರಲೋಕವೂ ಇಲ್ಲ, ಸುಖವೂ ಇಲ್ಲ.

41: >-
    ಓ ಧನಂಜಯನೆ, ತಿಳಿವಿನಿಂದ ಸಂಶಯಗಳನ್ನು ಕಳೆದು, ಕರ್ಮಫಲದ ಆಸೆ ತೊರೆದು, ದೇವರ
    ಸೇವೆಯೆಂದು ಕರ್ಮಗಳನ್ನು ಮಾಡುವವನನ್ನು ಕರ್ಮಗಳು ಬಂಧಿಸುವುದಿಲ್ಲ

42: >-
    ಹೀಗಾಗಿ ಅಜ್ಞಾನದಿಂದಲೆ ಹುಟ್ಟಿಕೊಂಡ ನಿನ್ನ ಮನಸ್ಸಿನಲ್ಲಿ ನೆಲೆಸಿದ ಸಂಶಯವನ್ನು ಜ್ಞಾನ ಎಂಬ
    ಖಡ್ಗದಿಂದ ಕತ್ತರಿಸಿ ಜ್ಞಾನಯೋಗವನ್ನು ನಡೆಸು. ಓ ಭಾರತನೆ, ಎದ್ದು ನಿಲ್ಲು.

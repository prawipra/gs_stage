1: >-
    ಓ ಪಾರ್ಥನೇ, ನಾನೇ ಆಸರೆಯೆಂದು ನಂಬಿ ನನ್ನಲ್ಲೆ ಮನಸ್ಸಿಟ್ಟು ಧ್ಯಾನ ಮಾಡಿದರೆ ಖಂಡಿತವಾಗಿಯೂ
    ನನ್ನನ್ನು ಪೂರ್ತಿ ತಿಳಿಯುವೆ. ಅದು ಹೇಗೆಂದು ಕೇಳು.

2: >-
    ನಾನು ನಿನಗೆ ನನ್ನ ಜ್ಞಾನವನ್ನು ವಿಶೇಷ ಚಿಂತನೆಯೊಡನೆ ಪೂರ್ತಿ ಹೇಳುತ್ತೇನೆ. ಇದನ್ನು
    ತಿಳಿದರೆ ಮತ್ತೆ ಈ ವಿಷಯದಲ್ಲಿ ಬೇರೇನೂ ತಿಳಿಯಬೇಕಾದ್ದು ಉಳಿಯದು.

3: >-
    ಸಾವಿರಾರು ಮನುಷ್ಯರಲ್ಲಿ ಯಾರೋ ಒಬ್ಬ ಸಿದ್ಧಿಗಾಗಿ ಪ್ರಯತ್ನಿಸುತ್ತಾನೆ. ಪ್ರಯತ್ನಿಸಿದವರಲ್ಲಿ
    ಮತ್ತೆ ಸಿದ್ಧಿ ಪಡೆದವರಲ್ಲಿ ಯಾರೋ ಒಬ್ಬ ನನ್ನನ್ನು ಸರಿಯಾಗಿ ತಿಳಿಯುತ್ತಾನೆ.

4: >-
    ಮಣ್ಣು, ನೀರು, ಬೆಂಕಿ, ಗಾಳಿ, ಆಕಾಶ, ಮನಸ್ಸು, ಬುದ್ಧಿ ಮತ್ತು ಅಹಂಕಾರ - ಹೀಗೆ ನನ್ನ
    ಅಧೀನದಲ್ಲಿರುವ ಈ ಜಡಪ್ರಕೃತಿ ಎಂಟು ಬಗೆಯಾಗಿದೆ.

5: >-
    ಓ ಮಹಾವೀರನೇ, ಈ ಜಡಪ್ರಕೃತಿ ಉತ್ತಮವಲ್ಲ. ಇದಕ್ಕಿಂತ ಬೇರೆಯಾದ ನನ್ನ ಅಧೀನವಾದ ಚೇತನ
    ಪ್ರಕೃತಿ ಶ್ರೀತತ್ವ ಉತ್ತಮವಾಗಿದೆ ಎಂದು ತಿಳಿ. ಈಕೆ ಪ್ರಪಂಚವನ್ನು ಹೊತ್ತಿದ್ದಾಳೆ.

6: >-
    ಎಲ್ಲ ಜೀವಿಗಳೂ ಈ ಎರಡು ಪ್ರಕೃತಿಗಳಿಂದಲೆ ಹುಟ್ಟಿಬಂದಿವೆ ಎಂದು ತಿಳಿ. ನಾನೇ ಇಡೀ ವಿಶ್ವಕ್ಕೆ
    ಸೃಷ್ಟಿಕಾರನೂ, ನಾಶಕಾರನೂ ಆಗಿದ್ದೇನೆ.

7: >-
    ಓ ಧನಂಜಯನೆ, ನನಗಿಂತ ಹೆಚ್ಚಿನ ಬೇರೆ ವಸ್ತು ಒಂದೂ ಇಲ್ಲ. ಒಂದು ದಾರದಲ್ಲಿ ರಾಶಿ ಮಣಿಗಳು
    ಸೇರಿಕೊಂಡಂತೆ ಈ ಎಲ್ಲವೂ ನನ್ನಲ್ಲಿ ಆಸರೆ ಪಡೆದಿವೆ.

8: >-
    ಓ ಕೌಂತೇಯನೆ, ನೀರಿನಲ್ಲಿ ನಾನು ರಸ. ಚಂದ್ರ-ಸೂರ್ಯರಲ್ಲಿ ಬೆಳಕು ನಾನಾಗಿದ್ದೇನೆ. ಎಲ್ಲ
    ವೇದಗಳಲ್ಲಿ ಓಂಕಾರ ನಾನು. ಆಕಾಶದಲ್ಲಿ ಶಬ್ದ ನಾನು. ಗಂಡಸರಲ್ಲಿ ಪೌರುಷ ನಾನು.

9: >-
    ಮಣ್ಣಿನಲ್ಲಿ ಪರಿಮಳ ನಾನು. ಮತ್ತೆ ಬೆಂಕಿಯಲ್ಲಿ ತೇಜಸ್ ನಾನಾಗಿದ್ದೇನೆ. ಎಲ್ಲ ಜೀವಿಗಳಲ್ಲಿ
    ಜೀವನ ನಾನು. ತಾಪಸರಲ್ಲಿ ತಪಸ್ಸು ಆಗಿದ್ದೇನೆ.

10: >-
    ಓ ಪಾರ್ಥನೆ, ನನ್ನನ್ನು ಎಲ್ಲ ಜೀವಿಗಳ ಸನಾತನ ಬೀಜನನ್ನಾಗಿ ತಿಳಿ. ಬುದ್ಧಿಮಂತರ ಬುದ್ಧಿ
    ನಾನೆ. ತೇಜಸ್ವಿಗಳ ತೇಜಸ್ ನಾನು.

11: >-
    ತನ್ನ ಬಯಕೆಗೆ ಮತ್ತು ಇತರರ ರಂಜನೆಗೆ ಬಳಸದ ಬಲವುಳ್ಳವರ ಬಲ ನಾನು. ಓ ಭರತವಂಶದವನೆ,
    ಜೀವಿಗಳಲ್ಲಿ ಧರ್ಮಕ್ಕೆ ವಿರೋಧವಿಲ್ಲದ ಕಾಮ ಆಗಿದ್ದೇನೆ.

12: >-
    ಸತ್ವಗುಣದ, ರಜೋಗುಣದ ಮತ್ತು ತಮೋಗುಣದ ಪ್ರಭಾವಕ್ಕೆ ಒಳಗಾದ ಎಲ್ಲಾ ವಸ್ತುಗಳು ನನ್ನಿಂದಲೇ
    ಆಗಿವೆ ಎಂದು ತಿಳಿ. ನಾನು ಅವುಗಳ ಆಶ್ರಯದಲ್ಲಿಲ್ಲ. ಅವು ನನ್ನನ್ನೆ ಆಶ್ರಯಿಸಿವೆ.

13: >-
    ಈ ಮೂರು ಗುಣಗಳಿಂದ ದೂರನಾದ ವಿಕಾರಗೊಳ್ಳದ ನನ್ನನ್ನು, ಈ ಮೂರು ಗುಣಗಳುಳ್ಳ ವಸ್ತುಗಳಿಂದ
    ಮೋಹಗೊಂಡ ಈ ಎಲ್ಲ ಜೀವರಾಶಿ ತಿಳಿಯದು.

14: >-
    ಲೋಕವನ್ನು ಆಡಿಸುವ ಈ ಗುಣಮಯಿ ಮಾಯೆ ನನ್ನ ಅಧೀನವಾಗಿದೆ, ಯಾರಿಂದಲೂ ಅತಿಕ್ರಮಿಸಲು ಆಗದು.
    ನನ್ನನ್ನೇ ಶರಣು ಹೊಂದಿದವರು ಈ ಮಾಯೆಯನ್ನು ದಾಟುತ್ತಾರೆ.

15: >-
    ಕೆಟ್ಟದ್ದನ್ನು ನಡೆಸುವವರು, ತಪ್ಪು ತಿಳುವಳಿಕೆಯವರು, ಕೀಳುಮಟ್ಟದವರು, ಇಂದ್ರಿಯ
    ಸುಖಗಳನ್ನೇ ಮೆಚ್ಚುವವರು, ಮಾಯೆಯಿಂದ ಜ್ಞಾನಹೀನರಾಗಿ ನನ್ನನ್ನು ಶರಣು ಹೊಂದುವುದಿಲ್ಲ.

16: >-
    ಓ ಅರ್ಜುನನೆ, ಕಷ್ಟಕ್ಕೆ ಸಿಲುಕಿದವನು, ತಿಳಿಯಬಯಸುವವನು, ಸಂಪತ್ತು ಬೇಡುವವನು ಮತ್ತು
    ತಿಳಿದವನು ಹೀಗೆ ನಾಲ್ಕು ಬಗೆಯ ಜನರು ನನ್ನನ್ನು ಒಳ್ಳೆಯ ರೀತಿಯಿಂದ ಆರಾಧಿಸುತ್ತಾರೆ.

17: >-
    ಆ ನಾಲ್ಕು ವಿಧದ ಜನರಲ್ಲಿ ನನ್ನಲ್ಲೇ ಭಕ್ತಿಯುಳ್ಳ, ಸದಾ ನನ್ನನ್ನೇ ಧ್ಯಾನಿಸುವ ಜ್ಞಾನಿ
    ಶ್ರೇಷ್ಠನು. ಜ್ಞಾನಿಗೋ ನಾನು ತುಂಬಾ ಇಷ್ಟ. ನನಗೂ ಅವನೇ ತುಂಬ ಇಷ್ಟ.

18: >-
    ಈ ನಾಲ್ಕು ಬಗೆಯವರೂ ಒಳ್ಳೆಯವರೇ, ಆದರೆ ತಿಳಿದವನು ಮಾತ್ರ ನನ್ನವನೇ ಎಂದು ನನ್ನ ಅಭಿಪ್ರಾಯ.
    ಏಕೆಂದರೆ ಅವನು ನನ್ನನ್ನೇ ಧ್ಯಾನಿಸುತ್ತಾ ಸರಿಸಾಟಿ ಇಲ್ಲದ ಗತಿಯೆನಿಸಿದ ನನ್ನನ್ನೆ
    ಪಡೆದಿದ್ದಾನೆ.

19: >-
    ಜ್ಞಾನಿಯು ಬಹಳ ಜನ್ಮಗಳ ಬಳಿಕ ನನ್ನನ್ನು ಪಡೆಯುತ್ತಾನೆ. ಎಲ್ಲೆಡೆ ಇರುವವನು, ಪೂರ್ಣನು,
    ಎಲ್ಲದರ ಕಾರಣನು ಎಂದು ನನ್ನನ್ನು ತಿಳಿದ ಅಂಥ ಮಹಾನುಭಾವ ಸಿಗುವುದು ವಿರಳ.

20: >-
    ಬಗೆಬಗೆಯ ಆಸೆಗಳಿಂದ ಬುದ್ಧಿಹೀನರಾದವರು ತಮ್ಮ ಯೋಗ್ಯತೆಗೆ ಒಳಗಾಗಿ ಆಯಾ ಪದ್ಧತಿಗಳನ್ನು ನಂಬಿ
    ಬೇರೆ ಬೇರೆ ದೇವತೆಗಳನ್ನು ಆರಾಧಿಸುತ್ತಾರೆ.

21: >-
    ಯಾರು ಯಾರು ಯಾವ ಯಾವ ಮೂರುತಿಯನ್ನು ಭಕ್ತಿ-ಶ್ರದ್ಧೆಯಿಂದ ಪೂಜಿಸಲು ಬಯಸುತ್ತಾನೋ
    ಅವನವನಿಗೆ ಅಂಥದೇ ನಂಬಿಕೆಯ ಬುದ್ಧಿಯನ್ನು ಕದಲದಂತೆ ನಾನು ಮಾಡುತ್ತೇನೆ.

22: >-
    ಅವನು ಅದೇ ಶ್ರದ್ಧೆಯುಳ್ಳವನಾಗಿ ಆಯಾ ದೇವತೆಯ ಪೂಜೆಯನ್ನು ಮಾಡುತ್ತಾನೆ. ಮತ್ತೆ ನನ್ನಿಂದಲೆ
    ನೀಡಲ್ಪಟ್ಟ ಫಲಗಳನ್ನು ಆಯಾ ದೇವತೆಯಿಂದ ಪಡೆಯುತ್ತಾನೆ.

23: >-
    ಸಣ್ಣದೇವತೆಗಳ ಪೂಜಿಸಿದ ಅವರ ಫಲ ನಾಶವಾಗುತ್ತದೆ. ದೇವತೆಗಳ ಆರಾಧಿಸಿದವರು ದೇವತೆಗಳನ್ನು
    ಸೇರುತ್ತಾರೆ. ನನ್ನ ಭಕ್ತರೋ ನನ್ನನ್ನೇ ಸೇರುತ್ತಾರೆ.

24: >-
    ನಾನು ನಾಶವಾಗುವ ಜಡಕ್ಕಿಂತ ಬೇರೆ ಆಗಿರುವೆನು, ಜೀವರಿಗಿಂತ ಬೇರೆಯಾದ ಮಿಗಿಲಾದ
    ಚೇತನನಿದ್ದೇನೆ. ಹೀಗೆ ಜಡದೇಹ ಹೊತ್ತು ಕಾಣಿಸಿಕೊಳ್ಳುವ ಜೀವನಂತೆ, ಕಾಣಿಸಿಕೊಳ್ಳದ ನನ್ನನ್ನು
    ತಿಳಿಯದವರು, ಹುಟ್ಟಿಬಂದವನು (ಕಾಣುತ್ತಿರುವನು) ಎಂದೇ ತಿಳಿದಿದ್ದಾರೆ.

25: >-
    ನನ್ನ ಇಚ್ಛೆಯಿಂದಲೇ ನಾನು ಪ್ರಕೃತಿಯ ಮಾಯೆಯಿಂದ ಮುಚ್ಚಿಕೊಂಡು ಎಲ್ಲರಿಗೂ ಪೂರ್ತಿ ಸರಿಯಾಗಿ
    ಕಾಣಿಸಲಾರೆನು. ನನ್ನನ್ನು ತಪ್ಪಾಗಿ ತಿಳಿದ ಈ ಮಂದಿ ನನಗೆ ಹುಟ್ಟು-ಸಾವುಗಳಿಲ್ಲ ಎಂದು
    ಸರಿಯಾಗಿ ತಿಳಿದಿಲ್ಲ.

26: >-
    ಓ ಅರ್ಜುನನೆ, ನಾನು ಹಿಂದಿನ, ಇಂದಿನ ಮತ್ತು ಮುಂದಿನ ಜೀವರನ್ನು ತಿಳಿದಿದ್ದೇನೆ. ನನ್ನನ್ನು
    ಮಾತ್ರ ಯಾರೊಬ್ಬನೂ ತಿಳಿದಿಲ್ಲ.

27: >-
    ಓ ಭಾರತನೆ, ಚಿಂತನಶೀಲನೆ, ಎಲ್ಲ ಜೀವಿಗಳು ಹುಟ್ಟಿದಾಗಲೇ ಇಚ್ಛೆ-ದ್ವೇಷಗಳಿಂದಾಗಿ ಯಾವುದು ಸರಿ,
    ಯಾವುದು ತಪ್ಪು ಎಂದು ತಿಳಿಯದೆ, ತಪ್ಪನ್ನೇ ಸರಿಯೆಂದು ಭಾವಿಸುತ್ತಾರೆ.

28: >-
    ಒಳ್ಳೆಯದು ಮಾಡಿದವರ ಪಾಪ ಕಳೆದಾಗ, ಅವರು ಈ ಸರಿ-ತಪ್ಪುಗಳನ್ನು ಚೆನ್ನಾಗಿ ತಿಳಿದು, ತಪ್ಪನ್ನು
    ಮಾಡದೆ, ಸರಿಯಾದ್ದನ್ನೆ ಆಚರಿಸಿ ನನ್ನನ್ನು ಸೇವಿಸುವರು.

29: >-
    ಮುಪ್ಪು-ಸಾವುಗಳಿಂದ ದೂರವಾಗಲು ನನ್ನನ್ನೇ ನಂಬಿ ಸಾಧನೆ ನಡೆಸುವವರು ಆ ಬ್ರಹ್ಮವನ್ನು
    ತಿಳಿವರು. ಪೂರ್ತಿ ಅಧ್ಯಾತ್ಮವನ್ನೂ ಮತ್ತು ಎಲ್ಲ ಕರ್ಮವನ್ನೂ ತಿಳಿವರು.

30: >-
    ಅಧಿಭೂತ, ಅಧಿದೈವ ಮತ್ತು ಅಧಿಯಜ್ಞದ ಜೊತೆಗೆ ನನ್ನನ್ನು ತಿಳಿದವರು, ನನ್ನಲ್ಲಿ ಮನಸ್ಸಿಟ್ಟವರಾಗಿ
    ಸಾವಿನ ಹೊತ್ತಿನಲ್ಲೂ ನನ್ನನ್ನೇ ತಿಳಿಯುತ್ತಾರೆ.
    
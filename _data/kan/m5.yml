1: >-
    ಅರ್ಜುನನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ - ಓ ಕೃಷ್ಣನೇ, ಕರ್ಮಸಂನ್ಯಾಸವನ್ನು ಒಮ್ಮೆ ಶ್ರೇಷ್ಠ ಎನ್ನುವಿ,
    ಮತ್ತೊಮ್ಮೆ ಕರ್ಮಯೋಗವನ್ನು ಶ್ರೇಷ್ಠ ಎನ್ನುವಿ. ಎರಡರಲ್ಲಿ ಅತಿಶ್ರೇಷ್ಠವಾದ ಒಂದನ್ನು
    ನನಗೆ ಖಚಿತವಾಗಿ ಹೇಳು.

2: >-
    ಕೃಷ್ಣ ಉತ್ತರಿಸುತ್ತಾನೆ - ಕರ್ಮಸಂನ್ಯಾಸವು ಮತ್ತು ಕರ್ಮಯೋಗವು ಎರಡೂ ಒಳ್ಳೆಯದನ್ನು
    ಮಾಡುವವುಗಳೆ. ಅವುಗಳಲ್ಲಿ ಕರ್ಮಸಂನ್ಯಾಸಕ್ಕಿಂತ ಕರ್ಮಯೋಗವೇ ಅತಿ ಶ್ರೇಷ್ಠವಾಗಿದೆ.

3: >-
    ಕರ್ಮವನ್ನು ದ್ವೇಷಿಸದವ, ಕರ್ಮಫಲವನ್ನು ಬಯಸದವ ನಿಜವಾದ ಕರ್ಮಸಂನ್ಯಾಸಿ. ಓ ಮಹಾಬಾಹುವೆ,
    ದ್ವಂದ್ವವಿಲ್ಲದವನೆ ಸುಲಭವಾಗಿ ಕರ್ಮಬಂಧದಿಂದ ಬಿಡುಗಡೆ ಹೊಂದುತ್ತಾನೆ.

4: >-
    ಜ್ಞಾನ ಮತ್ತು ಕರ್ಮ ಬೇರೆ ಬೇರೆ ಎಂದು ಹೇಳುವವರು ಶಾಸ್ತ್ರ ಚೆನ್ನಾಗಿ ತಿಳಿಯದವರು,
    ಪಂಡಿತರಲ್ಲ. ಒಂದನ್ನು ಚೆನ್ನಾಗಿ ನಡೆಸಿದವನು ಎರಡರ ಫಲವನ್ನು ಪಡೆಯುತ್ತಾನೆ.

5: >-
    ಜ್ಞಾನಯೋಗಿಗಳು ಪಡೆವ ತಾಣವನ್ನೆ ಕರ್ಮಯೋಗಿಗಳೂ ಪಡೆಯುತ್ತಾರೆ. ಜ್ಞಾನಯೋಗವನ್ನೂ
    ಕರ್ಮಯೋಗವನ್ನೂ ಒಂದೇ ಎಂದು ತಿಳಿದವನೇ ನಿಜವಾಗಿ ತಿಳಿದವನು.

6: >-
    ಓ ಮಹಾಬಾಹುವೆ, ದೇವರ ಪೂಜೆಯೆಂದು ಕರ್ಮ ಮಾಡುವ ಬದಲು ಕರ್ಮವನ್ನೇ ಬಿಡುವುದು ನರಕವನ್ನೆ
    ಕೊಡಲಿದೆ. ಅರಿವು ಪಡೆದು ಕರ್ಮ ಮಾಡುವವ ಕೂಡಲೇ ದೇವರನ್ನು ಪಡೆಯುತ್ತಾನೆ.

7: >-
    ದೇಹಶುದ್ಧಿಯೊಡನೆ ಮನಸ್ಸನ್ನೂ ಇಂದ್ರಿಯಗಳನ್ನೂ ಗೆದ್ದವನು ಕರ್ಮಯೋಗದಲ್ಲಿ ತೊಡಗಿದರೆ,
    ಚರಾಚರ ವಿಶ್ವದ ಅಂತರ್ಯಾಮಿಯಾದ ದೇವರಲ್ಲಿ ಮನಸಿಟ್ಟು ಮಾಡಿದ ಕರ್ಮ ಅಂಟುವುದಿಲ್ಲ.

9: >-
    ಕಾಣುವಾಗ, ಕೇಳುವಾಗ, ಮುಟ್ಟುವಾಗ, ಮೂಸುವಾಗ, ತಿನ್ನುವಾಗ, ಹೋಗುವಾಗ, ಮಲಗುವಾಗ,
    ಉಸಿರು ಬಿಡುವಾಗ, ಹೇಳುವಾಗ, ಬಿಟ್ಟಾಗ, ಹಿಡಿದಾಗ, ರೆಪ್ಪೆ ಬಿಟ್ಟಾಗ-ಮುಚ್ಚಿದಾಗ ಹೀಗೆಲ್ಲ
    ಇಂದ್ರಿಯಗಳ ವಿಷಯಗಳಲ್ಲಿ ಇಂದ್ರಿಯಗಳು ತಮ್ಮ ತಮ್ಮ ಕೆಲಸಗಳನ್ನು ಮಾಡುತ್ತವೆ ಎಂದು ತಿಳಿದು
    (ಯಥಾರ್ಥವನ್ನು ತಿಳಿದವನು) ಕೆಲಸ ಮಾಡುವಾಗ ಏನನ್ನಾದರೂ ನಾನೇ ಮಾಡುತ್ತೇನೆಂದು ತಿಳಿಯಬಾರದು.

10: >-
    ಕಮಲದ ಎಲೆಯು ನೀರಿನಲ್ಲಿದ್ದರೂ ನೀರನ್ನು ಅಂಟಿಸಿಕೊಳ್ಳದಂತೆ, ಫಲದ ಆಸೆ ತೊರೆದು ಕರ್ಮ
    ಮಾಡುವವನು ಕರ್ಮಗಳನ್ನು ದೇವರಿಗೆ ಒಪ್ಪಿಸಿದಾಗ ಪಾಪಕ್ಕೆ ಅಂಟಿಕೊಳ್ಳನು.

11: >-
    ಯೋಗಿಗಳು ತಮ್ಮ ಒಳಿತಿಗಾಗಿ ಫಲದ ಆಸೆ ಬಿಟ್ಟು, ದೇಹ-ಮನಸ್-ಬುದ್ಧಿ ಮತ್ತು ಕೈ-ಬಾಯಿ
    ಮುಂತಾದ ಇಂದ್ರಿಯಗಳಿಂದ ಕರ್ಮ ಮಾಡುತ್ತಾರೆ.

12: >-
    ಕರ್ಮಫಲವನ್ನು ತೊರೆದು ಕೆಲಸ ಮಾಡುವವನು ಕೊನೆಯವರೆಗೂ ನೆಮ್ಮದಿಯಿಂದ ಇರುತ್ತಾನೆ. ಫಲದ
    ಆಸೆ ಹೊತ್ತು ಕೆಲಸ ಮಾಡಿದವ ಕರ್ಮಬಂಧನಕ್ಕೆ ಒಳಗಾಗುವನು.

13: >-
    ಮನಸಾರೆ ಫಲದ ಆಸೆ ಬಿಟ್ಟು ಇಂದ್ರಿಯಗಳನ್ನು ಗೆದ್ದವನು ಈ ಒಂಭತ್ತು ಬಾಗಿಲಿನ ದೇಹದಲ್ಲಿ
    ಏನೂ ಮಾಡದೆಯೂ ಏನನ್ನೂ ಮಾಡಿಸದೆಯೂ ಸುಖವಾಗಿ ಇರುತ್ತಾನೆ.

14: >-
    ಜೀವನು ತನ್ನ ಸ್ವಭಾವದಂತೆ ಕರ್ಮ ಮಾಡುತ್ತಾನೆ. ಜೀವನಿಗೆ ಕರ್ಮದಲ್ಲಿ, ಕರ್ಮಫಲದಲ್ಲಿ, ಕರ್ಮ
    ನಡೆಸುವಲ್ಲಿ ಸ್ವಾತಂತ್ರ‍್ಯವನ್ನು ದೇವರು ನೀಡಲಿಲ್ಲ.

15: >-
    ಯಾವ ವ್ಯಕ್ತಿಯೂ ಯಾರೊಬ್ಬನ ಕೆಟ್ಟ ಕರ್ಮವನ್ನಾಗಲಿ ಒಳ್ಳೆಯ ಕೆಲಸವನ್ನಾಗಲಿ ನಡೆಸಿಕೊಡಲಾರ.
    ಜ್ಞಾನವು ಅಜ್ಞಾನದಿಂದ ಆವರಿಸಲ್ಪಟ್ಟಿದೆ. ಇದರಿಂದ ಜನರು ಗೊಂದಲಪಡುತ್ತಾರೆ.

16: >-
    ಯಾರು ತಮ್ಮ ಅಜ್ಞಾನವನ್ನು ಜ್ಞಾನದಿಂದ ನಾಶಪಡಿಸುತ್ತಾರೋ ಅವರ ಜ್ಞಾನವು ಸೂರ್ಯನಂತೆ ಬೆಳಗಿ
    ದೇವರನ್ನು ಚೆನ್ನಾಗಿ ತಿಳಿಸುತ್ತದೆ.

17: >-
    ಬುದ್ಧಿಯಲ್ಲಿ ದೇವರನ್ನೇ ಹೊತ್ತವರು, ಅವನೇ ಸ್ವಾಮಿ ಎಂದು ನಂಬಿದವರು, ಆತನ ಧರ್ಮದಲ್ಲಿಯೆ
    ಆಸಕ್ತರು, ಅವನನ್ನೇ ಶರಣಾದವರು, ಅವನ ಎಚ್ಚರದಿಂದ ಅಜ್ಞಾನದಿಂದಾದ ಸಂಸಾರವನ್ನೇ ಕಳೆದುಕೊಂಡು
    ಮತ್ತೆ ಹುಟ್ಟಿಬಾರದ ಮೋಕ್ಷವನ್ನು ಪಡೆಯುತ್ತಾರೆ.

18: >-
    ವಿದ್ಯೆ-ವಿನಯಗಳುಳ್ಳ ಬ್ರಹ್ಮಜ್ಞಾನಿ, ದನ, ಆನೆ, ನಾಯಿ, ಕೆಟ್ಟ ಆಹಾರ ಸೇವಿಸುವವ,
    ಎಲ್ಲರಲ್ಲೂ ಒಂದೇ ರೀತಿಯಾಗಿ ದೇವರನ್ನು ತಿಳಿದವರು ಕಾಣುವರು.

19: >-
    ಒಂದೇ ರೀತಿಯಾದ ದೇವರನ್ನು ತಿಳಿದವರು ಈ ಲೋಕದಲ್ಲಿಯೆ ಸಂಸಾರದ ಹುಟ್ಟನ್ನು ಗೆದ್ದವರು. ದೇವರು
    ಒಂದೇ ರೀತಿಯಾಗಿರುವುದೆಂದರೆ ಎಲ್ಲೆಡೆಯೂ ದೋಷವಿಲ್ಲದೆ ಇರುವುದು. ಆದ್ದರಿಂದ ಈ ಸಮಭಾವವನ್ನು
    ತಿಳಿದವರು ದೇವರಲ್ಲಿ ನೆಲೆನಿಂತವರು.

20: >-
    ದೇವರಲ್ಲಿ ನೆಲೆನಿಂತವನು ದೇವರನ್ನು ತಿಳಿದವನು, ಒಳಿತನ್ನು ಪಡೆದಾಗ ಸಂಭ್ರಮಿಸಬಾರದು,
    ಕೆಟ್ಟದು ಆದಾಗ ಉದ್ವೇಗಗೊಳ್ಳಬಾರದು. ಬುದ್ಧಿ ಸ್ಥಿರವಾಗಿದ್ದು ಭಾರೀ ಗೊಂದಲಪಡಬಾರದು.

21: >-
    ಇಂದ್ರಿಯಗಳ ವಿಷಯಗಳಲ್ಲಿ ಹೊರಗೆ ಆಸಕ್ತನಾಗದವನು ಒಳಗೆ ತನ್ನಲ್ಲೆ ಸುಖವನ್ನು ಪಡೆಯುತ್ತಾನೆ.
    ದೇವರ ಎಚ್ಚರದಲ್ಲಿ ಕರ್ಮ ನಡೆಸುವ ಸಾಧಕನು ಯಾವಾಗಲೂ ಸುಖವನ್ನು ಅನುಭವಿಸುತ್ತಾನೆ.

22: >-
    ಕೌಂತೇಯನೆ, ಇಂದ್ರಿಯವಿಷಯಗಳ ಸುಖವು ದುಃಖವನ್ನೇ ಕೊಡಲಿದೆ. ಸುಖ ಆಗುತ್ತದೆ ಎಂದಾಗಲೆ
    ಮುಗಿದಿರುತ್ತದೆ. ತಿಳಿದವನು ವಿಷಯಗಳಲ್ಲಿ ಸುಖ ಹುಡುಕುವುದಿಲ್ಲ.

23: >-
    ದೇಹ ಬಿಡುವ ಮೊದಲೆ, ಆಸೆಯ ಅಲೆಯನ್ನು ಸಿಟ್ಟಿನ ಭರವನ್ನು ಇಲ್ಲಿಯೆ ತಡೆಯಬಲ್ಲವನೆ ಯೋಗಿ,
    ಸುಖವುಳ್ಳ ವ್ಯಕ್ತಿ.

24: >-
    ಒಳಗೆ ಸುಖ ಪಡೆದವನು, ದೇವರ ನೆನಪಲ್ಲಿ ಆನಂದವಾಗಿರುವವನು, ದೇವರ ಅರಿವು ತುಂಬಿದವನು
    ಯೋಗಿಯು. ಆತ ದೇವರಲ್ಲಿ ನೆಲೆಗೊಂಡವನು. ಭೌತದೇಹ ಇಲ್ಲದ ದೇವರನ್ನೇ ಸೇರುತ್ತಾನೆ.

25: >-
    ದ್ವಂದ್ವಗಳಿಗೆ ಒಳಗಾಗದವರು, ಅಜ್ಞಾನ ಕಳಕೊಂಡವರು, ದೇವರನ್ನು ತಿಳಿದವರು, ಚರಾಚರ
    ವಿಶ್ವಕ್ಕೆ ಒಳಿತನ್ನು ಬಯಸುವವರು, ಪ್ರಪಂಚಾತೀತನಾದ ದೇವರನ್ನು ಪಡೆವರು.

26: >-
    ಗಟ್ಟಿಮನಸ್ಸಿನಿಂದ ಪ್ರಯತ್ನಪಟ್ಟು ಆಸೆ-ಸಿಟ್ಟನ್ನು ಬಿಟ್ಟು ದೇವರನ್ನು ತಿಳಿದವರಿಗೆ
    ಎಲ್ಲೆಡೆಯೂ ಭೌತದೇಹವಿರದ ದೇವರೇ ಕಾಣಿಸುತ್ತಾನೆ.

28: >-
    ಇಂದ್ರಿಯಗಳಿಗೆ ಹೊರಗಿನ ವಿಷಯಗಳ ಸಂಪರ್ಕ ಆಗದಂತಿರಬೇಕು. ಹುಬ್ಬುಗಳ ನಡುವೆ ಕಣ್ಣೋಟ
    ಇರಬೇಕು. ಮೂಗಿನ ಒಳಗಿರುವ ಪ್ರಾಣ-ಅಪಾನಗಳನ್ನು (ಶ್ವಾಸೋಚ್ಛಾ್ವಸಗಳನ್ನು) ನಿಯಂತ್ರಿಸಿ
    ಕುಂಭಕದಲ್ಲಿಡಬೇಕು. ಇಂದ್ರಿಯಗಳ ಮತ್ತು ಮನಸ್ಸಿನ ವ್ಯಾಪಾರವನ್ನು ನಿಲ್ಲಿಸಬೇಕು. ಬಿಡುಗಡೆಗೆ
    ಬಯಸಿ ಧ್ಯಾನ ನಡೆಸಬೇಕು. ಆಸೆ-ಸಿಟ್ಟು-ಭಯಗಳನ್ನು ಬಿಡಬೇಕು. ಇಂಥವನು ಯಾವಾಗಲೂ
    ಮುಕ್ತನಂತೆಯೆ.

29: >-
    ಹೊರಗಿನ ಎಲ್ಲ ಬಗೆಯ ಯಜ್ಞಗಳನ್ನು, ಒಳಗಿನ ಎಲ್ಲ ತಪಸ್ಸುಗಳನ್ನು ಸ್ವೀಕರಿಸುವವನು, ಎಲ್ಲ
    ಲೋಕದ ದೊಡ್ಡ ಸ್ವಾಮಿ ನಾನು. ಎಲ್ಲರೊಳಗೂ ನಾನು ಇದ್ದೇನೆಂದು ತಿಳಿದಾಗ ಮುಕ್ತಿಯನ್ನು
    ಪಡೆಯುತ್ತಾನೆ.

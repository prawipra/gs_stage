1: |-
    ಮಯ್ಯಾಸಕ್ತ-ಮನಾಃ ಪಾರ್ಥ ಯೋಗಂ ಯುಂಜನ್ ಮದಾಶ್ರಯಃ ।
    ಅಸಂಶಯಂ ಸಮಗ್ರಂ ಮಾಂ ಯಥಾ ಜ್ಞಾಸ್ಯಸಿ ತಚ್ಛೃಣು ॥

2: |-
    ಜ್ಞಾನಂ ತೇಽಹಂ ಸ-ವಿಜ್ಞಾನಂ ಇದಂ ವಕ್ಷ್ಯಾಮ್ಯಶೇಷತಃ ।
    ಯಜಾಜ್ಞತ್ವಾ ನೇಹ ಭೂಯೋಽನ್ಯತ್ ಜ್ಞಾತವ್ಯಮವ-ಶಿಷ್ಯತೇ ॥

3: |-
    ಮನುಷ್ಯಾಣಾಂ ಸಹಸ್ರೇಷು ಕಶ್ಚಿದ್ ಯತತಿ ಸಿದ್ಧಯೇ ।
    ಯತತಾಮಪಿ ಸಿದ್ಧಾನಾಂ ಕಶ್ಚಿನ್ಮಾಂ ವೇತ್ತಿ ತತ್ತ್ವತಃ ॥

4: |-
    ಭೂಮಿರಾಪೋಽನಲೋ ವಾಯುಃ ಖಂ ಮನೋ ಬುದ್ಧಿರೇವ ಚ ।
    ಅಹಂ-ಕಾರ ಇತೀಯಂ ಮೇ ಭಿನ್ನಾ ಪ್ರಕೃತಿರಷ್ಟ-ಧಾ ॥

5: |-
    ಅಪರೇಯಮಿತಸ್ತ್ವನ್ಯಾಂ ಪ್ರಕೃತಿಂ ವಿದ್ಧಿ ಮೇ ಪರಾಮ್ ।
    ಜೀವ-ಭೂತಾಂ ಮಹಾಬಾಹೋ ಯಯೇದಂ ಧಾರ್ಯತೇ ಜಗತ್ ॥

6: |-
    ಏತದ್ಯೋನೀನಿ ಭೂತಾನಿ ಸರ್ವಾಣೀತ್ಯುಪ-ಧಾರಯ ।
    ಅಹಂ ಕೃತ್ಸ್ನಸ್ಯ ಜಗತಃ ಪ್ರಭವಃ ಪ್ರಳಯಸ್ತಥಾ ॥

7: |-
    ಮತ್ತಃ ಪರ-ತರಂ ನಾನ್ಯತ್ ಕಿಂಚಿದಸ್ತಿ ಧನಂ-ಜಯ ।
    ಮಯಿ ಸರ್ವಮಿದಂ ಪ್ರೋತಂ ಸೂತ್ರೇ ಮಣಿ-ಗಣಾ ಇವ ॥

8: |-
    ರಸೋಽಹಮಪ್ಸು ಕೌಂತೇಯ ಪ್ರಭಾಽಸ್ಮಿ ಶಶಿ-ಸೂರ್ಯಯೋಃ ।
    ಪ್ರಣವಃ ಸರ್ವ-ವೇದೇಷು ಶಬ್ದಃ ಖೇ ಪೌರುಷಂ ನೃಷು ॥

9: |-
    ಪುಣ್ಯೋ ಗಂಧಃ ಪೃಥಿವ್ಯಾಂ ಚ ತೇಜಶ್ಚಾಸ್ಮಿ ವಿಭಾವಸೌ ।
    ಜೀವನಂ ಸರ್ವ-ಭೂತೇಷು ತಪಶ್ಚಾಸ್ಮಿ ತಪಸ್ವಿಷು ॥

10: |-
    ಬೀಜಂ ಮಾಂ ಸರ್ವ-ಭೂತಾನಾಂ ವಿದ್ಧಿ ಪಾರ್ಥ ಸನಾತನಮ್ ।
    ಬುದ್ಧಿರ್ಬುದ್ಧಿ-ಮತಾಮಸ್ಮಿ ತೇಜಸ್ತೇಜಸ್ವಿನಾಮಹಮ್ ॥

11: |-
    ಬಲಂ ಬಲ-ವತಾಂ ಚಾಹಂ ಕಾಮ-ರಾಗ-ವಿವರ್ಜಿತಮ್ ।
    ಧರ್ಮಾವಿರುದ್ಧೋ ಭೂತೇಷು ಕಾಮೋಽಸ್ಮಿ ಭರತರ್ಷಭ ॥

12: |-
    ಯೇ ಚೈವ ಸಾತ್ತ್ವಿಕಾ ಭಾವಾಃ ರಾಜಸಾಸ್ತಾಮಸಾಶ್ಚ ಯೇ ।
    ಮತ್ತ ಏವೇತಿ ತಾನ್ ವಿದ್ಧಿ ನ ತ್ವಹಂ ತೇಷು ತೇ ಮಯಿ ॥

13: |-
    ತ್ರಿಭಿರ್ಗುಣ-ಮಯೈರ್ಭಾವೈಃ ಏಭಿಃ ಸರ್ವಮಿದಂ ಜಗತ್ ।
    ಮೋಹಿತಂ ನಾಭಿ-ಜಾನಾತಿ ಮಾಮೇಭ್ಯಃ ಪರಮವ್ಯಯಮ್ ॥

14: |-
    ದೈವೀ ಹ್ಯೇಷಾ ಗುಣ-ಮಯೀ ಮಮ ಮಾಯಾ ದುರತ್ಯಯಾ ।
    ಮಾಮೇವ ಯೇ ಪ್ರ-ಪದ್ಯಂತೇ ಮಾಯಾಮೇತಾಂ ತರಂತಿ ತೇ ॥

15: |-
    ನ ಮಾಂ ದುಷ್ಕೃತಿನೋ ಮೂಢಾಃ ಪ್ರ-ಪದ್ಯಂತೇ ನರಾಧಮಾಃ ।
    ಮಾಯಯಾಽಪ-ಹೃತ-ಜ್ಞಾನಾಃ ಆಸುರಂ ಭಾವಮಾಶ್ರಿತಾಃ ॥

16: |-
    ಚತುರ್ವಿಧಾ ಭಜಂತೇ ಮಾಂ ಜನಾಃ ಸು-ಕೃತಿನೋಽರ್ಜುನ ।
    ಆರ್ತೋ ಜಿಜ್ಞಾಸುರರ್ಥಾರ್ಥೀ ಜ್ಞಾನೀ ಚ ಭರತರ್ಷಭ ॥

17: |-
    ತೇಷಾಂ ಜ್ಞಾನೀ ನಿತ್ಯ-ಯುಕ್ತಃ ಏಕ-ಭಕ್ತಿರ್ವಿಶಿಷ್ಯತೇ ।
    ಪ್ರಿಯೋ ಹಿ ಜ್ಞಾನಿನೋಽತ್ಯರ್ಥಂ ಅಹಂ ಸ ಚ ಮಮ ಪ್ರಿಯಃ ॥

18: |-
    ಉದಾರಾಃ ಸರ್ವ ಏವೈತೇ ಜ್ಞಾನೀ ತ್ವಾತ್ಮೈವ ಮೇ ಮತಮ್ ।
    ಆಸ್ಥಿತಃ ಸ ಹಿ ಯುಕ್ತಾತ್ಮಾ ಮಾಮೇವಾನುತ್ತಮಾಂ ಗತಿಮ್ ॥

19: |-
    ಬಹೂನಾಂ ಜನ್ಮನಾಮಂತೇ ಜ್ಞಾನ-ವಾನ್ ಮಾಂ ಪ್ರ-ಪದ್ಯತೇ ।
    ವಾಸು-ದೇವಃ ಸರ್ವಮಿತಿ ಸ ಮಹಾತ್ಮಾ ಸು-ದುರ್ಲಭಃ ॥

20: |-
    ಕಾಮೈಸ್ತೈಸ್ತೈರ್ಹೃತ-ಜ್ಞಾನಾಃ ಪ್ರ-ಪದ್ಯಂತೇಽನ್ಯ-ದೇವತಾಃ ।
    ತಂ-ತಂ ನಿಯಮಮಾಸ್ಥಾಯ ಪ್ರಕೃತ್ಯಾ ನಿಯತಾಃ ಸ್ವಯಾ ॥

21: |-
    ಯೋ-ಯೋ ಯಾಂ-ಯಾಂ ತನುಂ ಭಕ್ತಃ ಶ್ರದ್ಧಯಾಽರ್ಚಿತುಮಿಚ್ಛತಿ ।
    ತಸ್ಯ-ತಸ್ಯಾಚಲಾಂ ಶ್ರದ್ಧಾಂ ತಾಮೇವ ವಿ-ದಧಾಮ್ಯಹಮ್ ॥

22: |-
    ಸ ತಯಾ ಶ್ರದ್ಧಯಾ ಯುಕ್ತಃ ತಸ್ಯಾಽರಾಧನಮೀಹತೇ ।
    ಲಭತೇ ಚ ತತಃ ಕಾಮಾನ್ ಮಯೈವ ವಿಹಿತಾನ್ ಹಿತಾನ್ ॥

23: |-
    ಅಂತ-ವತ್ತು ಫಲಂ ತೇಷಾಂ ತದ್ ಭವತ್ಯಲ್ಪ-ಚೇತಸಾಮ್ ।
    ದೇವಾನ್ ದೇವ-ಯಜೋ ಯಾಂತಿ ಮದ್ಭಕ್ತಾ ಯಾಂತಿ ಮಾಮಪಿ ॥

24: |-
    ಅವ್ಯಕ್ತಂ ವ್ಯಕ್ತಿಮಾಪನ್ನಂ ಮನ್ಯಂತೇ ಮಾಮಬುದ್ಧಯಃ ।
    ಪರಂ ಭಾವಮಜಾನಂತೋ ಮಮಾವ್ಯಯಮನುತ್ತಮಮ್ ॥

25: |-
    ನಾಹಂ ಪ್ರಕಾಶಃ ಸರ್ವಸ್ಯ ಯೋಗ-ಮಾಯಾ-ಸಮಾವೃತಃ ।
    ಮೂಢೋಽಯಂ ನಾಭಿ-ಜಾನಾತಿ ಲೋಕೋ ಮಾಮಜಮವ್ಯಯಮ್ ॥

26: |-
    ವೇದಾಹಂ ಸಮತೀತಾನಿ ವರ್ತಮಾನಾನಿ ಚಾರ್ಜುನ ।
    ಭವಿಷ್ಯಾಣಿ ಚ ಭೂತಾನಿ ಮಾಂ ತು ವೇದ ನ ಕಶ್ಚನ ॥

27: |-
    ಇಚ್ಛಾ-ದ್ವೇಷ-ಸಮುತ್ಥೇನ ದ್ವಂದ್ವ-ಮೋಹೇನ ಭಾರತ ।
    ಸರ್ವ-ಭೂತಾನಿ ಸಮ್ಮೋಹಂ ಸರ್ಗೇ ಯಾಂತಿ ಪರಂತಪ ॥

28: |-
    ಯೇಷಾಂ ತ್ವಂತ-ಗತಂ ಪಾಪಂ ಜನಾನಾಂ ಪುಣ್ಯ-ಕರ್ಮಣಾಮ್ ।
    ತೇ ದ್ವಂದ್ವ-ಮೋಹ-ನಿರ್ಮುಕ್ತಾಃ ಭಜಂತೇ ಮಾಂ ದೃಢ-ವ್ರತಾಃ ॥

29: |-
    ಜರಾ-ಮರಣ-ಮೋಕ್ಷಾಯ ಮಾಮಾಶ್ರಿತ್ಯ ಯತಂತಿ ಯೇ ।
    ತೇ ಬ್ರಹ್ಮ ತದ್ ವಿದುಃ ಕೃತ್ಸ್ನಂ ಅಧ್ಯಾತ್ಮಂ ಕರ್ಮ ಚಾಖಿಲಮ್ ॥

30: |-
    ಸಾಧಿ-ಭೂತಾಧಿ-ದೈವಂ ಮಾಂ ಸಾಧಿ-ಯಜ್ಞಂ ಚ ಯೇ ವಿದುಃ ।
    ಪ್ರಯಾಣ-ಕಾಲೇಽಪಿ ಚ ಮಾಂ ತೇ ವಿದುರ್ಯುಕ್ತ-ಚೇತಸಃ ॥

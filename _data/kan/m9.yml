1: >-
    ಅಸೂಯೆ ಇಲ್ಲದ ನಿನಗೆ ವಿಜ್ಞಾನದೊಡನೆ ಜ್ಞಾನವನ್ನು ಹೇಳುತ್ತೇನೆ. ಇದು ತುಂಬ ಗುಟ್ಟಿನ ವಿಷಯ.
    ಇದನ್ನು ತಿಳಿದಾಗ ಕೆಡುಕಿನಿಂದ ಬಿಡುಗಡೆ ಹೊಂದುವೆ.

2: >-
    ಇದು ದೊಡ್ಡ ವಿದ್ಯೆ, ದೊಡ್ಡ ರಹಸ್ಯ; ಪವಿತ್ರವಾದದ್ದು, ಉತ್ತಮವಾದುದು. ದೇವನ ಎಚ್ಚರ
    ನೀಡುವುದು, ವಿಶ್ವಧಾರಕನಿಗೆ ಸಂಬಂಧಿಸಿದ್ದು, ಮಾಡಲು ಸುಲಭವಾದುದು, ನಾಶವಿಲ್ಲದ್ದು.

3: >-
    ಓ ಪರಂತಪನೆ, ಈ ಧರ್ಮದಲ್ಲಿ ಶ್ರದ್ಧೆ ಇಲ್ಲದವರು ನನ್ನನ್ನು ಪಡೆಯದೆ, ಮರಣಮಯ ಸಂಸಾರದ
    ದಾರಿಯಲ್ಲಿಯೆ ಬೀಳುತ್ತಾರೆ.

4: >-
    ನಾನು ಕಾಣದ ರೂಪದಿಂದ ಈ ಜಗತ್ತನ್ನು ಪೂರ್ತಿ ತುಂಬಿದ್ದೇನೆ. ಮತ್ತು ಎಲ್ಲವೂ ಆಸರೆ ಪಡೆದು
    ನನ್ನಲ್ಲಿಯೆ ಇದೆ. ಅವುಗಳ ಆಸರೆಯಲ್ಲಿ ನಾನು ಇಲ್ಲ.

5: >-
    ಪಂಚಭೂತಗಳು ನನ್ನಲ್ಲಿ ಇಲ್ಲ. ನನ್ನ ದೊರೆತನದ ರೀತಿಯನ್ನು ನೋಡು. ನನ್ನ ದೇಹವು ಪಂಚಭೂತಗಳನ್ನು
    ಹೊತ್ತಿದೆ, ಆದರೆ ಪಂಚಭೂತಗಳ ವಿಕಾರವಾಗಿಲ್ಲ. ನಾನು ಪಂಚಭೂತಗಳಿಂದ ಸೃಷ್ಟಿಯನ್ನು
    ನಡೆಸುತ್ತೇನೆ.

6: >-
    ಎಲ್ಲೆಡೆಯೂ ತುಂಬಿರುವ ಗಾಳಿ ಯಾವಾಗಲೂ ಆಕಾಶದಲ್ಲಿಯೆ ಇರುವಂತೆ, ಎಲ್ಲವೂ ನನ್ನಲ್ಲಿಯೆ ಆಸರೆ
    ಪಡೆದು ಇವೆ ಎಂದೇ ಚಿಂತನೆ ಮಾಡು.

7: >-
    ಓ ಕೌಂತೇಯನೆ, ಬ್ರಹ್ಮಕಲ್ಪಕಾಲ ಮುಗಿದಾಗ ಎಲ್ಲವೂ ನನ್ನ ಅಧೀನವಾದ ಮೂಲಪ್ರಕೃತಿಯನ್ನು
    ಸೇರುತ್ತವೆ. ಕಲ್ಪದ ಆರಂಭದಲ್ಲಿ ಮತ್ತೆ ಅವೆಲ್ಲವನ್ನೂ ನಾನು ಸೃಷ್ಟಿಸುತ್ತೇನೆ.

8: >-
    ಪ್ರಕೃತಿಯನ್ನು ಬಳಸಿ ಈ ಪರತಂತ್ರವಾದ ಸಂಪೂರ್ಣ ವಿಶ್ವವನ್ನು ನನ್ನ ಇಚ್ಛೆಯಂತೆ ಮತ್ತೆ ಮತ್ತೆ
    ಸೃಷ್ಟಿಸುತ್ತೇನೆ.

9: >-
    ಓ ಧನಂಜಯನೆ, ಆ ಸೃಷ್ಟಿಕರ್ಮಗಳಲ್ಲಿ ಅಂಟಿಕೊಳ್ಳದೆ ಮಾಡಿಯೂ ಮಾಡದವನಂತೆ ನಾನು ಇದ್ದೇನೆ.
    ಆದ್ದರಿಂದ ಆ ಕರ್ಮಗಳು ನನ್ನನ್ನು ಕಟ್ಟಿ ಹಾಕುವುದಿಲ್ಲ.

10: >-
    ಓ ಕೌಂತೇಯನೆ, ಜೀವ-ಜಡಗಳ ಈ ವಿಶ್ವವನ್ನು ಪ್ರಕೃತಿಯು ನನ್ನ ಸಾಕ್ಷಿ(ಅಧ್ಯಕ್ಷ)ತನದಲ್ಲಿಯೆ
    ಹಡೆಯುತ್ತದೆ. ಈ ಕಾರಣದಿಂದಲೆ ಜಗತ್ತು ಬದಲಾಗುತ್ತಲೆ ಇರುತ್ತದೆ. (ಮತ್ತೆ ಮತ್ತೆ
    ಸೃಷ್ಟಿ-ಲಯಗಳನ್ನು ಪಡೆಯುತ್ತದೆ)

11: >-
    ಪಂಚಭೂತಗಳ ಪ್ರಪಂಚಕ್ಕೆ ಸ್ವಾಮಿಯಾದ ನನ್ನ, ಪಂಚಭೂತಗಳಿಲ್ಲದ ನೈಜ ಸ್ವರೂಪವನ್ನು
    ತಿಳಿಯದವರು ಮನುಷ್ಯರಂತೆ ಕಾಣುವ ದೇಹವನ್ನು ಪಡೆದಿರುವ ನನ್ನನ್ನು ಮನುಷ್ಯನೆಂದೆ ತಪ್ಪಾಗಿ
    ತಿಳಿದು ಕಡೆಗಣಿಸುತ್ತಾರೆ.

12: >-
    ತಪ್ಪು ತಿಳಿದ ಇವರ ಆಸೆಗಳು, ಕರ್ಮಗಳು, ಜ್ಞಾನವೂ ವ್ಯರ್ಥ. ಮೋಹಕವಾದ,
    ರಾಕ್ಷಸರ-ಅಸುರರ ತಾಮಸ ಸ್ವಭಾವವನ್ನು ಆಶ್ರಯಿಸಿದವರು.

13: >-
    ಓ ಪಾರ್ಥನೆ, ಸಾತ್ವಿಕಸ್ವಭಾವವನ್ನು ಆಶ್ರಯಿಸಿದ ಉತ್ತಮಜೀವರು ಬೇರೆ ದೇವತೆಗಳಲ್ಲಿ
    ಮನಸ್ಸಿಡದೆ, ನಾಶವಿಲ್ಲದ ನನ್ನನ್ನೆ ಜಗತ್ತಿನ ಸೃಷ್ಟಿಗೆ ಕಾರಣನನ್ನಾಗಿ ತಿಳಿದು ಸೇವೆ
    ಮಾಡುತ್ತಾರೆ.

14: >-
    ಆಚಾರನಿಷ್ಠರಾಗಿ ಪ್ರತಿದಿನವೂ ನನ್ನನ್ನೇ ಪ್ರಯತ್ನಪಟ್ಟು ಜಪಿಸುತ್ತಾರೆ. ಭಕ್ತಿಯಿಂದ ನನ್ನನ್ನೆ
    ನಮಿಸುತ್ತಾರೆ. ಶಾಸ್ತ್ರನಿಯಮಗಳನ್ನು ತಪ್ಪದೇ ನನ್ನ ಉಪಾಸನೆ ನಡೆಸುತ್ತಾರೆ.

15: >-
    ಪಾಠ-ಪ್ರವಚನದ ಮೂಲಕ ಪೂಜಿಸುವ ಕೆಲವರು, ಎಲ್ಲರೊಳಗೂ ನಾನೊಬ್ಬನೆ ಇರುವೆನೆಂದು, ಎಲ್ಲಕ್ಕಿಂತ
    ಬೇರೆಯಾಗಿಯೆ ಇರುವೆನೆಂದು ವಿಶ್ವವ್ಯಾಪಿಯಾದ ನನ್ನನ್ನು ಬಹಳ ರೀತಿಯಲ್ಲಿ ಉಪಾಸನೆ ಮಾಡುತ್ತಾರೆ.

16: >-
    ಕ್ರತು (ಬಲಿ ಇರುವ ಯಾಗ), ಯಜ್ಞ (ಬಲಿ ಇರದ ಯಾಗ), ಸ್ವಧಾ (ಶ್ರಾದ್ಧ), ಔಷಧ (ಆಹಾರ),
    ಮಂತ್ರ, ತುಪ್ಪ, ಅಗ್ನಿ, ಹವಿಸ್ಸು - ಎಲ್ಲವೂ ನಾನೇ.

17: >-
    ನಾನು ಈ ಜಗತ್ತಿನ ತಂದೆ, ತಾಯಿ, ಪೋಷಕ, ಅಜ್ಜ ಮತ್ತು ಎಲ್ಲರಿಂದಲೂ ತಿಳಿಯಬೇಕಾದವನು ನಾನು.
    ನಾನೇ ಪವಿತ್ರನು, ಓಂಕಾರನು. ಋಕ್, ಸಾಮ, ಯಜುಸ್.

18: >-
    ನಾನು ಗತಿ, ಭರ್ತೃ, ಪ್ರಭು, ಸಾಕ್ಷಿಯು, ನೆಲೆ, ಆಸರೆ, ಒಳ್ಳೆಯವನು. ಎಲ್ಲದರ
    ಸೃಷ್ಟಿ-ಸ್ಥಿತಿ-ಲಯಗಳಿಗೆ ಕಾರಣನು. ಎಲ್ಲಕ್ಕೂ ವಿಕಾರವಿಲ್ಲದ ಬೀಜನು ಮತ್ತು ಪಾತ್ರನು.

19: >-
    ಓ ಅರ್ಜುನನೆ, ನಾನು ಸುಡುತ್ತೇನೆ. ನಾನು ಮಳೆಯನ್ನು ತಡೆಯುತ್ತೇನೆ ಮತ್ತು ನೀಡುತ್ತೇನೆ.
    ಮೋಕ್ಷ ಮತ್ತು ಮರಣ ನನ್ನಿಂದಲೆ. ಕಾಣುವ ಕಾರ್ಯವೂ ಕಾಣದ ಕಾರಣವೂ ನನ್ನಿಂದ.

20: >-
    ಮೂರು ವೇದಗಳ ಮೂಲಕ ಕರ್ಮ ನಡೆಸುವವರು ಸ್ವರ್ಗವನ್ನು ಪಡೆಯಲು ಬಯಸುತ್ತಾರೆ. ಅವರು
    ಯಜ್ಞಗಳಿಂದ ನನ್ನನ್ನು ಆರಾಧಿಸಿ, ಸೋಮರಸ ಕುಡಿದು, ಪಾಪ ಕಳೆದು ಶುದ್ಧರಾಗಿ, ಪುಣ್ಯದ ಫಲವಾಗಿ
    ಇಂದ್ರನ ಲೋಕವೆನಿಸಿದ ಸ್ವರ್ಗವನ್ನು ಸೇರುತ್ತಾರೆ. ಅಲ್ಲಿ ಸುರರಿಗೆ ಸಮನಾದ ದಿವ್ಯಭೋಗಗಳನ್ನು
    ಪಡೆಯುತ್ತಾರೆ.

21: >-
    ದೊಡ್ಡದಾದ ಆ ಸ್ವರ್ಗವನ್ನು ಅವರು ಅನುಭವಿಸಿ ಪುಣ್ಯ ಮುಗಿದಾಗ ಭೂಮಿಗೆ ಬರುತ್ತಾರೆ. ಹೀಗೆ
    ಬೇಕುಗಳನ್ನು ಬಯಸಿ ವೈದಿಕ ಕರ್ಮಗಳನ್ನು ನಡೆಸುವವರು ಸ್ವರ್ಗಕ್ಕೆ-ಭೂಮಿಗೆ ಹೋಗಿ-ಬರುತ್ತ
    ಇರುವರು.

22: >-
    ಜ್ಞಾನಿಗಳು ಇತರ ದೇವತೆಗಳನ್ನು ನೆನೆಯದೆ, ನನ್ನನ್ನೇ ಪೂರ್ತಿಯಾಗಿ ಆರಾಧಿಸುವರು. ನಿತ್ಯವೂ
    ನನ್ನನ್ನೆ ನೆನೆವ ಇವರ ಯೋಗ ಮತ್ತು ಕ್ಷೇಮವನ್ನು ನಾನು ನೋಡಿಕೊಳ್ಳುವೆನು.

23: >-
    ಓ ಕೌಂತೇಯನೆ, ಕೆಲವರು ಇತರ ದೇವತೆಗಳನ್ನು ಭಕ್ತಿಯಿಂದ ಶ್ರದ್ಧೆಯಿಂದ ಪೂಜಿಸುತ್ತಾರೆ,
    ಅಂಥವರೂ ನನ್ನನ್ನೇ ಆರಾಧಿಸಿದ್ದು, ಆದರೆ ಶಾಸ್ತ್ರ ಹೇಳಿದಂತಲ್ಲ, ತಪ್ಪಾಗಿ.

24: >-
    ನನ್ನಿಂದಲೆ ಎಲ್ಲರ ಎಲ್ಲ ಬಗೆಯ ಪೂಜಾ ಕೈಂಕರ್ಯಗಳು ನಡೆಯುವುದು. ಹಾಗಾಗಿ, ನಾನೇ ಎಲ್ಲಾ
    ಪೂಜೆಗಳನ್ನು ಪಡೆಯುವವನು. ನಿಜವಾಗಿ ನನ್ನನ್ನು ಅವರು ಪೂರ್ತಿ ತಿಳಿದಿಲ್ಲ. ಆದ್ದರಿಂದ ಅವರು
    ತೊಂದರೆ ಪಡುತ್ತಾರೆ.

25: >-
    ದೇವತೆಗಳನ್ನು ಆರಾಧಿಸುತ್ತ ಬಂದವರು ದೇವತೆಗಳನ್ನೆ ಸೇರುತ್ತಾರೆ. ಪಿತೃಗಳನ್ನು ಸೇವಿಸುವವರು
    ಪಿತೃಗಳನ್ನು ಸೇರುತ್ತಾರೆ. ದೆವ್ವಗಳ ಪೂಜೆಗೈವವರು ದೆವ್ವಗಳನ್ನು ಸೇರುವರು. ನನ್ನನ್ನು
    ಪೂಜಿಸುವರು ನನ್ನನ್ನೇ ಸೇರುತ್ತಾರೆ.

26: >-
    ಎಲೆಯನ್ನೊ ಹೂವನ್ನೊ ಹಣ್ಣನ್ನೊ ನೀರನ್ನೊ ನನಗೆ ಯಾರು ಭಕ್ತಿಯಿಂದ ಸಮರ್ಪಿಸುತ್ತಾನೋ ನನ್ನನ್ನೆ
    ನಂಬಿದ ಅವನ ಆ ಪ್ರೀತಿಯಿಂದ ಒಪ್ಪಿಸಿದ ವಸ್ತುವನ್ನು ನಾನು ಸ್ವೀಕರಿಸುವೆನು.

27: >-
    ಓ ಕೌಂತೇಯನೆ, ನೀನು ಮಾಡಿದ ಯಜ್ಞ, ದಾನ, ತಪಸ್ಸು, ಕರ್ಮ, ಅಶನ ಎಲ್ಲವನ್ನೂ ನನಗೆ
    ಸಮರ್ಪಿಸು.

28: >-
    ಹೀಗೆ ಫಲದ ಆಸೆ ಬಿಟ್ಟು ಕರ್ತವ್ಯವನ್ನು ನಡೆಸುವ ನೀನು, ಒಳ್ಳೆಯ-ಕೆಟ್ಟ ಫಲಗಳನ್ನು ನೀಡುವ
    ಕರ್ಮಗಳ ಬಂಧನದಿಂದ ಬಿಡುಗಡೆಯನ್ನು ಪಡೆಯುವೆ. ಹೀಗಾದಾಗ ನನ್ನನ್ನು ಸೇರುವೆ.

29: >-
    ನಾನಾಗಿ ಯಾರನ್ನೂ ಪ್ರೀತಿಸಲ್ಲ, ದ್ವೇಷಿಸಲ್ಲ. ನನಗೆ ಎಲ್ಲ ಜೀವಿಗಳೂ ಸಮ. ಆದರೆ ಯಾರು
    ನನ್ನನ್ನು ಭಕ್ತ್ತಿಯಿಂದ ಸೇವಿಸುತ್ತಾರೋ ಅವರು ನನ್ನವರು, ಮತ್ತೆ ನಾನು ಅವರಲ್ಲಿ ಸೇರಿದವನು.

30: >-
    ಬೇರೆ ದೇವತೆಗಳನ್ನು ಸೇವೆಗೈಯದೆ ನನ್ನನ್ನು ಸೇವಿಸುವವನು ಅಧರ್ಮ ಮಾಡುವವನಾದರೂ ಒಳ್ಳೆಯವನೆಂದೆ
    ತಿಳಿಯಬೇಕು. ಏಕೆಂದರೆ ಅವನು ಚೆನ್ನಾಗಿ ಶಾಸ್ತ್ರನಿರ್ಣಯವನ್ನು ತಿಳಿದವನು.

31: >-
    ಅವನು ಕೂಡಲೆ ಧರ್ಮವನ್ನು ಮಾಡುವವನೂ ಆಗುತ್ತಾನೆ. ನಾಶವಾಗದ ಪೂರ್ಣಸುಖವನ್ನು
    ಅನುಭವಿಸುತ್ತಾನೆ. ಓ ಕೌಂತೇಯನೆ, ಆಣೆ ಮಾಡಿ ಹೇಳು - ನನ್ನ ಭಕ್ತನು ನಾಶ ಹೊಂದನು.

32: >-
    ಓ ಪಾರ್ಥನೆ, ಸ್ತ್ರೀಯರು, ವೈಶ್ಯರು, ಶೂದ್ರರು, ಕೆಟ್ಟಜನ್ಮವನ್ನು ಪಡೆದವರು, ಎಲ್ಲರೂ
    ನನ್ನನ್ನೇ ಆಶ್ರಯಿಸಿ ಆರಾಧಿಸಿ ಉತ್ತಮ ಗತಿಯನ್ನೇ ಹೊಂದಿದ್ದಾರೆ.

33: >-
    ಮತ್ತೆ ಬ್ರಾಹ್ಮಣರು, ಒಳ್ಳೆಯ ಜನ್ಮವನ್ನು ಪಡೆದವರು, ರಾಜರು, ಋಷಿಗಳು ಇವರೆಲ್ಲರೂ ನನ್ನ
    ಭಕ್ತರು ಉತ್ತಮ ಗತಿಯನ್ನು ಪಡೆದಿದ್ದಾರೆಯೆ. ಹೀಗೆ ನಿತ್ಯವಲ್ಲದ, ಸುಖವಿಲ್ಲದ ಈ ಲೋಕಕ್ಕೆ
    ಬಂದಾಗ ನನ್ನನ್ನು ಆರಾಧಿಸು.

34: >-
    ನನ್ನಲ್ಲೇ ಮನಸ್ಸಿಡು, ನನ್ನ ಭಕ್ತನಾಗು. ನನ್ನನ್ನೇ ಪೂಜಿಸು. ನನ್ನನ್ನೇ ನಮಿಸು. ನಾನೇ
    ಸರ್ವೋತ್ತಮನೆಂದು ನನ್ನನ್ನು ಆಶ್ರಯಿಸು. ಹೀಗೆ ನಿನ್ನನ್ನು ತೊಡಗಿಸಿದರೆ ನನ್ನನ್ನೇ ಸೇರುವೆ.

1: |-
    ಸಂನ್ಯಾಸಂ ಕರ್ಮಣಾಂ ಕೃಷ್ಣ ಪುನರ್ಯೋಗಂ ಚ ಶಂಸಸಿ ।
    ಯಚ್ಛ್ರೇಯ ಏತಯೋರೇಕಂ ತನ್ಮೇ ಬ್ರೂಹಿ ಸು-ನಿಶ್ಚಿತಮ್ ॥

2: |-
    ಸಂನ್ಯಾಸಃ ಕರ್ಮ-ಯೋಗಶ್ಚ ನಿಃಶ್ರೇಯಸ-ಕರಾವುಭೌ ।
    ತಯೋಸ್ತು ಕರ್ಮ-ಸಂನ್ಯಾಸಾತ್ ಕರ್ಮ-ಯೋಗೋ ವಿಶಿಷ್ಯತೇ ॥

3: |-
    ಜ್ಞೇಯಃ ಸ ನಿತ್ಯ-ಸಂನ್ಯಾಸೀ ಯೋ ನ ದ್ವೇಷ್ಟಿ ನ ಕಾಂಕ್ಷತಿ ।
    ನಿರ್ದ್ವಂದ್ವೋ ಹಿ ಮಹಾಬಾಹೋ ಸುಖಂ ಬಂಧಾತ್ ಪ್ರಮುಚ್ಯತೇ ॥

4: |-
    ಸಾಂಖ್ಯ-ಯೋಗೌ ಪೃಥಗ್ ಬಾಲಾಃ ಪ್ರ-ವದಂತಿ ನ ಪಂಡಿತಾಃ ।
    ಏಕಮಪ್ಯಾಸ್ಥಿತಃ ಸಮ್ಯಕ್ ಉಭಯೋರ್ವಿಂದತೇ ಫಲಮ್ ॥

5: |-
    ಯತ್ ಸಾಂಖ್ಯೈಃ ಪ್ರಾಪ್ಯತೇ ಸ್ಥಾನಂ ತದ್ ಯೋಗೈರಪಿ ಗಮ್ಯತೇ ।
    ಏಕಂ ಸಾಂಖ್ಯಂ ಚ ಯೋಗಂ ಚ ಯಃ ಪಶ್ಯತಿ ಸ ಪಶ್ಯತಿ ॥

6: |-
    ಸಂ-ನ್ಯಾಸಸ್ತು ಮಹಾಬಾಹೋ ದುಃಖಮಾಪ್ತುಮಯೋಗತಃ ।
    ಯೋಗ-ಯುಕ್ತೋ ಮುನಿರ್ಬ್ರಹ್ಮ ನ ಚಿರೇಣಾಧಿಗಚ್ಛತಿ ॥

7: |-
    ಯೋಗ-ಯುಕ್ತೋ ವಿ-ಶುದ್ಧಾತ್ಮಾ ವಿ-ಜಿತಾತ್ಮಾ ಜಿತೇಂದ್ರಿಯಃ ।
    ಸರ್ವ-ಭೂತಾತ್ಮ-ಭೂತಾತ್ಮಾ ಕುರ್ವನ್ನಪಿ ನ ಲಿಪ್ಯತೇ ॥

8: |-
    ನೈವ ಕಿಂಚಿತ್ ಕರೋಮೀತಿ ಯುಕ್ತೋ ಮನ್ಯೇತ ತತ್ತ್ವ-ವಿತ್ ।
    ಪಶ್ಯನ್ ಶೃಣ್ವನ್ ಸ್ಪೃಶನ್ ಜಿಘ್ರನ್ ಅಶ್ನನ್ ಗಚ್ಛನ್ ಸ್ವಪನ್ ಶ್ವಸನ್ ॥

9: |-
    ಪ್ರಲಪನ್ ವಿಸೃಜನ್ ಗೃಹ್ಣನ್ ಉನ್ಮಿಷನ್ ನಿಮಿಷನ್ನಪಿ ।
    ಇಂದ್ರಿಯಾಣೀಂದ್ರಿಯಾರ್ಥೇಷು ವರ್ತಂತ ಇತಿ ಧಾರಯನ್ ॥

10: |-
    ಬ್ರಹ್ಮಣ್ಯಾಧಾಯ ಕರ್ಮಾಣಿ ಸಂಗಂ ತ್ಯಕ್ತ್ವಾ ಕರೋತಿ ಯಃ ।
    ಲಿಪ್ಯತೇ ನ ಸ ಪಾಪೇನ ಪದ್ಮ-ಪತ್ರಮಿವಾಂಭಸಾ ॥

11: |-
    ಕಾಯೇನ ಮನಸಾ ಬುದ್ಧ್ಯಾ ಕೇವಲೈರಿಂದ್ರಿಯೈರಪಿ ।
    ಯೋಗಿನಃ ಕರ್ಮ ಕುರ್ವಂತಿ ಸಂಗಂ ತ್ಯಕ್ತ್ವಾಽಽತ್ಮ-ಶುದ್ಧಯೇ ॥

12: |-
    ಯುಕ್ತಃ ಕರ್ಮ-ಫಲಂ ತ್ಯಕ್ತ್ವಾ ಶಾಂತಿಮಾಪ್ನೋತಿ ನೈಷ್ಠಿಕೀಮ್ ।
    ಅಯುಕ್ತಃ ಕಾಮ-ಕಾರೇಣ ಫಲೇ ಸಕ್ತೋ ನಿ-ಬದ್ಧ್ಯತೇ ॥

13: |-
    ಸರ್ವ-ಕರ್ಮಾಣಿ ಮನಸಾ ಸನ್ನ್ಯಸ್ಯಾಽಸ್ತೇ ಸುಖಂ ವಶೀ ।
    ನವ-ದ್ವಾರೇ ಪುರೇ ದೇಹೀ ನೈವ ಕುರ್ವನ್ ನ ಕಾರಯನ್ ॥

14: |-
    ನ ಕರ್ತೃತ್ವಂ ನ ಕರ್ಮಾಣಿ ಲೋಕಸ್ಯ ಸೃಜತಿ ಪ್ರಭುಃ ।
    ನ ಕರ್ಮ-ಫಲ-ಸಂಯೋಗಂ ಸ್ವ-ಭಾವಸ್ತು ಪ್ರ-ವರ್ತತೇ ॥

15: |-
    ನಾಽದತ್ತೇ ಕಸ್ಯ-ಚಿತ್ ಪಾಪಂ ನ ಚೈವ ಸು-ಕೃತಂ ವಿಭುಃ ।
    ಅಜ್ಞಾನೇನಾಽವೃತಂ ಜ್ಞಾನಂ ತೇನ ಮುಹ್ಯಂತಿ ಜಂತವಃ ॥

16: |-
    ಜ್ಞಾನೇನ ತು ತದಜ್ಞಾನಂ ಯೇಷಾಂ ನಾಶಿತಮಾತ್ಮನಃ ।
    ತೇಷಾಮಾದಿತ್ಯವಜ್ಜ್ಞಾನಂ ಪ್ರ-ಕಾಶಯತಿ ತತ್ ಪರಮ್ ॥

17: |-
    ತದ್ಬುದ್ಧಯಸ್ತದಾತ್ಮಾನಃ ತನ್ನಿಷ್ಠಾಸ್ತತ್ಪರಾಯಣಾಃ ।
    ಗಚ್ಛಂತ್ಯಪುನರಾವೃತ್ತಿಂ ಜ್ಞಾನ-ನಿರ್ಧೂತ-ಕಲ್ಮಷಾಃ ॥

18: |-
    ವಿದ್ಯಾ-ವಿನಯ-ಸಂಪನ್ನೇ ಬ್ರಾಹ್ಮಣೇ ಗವಿ ಹಸ್ತಿನಿ ।
    ಶುನಿ ಚೈವ ಶ್ವಪಾಕೇ ಚ ಪಂಡಿತಾಃ ಸಮ-ದರ್ಶಿನಃ ॥

19: |-
    ಇಹೈವ ತೈರ್ಜಿತಃ ಸರ್ಗೋ ಯೇಷಾಂ ಸಾಮ್ಯೇ ಸ್ಥಿತಂ ಮನಃ ।
    ನಿರ್ದೋಷಂ ಹಿ ಸಮಂ ಬ್ರಹ್ಮ ತಸ್ಮಾದ್ ಬ್ರಹ್ಮಣಿ ತೇ ಸ್ಥಿತಾಃ ॥

20: |-
    ನ ಪ್ರ-ಹೃಷ್ಯೇತ್ ಪ್ರಿಯಂ ಪ್ರಾಪ್ಯ ನೋದ್ವಿಜೇತ್ ಪ್ರಾಪ್ಯ ಚಾಪ್ರಿಯಮ್ ।
    ಸ್ಥಿರ-ಬುದ್ಧಿರಸಮ್ಮೂಢೋ ಬ್ರಹ್ಮ-ವಿದ್ ಬ್ರಹ್ಮಣಿ ಸ್ಥಿತಃ ॥

21: |-
    ಬಾಹ್ಯ-ಸ್ಪರ್ಶೇಷ್ವಸಕ್ತಾತ್ಮಾ ವಿಂದತ್ಯಾತ್ಮನಿ ಯತ್ ಸುಖಮ್ ।
    ಸ ಬ್ರಹ್ಮ-ಯೋಗ-ಯುಕ್ತಾತ್ಮಾ ಸುಖಮಕ್ಷಯಮಶ್ನುತೇ ॥

22: |-
    ಯೇ ಹಿ ಸಂ-ಸ್ಪರ್ಶಜಾ ಭೋಗಾಃ ದುಃಖ-ಯೋನಯ ಏವ ತೇ ।
    ಆದ್ಯಂತವಂತಃ ಕೌಂತೇಯ ನ ತೇಷು ರಮತೇ ಬುಧಃ ॥

23: |-
    ಶಕ್ನೋತೀಹೈವ ಯಃ ಸೋಢುಂ ಪ್ರಾಕ್ ಶರೀರ-ವಿಮೋಕ್ಷಣಾತ್ ।
    ಕಾಮ-ಕ್ರೋಧೋದ್ಭವಂ ವೇಗಂ ಸ ಯುಕ್ತಃ ಸ ಸುಖೀ ನರಃ ॥

24: |-
    ಯೋಽಂತಃ-ಸುಖೋಽಂತರಾರಾಮಃ ತಥಾಂಽತರ್ಜ್ಯೋತಿರೇವ ಯಃ ।
    ಸ ಯೋಗೀ ಬ್ರಹ್ಮ ನಿರ್ಬಾಣಂ ಬ್ರಹ್ಮ-ಭೂತೋಽಧಿ-ಗಚ್ಛತಿ ॥

25: |-
    ಲಭಂತೇ ಬ್ರಹ್ಮ ನಿರ್ಬಾಣಂ ಋಷಯಃ ಕ್ಷೀಣ-ಕಲ್ಮಷಾಃ ।
    ಛಿನ್ನದ್ವೆೈಧಾ ಯತಾತ್ಮಾನಃ ಸರ್ವ-ಭೂತ-ಹಿತೇ ರತಾಃ ॥

26: |-
    ಕಾಮ-ಕ್ರೋಧ-ವಿಯುಕ್ತಾನಾಂ ಯತೀನಾಂ ಯತ-ಚೇತಸಾಮ್ ।
    ಅಭಿತೋ ಬ್ರಹ್ಮ ನಿರ್ಬಾಣಂ ವರ್ತತೇ ವಿದಿತಾತ್ಮನಾಮ್ ॥

27: |-
    ಸ್ಪರ್ಶಾನ್ ಕೃತ್ವಾ ಬಹಿರ್ಬಾಹ್ಯಾನ್ ಚಕ್ಷುಶ್ಚೈವಾಂತರೇ ಭ್ರುವೋಃ ।
    ಪ್ರಾಣಾಪಾನೌ ಸಮೌ ಕೃತ್ವಾ ನಾಸಾಭ್ಯಂತರ-ಚಾರಿಣೌ ॥

28: |-
    ಯತೇಂದ್ರಿಯ-ಮನೋವೃತ್ತಿಃ ಮುನಿರ್ಮೋಕ್ಷ-ಪರಾಯಣಃ ।
    ವಿ-ಗತೇಚ್ಛಾ-ಭಯ-ಕ್ರೋಧೋ ಯಃ ಸದಾ ಮುಕ್ತ ಏವ ಸಃ ॥

29: |-
    ಭೋಕ್ತಾರಂ ಯಜ್ಞ-ತಪಸಾಂ ಸರ್ವ-ಲೋಕ-ಮಹೇಶ್ವರಮ್ ।
    ಸುಹೃದಂ ಸರ್ವ-ಭೂತಾನಾಂ ಜ್ಞಾತ್ವಾ ಮಾಂ ಶಾಂತಿಮೃಚ್ಛತಿ ॥

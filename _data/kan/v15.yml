1: |-
    ಊರ್ಧ್ವ-ಮೂಲಮಧಃ-ಶಾಖಂ ಅಶ್ವತ್ಥಂ ಪ್ರಾಹುರವ್ಯಯಮ್ ।
    ಛಂದಾಂಸಿ ಯಸ್ಯ ಪರ್ಣಾನಿ ಯಸ್ತಂ ವೇದ ಸ ವೇದ-ವಿತ್ ॥

2: |-
    ಅಧಶ್ಚೋರ್ಧ್ವಂ ಚ ಪ್ರಸೃತಾಸ್ತಸ್ಯ ಶಾಖಾಃ
    ಗುಣ-ಪ್ರವೃದ್ಧಾ ವಿಷಯ-ಪ್ರವಾಳಾಃ ।
    ಅಧಶ್ಚ ಮೂಲಾನ್ಯನುಸಂತತಾನಿ
    ಕರ್ಮಾನುಬಂಧೀನಿ ಮನುಷ್ಯ-ಲೋಕೇ ॥

3: |-
    ನ ರೂಪಮಸ್ಯೇಹ ತಥೋಪಲಭ್ಯತೇ
    ನಾಂತೋ ನ ಚಾದಿರ್ನ ಚ ಸಂಪ್ರತಿಷ್ಠಾ ।
    ಅಶ್ಚತ್ಥಮೇನಂ ಸುವಿರೂಢ-ಮೂಲಂ
    ಅಸಂಗ-ಶಸ್ತ್ರೇಣ ದೃಢೇನ ಛಿತ್ವಾ ॥

4: |-
    ತತಃ ಪರಂ ತತ್ಪರಿಮಾರ್ಗಿತವ್ಯಂ
    ಯಸ್ಮಿನ್ ಗತಾ ನ ನಿವರ್ತಂತಿ ಭೂಯಃ ।
    ತಮೇವ ಚಾದ್ಯಂ ಪುರುಷಂ ಪ್ರಪದ್ಯೇ
    ಯತಃ ಪ್ರವೃತ್ತಿಃ ಪ್ರಸೃತಾ ಪುರಾಣೀ ॥

5: |-
    ನಿರ್ಮಾನ-ಮೋಹಾ ಜಿತ-ಸಂಗ-ದೋಷಾಃ
    ಅಧ್ಯಾತ್ಮ-ನಿತ್ಯಾ ವಿನಿವೃತ್ತ-ಕಾಮಾಃ ।
    ದ್ವಂದ್ವೆೈರ್ವಿ-ಮುಕ್ತಾಃ ಸುಖ-ದುಃಖ-ಸಂಜ್ಞೆೈಃ
    ಗಚ್ಛಂತ್ಯಮೂಢಾಃ ಪದಮವ್ಯಯಂ ತತ್ ॥

6: |-
    ನ ತದ್ಭಾಸಯತೇ ಸೂರ್ಯೋ ನ ಶಶಾಂಕೋ ನ ಪಾವಕಃ ।
    ಯದ್ಗತ್ವಾ ನ ನಿವರ್ತಂತೇ ತದ್ಧಾಮ ಪರಮಂ ಮಮ ॥

7: |-
    ಮಮೈವಾಂಶೋ ಜೀವ-ಲೋಕೇ ಜೀವ-ಭೂತಃ ಸನಾತನಃ ।
    ಮನಃ-ಷಷ್ಠಾನೀಂದ್ರಿಯಾಣಿ ಪ್ರಕೃತಿ-ಸ್ಥಾನಿ ಕರ್ಷತಿ ॥

8: |-
    ಶರೀರಂ ಯದವಾಪ್ನೋತಿ ಯಚ್ಚಾಪ್ಯುತ್ಕ್ರಾಮತೀಶ್ವರಃ ।
    ಗೃಹೀತ್ವೈತಾನಿ ಸಂಯಾತಿ ವಾಯುರ್ಗಂಧಾನಿವಾಶಯಾತ್ ॥

9: |-
    ಶ್ರೋತ್ರಂ ಚಕ್ಷುಃ ಸ್ಪರ್ಶನಂ ಚ ರಸನಂ ಘ್ರಾಣಮೇವ ಚ ।
    ಅಧಿಷ್ಠಾಯ ಮನಶ್ಚಾಯಂ ವಿಷಯಾನುಪಸೇವತೇ ॥

10: |-
    ಉತ್ಕ್ರಾಮಂತಂ ಸ್ಥಿತಂ ವಾಪಿ ಭುಂಜಾನಂ ವಾ ಗುಣಾನ್ವಿತಮ್ ।
    ವಿಮೂಢಾ ನಾನುಪಶ್ಯಂತಿ ಪಶ್ಯಂತಿ ಜ್ಞಾನ-ಚಕ್ಷುಷಃ ॥

11: |-
    ಯತಂತೋ ಯೋಗಿನಶ್ಚೈನಂ ಪಶ್ಯಂತ್ಯಾತ್ಮನ್ಯವಸ್ಥಿತಮ್ ।
    ಯತಂತೋಽಪ್ಯಕೃತಾತ್ಮಾನೋ ನೈನಂ ಪಶ್ಯಂತ್ಯಚೇತಸಃ ॥

12: |-
    ಯದಾದಿತ್ಯ-ಗತಂ ತೇಜೋ ಜಗದ್ ಭಾಸಯತೇಽಖಿಲಮ್ ।
    ಯಚ್ಚಂದ್ರಮಸಿ ಯಚ್ಚಾಗ್ನೌ ತತ್ತೇಜೋ ವಿದ್ಧಿ ಮಾಮಕಮ್ ॥

13: |-
    ಗಾಮಾವಿಶ್ಯ ಚ ಭೂತಾನಿ ಧಾರಯಾಮ್ಯಹಮೋಜಸಾ ।
    ಪುಷ್ಣಾಮಿ ಚೌಷಧೀಃ ಸರ್ವಾಃ ಸೋಮೋ ಭೂತ್ವಾ ರಸಾತ್ಮಕಃ ॥

14: |-
    ಅಹಂ ವೈಶ್ವಾನರೋ ಭೂತ್ವಾ ಪ್ರಾಣಿನಾಂ ದೇಹಮಾಶ್ರಿತಃ ।
    ಪ್ರಾಣಾಪಾನ-ಸಮಾಯುಕ್ತಃ ಪಚಾಮ್ಯನ್ನಂ ಚತುರ್ವಿಧಮ್ ॥

15: |-
    ಸರ್ವಸ್ಯ ಚಾಹಂ ಹೃದಿ ಸಂನಿವಿಷ್ಟೋ
    ಮತ್ತಃ ಸ್ಮೃತಿರ್ಜ್ಞಾನಮಪೋಹನಂ ಚ ।
    ವೇದೈಶ್ಚ ಸರ್ವೈರಹಮೇವ ವೇದ್ಯೋ
    ವೇದಾಂತ-ಕೃದ್ ವೇದ-ವಿದೇವ ಚಾಹಮ್ ॥

16: |-
    ದ್ವಾವಿಮೌ ಪುರುಷೌ ಲೋಕೇ ಕ್ಷರಶ್ಚಾಕ್ಷರ ಏವ ಚ ।
    ಕ್ಷರಃ ಸರ್ವಾಣಿ ಭೂತಾನಿ ಕೂಟ-ಸ್ಥೋಽಕ್ಷರ ಉಚ್ಯತೇ ॥

17: |-
    ಉತ್ತಮಃ ಪುರುಷಸ್ತ್ವನ್ಯಃ ಪರಮಾತ್ಮೇತ್ಯುದಾಹೃತಃ ।
    ಯೋ ಲೋಕ-ತ್ರಯಮಾವಿಶ್ಯ ಬಿಭರ್ತ್ಯವ್ಯಯ ಈಶ್ವರಃ ॥

18: |-
    ಯಸ್ಮಾತ್ ಕ್ಷರಮತೀತೋಽಹಂ ಅಕ್ಷರಾದಪಿ ಚೋತ್ತಮಃ ।
    ಅತೋಽಸ್ಮಿ ಲೋಕೇ ವೇದೇ ಚ ಪ್ರಥಿತಃ ಪುರುಷೋತ್ತಮಃ ॥

19: |-
    ಯೋ ಮಾಮೇವಮಸಮ್ಮೂಢೋ ಜಾನಾತಿ ಪುರುಷೋತ್ತಮಮ್ ।
    ಸ ಸರ್ವ-ವಿದ್ ಭಜತಿ ಮಾಂ ಸರ್ವ-ಭಾವೇನ ಭಾರತಃ ॥

20: |-
    ಇತಿ ಗುಹ್ಯ-ತಮಂ ಶಾಸ್ತ್ರಂ ಇದಮುಕ್ತಂ ಮಯಾನಘ ।
    ಏತದ್ ಬುದ್ಧ್ವಾಬುದ್ಧಿ-ಮಾನ್ ಸ್ಯಾತ್ ಕೃತ-ಕೃತ್ಯಶ್ಚ ಭಾರತ ॥

1: >-
    ಅರ್ಜುನ ಹೇಳಿದನು - ಓ ಮಹಾಬಾಹುವೆ, ಹೃಷೀಕೇಶನೆ, ಕೇಶಿದೈತ್ಯನನ್ನು ಕೊಂದವನೆ, ಸಂನ್ಯಾಸದ
    ಮತ್ತು ತ್ಯಾಗದ ಸ್ವರೂಪವನ್ನು ಮತ್ತು ವ್ಯತ್ಯಾಸವನ್ನು ತಿಳಿಯಲು ಬಯಸುತ್ತೇನೆ.

2: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಕಾಮ್ಯ (ನಿತ್ಯ-ನೈಮಿತ್ತಿಕವಲ್ಲದ) ಕರ್ಮಗಳನ್ನು ಬಿಡುವುದನ್ನು ಜ್ಞಾನಿಗಳು
    ಸಂನ್ಯಾಸ ಎನ್ನುತ್ತಾರೆ. ಎಲ್ಲ ಕರ್ಮಗಳ ಫಲವನ್ನಷ್ಟೇ ಬಿಡುವುದನ್ನು ಪಂಡಿತರು ತ್ಯಾಗ
    ಎನ್ನುವರು.

3: >-
    ದೋಷವುಳ್ಳ ಕರ್ಮವನ್ನು ಬಿಡಬೇಕು ಎಂದು ಕೆಲವು ವಿದ್ವಾಂಸರು ಹೇಳುತ್ತಾರೆ. ಮತ್ತೆ ಕೆಲವರು
    ಯಜ್ಞ-ದಾನ-ತಪಸ್ಸುಗಳನ್ನು ಬಿಡಬಾರದು ಎನ್ನುತ್ತಾರೆ.

4: >-
    ಓ ಭರತಶ್ರೇಷ್ಠನೆ, ಇಲ್ಲಿ ತ್ಯಾಗದ ವಿಷಯದಲ್ಲಿ ನನ್ನ ನಿರ್ಣಯ ಕೇಳು. ಓ ಪುರುಷಶ್ರೇಷ್ಠನೆ,
    ತ್ಯಾಗವು ಮೂರು ಬಗೆ ಎಂದು ಹೇಳಲ್ಪಟ್ಟಿದೆ.

5: >-
    ಯಜ್ಞ-ದಾನ-ತಪಸ್ಸುಗಳನ್ನು ಬಿಡಬಾರದು. ಆ ಕರ್ಮಗಳನ್ನು ಮಾಡಲೇಬೇಕು. ಯಜ್ಞ, ದಾನ ಮತ್ತು
    ತಪಸ್ಸು, ಜ್ಞಾನಿಗಳನ್ನೂ ಶುದ್ಧಗೊಳಿಸುವ ಕರ್ಮಗಳು.

6: >-
    ಓ ಪಾರ್ಥನೆ, ಈ ಕರ್ಮಗಳನ್ನು ನಾನು ಮಾಡುವೆನೆಂಬ ಅಭಿಮಾನ ಬಿಟ್ಟು ಮತ್ತು ಫಲದ ಆಸೆಯನ್ನೂ
    ತೊರೆದು ಮಾಡಬೇಕು ಎಂದು ನನ್ನ ದೃಢವಾದ ಅಭಿಪ್ರಾಯ, ಶ್ರೇಷ್ಠವೂ ಆಗಿದೆ.

7: >-
    ನಿಯತವಾದ (ತನಗೆ ಹೇಳಿದ) ಕರ್ಮವನ್ನು ಬಿಡುವುದು ಸರಿಯಲ್ಲ. ತಪ್ಪುತಿಳಿವಿನಿಂದ ಅದನ್ನು
    ತೊರೆಯುವುದು ತಾಮಸ ತ್ಯಾಗ ಎನಿಸುತ್ತದೆ.

8: >-
    ಕೆಲಸ ಕಷ್ಟ ನೀಡಲಿದೆ ಎಂದು ಬಗೆದು, ದೇಹದ ಬಾಧೆಗೆ ಬೆದರಿ ಮಾಡದೆ ಇರುವುದು ರಾಜಸ ತ್ಯಾಗ.
    ಇಂಥ ತ್ಯಾಗ ಮಾಡಿಯೂ ತ್ಯಾಗದ ಫಲ ಸಿಗದು.

9: >-
    ಓ ಅರ್ಜುನನೆ, ಕರ್ತವ್ಯ ಎಂಬ ನಿಲುವಿನಿಂದ ನಿಯತ ಕರ್ಮವನ್ನು ಮಾಡುತ್ತ, ನಾನು ಮಾಡುವೆನು ಎಂಬ
    ಅಭಿಮಾನ ಮತ್ತು ಫಲದ ಆಸೆಯನ್ನು ಬಿಡುವುದು ಸಾತ್ತ್ವಿಕ ತ್ಯಾಗ.

10: >-
    ತಿಳಿದವನು, ಸಂದೇಹ ಇಲ್ಲದವನು ಸಾತ್ತ್ವಿಕತ್ಯಾಗಿಯು ಸುಖ ನೀಡದ ಕರ್ಮವನ್ನು ವಿರೋಧಿಸನು,
    ಸುಖ ಕೊಡುವ ಕರ್ಮವನ್ನು ಅತಿಯಾಗಿ ಮೆಚ್ಚನು.

11: >-
    ದೇಹ ಹೊತ್ತಿರುವ ಜೀವನಿಂದ ಕರ್ಮಗಳನ್ನು ಪೂರ್ತಿಯಾಗಿ ಬಿಡಲು ಆಗುವುದೆ ಇಲ್ಲ. ಕರ್ಮದ ಫಲವನ್ನು
    ಬಿಡುವವನೆ ಕರ್ಮತ್ಯಾಗಿ ಎನಿಸುತ್ತಾನೆ.

12: >-
    ಕರ್ಮದ ಫಲ ಮೂರು ರೀತಿಯದ್ದು - ದುಃಖ, ಸುಖ ಮತ್ತು ಎರಡರ ಬೆರಕೆ. ಫಲ ತ್ಯಾಗ ಮಾಡದವರಿಗೆ
    ಇವು ಸತ್ತ ಮೇಲೆ ಸಿಗುತ್ತದೆ. ಫಲದ ಆಸೆ ಬಿಟ್ಟವರಿಗೆ ಇದು ಅಂಟಿಕೊಳ್ಳುವುದಿಲ್ಲ.

13: >-
    ಓ ಮಹಾಬಾಹುವೆ, ಎಲ್ಲ ಕಾರ್ಯಗಳು ಆಗಲು ಇವು ಐದು ಕಾರಣಗಳು. ಸಾಂಖ್ಯ (ವೈದಿಕಜ್ಞಾನದ)
    ಶಾಸ್ತ್ರದಲ್ಲಿ ಚೆನ್ನಾಗಿ ಹೇಳಿದ ಅವುಗಳನ್ನು ನನ್ನಿಂದ ತಿಳಿದುಕೊಳ್ಳು.

14: >-
    ಕ್ರಿಯೆ ನಡೆಯುವ ಜಾಗ, ಮಾಡುವ ದೇವ (ಜೀವ), ಬೇರೆ ಬೇರೆ ಉಪಕರಣಗಳು, ನಾನಾ ರೀತಿಯ
    ಪ್ರಪ್ರತ್ಯೇಕ ಪೂರಕ ಕ್ರಿಯೆಗಳು ಮತ್ತು ಐದನೆಯದಾದ ಅದೃಷ್ಟ (ದೇವ).

15: >-
    ಮನುಷ್ಯನು ದೇಹ-ಮಾತು-ಮನಸ್ಸುಗಳಿಂದ ಮಾಡುವ ಸರಿಯಾದ ಅಥವಾ ತಪ್ಪಾದ ಕೆಲಸಕ್ಕೆ ಇವು ಐದು
    ಕಾರಣಗಳು.

16: >-
    ಹೀಗಿರುವಾಗ, ತಾನೊಬ್ಬನೆ ಎಲ್ಲ ಮಾಡಿದವನು ಎಂದು ತಿಳಿದವನು ಕೆಟ್ಟ ಬುದ್ಧಿಯವನು. ಬುದ್ಧಿ
    ಕೆಟ್ಟವನಾದ್ದರಿಂದಲೆ ಆತ ಏನೂ ತಿಳಿದಿಲ್ಲ.

17: >-
    ನಾನು ಮಾಡಿದೆ ಎಂಬ ಸ್ವಾತಂತ್ರ್ಯದ ಅಭಿಮಾನ ಇಲ್ಲದವನು, ರಾಗದ್ವೇಷಗಳಿಲ್ಲದ ಶುದ್ಧ ಮನದವನು ಈ
    ಎಲ್ಲ ಜನರನ್ನು ಕೊಂದರೂ ಯಾರನ್ನೂ ಕೊಲ್ಲುವುದಿಲ್ಲ. ಕರ್ಮದ ಬಂಧನವೂ ಇಲ್ಲ.

18: >-
    ಕರ್ಮವಿಧಿಯ ಉದ್ದೇಶ ಮೂರು - ಮಾಡಬೇಕೆಂಬ ಜ್ಞಾನ, ಅದಕ್ಕಾಗಿ ತಿಳಿಯಬೇಕಾದ ಕರ್ಮ- ಕರ್ಮಫಲ
    ಮತ್ತು ತಿಳಿದು ಮಾಡುವವನು. ಉಪಕರಣ, ಕ್ರಿಯೆ ಮತ್ತು ಮಾಡುವವನು ಎಂದು ಕರ್ಮದ ಕಾರಣವೂ
    ಸಂಕ್ಷೇಪವಾಗಿ ಮೂರು ರೀತಿಯು.

19: >-
    ಜ್ಞಾನ, ಕ್ರಿಯೆ ಮತ್ತು ಮಾಡುವವ - ಇವು ಮೂರು ಗುಣಗಳಿಂದಾಗಿ ಮೂರು ರೀತಿ ಎಂದು ಗುಣಗಳನ್ನು
    ಲೆಕ್ಕ ಮಾಡಿದ ಸಾಂಖ್ಯಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಲಾಗಿದೆ. ಅವುಗಳನ್ನು ಸರಿಯಾಗಿಯೆ ಕೇಳು.

20: >-
    ಪ್ರಪ್ರತ್ಯೇಕ ಭೇದವುಳ್ಳ ಎಲ್ಲ ಜೀವಿಗಳಲ್ಲಿ, ನಾಶವಿರದ ಭೇದವಿಲ್ಲದ ಒಬ್ಬನೇ ದೇವನನ್ನು ಕಾಣುವ
    ಜ್ಞಾನ ಸಾತ್ತ್ವಿಕ ಎಂದು ತಿಳಿ.

21: >-
    ಏಕದೇವನನ್ನು ತಿಳಿಯದೆ, ಎಲ್ಲ ಜೀವಿಗಳಲ್ಲಿ ಭೇದಮಾತ್ರದ ತಿಳಿವು ಅಂದರೆ ಪ್ರಪ್ರತ್ಯೇಕವಾದ
    ಬೇರೆ ಬೇರೆ ಧರ್ಮಗಳನ್ನು ತಿಳಿಯುವುದು ರಾಜಸ ಜ್ಞಾನ.

22: >-
    ಒಬ್ಬ ಜೀವನನ್ನೆ ಪೂರ್ಣನಾದ ದೇವನೆಂದು ತಿಳಿಯುವುದು, ಯುಕ್ತಿ ಇಲ್ಲದ ಜ್ಞಾನ, ತಪ್ಪುಕಲ್ಪನೆ
    ಉಳ್ಳದ್ದು, (ಹೆಚ್ಚು ಅಜ್ಞಾನವಿದ್ದು) ಸ್ವಲ್ಪ ಜ್ಞಾನವೂ ತಾಮಸ ಎಂದೆ ಹೇಳಲ್ಪಟ್ಟಿದೆ.

23: >-
    ತಾನು ಮಾಡಿದೆ ಎಂಬ ಅಭಿಮಾನವಿಲ್ಲದೆ, ಪ್ರೀತಿ-ಕೋಪಗಳಿಲ್ಲದೆ, ಫಲದ ಆಸೆ ಇಲ್ಲದೆ ಮಾಡಿದ ತನಗೆ
    ಹೇಳಿದ ಕರ್ಮ ಸಾತ್ತ್ವಿಕ ಎನಿಸುತ್ತದೆ.

24: >-
    ಫಲದ ಆಸೆಯಿಂದ ಅಥವಾ ತಾನು ಮಾಡಿದೆ ಎಂಬ ಅಭಿಮಾನದಿಂದ ಬಹಳ ಕಷ್ಟಪಟ್ಟು ಮಾಡಿದ ಕರ್ಮ ರಾಜಸ
    ಎನಿಸುತ್ತದೆ.

25: >-
    ಫಲ, ನಷ್ಟ, ಪೀಡೆ ಮತ್ತು ಪ್ರಯತ್ನಗಳನ್ನು ಯೋಚಿಸದೆ ತಪ್ಪುತಿಳಿವಿನಿಂದ ಮಾಡಿದ ಕರ್ಮ ತಾಮಸ
    ಎನಿಸಿದೆ.

26: >-
    ಫಲದ ಆಸೆ ಬಿಟ್ಟವನು, ನಾನು ಮಾಡಿದೆ ಎಂದು ಹೇಳಿಕೊಳ್ಳದವನು, ಧೈರ್ಯ-ಉತ್ಸಾಹಗಳಿಂದ ತುಂಬಿದವನು,
    ಕೆಲಸ ಆದರೂ-ಆಗದಿದ್ದರೂ ವಿಕಾರವಿಲ್ಲದವನು ಸಾತ್ತ್ವಿಕ ಕರ್ತೃ ಎನಿಸಿದ್ದಾನೆ.

27: >-
    ಕರ್ಮದ ಇಹ-ಪರ ಫಲಗಳನ್ನು ಬಯಸುವವ, ಜಿಪುಣ, ಹಿಂಸೆ ಪಡುವವ, ಮಡಿಯಿರದವ, ಫಲ ದೊರೆತಾಗ
    ಖುಷಿ ಪಡುವವ ಮತ್ತು ಸಿಗದಾಗ ದುಃಖಿಸುವವ ರಾಜಸ ಕರ್ತೃ ಎನಿಸಿದ್ದಾನೆ.

28: >-
    ಆಚಾರ ಕೆಟ್ಟವ, ಸಂಸ್ಕಾರವಿಲ್ಲದವ, ದುರಹಂಕಾರಿ, ಉದ್ಧಟ, ಮೋಸಗಾರ, ಸೋಮಾರಿ, ಸಂಕಟಪಡುವವ,
    ಕೆಲಸವನ್ನು ಮುಂದೆ ದೂಡುವವ ತಾಮಸ ಕರ್ತೃ ಎನಿಸಿದ್ದಾನೆ.

29: >-
    ಓ ಧನಂಜಯನೆ, ಮೂರು ಗುಣಗಳಿಂದ ಬುದ್ಧಿ ಮತ್ತು ಧೈರ್ಯವೂ ಮೂರು ರೀತಿ. ಇದರ ಪ್ರಪ್ರತ್ಯೇಕ
    ಪೂರ್ತಿ ವಿವರಣೆಯನ್ನು ಕೇಳು.

30: >-
    ಓ ಪಾರ್ಥನೆ, ಇಹ ಮತ್ತು ಪರದ ಧರ್ಮಗಳನ್ನು, ಮಾಡಬೇಕಾದ ಮತ್ತು ಮಾಡಬಾರದ ಕರ್ಮಗಳನ್ನು,
    ಹೆದರಬೇಕಾದ ಮತ್ತು ಹೆದರಬಾರದ ವಿಷಯಗಳನ್ನು, ಬಂಧನದ ಮತ್ತು ಬಿಡುಗಡೆಯ ಮಾರ್ಗವನ್ನು
    ತಿಳಿಯಬಲ್ಲ ಬುದ್ಧಿಯು ಸಾತ್ವಿಕ.

31: >-
    ಓ ಪಾರ್ಥನೆ, ಧರ್ಮ ಮತ್ತು ಅಧರ್ಮವನ್ನು, ಹಾಗೆಯೆ ಮಾಡಬೇಕಾದ ಮತ್ತು ಮಾಡಬಾರದ ಕರ್ಮಗಳನ್ನು
    ಸರಿಯಾಗಿ ನಿರ್ಣಯಿಸಲಾಗದ ಬುದ್ಧಿ ರಾಜಸವು.

32: >-
    ಓ ಪಾರ್ಥನೆ, ತಮೋಗುಣ ಆವರಿಸಿದಾಗ ಅಧರ್ಮವನ್ನೇ ಧರ್ಮವೆಂದು ತಿಳಿಯುವನು. ಹೀಗೆ ಎಲ್ಲ
    ಸಂಗತಿಗಳನ್ನೂ ವಿಪರೀತವಾಗಿಯೆ ತಿಳಿಯುವ ಬುದ್ಧಿ ತಾಮಸ.

33: >-
    ಓ ಪಾರ್ಥನೆ, ಯೋಗದಿಂದಾಗಿ ತಪ್ಪೆಸಗದ ಧೈರ್ಯವು ಮನಸ್ಸಿನ, ಪ್ರಾಣಗಳ ಮತ್ತು ಇಂದ್ರಿಯಗಳ
    ಕೆಲಸಗಳನ್ನು ಸರಿಯಾಗಿ ಧರಿಸುತ್ತದೆ. ಇದು ಸಾತ್ತ್ವಿಕ ಧೈರ್ಯ.

34: >-
    ಪೃಥೆಯ ಮಗನಾದ ಓ ಅರ್ಜುನನೆ, ಧರ್ಮ-ಕಾಮ-ಅರ್ಥಗಳನ್ನು ಚೆನ್ನಾಗಿ ಗಮನಿಸುವ ಧೈರ್ಯ ಅತಿಯಾದ
    ಆಸಕ್ತಿಯಿಂದ ಫಲವನ್ನೂ ಬಯಸುವುದು. ಇದು ರಾಜಸ ಧೈರ್ಯ.

35: >-
    ಓ ಪಾರ್ಥನೆ, ನಿದ್ದೆ, ಹೆದರಿಕೆ, ದುಃಖ, ಸಂಕಟ, ಸೊಕ್ಕುಗಳನ್ನು ಬಿಟ್ಟಿರದ ಕೆಟ್ಟಬುದ್ಧಿಯವನ
    ಧೈರ್ಯವು ತಾಮಸವು.

37: >-
    ಓ ಭರತಶ್ರೇಷ್ಠನೆ, ಮೂರು ಬಗೆಯ ಸುಖವನ್ನು ನನ್ನಿಂದ ಈಗ ಕೇಳು - ಮಾಡುತ್ತ ಮಾಡುತ್ತ ಖುಷಿಕೊಡುವ,
    ದುಃಖವನ್ನು ನಿಶ್ಚಯವಾಗಿ ತೆಗೆಯುವ ಸುಖವಿದು, ಮೊದಮೊದಲು ವಿಷದಂತೆ ಅಪ್ರಿಯವಾಗಿ ಕೊನೆಗೆ
    ಅಮೃತದಂತೆ ಪ್ರಿಯವಾಗಲಿದೆ. ತನ್ನ ಬುದ್ಧಿಯು ತಿಳಿಯಾದಾಗ ದೇವನ ಅನುಗ್ರಹದಿಂದ ಬರುವ ಸುಖ
    ಸಾತ್ತ್ವಿಕ.

38: >-
    ವಿಷಯಗಳ ಮತ್ತು ಇಂದ್ರಿಯಗಳ ಸಂಪರ್ಕದಿಂದ ಆದ ಸುಖವಿದು. ಆರಂಭದಲ್ಲಿ ಅಮೃತದಂತೆ ರುಚಿಕರ,
    ಫಲದಲ್ಲಿ ವಿಷದಂತೆ ವಿಕಾರಗೊಳಿಸುವ ಸುಖ ರಾಜಸವು.

39: >-
    ನಿದ್ದೆ, ಸೋಮಾರಿತನ, ಎಚ್ಚರಗೇಡಿತನಗಳಿಂದ ಸಿಗುವ ಸುಖ ಮೊದಲು ಮತ್ತೆ ಕೊನೆಗೂ ತನ್ನನ್ನೆ
    ಭ್ರಮೆಗೊಳಪಡಿಸುವುದು. ಇದು ತಾಮಸ ಸುಖ.

40: >-
    ಭೂಮಿಯಲ್ಲಾಗಲಿ ಮತ್ತೆ ಸ್ವರ್ಗದ ದೇವತೆಗಳಲ್ಲಾಗಲಿ ಯಾವೊಬ್ಬ ಜೀವಿಯೂ ಪ್ರಕೃತಿಯಿಂದ ಉಂಟಾದ
    ಈ ಮೂರು ಗುಣಗಳಿಂದ ಬಿಡುಗಡೆ ಪಡೆದವನು ಇಲ್ಲ.

41: >-
    ಓ ಪರಂತಪನೆ, ಬ್ರಾಹ್ಮಣ, ಕ್ಷತ್ರಿಯ, ವೈಶ್ಯ ಮತ್ತು ಶೂದ್ರರ ಕರ್ಮಗಳೂ (ಅವರವರ)
    ಸ್ವಭಾವದಿಂದ ಉಂಟಾದ ಗುಣಗಳಿಂದಾಗಿ ಬೇರೆ ಬೇರೆ ಆಗಿವೆ.

42: >-
    ದೇವನಲ್ಲಿ ನಿಷ್ಠೆ, ಇಂದ್ರಿಯನಿಗ್ರಹ, ಉಪವಾಸಾದಿ ವ್ರತಗಳು, ಮೈಮನಗಳ ಮಡಿ, ಕ್ಷಮೆ, ನೇರ
    ನಡೆ-ನುಡಿ, ಜ್ಞಾನ-ವಿಜ್ಞಾನ ಮತ್ತು ಆಸ್ತಿಕತೆ ಇವು ಬ್ರಾಹ್ಮಣ ಸ್ವಭಾವದ ಸಹಜ ಕರ್ಮಗಳು.

43: >-
    ಶೂರತನ, ಬಲ, ಧೈರ್ಯ, ದಕ್ಷತೆ, ಹೋರಾಟದಲ್ಲಿ ಹಿಂದೆ ಓಡದಿರುವುದು, ದಾನ ಮತ್ತು ಒಡೆತನ ಇವು
    ಕ್ಷತ್ರಿಯ ಸ್ವಭಾವದ ಸಹಜ ಕರ್ಮಗಳು.

44: >-
    ವ್ಯವಸಾಯ, ದನಸಾಕಣೆ ಮತ್ತು ವ್ಯಾಪಾರ ವೈಶ್ಯರ ಸ್ವಭಾವಸಹಜವಾದ ಕರ್ಮಗಳು. ಸೇವಾರೂಪವಾದ
    ಕೆಲಸ ಶೂದ್ರ ಸ್ವಭಾವಕ್ಕೆ ಸಹಜವಾದದ್ದು.

45: >-
    ತನ್ನತನ್ನ ಸಹಜ ಕರ್ಮದಲ್ಲಿ ಪೂರ್ತಿ ತೊಡಗಿದ ಮನುಷ್ಯ ಚೆನ್ನಾಗಿ ಸಿದ್ಧಿಯನ್ನು ಪಡೆಯುತ್ತಾನೆ.
    ತನ್ನ ಕೆಲಸದಲ್ಲಿ ನಿರತನು ಹೇಗೆ ಸಿದ್ಧಿಯನ್ನು ಪಡೆವನು ಎನ್ನುವುದನ್ನು ಕೇಳಿಕೊ.

46: >-
    ಎಲ್ಲರ ಎಲ್ಲ ಕರ್ಮಗಳನ್ನು (ಒಳಗಿನಿಂದ) ನಡೆಸುವ, ಇದೆಲ್ಲವನ್ನು (ಹೊರಗಿನಿಂದ) ವ್ಯಾಪಿಸಿರುವ
    ದೇವನನ್ನು ಮನುಷ್ಯನು ಸ್ವಭಾವಸಹಜವಾದ ಕರ್ಮದಿಂದ ಪೂರ್ತಿ ಆರಾಧಿಸಿ ಸಿದ್ಧಿಯನ್ನು ಹೊಂದುವನು.

47: >-
    ಚೆನ್ನಾಗಿ ನಡೆಸಿದ ಪರಧರ್ಮಕ್ಕಿಂತ ತನ್ನ ಸಹಜಧರ್ಮವು ಕೊರತೆ ಹೊಂದಿದ್ದರೂ ಶ್ರೇಷ್ಠವೇ ಆಗಿದೆ.
    ತನ್ನ ಸ್ವಭಾವಕ್ಕೆ ಸರಿಯಾದ ಕರ್ಮ ಮಾಡಿದಾಗ ಪಾಪ ಹೊಂದುವುದಿಲ್ಲ.

48: >-
    ಓ ಕೌಂತೇಯನೆ, ಸಹಜವಾದ ಕರ್ಮವನ್ನು ದೋಷ ಇದ್ದರೂ ಬಿಡಬಾರದು. ಬೆಂಕಿಯು ಹೊಗೆಯಿಂದ
    ಮುಚ್ಚಿಕೊಂಡಿರುವಂತೆ ಎಲ್ಲ ಕರ್ಮಗಳೂ ದೋಷದಿಂದಲೆ ಕೂಡಿರುತ್ತವೆ.

49: >-
    ಮನಸ್ಸನ್ನು ಗೆದ್ದು ಎಲ್ಲಿಯೂ ಬುದ್ಧಿಯನ್ನು ಅಂಟಿಸಿಕೊಳ್ಳದೆ ಆಸೆ ತೊರೆದವನು ಇಂಥ
    ಸಂನ್ಯಾಸದಿಂದ ಅನಿಷ್ಟಕರ್ಮಗಳ ನಾಶವೆಂಬ ಉತ್ತಮ ಸಿದ್ಧಿಯನ್ನು ಪಡೆಯುತ್ತಾನೆ.

50: >-
    ಓ ಕೌಂತೇಯನೆ, ಯಾವ ರೀತಿಯ ಸಿದ್ಧಿ ಪಡೆದವನು ಹೇಗೆ ಬ್ರಹ್ಮನನ್ನು ಹೊಂದುತ್ತಾನೆ
    ಎನ್ನುವುದನ್ನು ಸಂಗ್ರಹವಾಗಿ ನನ್ನಿಂದ ಕೇಳು. ಈ ಸಿದ್ಧಿ ಜ್ಞಾನದ ಕೊನೆಯ ಹಂತ.

51: >-
    ಶುದ್ಧವಾದ ಬುದ್ಧಿ ಇರಬೇಕು. ಧೈರ್ಯದಿಂದ ತನ್ನನ್ನೇ ಯಮ-ನಿಯಮಗಳಲ್ಲಿ ತೊಡಗಿಸಬೇಕು. ಶಬ್ದ
    ಮುಂತಾದ ಇಂದ್ರಿಯ ವಿಷಯಗಳನ್ನು ಬಿಡಬೇಕು. ಪ್ರೀತಿ-ವೈರಗಳನ್ನು ಬಿಟ್ಟಿರಬೇಕು.

52: >-
    ಏಕಾಂತದಲ್ಲಿ ಇರಬೇಕು. ಲಘು ಆಹಾರ ಸೇವಿಸಬೇಕು. ಮಾತು-ದೇಹ-ಮನಸ್ಸುಗಳನ್ನು ನಿಗ್ರಹಿಸಬೇಕು.
    ನಿತ್ಯವೂ ಧ್ಯಾನಯೋಗವನ್ನು ನಡೆಸುತ್ತ ವೈರಾಗ್ಯವನ್ನು ಹೊಂದಬೇಕು.

53: >-
    ಬಲಾತ್ಕಾರ, ಸೊಕ್ಕು, ಕಾಮ, ಕೋಪಗಳನ್ನು ಬಿಡಬೇಕು. ಯಾರಿಂದಲೂ ಏನನ್ನೂ ಪಡೆಯಬಾರದು.
    ನಾನು-ನನ್ನದು ಎಂಬ ಅಭಿಮಾನ ತೊರೆದು ಆನಂದವಾಗಿರಬೇಕು. ಆಗ ಮನಸ್ಸು ಬ್ರಹ್ಮನಲ್ಲಿ
    ನೆಲೆಗೊಳ್ಳುತ್ತದೆ.

54: >-
    ಬ್ರಹ್ಮನಲ್ಲಿ ನೆಲೆಸಿದವನು ಮನಸ್ಸು ಶಾಂತವಾಗಿ ಯಾವುದಕ್ಕೂ ದುಃಖಿಸುವುದಿಲ್ಲ, ಯಾವುದನ್ನೂ
    ಬಯಸುವುದಿಲ್ಲ. ಎಲ್ಲ ಜೀವಿಗಳಲ್ಲೂ ಸಮನಾಗಿದ್ದು ನನ್ನಲ್ಲಿ ಹೆಚ್ಚಿನ ಭಕ್ತಿಯನ್ನು
    ಹೊಂದುತ್ತಾನೆ.

55: >-
    ಭಕ್ತಿಯಿಂದ, ನಾನು ಎಂಥವನು! ನಿಜವಾಗಿ ನಾನು ಹೇಗಿದ್ದೇನೆ! ಎಂದು ನನ್ನನ್ನು ಪೂರ್ತಿ ಸರಿಯಾಗಿ
    ತಿಳಿಯುತ್ತಾನೆ. ಭಕ್ತಿಯಿಂದ ಸರಿಯಾಗಿ ನನ್ನನ್ನು ತಿಳಿದು ಅನಂತರ ನನ್ನನ್ನೆ ಸೇರುತ್ತಾನೆ.

56: >-
    ನನ್ನನ್ನೇ ಆಶ್ರಯಿಸಿದವನು, ಎಲ್ಲ ಕೆಲಸಗಳನ್ನೂ ಯಾವಾಗಲೂ ಮಾಡುತ್ತಿರುವವನು, ನನ್ನ
    ಅನುಗ್ರಹದಿಂದ ನಾಶವಿಲ್ಲದ ನಿತ್ಯವಾದ ಸ್ಥಾನವನ್ನು ಹೊಂದುತ್ತಾನೆ.

57: >-
    ಬುದ್ಧಿಪೂರ್ವಕ ಎಲ್ಲ ಕೆಲಸಗಳನ್ನು ನನಗೆ ಸಮರ್ಪಿಸಿ, ನಾನೇ ಸರ್ವೋತ್ತಮನೆಂದು ತಿಳಿದು
    ಜ್ಞಾನಯೋಗವನ್ನು ನಡೆಸಿ ನಿತ್ಯವೂ ನನ್ನನ್ನೆ ಯೋಚಿಸುವವನು ಆಗು.

58: >-
    ನನ್ನನ್ನೆ ಯೋಚಿಸುತ್ತ ನೀನು ನನ್ನ ಅನುಗ್ರಹದಿಂದ ಎಲ್ಲಾ ತೊಂದರೆಗಳನ್ನು ದಾಟುವೆ. ಮತ್ತೆ ನೀನು
    ಅಹಂಕಾರದಿಂದ ಕೇಳದಿದ್ದರೆ ನಾಶವಾಗುವೆ.

59: >-
    ದುರಹಂಕಾರದಿಂದ ಹೋರಾಡುವುದಿಲ್ಲ ಎಂದು ತಿಳಿದೆಯಾದರೆ, ನಿನ್ನ ಈ ಯೋಚನೆ ಸುಳ್ಳು. ನಿನ್ನನ್ನು
    ನಿನ್ನ ಸ್ವಭಾವವೆ ಹೋರಾಡಿಸುತ್ತದೆ.

60: >-
    ಓ ಕೌಂತೇಯನೆ, ಸ್ವಭಾವಸಹಜವಾದ ನಿನ್ನ ಕರ್ಮದಿಂದ ಕಟ್ಟಿಹಾಕಲ್ಪಟ್ಟಿರುವೆ. ಅಜ್ಞಾನದಿಂದಾಗಿ
    ಯಾವುದನ್ನು ಮಾಡಲು ಬಯಸುವುದಿಲ್ಲ ಅದನ್ನು ಗೊತ್ತಿಲ್ಲದೆಯೆ (ದೇವರ ವಶನಾಗಿ) ಮಾಡುವೆ.

61: >-
    ಓ ಅರ್ಜುನನೆ, ಎಲ್ಲ ಜೀವಿಗಳ ಹೃದಯದಲ್ಲಿ ದೇವರು ಇದ್ದಾನೆ. ವಿಶ್ವಯಂತ್ರವನ್ನು ಹತ್ತಿರುವ
    ಎಲ್ಲರನ್ನೂ ತನ್ನ ಇಚ್ಛೆಯಿಂದ - ಪ್ರಕೃತಿಯ ಮಾಯೆಯಿಂದ ತಿರುಗಿಸುತ್ತ ಇದ್ದಾನೆ.

62: >-
    ಓ ಭಾರತನೆ, ಪೂರ್ಣ ಭಕ್ತಿಯಿಂದ ಅವನನ್ನೆ ಶರಣು ಹೊಂದು. ಅವನ ಅನುಗ್ರಹದಿಂದ ಪೂರ್ಣಸುಖವನ್ನೂ
    ನಿತ್ಯವಾದ ತಾಣವನ್ನೂ ಹೊಂದುವೆ.

63: >-
    ಹೀಗೆ ನಿನಗೆ ನಾನು ಅತ್ಯಂತ ರಹಸ್ಯವಾದ ಜ್ಞಾನವನ್ನು ಹೇಳಿರುವೆ. ಇದನ್ನೆಲ್ಲ ವಿಮರ್ಶೆ ಮಾಡಿ
    ನಿನ್ನ ಇಚ್ಛೆಯಂತೆ ಮಾಡು.

64: >-
    ಎಲ್ಲಕ್ಕಿಂತ ಹೆಚ್ಚು ರಹಸ್ಯವಾದ ನನ್ನ ಈ ಉತ್ತಮ ಮಾತನ್ನು ಮತ್ತೊಮ್ಮೆ ಕೇಳು-ನೀನು ನನಗೆ
    ತುಂಬಾ ಪ್ರಿಯನು ಎಂದು. ಆದ್ದರಿಂದಲೆ ನಿನಗೆ ಒಳ್ಳೆಯದನ್ನು ಹೇಳುತ್ತಿದ್ದೇನೆ.

65: >-
    ನನ್ನಲ್ಲೆ ಮನಸ್ಸಿಡು. ನನ್ನ ಭಕ್ತನಾಗು, ನನ್ನನ್ನೆ ಪೂಜಿಸು. ನನ್ನನ್ನೇ ನಮಿಸು. ನನ್ನನ್ನೇ
    ಸೇರುವೆ. ನಿನಗೆ ಆಣೆ ಮಾಡಿ ಸತ್ಯ ಹೇಳುತ್ತಿದ್ದೇನೆ - ನನಗೆ ನೀನು ಇಷ್ಟ.

66: >-
    ಇತರ ಎಲ್ಲರ ಆಚರಣೆಗಳನ್ನು ಪೂರ್ತಿ ಬಿಟ್ಟು ನನ್ನನ್ನೊಬ್ಬನನ್ನೆ ಶರಣು ಹೊಂದು. ನಾನು
    ನಿನ್ನನ್ನು ಎಲ್ಲ ಪಾಪಗಳಿಂದಲೂ ಬಿಡುಗಡೆಗೊಳಿಸುತ್ತೇನೆ, ದುಃಖಿಸಬೇಡ.

67: >-
    ಇದನ್ನು ನೀನು ವ್ರತ-ಉಪವಾಸ ಮಾಡದವರಿಗೆ ಹೇಳಬೇಡ. ಭಕ್ತನಲ್ಲದವನಿಗೆ ಎಂದಿಗೂ ಹೇಳದಿರು.
    ಕೇಳುವ ಇಚ್ಛೆ ಇಲ್ಲದವನಿಗೂ ಹೇಳಬೇಡ. ನನ್ನ ಬಗ್ಗೆ ಮತ್ಸರ ಉಳ್ಳವರಿಗೂ ಹೇಳದಿರು.

68: >-
    ತುಂಬ ರಹಸ್ಯವಾದ ಇದನ್ನು ನನ್ನ ಭಕ್ತರಲ್ಲಿ ತಿಳಿಸುವವನು ನನ್ನಲ್ಲಿ ಶ್ರೇಷ್ಠ ಭಕ್ತಿಯನ್ನು
    ಮಾಡಿ ನನ್ನನ್ನೆ ಸೇರುವನು, ಸಂಶಯವಿಲ್ಲ.

69: >-
    ಮನುಷ್ಯರಲ್ಲಿ ಅವನಿಗಿಂತ ಹೆಚ್ಚು ಇಷ್ಟನು ನನಗೆ ಇನ್ನೊಬ್ಬನು ಇಲ್ಲ. ಅವನಿಗಿಂತ ಹೆಚ್ಚು
    ಇಷ್ಟನಾದ ಇನ್ನೊಬ್ಬ ಭೂಮಿಯಲ್ಲಿ ಮುಂದೆಯೂ ಹುಟ್ಟಲಾರ.

70: >-
    ಧರ್ಮಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ನಮ್ಮ ಈ ಪ್ರಶ್ನೋತ್ತರವನ್ನು ಅಧ್ಯಯನ ಮಾಡುವವನೂ ಆ ಜ್ಞಾನಯಜ್ಞದಿಂದ
    ನನ್ನನ್ನು ಪೂಜಿಸಿದನೆಂದೆ ನನ್ನ ಮತ.

71: >-
    ಶ್ರದ್ಧೆ ಉಳ್ಳ, ಮತ್ಸರಪಡದ ಮನುಷ್ಯನು ಕೇಳಿದರೂ ಅಂಥವನು ಪಾಪದಿಂದ ಬಿಡುಗಡೆ ಹೊಂದಿ
    ಪುಣ್ಯಕರ್ಮ ಮಾಡಿದವರ ಒಳ್ಳೆಯ ಲೋಕಗಳನ್ನು ಪಡೆದಾನು.

72: >-
    ಓ ಪಾರ್ಥನೆ, ಒಂದೇ ಕಡೆ ಗಮನವಿತ್ತು ಇದನ್ನು ನೀನು ಕೇಳಿದೆಯಾ? ಓ ಧನಂಜಯನೆ, ನಿನ್ನ
    ಅಜ್ಞಾನದ ಗೊಂದಲ ಪೂರ್ತಿ ಹೋಯಿತೆ?

73: >-
    ಅರ್ಜುನನು ಹೇಳಿದನು - ಅಚ್ಯುತನೆ, ಅಜ್ಞಾನ ಹೋಯಿತು. ನಿನ್ನ ಅನುಗ್ರಹದಿಂದ ನನಗೆ ನೆನಪು
    ಬಂತು. ಸಂಶಯ ಹೋಗಿ ಸರಿಯಾಗಿದ್ದೇನೆ. ನಿನ್ನ ಮಾತನ್ನು ನಡೆಸುವೆನು.

74: >-
    ಇಷ್ಟು ನಾನು ಮಹಾತ್ಮರಾದ ಕೃಷ್ಣ ಮತ್ತು ಅರ್ಜುನರ ಅಚ್ಚರಿಯ, ರೋಮಾಂಚನದ ಈ ಪ್ರಶ್ನೋತ್ತರವನ್ನು
    ಕೇಳಿದೆ.

75: >-
    ಶ್ರೀವೇದವ್ಯಾಸರ ಅನುಗ್ರಹದಿಂದ ನಾನು, ಈ ಅತಿರಹಸ್ಯ ವಿಷಯವಾದ ಯೋಗವನ್ನು, ಎಲ್ಲ ಯೋಗಗಳ
    ಒಡೆಯನಾದ ಕೃಷ್ಣನಿಂದ ನೇರ ಹೇಳುತ್ತಿರುವಾಗಲೆ ಕೇಳಿದೆನು.

76: >-
    ಓ ಧೃತರಾಷ್ಟ್ರರಾಜನೆ, ಕೃಷ್ಣಾರ್ಜುನರ ಅಚ್ಚರಿಯ ಈ ಪುಣ್ಯಪ್ರದವಾದ ಸಂಭಾಷಣೆಯನ್ನು
    ನೆನೆಯುತ್ತ ನೆನೆಯುತ್ತ ಮತ್ತೆ ಮತ್ತೆ ಖುಷಿಪಡುತ್ತಿದ್ದೇನೆ.

77: >-
    ಓ ರಾಜನೆ, ಕೃಷ್ಣನ ಆ ಅತ್ಯಾಶ್ಚರ್ಯದ ವಿಶ್ವರೂಪವನ್ನು ನೆನೆಯುತ್ತ ನೆನೆಯುತ್ತ ನನಗೆ ತುಂಬಾ
    ಬೆರಗಾಗುತ್ತಿದೆ. ಮತ್ತೆ ಮತ್ತೆ ಖುಷಿಪಡುತ್ತಿರುವೆನು.

78: >-
    ಯೋಗಗಳ ಒಡೆಯನಾದ ಕೃಷ್ಣನು ಇರುವಲ್ಲಿ, ಬಿಲ್ಲು ಹಿಡಿದ ಅರ್ಜುನನು ಇರುವಲ್ಲಿ, ಶ್ರೀಮಂತಿಕೆ,
    ಗೆಲುವು, ಏಳಿಗೆ ಮತ್ತು ಸ್ಥಿರವಾದ ನೀತಿ ಇದೆ ಎಂದು ನನ್ನ ಆಶಯ.

1: |-
    ಅನಾಶ್ರಿತಃ ಕರ್ಮ-ಫಲಂ ಕಾರ್ಯಂ ಕರ್ಮ ಕರೋತಿ ಯಃ ।
    ಸ ಸಂ-ನ್ಯಾಸೀ ಚ ಯೋಗೀ ಚ ನ ನಿರಗ್ನಿರ್ನ ಚಾಕ್ರಿಯಃ ॥

2: |-
    ಯಂ ಸಂ-ನ್ಯಾಸಮಿತಿ ಪ್ರಾಹುಃ ಯೋಗಂ ತಂ ವಿದ್ಧಿ ಪಾಂಡವ ।
    ನಹ್ಯಸಂ-ನ್ಯಸ್ತ-ಸಂಕಲ್ಪೋ ಯೋಗೀ ಭವತಿ ಕಶ್ಚನ ॥

3: |-
    ಆರುರುಕ್ಷೋರ್ಮುನೇರ್ಯೋಗಂ ಕರ್ಮ ಕಾರಣಮುಚ್ಯತೇ ।
    ಯೋಗಾರೂಢಸ್ಯ ತಸ್ಯೈವ ಶಮಃ ಕಾರಣಮುಚ್ಯತೇ ॥

4: |-
    ಯದಾ ಹಿ ನೇಂದ್ರಿಯಾರ್ಥೇಷು ನ ಕರ್ಮಸ್ವನು-ಷಜ್ಜತೇ ।
    ಸರ್ವ-ಸಂಕಲ್ಪ-ಸಂನ್ಯಾಸೀ ಯೋಗಾರೂಢಸ್ತದೋಚ್ಯತೇ ॥

5: |-
    ಉದ್ಧರೇದಾತ್ಮನಾಽಽತ್ಮಾನಂ ನಾಽತ್ಮಾನಮವಸಾದಯೇತ್ ।
    ಆತ್ಮೈವ ಹ್ಯಾತ್ಮನೋ ಬಂಧುಃ ಆತ್ಮೈವ ರಿಪುರಾತ್ಮನಃ ॥

6: |-
    ಬಂಧುರಾತ್ಮಾಽಽತ್ಮನಸ್ತಸ್ಯ ಯೇನಾಽತ್ಮೈವಾಽತ್ಮನಾ ಜಿತಃ ।
    ಅನಾತ್ಮನಸ್ತು ಶತ್ರುತ್ವೇ ವರ್ತೇತಾಽತ್ಮೈವ ಶತ್ರು-ವತ್ ॥

7: |-
    ಜಿತಾತ್ಮನಃ ಪ್ರಶಾಂತಸ್ಯ ಪರಮಾತ್ಮಾ ಸಮಾಹಿತಃ ।
    ಶೀತೋಷ್ಣ-ಸುಖ-ದುಃಖೇಷು ತಥಾ ಮಾನಾಪ-ಮಾನಯೋಃ ॥

8: |-
    ಜ್ಞಾನ-ವಿಜ್ಞಾನ-ತೃಪ್ತಾತ್ಮಾ ಕೂಟ-ಸ್ಥೋ ವಿಜಿತೇಂದ್ರಿಯಃ ।
    ಯುಕ್ತ ಇತ್ಯುಚ್ಯತೇ ಯೋಗೀ ಸಮ-ಲೋಷ್ಟಾಶ್ಮ-ಕಾಂಚನಃ ॥

9: |-
    ಸುಹೃನ್ಮಿತ್ರಾರ್ಯುದಾಸೀನ-ಮಧ್ಯಸ್ಥ-ದ್ವೇಷ್ಯ-ಬಂಧುಷು ।
    ಸಾಧುಷ್ವಪಿ ಚ ಪಾಪೇಷು ಸಮ-ಬುದ್ಧಿರ್ವಿಶಿಷ್ಯತೇ ॥

10: |-
    ಯೋಗೀ ಯುಂಜೀತ ಸತತಂ ಆತ್ಮಾನಂ ರಹಸಿ ಸ್ಥಿತಃ ।
    ಏಕಾಕೀ ಯತ-ಚಿತ್ತಾತ್ಮಾ ನಿರಾಶೀರಪರಿ-ಗ್ರಹಃ ॥

11: |-
    ಶುಚೌ ದೇಶೇ ಪ್ರತಿಷ್ಠಾಪ್ಯ ಸ್ಥಿರಮಾಸನಮಾತ್ಮನಃ ।
    ನಾತ್ಯುಚ್ಛ್ರಿತಂ ನಾತಿ-ನೀಚಂ ಚೇಲಾಜಿನ-ಕುಶೋತ್ತರಮ್ ॥

12: |-
    ತತ್ರೈಕಾಗ್ರಂ ಮನಃ ಕೃತ್ವಾ ಯತ-ಚಿತ್ತೇಂದ್ರಿಯ-ಕ್ರಿಯಃ ।
    ಉಪವಿಶ್ಯಾಽಸನೇ ಯುಂಜ್ಯಾತ್ ಯೋಗಮಾತ್ಮ-ವಿಶುದ್ಧಯೇ ॥

13: |-
    ಸಮಂ ಕಾಯ-ಶಿರೋ-ಗ್ರೀವಂ ಧಾರಯನ್ನಚಲಂ ಸ್ಥಿರಃ ।
    ಸಂಪ್ರೇಕ್ಷ್ಯ ನಾಸಿಕಾಗ್ರಂ ಸ್ವಂ ದಿಶಶ್ಚಾನವ-ಲೋಕಯನ್ ॥

14: |-
    ಪ್ರ-ಶಾಂತಾತ್ಮಾ ವಿಗತ-ಭೀಃ ಬ್ರಹ್ಮ-ಚಾರಿ-ವ್ರತೇ ಸ್ಥಿತಃ ।
    ಮನಃ ಸಂಯಮ್ಯ ಮಚ್ಚಿತ್ತೋ ಯುಕ್ತ ಆಸೀತ ಮತ್ಪರಃ ॥

15: |-
    ಯುಂಜನ್ನೇವಂ ಸದಾಽಽತ್ಮಾನಂ ಯೋಗೀ ನಿಯತ-ಮಾನಸಃ ।
    ಶಾಂತಿಂ ನಿರ್ಬಾಣ-ಪರಮಾಂ ಮತ್ಸಂಸ್ಥಾಮಧಿ-ಗಚ್ಛತಿ ॥

16: |-
    ನಾತ್ಯಶ್ನತಸ್ತು ಯೋಗೋಽಸ್ತಿ ನ ಚಾತ್ಯಂತಮನಶ್ನತಃ ।
    ನ ಚಾತಿ-ಸ್ವಪ್ನ-ಶೀಲಸ್ಯ ಜಾಗ್ರತೋ ನೈವ ಚಾರ್ಜುನ ॥

17: |-
    ಯುಕ್ತಾಹಾರ-ವಿಹಾರಸ್ಯ ಯುಕ್ತ-ಚೇಷ್ಟಸ್ಯ ಕರ್ಮಸು ।
    ಯುಕ್ತ-ಸ್ವಪ್ನಾವ-ಬೋಧಸ್ಯ ಯೋಗೋ ಭವತಿ ದುಃಖ-ಹಾ ॥

18: |-
    ಯದಾ ವಿ-ನಿಯತಂ ಚಿತ್ತಂ ಆತ್ಮನ್ಯೇವಾವ-ತಿಷ್ಠತೇ ।
    ನಿಸ್ಪೃಹಃ ಸರ್ವ-ಕಾಮೇಭ್ಯೋ ಯುಕ್ತ ಇತ್ಯುಚ್ಯತೇ ತದಾ ॥

19: |-
    ಯಥಾ ದೀಪೋ ನಿವಾತ-ಸ್ಥೋ ನೇಂಗತೇ ಸೋಪಮಾ ಮತಾ ।
    ಯೋಗಿನೋ ಯತ-ಚಿತ್ತಸ್ಯ ಯುಂಜತೋ ಯೋಗಮಾತ್ಮನಃ ॥

20: |-
    ಯತ್ರೋಪ-ರಮತೇ ಚಿತ್ತಂ ನಿ-ರುದ್ಧಂ ಯೋಗ-ಸೇವಯಾ ।
    ಯತ್ರ ಚೈವಾಽತ್ಮನಾಽಽತ್ಮಾನಂ ಪಶ್ಯನ್ನಾತ್ಮನಿ ತುಷ್ಯತಿ ॥

21: |-
    ಸುಖಮಾತ್ಯಂತಿಕಂ ಯತ್ತತ್ ಬುದ್ಧಿ-ಗ್ರಾಹ್ಯಮತೀಂದ್ರಿಯಮ್ ।
    ವೇತ್ತಿ ಯತ್ರ ನ ಚೈವಾಯಂ ಸ್ಥಿತಶ್ಚಲತಿ ತತ್ತ್ವತಃ ॥

22: |-
    ಯಂ ಲಬ್ಧ್ವಾ ಚಾಪರಂ ಲಾಭಂ ಮನ್ಯತೇ ನಾಧಿಕಂ ತತಃ ।
    ಯಸ್ಮಿನ್ ಸ್ಥಿತೋ ನ ದುಃಖೇನ ಗುರುಣಾಽಪಿ ವಿ-ಚಾಲ್ಯತೇ ॥

23: |-
    ತಂ ವಿದ್ಯಾದ್ ದುಃಖ-ಸಂಯೋಗ-ವಿಯೋಗಂ ಯೋಗ-ಸಂಜ್ಞಿತಮ್ ।
    ಸ ನಿಶ್ಚಯೇನ ಯೋಕ್ತವ್ಯೋ ಯೋಗೋ ನಿರ್ವಿಣ್ಣ-ಚೇತಸಾ ॥

24: |-
    ಸಂಕಲ್ಪ-ಪ್ರಭವಾನ್ ಕಾಮಾನ್ ತ್ಯಕ್ತ್ವಾ ಸರ್ವಾನಶೇಷತಃ ।
    ಮನಸೈವೇಂದ್ರಿಯ-ಗ್ರಾಮಂ ವಿ-ನಿಯಮ್ಯ ಸಮಂತತಃ ॥

25: |-
    ಶನೈಃ-ಶನೈರುಪ-ರಮೇತ್ ಬುದ್ಧ್ಯಾಧೃತಿ-ಗೃಹೀತಯಾ ।
    ಆತ್ಮ-ಸಂಸ್ಥಂ ಮನಃ ಕೃತ್ವಾ ನ ಕಿಂಚಿದಪಿ ಚಿಂತಯೇತ್ ॥

26: |-
    ಯತೋ ಯತೋ ನಿಶ್ಚರತಿ ಮನಶ್ಚಂಚಲಮಸ್ಥಿರಮ್ ।
    ತತಸ್ತತೋ ನಿಯಮ್ಯೈತತ್ ಆತ್ಮನ್ಯೇವ ವಶಂ ನಯೇತ್ ॥

27: |-
    ಪ್ರಶಾಂತ-ಮನಸಂ ಹ್ಯೇನಂ ಯೋಗಿನಂ ಸುಖಮುತ್ತಮಮ್ ।
    ಉಪೈತಿ ಶಾಂತ-ರಜಸಂ ಬ್ರಹ್ಮ-ಭೂತಮಕಲ್ಮಷಮ್ ॥

28: |-
    ಏವಂ ಯುಂಜನ್ ಸದಾತ್ಮಾನಂ ಯೋಗೀ ವಿಗತ-ಕಲ್ಮಷಃ ।
    ಸುಖೇನ ಬ್ರಹ್ಮ-ಸಂಸ್ಪರ್ಶಂ ಅತ್ಯಂತಂ ಸುಖಮಶ್ನುತೇ ॥

29: |-
    ಸರ್ವ-ಭೂತ-ಸ್ಥಮಾತ್ಮಾನಂ ಸರ್ವ-ಭೂತಾನಿ ಚಾಽತ್ಮನಿ ।
    ಈಕ್ಷತೇ ಯೋಗ-ಯುಕ್ತಾತ್ಮಾ ಸರ್ವತ್ರ ಸಮ-ದರ್ಶನಃ ॥

30: |-
    ಯೋ ಮಾಂ ಪಶ್ಯತಿ ಸರ್ವತ್ರ ಸರ್ವಂ ಚ ಮಯಿ ಪಶ್ಯತಿ ।
    ತಸ್ಯಾಹಂ ನ ಪ್ರಣಶ್ಯಾಮಿ ಸ ಚ ಮೇ ನ ಪ್ರಣಶ್ಯತಿ ॥

31: |-
    ಸರ್ವ-ಭೂತ-ಸ್ಥಿತಂ ಯೋ ಮಾಂ ಭಜತ್ಯೇಕತ್ವಮಾಸ್ಥಿತಃ ।
    ಸರ್ವಥಾ ವರ್ತಮಾನೋಽಪಿ ಸ ಯೋಗೀ ಮಯಿ ವರ್ತತೇ ॥

32: |-
    ಆತ್ಮೌಪಮ್ಯೇನ ಸರ್ವತ್ರ ಸಮಂ ಪಶ್ಯತಿ ಯೋಽರ್ಜುನ ।
    ಸುಖಂ ವಾ ಯದಿ ವಾ ದುಃಖಂ ಸ ಯೋಗೀ ಪರಮೋ ಮತಃ ॥

33: |-
    ಯೋಽಯಂ ಯೋಗಸ್ತ್ವಯಾ ಪ್ರೋಕ್ತಃ ಸಾಮ್ಯೇನ ಮಧು-ಸೂದನ ।
    ಏತಸ್ಯಾಹಂ ನ ಪಶ್ಯಾಮಿ ಚಂಚಲತ್ವಾತ್ ಸ್ಥಿತಿಂ ಸ್ಥಿರಾಮ್ ॥

34: |-
    ಚಂಚಲಂ ಹಿ ಮನಃ ಕೃಷ್ಣ ಪ್ರಮಾಥಿ ಬಲ-ವದ್ ದೃಢಮ್ ।
    ತಸ್ಯಾಹಂ ನಿಗ್ರಹಂ ಮನ್ಯೇ ವಾಯೋರಿವ ಸು-ದುಷ್ಕರಮ್ ॥

35: |-
    ಅಸಂಶಯಂ ಮಹಾಬಾಹೋ ಮನೋ ದುರ್ನಿಗ್ರಹಂ ಚಲಮ್ ।
    ಅಭ್ಯಾಸೇನ ತು ಕೌಂತೇಯ ವೈರಾಗ್ಯೇಣ ಚ ಗೃಹ್ಯತೇ ॥

36: |-
    ಅಸಂ-ಯತಾತ್ಮನಾ ಯೋಗೋ ದುಷ್ಪ್ರಾಪ ಇತಿ ಮೇ ಮತಿಃ ।
    ವಶ್ಯಾತ್ಮನಾ ತು ಸತತಂ ಶಕ್ಯೋಽವಾಪ್ತುಮಶೇಷತಃ ॥

37: |-
    ಅಯತಿಃ ಶ್ರದ್ಧಯೋಪೇತೋ ಯೋಗಾಚ್ಚಲಿತ-ಮಾನಸಃ ।
    ಅಪ್ರಾಪ್ಯ ಯೋಗ-ಸಂಸಿದ್ಧಿಂ ಕಾಂ ಗತಿಂ ಕೃಷ್ಣ ಗಚ್ಛತಿ ॥

38: |-
    ಕಚ್ಚಿನ್ನೋಭಯ-ವಿಭ್ರಷ್ಟಃ ಛಿನ್ನಾಭ್ರಮಿವ ನಶ್ಯತಿ ।
    ಅಪ್ರತಿಷ್ಠೋ ಮಹಾಬಾಹೋ ವಿಮೂಢೋ ಬ್ರಹ್ಮಣಃ ಪಥಿ ॥

39: |-
    ಏತನ್ಮೇ ಸಂಶಯಂ ಕೃಷ್ಣ ಚ್ಛೇತ್ತುಮರ್ಹಸ್ಯಶೇಷತಃ ।
    ತ್ವದನ್ಯಃ ಸಂಶಯಸ್ಯಾಸ್ಯ ಛೇತ್ತಾ ನ ಹ್ಯುಪಪದ್ಯತೇ ॥

40: |-
    ಪಾರ್ಥ ನೈವೇಹ ನಾಮುತ್ರ ವಿನಾಶಸ್ತಸ್ಯ ವಿದ್ಯತೇ ।
    ನಹಿ ಕಲ್ಯಾಣ-ಕೃತ್ ಕಶ್ಚಿದ್ ದುರ್ಗತಿಂ ತಾತ ಗಚ್ಛತಿ ॥

41: |-
    ಪ್ರಾಪ್ಯ ಪುಣ್ಯ-ಕೃತಾಂ ಲೋಕಾನ್ ಉಷಿತ್ವಾ ಶಾಶ್ವತೀಃ ಸಮಾಃ ।
    ಶುಚೀನಾಂ ಶ್ರೀಮತಾಂ ಗೇಹೇ ಯೋಗ-ಭ್ರಷ್ಟೋಽಭಿ-ಜಾಯತೇ ॥

42: |-
    ಅಥವಾ ಯೋಗಿನಾಮೇವ ಕುಲೇ ಭವತಿ ಧೀ-ಮತಾಮ್ ।
    ಏತದ್ಧಿ ದುರ್ಲಭ-ತರಂ ಲೋಕೇ ಜನ್ಮ ಯದೀದೃಶಮ್ ॥

43: |-
    ತತ್ರ ತಂ ಬುದ್ಧಿ-ಸಂಯೋಗಂ ಲಭತೇ ಪೌರ್ವದೈಹಿಕಮ್ ।
    ಯತತೇ ಚ ತತೋ ಭೂಯಃ ಸಂಸಿದ್ಧೌ ಕುರು-ನಂದನ ॥

44: |-
    ಪೂರ್ವಾಭ್ಯಾಸೇನ ತೇನೈವ ಹ್ರಿಯತೇ ಹ್ಯವಶೋಽಪಿ ಸಃ ।
    ಜಿಜ್ಞಾಸುರಪಿ ಯೋಗಸ್ಯ ಶಬ್ದ-ಬ್ರಹ್ಮಾತಿ-ವರ್ತತೇ ॥

45: |-
    ಪ್ರಯತ್ನಾದ್ ಯತಮಾನಸ್ತು ಯೋಗೀ ಸಂಶುದ್ಧ-ಕಿಲ್ಬಿಷಃ ।
    ಅನೇಕ-ಜನ್ಮ-ಸಂಸಿದ್ಧಃ ತತೋ ಯಾತಿ ಪರಾಂ ಗತಿಮ್ ॥

46: |-
    ತಪಸ್ವಿಭ್ಯೋಽಧಿಕೋ ಯೋಗೀ ಜ್ಞಾನಿಭ್ಯೋಽಪಿ ಮತೋಽಧಿಕಃ ।
    ಕರ್ಮಿಭ್ಯಶ್ಚಾಧಿಕೋ ಯೋಗೀ ತಸ್ಮಾದ್ ಯೋಗೀ ಭವಾರ್ಜುನ ॥

47: |-
    ಯೋಗಿನಾಮಪಿ ಸರ್ವೇಷಾಂ ಮದ್ಗತೇನಾಂತರಾತ್ಮನಾ ।
    ಶ್ರ್ರದ್ಧಾ-ವಾನ್ ಭಜತೇ ಯೋ ಮಾಂ ಸ ಮೇ ಯುಕ್ತ-ತಮೋ ಮತಃ ॥

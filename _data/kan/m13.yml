1: >-
    ಅರ್ಜುನನು ಹೇಳಿದನು - ಓ ಕೇಶವನೆ, ಪ್ರಕೃತಿ, ಪುರುಷ, ಕ್ಷೇತ್ರ, ಕ್ಷೇತ್ರಜ್ಞ, ಜ್ಞಾನ
    ಮತ್ತು ಜ್ಞೇಯ ಇವುಗಳನ್ನು ತಿಳಿಯಲು ಬಯಸುತ್ತೇನೆ.

2: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಓ ಕೌಂತೇಯನೆ, ಈ ಶರೀರ ಕ್ಷೇತ್ರ ಎನಿಸಿದೆ. ಕ್ಷೇತ್ರವನ್ನು
    ತಿಳಿದವನನ್ನು ಕ್ಷೇತ್ರಜ್ಞ ಎಂದು ಜ್ಞಾನಿಗಳು ಹೇಳುತ್ತಾರೆ.

3: >-
    ಓ ಭಾರತನೆ, ಎಲ್ಲ ಕ್ಷೇತ್ರಗಳಲ್ಲೂ ನನ್ನನ್ನೆ ಕ್ಷೇತ್ರಜ್ಞನೆಂದು ತಿಳಿ. ಕ್ಷೇತ್ರ ಮತ್ತು
    ಕ್ಷೇತ್ರಜ್ಞರ ತಿಳಿವೇ ಜ್ಞಾನ ಎಂದು ನನ್ನ ಅಭಿಪ್ರಾಯ.

4: >-
    ಆ ಕ್ಷೇತ್ರ ಎಂದರೆ ಏನು? ಎಂಥದು? ಅದರ ವಿಕಾರಗಳು ಏನು? ಅದರ ಪ್ರೇರಕ ಶಕ್ತಿ ಯಾರು?
    ಕ್ಷೇತ್ರಜ್ಞನು ಎಂಥವನು? ಅವನ ಮಹಿಮೆಗಳೇನು? ಇದನ್ನೆಲ್ಲ ಸಂಕ್ಷೇಪವಾಗಿ ನನ್ನಿಂದ ಕೇಳು.

5: >-
    ಈ ವಿಷಯ, ಬೇರೆ ಬೇರೆ ಮಂತ್ರಗಳಿಂದ ಮತ್ತೆ ಯುಕ್ತಿಯಿಂದ ನಿರ್ಣಯಿಸಲ್ಪಟ್ಟ ಬ್ರಹ್ಮಸೂತ್ರದ
    ಪದಗಳಿಂದ ಬಹಳ ರೀತಿಯಲ್ಲಿ ಋಷಿಗಳಿಂದ ಪ್ರಪ್ರತ್ಯೇಕವಾಗಿ ಹೇಳಲ್ಪಟ್ಟಿದೆ.

7: >-
    ಇವು ಒಟ್ಟು ೨೪ ಕ್ಷೇತ್ರಗಳು (ಜಡ ಮತ್ತು ಜೀವಗಳು) - ಮಣ್ಣು (ಭೂದೇವಿ), ನೀರು (ಬುಧ),
    ಬೆಂಕಿ (ಪಾವಕ) ಗಾಳಿ (ವಾಯುಸುತ ಮರೀಚಿ) ಆಕಾಶ (ಗಣಪತಿ) ಎಂಬ ಐದು ಭೂತಗಳು. ಅಹಂಕಾರತತ್ವ
    (ಶಿವ) ಬುದ್ಧಿತತ್ವ (ಜೀವಮಾನಿ ಚತುರ್ಮುಖ) ಅವ್ಯಕ್ತತತ್ವ (ಶ್ರೀದೇವಿ) ಮತ್ತು ಹನ್ನೊಂದು ಇಂದ್ರಿಯಗಳು - 
    ಕಿವಿ (ಚಂದ್ರ), ಚರ್ಮ (ವಾಯುಸುತ ಮರುತ್), ಕಣ್ಣು (ಸೂರ್ಯ), ನಾಲಿಗೆ (ವರುಣ), ಮೂಗು (ಅಶ್ವಿಗಳು),
    ಬಾಯಿ (ಅಗ್ನಿ), ಕೈಗಳು (ಇಂದ್ರ), ಕಾಲುಗಳು (ಇಂದ್ರಪುತ್ರರು ಜಯಂತ ಮತ್ತು ಶಂಭು), ಮಲಮೂತ್ರ ವಿಸರ್ಗದ
    ಪಾಯು (ಯಮ) ಮತ್ತು ಉಪಸ್ಥ (ದಕ್ಷ), ಮನಸ್ಸು (ಕಾಮ ಮತ್ತು ಅನಿರುದ್ಧ) ಮತ್ತು ಐದು ಜ್ಞಾನೇಂದ್ರಿಯ
    ವಿಷಯಗಳು - ಶಬ್ದ, ಸ್ಪರ್ಶ, ರೂಪ, ರಸ, ಗಂಧಗಳು (ರುದ್ರಪುತ್ರರಾದ ಪ್ರಾಣ, ಅಪಾನ, ವ್ಯಾನ, ಉದಾನ,
    ಸಮಾನರು ಮತ್ತು ಸುಪರ್ಣಿ, ವಾರುಣಿ, ಪಾರ್ವತಿಯರು). ಇವು ಏಳು ವಿಕಾರಗಳು - ಬಯಕೆ (ಭಾರತಿ), ವೈರ (ದ್ವಾಪರ), ಸುಖ (ಮುಖ್ಯಪ್ರಾಣ),
    ದುಃಖ (ಕಲಿ), ಪೂರ್ತಿ ಶರೀರ (ದೇಹಾಭಿಮಾನಿ ಜೀವ), ಸ್ಮರಣೆ (ಶ್ರೀದೇವಿ), ಧೈರ್ಯ (ಸರಸ್ವತಿ). ಹೀಗೆ
    ವಿಕಾರಗಳೊಡನೆ ಕ್ಷೇತ್ರವನ್ನು ಸಂಗ್ರಹವಾಗಿ ಹೇಳಿಯಾಯಿತು.

8: >-
    ಬಿಂಕ ಬಿಡುವುದು, ಇಲ್ಲದ ದೊಡ್ಡತನ ತೋರಿಸದಿರುವುದು, ಹಿಂಸೆ ಮಾಡದಿರುವುದು, ಸೈರಣೆ, ನೇರ
    ನಡೆ-ನುಡಿ, ಗುರುಸೇವೆ, ದೇಹ ಮತ್ತು ಮನದ ಶುದ್ಧಿ, ಸ್ಥಿರವಾದ ನಿರ್ಣಯ, ಮನೋನಿಗ್ರಹ.

9: >-
    ಇಂದ್ರಿಯ ವಿಷಯಗಳಲ್ಲಿ ಅನಾಸಕ್ತಿ, ಅಹಂಕಾರ ಪಡದಿರುವುದು, ಹುಟ್ಟು-ಸಾವು-ಮುಪ್ಪು-ರೋಗ-ನೋವುಗಳೆಂಬ
    ದೋಷಗಳನ್ನು ನಿತ್ಯ ಗಮನಿಸುವುದು.

10: >-
    ಅಂಟಿಕೊಳ್ಳದಿರುವುದು, ಮಕ್ಕಳು - ಹೆಂಡತಿ - ಮನೆ ಮುಂತಾದವುಗಳನ್ನು ಅತಿಯಾಗಿ
    ಹಚ್ಚಿಕೊಳ್ಳದಿರುವುದು, ಇಷ್ಟ-ಅನಿಷ್ಟಗಳು ಉಂಟಾದಾಗ ಯಾವಾಗಲೂ ಮನಸ್ಸು ಏರುಪೇರು ಆಗದಿರುವುದು.

11: >-
    ಬೇರೆ ದೇವತೆಗಳೆಡೆಗೆ ಸಾಗದ, ಬೇರೆ ಕಾರಣಗಳಿಗೆ ಅಂಟದ ನನ್ನಲ್ಲೆ ನೆಲೆಸಿದ ಭಕ್ತಿ, ಏಕಾಂತ
    ವಾಸ, ಜನರ ಗುಂಪಿನಲ್ಲಿ ಸೇರದಿರುವುದು

12: >-
    ನಿತ್ಯವೂ ಪರಮಾತ್ಮನ ಜ್ಞಾನವನ್ನು ಬಯಸುವುದು, ಅಪರೋಕ್ಷ ಜ್ಞಾನಕ್ಕಾಗಿ ಶಾಸ್ತ್ರಗಳ
    ಅಧ್ಯಯನ, ಇವು ಇಪ್ಪತ್ತು ಜ್ಞಾನ ಮತ್ತು ಜ್ಞಾನಸಾಧನಗಳು ಹೇಳಲ್ಪಟ್ಟವು. ಇದಕ್ಕಿಂತ
    ಬೇರೆಯಾದದ್ದು ಅಜ್ಞಾನ ಮತ್ತು ಅಜ್ಞಾನದ ದಾರಿ.

13: >-
    ಯಾವುದನ್ನು ತಿಳಿದಾಗ ಮೋಕ್ಷವನ್ನು ಪಡೆಯುವನೋ ಅಂಥ ಜ್ಞೇಯವನ್ನು ಹೇಳುತ್ತೇನೆ. ಹುಟ್ಟು
    ಇಲ್ಲದ ಪರಬ್ರಹ್ಮವೆ ಜ್ಞೇಯ. ಅದು ಸತ್ (ಕಣ್ಣಿಗೆ ಕಾಣುವ ಮಣ್ಣು-ನೀರು-ಬೆಂಕಿ) ಅಲ್ಲ. ಅಸತ್
    (ಕಾಣದ ಗಾಳಿ ಆಕಾಶ) ಅಲ್ಲ ಎಂದು ಹೇಳಲ್ಪಟ್ಟಿದೆ.

14: >-
    ಅದು ಎಲ್ಲೆಡೆಯೂ, ಕೈ-ಕಾಲುಗಳು, ಕಣ್ಣು-ತಲೆ-ಬಾಯಿ-ಕಿವಿಗಳು ಉಳ್ಳದ್ದು. ಪ್ರಪಂಚದಲ್ಲಿ
    ಎಲ್ಲವನ್ನೂ ಆವರಿಸಿಬಿಟ್ಟಿದೆ.

15: >-
    ಅದು ಎಲ್ಲ ಇಂದ್ರಿಯಗಳನ್ನು ಎಲ್ಲ ವಿಷಯಗಳನ್ನು ಬೆಳಗಿಸುತ್ತಿದೆ. ಅದು ಯಾವ ಜಡ ಇಂದ್ರಿಯಗಳೂ
    ಇಲ್ಲದ್ದು. ಯಾವುದಕ್ಕೂ ಸಂಬಂಧಪಡದೆ ಎಲ್ಲವನ್ನೂ ಹೊತ್ತಿದೆ. ಪ್ರಾಕೃತವಾದ ಸತ್ವ ರಜಸ್
    ತಮೋಗುಣಗಳು ಇಲ್ಲದ್ದು ಮತ್ತು ಆನಂದ ಜ್ಞಾನಾದಿ ಅನಂತ ಗುಣಗಳ ಸ್ವರೂಪ.

16: >-
    ಅದು ಜೀವಿಗಳ ಹೊರಗೂ ಇದೆ, ಒಳಗೂ ಇದೆ. ಅದು ಚಲಿಸದು (ವ್ಯಾಪ್ತವಾದ್ದರಿಂದ) ಮತ್ತೆ
    ಅಣುವಾದ್ದರಿಂದ ಚಲಿಸುತ್ತದೆ. ಅದು ದೂರದಲ್ಲಿದೆ, ಮತ್ತು ಹತ್ತಿರದಲ್ಲೂ ಇದೆ. ಆದ್ದರಿಂದಲೇ ಅದು
    ಪೂರ್ತಿ ತಿಳಿಯಲು ಆಗದು.

17: >-
    ಅದು ಎಲ್ಲ ಜೀವಿಗಳಲ್ಲೂ ಒಂದೇ ರೀತಿಯಾಗಿ ಇದೆ, ಆದರೂ ಬೇರೆ ಬೇರೆ ಎನ್ನುವಂತೆಯೂ ಇದೆ. ಅದು
    ಎಲ್ಲ ಜೀವಿಗಳನ್ನೂ ಪಾಲಿಸುತ್ತದೆ ಮತ್ತು ನುಂಗುತ್ತದೆ. ಹಾಗೆಯೆ ಚೆನ್ನಾಗಿ ಹುಟ್ಟಿಸುತ್ತದೆ
    ಎಂದು ತಿಳಿಯಬೇಕು.

18: >-
    ಕತ್ತಲೆಯ ಆಚೆಗೆ ಇರುವ ಅದು ಬೆಳಕುಗಳಿಗೆ ಬೆಳಕು ಎನಿಸಿದೆ. ಜ್ಞಾನರೂಪ ಅದು ತನ್ನನ್ನು ತಾನೆ
    ತಿಳಿಯುವಂಥದು. ಜ್ಞಾನದಿಂದಲೆ ಪಡೆಯಬಹುದಾದುದು. ಎಲ್ಲರ ಹೃದಯದಲ್ಲಿ ಇರುವುದು.

19: >-
    ಹೀಗೆ ಕ್ಷೇತ್ರ, ಜ್ಞಾನ ಮತ್ತು ಜ್ಞೇಯಗಳನ್ನು ಸಂಕ್ಷೇಪವಾಗಿ ಹೇಳಿ ಆಯಿತು. ನನ್ನ ಭಕ್ತನು
    ಇದನ್ನು ತಿಳಿದು ನನ್ನ ಸೇವೆಗೆ ಯೋಗ್ಯನಾಗುತ್ತಾನೆ.

20: >-
    ಪ್ರಕೃತಿ (ಜಡ ಮತ್ತು ಚೇತನ) ಮತ್ತು ಪುರುಷ (ಜೀವ ಮತ್ತು ದೇವ) ಇಬ್ಬರೂ ಹುಟ್ಟು ಇಲ್ಲದವರು
    ಎಂದು ತಿಳಿ. ಸ್ಥೂಲರೂಪಗಳು ಮತ್ತು ತ್ರಿಗುಣಗಳು ಪ್ರಕೃತಿಯ ಕಾರ್ಯಗಳು ಎಂದು ತಿಳಿ.

21: >-
    ದೇಹ ಮತ್ತು ಇಂದ್ರಿಯಗಳ ನಿರ್ಮಾಣದಲ್ಲಿ ಜಡಪ್ರಕೃತಿ (ಚಿತ್‌ಪ್ರಕೃತಿ ಲಕ್ಷ್ಮಿಯು ಮುಖ್ಯ)
    ಕಾರಣ ಎನಿಸಿದೆ. ಸುಖ-ದುಃಖಗಳ ಅನುಭವದಲ್ಲಿ ಜೀವ (ದೇವನು ಮುಖ್ಯ) ಕಾರಣ ಎನಿಸಿದ್ದಾನೆ.

22: >-
    ಪ್ರಕೃತಿಯ ಬಂಧನದಲ್ಲಿರುವ ಜೀವನು ಪ್ರಕೃತಿ ಕಾರ್ಯಗಳಾದ ಸುಖ-ದುಃಖಾದಿಗಳನ್ನು
    ಅನುಭವಿಸುತ್ತಾನೆ. ಒಳ್ಳೆಯ, ಕೆಟ್ಟ ಮತ್ತು ಮಿಶ್ರ (ನರ-ಮೃಗ-ತರು ಮುಂತಾದ) ಜಾತಿಗಳಲ್ಲಿ
    ಹುಟ್ಟಿ ಬರಲು ಜೀವನಿಗೆ ಕಾರಣವು ಸತ್ವ ರಜಸ್ ತಮಸುಗಳ ಸಂಬಂಧ.

23: >-
    ಎಲ್ಲಕ್ಕಿಂತ ಮೇಲೆ ಇದ್ದು ಎಲ್ಲವನ್ನೂ ಹತ್ತಿರದಲ್ಲಿ ನೋಡುವವನು, ತನ್ನ ಇಚ್ಛೆಯಂತೆ
    ಪ್ರತಿಯೊಂದನ್ನೂ ನಿರೂಪಿಸುವವನು, ಎಲ್ಲವನ್ನೂ ಹೊತ್ತವನು, ಸಾರವನ್ನಷ್ಟೆ ಸ್ವೀಕರಿಸುವವನು,
    ದೊಡ್ಡ ಒಡೆಯರಿಗೂ ಸ್ವಾಮಿಯಾದವನು ಪರಮಾತ್ಮನೆಂದು ಶಾಸ್ತ್ರಗಳಲ್ಲಿ ಪ್ರಸಿದ್ಧನು. ಅವನೇ ಈ
    ದೇಹದಲ್ಲಿ ಜೀವನಿಗಿಂತ ಬೇರೆಯಾಗಿ ಇದ್ದಾನೆ, ಮಿಗಿಲಾಗಿದ್ದಾನೆ, ಪುರುಷೋತ್ತಮನು ಎನಿಸಿದ್ದಾನೆ.

24: >-
    ಹೀಗೆ ಪ್ರಕೃತಿ ಮತ್ತು ಪುರುಷರನ್ನು ಗುಣಗಳ ಜೊತೆಗೆ ತಿಳಿದವನು, ಯಾವ ರೀತಿಯಲ್ಲಿ ಬದುಕಿದರೂ
    ಮತ್ತೆ ಹುಟ್ಟುವುದಿಲ್ಲ.

25: >-
    ಕೆಲವರು ಧ್ಯಾನದ ಮೂಲಕ ಪರಮಾತ್ಮನನ್ನು ತನ್ನಲ್ಲಿಯೇ ಒಳಮನಸ್ಸಿನಿಂದ ಕಾಣುತ್ತಾರೆ. ಇತರರು
    ಶಾಸ್ತ್ರಜ್ಞಾನದ ಮೂಲಕ ದೇವನನ್ನು ಕಾಣುತ್ತಾರೆ. ಹಲವರು ಕರ್ಮಯೋಗದಿಂದ ಭಗವಂತನನ್ನು
    ಕಾಣುತ್ತಾರೆ.

26: >-
    ಹೀಗೆ ದೇವರನ್ನು ತಿಳಿಯಲಾಗದ ಇನ್ನು ಕೆಲವರು ತಿಳಿದವರಿಂದ ಕೇಳಿ ಉಪಾಸನೆ ಮಾಡುತ್ತಾರೆ.
    ಶಾಸ್ತ್ರಶ್ರವಣವನ್ನೆ ಮುಖ್ಯವಾಗಿ ಆಶ್ರಯಿಸಿಕೊಂಡ ಅವರೂ ಮರಣರೂಪ ಸಂಸಾರವನ್ನು ಪೂರ್ತಿ
    ದಾಟುತ್ತಾರೆ.

27: >-
    ಓ ಭರತಶ್ರೇಷ್ಠನೆ, ನಡೆದಾಡದ (ಮರ) ಮತ್ತು ಚಲಿಸುವ ಒಂದೊಂದೂ ಜೀವವೂ ಕ್ಷೇತ್ರ (ಲಕ್ಷ್ಮೀ)
    ಮತ್ತು ಕ್ಷೇತ್ರಜ್ಞ (ನಾರಾಯಣ)ರ ಸಂಬಂಧದಿಂದಲೆ ಮುಖ್ಯವಾಗಿ ಹುಟ್ಟಿಬಂದಿರುವುದು ಎಂದು ತಿಳಿ.

28: >-
    ಸರ್ವೋತ್ತಮದೇವನು ಎಲ್ಲದರಲ್ಲೂ ಸಮನಾಗಿ ಇರುವನು, ಎಲ್ಲವೂ ನಾಶ ಹೊಂದಿದರೂ ನಾಶವಾಗದೆ ಹಾಗೆಯೇ
    ಇರುವನು. ಆ ದೇವನನ್ನು ಹೀಗೆ ತಿಳಿದವನೆ ನಿಜವಾಗಿ ತಿಳಿದವನು.

29: >-
    ಎಲ್ಲೆಡೆಯೂ ಒಂದೇ ರೀತಿಯಾಗಿ ಇದ್ದಾನೆ ಎಂದು ಒಡೆಯನಾದ ದೇವನನ್ನು ತಿಳಿದವನು, ತನ್ನನ್ನು
    ತಾನೇ ಹಿಂಸಿಸುವುದಿಲ್ಲ. ಇದರಿಂದ ಉತ್ತಮ ಗತಿಯನ್ನು ಪಡೆಯುತ್ತಾನೆ.

30: >-
    ಮಾಡಬೇಕಾದ ಎಲ್ಲ ಕಾರ್ಯಗಳೂ ಪ್ರಕೃತಿಯಿಂದಲೆ ನಡೆಯುತ್ತಿವೆ ಎಂದು ತಿಳಿದವನು ಮತ್ತು ಏನು
    ಮಾಡುವುದಕ್ಕೂ ತಾನು ಸ್ವತಂತ್ರನು ಅಲ್ಲ ಎಂದು ತಿಳಿದವನು ನಿಜವಾಗಿ ತಿಳಿದವನು.

31: >-
    ಪ್ರತಿಯೊಂದೂ ಬೇರೆ ಬೇರೆಯಾದ ಜೀವರಾಶಿಯನ್ನು ಒಬ್ಬ ದೇವನಲ್ಲಿ ನೆಲೆಸಿದೆ ಎಂದು ಮತ್ತು
    ಅವನಿಂದಲೆ ಸೃಷ್ಟಿಯ ಬಿತ್ತರವು ಎಂದು ತಿಳಿದಾಗ ದೇವನನ್ನು ಪಡೆಯುತ್ತಾನೆ.

32: >-
    ಓ ಕೌಂತೇಯನೆ, ಪರಮಾತ್ಮನು ಹುಟ್ಟು ಇಲ್ಲದವನು, ಸತ್ವ ರಜಸ್ ತಮಸ್ ಗುಣಗಳು ಇಲ್ಲದವನು.
    ಆದ್ದರಿಂದ ಇವನು ನಾಶವಾಗದವನು. ಎಲ್ಲರ ದೇಹದೊಳಗಿದ್ದರೂ ಏನನ್ನೂ ಮಾಡುವುದಿಲ್ಲ, ಏನನ್ನೂ
    ಅಂಟಿಸಿಕೊಳ್ಳುವುದಿಲ್ಲ.

33: >-
    ಆಕಾಶವು ಎಲ್ಲೆಡೆ ಇದ್ದರೂ ಯಾವುದಕ್ಕೂ ತಡೆಯಾಗದ ಸೂಕ್ಷ್ಮಧರ್ಮದಿಂದಾಗಿ ಯಾವುದರಿಂದಲೂ
    ಅಂಟಿಸಿಕೊಳ್ಳುವುದಿಲ್ಲ. ಹಾಗೆ ಪರಮಾತ್ಮನು ಎಲ್ಲ ದೇಹಗಳಲ್ಲಿ ತುಂಬಿದ್ದರೂ ಸೂಕ್ಷ್ಮನಾದುದರಿಂದ
    ಅಂಟಿಸಿಕೊಳ್ಳುವುದಿಲ್ಲ.

34: >-
    ಓ ಭಾರತನೆ, ಒಬ್ಬನೆ ಸೂರ್ಯನು ಈ ಭೂಲೋಕವನ್ನೆಲ್ಲ ಬೆಳಗುವಂತೆ, ಎಲ್ಲ ಕ್ಷೇತ್ರಗಳಲ್ಲಿ
    ನೆಲೆನಿಂತ ಕ್ಷೇತ್ರಜ್ಞನೆನಿಸಿದ ಒಬ್ಬನೆ ದೇವನು ಇಡಿಯ ಪ್ರಪಂಚವೆಂಬ ಕ್ಷೇತ್ರವನ್ನು
    (ಕ್ಷೇತ್ರಗಳ ರಾಶಿಯನ್ನು) ಬೆಳಗಿಸುತ್ತಾನೆ.

35: >-
    ಕ್ಷೇತ್ರ ಮತ್ತು ಕ್ಷೇತ್ರಜ್ಞ ಇವೆರಡರ ಭೇದವನ್ನು ಮತ್ತು ಪಂಚಭೂತಗಳಿಂದ ಹಾಗೂ ಪ್ರಕೃತಿಯಿಂದ
    ಬಿಡುಗಡೆ ಪಡೆವ ಕ್ರಮವನ್ನು ತಿಳಿಯಾದ ಅರಿವಿನಿಂದ ತಿಳಿದವರು ಪರಮಾತ್ಮನನ್ನು ಸೇರುತ್ತಾರೆ.

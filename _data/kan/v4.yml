1: |-
    ಇಮಂ ವಿವಸ್ವತೇ ಯೋಗಂ ಪ್ರೋಕ್ತವಾನಹಮವ್ಯಯಮ್ ।
    ವಿವಸ್ವಾನ್ ಮನವೇ ಪ್ರಾಹ ಮನುರಿಕ್ಷ್ವಾಕವೇಽಬ್ರವೀತ್ ॥

2: |-
    ಏವಂ ಪರಂಪರಾ-ಪ್ರಾಪ್ತಂ ಇಮಂ ರಾಜರ್ಷಯೋ ವಿದುಃ ।
    ಸ ಕಾಲೇನೇಹ ಮಹತಾ ಯೋಗೋ ನಷ್ಟಃ ಪರಂತಪ ॥

3: |-
    ಸ ಏವಾಯಂ ಮಯಾ ತೇಽದ್ಯ ಯೋಗಃ ಪ್ರೋಕ್ತಃ ಪುರಾತನಃ ।
    ಭಕ್ತೋಽಸಿ ಮೇ ಸಖಾ ಚೇತಿ ರಹಸ್ಯಂ ಹ್ಯೇತದುತ್ತಮಮ್ ॥

4: |-
    ಅಪರಂ ಭವತೋ ಜನ್ಮ ಪರಂ ಜನ್ಮ ವಿವಸ್ವತಃ ।
    ಕಥಮೇತದ್ ವಿ-ಜಾನೀಯಾಂ ತ್ವಮಾದೌ ಪ್ರೋಕ್ತವಾನಿತಿ ॥

5: |-
    ಬಹೂನಿ ಮೇ ವ್ಯತೀತಾನಿ ಜನ್ಮಾನಿ ತವ ಚಾರ್ಜುನ ।
    ತಾನ್ಯಹಂ ವೇದ ಸರ್ವಾಣಿ ನ ತ್ವಂ ವೇತ್ಥ ಪರಂತಪ ॥

6: |-
    ಅಜೋಽಪಿ ಸನ್ನವ್ಯಯಾತ್ಮಾ ಭೂತಾನಾಮೀಶ್ವರೋಽಪಿ ಸನ್ ।
    ಪ್ರಕೃತಿಂ ಸ್ವಾಮಧಿಷ್ಠಾಯ ಸಂ-ಭವಾಮ್ಯಾತ್ಮ-ಮಾಯಯಾ ॥

7: |-
    ಯದಾ ಯದಾ ಹಿ ಧರ್ಮಸ್ಯ ಗ್ಲಾನಿರ್ಭವತಿ ಭಾರತ ।
    ಅಭ್ಯುತ್ಥಾನಮಧರ್ಮಸ್ಯ ತದಾಽಽತ್ಮಾನಂ ಸೃಜಾಮ್ಯಹಮ್ ॥

8: |-
    ಪರಿ-ತ್ರಾಣಾಯ ಸಾಧೂನಾಂ ವಿ-ನಾಶಾಯ ಚ ದುಷ್ಕೃತಾಮ್ ।
    ಧರ್ಮ-ಸಂ-ಸ್ಥಾಪನಾರ್ಥಾಯ ಸಂ-ಭವಾಮಿ ಯುಗೇ-ಯುಗೇ ॥

9: |-
    ಜನ್ಮ ಕರ್ಮ ಚ ಮೇ ದಿವ್ಯಂ ಏವಂ ಯೋ ವೇತ್ತಿ ತತ್ವತಃ ।
    ತ್ಯಕ್ತ್ವಾ ದೇಹಂ ಪುನರ್ಜನ್ಮ ನೈತಿ ಮಾಮೇತಿ ಸೋಽರ್ಜುನ ॥

10: |-
    ವೀತ-ರಾಗ-ಭಯ-ಕ್ರೋಧಾಃ ಮನ್ಮಯಾ ಮಾಮುಪಾಶ್ರಿತಾಃ ।
    ಬಹವೋ ಜ್ಞಾನ-ತಪಸಾ ಪೂತಾ ಮದ್ಭಾವಮಾಗತಾಃ ॥

11: |-
    ಯೇ ಯಥಾ ಮಾಂ ಪ್ರಪದ್ಯಂತೇ ತಾಂಸ್ತಥೈವ ಭಜಾಮ್ಯಹಮ್ ।
    ಮಮ ವರ್ತ್ಮಾನು-ವರ್ತಂತೇ ಮನುಷ್ಯಾಃ ಪಾರ್ಥ ಸರ್ವಶಃ ॥

12: |-
    ಕಾಂಕ್ಷಂತಃ ಕರ್ಮಣಾಂ ಸಿದ್ಧಿಂ ಯಜಂತ ಇಹ ದೇವತಾಃ ।
    ಕ್ಷಿಪ್ರಂ ಹಿ ಮಾನುಷೇ ಲೋಕೇ ಸಿದ್ಧಿರ್ಭವತಿ ಕರ್ಮ-ಜಾ ॥

13: |-
    ಚಾತುರ್ವರ್ಣ್ಯಂ ಮಯಾ ಸೃಷ್ಟಂ ಗುಣ-ಕರ್ಮ-ವಿಭಾಗಶಃ ।
    ತಸ್ಯ ಕರ್ತಾರಮಪಿ ಮಾಂ ವಿದ್ಧ್ಯಕರ್ತಾರಮವ್ಯಯಮ್ ॥

14: |-
    ನ ಮಾಂ ಕರ್ಮಾಣಿ ಲಿಂಪಂತಿ ನ ಮೇ ಕರ್ಮ-ಫಲೇ ಸ್ಪೃಹಾ ।
    ಇತಿ ಮಾಂ ಯೋಽಭಿ-ಜಾನಾತಿ ಕರ್ಮಭಿರ್ನ ಸ ಬಧ್ಯತೇ ॥

15: |-
    ಏವಂ ಜ್ಞಾತ್ವಾ ಕೃತಂ ಕರ್ಮ ಪೂರ್ವೈರಪಿ ಮುಮುಕ್ಷುಭಿಃ ।
    ಕುರು ಕರ್ಮೈವ ತಸ್ಮಾತ್ ತ್ವಂ ಪೂರ್ವೈಃ ಪೂರ್ವ-ತರಂ ಕೃತಮ್ ॥

16: |-
    ಕಿಂ ಕರ್ಮ ಕಿಮಕರ್ಮೇತಿ ಕವಯೋಽಪ್ಯತ್ರ ಮೋಹಿತಾಃ ।
    ತತ್ ತೇ ಕರ್ಮ ಪ್ರವಕ್ಷ್ಯಾಮಿ ಯಜ್ಞತ್ವಾ ಮೋಕ್ಷ್ಯಸೇಽಶುಭಾತ್ ॥

17: |-
    ಕರ್ಮಣೋ ಹ್ಯಪಿ ಬೋದ್ಧವ್ಯಂ ಬೋದ್ಧವ್ಯಂ ಚ ವಿ-ಕರ್ಮಣಃ ।
    ಅಕರ್ಮಣಶ್ಚ ಬೋದ್ಧವ್ಯಂ ಗಹನಾ ಕರ್ಮಣೋ ಗತಿಃ ॥

18: |-
    ಕರ್ಮಣ್ಯಕರ್ಮ ಯಃ ಪಶ್ಯೇತ್ ಅಕರ್ಮಣಿ ಚ ಕರ್ಮ ಯಃ ।
    ಸ ಬುದ್ಧಿ-ಮಾನ್ ಮನುಷ್ಯೇಷು ಸ ಯುಕ್ತಃ ಕೃತ್ಸ್ನ-ಕರ್ಮ-ಕೃತ್ ॥

19: |-
    ಯಸ್ಯ ಸರ್ವೇ ಸಮಾರಂಭಾಃ ಕಾಮ-ಸಂಕಲ್ಪ-ವರ್ಜಿತಾಃ ।
    ಜ್ಞಾನಾಗ್ನಿ-ದಗ್ಧ-ಕರ್ಮಾಣಂ ತಮಾಹುಃ ಪಂಡಿತಂ ಬುಧಾಃ ॥

20: |-
    ತ್ಯಕ್ತ್ವಾ ಕರ್ಮ-ಫಲಾಸಂಗಂ ನಿತ್ಯ-ತೃಪ್ತೋ ನಿರಾಶ್ರಯಃ ।
    ಕರ್ಮಣ್ಯಭಿ-ಪ್ರವೃತ್ತೋಽಪಿ ನೈವ ಕಿಂಚಿತ್ ಕರೋತಿ ಸಃ ॥

21: |-
    ನಿರಾಶೀರ್ಯತ-ಚಿತ್ತಾತ್ಮಾ ತ್ಯಕ್ತ-ಸರ್ವ-ಪರಿಗ್ರಹಃ ।
    ಶಾರೀರಂ ಕೇವಲಂ ಕರ್ಮ ಕುರ್ವನ್ ನಾಽಪ್ನೋತಿ ಕಿಲ್ಬಿಷಮ್ ॥

22: |-
    ಯದೃಚ್ಛಾ-ಲಾಭ-ಸಂತುಷ್ಟೋ ದ್ವಂದ್ವಾತೀತೋ ವಿ-ಮತ್ಸರಃ ।
    ಸಮಃ ಸಿದ್ಧಾವಸಿದ್ಧೌ ಚ ಕೃತ್ವಾಽಪಿ ನ ನಿ-ಬದ್ಧ್ಯತೇ ॥

23: |-
    ಗತ-ಸಂಗಸ್ಯ ಮುಕ್ತಸ್ಯ ಜ್ಞಾನಾವಸ್ಥಿತ-ಚೇತಸಃ ।
    ಯಜ್ಞಾಯಾಽಚರತಃ ಕರ್ಮ ಸಮಗ್ರಂ ಪ್ರವಿ-ಲೀಯತೇ ॥

24: |-
    ಬ್ರಹ್ಮಾರ್ಪಣಂ ಬ್ರಹ್ಮ-ಹವಿಃ ಬ್ರಹ್ಮಾಗ್ನೌ ಬ್ರಹ್ಮಣಾ ಹುತಮ್ ।
    ಬ್ರಹ್ಮೆೈವ ತೇನ ಗಂತವ್ಯಂ ಬ್ರಹ್ಮ-ಕರ್ಮ-ಸಮಾಧಿನಾ ॥

25: |-
    ದೈವಮೇವಾಪರೇ ಯಜ್ಞಂ ಯೋಗಿನಃ ಪರ್ಯುಪಾಸತೇ ।
    ಬ್ರಹ್ಮಾಗ್ನಾವಪರೇ ಯಜ್ಞಂ ಯಜ್ಞೇನೈವೋಪ-ಜುಹ್ವತಿ ॥

26: |-
    ಶ್ರೋತ್ರಾದೀನೀಂದ್ರಿಯಾಣ್ಯನ್ಯೇ ಸಂ-ಯಮಾಗ್ನಿಷು ಜುಹ್ವತಿ ।
    ಶಬ್ದಾದೀನ್ ವಿಷಯಾನನ್ಯೇ ಇಂದ್ರಿಯಾಗ್ನಿಷು ಜುಹ್ವತಿ ॥

27: |-
    ಸರ್ವಾಣೀಂದ್ರಿಯ-ಕರ್ಮಾಣಿ ಪ್ರಾಣ-ಕರ್ಮಾಣಿ ಚಾಪರೇ ।
    ಆತ್ಮ-ಸಂಯಮ-ಯೋಗಾಗ್ನೌ ಜುಹ್ವತಿ ಜ್ಞಾನ-ದೀಪಿತೇ ॥

28: |-
    ದ್ರವ್ಯ-ಯಜ್ಞಾಸ್ತಪೋ-ಯಜ್ಞಾಃ ಯೋಗ-ಯಜ್ಞಾಸ್ತಥಾ ಪರೇ ।
    ಸ್ವಾಧ್ಯಾಯ-ಜ್ಞಾನ-ಯಜ್ಞಾಶ್ಚ ಯತಯಃ ಸಂಶಿತ-ವ್ರತಾಃ ॥

29: |-
    ಅಪಾನೇ ಜುಹ್ವತಿ ಪ್ರಾಣಂ ಪ್ರಾಣೇಽಪಾನಂ ತಥಾ ಪರೇ ।
    ಪ್ರಾಣಾಪಾನ-ಗತೀ ರುದ್ಧ್ವಾ ಪ್ರಾಣಾಯಾಮ-ಪರಾಯಣಾಃ ॥

30: |-
    ಅಪರೇ ನಿಯತಾಹಾರಾಃ ಪ್ರಾಣಾನ್ ಪ್ರಾಣೇಷು ಜುಹ್ವತಿ ।
    ಸರ್ವೇಽಪ್ಯೇತೇ ಯಜ್ಞ-ವಿದೋ ಯಜ್ಞ-ಕ್ಷಪಿತ-ಕಲ್ಮಷಾಃ ॥

31: |-
    ಯಜ್ಞ-ಶಿಷ್ಟಾಮೃತ-ಭುಜೋ ಯಾಂತಿ ಬ್ರಹ್ಮ ಸನಾತನಮ್ ।
    ನಾಯಂ ಲೋಕೋಽಸ್ತ್ಯಯಜ್ಞಸ್ಯ ಕುತೋಽನ್ಯಃ ಕುರು-ಸತ್ತಮ ॥

32: |-
    ಏವಂ ಬಹು-ವಿಧಾ ಯಜ್ಞಾಃ ವಿತತಾ ಬ್ರಹ್ಮಣೋ ಮುಖೇ ।
    ಕರ್ಮ-ಜಾನ್ ವಿದ್ಧಿ ತಾನ್ ಸರ್ವಾನ್ ಏವಂ ಜ್ಞಾತ್ವಾ ವಿಮೋಕ್ಷ್ಯಸೇ ॥

33: |-
    ಶ್ರೇಯಾನ್ ದ್ರವ್ಯ-ಮಯಾದ್ ಯಜ್ಞಾತ್ ಜ್ಞಾನ-ಯಜ್ಞಃ ಪರಂತಪ ।
    ಸರ್ವಂ ಕರ್ಮಾಖಿಲಂ ಪಾರ್ಥ ಜ್ಞಾನೇ ಪರಿ-ಸಮಾಪ್ಯತೇ ॥

34: |-
    ತದ್ ವಿದ್ಧಿ ಪ್ರಣಿಪಾತೇನ ಪರಿ-ಪ್ರಶ್ನೇನ ಸೇವಯಾ ।
    ಉಪದೇಕ್ಷ್ಯಂತಿ ತೇ ಜ್ಞಾನಂ ಜ್ಞಾನಿನಸ್ತತ್ತ್ವ-ದರ್ಶಿನಃ ॥

35: |-
    ಯಜ್ಜ್ಞಾತ್ವಾ ನ ಪುನರ್ಮೋಹಂ ಏವಂ ಯಾಸ್ಯಸಿ ಪಾಂಡವ ।
    ಯೇನ ಭೂತಾನ್ಯಶೇಷೇಣ ದ್ರಕ್ಷ್ಯಸ್ಯಾತ್ಮನ್ಯಥೋ ಮಯಿ ॥

36: |-
    ಅಪಿ ಚೇದಸಿ ಪಾಪೇಭ್ಯಃ ಸರ್ವೇಭ್ಯಃ ಪಾಪ-ಕೃತ್ತಮಃ ।
    ಸರ್ವಂ ಜ್ಞಾನ-ಪ್ಲವೇನೈವ ವೃಜಿನಂ ಸಂ-ತರಿಷ್ಯಸಿ ॥

37: |-
    ಯಥೈಧಾಂಸಿ ಸಮಿದ್ಧೋಽಗ್ನಿಃ ಭಸ್ಮಸಾತ್ ಕುರುತೇಽರ್ಜುನ ।
    ಜ್ಞಾನಾಗ್ನಿಃ ಸರ್ವ-ಕರ್ಮಾಣಿ ಭಸ್ಮಸಾತ್ ಕುರುತೇ ತಥಾ ॥

38: |-
    ನ ಹಿ ಜ್ಞಾನೇನ ಸದೃಶಂ ಪವಿತ್ರಮಿಹ ವಿದ್ಯತೇ ।
    ತತ್ ಸ್ವಯಂ ಯೋಗ-ಸಂಸಿದ್ಧಃ ಕಾಲೇನಾಽತ್ಮನಿ ವಿಂದತಿ ॥

39: |-
    ಶ್ರದ್ಧಾ-ವಾನ್ ಲಭತೇ ಜ್ಞಾನಂ ಮತ್ಪರಃ ಸಂ-ಯತೇಂದ್ರಿಯಃ ।
    ಜ್ಞಾನಂ ಲಬ್ಧ್ವಾ ಪರಾಂ ಶಾಂತಿಂ ಅಚಿರೇಣಾಧಿ-ಗಚ್ಛತಿ ॥

40: |-
    ಅಜ್ಞಶ್ಚಾಶ್ರದ್ದಧಾನಶ್ಚ ಸಂಶಯಾತ್ಮಾ ವಿ-ನಶ್ಯತಿ ।
    ನಾಯಂ ಲೋಕೋಽಸ್ತಿ ನ ಪರೋ ನ ಸುಖಂ ಸಂಶಯಾತ್ಮನಃ ॥

41: |-
    ಯೋಗ-ಸಂನ್ಯಸ್ತ-ಕರ್ಮಾಣಂ ಜ್ಞಾನ-ಸಂಛಿನ್ನ-ಸಂಶಯಮ್ ।
    ಆತ್ಮ-ವಂತಂ ನ ಕರ್ಮಾಣಿ ನಿ-ಬಧ್ನಂತಿ ಧನಂ-ಜಯ ॥

42: |-
    ತಸ್ಮಾದಜ್ಞಾನ-ಸಂಭೂತಂ ಹೃತ್-ಸ್ಥಂ ಜ್ಞಾನಾಸಿನಾಽಽತ್ಮನಃ ।
    ಛಿತ್ವೈನಂ ಸಂಶಯಂ ಯೋಗಂ ಆತಿಷ್ಠೋತ್ತಿಷ್ಠ ಭಾರತ ॥

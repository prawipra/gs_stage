1: >-
    ಅರ್ಜುನನು ಕೇಳಿದನು - ಹೀಗೆ ನಿತ್ಯವೂ ನಿನ್ನನ್ನೆ ಧ್ಯಾನಿಸುತ್ತ ಸೇವೆಗೈಯುವ ಭಕ್ತರು
    ಮತ್ತು ನಾಶವಿರದ ಅವ್ಯಕ್ತ ತತ್ವವಾದ ಲಕ್ಷ್ಮಿಯ ಆರಾಧಕರು ಇವರಲ್ಲಿ ಯಾರು ಶ್ರೇಷ್ಠ
    ಯೋಗಿಗಳು?

2: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಪೂರ್ಣ ನಂಬಿಕೆಯಿಂದ ಕೂಡಿ ನನ್ನಲ್ಲೆ ಮನಸ್ಸಿಟ್ಟು ನನ್ನನ್ನೆ
    ಯಾವಾಗಲೂ ಧ್ಯಾನಯೋಗದಿಂದ ಆರಾಧಿಸುವವರೆ ಶ್ರೇಷ್ಠಯೋಗಿಗಳು ಎಂದು ನನ್ನ ಅಭಿಪ್ರಾಯ.

4: >-
    ನಾಶವಿಲ್ಲದ, ಮಾತಿಗೂ-ಮನಸ್ಸಿಗೂ ಪೂರ್ತಿ ಸಿಗದ, ಆಕಾಶದಲ್ಲಿ ಇದ್ದು ಎಲ್ಲ್ಲೆಡೆ ಇರುವ,
    ವಿಕಾರ ಇಲ್ಲದ, ಸ್ಥಿರವಾದ, ಶಾಶ್ವತವಾದ ತತ್ವ ಅವ್ಯಕ್ತ. ಇಂದ್ರಿಯಗಳನ್ನೆಲ್ಲ ನಿಗ್ರಹಿಸಿ,
    ಎಲ್ಲೆಡೆಯೂ ಸಮದೃಷ್ಟಿಯಿಂದ ಎಲ್ಲ ಜೀವಿಗಳಿಗೂ ಒಳ್ಳೆಯದನ್ನು ಬಯಸುತ್ತ ಆ ಅವ್ಯಕ್ತವನ್ನು
    ಆರಾಧಿಸುವವರೂ ನನ್ನನ್ನೇ ಸೇರುತ್ತಾರೆ.

5: >-
    ಅವ್ಯಕ್ತ ತತ್ವದಲ್ಲೆ ಮನಸ್ಸಿಟ್ಟವರಿಗೆ ಶ್ರಮ ತುಂಬಾ ಇದೆ. ಅವ್ಯಕ್ತದ ಮೂಲಕ ಮೋಕ್ಷ
    ಪಡೆಯಲು ಸಾಧಕರಿಗೆ ದುಃಖ ಆಗಲಿದೆ.

6: >-
    ನನ್ನನ್ನು ಸರ್ವೋತ್ತಮನೆಂದು ತಿಳಿದವರು ಮಾಡಿದ್ದನ್ನೆಲ್ಲ ನನಗೆ ಅರ್ಪಿಸುತ್ತಾರೆ. ಬೇರೆ
    ಯಾರನ್ನೂ ಭಜಿಸದೆ ನನ್ನನ್ನೆ ಧ್ಯಾನಿಸುತ್ತ ಆರಾಧಿಸುವರು.

7: >-
    ಓ ಪಾರ್ಥನೆ, ನನ್ನಲ್ಲೆ ಮನಸ್ಸಿಟ್ಟವರನ್ನು ನಾನು ಸಮುದ್ರದಂತಿರುವ ಮರಣಶೀಲ ಸಂಸಾರದಿಂದ
    ಕೂಡಲೇ ಪೂರ್ತಿಯಾಗಿ ಬಿಡುಗಡೆಗೊಳಿಸುತ್ತೇನೆ.

8: >-
    ನನ್ನಲ್ಲಿಯೆ ಮನಸ್ಸನ್ನು ಇಡು. ನನ್ನಲ್ಲಿ ಬುದ್ಧಿಯನ್ನೂ ನಿಶ್ಚಯಿಸು. ಅದರ ಫಲವಾಗಿ
    ನನ್ನಲ್ಲೆ ನೆಲೆಸುವೆ, ಸಂಶಯಪಡಬೇಡ.

9: >-
    ಓ ಧನಂಜಯನೆ, ಒಂದೊಮ್ಮೆ ಒಳಮನಸ್ಸನ್ನು ಗಟ್ಟಿಯಾಗಿ ನನ್ನಲ್ಲಿ ನಿಲ್ಲಿಸಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೆ,
    ಅಭ್ಯಾಸದ ರೀತಿಯಲ್ಲಿ ಮತ್ತೆ ಮತ್ತೆ ನನ್ನನ್ನು ಪಡೆಯಲು ಬಯಸು.

10: >-
    ಧ್ಯಾನದ ಅಭ್ಯಾಸವೂ ಸಾಧ್ಯವಾಗದಿದ್ದರೆ, ನನ್ನ ಕೆಲಸಗಳನ್ನೆ ಮುಖ್ಯವಾಗಿ ಮಾಡುತ್ತಿರು. ನನ್ನ
    ಪೂಜೆಗಾಗಿ ಎಂದು ಕರ್ಮಗಳನ್ನು ಮಾಡುತ್ತಲೆ ಸಿದ್ಧಿಯನ್ನು ಪಡೆಯುವೆ.

11: >-
    ಮತ್ತೆ ಇದನ್ನೂ ಮಾಡಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೆ, ಮನಸ್ಸನ್ನು ನಿಗ್ರಹಿಸಿ ನನ್ನ ನೆನಪು ಮಾಡಿಕೊಂಡು
    ಎಲ್ಲ ಕರ್ಮಗಳ ಫಲದ ಆಸೆಯನ್ನು ಬಿಡು.

12: >-
    ಜ್ಞಾನವಿಲ್ಲದ ಅಭ್ಯಾಸಕ್ಕಿಂತ ಜ್ಞಾನ ಶ್ರೇಷ್ಠ. ಕೇವಲ ಜ್ಞಾನಕ್ಕಿಂತ ತಿಳಿದು ಧ್ಯಾನಿಸುವುದು
    ಶ್ರೇಷ್ಠ. ಕೇವಲ ಧ್ಯಾನಕ್ಕಿಂತ ಕರ್ಮಫಲದ ಆಸೆ ಬಿಟ್ಟ ಧ್ಯಾನವು ಶ್ರೇಷ್ಠ. ಮತ್ತೆ ಕರ್ಮದ
    ಫಲದ ಆಸೆ ತೊರೆದು ಮಾಡಿದ ಧ್ಯಾನದಿಂದ ಮೋಕ್ಷ ಆಗಲಿದೆ.

14: >-
    ಎಲ್ಲರನ್ನೂ ದ್ವೇಷಿಸದವನು, ಸಹಾಯ ಮಾಡುವವನು, ಕರುಣಿಯು, ನಾನು-ನನ್ನದು ಎಂಬ ಅಭಿಮಾನ
    ಇಲ್ಲದವನು, ದುಃಖ ಬಂದಾಗ ಕುಗ್ಗದೆ, ಸುಖ ಆದಾಗ ಹಿಗ್ಗದೆ ಇರುವವನು, ಕ್ಷಮಾಶೀಲನು,
    ನಿತ್ಯಸಂತೋಷಿಯು, ಧ್ಯಾನವನ್ನು ನಡೆಸುವವನು, ಮನಸ್ಸನ್ನೂ ನಿಗ್ರಹಿಸಿದವನು, ಸ್ಥಿರವಾದ
    ತತ್ವನಿಶ್ಚಯ ಉಳ್ಳವನು, ಮನಸ್ಸು-ಬುದ್ಧಿಗಳನ್ನು ನನ್ನಲ್ಲಿ ಒಪ್ಪಿಸಿದವನು, ಯಾರೆ ಆದರೂ ನನ್ನ
    ಭಕ್ತನು ನನಗೆ ಇಷ್ಟನು.

15: >-
    ಯಾರನ್ನೂ ರೇಗಿಸದವನು, ಯಾರಿಂದಲೂ ಉದ್ವೇಗಕ್ಕೆ ಒಳಗಾಗದವನು, ಸಂತೋಷ, ಅಸಹನೆ, ಅಂಜಿಕೆ,
    ಆವೇಶಗಳನ್ನು ಬಿಟ್ಟವನು ಯಾರೆ ಆದರೂ ನನಗೆ ಇಷ್ಟನು.

16: >-
    ಏನನ್ನೂ ಬಯಸದವನು, ಶುದ್ಧನು, ಸಮರ್ಥನು, ಯಾವುದನ್ನೂ ಹಚ್ಚಿಕೊಳ್ಳದವನು, ಬಾಧೆ ಪಡೆದವನು,
    ತನ್ನದಲ್ಲದ ಎಲ್ಲ ಕೆಲಸಗಳನ್ನು ಪೂರ್ತಿ ಬಿಟ್ಟವನು, ನನ್ನ ಭಕ್ತನು ಯಾರೆ ಆದರೂ ನನಗೆ
    ಇಷ್ಟನು.

17: >-
    ಸಂತಸ ಪಡುವುದಿಲ್ಲ, ದ್ವೇಷಿಸುವುದೂ ಇಲ್ಲ, ದುಃಖಿಸುವುದಿಲ್ಲ, ಬಯಸುವುದಿಲ್ಲ,
    ಒಳಿತು-ಕೆಡುಕುಗಳ ಬಗ್ಗೆ ಯೋಚನೆ ಬಿಟ್ಟವನು, ಭಕ್ತಿಯುಳ್ಳವನು ಯಾರೆ ಆದರೂ ನನಗೆ ಇಷ್ಟನು.

19: >-
    ವೈರಿ-ಗೆಳೆಯರಲ್ಲಿ ಭೇದ ಎಣಿಸದವನು, ಗೌರವ-ತಿರಸ್ಕಾರಗಳಲ್ಲಿ, ಶೀತ-ಉಷ್ಣಗಳಲ್ಲಿ,
    ಸುಖ-ದುಃಖಗಳಲ್ಲಿ, ತೆೆಗಳಿಕೆ-ಹೊಗಳಿಕೆಗಳಲ್ಲಿ ಒಂದೇ ರೀತಿಯಾಗಿ ಇರುವವನು, ಎಲ್ಲ
    ಸಂಬಂಧಗಳನ್ನು ಕಳಚಿಕೊಂಡವನು, ಚಿಂತನಶೀಲನು, ಯಾವುದರಿಂದಲೂ ಸಂತೋಷ ಪಡುವವನು, ಒಂದೇ ಕಡೆ
    ಇರಲು ಬಯಸದವನು, ದೇವನ ಅರಿವು ಗಟ್ಟಿಯುಳ್ಳವನು, ಭಕ್ತಿ ಉಳ್ಳವನು ನನಗೆ ಇಷ್ಟನಾದ ಮನುಷ್ಯನು.

20: >-
    ನಾನು ಸರ್ವೋತ್ತಮನೆಂದು ನಂಬಿ ಧರ್ಮ ಮೋಕ್ಷಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಈ ಸಾಧನೆಯನ್ನು ಹೇಳಿದಂತೆ
    ಪೂರ್ತಿ ಆಚರಿಸುವವರು ನನ್ನ ಭಕ್ತರು ಯಾರೆ ಆದರೂ ನನಗೆ ತುಂಬಾ ಇಷ್ಟರು.

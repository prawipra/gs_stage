1: |-
    ಸಂನ್ಯಾಸಸ್ಯ ಮಹಾಬಾಹೋ ತತ್ವಮಿಚ್ಛಾಮಿ ವೇದಿತುಮ್ ।
    ತ್ಯಾಗಸ್ಯ ಚ ಹೃಷೀಕೇಶ ಪೃಥಕ್ ಕೇಶಿ-ನಿಷೂದನ ॥

2: |-
    ಕಾಮ್ಯಾನಾಂ ಕರ್ಮಣಾಂ ನ್ಯಾಸಂ ಸಂನ್ಯಾಸಂ ಕವಯೋ ವಿದುಃ ।
    ಸರ್ವ-ಕರ್ಮ-ಫಲ-ತ್ಯಾಗಂ ಪ್ರಾಹುಸ್ತ್ಯಾಗಂ ವಿಚಕ್ಷಣಾಃ ॥

3: |-
    ತ್ಯಾಜ್ಯಂ ದೋಷ-ವದಿತ್ಯೇಕೇ ಕರ್ಮ ಪ್ರಾಹುರ್ಮನೀಷಿಣಃ ।
    ಯಜ್ಞ-ದಾನ-ತಪಃ-ಕರ್ಮ ನ ತ್ಯಾಜ್ಯಮಿತಿ ಚಾಪರೇ ॥

4: |-
    ನಿಶ್ಶ್ಚಯಂ ಶೃಣು ಮೇ ತತ್ರ ತ್ಯಾಗೇ ಭರತ-ಸತ್ತಮ ।
    ತ್ಯಾಗೋ ಹಿ ಪುರುಷ-ವ್ಯಾಘ್ರ ತ್ರಿ-ವಿಧಃ ಸಂಪ್ರ-ಕೀರ್ತಿತಃ ॥

5: |-
    ಯಜ್ಞ-ದಾನ-ತಪಃ-ಕರ್ಮ ನ ತ್ಯಾಜ್ಯಂ ಕಾರ್ಯಮೇವ ತತ್ ।
    ಯಜ್ಞೋ ದಾನಂ ತಪಶ್ಚೈವ ಪಾವನಾನಿ ಮನೀಷಿಣಾಮ್ ॥

6: |-
    ಏತಾನ್ಯಪಿ ತು ಕರ್ಮಾಣಿ ಸಂಗಂ ತ್ಯಕ್ತ್ವಾ ಫಲಾನಿ ಚ ।
    ಕರ್ತವ್ಯಾನೀತಿ ಮೇ ಪಾರ್ಥ ನಿಶ್ಚಿತಂ ಮತಮುತ್ತಮಮ್ ॥

7: |-
    ನಿಯತಸ್ಯ ತು ಸಂನ್ಯಾಸಃ ಕರ್ಮಣೋ ನೋಪ-ಪದ್ಯತೇ ।
    ಮೋಹಾತ್ ತಸ್ಯ ಪರಿತ್ಯಾಗಃ ತಾಮಸಃ ಪರಿ-ಕೀರ್ತಿತಃ ॥

8: |-
    ದುಃಖಮಿತ್ಯೇವ ಯತ್ ಕರ್ಮ ಕಾಯ-ಕ್ಲೇಶ-ಭಯಾತ್ ತ್ಯಜೇತ್ ।
    ಸ ಕೃತ್ವಾ ರಾಜಸಂ ತ್ಯಾಗಂ ನೈವ ತ್ಯಾಗ-ಫಲಂ ಲಭೇತ್ ॥

9: |-
    ಕಾರ್ಯಮಿತ್ಯೇವ ಯತ್ ಕರ್ಮ ನಿಯತಂ ಕ್ರಿಯತೇಽರ್ಜುನ ।
    ಸಂಗಂ ತ್ಯಕ್ತ್ವಾ ಫಲಂ ಚೈವ ಸ ತ್ಯಾಗಃ ಸಾತ್ತ್ವಿಕೋ ಮತಃ ॥

10: |-
    ನ ದ್ವೇಷ್ಟ್ಯಕುಶಲಂ ಕರ್ಮ ಕುಶಲೇ ನಾನು-ಷಜ್ಜತೇ ।
    ತ್ಯಾಗೀ ಸತ್ತ್ವ-ಸಮಾವಿಷ್ಟೋ ಮೇಧಾವೀ ಛಿನ್ನ-ಸಂಶಯಃ ॥

11: |-
    ನ ಹಿ ದೇಹ-ಭೃತಾ ಶಕ್ಯಂ ತ್ಯಕ್ತುಂ ಕರ್ಮಾಣ್ಯಶೇಷತಃ ।
    ಯಸ್ತು ಕರ್ಮ-ಫಲ-ತ್ಯಾಗೀ ಸ ತ್ಯಾಗೀತ್ಯಭಿ-ಧೀಯತೇ ॥

12: |-
    ಅನಿಷ್ಟಮಿಷ್ಟಂ ಮಿಶ್ರಂ ಚ ತ್ರಿ-ವಿಧಂ ಕರ್ಮಣಃ ಫಲಮ್ ।
    ಭವತ್ಯತ್ಯಾಗಿನಾಂ ಪ್ರೇತ್ಯ ನ ತು ಸಂನ್ಯಾಸಿನಾಂ ಕ್ವಚಿತ್ ॥

13: |-
    ಪಂಚೈತಾನಿ ಮಹಾ-ಬಾಹೋ ಕಾರಣಾನಿ ನಿಬೋಧ ಮೇ ।
    ಸಾಂಖ್ಯೇ ಕೃತಾಂತೇ ಪ್ರೋಕ್ತಾನಿ ಸಿದ್ಧಯೇ ಸರ್ವ-ಕರ್ಮಣಾಮ್ ॥

14: |-
    ಅಧಿಷ್ಠಾನಂ ತಥಾ ಕರ್ತಾ ಕರಣಂ ಚ ಪೃಥಗ್ವಿಧಮ್ ।
    ವಿವಿಧಾಶ್ಚ ಪೃಥಕ್ ಚೇಷ್ಟಾ ದೈವಂ ಚೈವಾತ್ರ ಪಂಚಮಮ್ ॥

15: |-
    ಶರೀರ-ವಾಙ್ಮನೋಭಿರ್ಯತ್ ಕರ್ಮ ಪ್ರಾರಭತೇ ನರಃ ।
    ನ್ಯಾಯ್ಯಂ ವಾ ವಿಪರೀತಂ ವಾ ಪಂಚೈತೇ ತಸ್ಯ ಹೇತವಃ ॥

16: |-
    ತತ್ರೈವಂ ಸತಿ ಕರ್ತಾರಂ ಆತ್ಮಾನಂ ಕೇವಲಂ ತು ಯಃ ।
    ಪಶ್ಯತ್ಯಕೃತ-ಬುದ್ಧಿತ್ವಾತ್ ನ ಸ ಪಶ್ಯತಿ ದುರ್ಮತಿಃ ॥

17: |-
    ಯಸ್ಯ ನಾಹಂ-ಕೃತೋ ಭಾವೋ ಬುದ್ಧಿರ್ಯಸ್ಯ ನ ಲಿಪ್ಯತೇ ।
    ಹತ್ವಾಽಪಿ ಸ ಇಮಾನ್ ಲೋಕಾನ್ ನ ಹಂತಿ ನ ನಿಬಧ್ಯತೇ ॥

18: |-
    ಜ್ಞಾನಂ ಜ್ಞೇಯಂ ಪರಿ-ಜ್ಞಾತಾ ತ್ರಿ-ವಿಧಾ ಕರ್ಮ-ಚೋದನಾ ।
    ಕರಣಂ ಕರ್ಮ ಕರ್ತೇತಿ ತ್ರಿ-ವಿಧಃ ಕರ್ಮ-ಸಂಗ್ರಹಃ ॥

19: |-
    ಜ್ಞಾನಂ ಕರ್ಮ ಚ ಕರ್ತಾ ಚ ತ್ರಿ-ಧೈವ ಗುಣ-ಭೇದತಃ ।
    ಪ್ರೋಚ್ಯತೇ ಗುಣ-ಸಂಖ್ಯಾನೇ ಯಥಾವಚ್ಛೃಣು ತಾನ್ಯಪಿ ॥

20: |-
    ಸರ್ವ-ಭೂತೇಷು ಯೇನೈಕಂ ಭಾವಮವ್ಯಯಮೀಕ್ಷತೇ ।
    ಅವಿಭಕ್ತಂ ವಿಭಕ್ತೇಷು ತಜ್‌ಜ್ಞಾನಂ ವಿದ್ಧಿ ಸಾತ್ತ್ವಿಕಮ್ ॥

21: |-
    ಪೃಥಕ್ತ್ವೇನ ತು ಯಜ್‌ಜ್ಞಾನಂ ನಾನಾ-ಭಾವಾನ್ ಪೃಥಗ್ವಿಧಾನ್ ।
    ವೇತ್ತಿ ಸರ್ವೇಷು ಭೂತೇಷು ತಜ್‌ಜ್ಞಾನಂ ವಿದ್ಧಿ ರಾಜಸಮ್ ॥

22: |-
    ಯತ್ ತು ಕೃತ್ಸ್ನ-ವದೇಕಸ್ಮಿನ್ ಕಾರ್ಯೇ ಸಕ್ತಮಹೈತುಕಮ್ ।
    ಅತತ್ವಾರ್ಥ-ವದಲ್ಪಂ ಚ ತತ್ ತಾಮಸಮುದಾಹೃತಮ್ ॥

23: |-
    ನಿಯತಂ ಸಂಗ-ರಹಿತಂ ಅರಾಗ-ದ್ವೇಷತಃ ಕೃತಮ್ ।
    ಅಫಲ-ಪ್ರೇಪ್ಸುನಾ ಕರ್ಮ ಯತ್ ತತ್ ಸಾತ್ತ್ವಿಕಮುಚ್ಯತೇ ॥

24: |-
    ಯತ್ ತು ಕಾಮೇಪ್ಸುನಾ ಕರ್ಮ ಸಾಹಂ-ಕಾರೇಣ ವಾ ಪುನಃ ।
    ಕ್ರಿಯತೇ ಬಹುಲಾಯಾಸಂ ತದ್ ರಾಜಸಮುದಾಹೃತಮ್ ॥

25: |-
    ಅನುಬಂಧಂ ಕ್ಷಯಂ ಹಿಂಸಾಂ ಅನಪೇಕ್ಷ್ಯ ಚ ಪೌರುಷಮ್ ।
    ಮೋಹಾದಾರಭ್ಯತೇ ಕರ್ಮ ಯತ್ ತತ್ ತಾಮಸಮುಚ್ಯತೇ ॥

26: |-
    ಮುಕ್ತ-ಸಂಗೋಽನಹಂ-ವಾದೀ ಧೃತ್ಯುತ್ಸಾಹ-ಸಮನ್ವಿತಃ ।
    ಸಿದ್ಧ್ಯಸಿದ್ಧ್ಯೋರ್ನಿರ್ವಿಕಾರಃ ಕರ್ತಾ ಸಾತ್ತ್ವಿಕ ಉಚ್ಯತೇ ॥

27: |-
    ರಾಗೀ ಕರ್ಮ-ಫಲ-ಪ್ರೇಪ್ಸುಃ ಲುಬ್ಧೋ ಹಿಂಸಾತ್ಮಕೋಽಶುಚಿಃ ।
    ಹರ್ಷ-ಶೋಕಾನ್ವಿತಃ ಕರ್ತಾ ರಾಜಸಃ ಪರಿಕೀರ್ತಿತಃ ॥

28: |-
    ಅಯುಕ್ತಃ ಪ್ರಾಕೃತಃ ಸ್ತಬ್ಧಃ ಶಠೋ ನೈಕೃತಿಕೋಽಲಸಃ ।
    ವಿಷಾದೀ ದೀರ್ಘ-ಸೂತ್ರೀ ಚ ಕರ್ತಾ ತಾಮಸ ಉಚ್ಯತೇ ॥

29: |-
    ಬುದ್ಧೇರ್ಭೇದಂ ಧೃತೇಶ್ಚೈವ ಗುಣತಸ್ತ್ರಿ-ವಿಧಂ ಶೃಣು ।
    ಪ್ರೋಚ್ಯಮಾನಮಶೇಷೇಣ ಪೃಥಕ್ತ್ವೇನ ಧನಂ-ಜಯ ॥

30: |-
    ಪ್ರವೃತ್ತಿಂ ಚ ನಿವೃತ್ತಿಂ ಚ ಕಾರ್ಯಾಕಾರ್ಯೇ ಭಯಾಭಯೇ ।
    ಬಂಧಂ ಮೋಕ್ಷಂ ಚ ಯಾ ವೇತ್ತಿ ಬುದ್ಧಿಃ ಸಾ ಪಾರ್ಥ ಸಾತ್ತ್ವಿಕೀ ॥

31: |-
    ಯಯಾ ಧರ್ಮಮಧರ್ಮಂ ಚ ಕಾರ್ಯಂ ಚಾಕಾರ್ಯಮೇವ ಚ ।
    ಅಯಥಾ-ವತ್ ಪ್ರಜಾನಾತಿ ಬುದ್ಧಿಃ ಸಾ ಪಾರ್ಥ ರಾಜಸೀ ॥

32: |-
    ಅಧರ್ಮಂ ಧರ್ಮಮಿತಿ ಯಾ ಮನ್ಯತೇ ತಮಸಾಽಽವೃತಾ ।
    ಸರ್ವಾರ್ಥಾನ್ ವಿಪರೀತಾಂಶ್ಚ ಬುದ್ಧಿಃ ಸಾ ಪಾರ್ಥ ತಾಮಸೀ ॥

33: |-
    ಧೃತ್ಯಾ ಯಯಾ ಧಾರಯತೇ ಮನಃ-ಪ್ರಾಣೇಂದ್ರಿಯ-ಕ್ರಿಯಾಃ ।
    ಯೋಗೇನಾವ್ಯಭಿ-ಚಾರಿಣ್ಯಾ ಧೃತಿಃ ಸಾ ಪಾರ್ಥ ಸಾತ್ತ್ವಿಕೀ ॥

34: |-
    ಯಯಾ ತು ಧರ್ಮ-ಕಾಮಾರ್ಥಾನ್ ಧೃತ್ಯಾ ಧಾರಯತೇಽರ್ಜುನ ।
    ಪ್ರಸಂಗೇನ ಫಲಾಕಾಂಕ್ಷೀ ಧೃತಿಃ ಸಾ ಪಾರ್ಥ ರಾಜಸೀ ॥

35: |-
    ಯಯಾ ಸ್ವಪ್ನಂ ಭಯಂ ಶೋಕಂ ವಿಷಾದಂ ಮದಮೇವ ಚ ।
    ನ ವಿಮುಂಚತಿ ದುರ್ಮೇಧಾ ಧೃತಿಃ ಸಾ ಪಾರ್ಥ ತಾಮಸೀ ॥

36: |-
    ಸುಖಂ ತ್ವಿದಾನೀಂ ತ್ರಿ-ವಿಧಂ ಶೃಣು ಮೇ ಭರತರ್ಷಭ ।
    ಅಭ್ಯಾಸಾದ್ ರಮತೇ ಯತ್ರ ದುಃಖಾಂತಂ ಚ ನಿಗಚ್ಛತಿ ॥

37: |-
    ಯತ್ ತದಗ್ರೇ ವಿಷಮಿವ ಪರಿಣಾಮೇಽಮೃತೋಪಮಮ್ ।
    ತತ್ ಸುಖಂ ಸಾತ್ವಿಕಂ ಪ್ರೋಕ್ತಂ ಆತ್ಮ-ಬುದ್ಧಿ-ಪ್ರಸಾದ-ಜಮ್ ॥

38: |-
    ವಿಷಯೇಂದ್ರಿಯ-ಸಂಯೋಗಾತ್ ಯತ್ ತದಗ್ರೇಽಮೃತೋಪಮಮ್ ।
    ಪರಿಣಾಮೇ ವಿಷಮಿವ ತತ್ ಸುಖಂ ರಾಜಸಂ ಸ್ಮೃತಮ್ ॥

39: |-
    ಯದಗ್ರೇ ಚಾನುಬಂಧೇ ಚ ಸುಖಂ ಮೋಹನಮಾತ್ಮನಃ ।
    ನಿದ್ರಾಲಸ್ಯ-ಪ್ರಮಾದೋತ್ಥಂ ತತ್ ತಾಮಸಮುದಾಹೃತಮ್ ॥

40: |-
    ನ ತದಸ್ತಿ ಪೃಥಿವ್ಯಾಂ ವಾ ದಿವಿ ದೇವೇಷು ವಾ ಪುನಃ ।
    ಸತ್ವಂ ಪ್ರಕೃತಿ-ಜೈರ್ಮುಕ್ತಂ ಯದೇಭಿಃ ಸ್ಯಾತ್ ತ್ರಿಭಿರ್ಗುಣೈಃ ॥

41: |-
    ಬ್ರಾಹ್ಮಣ-ಕ್ಷತ್ರಿಯ-ವಿಶಾಂ ಶೂದ್ರಾಣಾಂ ಚ ಪರಂತಪ ।
    ಕರ್ಮಾಣಿ ಪ್ರವಿ-ಭಕ್ತಾನಿ ಸ್ವ-ಭಾವ-ಪ್ರಭವೈರ್ಗುಣೈಃ ॥

42: |-
    ಶಮೋ ದಮಸ್ತಪಃ ಶೌಚಂ ಕ್ಷಾಂತಿರಾರ್ಜವಮೇವ ಚ ।
    ಜ್ಞಾನಂ ವಿಜ್ಞಾನಮಾಸ್ತಿಕ್ಯಂ ಬ್ರಹ್ಮ-ಕರ್ಮ ಸ್ವ-ಭಾವ-ಜಮ್ ॥

43: |-
    ಶೌರ್ಯಂ ತೇಜೋ ಧೃತಿರ್ದಾಕ್ಷ್ಯಂ ಯುದ್ಧೇ ಚಾಪ್ಯಪಲಾಯನಮ್ ।
    ದಾನಮೀಶ್ವರ-ಭಾವಶ್ಚ ಕ್ಷಾತ್ರಂ ಕರ್ಮ ಸ್ವ-ಭಾವ-ಜಮ್ ॥

44: |-
    ಕೃಷಿ-ಗೋ-ರಕ್ಷ-ವಾಣಿಜ್ಯಂ ವೈಶ್ಯ-ಕರ್ಮ ಸ್ವ-ಭಾವ-ಜಮ್ ।
    ಪರಿಚರ್ಯಾತ್ಮಕಂ ಕರ್ಮ ಶೂದ್ರಸ್ಯಾಪಿ ಸ್ವ-ಭಾವ-ಜಮ್ ॥

45: |-
    ಸ್ವೇ ಸ್ವೇ ಕರ್ಮಣ್ಯಭಿ-ರತಃ ಸಂಸಿದ್ಧಿಂ ಲಭತೇ ನರಃ ।
    ಸ್ವ-ಕರ್ಮ-ನಿರತಃ ಸಿದ್ಧಿಂ ಯಥಾ ವಿಂದತಿ ತಚ್ಛೃಣು ॥

46: |-
    ಯತಃ ಪ್ರವೃತ್ತಿರ್ಭೂತಾನಾಂ ಯೇನ ಸರ್ವಮಿದಂ ತತಮ್ ।
    ಸ್ವ-ಕರ್ಮಣಾ ತಮಭ್ಯರ್ಚ್ಯ ಸಿದ್ಧಿಂ ವಿಂದತಿ ಮಾನವಃ ॥

47: |-
    ಶ್ರೇಯಾನ್ ಸ್ವ-ಧರ್ಮೋ ವಿಗುಣಃ ಪರ-ಧರ್ಮಾತ್ ಸ್ವನುಷ್ಠಿತಾತ್ ।
    ಸ್ವ-ಭಾವ-ನಿಯತಂ ಕರ್ಮ ಕುರ್ವನ್ ನಾಽಪ್ನೋತಿ ಕಿಲ್ಬಿಷಮ್ ॥

48: |-
    ಸಹ-ಜಂ ಕರ್ಮ ಕೌಂತೇಯ ಸ-ದೋಷಮಪಿ ನ ತ್ಯಜೇತ್ ।
    ಸರ್ವಾರಂಭಾ ಹಿ ದೋಷೇಣ ಧೂಮೇನಾಗ್ನಿರಿವಾಽಮೃತಾಃ ॥

49: |-
    ಅಸಕ್ತ-ಬುದ್ಧಿಃ ಸರ್ವತ್ರ ಜಿತಾತ್ಮಾ ವಿಗತ-ಸ್ಪೃಹಃ ।
    ನೈಷ್ಕರ್ಮ್ಯ-ಸಿದ್ಧಿಂ ಪರಮಾಂ ಸಂನ್ಯಾಸೇನಾಧಿಗಚ್ಛತಿ ॥

50: |-
    ಸಿದ್ಧಿಂ ಪ್ರಾಪ್ತೋ ಯಥಾ ಬ್ರಹ್ಮ ತಥಾಽಽಪ್ನೋತಿ ನಿಬೋಧ ಮೇ ।
    ಸಮಾಸೇನೈವ ಕೌಂತೇಯ ನಿಷ್ಠಾ ಜ್ಞಾನಸ್ಯ ಯಾ ಪರಾ ॥

51: |-
    ಬುದ್ಧ್ಯಾವಿಶುದ್ಧಯಾ ಯುಕ್ತೋ ಧೃತ್ಯಾಽಽತ್ಮಾನಂ ನಿಯಮ್ಯ ಚ ।
    ಶಬ್ದಾದೀನ್ ವಿಷಯಾಂಸ್ತ್ಯಕ್ತ್ವಾ ರಾಗ-ದ್ವೇಷೌ ವ್ಯುದಸ್ಯ ಚ ॥

52: |-
    ವಿವಿಕ್ತ-ಸೇವೀ ಲಘ್ವಾಶೀ ಯತ-ವಾಕ್ಕಾಯ-ಮಾನಸಃ ।
    ಧ್ಯಾನ-ಯೋಗ-ಪರೋ ನಿತ್ಯಂ ವೈರಾಗ್ಯಂ ಸಮುಪಾಶ್ರಿತಃ ॥

53: |-
    ಅಹಂ-ಕಾರಂ ಬಲಂ ದರ್ಪಂ ಕಾಮಂ ಕ್ರೋಧಂ ಪರಿಗ್ರಹಮ್ ।
    ವಿಮುಚ್ಯ ನಿರ್ಮಮಃ ಶಾಂತೋ ಬ್ರಹ್ಮ-ಭೂಯಾಯ ಕಲ್ಪತೇ ॥

54: |-
    ಬ್ರಹ್ಮ-ಭೂತಃ ಪ್ರಸನ್ನಾತ್ಮಾ ನ ಶೋಚತಿ ನ ಕಾಂಕ್ಷತಿ ।
    ಸಮಃ ಸರ್ವೇಷು ಭೂತೇಷು ಮದ್ಭಕ್ತಿಂ ಲಭತೇ ಪರಾಮ್ ॥

55: |-
    ಭಕ್ತ್ಯಾ ಮಾಮಭಿ-ಜಾನಾತಿ ಯಾವಾನ್ ಯಶ್ಚಾಸ್ಮಿ ತತ್ತ್ವತಃ ।
    ತತೋ ಮಾಂ ತತ್ತ್ವತೋ ಜ್ಞಾತ್ವಾ ವಿಶತೇ ತದನಂತರಮ್ ॥

56: |-
    ಸರ್ವ-ಕರ್ಮಾಣ್ಯಪಿ ಸದಾ ಕುರ್ವಾಣೋ ಮದ್ವ್ಯಪಾಶ್ರಯಃ ।
    ಮತ್ಪ್ರಸಾದಾದವಾಪ್ನೋತಿ ಶಾಶ್ವತಂ ಪದಮವ್ಯಯಮ್ ॥

57: |-
    ಚೇತಸಾ ಸರ್ವ-ಕರ್ಮಾಣಿ ಮಯಿ ಸಂನ್ಯಸ್ಯ ಮತ್ಪರಃ ।
    ಬುದ್ಧಿ-ಯೋಗಮುಪಾಶ್ರಿತ್ಯ ಮಚ್ಚಿತ್ತಃ ಸತತಂ ಭವ ॥

58: |-
    ಮಚ್ಚಿತ್ತಃ ಸರ್ವ-ದುರ್ಗಾಣಿ ಮತ್ಪ್ರಸಾದಾತ್ ತರಿಷ್ಯಸಿ ।
    ಅಥ ಚೇತ್ ತ್ವಮಹಂ-ಕಾರಾತ್ ನ ಶ್ರೋಷ್ಯಸಿ ವಿನಂಕ್ಷ್ಯಸಿ ॥

59: |-
    ಯದಹಂ-ಕಾರಮಾಶ್ರಿತ್ಯ ನ ಯೋತ್ಸ್ಯ ಇತಿ ಮನ್ಯಸೇ ।
    ಮಿಥ್ಯೈಷ ವ್ಯವಸಾಯಸ್ತೇ ಪ್ರಕೃತಿಸ್ತ್ವಾಂ ನಿಯೋಕ್ಷ್ಯತಿ ॥

60: |-
    ಸ್ವ-ಭಾವ-ಜೇನ ಕೌಂತೇಯ ನಿಬದ್ಧಃ ಸ್ವೇನ ಕರ್ಮಣಾ ।
    ಕರ್ತುಂ ನೇಚ್ಛಸಿ ಯನ್ಮೋಹಾತ್ ಕರಿಷ್ಯಸ್ಯವಶೋಽಪಿ ತತ್ ॥

61: |-
    ಈಶ್ವರಃ ಸರ್ವ-ಭೂತಾನಾಂ ಹೃದ್ದೇಶೇಽರ್ಜುನ ತಿಷ್ಠತಿ ।
    ಭ್ರಾಮಯನ್ ಸರ್ವ-ಭೂತಾನಿ ಯಂತ್ರಾರೂಢಾನಿ ಮಾಯಯಾ ॥

62: |-
    ತಮೇವ ಶರಣಂ ಗಚ್ಛ ಸರ್ವ-ಭಾವೇನ ಭಾರತ ।
    ತತ್-ಪ್ರಸಾದಾತ್ ಪರಾಂ ಶಾಂತಿಂ ಸ್ಥಾನಂ ಪ್ರಾಪ್ಸ್ಯಸಿ ಶಾಶ್ವತಮ್ ॥

63: |-
    ಇತಿ ತೇ ಜ್ಞಾನಮಾಖ್ಯಾತಂ ಗುಹ್ಯಾದ್ ಗುಹ್ಯ-ತರಂ ಮಯಾ ।
    ವಿಮೃಶ್ಶೈತದಶೇಷೇಣ ಯಥೇಚ್ಛಸಿ ತಥಾ ಕುರು ॥

64: |-
    ಸರ್ವ-ಗುಹ್ಯ-ತಮಂ ಭೂಯಃ ಶೃಣು ಮೇ ಪರಮಂ ವಚಃ ।
    ಇಷ್ಟೋಽಸಿ ಮೇ ದೃಢಮಿತಿ ತತೋ ವಕ್ಷ್ಯಾಮಿ ತೇ ಹಿತಮ್ ॥

65: |-
    ಮನ್ಮನಾ ಭವ ಮದ್ಭಕ್ತೋ ಮದ್ಯಾಜೀ ಮಾಂ ನಮಸ್ಕುರು ।
    ಮಾಮೇವೈಷ್ಯಸಿ ಸತ್ಯಂ ತೇ ಪ್ರತಿಜಾನೇ ಪ್ರಿಯೋಽಸಿ ಮೇ ॥

66: |-
    ಸರ್ವ-ಧರ್ಮಾನ್ ಪರಿತ್ಯಜ್ಯ ಮಾಮೇಕಂ ಶರಣಂ ವ್ರಜ ।
    ಅಹಂ ತ್ವಾ ಸರ್ವ-ಪಾಪೇಭ್ಯೋ ಮೋಕ್ಷಯಿಷ್ಯಾಮಿ ಮಾ ಶುಚಃ ॥

67: |-
    ಇದಂ ತೇ ನಾತಪಸ್ಕಾಯ ನಾಭಕ್ತಾಯ ಕದಾಚನ ।
    ನ ಚಾಶುಶ್ರೂಷವೇ ವಾಚ್ಯಂ ನ ಚ ಮಾಂ ಯೋಽಭ್ಯಸೂಯತಿ ॥

68: |-
    ಯ ಇಮಂ ಪರಮಂ ಗುಹ್ಯಂ ಮದ್-ಭಕ್ತೇಷ್ವಭಿ-ಧಾಸ್ಯತಿ ।
    ಭಕ್ತಿಂ ಮಯಿ ಪರಾಂ ಕೃತ್ವಾ ಮಾಮೇವೈಷ್ಯತ್ಯಸಂಶಯಃ ॥

69: |-
    ನ ಚ ತಸ್ಮಾನ್ಮನುಷ್ಯೇಷು ಕಶ್ಚಿನ್ಮೇ ಪ್ರಿಯ-ಕೃತ್ತಮಃ ।
    ಭವಿತಾ ನ ಚ ಮೇ ತಸ್ಮಾತ್ ಅನ್ಯಃ ಪ್ರಿಯ-ತರೋ ಭುವಿ ॥

70: |-
    ಅಧ್ಯೇಷ್ಯತೇ ಚ ಯ ಇಮಂ ಧರ್ಮ್ಯಂ ಸಂವಾದಮಾವಯೋಃ ।
    ಜ್ಞಾನ-ಯಜ್ಞೇನ ತೇನಾಹಂ ಇಷ್ಟಃ ಸ್ಯಾಮಿತಿ ಮೇ ಮತಿಃ ॥

71: |-
    ಶ್ರ್ರದ್ಧಾ-ವಾನನಸೂಯಶ್ಚ ಶೃಣುಯಾದಪಿ ಯೋ ನರಃ ।
    ಸೋಽಪಿ ಮುಕ್ತಃ ಶುಭಾನ್ ಲೋಕಾನ್ ಪ್ರಾಪ್ನುಯಾತ್ಪುಣ್ಯ-ಕರ್ಮಣಾಮ್ ॥

72: |-
    ಕಚ್ಚಿದೇತಚ್ಛ್ರುತಂ ಪಾರ್ಥ ತ್ವಯೈಕಾಗ್ರೇಣ ಚೇತಸಾ ।
    ಕಚ್ಚಿದಜ್ಞಾನ-ಸಂಮೋಹಃ ಪ್ರನಷ್ಟಸ್ತೇ ಧನಂ-ಜಯ ॥

73: |-
    ನಷ್ಟೋ ಮೋಹಃ ಸ್ಮೃತಿರ್ಲಬ್ಧಾ ತ್ವತ್-ಪ್ರಸಾದಾನ್ಮಯಾಽಚ್ಯುತ ।
    ಸ್ಥಿತೋಽಸ್ಮಿ ಗತ-ಸಂದೇಹಃ ಕರಿಷ್ಯೇ ವಚನಂ ತವ ॥

74: |-
    ಇತ್ಯಹಂ ವಾಸು-ದೇವಸ್ಯ ಪಾರ್ಥಸ್ಯ ಚ ಮಹಾತ್ಮನಃ ।
    ಸಂವಾದಮಿಮಮಶ್ರೌಷಂ ಅದ್ಭುತಂ ರೋಮ-ಹರ್ಷಣಮ್ ॥

75: |-
    ವ್ಯಾಸ-ಪ್ರಸಾದಾಚ್ಛ್ರುತವಾನ್ ಏತದ್ ಗುಹ್ಯಮಹಂ ಪರಮ್ ।
    ಯೋಗಂ ಯೋಗೇಶ್ವರಾತ್ ಕೃಷ್ಣಾತ್ ಸಾಕ್ಷಾತ್ ಕಥಯತಃ ಸ್ವಯಮ್ ॥

76: |-
    ರಾಜನ್ ಸಂಸ್ಮೃತ್ಯ-ಸಂಸ್ಮೃತ್ಯ ಸಂವಾದಮಿಮಮದ್ಭುತಮ್ ।
    ಕೇಶವಾರ್ಜುನಯೋಃ ಪುಣ್ಯಂ ಹೃಷ್ಯಾಮಿ ಚ ಮುಹುರ್ಮುಹುಃ ॥

77: |-
    ತಚ್ಚ ಸಂಸ್ಮೃತ್ಯ-ಸಂಸ್ಮೃತ್ಯ ರೂಪಮತ್ಯದ್ಭುತಂ ಹರೇಃ ।
    ವಿಸ್ಮಯೋ ಮೇ ಮಹಾನ್ ರಾಜನ್ ಹೃಷ್ಯಾಮಿ ಚ ಪುನಃ-ಪುನಃ ॥

78: |-
    ಯತ್ರ ಯೋಗೇಶ್ವರಃ ಕೃಷ್ಣೋ ಯತ್ರ ಪಾರ್ಥೋ ಧನುರ್ಧರಃ ।
    ತತ್ರ ಶ್ರೀರ್ವಿಜಯೋ ಭೂತಿಃ ಧ್ರುವಾ ನೀತಿರ್ಮತಿರ್ಮಮ ॥

1: >-
    ಓ ಮಹಾಬಾಹುವೆ, ನನ್ನ ಉತ್ತಮವಾದ ಮಾತನ್ನು ಮತ್ತೂ ಕೇಳು. ಅರಿವನ್ನು ಇಷ್ಟಪಡುವ ನಿನಗೆ
    ಹಿತವನ್ನು ಬಯಸಿಯೇ ನಾನು ಹೇಳುತ್ತೇನೆ.

2: >-
    ನನ್ನ ಹುಟ್ಟನ್ನು ದೇವತೆಗಳೂ ತಿಳಿದಿಲ್ಲ, ಋಷಿಗಳು ತಿಳಿದಿಲ್ಲ, ಏಕೆಂದರೆ ದೇವತೆಗಳಿಗೂ
    ಋಷಿಗಳಿಗೂ ಎಲ್ಲರಿಗೂ ಮೂಲ ನಾನೇ.

3: >-
    ನಾನು ಹುಟ್ಟದವನು, ಪ್ರಾಣನಿಗೂ ತಂದೆಯು, ಲೋಕಪಾಲರಿಗಿಂತಲೂ ಶ್ರೇಷ್ಠನು ಎಂದು ಮನುಷ್ಯರಲ್ಲಿ
    ತಪ್ಪಿಲ್ಲದೆ ತಿಳಿದವನು ಎಲ್ಲ ಪಾಪಗಳಿಂದ ದೂರನಾಗುತ್ತಾನೆ.

5: >-
    ಬುದ್ಧಿ, ಜ್ಞಾನ, ನಿಶ್ಚಯ, ಕ್ಷಮೆ, ಸತ್ಯ, ಇಂದ್ರಿಯನಿಗ್ರಹ, ದೇವನಲ್ಲಿ ನಿಷ್ಠೆ, ಸುಖ, ದುಃಖ,
    ಹುಟ್ಟು, ಸಾವು, ಹೆದರಿಕೆ, ಧೈರ್ಯ, ಅಹಿಂಸೆ, ಸಮದೃಷ್ಟಿ, ತೃಪ್ತಿ, ತಪಸ್, ದಾನ, ಯಶಸ್ಸು,
    ಅಪಕೀರ್ತಿ - ಹೀಗೆ ಬಗೆಬಗೆಯ ಗುಣಲಕ್ಷಣಗಳು ಜೀವಿಗಳಿಗೆಲ್ಲ ನನ್ನಿಂದಲೇ ಉಂಟಾಗುತ್ತವೆ.

6: >-
    ಮರೀಚಿ, ಅತ್ರಿ, ಅಂಗಿರಸ್, ಪುಲಸ್ತ್ಯ, ಪುಲಹ, ಕ್ರ‍್ರತು ಮತ್ತು ವಸಿಷ್ಠ - ಈ ಏಳು ಮಂದಿ
    ಮೊದಲ ಸ್ವಾಯಂಭುವ ಮನ್ವಂತರದ ಮಹರ್ಷಿಗಳು ಹಾಗೂ ಸ್ವಾಯಂಭುವ, ಸ್ವಾರೋಚಿಷ, ಉತ್ತಮ ಮತ್ತು
    ರೈವತ - ಈ ನಾಲ್ಕು ಮಂದಿ ಮೊದಲ ಮನುಗಳು ಚತುರ್ಮುಖನ ಸಂಕಲ್ಪದಿಂದ ಹುಟ್ಟಿದವರು. ಇವರು ನನ್ನ
    ಭಕ್ತರು. ಇವರಿಂದಲೆ ವಿಶ್ವದ ಈ ಜನರೆಲ್ಲ ಹುಟ್ಟಿದರು.

7: >-
    ನನ್ನ ಈ ವೈಭವವನ್ನು ಮತ್ತು ಯೋಗಸಾಮರ್ಥ್ಯವನ್ನು ಸರಿಯಾಗಿ ತಿಳಿದವನು ಸ್ಥಿರವಾದ ಧ್ಯಾನಯೋಗವನ್ನು
    ನಡೆಸುತ್ತಾನೆ. ಇದರಲ್ಲಿ ಸಂಶಯವಿಲ್ಲ.

8: >-
    ನಾನು ಎಲ್ಲದರ ಸೃಷ್ಟಿಕಾರ, ನನ್ನಿಂದಲೆ ಎಲ್ಲವೂ ನಡೆಯುತ್ತಿದೆ ಎಂದು ಜ್ಞಾನಿಗಳು ತಿಳಿದು,
    ನನ್ನನ್ನು ಭಕ್ತಿಪೂರ್ಣರಾಗಿ ಸೇವಿಸುತ್ತಾರೆ.

9: >-
    ನನ್ನಲ್ಲಿ ಮನಸ್ಸಿಟ್ಟವರು, ನನಗಾಗಿ ಬದುಕುವವರು, ನನ್ನನ್ನೇ ಒಬ್ಬರಿಗೊಬ್ಬರು ತಿಳಿಸುತ್ತ,
    ಹೇಳುತ್ತ ನಿತ್ಯವೂ ತೃಪ್ತಿಪಡುವರು, ಆನಂದಗೊಳ್ಳುವರು.

10: >-
    ನನ್ನಲ್ಲಿ ಮನಸಿಟ್ಟು ನಿತ್ಯವೂ ಪ್ರೀತಿಯಿಂದ ಸೇವೆಗೈಯುವವರಿಗೆ ಆ ಜ್ಞಾನಯೋಗವನ್ನು ನೀಡುತ್ತೇನೆ.
    ಅದರಿಂದ ಅವರು ನನ್ನನ್ನು ಸೇರುತ್ತಾರೆ.

11: >-
    ಅವರ ಮೇಲಿನ ಕನಿಕರದಿಂದಲೆ, ನಾನು ಅವರ ಮನಸ್ಸಿನಲ್ಲಿದ್ದು ಅಜ್ಞಾನದಿಂದ ಆದ ತಮಸ್ಸನ್ನು
    ಬೆಳಗುವ ಜ್ಞಾನದೀಪದಿಂದ ನಾಶ ಮಾಡುತ್ತೇನೆ.

13: >-
    ಅರ್ಜುನನು ಹೇಳಿದನು - ಪರಿಪೂರ್ಣ ಬ್ರಹ್ಮ ನೀನೆ. ನೀನೆ ಕೊನೆಯ ಆಸರೆ. ಪರಮಪವಿತ್ರ ನೀನು,
    ನಿನ್ನನ್ನು ಪುರುಷ, ಶಾಶ್ವತ, ದಿವ್ಯ, ಆದಿದೇವ, ಅಜ, ವಿಭು ಎನ್ನುವುದಾಗಿ ಎಲ್ಲ ಋಷಿಗಳೂ
    ಹೇಳುತ್ತಾರೆ. ಹಾಗೆಯೇ ದೇವರ್ಷಿ ನಾರದರೂ, ಅಸಿತ, ದೇವಲ, ವ್ಯಾಸ ಇವರೂ ಹೇಳುತ್ತಾರೆ. ನೀನೂ
    ನನಗೆ ಹಾಗೆಯೇ ಹೇಳಿದ್ದಿ.

14: >-
    ಓ ಕೇಶವನೆ, ನನಗೆ ಹೇಳಿದ ಅದನ್ನೆಲ್ಲ ನಿಜವೆಂದೆ ತಿಳಿದಿರುವೆನು. ಓ ಭಗವಂತನೆ, ನಿನ್ನ
    ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ದೇವತೆಗಳಾಗಲಿ ದಾನವರಾಗಲಿ ತಿಳಿದೇ ಇಲ್ಲ.

15: >-
    ಓ ಪುರುಷೋತ್ತಮನೆ, ಎಲ್ಲವನ್ನು ಸೃಷ್ಟಿಸಿದವನೆ, ಎಲ್ಲರ ಸ್ವಾಮಿಯೆ, ದೇವತೆಗಳಿಗೂ ಜ್ಞಾನ
    ನೀಡಿದವನೆ, ವಿಶ್ವಪಾಲಕನೆ, ಯಾರ ಸಹಾಯವೂ ಇಲ್ಲದೆ ನೀನೇ ನೀನಾಗಿ ನಿನ್ನನ್ನು ಸ್ವರೂಪದಿಂದಲೆ
    ತಿಳಿದಿರುವೆ.

16: >-
    ನೀನು ಯಾವ ಯಾವ ರೂಪಗಳಿಂದ ಈ ಲೋಕಗಳನ್ನು ತುಂಬಿ ನಿಂತಿರುವೆಯೋ ನಿನ್ನ ಆ ಎಲ್ಲಾ ದಿವ್ಯ
    ವಿಭೂತಿರೂಪಗಳನ್ನು ಹೇಳಲೇಬೇಕು.

17: >-
    ಓ ಯೋಗಿಯೆ, ನಿನ್ನನ್ನು ನಿತ್ಯವೂ ಪೂರ್ತಿ ಚಿಂತನೆಗೈಯ್ಯುತ್ತಾ ನಾನು ಹೇಗೆ ತಿಳಿಯಲಿ? ಓ
    ಭಗವಂತನೆ, ಯಾವ ಯಾವ ವಸ್ತುಗಳಲ್ಲಿ ನಾನು ಹೇಗೆ ಚಿಂತನೆಗೈಯಲಿ?

18: >-
    ಓ ಜನಾರ್ದನನೆ, ನಿನ್ನ ವಿಭೂತಿರೂಪಗಳ ಸಂಬಂಧವನ್ನು ಇನ್ನೂ ವಿಸ್ತರಿಸಿ ಹೇಳು. ನಿತ್ಯವೂ ಇರುವ
    ನಿನ್ನ ರೂಪವನ್ನು ಕೇಳಿ ನನಗೆ ತೃಪ್ತಿಯೆ ಇಲ್ಲ.

19: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಓ ಕುರುಶ್ರೇಷ್ಠನೆ, ನನ್ನ ವಿಶೇಷ ವಿಭೂತಿ ರೂಪಗಳಲ್ಲಿ ಮುಖ್ಯವಾದವುಗಳನ್ನಷ್ಟೆ
    ನಿನಗಾಗಿ ಹೇಳುತ್ತೇನೆ. ವಿಸ್ತರಿಸಿ ಹೇಳಿದರೆ ನನ್ನ ರೂಪಗಳಿಗೆ ಕೊನೆಯಿಲ್ಲ ತಾನೆ!

20: >-
    ಓ ನಿದ್ದೆಯನ್ನು ಗೆದ್ದವನೆ, ಎಲ್ಲ ಜೀವಿಗಳ ಹೃದಯದಲ್ಲಿ ನಾನೇ ಅಂತರ್ಯಾಮಿಯಾಗಿ ಇರುವವನು. ಎಲ್ಲ
    ಜೀವಿಗಳಿಗೂ ಮೂಲ, ನಡು ಮತ್ತೆ ಕೊನೆಯೂ ನಾನೆ.

21: >-
    ಅದಿತಿಯ ಹನ್ನೆರಡು ಮಂದಿ ಮಕ್ಕಳಲ್ಲಿ ನಾನು ವಿಷ್ಣು. ಬೆಳಗಿಸುವ ವಸ್ತುಗಳಲ್ಲಿ ಸಾವಿರ
    ಕಿರಣವುಳ್ಳ ರವಿ ನಾನು. ಮರುತ್ತುಗಳ ವಂಶದವರಲ್ಲಿ ಮರೀಚಿ (ಪ್ರವಹವಾಯುಪುತ್ರ) ನಾನು.
    ನಕ್ಷತ್ರಗಳ ಒಡೆಯ ಶಶಿ ನಾನು.

22: >-
    ವೇದಗಳಲ್ಲಿ ಸಾಮವೇದ ನಾನು. ದೇವತೆಗಳಲ್ಲಿ ಇಂದ್ರ ನಾನು. ಹನ್ನೊಂದು ಇಂದ್ರಿಯಗಳಲ್ಲಿ ಮನಸ್ಸು
    ನಾನು. ಜೀವಿಗಳಲ್ಲಿ ಚೈತನ್ಯ ನಾನು.

23: >-
    ರೈವತ, ಓಜಸ್, ಭವ, ಭೀಮ, ವಾಮ, ಉಗ್ರ, ವೃಷಾಕಪಿ, ಅಜೈಕಪಾತ್, ಅಹಿರ್ಬುಧ್ನ್ಯ, ಬಹುರೂಪ
    ಮತ್ತು ಶಂಕರರೆಂಬ ಹನ್ನೊಂದು ರುದ್ರರಲ್ಲಿ ಶಂಕರನು ನಾನು. ಯಕ್ಷ-ರಾಕ್ಷಸರ ಒಡೆಯ ಕುಬೇರ ನಾನು.
    ದ್ರೋಣ, ಪ್ರಾಣ, ಧ್ರುವ, ಅರ್ಕ, ಅಗ್ನಿ, ದೋಷ, ವಸ್ತು ಮತ್ತು ವಿಭಾವಸುಗಳೆಂಬ ಎಂಟು
    ವಸುಗಳಲ್ಲಿ ಅಗ್ನಿ ನಾನು. ಗಿರಿಗಳಲ್ಲಿ ಮೇರು ನಾನು.

24: >-
    ಓ ಪಾರ್ಥನೆ, ಪುರೋಹಿತರಲ್ಲಿ ಶ್ರೇಷ್ಠನಾದ ಗುರು ನಾನು ಎಂದು ತಿಳಿ. ಸೇನಾಪತಿಗಳಲ್ಲಿ ಸ್ಕಂದ
    ನಾನು. ಜಲಾಶಯಗಳಲ್ಲಿ ಸಮುದ್ರ ನಾನು.

25: >-
    ಮಹರ್ಷಿಗಳಲ್ಲಿ ಭೃಗು ನಾನು. ಮಾತುಗಳಲ್ಲಿ ಒಂದಕ್ಷರ (ಓಂ) ನಾನು. ಯಜ್ಞಗಳಲ್ಲಿ ಜಪಯಜ್ಞ ನಾನು.
    ಪರ್ವತಗಳಲ್ಲಿ ಹಿಮಾಲಯ ನಾನು.

26: >-
    ಎಲ್ಲ ಮರಗಳಲ್ಲಿ ಅಶ್ವತ್ಥ ನಾನು. ದೇವರ್ಷಿಗಳಲ್ಲಿ ನಾರದ ನಾನು. ಗಂಧರ್ವರಲ್ಲಿ ಚಿತ್ರರಥ
    ನಾನು. ಸಿದ್ಧರಲ್ಲಿ ಕಪಿಲಋಷಿ ನಾನು.

27: >-
    ಕುದುರೆಗಳಲ್ಲಿ ಕ್ಷೀರಸಮುದ್ರದಿಂದ ಮೇಲೆ ಬಂದ ಉಚ್ಚೈಃಶ್ರವಸ್ಸು (ಇಂದ್ರನ ಕುದುರೆ) ನಾನು
    ಎಂದು ತಿಳಿ. ಆನೆಗಳಲ್ಲಿ ಐರಾವತ (ಇಂದ್ರನ ಆನೆ) ನಾನು. ಮನುಷ್ಯರಲ್ಲಿ ರಾಜನು ನಾನು.

28: >-
    ಆಯುಧಗಳಲ್ಲಿ ವಜ್ರಾಯುಧ ನಾನು. ದನಗಳಲ್ಲಿ ಕಾಮಧೇನು ನಾನು. ಸಂತಾನ ನೀಡುವವರಲ್ಲಿ ಶ್ರೇಷ್ಠ
    ಮನ್ಮಥ ನಾನು. ಸರ್ಪಗಳಲ್ಲಿ ವಾಸುಕಿ ನಾನು.

29: >-
    ನಾಗಗಳಲ್ಲಿ ಶೇಷ ನಾನು. ಜಲಚರಗಳ ಒಡೆಯ ವರುಣ ನಾನು. ಪಿತೃದೇವತೆಗಳ ಒಡೆಯ ಅರ‍್ಯಮಾ ನಾನು.
    ದಂಡಿಸುವವರಲ್ಲಿ ಯಮ ನಾನು.

30: >-
    ದೈತ್ಯರಲ್ಲಿ ಪ್ರಹ್ಲಾದ ನಾನು. ಕಳೆಯುವವರಲ್ಲಿ ಕಾಲ ನಾನು. ಮೃಗಗಳಲ್ಲಿ ಸಿಂಹ ನಾನು.
    ಹಕ್ಕಿಗಳಲ್ಲಿ ವಿನತೆಯ ಮಗನಾದ ಗರುಡ ನಾನು.

31: >-
    ಪಾವನಗೊಳಿಸುವ ವಸ್ತುಗಳಲ್ಲಿ ಗಾಳಿ ನಾನು. ಆಯುಧ ಹೊತ್ತವರಲ್ಲಿ ಪರಶುರಾಮ ನಾನು. ಮೀನುಜಾತಿಗಳಲ್ಲಿ
    ಮೊಸಳೆ ನಾನು. ನದಿಗಳಲ್ಲಿ ಗಂಗೆ ನಾನು.

32: >-
    ಓ ಅರ್ಜುನನೆ, ಎಲ್ಲದರ ಹುಟ್ಟಿಗೆ ಬುಡ, ನಡು, ಕೊನೆ ನಾನೇ. ವಿದ್ಯೆಗಳಲ್ಲಿ ಅಧ್ಯಾತ್ಮ ವಿದ್ಯೆ
    ನಾನು. ತತ್ವಕ್ಕಾಗಿ ನಡೆಸುವ ಚರ್ಚೆಗಳಲ್ಲಿ ವಾದ ನಾನು.

33: >-
    ಅಕ್ಷರಗಳಲ್ಲಿ ಅಕಾರ ನಾನು. ಸಮಾಸಗಳಲ್ಲಿ ದ್ವಂದ್ವಸಮಾಸ ನಾನು. ನಾಶವಿಲ್ಲದ ಕಾಲವೂ ನಾನೇ.
    ಎಲ್ಲೆಡೆ ಇದ್ದು ಎಲ್ಲವನ್ನೂ ಹೊತ್ತು ಪೋಷಿಸುವವನು ನಾನು.

34: >-
    ಎಲ್ಲವನ್ನು ಸಂಹರಿಸುವ ಮೃತ್ಯುದೇವತೆ ನಾನು. ಮುಂದೆ ಆಗುವುದನ್ನು ಹುಟ್ಟಿಸುವವನು ನಾನು.
    ಹೆಂಗಸರಲ್ಲಿ ಕೀರ್ತಿ, ಶ್ರೀ, ಮಾತು, ನೆನಪು, ಧಾರಣಾಶಕ್ತಿ, ಧೈರ್ಯ, ಕ್ಷಮೆ ನಾನು.

35: >-
    ಬೃಹತ್, ರಥಂತರ, ತ್ರಿರೂಪ, ವೈರಾಜ, ಶಾಕ್ವರ ಮತ್ತು ದೈವತಗಳೆಂಬ ಆರು ಸಾಮಗಳಲ್ಲಿ ನಾನು
    ಬೃಹತ್ಸಾಮ. ಗಾಯತ್ರೀ, ಉಷ್ಣಿಕ್, ಅನುಷ್ಟುಪ್, ಬೃಹತೀ, ಪಂಕ್ತಿ, ತ್ರಿಷ್ಟುಪ್, ಮತ್ತು
    ಜಗತೀ ಎಂಬ ಏಳು ಛಂದಸ್ಸುಗಳಲ್ಲಿ ಗಾಯತ್ರೀ ಛಂದಸ್ ನಾನು. ಚೈತ್ರ, ವೈಶಾಖ, ಜ್ಯೇಷ್ಠ, ಆಷಾಢ,
    ಶ್ರಾವಣ, ಭಾದ್ರಪದ, ಆಶ್ವಯುಜ, ಕಾರ್ತಿಕ, ಮಾರ್ಗಶೀರ್ಷ, ಪುಷ್ಯ, ಮಾಘ ಮತ್ತು
    ಫಾಲ್ಗುನಗಳೆಂಬ ೧೨ ತಿಂಗಳುಗಳಲ್ಲಿ ಮಾರ್ಗಶೀರ್ಷ ನಾನು. ವಸಂತ, ಗ್ರೀಷ್ಮ, ವರ್ಷ, ಶರತ್,
    ಹೇಮಂತ ಮತ್ತು ಶಿಶಿರಗಳೆಂಬ ಆರು ಋತುಗಳಲ್ಲಿ ವಸಂತ ನಾನು.

36: >-
    ಮೋಸದ ಆಟಗಳಲ್ಲಿ ಜೂಜು ನಾನು. ತೇಜಸ್ವಿಗಳಲ್ಲಿ ತೇಜಸ್ ನಾನು. ಗೆಲುವು ನಾನು. ದುಡಿಮೆ ನಾನು.
    ಸಾರವುಳ್ಳ ವಸ್ತುಗಳಲ್ಲಿ ಸಾರ ನಾನು.

37: >-
    ಯಾದವರಲ್ಲಿ ವಸುದೇವನ ಮಗ ಕೃಷ್ಣ ನಾನು. ಪಾಂಡುಸುತರಲ್ಲಿ ಅರ್ಜುನ ನಾನು. ಮುನಿಗಳಲ್ಲಿ ನಾನು
    ವೇದವ್ಯಾಸ. ಕವಿಗಳಲ್ಲಿ ನಾನು ಶುಕ್ರ.

38: >-
    ಶಿಕ್ಷಿಸುವುದರಲ್ಲಿ ದಂಡ ನಾನು. ಗೆಲ್ಲಲು ಬಯಸುವವರ ನಯಗಾರಿಕೆ ನಾನು. ಗುಟ್ಟುಗಳಲ್ಲಿ ಮೌನ
    ನಾನು. ಜ್ಞಾನಿಗಳಲ್ಲಿ ಜ್ಞಾನ ನಾನು.

39: >-
    ಓ ಅರ್ಜುನನೆ, ಎಲ್ಲದರ ಹುಟ್ಟಿಗೆ ಕಾರಣ ಏನೆಲ್ಲ ಇದೆಯೊ ಅದು ನಾನೆ. ಹುಟ್ಟಿದ ಈ ಜಡ-ಜೀವ
    ಪ್ರಪಂಚ ನನ್ನನ್ನು ಬಿಟ್ಟು ಇಲ್ಲ.

40: >-
    ಓ ಪರಂತಪನೆ, ನನ್ನ ದಿವ್ಯವಿಭೂತಿರೂಪಗಳಿಗೆ ಕೊನೆ ಇಲ್ಲ. ಉದಾಹರಣೆಯಾಗಿ ಕೆಲವು
    ವಿಭೂತಿರೂಪಗಳನ್ನು ಸ್ವಲ್ಪ ವಿಸ್ತರಿಸಿ ನಾನು ಹೇಳಿದೆ.

41: >-
    ಸಾರವತ್ತಾದ್ದು, ಶ್ರೀಮಂತವಾದ್ದು, ಉತ್ತಮ ಮಟ್ಟದ್ದು ಏನೆಲ್ಲ ಇದೆಯೋ ಅವೆಲ್ಲವೂ ನನ್ನ
    ವಿಭೂತಿರೂಪವುಳ್ಳದ್ದು ಎಂದು ತಿಳಿ. ಅದು ನನ್ನ ತೇಜಸ್ಸಿನ ತುಣುಕನ್ನು ಹೊತ್ತು ಬಂದಿದೆ.

42: >-
    ಓ ಅರ್ಜುನನೆ, ಮತ್ತೆ ನಿನಗೆ ಈ ನಾನಾ ವಿಭೂತಿಗಳ ಅರಿವಿನಿಂದ ಏನು ತಿಳಿದ ಹಾಗಾಯಿತು? ನಾನು
    ಒಂದಂಶದಿಂದ ಪೂರ್ತಿ ಪ್ರಪಂಚವನ್ನು ವ್ಯಾಪಿಸಿ ಇದ್ದೇನೆ.

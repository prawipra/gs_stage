1: >-
    ಅರ್ಜುನನು ಕೇಳಿದನು - ಓ ಪುರುಷೋತ್ತಮನೆ, ಯಾವುದು ಆ ಬ್ರಹ್ಮ? ಅಧ್ಯಾತ್ಮ ಎಂದರೆ ಏನು?
    ಕರ್ಮ ಎಂದರೆ ಏನು? ಅಧಿಭೂತ ಯಾವುದು ಮತ್ತು ಅಧಿದೈವ ಯಾವುದು?

2: >-
    ಓ ಮಧುಸೂದನನೆ, ಇಲ್ಲಿ ಅಧಿಯಜ್ಞ ಯಾರು? ಈ ದೇಹದಲ್ಲಿ ಅಧಿಯಜ್ಞ ಹೇಗೆ? ಮನೋನಿಗ್ರಹ
    ಉಳ್ಳವನು ಸಾಯುವಾಗ ನಿನ್ನನ್ನು ಹೇಗೆ ತಿಳಿಯಬೇಕು?

3: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ನಾಶವಿಲ್ಲದ್ದು, ರ‍್ವೋತ್ತಮವಾದದ್ದು ಬ್ರಹ್ಮ. ಜೀವಸ್ವರೂಪ ಮತ್ತು
    ಜೀವನಿಗೆ ಸಂಬಂಧಿಸಿದ ದೇಹ ಅಧ್ಯಾತ್ಮ ಎನಿಸಿದೆ. ಜೀವ-ಜಡಗಳ ಹುಟ್ಟಿಗೆ ಕಾರಣನಾದ ದೇವರ ವಿವಿಧ
    ಸೃಷ್ಟಿಯು ಕರ್ಮ ಎನಿಸಿದೆ.

4: >-
    ನಾಶವಾಗುವ ಪ್ರಪಂಚ ಅಧಿಭೂತ. ದೇಹ ಎಂಬ ಪುರವನ್ನು ನಡೆಸುವ ಶ್ರೀ, ಪ್ರಾಣ, ಶೇಷರು ಅಧಿದೈವರು.
    ಓ ವೀರನೇ, ಈ ಜೀವರೆಲ್ಲರ ಪ್ರತಿಯೊಂದು ದೇಹದಲ್ಲಿಯೂ ನಾನೇ ಅಧಿಯಜ್ಞ.

5: >-
    ಸಾಯುವಾಗ ನನ್ನನ್ನೇ ಸ್ಮರಿಸುತ್ತ ದೇಹವನ್ನು ಬಿಟ್ಟು ಹೋಗುವವನು ನಿಶ್ಚಯವಾಗಿಯೂ ನನ್ನ ಲೋಕವನ್ನು
    ಸೇರುತ್ತಾನೆ.

6: >-
    ಓ ಕೌಂತೇಯನೆ, ಸಾಯುವಾಗ ಯಾವ ಯಾವ ಸಂಗತಿಯನ್ನು ನೆನೆಯುತ್ತಾ ದೇಹವನ್ನು ಬಿಡುತ್ತಾನೋ,
    ಅದನ್ನೇ ಮತ್ತೆ ಪಡೆಯುತ್ತಾನೆ. ಏಕೆಂದರೆ ನಿತ್ಯ ಅದೇ ಸಂಗತಿಯಲ್ಲಿಯೇ ಆಸಕ್ತನಾಗಿದ್ದರಿಂದ.

7: >-
    ಆದ್ದರಿಂದ ಯಾವಾಗಲೂ ನನ್ನನ್ನೇ ನೆನೆಯುತ್ತಿರು. ನನ್ನಲ್ಲಿ ಮನಸ್ಸಿಟ್ಟು ಯಾವಾಗಲೂ ನನಗಾಗಿ
    ಹೋರಾಡು. ನಿಶ್ಚಯವಾಗಿಯೂ ನನ್ನನ್ನೇ ಸೇರುವೆ.

8: >-
    ಓ ಪಾರ್ಥನೆ, ಬೇರೆ ಏನನ್ನೂ ನೆನೆಯದ ಮನಸ್ಸಿನಿಂದ, ಪುರುಷೋತ್ತಮನನ್ನು ಭಕ್ತಿಯಿಂದ ಮತ್ತೆ
    ಮತ್ತೆ ಧ್ಯಾನಿಸಿದಾಗ, ಎಲ್ಲಕ್ಕಿಂತ ಬೇರೆಯಾದ ದೇವನನ್ನು ಪಡೆಯುತ್ತಾನೆ.

9: >-
    ಎಲ್ಲವನ್ನು ತಿಳಿದ, ಎಲ್ಲಕ್ಕಿಂತ ಮೊದಲು ಇದ್ದ, ಎಲ್ಲವನ್ನು ನಿಯಮಿಸುವ, ಅಣುವಿಗಿಂತಲು
    ಸೂಕ್ಷ್ಮನಾದ, ಎಲ್ಲವನ್ನು ಹೊತ್ತು ಸಾಕುವ, ಯೋಚನೆಗೆ ಸಿಗಲಾರದ ರೂಪವುಳ್ಳ, ಪ್ರಕೃತಿಗಿಂತ
    ಮಿಗಿಲಾದ, ಸೂರ್ಯನೊಳಗಿನ ತೇಜಸ್ಸನ್ನು ಯೋಗಿಯು ನಿರಂತರ ಧ್ಯಾನಿಸಬೇಕು.

10: >-
    ಪುರುಷೋತ್ತಮನನ್ನು ಚೆನ್ನಾಗಿ ತಿಳಿದು ಪ್ರೀತಿಸಿದ ಯೋಗಿಯು ಸಾಯುವಾಗ ಸ್ಥಿರವಾದ ಮನಸ್ಸಿನಿಂದ,
    ಯೋಗಸಾಮರ್ಥ್ಯದಿಂದ, ಉಸಿರನ್ನು ಹುಬ್ಬುಗಳ ನಡುವೆ ಬಂಧಿಸಿ ದೇವನ ಬಳಿಗೆ ಸಾಗುತ್ತಾನೆ.

11: >-
    ವೇದಗಳನ್ನು ತಿಳಿದವರು ಅವನನ್ನು ಅಕ್ಷರ ಎನ್ನುತ್ತಾರೆ. ವೈರಾಗ್ಯವುಳ್ಳ ಯತಿಗಳು ಅವನನ್ನು
    ಸೇರುತ್ತಾರೆ. ಅವನನ್ನು ಬಯಸಿಯೇ ಬ್ರಹ್ಮಚರ್ಯವನ್ನು ನಡೆಸುತ್ತಾರೆ. ನಿನಗೆ ಅವನ
    ಸ್ವರೂಪವನ್ನು ಸಂಕ್ಷೇಪವಾಗಿ ಹೇಳುತ್ತೇನೆ.

12: >-
    ಕಣ್ಣು ಕಿವಿ ಮುಂತಾದ ಎಲ್ಲಾ ಬಾಗಿಲುಗಳನ್ನು ಮುಚ್ಚಿಟ್ಟು, ಮನಸ್ಸನ್ನು ದೇವರಲ್ಲಿ
    ನೆಲೆಸಿಟ್ಟು, ತನ್ನ ಉಸಿರನ್ನು ನೆತ್ತಿಯಲ್ಲಿಗೆ ತಂದು ಧ್ಯಾನವನ್ನು ನಡೆಸಬೇಕು.

13: >-
    ಓಂ ಎಂಬ ಏಕಾಕ್ಷರ ಮಂತ್ರವನ್ನು ಜಪಿಸುತ್ತಾ, ನನ್ನನ್ನು ನಿರಂತರ ನೆನೆಯುತ್ತ, ದೇಹವನ್ನು
    ಬಿಟ್ಟು ಹೊರಟವನು ಉತ್ತಮವಾದ ಗತಿಯನ್ನು ಹೊಂದುತ್ತಾನೆ.

14: >-
    ಓ ಪಾರ್ಥನೆ, ಬೇರೇನನ್ನೂ ನೆನೆಯದೆ ಪ್ರತಿದಿನವೂ ನಿರಂತರವಾಗಿ ನನ್ನನ್ನೆ ಸ್ಮರಿಸುವ
    ಧ್ಯಾನಯೋಗಿಗೆ ನಾನು ಆಯಾಸವಿಲ್ಲದೆ ಸಿಗುವೆನು.

15: >-
    ನನ್ನನ್ನು ಪಡೆದ ಮೇಲೆ ಮತ್ತೆ ಹುಟ್ಟಿ ಬರುವುದಿಲ್ಲ. ದುಃಖದ ತಾಣವಾದ ನರಕವನ್ನು
    ಹೊಂದಲಾರರು. ನಿತ್ಯವಿಲ್ಲದ ಸಂಸಾರವನ್ನು ಪಡೆಯುವುದಿಲ್ಲ. ಮುಕ್ತಜೀವರು ಎನಿಸುತ್ತಾರೆ.
    ಮೋಕ್ಷವನ್ನು ಸೇರುತ್ತಾರೆ.

16: >-
    ಓ ಕುಂತಿಯ ಪುತ್ರನಾದ ಅರ್ಜುನನೇ, ಬ್ರಹ್ಮಲೋಕದವರೆಗಿನ ಎಲ್ಲಾ ಲೋಕಗಳಿಂದಲೂ ಹಿಂದೆ ಬಂದು
    ಹುಟ್ಟಲಿದೆ. ನನ್ನ ಹೊಂದಿದ ಮೇಲೆ ಮತ್ತೆ ಹುಟ್ಟು ಇಲ್ಲ.

17: >-
    ನಾಲ್ಕು ಯುಗಗಳು ಸಾವಿರವಾದಾಗ ಚತುರ್ಮುಖ ಬ್ರಹ್ಮನ ಒಂದು ಹಗಲು ಕಾಲವೆಂದು ತಿಳಿಯುವರು.
    ರಾತ್ರಿಯೂ ಅಷ್ಟೇ ಸಾವಿರ ಯುಗಚಕ್ರಗಳು ಎಂದು ತಿಳಿಯುವರು. ಇವರು ದಿನವನ್ನು ತಿಳಿದವರು.

18: >-
    ಕಾಣಿಸಿಕೊಳ್ಳದ ದೇವರಿಂದ ಹಗಲಾದಾಗ ಕಾಣುವ ಈ ಎಲ್ಲವೂ ಹುಟ್ಟಿಬರುತ್ತವೆ. ರಾತ್ರಿಯಾದಾಗ ಅದೇ
    ಕಾಣದ ದೇವರಲ್ಲಿ ಲಯಗೊಳ್ಳುತ್ತವೆ.

19: >-
    ಓ ಪಾರ್ಥನೆ, ದೇವನ ಇಚ್ಛೆಯಂತೆ ಪಂಚಭೂತಗಳ ರಾಶಿ ಮತ್ತೆ ಮತ್ತೆ ಹುಟ್ಟುತ್ತ ರಾತ್ರಿಯಾದಾಗ
    ಲಯಗೊಳ್ಳುತ್ತದೆ. ಹಗಲಾದಾಗ ಮತ್ತೆ ಒಟ್ಟು ಸೇರುತ್ತದೆ.

20: >-
    ಈ ಕಾಣುವ ವಿಶ್ವಕ್ಕಿಂತ ಬೇರೆಯಾದವನು ಮತ್ತು ಉತ್ತಮನು ಕಾಣದ ದೇವನು. ಈ ಎಲ್ಲ ಭೂತಗಳು ನಾಶ
    ಹೊಂದಿದಾಗಲೂ ಯಾವ ರೀತಿಯಿಂದಲೂ ನಾಶವಾಗದವನು, ಎಂದೆಂದೂ ಇರುವವನು ಈ ಅವ್ಯಕ್ತನು.

21: >-
    ಈ ಅವ್ಯಕ್ತನು ಅಕ್ಷರನು ಎನಿಸಿದ್ದಾನೆ. ಅವನನ್ನೇ ಕೊನೆಯದಾಗಿ ಸೇರಬೇಕು ಎನ್ನುತ್ತಾರೆ.
    ಅವನನ್ನು ಪಡೆದವರು ಮತ್ತೆ ಸಂಸಾರಕ್ಕೆ ಬರುವುದಿಲ್ಲ. ಅವನು ನಾನೇ. ಆ ಉತ್ತಮ ತಾಣ ನನ್ನ ಲೋಕ.

22: >-
    ಓ ಪಾರ್ಥನೆ, ಬೇರೆ ದೇವತೆಗಳಲ್ಲಿ ಮಾಡದ, ಅವನಲ್ಲಿ ಮಾತ್ರವೇ ಮಾಡಿದ ಭಕ್ತಿಯಿಂದ ಆ
    ಪುರುಷೋತ್ತಮನು ಸಿಗುವನು. ಅವನ ಒಳಗೆ ಎಲ್ಲವೂ ಇದೆ. ಅವನು ಈ ಎಲ್ಲವನ್ನೂ ಆವರಿಸಿದ್ದಾನೆ.

23: >-
    ಓ ಭರತವಂಶಶ್ರೇಷ್ಠನೆ, ಯೋಗಿಗಳು ಯಾವ ಕಾಲದಲ್ಲಿ ಸತ್ತರೆ (ಕಾಲನಿಯಾಮಕರಾದ ದೇವತೆಗಳ ದಾರಿಯಲ್ಲಿ
    ಸಾಗಿದರೆ) ಮತ್ತೆ ಸಂಸಾರಕ್ಕೆ ಬರುವುದಿಲ್ಲ, ಮತ್ತು ಯಾವ ಕಾಲದಲ್ಲಿ ತೆರಳಿದಾಗ ಬರುತ್ತಾರೆ
    ಅಂಥ ಕಾಲ ವಿಚಾರವನ್ನು ಹೇಳುತ್ತೇನೆ.

24: >-
    ಅಗ್ನಿ, ಜ್ಯೋತಿ, ಹಗಲು, ಶುಕ್ಲಪಕ್ಷ, ಉತ್ತರಾಯಣ ಕಾಲದ ಆರು ತಿಂಗಳು ಮತ್ತು ಉತ್ತರಾಯಣ -
    ಈ ಕಾಲನಿಯಾಮಕರ ದಾರಿಯಲ್ಲಿ ತೆರಳಿದ ಬ್ರಹ್ಮಜ್ಞಾನಿಗಳು ಮತ್ತೆ ಹುಟ್ಟಿ ಬರುವುದಿಲ್ಲ. ದೇವನನ್ನು
    ಸೇರುತ್ತಾರೆ.

25: >-
    ಹೊಗೆ, ರಾತ್ರಿ, ಕೃಷ್ಣಪಕ್ಷ, ದಕ್ಷಿಣಾಯನ ಕಾಲದ ಆರು ತಿಂಗಳು ಮತ್ತು ದಕ್ಷಿಣಾಯನ - ಈ
    ಕಾಲನಿಯಾಮಕರ ದಾರಿಯಲ್ಲಿ ತೆರಳಿದ ಯೋಗಿಯು ಚಂದ್ರನ ಬೆಳಕಿನ ಲೋಕವನ್ನು ಸೇರಿ ಮತ್ತೆ ಭೂಮಿಗೆ
    ಹುಟ್ಟಿಬರುತ್ತಾನೆ.

26: >-
    ಇವು ವಿಶ್ವದ ಬಿಳಿ ಮತ್ತು ಕಪ್ಪು ದಾರಿಗಳು. ಎಂದೆಂದೂ ಇರುತ್ತವೆ ಎಂದು ಶಾಸ್ತ್ರಗಳ ಮಾತು.
    ಒಂದರಿಂದ ಮತ್ತೆ ಬರುವುದಿಲ್ಲ, ಇನ್ನೊಂದರಿಂದ ಮತ್ತೆ ಬರುತ್ತಾನೆ.

27: >-
    ಓ ಪಾರ್ಥನೆ, ಈ ಎರಡು ದಾರಿಗಳನ್ನು ತಿಳಿದ ಯಾವ ಯೋಗಿಯೂ ಮೋಹಗೊಳ್ಳುವುದಿಲ್ಲ. ಓ ಅರ್ಜುನನೆ,
    ಆದ್ದರಿಂದ ಯಾವಾಗಲೂ ಯೋಗದೊಡನೆ ಇರು.

28: >-
    ಇದನ್ನು ತಿಳಿದ ಯೋಗಿಯು ಯಜ್ಞ - ದಾನ - ತಪಸ್ಸುಗಳಿಗೆ ಮತ್ತು ವೇದದ ಓದಿಗೆ ಹೇಳಿದ
    ಪುಣ್ಯಫಲವನ್ನೆಲ್ಲ ಮೀರುತ್ತಾನೆ. ಎಲ್ಲಕ್ಕೂ ಮೊದಲು ಇರುವ ಶ್ರೇಷ್ಠ ತಾಣವನ್ನು ಹೊಂದುತ್ತಾನೆ.

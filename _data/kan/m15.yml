1: >-
    ವಿಶ್ವವು ಅಶ್ವತ್ಥಮರದಂತೆ. ಇಂದು ಇದ್ದಂತೆ ನಾಳೆ ಇರದು, ಪೂರ್ತಿ ನಾಶವಾಗದು. ಇದರ
    ಬೇರು- ಪರಮಾತ್ಮ ಮತ್ತು ಪ್ರಕೃತಿ ಮೇಲೆ ಇದೆ. ಕೆಳಗೆ ಗೆಲ್ಲುಗಳು - ಜಡಜೀವಗಳು, ಎಲೆಗಳು -
    ವೇದಗಳು. ಇದನ್ನು ತಿಳಿದವನು ವೇದವನ್ನು ಬಲ್ಲವನು.

2: >-
    ತ್ರಿಗುಣಗಳಿಂದ ಬೆಳೆದ ಅದರ ಗೆಲ್ಲುಗಳು ಕೆಳಗೆ ಮತ್ತು ಮೇಲೆ ಹರಡಿಕೊಂಡಿವೆ. ಇಂದ್ರಿಯವಿಷಯಗಳು
    ಚಿಗುರುಗಳು. ಜೀವಿಗಳ ಕರ್ಮಗಳನ್ನು ಅನುಸರಿಸಿ ಅದರ ಬೇರುಗಳು ಕೆಳಗೆ ಮನುಷ್ಯರ ಈ ಭೂಮಿಯಲ್ಲಿಯೂ
    ಹರಡಿವೆ.

4: >-
    ಇದರ ರೂಪ ಇದ್ದ ಹಾಗೆ ಕಾಣಲು ಸಿಗುವುದಿಲ್ಲ, ಇದರ ತುದಿ ಬುಡ ಮತ್ತು ನೆಲೆಯೂ ಕಾಣದು.
    ಗಟ್ಟಿಯಾಗಿ ಬೇರುಬಿಟ್ಟ ಈ ಅಶ್ವತ್ಥವನ್ನು ಅನಾಸಕ್ತಿ (ಅಂಟಿಸಿಕೊಳ್ಳದಿರುವಿಕೆ) ಎಂಬ ಗಟ್ಟಿಯಾದ
    ಆಯುಧದಿಂದ ಕಡಿದು ಮತ್ತೆ ಆ ಪರಮಾತ್ಮನನ್ನು ಶಾಸ್ತ್ರಗಳಲ್ಲಿ ಚಿಂತನೆ ಮಾಡಬೇಕು. ಅವನನ್ನು
    ಸೇರಿದವರು ಮತ್ತೆ ಸಂಸಾರಕ್ಕೆ ಬರುವುದಿಲ್ಲ. ವಿಶ್ವದ ಈ ನಡೆಗಳು ಹಿಂದಿನಿಂದಲೂ ಯಾರಿಂದ
    ಆಗುತ್ತಿವೆಯೋ ಆ ಮೊದಲಿದ್ದ ಪುರುಷೋತ್ತಮನನ್ನೆ ಶರಣಾಗಬೇಕು.

5: >-
    ಶಾಸ್ತ್ರ ವಿಷಯದಲ್ಲಿ ಭ್ರಮೆ ಇಲ್ಲದವರು, ವಿಷಯಗಳ ಸಂಪರ್ಕದ ಹಾನಿಗೆ ಒಳಗಾಗದವರು, ನಿತ್ಯವೂ
    ಪರಮಾತ್ಮನಲ್ಲಿ ನೆಲೆಗೊಂಡವರು, ಬಯಕೆಗಳನ್ನು ಬಿಟ್ಟವರು, ಸುಖ-ದುಃಖಗಳೆಂಬ ದ್ವಂದ್ವಗಳನ್ನು
    ಮೀರಿದವರು ಜ್ಞಾನಿಗಳು ಆ ನಾಶವಿಲ್ಲದ ಸ್ಥಾನವನ್ನು ಸೇರುತ್ತಾರೆ.

6: >-
    ಆ ಸ್ಥಾನವನ್ನು ಸೇರಿದವರು ಮತ್ತೆ ಸಂಸಾರಕ್ಕೆ ಬರುವುದಿಲ್ಲ. ಅದು ನನ್ನ ಶ್ರೇಷ್ಠವಾದ ಸ್ಥಾನ.
    ಅದನ್ನು ಸೂರ್ಯನಾಗಲಿ, ಚಂದ್ರನಾಗಲಿ ಬೆಳಗಿಸುವುದಿಲ್ಲ, ಬೆಂಕಿಯೂ ಬೆಳಗಿಸದು.

7: >-
    ಈ ದೇಹದಲ್ಲಿರುವ ನಿತ್ಯನಾದ ಜೀವನೂ ನನ್ನ ಭಿನ್ನಾಂಶನು, ಪ್ರತಿಬಿಂಬನು. ಅವನು ದೇಹದಲ್ಲಿರುವ
    ಐದು ಜ್ಞಾನೇಂದ್ರಿಯಗಳನ್ನು ಆರನೆಯ ಮನಸ್ಸಿನ ಜೊತೆಗೆ ವಿಷಯಗಳೆಡೆಗೆ ಎಳೆಯುತ್ತಾನೆ.

8: >-
    ಜೀವನು ದೇಹವನ್ನು ಸೇರಿದಾಗ ಮತ್ತು ದೇಹವನ್ನು ಬಿಟ್ಟು ಹೋದಾಗ ಸಚೇಷ್ಟಕನಾದ ದೇವನು ಈ
    ಇಂದ್ರಿಯಗಳನ್ನು ನಿಯಂತ್ರಿಸುತ್ತ ಜತೆಗೆ ಬರುತ್ತಾನೆ. ಗಾಳಿ ತಾನಿದ್ದ ತಾಣದ ವಾಸನೆಯನ್ನು
    ಹೊತ್ತು ಬಂದಂತೆ.

9: >-
    ಕಿವಿ, ಕಣ್ಣು, ಚರ್ಮ, ನಾಲಿಗೆ, ಮೂಗು ಮತ್ತು ಮನಸ್ಸಿನಲ್ಲಿ ನೆಲೆಸಿ ದೇವನು ಉತ್ತಮ
    ವಿಷಯಗಳನ್ನು ಅನುಭವಿಸುತ್ತಾನೆ.

10: >-
    ದೇಹ ಬಿಟ್ಟುಹೋದಾಗ, ದೇಹದಲ್ಲಿ ಇದ್ದಾಗ ಅಥವಾ (ದೋಷವಿಲ್ಲದ) ಗುಣಯುತವಾದ ಸಾರವನ್ನಷ್ಟೆ
    ಸ್ವೀಕರಿಸುವ ದೇವನನ್ನು ಅಜ್ಞಾನಿಗಳು ತಿಳಿಯಲಾರರು, ಜ್ಞಾನಿಗಳು ತಿಳಿಯುತ್ತಾರೆ.

11: >-
    ಯೋಗಿಗಳು ಪ್ರಯತ್ನಪಟ್ಟು ತನ್ನಲ್ಲಿ ನೆಲೆಸಿರುವ ದೇವನನ್ನು ಕಾಣುತ್ತಾರೆ. ಅಜ್ಞಾನಿಗಳು,
    ಅಶುದ್ಧ ಬುದ್ಧಿಯವರು ಪ್ರಯತ್ನಿಸಿದರೂ ಇವನನ್ನು ಕಾಣುವುದಿಲ್ಲ.

12: >-
    ವಿಶ್ವವನ್ನೆಲ್ಲ ಬೆಳಗುವ ಸೂರ್ಯನಲ್ಲಿದ್ದ ಬೆಳಕು ನನ್ನ ಬೆಳಕು ಎಂದು ತಿಳಿ. ಹಾಗೆಯೆ
    ಚಂದ್ರನಲ್ಲಿನ ಮತ್ತೆ ಅಗ್ನಿಯಲ್ಲಿನ ಬೆಳಕೂ ನನ್ನದೇ.

13: >-
    ಭೂಮಿಯನ್ನು ಪ್ರವೇಶಿಸಿ ನಾನೇ ನನ್ನ ಸಾಮರ್ಥ್ಯದಿಂದ ಜಡ-ಜೀವಿಗಳನ್ನೆಲ್ಲ ಹೊತ್ತಿದ್ದೇನೆ.
    ಅಮೃತರಸರೂಪದ ಚಂದ್ರನಾಗಿ ನಾನೇ ಎಲ್ಲ ಸಸ್ಯಗಳನ್ನು ಪೋಷಿಸುತ್ತೇನೆ.

14: >-
    ನಾನು ವೈಶ್ವಾನರ ಎಂಬ ಬೆಂಕಿಯಾಗಿ ಜೀವಿಗಳ ದೇಹದ ಒಳಗಿದ್ದು ಪ್ರಾಣ ಮತ್ತು ಅಪಾನರೊಡನೆ
    ನಾಲ್ಕು ಬಗೆಯ (ತಿನ್ನುವ, ಚೀಪುವ, ನೆಕ್ಕುವ, ಕುಡಿಯುವ) ಆಹಾರವನ್ನು ಕರಗಿಸುತ್ತೇನೆ.

15: >-
    ಎಲ್ಲರ ಹೃದಯದಲ್ಲಿ ನಾನು ನೆಲೆಸಿದ್ದೇನೆ. ಎಲ್ಲರಿಗೂ ನನ್ನಿಂದಲೆ ನೆನಪು, ಅರಿವು ಮತ್ತೆ ಮರೆವು.
    ಎಲ್ಲ ವೇದಗಳಿಂದ ತಿಳಿಯಬೇಕಾದವನು ನಾನೇ. ವೇದಾಂತಸೂತ್ರಗಳನ್ನು ರಚಿಸಿದವನೂ ನಾನೆ. ಮತ್ತೆ
    ಎಲ್ಲ ವೇದಗಳನ್ನು ಪೂರ್ತಿ ತಿಳಿದವನೂ ನಾನೆ.

16: >-
    ಲೋಕದಲ್ಲಿ ಕ್ಷರ ಮತ್ತು ಅಕ್ಷರ ಎಂಬ ಎರಡು ಬಗೆಯ ಪುರುಷರು. ಶರೀರ ನಾಶವಾಗುವುದರಿಂದ ಎಲ್ಲ
    ಜೀವರೂ ಕ್ಷರ ಪುರುಷರು. ಶರೀರ ನಾಶವಿರದ ವಿಕಾರ ಇಲ್ಲದೆ ಇರುವ ಚಿತ್‌ಪ್ರಕೃತಿ ಅಕ್ಷರ
    ಪುರುಷಳು.

17: >-
    ಈ ಎರಡಕ್ಕೂ ಮಿಗಿಲಾದವನು ಬೇರೆಯೆ ಪುರುಷನು ಪರಮಾತ್ಮನು ಎಂದು ಕರೆಯಲ್ಪಡುವ ವಿಕಾರವಿರದ ಆ
    ಸರ್ವೋತ್ತಮನೆ ಮೂರು ಲೋಕದೊಳಗಿದ್ದು ಪಾಲಿಸುತ್ತಾನೆ.

18: >-
    ನಾನು ಕ್ಷರವನ್ನು ಮೀರಿ ನಿಂತಿದ್ದೇನೆ ಮತ್ತು ಅಕ್ಷರಕ್ಕಿಂತಲೂ ಶ್ರೇಷ್ಠನು. ಆದ್ದರಿಂದ
    ಲೋಕದಲ್ಲೂ ವೇದದಲ್ಲಿಯೂ ಪುರುಷೋತ್ತಮನು ಎಂದೇ ಪ್ರಸಿದ್ಧನು.

19: >-
    ನನ್ನನ್ನು ಹೀಗೆ ಪುರುಷೋತ್ತಮನೆಂದು ತಪ್ಪಿಲ್ಲದೆ ಚೆನ್ನಾಗಿ ತಿಳಿದವನು, ಎಲ್ಲವನ್ನೂ
    ತಿಳಿದವನು. ಓ ಭಾರತನೆ, ಅವನು ನನ್ನನ್ನೆ ಪೂರ್ಣಭಕ್ತಿಯಿಂದ ಆರಾಧಿಸುತ್ತಾನೆ.

20: >-
    ಓ ಪಾಪದೂರನೆ, ಶಾಸ್ತ್ರದಲ್ಲಿ ತುಂಬಾ ರಹಸ್ಯವಾದ ಮಾತನ್ನು ನಾನು ಹೇಳಿದ್ದೇನೆ. ಓ ಭಾರತನೆ,
    ಇದನ್ನು ತಿಳಿದವನು ದೇವನನ್ನು ತಿಳಿದವನು ಆಗುತ್ತಾನೆ. ಅವನು ಮತ್ತೆ ಮಾಡಬೇಕಾದ್ದೇನೂ
    ಉಳಿದಿರುವುದಿಲ್ಲ.

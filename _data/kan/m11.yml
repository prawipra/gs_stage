1: >-
    ಅರ್ಜುನನು ಹೇಳಿದನು - ನನ್ನನ್ನು ಅನುಗ್ರಹಿಸಲು ಅಧ್ಯಾತ್ಮ ಎಂಬ ದೊಡ್ಡ ರಹಸ್ಯವನ್ನು ನೀನು
    ಹೇಳಿದೆ. ಆ ಮಾತಿನಿಂದ ನನ್ನ ಈ ಮೋಹ (ತಪ್ಪು ಚಿಂತನೆ) ಹೋಯಿತು.

2: >-
    ಓ ಕಮಲದ ಎಸಳಿನಂತೆ ನೀಳವಾದ ಕಣ್ಣಿನವನೆ, ಜೀವಿಗಳ ಹುಟ್ಟು-ಸಾವುಗಳನ್ನು ವಿಸ್ತಾರವಾಗಿ
    ನಿನ್ನಿಂದ ನಾನು ಕೇಳಿದೆನು. ನಿನ್ನ ನಾಶವಿರದ ಮಹಿಮೆಯನ್ನೂ ಕೇಳಿದೆನು.

3: >-
    ಓ ಪರಮೇಶ್ವರನೆ, ನೀನು ನಿನ್ನ ಬಗ್ಗೆ ಏನು ಹೇಳಿದೆಯೋ ಅದು ಹಾಗೆಯೆ ಇದೆ. ಓ ಪುರುಷೋತ್ತಮನೆ,
    ಪ್ರಪಂಚವನ್ನು ಪಾಲಿಸುವ ನಿನ್ನ ರೂಪವನ್ನು ಕಾಣಲು ಬಯಸುತ್ತೇನೆ.

4: >-
    ಓ ಸ್ವಾಮಿಯೆ, ಯೋಗಿಗಳ ಪಾಲಕನೆ, ಆ ರೂಪ ನನ್ನಿಂದ ನೋಡಲು ಸಾಧ್ಯವಿದೆ ಎಂದು ನೀನು
    ತಿಳಿಯುವುದಾದರೆ, ನನಗೆ ನಾಶವಿರದ ನಿನ್ನ ರೂಪವನ್ನು ತೋರಿಸು.

5: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಓ ಪಾರ್ಥನೆ, ಅನೇಕ ಬಣ್ಣಗಳ, ವಿವಿಧ ಆಕಾರಗಳ, ಬಗೆಬಗೆಯಲ್ಲಿ ಹೊಳೆವ
    ನನ್ನ ನೂರಾರು, ಸಾವಿರಾರು, ಇನ್ನೂ ಹೆಚ್ಚಿನ ರೂಪಗಳನ್ನು ನೋಡು.

6: >-
    ಓ ಭಾರತನೆ, ಆದಿತ್ಯರನ್ನೂ ವಸುಗಳನ್ನೂ ರುದ್ರರನ್ನೂ ಅಶ್ವಿನಿಗಳನ್ನೂ ಮತ್ತು
    ಮರುತ್ತುಗಳನ್ನೂ ನೋಡು. ಹಿಂದೆಂದೂ ಕಂಡಿರದ ಬಹಳ ಆಶ್ಚರ್ಯಗಳನ್ನು ನೋಡು.

7: >-
    ಓ ನಿದ್ದೆಯನ್ನು ಗೆದ್ದವನೆ, ಇಲ್ಲಿ ಒಂದೇ ಕಡೆ ಸೇರಿದ ಜಡ-ಜೀವಗಳಿಂದ ಕೂಡಿದ ಪೂರ್ತಿ
    ಪ್ರಪಂಚವನ್ನು ಈಗ ನೋಡು. ಬೇರೆ ಏನನ್ನಾದರೂ ನೋಡಲು ಬಯಸುವೆಯಾದರೆ ಅದನ್ನೂ ನನ್ನ ದೇಹದಲ್ಲಿ
    ನೋಡು.

8: >-
    ನಿನ್ನ ಇದೇ ಕಣ್ಣಿನಿಂದ ನನ್ನನ್ನು ನೋಡಲು ಸಮರ್ಥನು ಆಗಲಾರೆ. ನಿನಗೆ ದಿವ್ಯವಾದ ಕಣ್ಣು
    ನೀಡುತ್ತೇನೆ. ನನ್ನ ವಿಶ್ವಪಾಲನೆಯ ರೂಪವನ್ನು ನೋಡು.

9: >-
    ಓ ಧೃತರಾಷ್ಟ್ರ ರಾಜನೆ, ಮಹಾಯೋಗಿಗಳಿಗೂ ಸ್ವಾಮಿಯಾದ ಕೃಷ್ಣನು ಹೀಗೆ ಹೇಳಿ, ಮತ್ತೆ
    ಅರ್ಜುನನಿಗೆ ವಿಶ್ವವನ್ನು ಪಾಲಿಸುವ ಉತ್ತಮ ರೂಪವನ್ನು ತೋರಿಸಿದನು.

10: >-
    ಬಹಳ ಬಾಯಿ, ಕಣ್ಣುಗಳ ರೂಪ. ನೋಡಲು ಬಹಳ ಅಚ್ಚರಿಯ ರೂಪ. ಹೊಳೆವ ಬಹಳ ಆಭರಣಗಳುಳ್ಳ ರೂಪ.
    ಹೊಳೆವ ಬಹಳ ಆಯುಧಗಳ ಎತ್ತಿಹಿಡಿದ ರೂಪ.

11: >-
    ಹೊಳೆವ ಮಾಲೆಗಳ, ಬಟ್ಟೆಗಳ ಧರಿಸಿರುವ ರೂಪ. ಗಂಧ ಮೆತ್ತಿಕೊಂಡು ಹೊಳೆವ ರೂಪ. ಎಲ್ಲ
    ಆಶ್ಚರ್ಯಗಳ ರಾಶಿ. ಎಲ್ಲ ಲೀಲೆಗಳ ರೂಪ. ಎಲ್ಲೆಡೆಯೂ ತುಂಬಿರುವ ಅನಂತ ರೂಪ.

12: >-
    ಆಕಾಶದಲ್ಲಿ ಸಾವಿರಾರು ಸೂರ್ಯರು ಒಮ್ಮೆಲೇ ಮೂಡಿಬಂದರೆ, ಅಂಥ ಬೆಳಕು ಆ ದೊಡ್ಡ ರೂಪ
    ಹೊತ್ತವನ ಬೆಳಕಿಗೆ ಸಮ ಆದೀತೋ ಏನೋ?

13: >-
    ದೇವೋತ್ತಮನಾದ ಕೃಷ್ಣನ ಆ ದೇಹದಲ್ಲಿ ಇಡಿಯ ಪ್ರಪಂಚವು ಬಹಳ ರೀತಿಯಲ್ಲಿ ವಿಭಾಗಗೊಂಡು ಒಂದೇ
    ಕಡೆ ಇರುವುದನ್ನು ಆಗಲೆ ಅರ್ಜುನನು ಕಂಡನು.

14: >-
    ಅರ್ಜುನನು ನಿಬ್ಬೆರಗಾಗಿ ರೋಮಾಂಚನಗೊಂಡು ತಲೆಯನ್ನು ನೆಲಕ್ಕೆ ತಾಗಿಸಿ ಉದ್ದಂಡ ನಮಿಸಿದನು.
    ಮತ್ತೆ ಆತನು ಕೃಷ್ಣನಿಗೆ ಕೈ ಮುಗಿದು ಹೇಳಿಕೊಂಡನು.

15: >-
    ಓ ದೇವರೆ, ನಿನ್ನ ಶರೀರದಲ್ಲಿ ಎಲ್ಲ ದೇವತೆಗಳನ್ನು ನೋಡುತ್ತಿದ್ದೇನೆ. ಹಾಗೆಯೇ ನಿನ್ನ
    ಶರೀರದಲ್ಲಿ ಎಲ್ಲ ಬಗೆಯ ಜೀವಿಗಳ ರಾಶಿಗಳನ್ನೂ ನೋಡುತ್ತಿದ್ದೇನೆ. ಬ್ರಹ್ಮನನ್ನು
    ನೋಡುತ್ತಿದ್ದೇನೆ. ಪದ್ಮದ ಮೇಲಿರುವ ಬ್ರಹ್ಮನ ತೊಡೆಯಲ್ಲಿ ಶಿವನನ್ನು ನೋಡುತ್ತಿದ್ದೇನೆ. ಎಲ್ಲ
    ಋಷಿಗಳನ್ನೂ ಮತ್ತು ದಿವ್ಯನಾಗಗಳನ್ನೂ ನೋಡುತ್ತಿದ್ದೇನೆ.

16: >-
    ಅನಂತರೂಪನನ್ನಾಗಿ ನಿನ್ನನ್ನು ಕಾಣುತ್ತಿದ್ದೇನೆ. ಎಲ್ಲೆಡೆಯೂ ಬಹಳ ತೋಳುಗಳು, ಹೊಟ್ಟೆಗಳು,
    ಬಾಯಿಗಳು, ಕಣ್ಣುಗಳು ಕಾಣುತ್ತಿವೆ. ಓ ವಿಶ್ವರೂಪನೆ, ಎಲ್ಲರ ಸ್ವಾಮಿಯೇ, ನಿನ್ನ ರೂಪದ ತುದಿ
    ಕಾಣುತ್ತಿಲ್ಲ. ಮಧ್ಯವೂ ಕಾಣದಾಗಿದೆ. ಬುಡವೂ ಕಂಡುಬರುತ್ತಿಲ್ಲ.

17: >-
    ಸುತ್ತಲೂ ಬೆಳಕಿನ ರಾಶಿಯನ್ನೆ ನೋಡುತ್ತಿರುವೆನು. ಹೊಳೆವ ಕಿರೀಟ ತೊಟ್ಟ, ಗದೆ ಹಿಡಿದ,
    ಚಕ್ರವೆತ್ತಿರುವ ನಿನ್ನನ್ನು ಕಾಣುತ್ತಿದ್ದೇನೆ. ನಿನ್ನ ಆ ರೂಪವನ್ನು ಸರಿಯಾಗಿ ಕಾಣಲಾಗುತ್ತಿಲ್ಲ.
    ಹೀಗೆಯೇ ಇದೆ ಎಂದು ಹೇಳಲಾಗುತ್ತಿಲ್ಲ. ಸುತ್ತಲೂ ಉರಿವ ಬೆಂಕಿಯಂತೆ ಮತ್ತು ಸೂರ್ಯನಂತೆ
    ಪ್ರಕಾಶವನ್ನೇ ನೋಡುತ್ತಿದ್ದೇನೆ.

18: >-
    ನೀನು ಮುಖ್ಯವಾಗಿ ತಿಳಿಯಬೇಕಾದ ಓಂಕಾರನು. ನೀನು ಈ ಪ್ರಪಂಚಕ್ಕೆ ದೊಡ್ಡ ಆಶ್ರಯ. ನೀನು
    ನಾಶವಿಲ್ಲದವನು, ಸನಾತನ ಧರ್ಮದ ರಕ್ಷಕನು. ನೀನು ಮೊದಲಿಂದಲೂ ಇದ್ದ ಪುರುಷನು ಎಂದು ನನಗೆ
    ಗೊತ್ತು.

19: >-
    ತುದಿ, ನಡು, ಬುಡವಿಲ್ಲದ ನಿನ್ನ ರೂಪವನ್ನು ನೋಡುತ್ತಿರುವೆನು. ನಾಶವಾಗದ ಬಲವುಳ್ಳ, ಅನಂತ
    ಕೈಗಳುಳ್ಳ ರೂಪವನ್ನು ಕಾಣುತ್ತಿರುವೆನು. ಚಂದ್ರ-ಸೂರ್ಯರ ಸೃಷ್ಟಿಸಿದ ಕಣ್ಣುಗಳ ರೂಪವನ್ನು,
    ಉರಿಯುವ ಬೆಂಕಿಯನ್ನು ಹೊರಚೆಲ್ಲುವ ಬಾಯಿಯ ರೂಪವನ್ನು ನೋಡಿದೆನು. ತನ್ನ ತೇಜಸ್ಸಿನಿಂದ ಈ
    ಜಗತ್ತನ್ನೆ ಸುಡುತ್ತಿರುವ ನಿನ್ನ ರೂಪವನ್ನು ಕಾಣುತ್ತಿದ್ದೇನೆ.

20: >-
    ಭೂಲೋಕ ಮತ್ತು ಸ್ವರ್ಗದ ನಡುವಿನ ಅಂತರಿಕ್ಷವನ್ನೆಲ್ಲ ಹತ್ತು ದಿಕ್ಕುಗಳಲ್ಲೂ ನಿನ್ನ ಒಂದೇ ರೂಪ
    ತುಂಬಿದೆ. ಓ ಬೃಹದ್ರೂಪನೆ, ನಿನ್ನ ಈ ಅದ್ಭುತವಾದ ಭಯಂಕರ ರೂಪವನ್ನು ಕಂಡು ಮೂರೂ ಲೋಕದ
    ಜನರು ಪೂರ್ತಿ ಹೆದರಿ ನಡುಗುತ್ತಿದ್ದಾರೆ.

21: >-
    ಅಸುರರ ಈ ಗುಂಪುಗಳು ನಿನ್ನೊಳಗೆ ಹೋಗುತ್ತಿವೆ. ಕೆಲವರು ಹೆದರಿ ನಿನ್ನನ್ನು ಕೈಮುಗಿದು
    ಹೊಗಳುತ್ತಿದ್ದಾರೆ. ಸ್ವಸ್ತಿ (ಒಳ್ಳೆಯದು ಆಗಲಿ) ಎಂದು ಹೇಳುತ್ತಾ ಮಹರ್ಷಿಗಳ, ಸಿದ್ಧರ
    ಗುಂಪುಗಳು ನಿನ್ನನ್ನು ಸ್ತೋತ್ರಗಳಿಂದ ಸ್ತುತಿಸುತ್ತಿದ್ದಾರೆ.

22: >-
    ರಾಶಿಗಟ್ಟಲೆ ರುದ್ರರು, ಆದಿತ್ಯರು, ವಸುಗಳು, ಸಾಧ್ಯರು, ವಿಶ್ವೇದೇವತೆಗಳು, ಅಶ್ವಿಗಳು,
    ಮರುತ್ತುಗಳು, ಪಿತೃಗಳು, ಗಂಧರ್ವರು, ಯಕ್ಷರು, ಅಸುರರು, ಸಿದ್ಧರು - ಎಲ್ಲರೂ ಬಾಯಿಮುಚ್ಚಿ
    ಕಣ್ಣರಳಿಸಿ ನಿನ್ನನ್ನು ನೋಡುತ್ತಿದ್ದಾರೆ.

23: >-
    ಓ ವಿಶಾಲವಾದ ದೇಹ ಹೊತ್ತವನೇ, ನಿನ್ನ ದೊಡ್ಡ ರೂಪವು ಬಹಳ ಬಾಯಿ, ಕಣ್ಣು, ಕೈ,. ತೊಡೆ, ಕಾಲು,
    ಹೊಟ್ಟೆ, ಕೋರೆಹಲ್ಲುಗಳನ್ನು ಹೊಂದಿದೆ. ಉಗ್ರರೂಪವನ್ನು ಕಂಡು ಜನರು ತುಂಬಾ ಹೆದರಿ ನಡುಗಿ
    ಹೋಗಿದ್ದಾರೆ. ನಾನೂ ಹಾಗೆಯೆ ಬೆದರಿ ನಡುಗುತ್ತಿದ್ದೇನೆ.

24: >-
    ಒಳಗೂ ಹೊರಗೂ ತುಂಬಿ ನಿಂತ ಓ ವಿಷ್ಣುವೆ, ಆಕಾಶವನ್ನು ಮುಟ್ಟಿದ, ಬಹಳ ಬಣ್ಣಗಳ ಬೆಳಕು
    ಹರಡಿದ, ಬಾಯಿ ತೆರೆದ, ಹೊಳೆವ ಕಣ್ಣುಗಳನ್ನು ಅಗಲಿಸಿದ ನಿನ್ನ ರೂಪವನ್ನು ಕಂಡು ಮನಸ್ಸು
    ಹೆದರಿದೆ, ಬಾಧೆ ಪಟ್ಟಿದೆ. ಧೈರ್ಯ ತಪ್ಪಿದೆ. ಶಾಂತಿ ಇಲ್ಲವಾಗಿದೆ.

25: >-
    ಪ್ರಳಯಕಾಲದ ಬೆಂಕಿಯನ್ನು ಹರಿಸುತ್ತಿರುವ ಕಪ್ಪು ಕಪ್ಪಾದ ಕೋರೆಹಲ್ಲುಗಳ ನಿನ್ನ ಬಾಯಿಗಳನ್ನು
    ಕಂಡೇ ದಿಕ್ಕು ತೋಚದಂತಾಗಿದೆ. ಸುಖ ಆಗುತ್ತಿಲ್ಲ. ಓ ದೇವತೆಗಳ ಸ್ವಾಮಿಯೆ, ವಿಶ್ವದಲ್ಲಿ
    ತುಂಬಿರುವವನೆ, ಪ್ರಸನ್ನನಾಗು, ಸುಂದರವಾಗಿ ಕಾಣಿಸಿಕೋ.

27: >-
    ರಾಜರೆಲ್ಲರ ರಾಶಿಗಳೊಡನೆ ಧೃತರಾಷ್ಟ್ರನ ಮಕ್ಕಳೆಲ್ಲರೂ ಮತ್ತು ನಮ್ಮ ಮುಖ್ಯ ಹೋರಾಟಗಾರರೊಡನೆ
    ಭೀಷ್ಮ, ದ್ರೋಣ, ಹಾಗೆ ಈ ಸೂತಪುತ್ರ ಕರ್ಣನೂ ಗಡಿಬಿಡಿಯಿಂದ ನಿನ್ನ ವಿಕಾರ ಕೋರೆಹಲ್ಲುಗಳುಳ್ಳ
    ಭಯಂಕರವಾದ ಬಾಯಿಗಳೊಳಗೆ ಬೀಳುತ್ತಿದ್ದಾರೆ. ಕೆಲವರು ಹಲ್ಲುಗಳ ನಡುವೆ ಸಿಕ್ಕಿಕೊಂಡಿದ್ದಾರೆ.
    ಕೆಲವರ ತಲೆಗಳು ಹುಡಿಹುಡಿಯಾಗಿರುವುದು ಸುತ್ತಲೂ ಕಾಣಿಸುತ್ತಿವೆ.

28: >-
    ನದಿಗಳ ಹಲವು ನೀರ ಪ್ರವಾಹಗಳು ಸಮುದ್ರಕ್ಕೆ ಎದುರಾಗಿಯೇ ಹರಿಯುತ್ತವೆ. ಹೀಗೆ ಈ
    ಮನುಷ್ಯಲೋಕದ ರಾಜರು, ಸುತ್ತಲೂ ಉರಿಯುತ್ತಿರುವ ನಿನ್ನ ಬಾಯಿಗಳ ಒಳಗೆ ಸೇರುತ್ತಿದ್ದಾರೆ.

29: >-
    ಉರಿಯುವ ಬೆಂಕಿಗೆ, ಸಾಯಲೆಂದೆ ಹಾತೆಗಳು ಒಮ್ಮೆಲೇ ಹಾರಿಬಂದು ಬೀಳುತ್ತವೆ. ಹಾಗೆ ಲೋಕದ
    ಜನರು ಸಾಯಲೆಂದೆ ಜೋರಾಗಿ ಓಡುತ್ತ ಬಂದು ನಿನ್ನ ಬಾಯಿಗಳಲ್ಲಿ ಬೀಳುತ್ತಿದ್ದಾರೆ.

30: >-
    ಎಲ್ಲೆಡೆ ತುಂಬಿದ ಓ ವಿಶ್ವರೂಪನೆ, ಬೆಂಕಿ ಹಾರುತ್ತಿರುವ ಬಾಯಿಗಳಿಂದ ಎಲ್ಲ ಜನರನ್ನೂ
    ನುಂಗುತ್ತ ಸುತ್ತಲೂ ನೆಕ್ಕುತ್ತಿರುವೆ. ನಿನ್ನ ತೀಕ್ಷ್ಣ ಕಿರಣಗಳು ಪ್ರಪಂಚವನ್ನು ಪೂರ್ತಿ
    ಆವರಿಸಿ ತುಂಬ ಬಿಸಿಯಿಂದ ಸುಡುತ್ತಿವೆ.

31: >-
    ಉಗ್ರರೂಪನು ನೀನು ಏನು ವೈಭವದವನು? ನನಗೆ ಹೇಳು. ಓ ದೇವಶ್ರೇಷ್ಠನೆ, ನಿನಗೆ ನಮಿಸಿದ್ದೇನೆ.
    ಪ್ರಸನ್ನನಾಗು. ಎಲ್ಲಕ್ಕೂ ಮೊದಲಿರುವ ನಿನ್ನನ್ನು ಚೆನ್ನಾಗಿ ತಿಳಿಯಲು ಬಯಸುತ್ತೇನೆ. ನಿನ್ನ
    ಲೀಲೆ ಸರಿಯಾಗಿ ತಿಳಿದಿಲ್ಲ.

32: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಎಲ್ಲೆಡೆ ತುಂಬಿದ ವಿಶ್ವರೂಪನು ನಾನು, ಲೋಕಗಳನ್ನು ನಾಶ ಮಾಡುವ
    ಕಾಲನು ಆಗಿದ್ದೇನೆ. ಎಲ್ಲರನ್ನೂ ಸಂಹರಿಸಲು ಇಲ್ಲಿ ತೊಡಗಿದ್ದೇನೆ. ನೀನು ಇರದಿದ್ದರೂ, ಎಲ್ಲ
    ಸೇನೆಗಳಲ್ಲಿ ಸೇರಿದ ಎಲ್ಲ ಹೋರಾಟಗಾರರೂ ನಾಶವಾಗುತ್ತಾರೆ.

33: >-
    ಆದ್ದರಿಂದ ನೀನು ಎದ್ದು ನಿಲ್ಲು, ವೈರಿಗಳನ್ನು ಗೆದ್ದು ಕೀರ್ತಿಯನ್ನು ಹೊಂದು. ಇಡಿಯ
    ರಾಜ್ಯವನ್ನು ಪಾಲಿಸು. ಇವರೆಲ್ಲ ನನ್ನಿಂದಲೆ ಮೊದಲೇ ಸತ್ತಾಗಿದೆ. ಓ ಸವ್ಯಸಾಚಿಯೆ, ನೀನು
    ಕೇವಲ ಕಾರಣ ಆಗು.

34: >-
    ನನ್ನಿಂದ ನಾಶಗೊಂಡ ದ್ರೋಣ, ಭೀಷ್ಮ, ಜಯದ್ರಥ, ಕರ್ಣ ಮತ್ತು ಇತರ ವೀರ ಹೋರಾಟಗಾರರನ್ನೂ ನೀನು
    ಕೊಲ್ಲು. ದುಃಖಿಸದಿರು, ಯುದ್ಧ ಮಾಡು. ಯುದ್ಧದಲ್ಲಿ ಶತ್ರುಗಳನ್ನು ಗೆಲ್ಲುವೆ.

35: >-
    ಸುತ್ತಲೂ ಕೆದರಿದ ಕೇಶರಾಶಿಯ ಕೃಷ್ಣನ ಈ ಮಾತನ್ನು ಕೇಳಿ ಅರ್ಜುನನು ನಡುಗುತ್ತಾ ಕೈಮುಗಿದು
    ನಮಸ್ಕರಿಸಿ, ತುಂಬ ಹೆದರಿ ಮತ್ತೆಮತ್ತೆ ತಲೆಬಾಗಿ ನಮಿಸುತ್ತ ಕೃಷ್ಣನ ಬಳಿ ತಡವರಿಸುತ್ತ
    ಇನ್ನೂ ಹೇಳಿದನು.

36: >-
    ಓ ಹೃಷೀಕೇಶನೆ, ಎಲ್ಲವೂ ಸತ್ಯ. ಜಗತ್ತು ನಿನ್ನ ಮಹಿಮೆಯಿಂದ ಸಂತಸಪಟ್ಟಿದೆ ಮತ್ತು ನಿನ್ನಲ್ಲಿ
    ಯೋಗ್ಯವಾದ ಭಕ್ತಿ ಮಾಡಿದೆ. ರಕ್ಕಸರು ಹೆದರಿ ಎತ್ತೆತ್ತಲೋ ಓಡುತ್ತಿದ್ದಾರೆ. ಸಿದ್ಧಿ
    ಪಡೆದವರೆಲ್ಲರೂ ಒಟ್ಟಾಗಿ ನಮಿಸುತ್ತಿದ್ದಾರೆ.

37: >-
    ಓ ಮಹಾತ್ಮನೆ, ಚತುರ್ಮುಖನಿಗಿಂತಲೂ ಹಿರಿಯನಾಗಿ ಮೊದಲ ಸೃಷ್ಟಿಕಾರನಾದ ನಿನಗೆ ಅವರೆಲ್ಲರೂ
    ಹೇಗೆ ನಮಿಸದೆ ಇರುವರು? ಓ ಅನಂತಗುಣನೆ, ದೇವತೆಗಳ ಸ್ವಾಮಿಯೇ, ವಿಶ್ವರೂಪನೇ, ನೀನು
    ನಾಶವಿಲ್ಲದವನು. ಈ ಕಾಣುವ ಮಣ್ಣು ನೀರು ಬೆಂಕಿ, ಮತ್ತು ಕಾಣದ ಗಾಳಿ ಆಕಾಶ ಪ್ರಪಂಚಕ್ಕಿಂತ
    ಬೇರೆ ರೀತಿಯವನು, ಮಿಗಿಲಾದವನು.

38: >-
    ನೀನು ಎಲ್ಲ ದೇವತೆಗಳಿಗೂ ಮೂಲನು ಮತ್ತು ಎಲ್ಲರೊಳಗೂ ಇರುವವನು. ಮೊದಲಿಂದಲೂ ಇದ್ದವನು. ನೀನು
    ಈ ಜಗತ್ತಿಗೆ ಮುಖ್ಯ ಆಶ್ರಯನು. ನೀನು ಎಲ್ಲವನ್ನೂ ತಿಳಿದವನು ಮತ್ತು ಎಲ್ಲರಿಂದಲೂ
    ತಿಳಿಯಬೇಕಾದವನು. ನೀನು ಎಲ್ಲಕ್ಕಿಂತ ಬೇರೆಯಾದ ಸ್ವರೂಪದವನು. ಅನಂತರೂಪನೆ, ಪ್ರಪಂಚವು
    ನಿನ್ನಿಂದ ತುಂಬಿದೆ.

39: >-
    ವಾಯು (ಬಲಜ್ಞಾನ ರೂಪ), ಯಮ (ನಿಯಾಮಕ), ಅಗ್ನಿ (ಚಾಲಕ), ವರುಣ (ಆವರಕ), ಶಶಾಂಕ
    (ಪೂರ್ಣಾನಂದ), ಪ್ರಜಾಪತಿ (ಪ್ರಜಾಪಾಲಕ) ಎಲ್ಲ ನೀನೆ. ಮತ್ತು ನೀನು ಎಲ್ಲರ ಮುತ್ತಜ್ಜ. ಸಾವಿರ
    ಬಾರಿ ನಿನಗೆ ನಮಿಸುವೆನು. ಮತ್ತೊಮ್ಮೆ ನಮಿಸುವೆ. ಇನ್ನೂ ನಮಿಸುತ್ತಲೇ ಇರುವೆ. ನಿನಗೆ
    ನಮೋನಮಃ.

40: >-
    ನಿನ್ನ ಎದುರಲ್ಲಿ ನಮಿಸುವೆ. ಹಿಂದೆಯೂ ನಿನಗೆ ನಮಿಸುವೆ. ಓ ಎಲ್ಲೆಡೆ ತುಂಬಿದವನೇ, ನಿನಗೆ
    ಎಲ್ಲ ಕಡೆಯಿಂದಲೂ ನಮಸ್ಕರಿಸುವೆನು. ಓ ನಾಶವಾಗದ ಸಾಮರ್ಥ್ಯವುಳ್ಳವನೆ, ನೀನು ಅಳತೆಗೆ ಸಿಗದ
    ಪರಾಕ್ರಮಶಾಲಿಯು. ನೀನು ಎಲ್ಲವನ್ನೂ ಪೂರ್ತಿ ವ್ಯಾಪಿಸಿ ಇರುವುದರಿಂದಲೇ ನೀನೇ “ಎಲ್ಲ” (ಸರ್ವ).

41: >-
    ನಿನ್ನ ಈ ಮಹಿಮೆಯನ್ನು ತಿಳಿಯದೆ ನಾನು ಗೆಳೆಯನೆಂದೆ ಯೋಚಿಸಿ, ಏ ಕೃಷ್ಣ, ಏ ಯಾದವ, ಏ
    ಸಖನೇ ಎಂದು ಗೆಳೆತನದಲ್ಲೊ, ಗಮನಕೊಡದೆಯೊ ಎಗ್ಗಿಲ್ಲದೆ ಕರೆದು ಕೂಗಿದ್ದುಂಟು.

42: >-
    ಆಟಗಳಲ್ಲಿ, ಊಟಗಳಲ್ಲಿ, ಮಲಗುವ ಮಂಚಗಳಲ್ಲೂ ಒಬ್ಬನೆ ಇದ್ದಾಗಲೂ ಅಥವಾ ಎಲ್ಲರೆದುರೂ ತಮಾಷೆ
    ಮಾಡಲೆಂದೆ ನಾನು ತಿರಸ್ಕರಿಸಿದ್ದೇನೆ. ಓ ಅಚ್ಯುತನೆ, ಪೂರ್ತಿ ತಿಳಿಯಲಾಗದ ನಿನ್ನನ್ನು ನಾನು
    ಕ್ಷಮಿಸು ಎಂದು ಬೇಡಿಕೊಳ್ಳುವೆನು.

43: >-
    ನೀನು ಈ ಚರಾಚರ ಪ್ರಪಂಚದ ಪಾಲಕನು. ಈ ಲೋಕಕ್ಕೆ ಆರಾಧ್ಯನು ನೀನೆ. ನೀನು ಗುರುವಿಗೂ ಹಿರಿಯ
    ಗುರು. ಸರಿಸಾಟಿಯಿಲ್ಲದ ರೂಪ ಹೊತ್ತವನೆ, ಮೂರು ಲೋಕದಲ್ಲಿಯೂ ನಿನಗೆ ಸಮನಾದವನೇ ಇಲ್ಲ.
    ನಿನಗಿಂತ ಹೆಚ್ಚಿನವನು ಬೇರೆ ಎಲ್ಲಿ ಇದ್ದಾನೆ?

44: >-
    ಆದ್ದರಿಂದ, ಎಲ್ಲರೂ ಸ್ತುತಿಸುವ, ಎಲ್ಲರ ಸ್ವಾಮಿಯಾದ ನಿನ್ನನ್ನು ನಾನು, ದೇಹವನ್ನು
    ನೆಲದಲ್ಲಿ ಉದ್ದ ಚಾಚಿ ಮನಸಾರೆ ನಮಿಸುತ್ತ ಪ್ರಸನ್ನನಾಗು ಎಂದು ಬೇಡುವೆನು. ಓ ದೇವನೆ, ತಂದೆ
    ಮಗನ ತಪ್ಪುಗಳನ್ನು, ಗೆಳೆಯ ಗೆಳೆಯನ ತಪ್ಪುಗಳನ್ನು ಸಹಿಸುವಂತೆ, ನನಗೆ ಪ್ರಿಯನಾದ ನೀನು,
    ನಿನಗೆ ಪ್ರಿಯನಾದ ನನ್ನ ತಪ್ಪುಗಳನ್ನು ಸಹಿಸು, ಕ್ಷಮಿಸು.

45: >-
    ಹಿಂದೆ ಕಂಡಿರದ ರೂಪವನ್ನು ಕಂಡು ಸಂತೋಷ ಆಗಿದೆ. ನನ್ನ ಮನಸ್ಸು ಹೆದರಿ ದುಃಖಗೊಂಡಿದೆ. ಓ
    ದೇವನೆ, ನನಗೆ ಆ ಹಿಂದಿನ ರೂಪವನ್ನೆ ತೋರಿಸು. ಓ ದೇವತೆಗಳ ಸ್ವಾಮಿಯೆ, ಜಗದ ಆಶ್ರಯನೆ
    ಪ್ರಸನ್ನನಾಗು.

46: >-
    ಕಿರೀಟ ತೊಟ್ಟ, ಗದೆ-ಚಕ್ರ ಕೈಯಲ್ಲಿ ಹಿಡಿದ, ಹಿಂದಿನ ಆ ರೂಪದಲ್ಲಿಯೇ ನಿನ್ನನ್ನು ನೋಡಲು
    ನಾನು ಬಯಸುತ್ತೇನೆ. ಸಾವಿರಾರು ತೋಳಿನ ವಿಶ್ವರೂಪನೆ, ನಾಲ್ಕು ಕೈಯ ಹಿಂದಿನ ರೂಪದಿಂದಲೆ
    ಕಾಣಿಸಿಕೊ.

47: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಓ ಅರ್ಜುನನೆ, ನಿನ್ನ ಅನುಗ್ರಹಕ್ಕಾಗಿಯೆ ನಾನು ನನ್ನ ಶಕ್ತಿಯಿಂದ ಈ
    ಪೂರ್ಣರೂಪವನ್ನು ತೋರಿಸಿದೆ. ಎಲ್ಲಕ್ಕೂ ಕಾರಣವಾದ ನಾಶವಿರದ ನನ್ನ ಈ ಬೆಳಕಿನ ರಾಶಿಯ
    ವಿಶ್ವರೂಪವನ್ನು ನಿನ್ನ ಹೊರತು ಬೇರೆ ಯಾರೂ ಈ ಹಿಂದೆ ನೋಡಿಲ್ಲ.

48: >-
    ಓ ಕುರುವಂಶದ ವೀರನೆ, ನಾನು ಹೀಗೆ ವಿಶ್ವರೂಪನು ಮನುಷ್ಯರ ಲೋಕದಲ್ಲಿ ನಿನ್ನ ಹೊರತು ಬೇರೆ
    ಯಾರಿಂದಲೂ, ಯಜ್ಞಪ್ರಧಾನವಾಗಿ ವೇದಗಳ ಓದಿನಿಂದ, ದಾನಗಳಿಂದ, ವ್ರತ-ನಿಯಮಗಳಿಂದ ಅಥವಾ ಕಠೋರ
    ತಪಸ್ಸುಗಳಿಂದ ಕಾಣಲು ಸಿಗುವುದಿಲ್ಲ.

49: >-
    ನನ್ನ ಈ ಉಗ್ರರೂಪವನ್ನು ಕಂಡು ಹೆದರಿ ನಡುಗಬೇಡ, ಮೋಹಗೊಳ್ಳಬೇಡ. ಹೆದರಿಕೆ ಬಿಟ್ಟು
    ಭಕ್ತಿಭಾವದಿಂದ ನೀನು ಮತ್ತೆ ನನ್ನ ಹಿಂದಿನ ರೂಪವನ್ನೆ ಇದೋ ನೋಡು, ಚೆನ್ನಾಗಿ.

50: >-
    ಹೀಗೆ ಕೃಷ್ಣನು ಅರ್ಜುನನಿಗೆ ಹೇಳಿ, ಮತ್ತೆ ತನ್ನ ಕೃಷ್ಣರೂಪವನ್ನೆ ತೋರಿಸಿದನು.
    ವಿಶ್ವರೂಪನಾಗಿದ್ದ ಕೃಷ್ಣನು ಮತ್ತೆ ಶಾಂತರೂಪದವನಾಗಿ ಹೆದರಿದ ಅರ್ಜುನನನ್ನು
    ಸಮಾಧಾನಪಡಿಸಿದನು.

51: >-
    ಅರ್ಜುನನು ಹೇಳಿದನು - ಓ ಜನಾರ್ದನನೆ, ಮನುಷ್ಯನ ಆಕಾರದ ನಿನ್ನ ಈ ಶಾಂತವಾದ ರೂಪವನ್ನು
    ಕಂಡು ಈಗ ಸಹಜಸ್ಥಿತಿಗೆ ಬಂದಿದ್ದೇನೆ. ಮನಸ್ಸು ಪೂರ್ಣ ತಿಳಿಯಾಗಿದೆ.

52: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ಸುಲಭವಾಗಿ ಕಾಣಲಾಗದ ನನ್ನ ಈ ವಿಶ್ವರೂಪವನ್ನು ಕಂಡೆ. ದೇವತೆಗಳೂ ಈ
    ರೂಪವನ್ನು ಕಾಣಲು ಯಾವಾಗಲೂ ಬಯಸುತ್ತಾರೆ.

53: >-
    ನೀನು ಕಂಡಂತೆ, ಈ ಬಗೆಯ ನನ್ನನ್ನು ಯಜ್ಞ-ದಾನ-ತಪಸ್ಸುಗಳಿಂದ ಅಥವಾ ವೇದದ ಪಠನಮಾತ್ರದಿಂದಲೊ
    ಕಾಣಲು ಸಾಧ್ಯವಿಲ್ಲ.

54: >-
    ಓ ಅರ್ಜುನನೆ, ಪರಂತಪನೆ, ನನ್ನನ್ನು ಈ ರೀತಿಯಾಗಿ ಚೆನ್ನಾಗಿ ಕಾಣಲು, ಚೆನ್ನಾಗಿ ತಿಳಿಯಲು
    ಮತ್ತೆ ಚೆನ್ನಾಗಿ ಪೂರ್ತಿ ಸೇರಲು, ನನ್ನಲ್ಲೆ ಮಾಡಿದ ಭಕ್ತಿಯಿಂದ ಮಾತ್ರವೆ ಸಾಧ್ಯವಾಗಲಿದೆ.

55: >-
    ಓ ಪಾಂಡವನೆ, ನನ್ನ ಧರ್ಮ ಮಾಡುವವನು, ನಾನೇ ಸರ್ವೋತ್ತಮನೆಂದು ತಿಳಿದವನು, ಬೇರೆ ಎಲ್ಲೂ
    ಆಸಕ್ತನಾಗದೆ ನನ್ನಲ್ಲೆ ಭಕ್ತಿ ಮಾಡಿದವನು, ಎಲ್ಲ ಜೀವರಲ್ಲೂ ದ್ವೇಷವಿಲ್ಲದವನು ಯಾರಾದರೂ
    ನನ್ನನ್ನು ಹೊಂದುತ್ತಾನೆ.

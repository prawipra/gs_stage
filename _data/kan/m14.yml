1: >-
    ಕೃಷ್ಣನು ಹೇಳಿದನು - ತಿಳಿಯಬೇಕಾದ ಸಂಗತಿಗಳಲ್ಲಿ ಶ್ರೇಷ್ಠವಾದ ಜ್ಞಾನವನ್ನು ಇನ್ನೂ ಹೆಚ್ಚಿಗೆ
    ಹೇಳುತ್ತೇನೆ. ಎಲ್ಲ ಮುನಿಗಳು ಇದನ್ನು ತಿಳಿದು ಇಲ್ಲಿಂದ ತೆರಳಿ ಉತ್ತಮ ಗತಿಯನ್ನು ಹೊಂದಿದರು.

2: >-
    ಈ ಜ್ಞಾನವನ್ನು ಗುರುಗಳಿಂದ ಚೆನ್ನಾಗಿ ಪಡೆದು ನನ್ನ ಸೇವೆಯಿಂದ ನನ್ನೆಡೆಗೆ ಬಂದವರು
    ಸೃಷ್ಟಿಕಾಲದಲ್ಲಿಯೂ ಹುಟ್ಟುವುದಿಲ್ಲ ಮತ್ತು ಪ್ರಳಯಕಾಲದಲ್ಲಿಯೂ ಬಾಧೆ ಪಡುವುದಿಲ್ಲ.

3: >-
    ಓ ಭಾರತನೆ, ಪ್ರಕೃತಿ (ಲಕ್ಷ್ಮಿ) ನನ್ನ ಪತ್ನಿ. ಅವಳಲ್ಲಿ ನಾನು ಗರ್ಭವನ್ನು ನೀಡುತ್ತೇನೆ.
    ಅಲ್ಲಿಂದ ಎಲ್ಲ ಜೀವಿಗಳ ಹುಟ್ಟು ಆಗುತ್ತದೆ.

4: >-
    ಓ ಕೌಂತೇಯನೆ, ಯಾವೆಲ್ಲ ಜಾತಿಗಳಲ್ಲಿ ಏನೆಲ್ಲ ದೇಹಗಳು ಹುಟ್ಟುತ್ತವೆಯೋ ಅವುಗಳಿಗೆಲ್ಲ
    ಚಿತ್‌ಪ್ರಕೃತಿಯೇ ತಾಯಿ, ನಾನೇ ಬೀಜಬಿತ್ತಿದ ತಂದೆ.

5: >-
    ಓ ಮಹಾಬಾಹುವೆ, ಜಡಪ್ರಕೃತಿಯಿಂದ ಉಂಟಾದ ಸತ್ವ-ರಜಸ್ಸು-ತಮಸ್ಸು ಎಂಬ ಮೂರು ಗುಣಗಳು,
    ನಾಶವಿಲ್ಲದ ಜೀವನನ್ನು ದೇಹದಲ್ಲಿ ಕಟ್ಟಿಹಾಕುತ್ತವೆ.

6: >-
    ಓ ಒಳ್ಳೆಯವನೆ, ಆ ಗುಣತ್ರಯದಲ್ಲಿ ಸತ್ವವು (ಅಭಿಮಾನಿಯಾದ ಶ್ರೀತತ್ವ) ಶುದ್ಧವಾದುದು.
    ಆದ್ದರಿಂದ ಅದು ಬೆಳಕು ನೀಡುವುದು ಮತ್ತು ದುಃಖ ಕಳೆಯುವುದು. ಸುಖ ಮತ್ತು ಜ್ಞಾನಗಳ
    ಸಂಬಂಧದಿಂದ ಜೀವನನ್ನು ಹಿಡಿದು ಇಡುವುದು.

7: >-
    ಓ ಕೌಂತೇಯನೆ, ರಜೋಗುಣವು (ಅಭಿಮಾನಿಯಾದ ಭೂತತ್ವ) ರಂಜಿಸುವ ಸ್ವರೂಪದ್ದು, ಆಸಕ್ತಿಗಳನ್ನು
    ಹುಟ್ಟಿಸುವುದು ಎಂದು ತಿಳಿ. ಅದು ಜೀವನನ್ನು ಕರ್ಮದ ಸಂಬಂಧದಿಂದ ಕಟ್ಟಿಹಾಕುತ್ತದೆ.

8: >-
    ಓ ಭಾರತನೆ, ತಮೋಗುಣವು (ಅಭಿಮಾನಿಯಾದ ದರ‍್ಗಾತತ್ವ) ಎಲ್ಲ ಜೀವಿಗಳಿಗೆ ಅಜ್ಞಾನವನ್ನು
    ಹುಟ್ಟಿಸುವುದು, ಭ್ರಮೆಗೊಳಿಸುವುದು ಎಂದು ತಿಳಿ. ಅದು ತಪ್ಪು, ಸೋಮಾರಿತನ ಮತ್ತು
    ನಿದ್ದೆಗಳಿಂದ ಜೀವನನ್ನು ಕಟ್ಟಿಹಾಕುತ್ತದೆ.

9: >-
    ಓ ಭಾರತನೆ, ಸತ್ವವು ಸುಖದಲ್ಲಿ, ರಜಸ್ಸು ಕರ್ಮದಲ್ಲಿ ಮತ್ತು ತಮಸ್ಸು ಜ್ಞಾನವನ್ನು ಮುಚ್ಚಿ
    ತಪ್ಪಿನಲ್ಲಿ ಆಸಕ್ತಿಯನ್ನು ಕೊಡುತ್ತದೆ.

10: >-
    ಓ ಭಾರತನೆ, ರಜಸ್ಸನ್ನು ಮತ್ತು ತಮಸ್ಸನ್ನು ಕಡಿಮೆ ಮಾಡಿ ಸತ್ವವು ಬೆಳೆಯುತ್ತದೆ. ಹೀಗೆ
    ಸತ್ವವನ್ನು ಮತ್ತು ತಮಸ್ಸನ್ನು ನಿಗ್ರಹಿಸಿ ರಜೋಗುಣ ವೃದ್ಧಿಸುತ್ತದೆ. ಹಾಗೆಯೆ ಸತ್ವವನ್ನು
    ಮತ್ತು ರಜಸ್ಸನ್ನು ಹಿಂದೆ ಹಾಕಿ ತಮಸ್ಸು ಹೆಚ್ಚಾಗುತ್ತದೆ.

11: >-
    ಈ ದೇಹದಲ್ಲಿ ಎಲ್ಲ ಇಂದ್ರಿಯಗಳಲ್ಲೂ ಜ್ಞಾನದ ಬೆಳಕು ಹುಟ್ಟಿದರೆ ಸತ್ವಗುಣ ಹೆಚ್ಚಿದೆ ಎಂದು
    ತಿಳಿಯಬೇಕು.

12: >-
    ಓ ಭರತಶ್ರೇಷ್ಠನೆ, ಜಿಪುಣತನ, ಹೆಚ್ಚು ದುಡಿಮೆ, ಬಹಳ ಕೆಲಸಗಳನ್ನು ಆರಂಭಿಸುವುದು, ಅಶಾಂತಿ,
    ಅತ್ಯಾಸೆ ಇವುಗಳು ರಜೋಗುಣ ಹೆಚ್ಚಿದಾಗ ಹುಟ್ಟುತ್ತವೆ.

13: >-
    ಓ ಕುರುನಂದನನೆ, ಅಜ್ಞಾನ, ಕಡಿಮೆ ದುಡಿಮೆ, ತಪ್ಪು, ಭ್ರಮೆ ಇವುಗಳು ತಮೋಗುಣ ಹೆಚ್ಚಾದಾಗ
    ಹೆಚ್ಚುತ್ತವೆ.

14: >-
    ಸತ್ವ ಹೆಚ್ಚಾದಾಗ ಜೀವಿ ಸತ್ತುಹೋದರೆ, ಮತ್ತೆ ದೇವನನ್ನು ತಿಳಿದವರ ನಡುವೆ ಜ್ಞಾನಯೋಗ್ಯಗಳಾದ
    ದೇಹಗಳನ್ನು ಪಡೆದು ಹುಟ್ಟುತ್ತಾನೆ.

15: >-
    ರಜೋಗುಣ ಹೆಚ್ಚಿದ್ದಾಗ ಸತ್ತರೆ, ಕರ್ಮಗಳಲ್ಲಿ ಆಸಕ್ತರಾದವರ ನಡುವೆ ಹುಟ್ಟುತ್ತಾನೆ. ತಮಸ್ಸು
    ಹೆಚ್ಚಿದ್ದಾಗ ಸತ್ತರೆ, ಜ್ಞಾನವಿಲ್ಲದ ಜಾತಿಗಳಲ್ಲಿ ಹುಟ್ಟುತ್ತಾನೆ.

16: >-
    ಶುದ್ಧವಾದ ಸಾತ್ವಿಕ ಫಲವನ್ನು ಒಳ್ಳೆಯ ಕೆಲಸಕ್ಕೆ ಹೇಳುತ್ತಾರೆ. ರಾಜಸ ಕೆಲಸಕ್ಕೆ ಫಲ
    ದುಃಖದೊಡನೆ ಸುಖ. ತಾಮಸ ಕೆಲಸದ ಫಲ ಅಜ್ಞಾನ.

17: >-
    ಸತ್ವಗುಣದಿಂದ ಜ್ಞಾನ ಹೆಚ್ಚುತ್ತದೆ. ರಜಸ್ಸಿನಿಂದ ಜಿಪುಣತನ ಬೆಳೆಯುವುದು. ತಮಸ್ಸಿನಿಂದ
    ತಪ್ಪು, ಭ್ರಮೆ ಮತ್ತು ಅಜ್ಞಾನವು ಉಂಟಾಗುತ್ತದೆ.

18: >-
    ಸತ್ವದಲ್ಲೆ ಇರುವವರು ಎತ್ತರಕ್ಕೆ ಏರುತ್ತಾರೆ. ರಾಜಸರು ನಡುವೆ ನಿಲ್ಲುತ್ತಾರೆ. ಕೊನೆಯ
    ಗುಣದ ಸುತ್ತ ಇರುವ ತಾಮಸರು ಕೆಳಗೆ ಹೋಗುತ್ತಾರೆ.

19: >-
    ಜ್ಞಾನಿಯು, ತ್ರಿಗುಣಗಳಿಗಿಂತ ಬೇರೆ ಕರ್ತೃ (ಕಾರಣ) ಇಲ್ಲ ಎಂದು ತಿಳಿದಾಗ ತ್ರಿಗುಣಗಳಿಲ್ಲದ
    ದೇವನನ್ನು ತಿಳಿಯುತ್ತಾನೆ. ಅವನು, ನನ್ನ ಭಕ್ತಿಯನ್ನು ಹೆಚ್ಚು ಗಳಿಸುತ್ತಾನೆ.

20: >-
    ದೇಹದಲ್ಲಿ ಉಂಟಾಗುವ ಈ ಮೂರು ಗುಣಗಳನ್ನು ಜೀವನು ದಾಟಿದಾಗ ಹುಟ್ಟು, ಸಾವು, ಮುಪ್ಪು,
    ದುಃಖಗಳಿಂದ ಬಿಡುಗಡೆ ಹೊಂದಿ ಮುಕ್ತಿಯನ್ನು ಹೊಂದುತ್ತಾನೆ.

21: >-
    ಅರ್ಜುನನು ಕೇಳಿದನು - ಓ ಸ್ವಾಮಿಯೆ, ಈ ಮೂರು ಗುಣಗಳನ್ನು ದಾಟಿದವನು ಯಾವ ಲಕ್ಷಣಗಳಿಂದ
    ತಿಳಿಯುತ್ತಾನೆ? ಅವನ ನಡೆ ಎಂಥದು? ಮತ್ತು ಈ ಮೂರು ಗುಣಗಳನ್ನು ಹೇಗೆ ದಾಟುತ್ತಾನೆ?

22: >-
    ಕೃಷ್ಣನು ಹೇಳುತ್ತಾನೆ - ಓ ಪಾಂಡವನೆ, ಬೆಳಕು, ಹೆಚ್ಚು ದುಡಿಮೆ, ಭ್ರಮೆ - ಇವು ಬಂದಾಗ
    ವಿರೋಧಿಸುವುದಿಲ್ಲ, ಹೋದಾಗ ಬಯಸುವುದೂ ಇಲ್ಲ.

23: >-
    ತ್ರಿಗುಣಗಳಿಂದ ಚಂಚಲನಾಗದೆ, ಗುಣಗಳು ಇರುತ್ತವೆ ಎಂದೆ ಚೆನ್ನಾಗಿ ತಿಳಿಯುತ್ತ ಉದಾಸೀನನಂತೆ
    ಇರುತ್ತಾನೆ. ವಿಚಲಿತನಾಗನು.

24: >-
    ಗಟ್ಟಿಮನಸ್ಸುಳ್ಳವನಾಗಿ ನೋವು-ನಲಿವುಗಳನ್ನು, ಇಷ್ಟ-ಅನಿಷ್ಟಗಳನ್ನು,
    ತೆಗಳಿಕೆ-ಹೊಗಳಿಕೆಗಳನ್ನು ಒಂದೇ ತರ ಸ್ವೀಕರಿಸುವವನು, ತನ್ನ ಪಾಡಿಗೆ ತಾನಿರುವವನು,
    ಮಣ್ಣು-ಕಲ್ಲು-ಚಿನ್ನಗಳನ್ನೂ ಒಂದೇ ತರ ಕಾಣುವವನು.

25: >-
    ಗೌರವ ತಿರಸ್ಕಾರಗಳಲ್ಲಿಯೂ ಸಮನು. ಗೆಳೆಯರಲ್ಲಿ ವೈರಿಗಳಲ್ಲಿಯೂ ಒಂದೇ ತರನು. ಲೋಕದ ಎಲ್ಲ
    ಕೆಲಸವನ್ನೂ ಬಿಟ್ಟವನು. ತ್ರಿಗುಣಗಳನ್ನು ದಾಟಿದವನು ಎನಿಸುತ್ತಾನೆ.

26: >-
    ನನ್ನನ್ನೇ ಪರಿಪೂರ್ಣವಾದ ಭಕ್ತಿಯಿಂದ ಆರಾಧಿಸುವವನು ಈ ತ್ರಿಗುಣಗಳನ್ನು ಪೂರ್ತಿ ದಾಟಿ
    ಪೂರ್ಣ(ಮುಕ್ತ)ನಾಗಲು ಸಮರ್ಥನಾಗುತ್ತಾನೆ.

27: >-
    ನಾಶವಿಲ್ಲದ ವಿಕಾರ ಹೊಂದದ ಚಿತ್‌ಪ್ರಕೃತಿಗೂ ನಾನೇ ಆಶ್ರಯ. ಸನಾತನ ಧರ್ಮಕ್ಕೆ ಮತ್ತು ಕೇವಲ
    ಸುಖರೂಪದ ಮೋಕ್ಷಕ್ಕೆ ನಾನೇ ಆಶ್ರಯ.

3: >-
    ಓ ಭಾರತನೆ, ದೈವೀಸಂಪತ್ತು (ಒಳ್ಳೆಯತನ) ಪಡೆದು ಹುಟ್ಟಿಬಂದವನಲ್ಲಿ ಈ ಗುಣಗಳಿರುತ್ತವೆ-
    ಹೆದರದಿರುವುದು ಮತ್ತು ಹೆದರಿಸದಿರುವುದು, ಶುದ್ಧಮನಸ್ಸು, ಜ್ಞಾನಸಂಪಾದನೆಯಲ್ಲಿ
    ತೊಡಗಿರುವುದು, ದಾನ, ಇಂದ್ರಿಯನಿಗ್ರಹ, ದೇವಪೂಜೆ, ವೇದಗಳ ಓದು, ತಪಸ್ಸು, ನೇರತನ, ಅಹಿಂಸೆ,
    ಸತ್ಯ, ಸಿಟ್ಟು ಮಾಡಿಕೊಳ್ಳದಿರುವುದು, ತ್ಯಾಗ, ದೇವನಲ್ಲಿ ನಿಂತ ಬುದ್ಧಿ, ಚಾಡಿ
    ಹೇಳದಿರುವುದು, ಪ್ರಾಣಿದಯೆ, ಅತ್ಯಾಸೆ ಇಲ್ಲದಿರುವುದು, ಮೃದುತನ, ನಾಚಿಕೆ, ಚಪಲತೆ
    ಇಲ್ಲದಿರುವುದು, ತೇಜಸ್, ಕ್ಷಮೆ, ಧೈರ್ಯ, ಮಡಿವಂತಿಕೆ, ದ್ರೋಹ ಎಸಗದಿರುವುದು ಮತ್ತು ಬೀಗದೆ
    ಇರುವುದು.

4: >-
    ಓ ಪಾರ್ಥನೆ, ಆಸುರೀ ಸಂಪತ್ತು (ಕೆಟ್ಟತನ) ಪಡೆದು ಹುಟ್ಟಿದವನ ಗುಣಗಳು - ಬೂಟಾಟಿಕೆ, ಸೊಕ್ಕು,
    ಬಿಂಕ, ಸಿಟ್ಟು, ಒರಟುತನ ಮತ್ತು ಅಜ್ಞಾನ.

5: >-
    ಒಳ್ಳೆಯತನ ಬಿಡುಗಡೆಗಾಗಿ ಇದೆ. ಕೆಟ್ಟತನ ಬಂಧನಕ್ಕಾಗಿ ಇದೆ. ಓ ಪಾಂಡವನೆ, ದುಃಖಿಸದಿರು.
    ನೀನು ಒಳ್ಳೆತನವನ್ನು ಪಡೆದು ಹುಟ್ಟಿರುವೆ.

6: >-
    ಈ ಪ್ರಪಂಚದಲ್ಲಿ ದೈವ (ಒಳ್ಳೆಯದು) ಮತ್ತು ಆಸುರ (ಕೆಟ್ಟದು) ಎಂಬ ಎರಡು ಬಗೆಯ ಜೀವಸೃಷ್ಟಿಗಳಿವೆ.
    ದೈವವನ್ನು ಬಿಡಿಸಿ ಹೇಳಿಯಾಯಿತು. ಓ ಪಾರ್ಥನೆ, ಆಸುರವನ್ನು ನನ್ನಿಂದ ಕೇಳು.

7: >-
    ಅಸುರ ಸ್ವಭಾವದ ಜನರು ಯಾವುದನ್ನು ಮಾಡಬೇಕು ಮತ್ತು ಯಾವುದನ್ನು ಬಿಡಬೇಕು ಎಂದು ತಿಳಿಯರು.
    ಅವರಲ್ಲಿ ಮಡಿ ಇಲ್ಲ, ಒಳ್ಳೆಯ ನಡತೆ ಇಲ್ಲ ಮತ್ತು ಸತ್ಯವೂ ಇಲ್ಲ.

8: >-
    ಅವರು ಈ ವಿಶ್ವವನ್ನು ಸುಳ್ಳು ಎನ್ನುವರು. ಈ ಜಗತ್ತಿಗೆ ಆಶ್ರಯ ಇಲ್ಲ ಎನ್ನುವರು. ಪ್ರಪಂಚಕ್ಕೆ
    ಪಾಲಿಸುವ ದೊರೆ, ಸರ್ವಶಕ್ತನು ಇಲ್ಲ ಎನ್ನುವರು. ಒಂದರಿಂದ ಇನ್ನೊಂದು ಕ್ರಮವಾಗಿ ಹುಟ್ಟಿದ್ದಲ್ಲ
    ಎನ್ನುವರು. ಕಾಮದ ಸೃಷ್ಟಿ ಅಲ್ಲದೆ ಬೇರೇನೂ ಅಲ್ಲ ಎನ್ನುವರು.

9: >-
    ಇಂತಹ ಚಿಂತನೆಯನ್ನು ಆಧರಿಸಿ ದೇವನಿಂದ ದೂರರಾದ ಕೆಟ್ಟಬುದ್ಧಿಯ ಇವರು ವಿಶ್ವಕ್ಕೆ ಕೇಡು
    ಬಯಸುವರು. ವಿಶ್ವದ ನಾಶಕ್ಕೆ ಕೆಟ್ಟ ಕೆಲಸಗಳಲ್ಲಿ ತೊಡಗುವರು.

10: >-
    ಪೂರ್ಣಗೊಳ್ಳದ ಆಸೆಯನ್ನು ಹೊತ್ತು ಬೂಟಾಟಿಕೆ, ಬಿಂಕ ಮತ್ತು ಸೊಕ್ಕಿನವರಾಗಿ ಭ್ರಮೆಯಿಂದ
    ಇಲ್ಲಸಲ್ಲದ ಉಪದೇಶಗಳನ್ನು ಪಡೆದು ಕೆಟ್ಟ ಆಚರಣೆಯವರಾಗಿ ಬದುಕುತ್ತಾರೆ.

11: >-
    ಸತ್ತಾಗಲೇ ಮುಗಿಯುವಷ್ಟು ಬಹಳ ಚಿಂತೆಗೆ ಒಳಗಾದವರು. ಕಾಮದ ಪೂರ್ಣಭೋಗವೆ ಪ್ರಧಾನವೆನ್ನುತ್ತ
    ಜಗತ್ತು ಇಷ್ಟೇ ಎಂದು ತೀರ್ಮಾನಿಸಿದವರು.

12: >-
    ನೂರಾರು ಆಸೆಗಳ ಬಲೆಯಲ್ಲಿ ಸಿಲುಕಿದವರು ಬಯಕೆ ಮತ್ತು ಕೋಪ ತುಂಬಿಕೊಂಡು ಕಾಮದ ಭೋಗಕ್ಕಾಗಿ ರಾಶಿ
    ರಾಶಿ ಹಣ-ವಸ್ತುಗಳನ್ನು ತಪ್ಪುದಾರಿಯಿಂದ ಪಡೆಯಲು ತೊಡಗುತ್ತಾರೆ.

15: >-
    ಇವರ ಅಜ್ಞಾನದ ಚಿಂತನೆಯ ಮಾತುಗಳು ಹೀಗಿವೆ - ಈ ಆಸೆಯನ್ನು ಈಗ ನಾನು ಪಡೆದೆ, ಈ ಬಯಕೆಯನ್ನು
    ಮುಂದೆ ಪಡೆಯುವೆನು. ಇಷ್ಟು ಹಣ ಈಗ ಇದೆ, ಮತ್ತೆ ಈ ದುಡ್ಡೂ ನನ್ನದು ಆಗಲಿದೆ. ಈ ವೈರಿಯನ್ನು
    ಈಗ ಕೊಂದೆ, ಉಳಿದವರನ್ನೂ ಕೊಲ್ಲುತ್ತೇನೆ. ನಾನೇ ವಿಶ್ವವನ್ನು ಆಳುವ ದೇವನು, ನಾನೇ ವಿಶ್ವವನ್ನು
    ಹೊತ್ತ ಶೇಷನು. ನಾನು ಸಿದ್ಧಪುರುಷನು, ಬಲವಂತನು ಆಗಿದ್ದೇನೆ. ಸುಖವಂತನೂ, ಶ್ರೀಮಂತನೂ
    ಕುಲವಂತನೂ ನಾನೆ. ನನಗೆ ಸಮನಾದವನು ಬೇರೆ ಯಾವನು ಇದ್ದಾನೆ? ನಾನು ಯಾಗ ಮಾಡಿಸುತ್ತೇನೆ, ದಾನ
    ನೀಡುತ್ತೇನೆ, ಖುಷಿಪಡುತ್ತೇನೆ.

16: >-
    ಬಹಳ ವಿಪರೀತಜ್ಞಾನದ ಬುದ್ಧಿಯವರಾಗಿ ಅಜ್ಞಾನದ ಬಲೆಯಲ್ಲಿ ಪೂರ್ತಿ ಸಿಲುಕಿ, ಕಾಮದ ಭೋಗಗಳಲ್ಲೆ
    ಚೆನ್ನಾಗಿ ಮುಳುಗಿದವರು ವೈತರಣಿ ಮುಂತಾದ ಕೊಳಕಾದ ನರಕದಲ್ಲಿ ಬೀಳುವರು.

17: >-
    ತಮ್ಮ ಬಗೆಗೆಯೆ ಕೊಚ್ಚಿಕೊಳ್ಳುವವರು, ದುರಹಂಕಾರಿಗಳು, ದುಡ್ಡು-ಗೌರವ-ಸೊಕ್ಕಿನಿಂದ ತುಂಬಿದವರು,
    ಅಂಥವರೂ ಬೂಟಾಟಿಕೆಯಿಂದ ಶಾಸ್ತ್ರದಲ್ಲಿ ಹೇಳಿದಂತೆ ಅಲ್ಲದೆ ಯಜ್ಞಗಳಿಂದ ಪೂಜಿಸುತ್ತಾರೆ.

18: >-
    ಗರ್ವ, ಸಾಮರ್ಥ್ಯ, ಸೊಕ್ಕು, ಅಸೆ, ಕೋಪ ಇವೆಲ್ಲ ತುಂಬಿದವರು ತನ್ನ ಮತ್ತು ಬೇರೆಯವರ
    ಶರೀರಗಳಲ್ಲಿ ನನ್ನನ್ನು ಒಪ್ಪದೆ ನಿರಾಕರಿಸುವರು. ಎಲ್ಲೆಡೆಯೂ ಮತ್ಸರಪಡುವರು.

19: >-
    ನನ್ನನ್ನು ದ್ವೇಷಿಸುವ ಆ ಕ್ರೂರಿಗಳಾದ ಕೆಟ್ಟ ನಡೆಯ ನೀಚ ಮನುಷ್ಯರನ್ನು ಸಂಸಾರಗಳಲ್ಲಿ ಅಸುರ
    ಸ್ವಭಾವದ ಜಾತಿಗಳಲ್ಲಿಯೆ ಮತ್ತೆ ಮತ್ತೆ ಎಸೆಯುತ್ತೇನೆ.

20: >-
    ಓ ಕೌಂತೇಯನೆ, ಪ್ರತಿ ಜನ್ಮದಲ್ಲಿಯೂ ಕೆಟ್ಟ ಜಾತಿಯಲ್ಲೆ ಹುಟ್ಟಿ ಬಂದ ಆ ಕೆಟ್ಟ ಬುದ್ಧಿಯವರು,
    ಮತ್ತೆಂದೂ ನನ್ನನ್ನು ಹೊಂದದೆಯೆ ಅಧೋಗತಿಯನ್ನೆ ಹೊಂದುತ್ತಾರೆ.

21: >-
    ಕಾಮ, ಕ್ರೋಧ ಮತ್ತು ಲೋಭ - ಇದು ಮೂರು ನರಕದ ಬಾಗಿಲು, ಆತ್ಮನ ನಾಶಕ್ಕೆ ಕಾರಣವು. ಆದ್ದರಿಂದ
    ಈ ಮೂರನ್ನು ಬಿಡಬೇಕು.

22: >-
    ಓ ಕೌಂತೇಯನೆ, ನರಕದ ಈ ಮೂರು ಬಾಗಿಲುಗಳಿಂದ ಪಾರಾದ ಮನುಷ್ಯನು ತನಗೆ ಒಳ್ಳೆಯದನ್ನು
    ನಡೆಸುತ್ತಾನೆ. ಅದರಿಂದ ಉತ್ತಮ ಗತಿಯನ್ನು ಹೊಂದುತ್ತಾನೆ.

23: >-
    ಯಾರಾಗಲೀ ಶಾಸ್ತ್ರದ ನಿಯಮವನ್ನು ಬಿಟ್ಟು ಇಷ್ಟಬಂದಂತೆ ಇರುವವನು ಸಿದ್ಧಿಯನ್ನು
    ಹೊಂದುವುದಿಲ್ಲ; ಸುಖವನ್ನೂ, ಉತ್ತಮ ಗತಿಯನ್ನೂ ಪಡೆಯುವುದಿಲ್ಲ.

24: >-
    ಆದ್ದರಿಂದ ಮಾಡಬೇಕಾದ ಮತ್ತು ಮಾಡಬಾರದ ಕೆಲಸಗಳ ನಿರ್ಣಯಕ್ಕೆ ಶಾಸ್ತ್ರವೇ ನಿನಗೆ ಪ್ರಮಾಣ.
    ವಿಧಿ-ನಿಷೇಧಗಳ ರೂಪದಲ್ಲಿ ಶಾಸ್ತ್ರ ಹೇಳಿದ್ದನ್ನು ತಿಳಿದು ಇಲ್ಲಿ ನೀನು ಕರ್ಮ ಮಾಡಲು
    ಯೋಗ್ಯನಾಗಿರುವೆ.

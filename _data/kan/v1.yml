1: |-
    ಧರ್ಮ-ಕ್ಷೇತ್ರೇ ಕುರು-ಕ್ಷೇತ್ರೇ ಸಮವೇತಾ ಯುಯುತ್ಸವಃ ।
    ಮಾಮಕಾಃ ಪಾಂಡವಾಶ್ಚೈವ ಕಿಮಕುರ್ವತ ಸಂಜಯ ॥

2: |-
    ದೃಷ್ಟ್ವಾ ತು ಪಾಂಡವಾನೀಕಂ ವ್ಯೂಢಂ ದುರ್ಯೋಧನಸ್ತದಾ ।
    ಆಚಾರ್ಯಮುಪ ಸಂಗಮ್ಯ ರಾಜಾ ವಚನಮಬ್ರವೀತ್ ॥

3: |-
    ಪಶ್ಶೈತಾಂ ಪಾಂಡು-ಪುತ್ರಾಣಾಂ ಆಚಾರ್ಯ ಮಹತೀಂ ಚಮೂಮ್ ।
    ವ್ಯೂಢಾಂ ದ್ರುಪದ-ಪುತ್ರೇಣ ತವ ಶಿಷ್ಯೇಣ ಧೀಮತಾ ॥

4: |-
    ಅತ್ರ ಶೂರಾ ಮಹೇಷ್ವಾಸಾಃ ಭೀಮಾರ್ಜುನ-ಸಮಾ ಯುಧಿ ।
    ಯುಯುಧಾನೋ ವಿರಾಟಶ್ಚ ದ್ರುಪದಶ್ಚ ಮಹಾರಥಃ ॥

5: |-
    ಧೃಷ್ಟಕೇತುಶ್ಚೇಕಿತಾನಃ ಕಾಶಿ-ರಾಜಶ್ಚ ವೀರ್ಯ-ವಾನ್ ।
    ಪುರು-ಜಿತ್ ಕುಂತಿ-ಭೋಜಶ್ಚ ಶೈಬ್ಯಶ್ಚ ನರ-ಪುಂಗವಃ ॥

6: |-
    ಯುಧಾಮನ್ಯುಶ್ಚ ವಿಕ್ರಾಂತಃ ಉತ್ತಮೌಜಾಶ್ಚ ವೀರ್ಯ-ವಾನ್ ।
    ಸೌಭದ್ರೋ ದ್ರೌಪದೇಯಾಶ್ಚ ಸರ್ವ ಏವ ಮಹಾರಥಾಃ ॥

7: |-
    ಅಸ್ಮಾಕಂ ತು ವಿಶಿಷ್ಟಾ ಯೇ ತಾನ್ ನಿಬೋಧ ದ್ವಿಜೋತ್ತಮ ।
    ನಾಯಕಾ ಮಮ ಸೈನ್ಯಸ್ಯ ಸಂಜ್ಞಾರ್ಥಂ ತಾನ್ ಬ್ರವೀಮಿ ತೇ ॥

8: |-
    ಭವಾನ್ ಭೀಷ್ಮಶ್ಚ ಕರ್ಣಶ್ಚ ಕೃಪಶ್ಚ ಸಮಿತಿಂ-ಜಯಃ ।
    ಅಶ್ವತ್ಥಾಮಾ ವಿಕರ್ಣಶ್ಚ ಸೌಮದತ್ತಿಸ್ತಥೈವ ಚ ॥

9: |-
    ಅನ್ಯೇ ಚ ಬಹವಃ ಶೂರಾಃ ಮದರ್ಥೇ ತ್ಯಕ್ತ-ಜೀವಿತಾಃ ।
    ನಾನಾ-ಶಸ್ತ್ರ-ಪ್ರಹರಣಾಃ ಸರ್ವೇ ಯುದ್ಧ-ವಿಶಾರದಾಃ ॥

10: |-
    ಅಪರ್ಯಾಪ್ತಂ ತದಸ್ಮಾಕಂ ಬಲಂ ಭೀಷ್ಮಾಭಿ-ರಕ್ಷಿತಮ್ ।
    ಪರ್ಯಾಪ್ತಂ ತ್ವಿದಮೇತೇಷಾಂ ಬಲಂ ಭೀಮಾಭಿ-ರಕ್ಷಿತಮ್ ॥

11: |-
    ಅಯನೇಷು ಚ ಸರ್ವೇಷು ಯಥಾ-ಭಾಗಮವ-ಸ್ಥಿತಾಃ ।
    ಭೀಷ್ಮಮೇವಾಭಿ ರಕ್ಷಂತು ಭವಂತಃ ಸರ್ವ ಏವ ಹಿ ॥

12: |-
    ತಸ್ಯ ಸಂ-ಜನಯನ್ ಹರ್ಷಂ ಕುರು-ವೃದ್ಧಃ ಪಿತಾಮಹಃ ।
    ಸಿಂಹ-ನಾದಂ ವಿನದ್ಯೋಚ್ಚೈಃ ಶಂಖಂ ದಧ್ಮೌ ಪ್ರತಾಪ-ವಾನ್ ॥

13: |-
    ತತಃ ಶಂಖಾಶ್ಚ ಭೇರ್ಯಶ್ಚ ಪಣವಾನಕ-ಗೋಮುಖಾಃ ।
    ಸಹಸೈವಾಭ್ಯಹನ್ಯಂತ ಸ ಶಬ್ದಸ್ತುಮುಲೋಽಭವತ್ ॥

14: |-
    ತತಃ ಶ್ವೇತೈರ್ಹಯೈರ್ಯುಕ್ತೇ ಮಹತಿ ಸ್ಯಂದನೇ ಸ್ಥಿತೌ ।
    ಮಾಧವಃ ಪಾಂಡವಶ್ಚೈವ ದಿವ್ಯೌ ಶಂಖೌ ಪ್ರದಧ್ಮತುಃ ॥

15: |-
    ಪಾಂಚಜನ್ಯಂ ಹೃಷೀಕೇಶೋ ದೇವ-ದತ್ತಂ ಧನಂ-ಜಯಃ ।
    ಪೌಂಡ್ರಂ ದಧ್ಮೌ ಮಹಾಶಂಖಂ ಭೀಮ-ಕರ್ಮಾ ವೃಕೋದರಃ ॥

16: |-
    ಅನಂತ-ವಿಜಯಂ ರಾಜಾ ಕುಂತೀ-ಪುತ್ರೋ ಯುಧಿಷ್ಠಿರಃ ।
    ನಕುಲಃ ಸಹ-ದೇವಶ್ಚ ಸುಘೋಷ-ಮಣಿ-ಪುಷ್ಪಕೌ ॥

17: |-
    ಕಾಶ್ಯಶ್ಚ ಪರಮೇಷ್ವಾಸಃ ಶಿಖಂಡೀ ಚ ಮಹಾರಥಃ ।
    ಧೃಷ್ಟ-ದ್ಯುಮ್ನೋ ವಿರಾಟಶ್ಚ ಸಾತ್ಯಕಿಶ್ಚಾಪರಾಜಿತಃ ॥

18: |-
    ದ್ರುಪದೋ ದ್ರೌಪದೇಯಾಶ್ಚ ಸರ್ವಶಃ ಪೃಥಿವೀ-ಪತೇ ।
    ಸೌಭದ್ರಶ್ಚ ಮಹಾಬಾಹುಃ ಶಂಖಾನ್ ದಧ್ಮುಃ ಪೃಥಕ್-ಪೃಥಕ್ ॥

19: |-
    ಸ ಘೋಷೋ ಧಾರ್ತರಾಷ್ಟ್ರಾಣಾಂ ಹೃದಯಾನಿ ವ್ಯದಾರಯತ್ ।
    ನಭಶ್ಚ ಪೃಥಿವೀಂ ಚೈವ ತುಮುಲೋ ವ್ಯನು-ನಾದಯನ್ ॥

20: |-
    ಅಥ ವ್ಯವಸ್ಥಿತಾನ್ ದೃಷ್ಟ್ವಾ ಧಾರ್ತರಾಷ್ಟ್ರಾನ್ ಕಪಿ-ಧ್ವಜಃ ।
    ಪ್ರವೃತ್ತೇ ಶಸ್ತ್ರ-ಸಂಪಾತೇ ಧನುರುದ್ಯಮ್ಯ ಪಾಂಡವಃ ॥

21: |-
    ಹೃಷೀಕೇಶಂ ತದಾ ವಾಕ್ಯಂ ಇದಮಾಹ ಮಹೀ-ಪತೇ ।
    ಸೇನಯೋರುಭಯೋರ್ಮಧ್ಯೇ ರಥಂ ಸ್ಥಾಪಯ ಮೇಽಚ್ಯುತ ॥

22: |-
    ಯಾವದೇತಾನ್ ನಿರೀಕ್ಷೇಽಹಂ ಯೋದ್ಧು-ಕಾಮಾನವ-ಸ್ಥಿತಾನ್ ।
    ಕೈರ್ಮಯಾ ಸಹ ಯೋದ್ಧವ್ಯಂ ಅಸ್ಮಿನ್ ರಣ-ಸಮುದ್ಯಮೇ ॥

23: |-
    ಯೋತ್ಸ್ಯಮಾನಾನವೇಕ್ಷೇಽಹಂ ಯ ಏತೇಽತ್ರ ಸಮಾಗತಾಃ ।
    ಧಾರ್ತರಾಷ್ಟ್ರಸ್ಯ ದುರ್ಬುದ್ಧೇಃ ಯುದ್ಧೇ ಪ್ರಿಯ-ಚಿಕೀರ್ಷವಃ ॥

24: |-
    ಏವಮುಕ್ತೋ ಹೃಷೀಕೇಶೋ ಗುಡಾಕೇಶೇನ ಭಾರತ ।
    ಸೇನಯೋರುಭಯೋರ್ಮಧ್ಯೇ ಸ್ಥಾಪಯಿತ್ವಾ ರಥೋತ್ತಮಮ್ ॥

25: |-
    ಭೀಷ್ಮ-ದ್ರೋಣ-ಪ್ರಮುಖತಃ ಸರ್ವೇಷಾಂ ಚ ಮಹೀ-ಕ್ಷಿತಾಮ್ ।
    ಉವಾಚ ಪಾರ್ಥ ಪಶ್ಶೈತಾನ್ ಸಮವೇತಾನ್ ಕುರೂನಿತಿ ॥

26: |-
    ತತ್ರಾಪಶ್ಯತ್ ಸ್ಥಿತಾನ್ ಪಾರ್ಥಃ ಪಿತೄನಥ ಪಿತಾಮಹಾನ್ । 
    ಆಚಾರ್ಯಾನ್ ಮಾತುಲಾನ್ ಭ್ರಾತೄನ್ ಪುತ್ರಾನ್ ಪೌತ್ರಾನ್ ಸಖೀಂಸ್ತಥಾ ॥

27: |-
    ಶ್ವಶುರಾನ್ ಸುಹೃದಶ್ಚೈವ ಸೇನಯೋರುಭಯೋರಪಿ ।

27.5: |-
    ಕೃಪಯಾ ಪರಯಾಽಽವಿಷ್ಟೋ ವಿಷೀದನ್ನಿದಮಬ್ರವೀತ್ ॥

28: |-
    ತಾನ್ ಸಮೀಕ್ಷ್ಯ ಸ ಕೌಂತೇಯಃ ಸರ್ವಾನ್ ಬಂಧೂನವ-ಸ್ಥಿತಾನ್ ।

28.5: |-
    ದೃಷ್ಟ್ವೇಮಂ ಸ್ವಜನಂ ಕೃಷ್ಣ ಯುಯುತ್ಸುಂ ಸಮುಪ-ಸ್ಥಿತಮ್ ॥

29: |-
    ಸೀದಂತಿ ಮಮ ಗಾತ್ರಾಣಿ ಮುಖಂ ಚ ಪರಿ-ಶುಷ್ಯತಿ ।
    ವೇಪಥುಶ್ಚ ಶರೀರೇ ಮೇ ರೋಮ-ಹರ್ಷಶ್ಚ ಜಾಯತೇ ॥

30: |-
    ಗಾಂಡೀವಂ ಸ್ರಂಸತೇ ಹಸ್ತಾತ್ ತ್ವಕ್ ಚೈವ ಪರಿ-ದಹ್ಯತೇ ।
    ನಚ ಶಕ್ನೋಮ್ಯವ-ಸ್ಥಾತುಂ ಭ್ರಮತೀವ ಚ ಮೇ ಮನಃ ॥

31: |-
    ನಿಮಿತ್ತಾನಿ ಚ ಪಶ್ಯಾಮಿ ವಿಪರೀತಾನಿ ಕೇಶವ ।
    ನಚ ಶ್ರೇಯೋಽನು ಪಶ್ಯಾಮಿ ಹತ್ವಾ ಸ್ವ-ಜನಮಾಹವೇ ॥

32: |-
    ನ ಕಾಂಕ್ಷೇ ವಿಜಯಂ ಕೃಷ್ಣ ನಚ ರಾಜ್ಯಂ ಸುಖಾನಿ ಚ ।
    ಕಿಂ ನೋ ರಾಜ್ಯೇನ ಗೋವಿಂದ ಕಿಂ ಭೋಗೈರ್ಜೀವಿತೇನ ವಾ ॥

33: |-
    ಯೇಷಾಮರ್ಥೇ ಕಾಂಕ್ಷಿತಂ ನೋ ರಾಜ್ಯಂ ಭೋಗಾಃ ಸುಖಾನಿ ಚ ।
    ತ ಇಮೇಽವ-ಸ್ಥಿತಾ ಯುದ್ಧೇ ಪ್ರಾಣಾಂಸ್ತ್ಯಕ್ತ್ವಾ ಧನಾನಿ ಚ ॥

34: |-
    ಆಚಾರ್ಯಾಃ ಪಿತರಃ ಪುತ್ರಾಃ ತಥೈವ ಚ ಪಿತಾಮಹಾಃ ।
    ಮಾತುಲಾಃ ಶ್ವಶುರಾಃ ಪೌತ್ರಾಃ ಸ್ಯಾಲಾಃ ಸಂಬಂಧಿನಸ್ತಥಾ ॥

35: |-
    ಏತಾನ್ ನ ಹಂತುಮಿಚ್ಛಾಮಿ ಘ್ನತೋಽಪಿ ಮಧು-ಸೂದನ ।
    ಅಪಿ ತ್ರೈಲೋಕ್ಯ-ರಾಜ್ಯಸ್ಯ ಹೇತೋಃ ಕಿಂ ನು ಮಹೀ-ಕೃತೇ ॥

36: |-
    ನಿಹತ್ಯ ಧಾರ್ತರಾಷ್ಟ್ರಾನ್ ನಃ ಕಾ ಪ್ರೀತಿಃ ಸ್ಯಾಜ್ಜನಾರ್ದನ ।
    ಪಾಪಮೇವಾಽಶ್ರಯೇದಸ್ಮಾನ್ ಹತ್ವೈತಾನಾತತಾಯಿನಃ ॥

37: |-
    ತಸ್ಮಾನ್ನಾರ್ಹಾ ವಯಂ ಹಂತುಂ ಧಾರ್ತರಾಷ್ಟ್ರಾನ್ ಸ್ವ-ಬಾಂಧವಾನ್ ।
    ಸ್ವ-ಜನಂ ಹಿ ಕಥಂ ಹತ್ವಾ ಸುಖಿನಃ ಸ್ಯಾಮ ಮಾಧವ ॥

38: |-
    ಯದ್ಯಪ್ಯೇತೇ ನ ಪಶ್ಯಂತಿ ಲೋಭೋಪ-ಹತ-ಚೇತಸಃ ।
    ಕುಲ-ಕ್ಷಯ-ಕೃತಂ ದೋಷಂ ಮಿತ್ರ-ದ್ರೋಹೇ ಚ ಪಾತಕಮ್ ॥

39: |-
    ಕಥಂ ನ ಜ್ಞೇಯಮಸ್ಮಾಭಿಃ ಪಾಪಾದಸ್ಮಾನ್ನಿವರ್ತಿತುಮ್ ।
    ಕುಲ-ಕ್ಷಯ-ಕೃತಂ ದೋಷಂ ಪ್ರ-ಪಶ್ಯದ್ಭಿರ್ಜನಾರ್ದನ ॥

40: |-
    ಕುಲ-ಕ್ಷಯೇ ಪ್ರಣಶ್ಯಂತಿ ಕುಲ-ಧರ್ಮಾಃ ಸನಾತನಾಃ ।
    ಧರ್ಮೇ ನಷ್ಟೇ ಕುಲಂ ಕೃತ್ಸ್ನಂ ಅಧರ್ಮೋಽಭಿ-ಭವತ್ಯುತ ॥

41: |-
    ಅಧರ್ಮಾಭಿ-ಭವಾತ್ ಕೃಷ್ಣ ಪ್ರ-ದುಷ್ಯಂತಿ ಕುಲ-ಸ್ತ್ರಿಯಃ ।
    ಸ್ತ್ರೀಷು ದುಷ್ಟಾಸು ವಾರ್ಷ್ಣೇಯ ಜಾಯತೇ ವರ್ಣ-ಸಂಕರಃ ॥

42: |-
    ಸಂಕರೋ ನರಕಾಯೈವ ಕುಲ-ಘ್ನಾನಾಂ ಕುಲಸ್ಯ ಚ ।
    ಪತಂತಿ ಪಿತರೋ ಹ್ಯೇಷಾಂ ಲುಪ್ತ-ಪಿಂಡೋದಕ-ಕ್ರಿಯಾಃ ॥

43: |-
    ದೋಷೈರೇತೈಃ ಕುಲ-ಘ್ನಾನಾಂ ವರ್ಣ-ಸಂಕರ-ಕಾರಕೈಃ ।
    ಉತ್ಸಾದ್ಯಂತೇ ಜಾತಿ-ಧರ್ಮಾಃ ಕುಲ-ಧರ್ಮಾಶ್ಚ ಶಾಶ್ವತಾಃ ॥

44: |-
    ಉತ್ಸನ್ನ-ಕುಲ-ಧರ್ಮಾಣಾಂ ಮನುಷ್ಯಾಣಾಂ ಜನಾರ್ದನ ।
    ನರಕೇ ನಿಯತಂ ವಾಸೋ ಭವತೀತ್ಯನು ಶುಶ್ರುಮ ॥

45: |-
    ಅಹೋ ಬತ ಮಹತ್ ಪಾಪಂ ಕರ್ತುಂ ವ್ಯವಸಿತಾ ವಯಮ್ ।
    ಯದ್ರಾಜ್ಯ-ಸುಖ-ಲೋಭೇನ ಹಂತುಂ ಸ್ವ-ಜನಮುದ್ಯತಾಃ ॥

46: |-
    ಯದಿ ಮಾಮಪ್ರತೀಕಾರಂ ಅಶಸ್ತ್ರಂ ಶಸ್ತ್ರ-ಪಾಣಯಃ ।
    ಧಾರ್ತರಾಷ್ಟ್ರಾ ರಣೇ ಹನ್ಯುಃ ತನ್ಮೇ ಕ್ಷೇಮ-ತರಂ ಭವೇತ್ ॥

47: |-
    ಏವಮುಕ್ತ್ವಾಽರ್ಜುನಃ ಸಂಖೇ ರಥೋಪಸ್ಥ ಉಪಾವಿಶತ್ ।
    ವಿಸೃಜ್ಯ ಸ-ಶರಂ ಚಾಪಂ ಶೋಕ-ಸಂವಿಗ್ನ-ಮಾನಸಃ ॥

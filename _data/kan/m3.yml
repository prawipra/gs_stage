1: >-
    ಅರ್ಜುನನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ - ಓ ಜನಾರ್ದನನೇ, ಕರ್ಮಕ್ಕಿಂತ ಜ್ಞಾನವೇ ಶ್ರೇಷ್ಠ ಎಂದು ನಿನಗೆ
    ಸಮ್ಮತವಾದರೆ, ಓ ಕೇಶವ, ಮತ್ತೇಕೆ ನನ್ನನ್ನು ಈ ಘೋರವಾದ ಯುದ್ಧಕರ್ಮದಲ್ಲಿ ತೊಡಗಿಸುತ್ತಿರುವೆ?

2: >-
    ನನ್ನ ಬುದ್ಧಿಯನ್ನು ದ್ವಂದ್ವಾರ್ಥದ ಮಾತಿನಿಂದ ಮೋಹಗೊಳಿಸುವಂತಿರುವೆ. ಯಾವುದರಿಂದ ನಾನು
    ಒಳಿತನ್ನು ಪಡೆವೆನು ಅದನ್ನೊಂದನ್ನು ನಿರ್ಧರಿಸಿ ಹೇಳು.

3: >-
    ಕೃಷ್ಣನು ಉತ್ತರಿಸುತ್ತಾನೆ - ಓ ಪಾಪದೂರನೆ, ಜ್ಞಾನಮಾರ್ಗಿಗಳಿಗೆ ಜ್ಞಾನಪ್ರಧಾನವಾದ ಸಾಧನೆ
    ಮತ್ತು ಕರ್ಮಯೋಗಿಗಳಿಗೆ ಕರ್ಮಪ್ರಧಾನವಾದ ಸಾಧನೆ, ಹೀಗೆ ಲೋಕದ ಜನರಲ್ಲಿ ಎರಡು ರೀತಿಯ
    ಸಾಧನೆಯನ್ನು ನಾನು ಹಿಂದೆ ಹೇಳಿದೆ.

4: >-
    ಸಾಧಕನು ಕರ್ಮಗಳನ್ನು ಮಾಡದೆಯೇ ಕರ್ಮಬಂಧದಿಂದ ಕಳಚನು. ಕರ್ಮದ ಫಲವನ್ನು ತ್ಯಾಗ
    ಮಾಡಿದ್ದರಿಂದಲೇ ಸಿದ್ಧಿಯನ್ನು ಪಡೆಯುವುದೂ ಇಲ್ಲ.

5: >-
    ಯಾವನೊಬ್ಬನೂ ಒಂದು ಕ್ಷಣವಾದರೂ ಎಂದೂ ಏನೂ ಮಾಡದೆ ಇರಲಾರನು. ಪ್ರತಿಯೊಬ್ಬನೂ ದೇವರ
    ಅಧೀನನಾಗಿ ತನ್ನತನದ ಗುಣಗಳಿಂದ ಕರ್ಮ ಮಾಡುತ್ತಲೇ ಇರುವನು.

6: >-
    ವಾಕ್ ಪಾಣಿ ಪಾದ ಪಾಯು ಉಪಸ್ಥಗಳೆಂಬ ಐದು ಕರ್ಮೇಂದ್ರಿಯಗಳನ್ನು ಅದುಮಿಟ್ಟು, ಆಯಾ
    ಇಂದ್ರಿಯಗಳ ವಿಷಯಗಳನ್ನು ಮನಸ್ಸಿನಲ್ಲಿಯೇ ಮೆಲುಕು ಹಾಕುತ್ತಿರುವವನು ಬುದ್ಧಿ ಹಾಳಾದವನಿರುತ್ತಾನೆ,
    ಡಂಭಾಚಾರಿ ಎನಿಸುತ್ತಾನೆ.

7: >-
    ಓ ಅರ್ಜುನ, ಇಂದ್ರಿಯಗಳನ್ನು ಮನಸ್ಸಿನಿಂದ ನಿಗ್ರಹಿಸಿ, ಕರ್ಮದ ಫಲದಲ್ಲೆ ಆಸಕ್ತನಾಗದೆ,
    ಕರ್ಮೇಂದ್ರಿಯಗಳಿಂದ ಕೆಲಸವನ್ನು ನಡೆಸುವವನು ಹೆಚ್ಚಿನವನು.

8: >-
    ನಿನಗೆ ಹೇಳಿದ ಕರ್ಮವನ್ನು ನೀನು ಮಾಡು. ಸುಮ್ಮನಿರುವುದಕ್ಕಿಂತ ಕರ್ಮ ಮಾಡುವುದು ಶ್ರೇಷ್ಠ.
    ಏನೂ ಮಾಡದೇ ಇದ್ದರೆ, ನಿನ್ನ ದೇಹದ ಯಾವುದೊಂದು ಚೇಷ್ಟೆಯೂ ಮುಂದುವರಿಯದು!

9: >-
    ಓ ಕೌಂತೇಯನೆ, ದೇವರ ಪೂಜೆ ಎಂದಲ್ಲದೆ ಮಾಡಿದ ಕರ್ಮಮಾತ್ರವೆ ಎಲ್ಲರಿಗೂ ಬಂಧನ. ಫಲದ ಆಸೆ
    ಬಿಟ್ಟು ದೇವರ ಪೂಜೆಯೆಂದು ಕರ್ಮವನ್ನು ಮಾಡು.

10: >-
    ದೇವರ ಪೂಜಾರೂಪವಾದ ಕರ್ಮದೊಡನೆ ಜನರನ್ನು ಹಿಂದೆ ಚತುರ್ಮುಖ ಬ್ರಹ್ಮನು ಸೃಷ್ಟಿಸಿ ಹೀಗೆ
    ಹೇಳಿದ್ದನು - ಈ ಬಗೆಯಿಂದ ಕರ್ಮವನ್ನು ನಡೆಸಿರಿ. ಇದು ನಿಮಗೆ ಒಳ್ಳೆಯ ಬಯಕೆಯನ್ನು ಕೊಡುವುದಾಗಲಿ.

11: >-
    ಈ ಯಜ್ಞಕರ್ಮದಿಂದ ದೇವತೆಗಳನ್ನು ಸಂಪರ್ಕಿಸಿರಿ. ಆ ದೇವತೆಗಳು ನಿಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಲಿ.
    ಒಬ್ಬರಿಗೊಬ್ಬರು ಸಂಬಂಧಿಸುತ್ತ ಹೆಚ್ಚಿನ ಒಳ್ಳೆಯದನ್ನು ಪಡೆಯಿರಿ.

12: >-
    ಯಜ್ಞದಿಂದ ಆರಾಧ್ಯರಾದ ದೇವತೆಗಳು ನೀವು ಬಯಸಿದಂತೆ ಬಗೆಗಳನ್ನು ನೀಡುತ್ತಾರೆ.
    ಅವರು ನೀಡಿದ್ದನ್ನು ಮತ್ತವರಿಗೆ ಸಮರ್ಪಿಸದೆ ಯಾರು ತಿನ್ನುವನೋ ಅವನು ಕಳ್ಳನೆಂದೇ ಅರ್ಥ.

13: >-
    ಯಜ್ಞಗಳನ್ನು ನಡೆಸಿ ಶೇಷಪ್ರಸಾದವನ್ನು ತಿನ್ನುವವರು ಒಳ್ಳೆಯವರು, ಎಲ್ಲ ಪಾಪಗಳಿಂದ ಪಾರಾಗುವರು.
    ತಮಗಾಗಿ ಅಡುಗೆ ಮಾಡುವವರು ಕೆಟ್ಟವರು, ಪಾಪವನ್ನೇ ಉಣ್ಣುತ್ತಾರೆ.

14: >-
    ಆಹಾರದಿಂದ ಜೀವಿಗಳು ಬದುಕಿರುತ್ತವೆ, ಆಹಾರವು ಮೋಡದಿಂದ ಬೆಳೆಯಲಿದೆ. ಯಜ್ಞದಿಂದ ಮೋಡದ
    ಉತ್ಪತ್ತಿ. ಯಜ್ಞವು ಕರ್ಮದಿಂದಲೇ ಆಗಲಿದೆ.

15: >-
    ಕರ್ಮವು ದೇವರಿಂದ ಆಗುವುದೆಂದು ತಿಳಿ. ದೇವರನ್ನು ವೇದದಿಂದ ತಿಳಿಯಬೇಕು. ಹೀಗೆ ಎಲ್ಲೆಡೆಯ
    ದೇವರು ಯಜ್ಞದಲ್ಲಿ ನಿತ್ಯ ಇರುವನು.

16: >-
    ಓ ಪಾರ್ಥ, ಹೀಗೆ ಸುತ್ತುತ್ತಿರುವ ವಿಶ್ವಚಕ್ರವನ್ನು ಮುಂದುವರಿಸದವನು ಇಲ್ಲಿ ಪಾಪಿಯಾಗಿದ್ದಾನೆ.
    ಇಂದ್ರಿಯಸುಖದಲ್ಲೆ ಮುಳುಗಿದವನ ಬದುಕು ವ್ಯರ್ಥವಾಗಿದೆ.

17: >-
    ಪರಮಾತ್ಮನ ಭಕ್ತನಾಗಿ, ಆತ ನೀಡಿದ್ದರಲ್ಲಿಯೆ ತೃಪ್ತನಾಗಿ, ಪರಮಾತ್ಮನ ಚಿಂತನೆಯಲ್ಲಿಯೆ
    ಆನಂದ ಪಡೆವವಗೆ ಮಾಡಬೇಕಾದ್ದೇನೂ ಇರದು.

18: >-
    ಅಂಥವನು ಇಲ್ಲಿ ಕರ್ಮ ಮಾಡಿದರೂ ಮಾಡದಿದ್ದರೂ ಏನೂ ಪ್ರಯೋಜನವಿಲ್ಲ. ಎಲ್ಲ ಜೀವಿಗಳಲ್ಲಿ ಅವನಿಗೆ
    ಯಾವುದೇ ರೀತಿಯ ವಿಶೇಷ ವ್ಯವಹಾರ ಇಲ್ಲ.

19: >-
    ಆದ್ದರಿಂದ ಫಲದ ಆಸೆ ಬಿಟ್ಟು, ಯಾವಾಗಲೂ ಮಾಡಬೇಕಾದ ಕೆಲಸವನ್ನು ಚೆನ್ನಾಗಿ ಮಾಡು. ಹೀಗೆ
    ಫಲದಾಸೆ ಬಿಟ್ಟು ಕರ್ಮ ಮಾಡುತ್ತಲೇ ವ್ಯಕ್ತಿ ಸರ್ವೋತ್ತಮನನ್ನು ಹೊಂದುವನು.

20: >-
    ಜನಕ ಮುಂತಾದ ರಾಜರು ಕರ್ಮದಿಂದಲೇ ಮೋಕ್ಷವನ್ನು ಪಡೆದರು. ಜನಸಾಮಾನ್ಯರ ಶಿಕ್ಷಣವನ್ನು
    ತಿಳಿದಾದರೂ ನೀನು ಕರ್ತವ್ಯವನ್ನು ಮಾಡುವುದು ಯೋಗ್ಯವೇ.

21: >-
    ದೊಡ್ಡವನು ಏನೆಲ್ಲ ಮಾಡುತ್ತಾನೋ ಅದನ್ನೇ ಜನಸಾಮಾನ್ಯ ಮಾಡುತ್ತಾನೆ. ಅವನು ಯಾವುದನ್ನು
    ಸರಿ ಎಂದು ಮಾಡುತ್ತಾನೋ ಅದನ್ನೇ ಜನ ಅನುಸರಿಸುತ್ತದೆ.

22: >-
    ಓ ಪಾರ್ಥನೆ, ಮೂರು ಲೋಕಗಳಲ್ಲೂ ನಾನು ಮಾಡಬೇಕಾದ್ದು ಏನೂ ಇಲ್ಲ. ನನಗೇನೂ ಸಿಗದಿದ್ದದ್ದು,
    ಸಿಗಬೇಕಾದ್ದೂ ಇಲ್ಲ. ಆದರೂ ಕರ್ಮವನ್ನು ನಡೆಸುತ್ತಲೆ ಇದ್ದೇನೆ.

23: >-
    ಓ ಪಾರ್ಥನೆ, ನಾನು ಒಮ್ಮೆಯೂ ತಪ್ಪದೆ ಕೆಲಸ ಮಾಡದೆ ಹೋದರೆ, ಮನುಷ್ಯರು ಎಲ್ಲ
    ರೀತಿಯಿಂದಲೂ ನನ್ನ ದಾರಿಯನ್ನೇ ಅನುಸರಿಸುತ್ತಾರೆ.

24: >-
    ನಾನು ಒಂದೊಮ್ಮೆ ಕರ್ಮ ಮಾಡದೇ ಇದ್ದರೆ ಈ ಜನರೆಲ್ಲ ಒಂದೋ ಕರ್ಮ ಮಾಡುವುದಿಲ್ಲ, ಅಥವಾ
    ತಪ್ಪಾಗಿ ಆಚರಿಸಿ ಹಾಳಾಗುತ್ತಾರೆ. ಈ ಗೊಂದಲಕ್ಕೆ ನಾನೇ ಕಾರಣನಾದೇನು. ಈ ಜನರನ್ನು ನಾನೇ
    ಹಾನಿಗೊಳಿಸಿದಂತೆ.

25: >-
    ಓ ಭಾರತನೇ, ತಿಳಿಯದವರು ಫಲದಾಸೆಯಿಂದ ಕೆಲಸ ಮಾಡುತ್ತಾರೆ. ತಿಳಿದವನು ಫಲದಾಸೆ ಬಿಟ್ಟು
    ಕೆಲಸ ಮಾಡುತ್ತಿರಬೇಕು; ಜನರಿಗೆ ತಿಳಿಸಿಕೊಡಲು ಕರ್ಮ ಮಾಡುತ್ತಲೆ ಇರಬೇಕು.

26: >-
    ಫಲದ ಆಸೆಯಿಂದ ದುಡಿವ, ತಿಳಿಯದ ಜನರ ಬುದ್ಧಿಯನ್ನು ತಿಳಿದವನು ಗೊಂದಲಗೊಳಿಸಬಾರದು.
    ಕರ್ಮಯೋಗವನ್ನು ಅರಿತವನಿವನು ಎಲ್ಲ ಕೆಲಸಗಳನ್ನೂ ಚೆನ್ನಾಗಿ ನಡೆಸುತ್ತ, ಅಜ್ಞರ ಎಲ್ಲ
    ಕೆಲಸಗಳನ್ನು ಆದರದಿಂದಲೇ ಸರಿಗೊಳಿಸಬೇಕು.

27: >-
    ಎಲ್ಲ ಕರ್ಮಗಳೂ ಜೀವನ ಸಹಜ ಗುಣಗಳಿಂದ ನಡೆಯುತ್ತವೆ. ದುರಹಂಕಾರಿಯು ನಾನೇ ಮಾಡಿದವನು
    ಎಂದು ಭಾವಿಸುತ್ತಾನೆ.

28: >-
    ಓ ಮಹಾಬಾಹುವೆ, ಗುಣಗಳ ಮತ್ತು ಕರ್ಮಗಳ ವಿಶೇಷತೆಯನ್ನು ಸರಿಯಾಗಿ ತಿಳಿದವನು, ಇಂದ್ರಿಯಗಳು
    ವಿಷಯಗಳಲ್ಲಿ ನಿಂತಿವೆ ಎಂದು ತಿಳಿಯುತ್ತ ಅವುಗಳಲ್ಲಿ ಅಂಟಿಕೊಳ್ಳುವುದಿಲ್ಲ.

29: >-
    ಪ್ರಕೃತಿಯ ಅಂಗಗಳಾದ ಇಂದ್ರಿಯಗಳಲ್ಲಿಯೆ ಪೂರ್ತಿ ಆಸಕ್ತರು ಗುಣಕರ್ಮಗಳಲ್ಲೆ ಅಂಟಿಕೊಳ್ಳುತ್ತಾರೆ.
    ಅರೆಬರೆ ತಿಳಿದ ಅಂಥ ದಡ್ಡರನ್ನು ಪೂರ್ತಿ ಚೆನ್ನಾಗಿ ತಿಳಿದವ ಗೊಂದಲಗೊಳಿಸಬಾರದು.

30: >-
    ನಾನು ಸರ್ವೋತ್ತಮನೆಂದು ತಿಳಿದು ನನಗೆ ನಿನ್ನ ಎಲ್ಲ ಕರ್ಮಗಳನ್ನು ಸಮರ್ಪಿಸು. ಫಲದಾಸೆ ಬಿಡು.
    ನಾನು ಮಾಡುವೆನೆಂದೂ ತಿಳಿಯದಿರು. ಸಂಕಟ ಬಿಟ್ಟು ಹೋರಾಡು.

31: >-
    ನನ್ನ ಈ ಅಭಿಪ್ರಾಯದಂತೆ ಅಸೂಯೆ ತೊರೆದು ಶ್ರದ್ಧೆಯಿಂದ ನಿತ್ಯವೂ ಯಾರು ಕರ್ಮವನ್ನು
    ನಡೆಸುತ್ತಾರೋ ಅವರು ಕರ್ಮಬಂಧನದಿಂದ ಬಿಡುಗಡೆ ಪಡೆಯುತ್ತಾರೆ.

32: >-
    ನನ್ನ ಈ ಮತವನ್ನು ದ್ವೇಷಿಸುತ್ತ ಅನುಸರಿಸದವರು ಯಾವುದನ್ನೂ ತಿಳಿವ ಯೋಗ್ಯತೆಯಿರದ
    ದಡ್ಡರಾಗಿಯೇ ನಾಶ ಹೊಂದುವರು.

33: >-
    ತಿಳಿದವನು ತನ್ನ ಸ್ವಭಾವಕ್ಕೆ ಸಮನಾಗಿಯೇ ಕೆಲಸ ಮಾಡುತ್ತಾನೆ. ಎಲ್ಲ ಜೀವಿಗಳು ತಮ್ಮತಮ್ಮ
    ಸ್ವಭಾವದಂತೆ ಇವೆ. ಬಲಾತ್ಕಾರದಿಂದ ಬದಲಾವಣೆ ಏನೂ ಆಗದು !

34: >-
    ರಾಗ ಮತ್ತು ದ್ವೇಷ (ಬೇಕು-ಬೇಡಗಳು) ಪ್ರತಿಯೊಂದು ಇಂದ್ರಿಯದ ವಿಷಯದಲ್ಲಿಯೂ ವಿಪರೀತವಾಗಿ ಇವೆ.
    ರಾಗ-ದ್ವೇಷಗಳಿಗೆ ಒಳಗಾಗಲೇಬಾರದು. ಇವೆರಡೇ ಸಾಧಕನಿಗೆ ಅಡ್ಡಿಗಳು.

35: >-
    (ತನ್ನ ಸ್ವಭಾವಕ್ಕೆ ತಕ್ಕುದಾದ ಕರ್ಮ ಸ್ವಧರ್ಮ. ತನಗೆ ಹೇಳಿಸಿದ್ದಲ್ಲದ, ಬೇರೆಯವರಿಗೆ
    ಹೇಳಿದ ಕರ್ಮ ಪರಧರ್ಮ.) ಪರಧರ್ಮವನ್ನು ಚೆನ್ನಾಗಿ ನಡೆಸುವುದಕ್ಕಿಂತ ತಪ್ಪಾಗಿಯಾದರೂ ತನ್ನ
    ಧರ್ಮವನ್ನು ನಡೆಸುವುದು ತುಂಬಾ ಶ್ರೇಷ್ಠ. ಸ್ವಧರ್ಮವನ್ನು ನಡೆಸುತ್ತಾ ಸತ್ತರೂ ಒಳಿತೇ
    ಆಗಲಿದೆ. ಪರಕೀಯ ಧರ್ಮವು ಭಯವನ್ನುಂಟು ಮಾಡುವುದು.

36: >-
    ಅರ್ಜುನನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ - ಓ ವೃಷ್ಣಿವಂಶದ ಕೃಷ್ಣನೆ, ಕೆಟ್ಟದ್ದನ್ನು ನಡೆಸಬೇಕೆಂದು
    ಇಚ್ಛಿಸದಿದ್ದರೂ ಈ ಮನುಷ್ಯನು ಯಾವುದೋ ಬಲದಿಂದ ತಪ್ಪು ಮಾಡುತ್ತಾನೆ. ಅಂದರೆ ಇದು ಯಾರಿಂದ ಆದದ್ದು?

37: >-
    ಕೃಷ್ಣನು ಉತ್ತರಿಸುತ್ತಾನೆ - ರಜೋಗುಣದಿಂದ ಹುಟ್ಟುವ ಕಾಮವಿದು, ಕೋಪವಿದು - ಎಲ್ಲವನ್ನೂ
    ಕಬಳಿಸುವುದು. ಎಲ್ಲಾ ಪಾಪಾಚಾರಗಳನ್ನೂ ನಡೆಸುವುದು. ಇಲ್ಲಿ ಸಾಧನೆಯಲ್ಲಿ ಆಸೆಯನ್ನೂ ಸಿಟ್ಟನ್ನೂ
    ಶತ್ರುವನ್ನಾಗಿ ತಿಳಿ.

38: >-
    ಹೊಗೆಯಿಂದ ಬೆಂಕಿ ಮುಚ್ಚಿದಂತೆ, ಕೊಳೆಯಿಂದ ಕನ್ನಡಿ ಮಸುಕಾದಂತೆ, ಗರ್ಭಕೋಶದಿಂದ ಭ್ರ್ರೂಣ
    ಆವರಿಸಿದಂತೆ, ಕಾಮದಿಂದ ಇದೆಲ್ಲವೂ ಆವರಿಸಲ್ಪಟ್ಟಿದೆ.

39: >-
    ಓ ಕೌಂತೇಯನೆ, ಸಾಕೆನಿಸದ, ಪೂರ್ತಿಗೊಳಿಸಲಾಗದ ಕಾಮವು ಜ್ಞಾನಿಯ ನಿತ್ಯಶತ್ರುವಾಗಿ ಅವನ
    ಜ್ಞಾನವನ್ನು ಆಕ್ರಮಿಸುತ್ತದೆ.

40: >-
    ಇಂದ್ರಿಯಗಳು, ಮನಸ್ ಮತ್ತು ಬುದ್ಧಿ ಕಾಮದ ತಾಣಗಳು. ಕಾಮವು ಇಲ್ಲಿದ್ದುಕೊಂಡೆ ಸಾಧಕನ
    ಜ್ಞಾನವನ್ನು ಆಕ್ರಮಿಸಿ ಆತನನ್ನು ತಪ್ಪುದಾರಿಗೆ ಎಳೆಯುತ್ತದೆ.

41: >-
    ಓ ಭರತವಂಶಶ್ರೇಷ್ಠನೆ, ನೀನು ಮೊದಲು ಇಂದ್ರಿಯಗಳನ್ನು ಹತೋಟಿಯಲ್ಲಿಟ್ಟು, ಆತ್ಮನ ಮತ್ತು
    ಪರಮಾತ್ಮನ ಎಚ್ಚರವನ್ನು ಅಳಿಸುವ ಈ ಕೆಟ್ಟ ಕೆಲಸ ಮಾಡಿಸುವ ಕಾಮವನ್ನು ಹೊಡೆದು ಹೊರಗೆ ಹಾಕು.

42: >-
    ಇಂದ್ರಿಯಗಳು ದೇಹಕ್ಕಿಂತ ಮಿಗಿಲು. ಇಂದ್ರಿಯಗಳಿಗಿಂತ ಮನಸ್ ಶ್ರೇಷ್ಠ. ಮನಸ್ಸಿಗಿಂತ ಬುದ್ಧಿ
    ಉತ್ತಮ. ಬುದ್ಧಿಗೂ ನಿಲುಕದ ಆಚಿನ ಸಂಗತಿ ದೇವರು.
    
43: >-
    ಓ ಮಹಾಬಾಹುವೆ, ಹೀಗೆ ಬುದ್ಧಿಗೂ ಎಟುಕದ ಪರಮಾತ್ಮನನ್ನು ತಿಳಿದು, ತನ್ನನ್ನು ತಾನೇ
    ಬೆಂಬಲಿಸಿ, ಬಹಳ ಪ್ರಯತ್ನದಿಂದ ವೈರಿಯಂತಿರುವ ಕಾಮನನ್ನು ಹೊಡೆದು ಹೊರಗೆ ಹಾಕು.

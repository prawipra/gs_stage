1: |-
    ఊర్ధ్వ-మూలమధః-శాఖం అశ్వత్థం ప్రాహురవ్యయం ।
    ఛందాంసి యస్య పర్ణాని యస్తం వేద స వేద-విత్ ॥

2: |-
    అధశ్చోర్ధ్వం చ ప్రసృతాస్తస్య శాఖాః
    గుణ-ప్రవృద్ధా విషయ-ప్రవాళాః ।
    అధశ్చ మూలాన్యను-సంతతాని
    కర్మానుబంధీని మనుష్య-లోకే ॥

3: |-
    న రూపమస్యేహ తథోప-లభ్యతే
    నాంతో న చాదిర్న చ సం-ప్రతిష్ఠా ।
    అశ్చత్థమేనం సువిరూఢ-మూలం
    అసంగ-శస్త్రేణ దృఢేన ఛిత్వా ॥

4: |-
    తతః పరం తత్పరిమార్గితవ్యం
    యస్మిన్ గతా న నివర్తంతి భూయః ।
    తమేవ చాద్యం పురుషం ప్రపద్యే
    యతః ప్రవృత్తిః ప్రసృతా పురాణీ ॥

5: |-
    నిర్మాన-మోహా జిత-సంగ-దోషాః
    అధ్యాత్మ-నిత్యా వినివృత్త-కామాః ।
    ద్వంద్వైర్వి-ముక్తాః సుఖ-దుఃఖ-సంజ్ఞైః
    గచ్ఛంత్యమూఢాః పదమవ్యయం తత్ ॥

6: |-
    న తద్భాసయతే సూర్యో న శశాంకో న పావకః ।
    యద్గత్వా న నివర్తంతే తద్ధామ పరమం మమ ॥

7: |-
    మమైవాంశో జీవ-లోకే జీవ-భూతః సనాతనః ।
    మనః-షష్ఠానీంద్రియాణి ప్రకృతి-స్థాని కర్షతి ॥

8: |-
    శరీరం యదవాప్నోతి యచ్చాప్యుత్క్రామతీశ్వరః ।
    గృహీత్వైతాని సంయాతి వాయుర్గంధానివాశయాత్ ॥

9: |-
    శ్రోత్రం చక్షుః స్పర్శనం చ రసనం ఘ్రాణమేవ చ ।
    అధిష్ఠాయ మనశ్చాయం విషయానుప-సేవతే ॥

10: |-
    ఉత్క్రామంతం స్థితం వాపి భుంజానం వా గుణాన్వితం ।
    విమూఢా నాను-పశ్యంతి పశ్యంతి జ్ఞాన-చక్షుషః ॥

11: |-
    యతంతో యోగినశ్చైనం పశ్యంత్యాత్మన్యవస్థితం ।
    యతంతోఽప్యకృతాత్మానో నైనం పశ్యంత్యచేతసః ॥

12: |-
    యదాదిత్య-గతం తేజో జగద్ భాసయతేఽఖిలం ।
    యచ్చంద్రమసి యచ్చాగ్నౌ తత్తేజో విద్ధి మామకం ॥

13: |-
    గామావిశ్య చ భూతాని ధారయామ్యహమోజసా ।
    పుష్ణామి చౌషధీః సర్వాః సోమో భూత్వా రసాత్మకః ॥

14: |-
    అహం వైశ్వానరో భూత్వా ప్రాణినాం దేహమాశ్రితః ।
    ప్రాణాపాన-సమాయుక్తః పచామ్యన్నం చతుర్విధం ॥

15: |-
    సర్వస్య చాహం హృది సంనివిష్టో
    మత్తః స్మృతిర్జ్ఞానమపోహనం చ ।
    వేదైశ్చ సర్వైరహమేవ వేద్యో
    వేదాంత-కృద్ వేద-విదేవ చాహం ॥

16: |-
    ద్వావిమౌ పురుషౌ లోకే క్షరశ్చాక్షర ఏవ చ ।
    క్షరః సర్వాణి భూతాని కూట-స్థోఽక్షర ఉచ్యతే ॥

17: |-
    ఉత్తమః పురుషస్త్వన్యః పరమాత్మేత్యుదాహృతః ।
    యో లోక-త్రయమావిశ్య బిభర్త్యవ్యయ ఈశ్వరః ॥

18: |-
    యస్మాత్ క్షరమతీతోఽహం అక్షరాదపి చోత్తమః ।
    అతోఽస్మి లోకే వేదే చ ప్రథితః పురుషోత్తమః ॥

19: |-
    యో మామేవమసం-మూఢో జానాతి పురుషోత్తమం ।
    స సర్వ-విద్ భజతి మాం సర్వ-భావేన భారతః ॥

20: |-
    ఇతి గుహ్య-తమం శాస్త్రం ఇదముక్తం మయానఘ ।
    ఏతద్ బుద్ధ్వాబుద్ధి-మాన్ స్యాత్ కృత-కృత్యశ్చ భారత ॥

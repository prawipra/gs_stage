1: >-
    ధృతరాష్ట్రుడు సంజయుని అడుగుతాడు. పుణ్యభూమి కురుక్షేత్రం యుద్దం చేయాలనుకున్న
    ఇక్కడ చేరిన నా కొడుకులు మరియు నా తమ్ముడైన పాండు కుమారులు ఏం చేశారు.

2: >-
    సంజయుడు సమాధానం ఇచ్చినాడు. దొర, యుద్ధానికి సిద్ధంగా ఉన్న పాండవ సైన్యాన్ని
    చూసిన దుర్యోధన రాజు,ద్రోణాచార్యులు వద్దకు వెళ్లి ఇలా అన్నాడు.

3: >-
    ఓ ఆచార్య ఈ గొప్ప పాండవుల సైన్యాన్ని చూడు ద్రుపద రాజు కుమారుడైన మీ శిష్యుడు
    ఈ సైన్యానికి తెలివితేటలుతో సమకూర్చాడు చూడండి.

6: >-
    ఈ సైన్యంలో అందరూ మహారథలు, శూరులు, వీరులు గొప్ప విలుకాండ్రు, భీముడు మరియు
    అర్జునులతో సమానమైన యోధులు. యుయుదన .(సాత్యాకి) విరాటుడు,దృపదుడు, శిశుపాల
    కుమారుడు ద్రుష్ట కేతువు, యదువంశానికి చెందిన చేకితాన, భీముని మామ కాశిరాజు,
    కుంతీ భోజుని కుమారుడు పురుజిత, కుంతి భోజుడు, కేకేయి తండ్రి శైబ్యుడు,
    సుభద్రేయ కుమారుడు అభిమన్యుడు,మరియు ద్రౌపతియ ఐదుగురు కుమారులు ప్రతి
    వింధ్య,సుత సోమ, శ్రుత కీర్తి, శతానిక, శృతక్రియ.

7: >-
    ఓ ఆచార్య మనలో గొప్పవారలను కూడా చెబుతాను వినండి. సైన్యానికి నాయకులు వీరు
    నీవు గుర్తించుకోవడానికి చెబుతున్నాను.

8: >-
    వారు భీష్ముడు, కర్ణుడు, యుద్ధ ప్రణాంగాల్లో కృప, అశ్వత్థామ, వికర్ణ దుర్యోధనని తమ్ముడు,
    సోమ దత్తుని కుమారుడు భూరీ శ్రవస్.

9: >-
    నాకోసం ప్రాణాలర్పించేందుకు ఇంకా ఎంతోమంది శూరులు సిద్ధంగా ఉన్నారు. వీరంతా
    రకరకాల ఆయుధములతో యుద్ధం చేయగలరు, యుద్ధంలో నైపుణ్యం కలవారు.

10: >-
    భీష్ముని రక్షణలో ఉన్న మన సైన్యం సరిపోదు. భీముని రక్షణలో ఉన్న అతని సైన్యం
    కావలసినంత ఉన్నది.

11: >-
    పోరాటంలో అన్ని వైపులా మీకు ఇచ్చిన స్థానంలో మీరందరూ తప్పకుండా భీష్ముని
    కాపాడాలి.

12: >-
    కురువంశంలో జేష్ఠుడైన భీష్ముడు తన తాత దుర్యోధనుడిని ప్రసన్నం చేసుకోవడానికి
    సింహంలా గర్జించి శత్రువుల కష్టాలకు శంఖం ఊదాడు.

13: >-
    ఆ వెంటనే శంఖాలు , నగారిలు తప్పటలు, డోలు, కహలే అన్ని ఒకేసారిగా మ్రోగించిరి.
    ఆ శబ్దమే దద్దరిల్లిoది.

14: >-
    ఆ తర్వాత నాలుగు తెల్లని గుర్రాలు చే లాగిన పెద్ద రథంలో కృష్ణుడు మరియు
    అర్జునుడు ఉత్తమ శంఖాన్ని పూరించిరి.

15: >-
    కృష్ణుడు సముద్రంలో పంచజన అని దైత్యున్ని సంహరించి లభించిన పాంచ జన్య శంఖమును
    పూరించెను. అర్జునుడు స్వర్గంలో ఇంద్రుడు ఇచ్చిన దేవదత్త అను శంఖాన్ని
    పూరించెను. దుష్టులకు భయం కలిగించే సజ్జనులకు శాస్త్రోపదేశం చేయు భీమసేనుడు
    పౌన్డ్రా అనే పెద్ద శంఖాన్ని పూరించెను.

16: >-
    కుంతీపుత్రుడు యుధిష్టరా రాజు అనంత విజయ అనే శంఖాన్ని పూరించెను. నకులుడు సుఘోష
    అనే శంఖాన్ని సహదేవుడు మణి పుష్ప అనే శంఖాన్ని పూరించెను.

18: >-
    ఓ రాజా ధృతరాష్ట్ర, గొప్ప విలుకాడు కాశీ రాజు, మహారథి శిఖండి, దృష్టధ్యమునుడు,
    విరాటుడు, అజేయుడైన సాత్యకి, దృపదుడు, ద్రౌపదీ కుమారులు ఆజానుబాహు కలిగిన
    అభిమన్యుడు అందరూ తమ శంఖాన్ని ఒక్కొక్కటిగా పూరించారు.

19: >-
    ఆ కర్కశ శబ్దం ఆకాశాన్ని భూమిని ప్రతిధ్వనులతో నింపి వంద మంది కౌరవుల
    వక్షస్థలాన్ని చీల్చి చెండాడింది.

21: >-
    ఓ రాజా అప్పుడు యుద్ధం ప్రారంభించడానికి హనుమద్వజ అర్జునుడు,. కౌరవులు సిద్ధంగా
    ఉన్నట్లు గుర్తించి తన విల్లును వంచి బిగించి కృష్ణునితో ఇలా అన్నాడు ఓ
    అచ్యుత రెండు సైన్యాల మధ్య నారతాన్ని తీసుకెళ్లండి.

22: >-
    పోరాటానికి వచ్చిన వీళ్ళందరిని చూస్తాను ఈ పోరాటంలో నేను ఎవరెవరితో పోరాడాలి.

23: >-
    నేను యుద్ధవాదులను తప్పక చూడాలి. ఇక్కడకు వచ్చి చేరిన వారంతా బుద్ధిహీన
    దుర్యోధనుడికి విజయం చేకూర్చేందుకు కృషి చేస్తున్నారు.

25: >-
    ఓ దొర ఇట్లు అర్జునుడు కోరగా, ఆ పెద్ద రథమును రెండు సేనెల మధ్య శ్రీకృష్ణుడు
    నిలిపి అందరి రాజులు మధ్య,భీష్మ ద్రోణుల ఎదుట నిలిపి, ఓ అర్జున ఇక్కడ
    సమావేశమైన అందరి కౌరవులను చూడము.

27: >-
    అర్జునుడు ఇరుపక్షాల సైన్యంలోని తండ్రులు, తాతలు, గురువులు, మేనమామలు,
    అన్నదమ్ములు, పిల్లలు, మనుమలు, స్నేహితులు మరియు మామలతో పాటు శ్రేయోభిలాషులను
    చూశాడు.

28: >-
    అక్కడ సమీపంలో గుమిగూడిన బంధువులందరినీ దగ్గరలో చూసి అర్జునుడు చాలా జాలిపడి
    శోక సంతప్తుడై ఇలా అన్నాడు.

29: >-
    ఓ కృష్ణ , వచ్చి చేరిన నా బంధువుల్లో ప్రతి ఒక్కరిని చూసి నా అవయవాలు
    రాలిపోతున్నాయి, నోరు ఎండిపోతున్నాయి, శరీరం వణుకుతోంది, రోమాలు
    నిక్కబడుచుకుంటున్నాయి.

30: >-
    గాండీవ ధనస్సు చేతి నుండి జారిపోతుంది. నా శరీరం వేడెక్కుతుంది . నిటారుగా
    నిలబడలేక పోతున్నాను. నా మనసు ఎక్కడో తిరుగుతోంది.

31: >-
    ఓ కేశవ నాకు చెడు సూచనలు కనిపిస్తున్నాయి. యుద్ధంలో నా ప్రజలను చంపిన తర్వాత
    నాకు మంచి ఏమీ కనిపించదు.

32: >-
    కృష్ణ నాకు విజయం కోరిక లేదు .నాకు రాజ్యంగానీ సుఖాలు గానీ అక్కర్లేదు.
    ఓ గోవిందా రాజ్యం వల్ల మనకు ఏం లాభం? మనకు ఆనందం మరియు సంతోషకరమైన జీవితం
    ఎందుకు అవసరం.

33: >-
    ఎవరికోసం మనం సకల రాజ్యాలు,భోగాలు , సౌభాగ్యాలు కోరుకుంటున్నాము,వారు సమస్త
    సంపదలను తమ ప్రాణాలను కూడా యుద్ధంలో వదులుకోవడానికి సిద్ధంగా ఉన్నారు.

34: >-
    ఆచార్యులు తండ్రి లాంటివారు, పిల్లలు, అలాగే తాతలు, మేనమామలు, మామలు,
    బావమరుదులు, మనములు మరియు బంధువులు.

35: >-
    ఓ మధుసూదనా మూడు లోకాలు ఆదిపత్యం దొరికినా, కొట్టేవాడిని చంపడం నాకు ఇష్టం
    లేదు. ఈ కొద్ది భూమికోసం ఇక్కడ ఎందుకు పోరాడాలి.

36: >-
    జనార్ధన కౌరవులను చంపితే మనకేమి ఆనందం కలుగును? నిప్పంటించి, విషం పెట్టి,
    ఆస్తులు లాకున్న ఈ శత్రువులను చంపితే పాపం సోకుతుంది.

37: >-
    కనుక మన బంధువులైన కౌరవులను చంపడానికి మేము తగము. ఓ మాధవ స్వజనులను చంపి ఎలా
    సుఖం పొందగలము.

38: >-
    వీరి బుద్ధి దురాశతో చెడిపోయినది.కనుక వంశ నాశనము వలన కలిగే నష్టము గాని
    మిత్రులను మోసం చేసిన పాపము గాని వారు చూడరు.

39: >-
    ఓ జనార్ధన ఈ వంశ వినాశాన్ని బాగా మొదటే ఊహించగల మనకు ఈ దుష్ట పోరాటాన్ని
    విరమించకూడదని ఎందుకు ఆలోచింపరాదు.

40: >-
    అన్ని వంశాలు నాశనమైతే గతంలో కొనసాగుతున్న వంశ ఆచారములు ధ్వంస మవుతాయి. ధర్మాలు
    చేయకుంటే అధర్మం పాలిన పడుతుంది.

41: >-
    ఓ వృష్ణి వంశపు కృష్ణ, ఇంటింటి కుమార్తెలు అధర్మమమునకు లోనై దారి తప్పుతారు.
    ఆడది చెడిపోతే మిశ్ర సమాజం ఏర్పడుతుంది.

42: >-
    ఈ అశుద్ధత వలన వంశం చెడిపినవారు, వంశవారు నరకానికి కారకులవుతారు. అటువంటి
    వారి పూర్వీకులు పిండ తర్పణాలు లేకుండా దుర్గతిని పొందుతారు.

43: >-
    ఈ వంశం చెడగొట్టిన సముదాయము వలన మిశ్రిత సమాజము, తప్పుల వలన నరకానికి
    కారణమవుతుంది.

44: >-
    ఓ జనార్ధన వంశపారంపర్య విధివిధానాలు తప్పినందువలన మానవులకు, నరకానికి
    కచ్చితంగా దారి తీస్తాయని మనం బాగా విన్నాము.

45: >-
    అయ్యో! రాష్ట్ర సుఖం కోసం మనం వాళ్ళని చంపడానికైనా సిద్ధపడ్డాం ఎంతటి మహా పాపం
    చేయబోతున్నాం.

46: >-
    ఒకవేళ పోరాటంలో నిరాయుధమైన నన్ను ఆయుధపట్టిన కౌరవులు యుద్ధంలో చంపితే అది నాకు
    చాలా క్షేమమగును.

47: >-
    ఇదంతా చెప్పి అర్జునుడు తీవ్ర దుఃఖంతో తన ధనుర్బాణాలను విసిరి రథం మధ్యలో
    కూర్చున్నాడు.

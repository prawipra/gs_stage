1: |-
    అనాశ్రితః కర్మ-ఫలం కార్యం కర్మ కరోతి యః ।
    స సం-న్యాసీ చ యోగీ చ న నిరగ్నిర్న చాక్రియః ॥

2: |-
    యం సం-న్యాసమితి ప్రాహుః యోగం తం విద్ధి పాండవ ।
    నహ్యసం-న్యస్త-సంకల్పో యోగీ భవతి కశ్చన ॥

3: |-
    ఆరురుక్షోర్మునేర్యోగం కర్మ కారణముచ్యతే ।
    యోగారూఢస్య తస్యైవ శమః కారణముచ్యతే ॥

4: |-
    యదా హి నేంద్రియార్థేషు న కర్మస్వను-షజ్జతే ।
    సర్వ-సంకల్ప-సంన్యాసీ యోగారూఢస్తదోచ్యతే ॥

5: |-
    ఉద్ధరేదాత్మనాఽఽత్మానం నాఽత్మానమవసాదయేత్ ।
    ఆత్మైవ హ్యాత్మనో బంధుః ఆత్మైవ రిపురాత్మనః ॥

6: |-
    బంధురాత్మాఽఽత్మనస్తస్య యేనాఽత్మైవాఽత్మనా జితః ।
    అనాత్మనస్తు శత్రుత్వే వర్తేతాఽత్మైవ శత్రు-వత్ ॥

7: |-
    జితాత్మనః ప్రశాంతస్య పరమాత్మా సమాహితః ।
    శీతోష్ణ-సుఖ-దుఃఖేషు తథా మానాప-మానయోః ॥

8: |-
    జ్ఞాన-విజ్ఞాన-తృప్తాత్మా కూట-స్థో విజితేంద్రియః ।
    యుక్త ఇత్యుచ్యతే యోగీ సమ-లోష్టాశ్మ-కాంచనః ॥

9: |-
    సుహృన్మిత్రార్యుదాసీన-మధ్యస్థ-ద్వేష్య-బంధుషు ।
    సాధుష్వపి చ పాపేషు సమ-బుద్ధిర్విశిష్యతే ॥

10: |-
    యోగీ యుంజీత సతతం ఆత్మానం రహసి స్థితః ।
    ఏకాకీ యత-చిత్తాత్మా నిరాశీరపరి-గ్రహః ॥

11: |-
    శుచౌ దేశే ప్రతిష్ఠాప్య స్థిరమాసనమాత్మనః ।
    నాత్యుచ్ఛ్రితం నాతి-నీచం చేలాజిన-కుశోత్తరం ॥

12: |-
    తత్రైకాగ్రం మనః కృత్వా యత-చిత్తేంద్రియ-క్రియః ।
    ఉపవిశ్యాఽసనే యుంజ్యాత్ యోగమాత్మ-విశుద్ధయే ॥

13: |-
    సమం కాయ-శిరో-గ్రీవం ధారయన్నచలం స్థిరః ।
    సంప్రేక్ష్య నాసికాగ్రం స్వం దిశశ్చానవ-లోకయన్ ॥

14: |-
    ప్ర-శాంతాత్మా విగత-భీః బ్రహ్మ-చారి-వ్రతే స్థితః ।
    మనః సంయమ్య మచ్చిత్తో యుక్త ఆసీత మత్పరః ॥

15: |-
    యుంజన్నేవం సదాఽఽత్మానం యోగీ నియత-మానసః ।
    శాంతిం నిర్బాణ-పరమాం మత్సంస్థామధి-గచ్ఛతి ॥

16: |-
    నాత్యశ్నతస్తు యోగోఽస్తి న చాత్యంతమనశ్నతః ।
    న చాతి-స్వప్న-శీలస్య జాగ్రతో నైవ చార్జున ॥

17: |-
    యుక్తాహార-విహారస్య యుక్త-చేష్టస్య కర్మసు ।
    యుక్త-స్వప్నావ-బోధస్య యోగో భవతి దుఃఖ-హా ॥

18: |-
    యదా వి-నియతం చిత్తం ఆత్మన్యేవావ-తిష్ఠతే ।
    నిస్పృహః సర్వ-కామేభ్యో యుక్త ఇత్యుచ్యతే తదా ॥

19: |-
    యథా దీపో నివాత-స్థో నేంగతే సోపమా మతా ।
    యోగినో యత-చిత్తస్య యుంజతో యోగమాత్మనః ॥

20: |-
    యత్రోప-రమతే చిత్తం ని-రుద్ధం యోగ-సేవయా ।
    యత్ర చైవాఽత్మనాఽఽత్మానం పశ్యన్నాత్మని తుష్యతి ॥

21: |-
    సుఖమాత్యంతికం యత్తత్ బుద్ధి-గ్రాహ్యమతీంద్రియం ।
    వేత్తి యత్ర న చైవాయం స్థితశ్చలతి తత్త్వతః ॥

22: |-
    యం లబ్ధ్వా చాపరం లాభం మన్యతే నాధికం తతః ।
    యస్మిన్ స్థితో న దుఃఖేన గురుణాఽపి వి-చాల్యతే ॥

23: |-
    తం విద్యాద్ దుఃఖ-సంయోగ-వియోగం యోగ-సంజ్ఞితం ।
    స నిశ్చయేన యోక్తవ్యో యోగో నిర్విణ్ణ-చేతసా ॥

24: |-
    సంకల్ప-ప్రభవాన్ కామాన్ త్యక్త్వా సర్వానశేషతః ।
    మనసైవేంద్రియ-గ్రామం వి-నియమ్య సమంతతః ॥

25: |-
    శనైః-శనైరుప-రమేత్ బుద్ధ్యాధృతి-గృహీతయా ।
    ఆత్మ-సంస్థం మనః కృత్వా న కించిదపి చింతయేత్ ॥

26: |-
    యతో యతో నిశ్చరతి మనశ్చంచలమస్థిరం ।
    తతస్తతో నియమ్యైతత్ ఆత్మన్యేవ వశం నయేత్ ॥

27: |-
    ప్రశాంత-మనసం హ్యేనం యోగినం సుఖముత్తమం ।
    ఉపైతి శాంత-రజసం బ్రహ్మ-భూతమకల్మషం ॥

28: |-
    ఏవం యుంజన్ సదాత్మానం యోగీ విగత-కల్మషః ।
    సుఖేన బ్రహ్మ-సంస్పర్శం అత్యంతం సుఖమశ్నుతే ॥

29: |-
    సర్వ-భూత-స్థమాత్మానం సర్వ-భూతాని చాఽత్మని ।
    ఈక్షతే యోగ-యుక్తాత్మా సర్వత్ర సమ-దర్శనః ॥

30: |-
    యో మాం పశ్యతి సర్వత్ర సర్వం చ మయి పశ్యతి ।
    తస్యాహం న ప్రణశ్యామి స చ మే న ప్రణశ్యతి ॥

31: |-
    సర్వ-భూత-స్థితం యో మాం భజత్యేకత్వమాస్థితః ।
    సర్వథా వర్తమానోఽపి స యోగీ మయి వర్తతే ॥

32: |-
    ఆత్మౌపమ్యేన సర్వత్ర సమం పశ్యతి యోఽర్జున ।
    సుఖం వా యది వా దుఃఖం స యోగీ పరమో మతః ॥

33: |-
    యోఽయం యోగస్త్వయా ప్రోక్తః సామ్యేన మధు-సూదన ।
    ఏతస్యాహం న పశ్యామి చంచలత్వాత్ స్థితిం స్థిరాం ॥

34: |-
    చంచలం హి మనః కృష్ణ ప్రమాథి బల-వద్ దృఢం ।
    తస్యాహం నిగ్రహం మన్యే వాయోరివ సు-దుష్కరం ॥

35: |-
    అసంశయం మహాబాహో మనో దుర్నిగ్రహం చలం ।
    అభ్యాసేన తు కౌంతేయ వైరాగ్యేణ చ గృహ్యతే ॥

36: |-
    అసం-యతాత్మనా యోగో దుష్ప్రాప ఇతి మే మతిః ।
    వశ్యాత్మనా తు సతతం శక్యోఽవాప్తుమశేషతః ॥

37: |-
    అయతిః శ్రద్ధయోపేతో యోగాచ్చలిత-మానసః ।
    అప్రాప్య యోగ-సంసిద్ధిం కాం గతిం కృష్ణ గచ్ఛతి ॥

38: |-
    కచ్చిన్నోభయ-విభ్రష్టః ఛిన్నాభ్రమివ నశ్యతి ।
    అప్రతిష్ఠో మహాబాహో విమూఢో బ్రహ్మణః పథి ॥

39: |-
    ఏతన్మే సంశయం కృష్ణ చ్ఛేత్తుమర్హస్యశేషతః ।
    త్వదన్యః సంశయస్యాస్య ఛేత్తా న హ్యుపపద్యతే ॥

40: |-
    పార్థ నైవేహ నాముత్ర వినాశస్తస్య విద్యతే ।
    నహి కల్యాణ-కృత్ కశ్చిద్ దుర్గతిం తాత గచ్ఛతి ॥

41: |-
    ప్రాప్య పుణ్య-కృతాం లోకాన్ ఉషిత్వా శాశ్వతీః సమాః ।
    శుచీనాం శ్రీమతాం గేహే యోగ-భ్రష్టోఽభి-జాయతే ॥

42: |-
    అథవా యోగినామేవ కులే భవతి ధీ-మతాం ।
    ఏతద్ధి దుర్లభ-తరం లోకే జన్మ యదీదృశం ॥

43: |-
    తత్ర తం బుద్ధి-సంయోగం లభతే పౌర్వదైహికం ।
    యతతే చ తతో భూయః సంసిద్ధౌ కురు-నందన ॥

44: |-
    పూర్వాభ్యాసేన తేనైవ హ్రియతే హ్యవశోఽపి సః ।
    జిజ్ఞాసురపి యోగస్య శబ్ద-బ్రహ్మాతి-వర్తతే ॥

45: |-
    ప్రయత్నాద్ యతమానస్తు యోగీ సంశుద్ధ-కిల్బిషః ।
    అనేక-జన్మ-సంసిద్ధః తతో యాతి పరాం గతిం ॥

46: |-
    తపస్విభ్యోఽధికో యోగీ జ్ఞానిభ్యోఽపి మతోఽధికః ।
    కర్మిభ్యశ్చాధికో యోగీ తస్మాద్ యోగీ భవార్జున ॥

47: |-
    యోగినామపి సర్వేషాం మద్గతేనాంతరాత్మనా ।
    శ్ర్రద్ధా-వాన్ భజతే యో మాం స మే యుక్త-తమో మతః ॥

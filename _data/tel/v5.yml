1: |-
    సంన్యాసం కర్మణాం కృష్ణ పునర్యోగం చ శంససి ।
    యచ్ఛ్రేయ ఏతయోరేకం తన్మే బ్రూహి సు-నిశ్చితం ॥

2: |-
    సంన్యాసః కర్మ-యోగశ్చ నిఃశ్రేయస-కరావుభౌ ।
    తయోస్తు కర్మ-సంన్యాసాత్ కర్మ-యోగో విశిష్యతే ॥

3: |-
    జ్ఞేయః స నిత్య-సంన్యాసీ యో న ద్వేష్టి న కాంక్షతి ।
    నిర్ద్వంద్వో హి మహాబాహో సుఖం బంధాత్ ప్రముచ్యతే ॥

4: |-
    సాంఖ్య-యోగౌ పృథగ్ బాలాః ప్ర-వదంతి న పండితాః ।
    ఏకమప్యాస్థితః సమ్యక్ ఉభయోర్విందతే ఫలం ॥

5: |-
    యత్ సాంఖ్యైః ప్రాప్యతే స్థానం తద్ యోగైరపి గమ్యతే ।
    ఏకం సాంఖ్యం చ యోగం చ యః పశ్యతి స పశ్యతి ॥

6: |-
    సం-న్యాసస్తు మహాబాహో దుఃఖమాప్తుమయోగతః ।
    యోగ-యుక్తో మునిర్బ్రహ్మ న చిరేణాధిగచ్ఛతి ॥

7: |-
    యోగ-యుక్తో వి-శుద్ధాత్మా వి-జితాత్మా జితేంద్రియః ।
    సర్వ-భూతాత్మ-భూతాత్మా కుర్వన్నపి న లిప్యతే ॥

8: |-
    నైవ కించిత్ కరోమీతి యుక్తో మన్యేత తత్త్వ-విత్ ।
    పశ్యన్ శృణ్వన్ స్పృశన్ జిఘ్రన్ అశ్నన్ గచ్ఛన్ స్వపన్ శ్వసన్ ॥

9: |-
    ప్రలపన్ విసృజన్ గృహ్ణన్ ఉన్మిషన్ నిమిషన్నపి ।
    ఇంద్రియాణీంద్రియార్థేషు వర్తంత ఇతి ధారయన్ ॥

10: |-
    బ్రహ్మణ్యాధాయ కర్మాణి సంగం త్యక్త్వా కరోతి యః ।
    లిప్యతే న స పాపేన పద్మ-పత్రమివాంభసా ॥

11: |-
    కాయేన మనసా బుద్ధ్యా కేవలైరింద్రియైరపి ।
    యోగినః కర్మ కుర్వంతి సంగం త్యక్త్వాఽఽత్మ-శుద్ధయే ॥

12: |-
    యుక్తః కర్మ-ఫలం త్యక్త్వా శాంతిమాప్నోతి నైష్ఠికీం ।
    అయుక్తః కామ-కారేణ ఫలే సక్తో ని-బద్ధ్యతే ॥

13: |-
    సర్వ-కర్మాణి మనసా సన్న్యస్యాఽస్తే సుఖం వశీ ।
    నవ-ద్వారే పురే దేహీ నైవ కుర్వన్ న కారయన్ ॥

14: |-
    న కర్తృత్వం న కర్మాణి లోకస్య సృజతి ప్రభుః ।
    న కర్మ-ఫల-సంయోగం స్వ-భావస్తు ప్ర-వర్తతే ॥

15: |-
    నాఽదత్తే కస్య-చిత్ పాపం న చైవ సు-కృతం విభుః ।
    అజ్ఞానేనాఽవృతం జ్ఞానం తేన ముహ్యంతి జంతవః ॥

16: |-
    జ్ఞానేన తు తదజ్ఞానం యేషాం నాశితమాత్మనః ।
    తేషామాదిత్యవజ్జ్ఞానం ప్ర-కాశయతి తత్ పరం ॥

17: |-
    తద్బుద్ధయస్తదాత్మానః తన్నిష్ఠాస్తత్పరాయణాః ।
    గచ్ఛంత్యపునరావృత్తిం జ్ఞాన-నిర్ధూత-కల్మషాః ॥

18: |-
    విద్యా-వినయ-సంపన్నే బ్రాహ్మణే గవి హస్తిని ।
    శుని చైవ శ్వపాకే చ పండితాః సమ-దర్శినః ॥

19: |-
    ఇహైవ తైర్జితః సర్గో యేషాం సామ్యే స్థితం మనః ।
    నిర్దోషం హి సమం బ్రహ్మ తస్మాద్ బ్రహ్మణి తే స్థితాః ॥

20: |-
    న ప్ర-హృష్యేత్ ప్రియం ప్రాప్య నోద్విజేత్ ప్రాప్య చాప్రియం ।
    స్థిర-బుద్ధిరసమ్మూఢో బ్రహ్మ-విద్ బ్రహ్మణి స్థితః ॥

21: |-
    బాహ్య-స్పర్శేష్వసక్తాత్మా విందత్యాత్మని యత్ సుఖం ।
    స బ్రహ్మ-యోగ-యుక్తాత్మా సుఖమక్షయమశ్నుతే ॥

22: |-
    యే హి సం-స్పర్శజా భోగాః దుఃఖ-యోనయ ఏవ తే ।
    ఆద్యంతవంతః కౌంతేయ న తేషు రమతే బుధః ॥

23: |-
    శక్నోతీహైవ యః సోఢుం ప్రాక్ శరీర-విమోక్షణాత్ ।
    కామ-క్రోధోద్భవం వేగం స యుక్తః స సుఖీ నరః ॥

24: |-
    యోఽంతః-సుఖోఽంతరారామః తథాంఽతర్జ్యోతిరేవ యః ।
    స యోగీ బ్రహ్మ నిర్బాణం బ్రహ్మ-భూతోఽధి-గచ్ఛతి ॥

25: |-
    లభంతే బ్రహ్మ నిర్బాణం ఋషయః క్షీణ-కల్మషాః ।
    ఛిన్నద్వెైధా యతాత్మానః సర్వ-భూత-హితే రతాః ॥

26: |-
    కామ-క్రోధ-వియుక్తానాం యతీనాం యత-చేతసాం ।
    అభితో బ్రహ్మ నిర్బాణం వర్తతే విదితాత్మనాం ॥

27: |-
    స్పర్శాన్ కృత్వా బహిర్బాహ్యాన్ చక్షుశ్చైవాంతరే భ్రువోః ।
    ప్రాణాపానౌ సమౌ కృత్వా నాసాభ్యంతర-చారిణౌ ॥

28: |-
    యతేంద్రియ-మనోవృత్తిః మునిర్మోక్ష-పరాయణః ।
    వి-గతేచ్ఛా-భయ-క్రోధో యః సదా ముక్త ఏవ సః ॥

29: |-
    భోక్తారం యజ్ఞ-తపసాం సర్వ-లోక-మహేశ్వరం ।
    సుహృదం సర్వ-భూతానాం జ్ఞాత్వా మాం శాంతిమృచ్ఛతి ॥

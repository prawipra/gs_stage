1: |-
    పరం భూయః ప్రవక్ష్యామి జ్ఞానానాం జ్ఞానముత్తమం ।
    యజ్జ్ఞాత్వా మునయః సర్వే పరాం సిద్ధిమితో గతాః ॥

2: |-
    ఇదం జ్ఞానముపాశ్రిత్య మమ సాధర్మ్యమాగతాః ।
    సర్గేఽపి నోప-జాయంతే ప్రళయే న వ్యథంతి చ ॥

3: |-
    మమ యోనిర్మహద్-బ్రహ్మ తస్మిన్ గర్భం దధామ్యహం ।
    సంభవః సర్వ-భూతానాం తతో భవతి భారత ॥

4: |-
    సర్వ-యోనిషు కౌంతేయ మూర్తయః సంభవంతి యాః ।
    తాసాం బ్రహ్మ మహద్యోనిః అహం బీజ-ప్రదః పితా ॥

5: |-
    సత్వం రజస్తమ ఇతి గుణాః ప్రకృతి-సంభవాః ।
    నిబధ్నంతి మహా-బాహో దేహే దేహినమవ్యయం ॥

6: |-
    తత్ర సత్వం నిర్మలత్వాత్ ప్రకాశకమనామయం ।
    సుఖ-సంగేన బధ్నాతి జ్ఞాన-సంగేన చానఘ ॥

7: |-
    రజో రాగాత్మకం విద్ధి తృష్ణా-సంగ-సముద్భవం ।
    తన్నిబధ్నాతి కౌంతేయ కర్మ-సంగేన దేహినం ॥

8: |-
    తమస్త్వజ్ఞాన-జం విద్ధి మోహనం సర్వ-దేహినాం ।
    ప్రమాదాలస్య-నిద్రాభిః తన్నిబధ్నాతి భారత ॥

9: |-
    సత్వం సుఖే సంజయతి రజః కర్మణి భారత ।
    జ్ఞానమావృత్య తు తమః ప్రమాదే సంజయత్యుత ॥

10: |-
    రజస్తమశ్చాభి-భూయ సత్వం భవతి భారత ।
    రజః సత్వం తమశ్చైవ తమః సత్వం రజస్తథా ॥

11: |-
    సర్వ-ద్వారేషు దేహేఽస్మిన్ ప్రకాశ ఉప-జాయతే ।
    జ్ఞానం యదా తదా విద్యాత్ వివృద్ధం సత్వమిత్యుత ॥

12: |-
    లోభః ప్రవృత్తిరారంభః కర్మణామశమః స్పృహా ।
    రజస్యేతాని జాయంతే వివృద్ధే భరతర్షభ ॥

13: |-
    అప్రకాశోఽప్రవృత్తిశ్చ ప్రమాదో మోహ ఏవ చ ।
    తమస్యేతాని జాయంతే వివృద్ధే కురు-నందన ॥

14: |-
    యదా సత్వే ప్రవృద్ధే తు ప్రళయం యాతి దేహ-భృత్ ।
    తదోత్తమ-విదాం లోకాన్ అమలాన్ ప్రతిపద్యతే ॥

15: |-
    రజసి ప్రళయం గత్వా కర్మ-సంగిషు జాయతే ।
    తథా ప్రలీనస్తమసి మూఢ-యోనిషు జాయతే ॥

16: |-
    కర్మణః సుకృతస్యాహుః సాత్వికం నిర్మలం ఫలం ।
    రజసస్తు ఫలం దుఃఖం అజ్ఞానం తమసః ఫలం ॥

17: |-
    సత్వాత్ సంజాయతే జ్ఞానం రజసో లోభ ఏవ చ ।
    ప్రమాద-మోహౌ తమసో భవతోఽజ్ఞానమేవ చ ॥

18: |-
    ఊర్ధ్వం గచ్ఛంతి సత్వ-స్థాః మధ్యే తిష్ఠంతి రాజసాః ।
    జఘన్య-గుణ-వృత్తి-స్థాః అధో గచ్ఛంతి తామసాః ॥

19: |-
    నాన్యం గుణేభ్యః కర్తారం యదా ద్రష్టాఽను-పశ్యతి ।
    గుణేభ్యశ్చ పరం వేత్తి మద్భావం సోఽధిగచ్ఛతి ॥

20: |-
    గుణానేతానతీత్య త్రీన్ దేహీ దేహ-సముద్భవాన్ ।
    జన్మ-మృత్యు-జరా-దుఃఖైః విముక్తోఽమృతమశ్నుతే ॥

21: |-
    కైర్లింగైస్త్రీన్ గుణానేతాన్ అతీతో భవతి ప్రభో ।
    కిమాచారః కథం చైతాన్ త్రీన్ గుణానతి-వర్తతే ॥

22: |-
    ప్రకాశం చ ప్రవృత్తిం చ మోహమేవ చ పాండవ ।
    న ద్వేష్టి సంప్రవృత్తాని న నివృత్తాని కాంక్షతి ॥

23: |-
    ఉదాసీనవదాసీనో గుణైర్యో న విచాల్యతే ।
    గుణా వర్తంత ఇత్యేవ యోఽవ-తిష్ఠతి నేంగతే ॥

24: |-
    సమ-దుఃఖ-సుఖః స్వస్థః సమ-లోష్టాశ్మ-కాంచనః ।
    తుల్య-ప్రియాప్రియో ధీరః తుల్య-నిందాత్మ-సంస్తుతిః ॥

25: |-
    మానాప-మానయోస్తుల్యః తుల్యో మిత్రారి-పక్షయోః ।
    సర్వారంభ-పరిత్యాగీ గుణాతీతః స ఉచ్యతే ॥

26: |-
    మాం చ యోఽవ్యభిచారేణ భక్తి-యోగేన సేవతే ।
    స గుణాన్ సమతీత్యైతాన్ బ్రహ్మ-భూయాయ కల్పతే ॥

27: |-
    బ్రహ్మణో హి ప్రతిష్ఠాఽహం అమృతస్యావ్యయస్య చ ।
    శాశ్వతస్య చ ధర్మస్య సుఖస్యైకాంతికస్య చ ॥

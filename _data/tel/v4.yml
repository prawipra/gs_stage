1: |-
    ఇమం వివస్వతే యోగం ప్రోక్తవానహమవ్యయం ।
    వివస్వాన్ మనవే ప్రాహ మనురిక్ష్వాకవేఽబ్రవీత్ ॥

2: |-
    ఏవం పరంపరా-ప్రాప్తం ఇమం రాజర్షయో విదుః ।
    స కాలేనేహ మహతా యోగో నష్టః పరం-తప ॥

3: |-
    స ఏవాయం మయా తేఽద్య యోగః ప్రోక్తః పురాతనః ।
    భక్తోఽసి మే సఖా చేతి రహస్యం హ్యేతదుత్తమం ॥

4: |-
    అపరం భవతో జన్మ పరం జన్మ వివస్వతః ।
    కథమేతద్ వి-జానీయాం త్వమాదౌ ప్రోక్తవానితి ॥

5: |-
    బహూని మే వ్యతీతాని జన్మాని తవ చార్జున ।
    తాన్యహం వేద సర్వాణి న త్వం వేత్థ పరం తప ॥

6: |-
    అజోఽపి సన్నవ్యయాత్మా భూతానామీశ్వరోఽపి సన్ ।
    ప్రకృతిం స్వామధిష్ఠాయ సం-భవామ్యాత్మ-మాయయా ॥

7: |-
    యదా యదా హి ధర్మస్య గ్లానిర్భవతి భారత ।
    అభ్యుత్థానమధర్మస్య తదాఽఽత్మానం సృజామ్యహం ॥

8: |-
    పరి-త్రాణాయ సాధూనాం వి-నాశాయ చ దుష్కృతాం ।
    ధర్మ-సం-స్థాపనార్థాయ సం-భవామి యుగే-యుగే ॥

9: |-
    జన్మ కర్మ చ మే దివ్యం ఏవం యో వేత్తి తత్వతః ।
    త్యక్త్వా దేహం పునర్జన్మ నైతి మామేతి సోఽర్జున ॥

10: |-
    వీత-రాగ-భయ-క్రోధాః మన్మయా మాముపాశ్రితాః ।
    బహవో జ్ఞాన-తపసా పూతా మద్భావమాగతాః ॥

11: |-
    యే యథా మాం ప్రపద్యంతే తాంస్తథైవ భజామ్యహం ।
    మమ వర్త్మాను-వర్తంతే మనుష్యాః పార్థ సర్వశః ॥

12: |-
    కాంక్షంతః కర్మణాం సిద్ధిం యజంత ఇహ దేవతాః ।
    క్షిప్రం హి మానుషే లోకే సిద్ధిర్భవతి కర్మ-జా ॥

13: |-
    చాతుర్వర్ణ్యం మయా సృష్టం గుణ-కర్మ-విభాగశః ।
    తస్య కర్తారమపి మాం విద్ధ్యకర్తారమవ్యయం ॥

14: |-
    న మాం కర్మాణి లింపంతి న మే కర్మ-ఫలే స్పృహా ।
    ఇతి మాం యోఽభి-జానాతి కర్మభిర్న స బధ్యతే ॥

15: |-
    ఏవం జ్ఞాత్వా కృతం కర్మ పూర్వైరపి ముముక్షుభిః ।
    కురు కర్మైవ తస్మాత్ త్వం పూర్వైః పూర్వ-తరం కృతం ॥

16: |-
    కిం కర్మ కిమకర్మేతి కవయోఽప్యత్ర మోహితాః ।
    తత్ తే కర్మ ప్రవక్ష్యామి యజ్ఞత్వా మోక్ష్యసేఽశుభాత్ ॥

17: |-
    కర్మణో హ్యపి బోద్ధవ్యం బోద్ధవ్యం చ వి-కర్మణః ।
    అకర్మణశ్చ బోద్ధవ్యం గహనా కర్మణో గతిః ॥

18: |-
    కర్మణ్యకర్మ యః పశ్యేత్ అకర్మణి చ కర్మ యః ।
    స బుద్ధి-మాన్ మనుష్యేషు స యుక్తః కృత్స్న-కర్మ-కృత్ ॥

19: |-
    యస్య సర్వే సమారంభాః కామ-సంకల్ప-వర్జితాః ।
    జ్ఞానాగ్ని-దగ్ధ-కర్మాణం తమాహుః పండితం బుధాః ॥

20: |-
    త్యక్త్వా కర్మ-ఫలాసంగం నిత్య-తృప్తో నిరాశ్రయః ।
    కర్మణ్యభి-ప్రవృత్తోఽపి నైవ కించిత్ కరోతి సః ॥

21: |-
    నిరాశీర్యత-చిత్తాత్మా త్యక్త-సర్వ-పరిగ్రహః ।
    శారీరం కేవలం కర్మ కుర్వన్ నాఽప్నోతి కిల్బిషం ॥

22: |-
    యదృచ్ఛా-లాభ-సంతుష్టో ద్వంద్వాతీతో వి-మత్సరః ।
    సమః సిద్ధావసిద్ధౌ చ కృత్వాఽపి న ని-బద్ధ్యతే ॥

23: |-
    గత-సంగస్య ముక్తస్య జ్ఞానావస్థిత-చేతసః ।
    యజ్ఞాయాఽచరతః కర్మ సమగ్రం ప్రవి-లీయతే ॥

24: |-
    బ్రహ్మార్పణం బ్రహ్మ-హవిః బ్రహ్మాగ్నౌ బ్రహ్మణా హుతం ।
    బ్రహ్మెైవ తేన గంతవ్యం బ్రహ్మ-కర్మ-సమాధినా ॥

25: |-
    దైవమేవాపరే యజ్ఞం యోగినః పర్యుపాసతే ।
    బ్రహ్మాగ్నావపరే యజ్ఞం యజ్ఞేనైవోప-జుహ్వతి ॥

26: |-
    శ్రోత్రాదీనీంద్రియాణ్యన్యే సం-యమాగ్నిషు జుహ్వతి ।
    శబ్దాదీన్ విషయానన్యే ఇంద్రియాగ్నిషు జుహ్వతి ॥

27: |-
    సర్వాణీంద్రియ-కర్మాణి ప్రాణ-కర్మాణి చాపరే ।
    ఆత్మ-సంయమ-యోగాగ్నౌ జుహ్వతి జ్ఞాన-దీపితే ॥

28: |-
    ద్రవ్య-యజ్ఞాస్తపో-యజ్ఞాః యోగ-యజ్ఞాస్తథా పరే ।
    స్వాధ్యాయ-జ్ఞాన-యజ్ఞాశ్చ యతయః సంశిత-వ్రతాః ॥

29: |-
    అపానే జుహ్వతి ప్రాణం ప్రాణేఽపానం తథా పరే ।
    ప్రాణాపాన-గతీ రుద్ధ్వా ప్రాణాయామ-పరాయణాః ॥

30: |-
    అపరే నియతాహారాః ప్రాణాన్ ప్రాణేషు జుహ్వతి ।
    సర్వేఽప్యేతే యజ్ఞ-విదో యజ్ఞ-క్షపిత-కల్మషాః ॥

31: |-
    యజ్ఞ-శిష్టామృత-భుజో యాంతి బ్రహ్మ సనాతనం ।
    నాయం లోకోఽస్త్యయజ్ఞస్య కుతోఽన్యః కురు-సత్తమ ॥

32: |-
    ఏవం బహు-విధా యజ్ఞాః వితతా బ్రహ్మణో ముఖే ।
    కర్మ-జాన్ విద్ధి తాన్ సర్వాన్ ఏవం జ్ఞాత్వా విమోక్ష్యసే ॥

33: |-
    శ్రేయాన్ ద్రవ్య-మయాద్ యజ్ఞాత్ జ్ఞాన-యజ్ఞః పరం-తప ।
    సర్వం కర్మాఖిలం పార్థ జ్ఞానే పరి-సమాప్యతే ॥

34: |-
    తద్ విద్ధి ప్రణిపాతేన పరి-ప్రశ్నేన సేవయా ।
    ఉపదేక్ష్యంతి తే జ్ఞానం జ్ఞానినస్తత్త్వ-దర్శినః ॥

35: |-
    యజ్జ్ఞాత్వా న పునర్మోహం ఏవం యాస్యసి పాండవ ।
    యేన భూతాన్యశేషేణ ద్రక్ష్యస్యాత్మన్యథో మయి ॥

36: |-
    అపి చేదసి పాపేభ్యః సర్వేభ్యః పాప-కృత్తమః ।
    సర్వం జ్ఞాన-ప్లవేనైవ వృజినం సం-తరిష్యసి ॥

37: |-
    యథైధాంసి సమిద్ధోఽగ్నిః భస్మసాత్ కురుతేఽర్జున ।
    జ్ఞానాగ్నిః సర్వ-కర్మాణి భస్మసాత్ కురుతే తథా ॥

38: |-
    న హి జ్ఞానేన సదృశం పవిత్రమిహ విద్యతే ।
    తత్ స్వయం యోగ-సంసిద్ధః కాలేనాఽత్మని విందతి ॥

39: |-
    శ్రద్ధా-వాన్ లభతే జ్ఞానం మత్పరః సం-యతేంద్రియః ।
    జ్ఞానం లబ్ధ్వా పరాం శాంతిం అచిరేణాధి-గచ్ఛతి ॥

40: |-
    అజ్ఞశ్చాశ్రద్దధానశ్చ సంశయాత్మా వి-నశ్యతి ।
    నాయం లోకోఽస్తి న పరో న సుఖం సంశయాత్మనః ॥

41: |-
    యోగ-సంన్యస్త-కర్మాణం జ్ఞాన-సంఛిన్న-సంశయం ।
    ఆత్మ-వంతం న కర్మాణి ని-బధ్నంతి ధనం-జయ ॥

42: |-
    తస్మాదజ్ఞాన-సంభూతం హృత్-స్థం జ్ఞానాసినాఽఽత్మనః ।
    ఛిత్వైనం సంశయం యోగం ఆతిష్ఠోత్తిష్ఠ భారత ॥

1: |-
    సంన్యాసస్య మహాబాహో తత్వమిచ్ఛామి వేదితుం ।
    త్యాగస్య చ హృషీకేశ పృథక్ కేశి-నిషూదన ॥

2: |-
    కామ్యానాం కర్మణాం న్యాసం సంన్యాసం కవయో విదుః ।
    సర్వ-కర్మ-ఫల-త్యాగం ప్రాహుస్త్యాగం విచక్షణాః ॥

3: |-
    త్యాజ్యం దోష-వదిత్యేకే కర్మ ప్రాహుర్మనీషిణః ।
    యజ్ఞ-దాన-తపః-కర్మ న త్యాజ్యమితి చాపరే ॥

4: |-
    నిశ్శ్చయం శృణు మే తత్ర త్యాగే భరత-సత్తమ ।
    త్యాగో హి పురుష-వ్యాఘ్ర త్రి-విధః సంప్ర-కీర్తితః ॥

5: |-
    యజ్ఞ-దాన-తపః-కర్మ న త్యాజ్యం కార్యమేవ తత్ ।
    యజ్ఞో దానం తపశ్చైవ పావనాని మనీషిణాం ॥

6: |-
    ఏతాన్యపి తు కర్మాణి సంగం త్యక్త్వా ఫలాని చ ।
    కర్తవ్యానీతి మే పార్థ నిశ్చితం మతముత్తమం ॥

7: |-
    నియతస్య తు సంన్యాసః కర్మణో నోప-పద్యతే ।
    మోహాత్ తస్య పరిత్యాగః తామసః పరి-కీర్తితః ॥

8: |-
    దుఃఖమిత్యేవ యత్ కర్మ కాయ-క్లేశ-భయాత్ త్యజేత్ ।
    స కృత్వా రాజసం త్యాగం నైవ త్యాగ-ఫలం లభేత్ ॥

9: |-
    కార్యమిత్యేవ యత్ కర్మ నియతం క్రియతేఽర్జున ।
    సంగం త్యక్త్వా ఫలం చైవ స త్యాగః సాత్త్వికో మతః ॥

10: |-
    న ద్వేష్ట్యకుశలం కర్మ కుశలే నాను-షజ్జతే ।
    త్యాగీ సత్త్వ-సమావిష్టో మేధావీ ఛిన్న-సంశయః ॥

11: |-
    న హి దేహ-భృతా శక్యం త్యక్తుం కర్మాణ్యశేషతః ।
    యస్తు కర్మ-ఫల-త్యాగీ స త్యాగీత్యభి-ధీయతే ॥

12: |-
    అనిష్టమిష్టం మిశ్రం చ త్రి-విధం కర్మణః ఫలం ।
    భవత్యత్యాగినాం ప్రేత్య న తు సంన్యాసినాం క్వచిత్ ॥

13: |-
    పంచైతాని మహా-బాహో కారణాని నిబోధ మే ।
    సాంఖ్యే కృతాంతే ప్రోక్తాని సిద్ధయే సర్వ-కర్మణాం ॥

14: |-
    అధిష్ఠానం తథా కర్తా కరణం చ పృథగ్విధం ।
    వివిధాశ్చ పృథక్ చేష్టా దైవం చైవాత్ర పంచమం ॥

15: |-
    శరీర-వాఙ్మనోభిర్యత్ కర్మ ప్రారభతే నరః ।
    న్యాయ్యం వా విపరీతం వా పంచైతే తస్య హేతవః ॥

16: |-
    తత్రైవం సతి కర్తారం ఆత్మానం కేవలం తు యః ।
    పశ్యత్యకృత-బుద్ధిత్వాత్ న స పశ్యతి దుర్మతిః ॥

17: |-
    యస్య నాహం-కృతో భావో బుద్ధిర్యస్య న లిప్యతే ।
    హత్వాఽపి స ఇమాన్ లోకాన్ న హంతి న నిబధ్యతే ॥

18: |-
    జ్ఞానం జ్ఞేయం పరి-జ్ఞాతా త్రి-విధా కర్మ-చోదనా ।
    కరణం కర్మ కర్తేతి త్రి-విధః కర్మ-సంగ్రహః ॥

19: |-
    జ్ఞానం కర్మ చ కర్తా చ త్రి-ధైవ గుణ-భేదతః ।
    ప్రోచ్యతే గుణ-సంఖ్యానే యథావచ్ఛృణు తాన్యపి ॥

20: |-
    సర్వ-భూతేషు యేనైకం భావమవ్యయమీక్షతే ।
    అవిభక్తం విభక్తేషు తజ్జ్ఞానం విద్ధి సాత్త్వికం ॥

21: |-
    పృథక్త్వేన తు యజ్జ్ఞానం నానా-భావాన్ పృథగ్విధాన్ ।
    వేత్తి సర్వేషు భూతేషు తజ్జ్ఞానం విద్ధి రాజసం ॥

22: |-
    యత్ తు కృత్స్న-వదేకస్మిన్ కార్యే సక్తమహైతుకం ।
    అతత్వార్థ-వదల్పం చ తత్ తామసముదాహృతం ॥

23: |-
    నియతం సంగ-రహితం అరాగ-ద్వేషతః కృతం ।
    అఫల-ప్రేప్సునా కర్మ యత్ తత్ సాత్త్వికముచ్యతే ॥

24: |-
    యత్ తు కామేప్సునా కర్మ సాహం-కారేణ వా పునః ।
    క్రియతే బహులాయాసం తద్ రాజసముదాహృతం ॥

25: |-
    అనుబంధం క్షయం హింసాం అనపేక్ష్య చ పౌరుషం ।
    మోహాదారభ్యతే కర్మ యత్ తత్ తామసముచ్యతే ॥

26: |-
    ముక్త-సంగోఽనహం-వాదీ ధృత్యుత్సాహ-సమన్వితః ।
    సిద్ధ్యసిద్ధ్యోర్నిర్వికారః కర్తా సాత్త్విక ఉచ్యతే ॥

27: |-
    రాగీ కర్మ-ఫల-ప్రేప్సుః లుబ్ధో హింసాత్మకోఽశుచిః ।
    హర్ష-శోకాన్వితః కర్తా రాజసః పరికీర్తితః ॥

28: |-
    అయుక్తః ప్రాకృతః స్తబ్ధః శఠో నైకృతికోఽలసః ।
    విషాదీ దీర్ఘ-సూత్రీ చ కర్తా తామస ఉచ్యతే ॥

29: |-
    బుద్ధేర్భేదం ధృతేశ్చైవ గుణతస్త్రి-విధం శృణు ।
    ప్రోచ్యమానమశేషేణ పృథక్త్వేన ధనం-జయ ॥

30: |-
    ప్రవృత్తిం చ నివృత్తిం చ కార్యాకార్యే భయాభయే ।
    బంధం మోక్షం చ యా వేత్తి బుద్ధిః సా పార్థ సాత్త్వికీ ॥

31: |-
    యయా ధర్మమధర్మం చ కార్యం చాకార్యమేవ చ ।
    అయథా-వత్ ప్రజానాతి బుద్ధిః సా పార్థ రాజసీ ॥

32: |-
    అధర్మం ధర్మమితి యా మన్యతే తమసాఽఽవృతా ।
    సర్వార్థాన్ విపరీతాంశ్చ బుద్ధిః సా పార్థ తామసీ ॥

33: |-
    ధృత్యా యయా ధారయతే మనః-ప్రాణేంద్రియ-క్రియాః ।
    యోగేనావ్యభి-చారిణ్యా ధృతిః సా పార్థ సాత్త్వికీ ॥

34: |-
    యయా తు ధర్మ-కామార్థాన్ ధృత్యా ధారయతేఽర్జున ।
    ప్రసంగేన ఫలాకాంక్షీ ధృతిః సా పార్థ రాజసీ ॥

35: |-
    యయా స్వప్నం భయం శోకం విషాదం మదమేవ చ ।
    న విముంచతి దుర్మేధా ధృతిః సా పార్థ తామసీ ॥

36: |-
    సుఖం త్విదానీం త్రి-విధం శృణు మే భరతర్షభ ।
    అభ్యాసాద్ రమతే యత్ర దుఃఖాంతం చ నిగచ్ఛతి ॥

37: |-
    యత్ తదగ్రే విషమివ పరిణామేఽమృతోపమం ।
    తత్ సుఖం సాత్వికం ప్రోక్తం ఆత్మ-బుద్ధి-ప్రసాద-జం ॥

38: |-
    విషయేంద్రియ-సంయోగాత్ యత్ తదగ్రేఽమృతోపమం ।
    పరిణామే విషమివ తత్ సుఖం రాజసం స్మృతం ॥

39: |-
    యదగ్రే చానుబంధే చ సుఖం మోహనమాత్మనః ।
    నిద్రాలస్య-ప్రమాదోత్థం తత్ తామసముదాహృతం ॥

40: |-
    న తదస్తి పృథివ్యాం వా దివి దేవేషు వా పునః ।
    సత్వం ప్రకృతి-జైర్ముక్తం యదేభిః స్యాత్ త్రిభిర్గుణైః ॥

41: |-
    బ్రాహ్మణ-క్షత్రియ-విశాం శూద్రాణాం చ పరం-తప ।
    కర్మాణి ప్రవి-భక్తాని స్వ-భావ-ప్రభవైర్గుణైః ॥

42: |-
    శమో దమస్తపః శౌచం క్షాంతిరార్జవమేవ చ ।
    జ్ఞానం విజ్ఞానమాస్తిక్యం బ్రహ్మ-కర్మ స్వ-భావ-జం ॥

43: |-
    శౌర్యం తేజో ధృతిర్దాక్ష్యం యుద్ధే చాప్యపలాయనం ।
    దానమీశ్వర-భావశ్చ క్షాత్రం కర్మ స్వ-భావ-జం ॥

44: |-
    కృషి-గో-రక్ష-వాణిజ్యం వైశ్య-కర్మ స్వ-భావ-జం ।
    పరిచర్యాత్మకం కర్మ శూద్రస్యాపి స్వ-భావ-జం ॥

45: |-
    స్వే స్వే కర్మణ్యభి-రతః సంసిద్ధిం లభతే నరః ।
    స్వ-కర్మ-నిరతః సిద్ధిం యథా విందతి తచ్ఛృణు ॥

46: |-
    యతః ప్రవృత్తిర్భూతానాం యేన సర్వమిదం తతం ।
    స్వ-కర్మణా తమభ్యర్చ్య సిద్ధిం విందతి మానవః ॥

47: |-
    శ్రేయాన్ స్వ-ధర్మో విగుణః పర-ధర్మాత్ స్వనుష్ఠితాత్ ।
    స్వ-భావ-నియతం కర్మ కుర్వన్ నాఽప్నోతి కిల్బిషం ॥

48: |-
    సహ-జం కర్మ కౌంతేయ స-దోషమపి న త్యజేత్ ।
    సర్వారంభా హి దోషేణ ధూమేనాగ్నిరివాఽమృతాః ॥

49: |-
    అసక్త-బుద్ధిః సర్వత్ర జితాత్మా విగత-స్పృహః ।
    నైష్కర్మ్య-సిద్ధిం పరమాం సంన్యాసేనాధిగచ్ఛతి ॥

50: |-
    సిద్ధిం ప్రాప్తో యథా బ్రహ్మ తథాఽఽప్నోతి నిబోధ మే ।
    సమాసేనైవ కౌంతేయ నిష్ఠా జ్ఞానస్య యా పరా ॥

51: |-
    బుద్ధ్యావిశుద్ధయా యుక్తో ధృత్యాఽఽత్మానం నియమ్య చ ।
    శబ్దాదీన్ విషయాంస్త్యక్త్వా రాగ-ద్వేషౌ వ్యుదస్య చ ॥

52: |-
    వివిక్త-సేవీ లఘ్వాశీ యత-వాక్కాయ-మానసః ।
    ధ్యాన-యోగ-పరో నిత్యం వైరాగ్యం సముపాశ్రితః ॥

53: |-
    అహం-కారం బలం దర్పం కామం క్రోధం పరిగ్రహం ।
    విముచ్య నిర్మమః శాంతో బ్రహ్మ-భూయాయ కల్పతే ॥

54: |-
    బ్రహ్మ-భూతః ప్రసన్నాత్మా న శోచతి న కాంక్షతి ।
    సమః సర్వేషు భూతేషు మద్భక్తిం లభతే పరాం ॥

55: |-
    భక్త్యా మామభి-జానాతి యావాన్ యశ్చాస్మి తత్త్వతః ।
    తతో మాం తత్త్వతో జ్ఞాత్వా విశతే తదనంతరం ॥

56: |-
    సర్వ-కర్మాణ్యపి సదా కుర్వాణో మద్వ్యపాశ్రయః ।
    మత్ప్రసాదాదవాప్నోతి శాశ్వతం పదమవ్యయం ॥

57: |-
    చేతసా సర్వ-కర్మాణి మయి సంన్యస్య మత్పరః ।
    బుద్ధి-యోగముపాశ్రిత్య మచ్చిత్తః సతతం భవ ॥

58: |-
    మచ్చిత్తః సర్వ-దుర్గాణి మత్ప్రసాదాత్ తరిష్యసి ।
    అథ చేత్ త్వమహం-కారాత్ న శ్రోష్యసి వినంక్ష్యసి ॥

59: |-
    యదహం-కారమాశ్రిత్య న యోత్స్య ఇతి మన్యసే ।
    మిథ్యైష వ్యవసాయస్తే ప్రకృతిస్త్వాం నియోక్ష్యతి ॥

60: |-
    స్వ-భావ-జేన కౌంతేయ నిబద్ధః స్వేన కర్మణా ।
    కర్తుం నేచ్ఛసి యన్మోహాత్ కరిష్యస్యవశోఽపి తత్ ॥

61: |-
    ఈశ్వరః సర్వ-భూతానాం హృద్దేశేఽర్జున తిష్ఠతి ।
    భ్రామయన్ సర్వ-భూతాని యంత్రారూఢాని మాయయా ॥

62: |-
    తమేవ శరణం గచ్ఛ సర్వ-భావేన భారత ।
    తత్-ప్రసాదాత్ పరాం శాంతిం స్థానం ప్రాప్స్యసి శాశ్వతం ॥

63: |-
    ఇతి తే జ్ఞానమాఖ్యాతం గుహ్యాద్ గుహ్య-తరం మయా ।
    విమృశ్శైతదశేషేణ యథేచ్ఛసి తథా కురు ॥

64: |-
    సర్వ-గుహ్య-తమం భూయః శృణు మే పరమం వచః ।
    ఇష్టోఽసి మే దృఢమితి తతో వక్ష్యామి తే హితం ॥

65: |-
    మన్మనా భవ మద్భక్తో మద్యాజీ మాం నమస్కురు ।
    మామేవైష్యసి సత్యం తే ప్రతిజానే ప్రియోఽసి మే ॥

66: |-
    సర్వ-ధర్మాన్ పరిత్యజ్య మామేకం శరణం వ్రజ ।
    అహం త్వా సర్వ-పాపేభ్యో మోక్షయిష్యామి మా శుచః ॥

67: |-
    ఇదం తే నాతపస్కాయ నాభక్తాయ కదాచన ।
    న చాశుశ్రూషవే వాచ్యం న చ మాం యోఽభ్యసూయతి ॥

68: |-
    య ఇమం పరమం గుహ్యం మద్-భక్తేష్వభి-ధాస్యతి ।
    భక్తిం మయి పరాం కృత్వా మామేవైష్యత్యసంశయః ॥

69: |-
    న చ తస్మాన్మనుష్యేషు కశ్చిన్మే ప్రియ-కృత్తమః ।
    భవితా న చ మే తస్మాత్ అన్యః ప్రియ-తరో భువి ॥

70: |-
    అధ్యేష్యతే చ య ఇమం ధర్మ్యం సంవాదమావయోః ।
    జ్ఞాన-యజ్ఞేన తేనాహం ఇష్టః స్యామితి మే మతిః ॥

71: |-
    శ్ర్రద్ధా-వాననసూయశ్చ శృణుయాదపి యో నరః ।
    సోఽపి ముక్తః శుభాన్ లోకాన్ ప్రాప్నుయాత్పుణ్య-కర్మణాం ॥

72: |-
    కచ్చిదేతచ్ఛ్రుతం పార్థ త్వయైకాగ్రేణ చేతసా ।
    కచ్చిదజ్ఞాన-సంమోహః ప్రనష్టస్తే ధనం-జయ ॥

73: |-
    నష్టో మోహః స్మృతిర్లబ్ధా త్వత్-ప్రసాదాన్మయాఽచ్యుత ।
    స్థితోఽస్మి గత-సందేహః కరిష్యే వచనం తవ ॥

74: |-
    ఇత్యహం వాసు-దేవస్య పార్థస్య చ మహాత్మనః ।
    సంవాదమిమమశ్రౌషం అద్భుతం రోమ-హర్షణం ॥

75: |-
    వ్యాస-ప్రసాదాచ్ఛ్రుతవాన్ ఏతద్ గుహ్యమహం పరం ।
    యోగం యోగేశ్వరాత్ కృష్ణాత్ సాక్షాత్ కథయతః స్వయం ॥

76: |-
    రాజన్ సంస్మృత్య-సంస్మృత్య సంవాదమిమమద్భుతం ।
    కేశవార్జునయోః పుణ్యం హృష్యామి చ ముహుర్ముహుః ॥

77: |-
    తచ్చ సంస్మృత్య-సంస్మృత్య రూపమత్యద్భుతం హరేః ।
    విస్మయో మే మహాన్ రాజన్ హృష్యామి చ పునః-పునః ॥

78: |-
    యత్ర యోగేశ్వరః కృష్ణో యత్ర పార్థో ధనుర్ధరః ।
    తత్ర శ్రీర్విజయో భూతిః ధ్రువా నీతిర్మతిర్మమ ॥

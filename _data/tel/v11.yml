1: |-
    మదనుగ్రహాయ పరమం గుహ్యమధ్యాత్మ-సంజ్ఞితం ।
    యత్ త్వయోక్తం వచస్తేన మోహోఽయం విగతో మమ ॥

2: |-
    భవాప్యయౌ హి భూతానాం శ్రుతౌ విస్తరశో మయా ।
    త్వత్తః కమల-పత్రాక్ష మాహాత్మ్యమపి చావ్యయం ॥

3: |-
    ఏవమేతద్ యథాఽఽత్థ త్వం ఆత్మానం పరమేశ్వర ।
    ద్రష్టుమిచ్ఛామి తే రూపం ఐశ్వరం పురుషోత్తమ ॥

4: |-
    మన్యసే యది తచ్ఛక్యం మయా ద్రష్టుమితి ప్రభో ।
    యోగేశ్వర తతో మే త్వం దర్శయాఽత్మానమవ్యయం ॥

5: |-
    పశ్య మే పార్థ రూపాణి శతశోఽథ సహస్రశః ।
    నానా-విధాని దివ్యాని నానా-వర్ణాకృతీని చ ॥

6: |-
    పశ్యాఽదిత్యాన్ వసూన్ రుద్రాన్ అశ్వినౌ మరుతస్తథా ।
    బహూన్యదృష్ట-పూర్వాణి పశ్యాఽశ్చర్యాణి భారత ॥

7: |-
    ఇహైక-స్థం జగత్ కృత్స్నం పశ్యాద్య స-చరాచరం ।
    మమ దేహే గుడాకేశ యచ్చాన్యద్ ద్రష్టుమిచ్ఛసి ॥

8: |-
    నతు మాం శక్యసే ద్రష్టుం అనేనైవ స్వ-చక్షుషా ।
    దివ్యం దదామి తే చక్షుః పశ్య మే యోగమైశ్వరం ॥

9: |-
    ఏవముక్త్వా తతో రాజన్ మహా-యోగేశ్వరో హరిః ।
    దర్శయామాస పార్థాయ పరమం రూపమైశ్వరం ॥

10: |-
    అనేక-వక్త్ర-నయనం అనేకాద్భుత-దర్శనం ।
    అనేక-దివ్యాభరణం దివ్యానేకోద్యతాయుధం ॥

11: |-
    దివ్య-మాల్యాంబర-ధరం దివ్య-గంధాను-లేపనం ।
    సర్వాశ్చర్య-మయం దేవం అనంతం విశ్వతో-ముఖం ॥

12: |-
    దివి సూర్య-సహస్రస్య భవేద్ యుగపదుత్థితా ।
    యది భాః సదృశీ సా స్యాత్ భాసస్తస్య మహాత్మనః ॥

13: |-
    తత్రైక-స్థం జగత్ కృత్స్నం ప్రవిభక్తమనేక-ధా ।
    అపశ్యద్ దేవ-దేవస్య శరీరే పాండవస్తదా ॥

14: |-
    తతః స విస్మయావిష్టో హృష్ట-రోమా ధనం-జయః ।
    ప్రణమ్య శిరసా దేవం కృతాంజలిరభాషత ॥

15: |-
    పశ్యామి దేవాంస్తవ దేవ దేహే
    సర్వాంస్తథా భూత-విశేష-సంఘాన్ ।
    బ్రహ్మాణమీశం కమలాసన-స్థం
    ఋషీంశ్చ సర్వానురగాంశ్చ దివ్యాన్ ॥

16: |-
    అనేక-బాహూదర-వక్త్ర-నేత్రం
    పశ్యామి త్వాం సర్వతోఽనంత-రూపం ।
    నాంతం న మధ్యం న పునస్తవాఽదిం
    పశ్యామి విశ్వేశ్వర విశ్వ-రూప ॥

17: |-
    కిరీటినం గదినం చక్రిణం చ
    తేజో-రాశిం సర్వతో దీప్తి-మంతం ।
    పశ్యామి త్వా దుర్నిరీక్ష్యం సమంతాత్
    దీప్తానలార్క-ద్యుతిమప్రమేయం ॥

18: |-
    త్వమక్షరం పరమం వేదితవ్యం
    త్వమస్య విశ్వస్య పరం నిధానం ।
    త్వమవ్యయః శాశ్వత-ధర్మ-గోప్తా
    సనాతనస్త్వం పురుషో మతో మే ॥

19: |-
    అనాది-మధ్యాంతమనంత-వీర్యం
    అనంత-బాహుం శశి-సూర్య-నేత్రం ।
    పశ్యామి త్వా దీప్త-హుతాశ-వక్త్రం
    స్వ-తేజసా విశ్వమిదం తపంతం ॥

20: |-
    ద్యావా-పృథివ్యోరిదమంతరం హి
    వ్యాప్తం త్వయైకేన దిశశ్చ సర్వాః ।
    దృష్ట్వాఽద్భుతం రూపముగ్రం తవేదం
    లోక-త్రయం ప్రవ్యథితం మహాత్మన్ ॥

21: |-
    అమీ హి త్వాసుర-సంఘా విశంతి
    కేచిద్ భీతాః ప్రాంజలయో గృణంతి ।
    స్వస్తీత్యుక్త్వా మహర్షి-సిద్ధ-సంఘాః
    స్తువంతి త్వా స్తుతిభిః పుష్కళాభిః ॥

22: |-
    రుద్రాదిత్యా వసవో యే చ సాధ్యాః
    విశ్వేఽశ్వినౌ మరుతశ్చోష్మపాశ్చ ।
    గంధర్వ-యక్షాసుర-సిద్ధ-సంఘాః
    వీక్షంతే త్వా విస్మితాశ్చైవ సర్వే ॥

23: |-
    రూపం మహత్తే బహు-వక్త్ర-నేత్రం
    మహా-బాహో బహు-బాహూరు-పాదం ।
    బహూదరం బహు-దంష్ట్రా-కరాళం
    దృష్ట్వా లోకాః ప్ర-వ్యథితాస్తథాఽహం ॥

24: |-
    నభః-స్పృశం దీప్తమనేక-వర్ణం
    వ్యాత్తాననం దీప్త-విశాల-నేత్రం ।
    దృష్ట్వాహి త్వా ప్ర-వ్యథితాంతరాత్మా
    ధృతిం న విందామి శమం చ విష్ణో ॥

25: |-
    దంష్ట్రా-కరాళాని చ తే ముఖాని
    దృష్ట్వైవ కాలానల-సన్నిభాని ।
    దిశో న జానే న లభే చ శర్మ
    ప్రసీద దేవేశ జగన్నివాస ॥

26: |-
    అమీ చ త్వా ధృతరాష్ట్రస్య పుత్రాః
    సర్వే సహైవావని-పాల-సంఘైః ।
    భీష్మో ద్రోణః సూత-పుత్రస్తథాఽసౌ
    సహాస్మదీయైరపి యోధ-ముఖ్యైః ॥

27: |-
    వక్త్రాణి తే త్వరమాణా విశంతి
    దంష్ట్రా-కరాళాని భయానకాని ।
    కేచిద్ విలగ్నా దశనాంతరేషు
    సందృశ్యంతే చూర్ణితైరుత్తమాంగైః ॥

28: |-
    యథా నదీనాం బహవోంఽబు-వేగాః
    సముద్రమేవాభి-ముఖా ద్రవంతి ।
    తథా తవామీ నర-లోక-వీరాః
    విశంతి వక్త్రాణ్యభి-విజ్వలంతి ॥

29: |-
    యథా ప్రదీప్తం జ్వలనం పతంగాః
    విశంతి నాశాయ సమృద్ధ-వేగాః ।
    తథైవ నాశాయ విశంతి లోకాః
    తవాపి వక్త్రాణి సమృద్ధ-వేగాః ॥

30: |-
    లేలిహ్యసే గ్రస-మానః సమంతాత్
    లోకాన్ సమగ్రాన్ వదనైర్జ్వలద్భిః ।
    తేజోభిరాపూర్య జగత్ సమగ్రం
    భాసస్తవోగ్రాః ప్రతపంతి విష్ణో ॥

31: |-
    ఆఖ్యాహి మే కో భవానుగ్ర-రూపో
    నమోఽస్తు తే దేవ-వర ప్రసీద ।
    విజ్ఞాతుమిచ్ఛామి భవంతమాద్యం
    న హి ప్రజానామి తవ ప్రవృత్తిం ॥

32: |-
    కాలోఽస్మి లోక-క్షయ-కృత్ ప్రవృద్ధో
    లోకాన్ సమాహర్తుమిహ ప్రవృత్తః ।
    ఋతేఽపి త్వా న భవిష్యంతి సర్వే
    యేఽవస్థితాః ప్రత్యనీకేషు యోధాః ॥

33: |-
    తస్మాత్ త్వముత్తిష్ఠ యశో లభస్వ
    జిత్వా శత్రూన్ భుంక్ష్వ రాజ్యం సమృద్ధం ।
    మయైవైతే నిహతాః పూర్వమేవ
    నిమిత్త-మాత్రం భవ సవ్య-సాచిన్ ॥

34: |-
    ద్రోణం చ భీష్మం చ జయద్రథం చ
    కర్ణం తథాఽన్యానపి యోధ-వీరాన్ ।
    మయా హతాంస్త్వం జహి మా వ్యథిష్ఠాః
    యుద్ధ్యస్వ జేతాసి రణే సపత్నాన్ ॥

35: |-
    ఏతచ్ఛ్రుత్వా వచనం కేశవస్య
    కృతాంజలిర్వేపమానః కిరీటీ ।
    నమస్కృత్వా భూయ ఏవాఽహ కృష్ణం
    సగద్గదం భీత-భీతః ప్రణమ్య ॥

36: |-
    స్థానే హృషీకేశ తవ ప్రకీర్త్యా
    జగత్ ప్రహృష్యత్యను-రజ్యతే చ ।
    రక్షాంసి భీతాని దిశో ద్రవంతి
    సర్వే నమస్యంతి చ సిద్ధ-సంఘాః ॥

37: |-
    కస్మాచ్చ తే న నమేరన్ మహాత్మన్
    గరీయసే బ్రహ్మణోఽప్యాది-కర్త్రే ।
    అనంత దేవేశ జగన్నివాస
    త్వమక్షరం సదసత్ తత్పరం యత్ ॥

38: |-
    త్వమాది-దేవః పురుషః పురాణః
    త్వమస్య విశ్వస్య పరం నిధానం ।
    వేత్తాఽసి వేద్యం చ పరం చ ధామ
    త్వయా తతం విశ్వమనంత-రూప ॥

39: |-
    వాయుర్యమోఽగ్నిర్వరుణః శశాంకః
    ప్రజాపతిస్త్వం ప్రపితామహశ్చ ।
    నమో నమస్తేఽస్తు సహస్ర-కృత్వః
    పునశ్చ భూయోఽపి నమో-నమస్తే ॥

40: |-
    నమః పురస్తాదథ పృష్ఠతస్తే
    నమోఽస్తు తే సర్వత ఏవ సర్వ ।
    అనంత-వీర్యామిత-విక్రమస్త్వం
    సర్వం సమాప్నోషి తతోఽసి సర్వః ॥

41: |-
    సఖేతి మత్వా ప్రసభం యదుక్తం
    హే కృష్ణ హే యాదవ హే సఖేతి ।
    అజానతా మహిమానం తవేదం
    మయా ప్రమాదాత్ ప్రణయేన వాఽపి ॥

42: |-
    యచ్చాప-హాసార్థమసత్కృతోఽసి
    విహార-శయ్యాసన-భోజనేషు ।
    ఏకోఽథవాఽప్యచ్యుత తత్ సమక్షం
    తత్ క్షామయే త్వామహమప్ర-మేయం ॥

43: |-
    పితాఽసి లోకస్య చరాచరస్య
    త్వమస్య పూజ్యశ్చ గురుర్గరీయాన్ ।
    న త్వత్ సమోఽస్త్యభ్యధికః కుతోఽన్యో
    లోక-త్రయేఽప్యప్రతిమ-ప్రభావ ॥

44: |-
    తస్మాత్ ప్రణమ్య ప్రణిధాయ కాయం
    ప్రసాదయే త్వామహమీశమీడ్యం ।
    పితేవ పుత్రస్య సఖేవ సఖ్యుః
    ప్రియః ప్రియాయార్హసి దేవ సోఢుం ॥

45: |-
    అదృష్ట-పూర్వం హృషితోఽస్మి దృష్ట్వా
    భయేన చ ప్రవ్యథితం మనో మే ।
    తదేవ మే దర్శయ దేవ రూపం
    ప్రసీద దేవేశ జగన్నివాస ॥

46: |-
    కిరీటినం గదినం చక్ర-హస్తం
    ఇచ్ఛామి త్వాం ద్రష్టుమహం తథైవ ।
    తేనైవ రూపేణ చతుర్భుజేన
    సహస్ర-బాహో భవ విశ్వ-మూర్తే ॥

47: |-
    మయా ప్రసన్నేన తవార్జునేదం
    రూపం పరం దర్శితమాత్మ-యోగాత్ ।
    తేజో-మయం విశ్వమనంతమాద్యం
    యన్మే త్వదన్యేన న దృష్ట-పూర్వం ॥

48: |-
    న వేద-యజ్ఞాధ్యయనైర్న దానైః
    న చ క్రియాభిర్న తపోభిరుగ్రైః ।
    ఏవం-రూపః శక్య అహం నృ-లోకే
    ద్రష్టుం త్వదన్యేన కురు-ప్రవీర ॥

49: |-
    మా తే వ్యథా మా చ విమూఢ-భావో
    దృష్ట్వారూపం ఘోరమీదృఙ్మమేదం 
    వ్యపేత-భీః ప్రీత-మనాః పునస్త్వం
    తదేవ మే రూపమిదం ప్రపశ్య ॥

50: |-
    ఇత్యర్జునం వాసుదేవస్తథోక్త్వా
    స్వకం రూపం దర్శయామాస భూయః ।
    ఆశ్వాసయామాస చ భీతమేనం
    భూత్వా పునః సౌమ్య-వపుర్మహాత్మా ॥

51: |-
    దృష్ట్వేదం మానుషం రూపం తవ సౌమ్యం జనార్దన ।
    ఇదానీమస్మి సం-వృత్తః స-చేతాః ప్రకృతిం గతః ॥

52: |-
    సు-దుర్దర్శమిదం రూపం దృష్ట-వానసి యన్మమ ।
    దేవా అప్యస్య రూపస్య నిత్యం దర్శన-కాంక్షిణః ॥

53: |-
    నాహం వేదైర్న తపసా న దానేన న చేజ్యయా ।
    శక్య ఏవం-విధో ద్రష్టుం దృష్ట-వానసి మాం యథా ॥

54: |-
    భక్త్యాత్వనన్యయా శక్య అహమేవం-విధోఽర్జున ।
    జ్ఞాతుం ద్రష్టుం చ తత్త్వేన ప్రవేష్టుం చ పరం తప ॥

55: |-
    మత్కర్మ-కృన్మత్పరమో మద్భక్తః సంగ-వర్జితః ।
    నిర్వైరః సర్వ-భూతేషు యః స మామేతి పాండవ ॥

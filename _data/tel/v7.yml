1: |-
    మయ్యాసక్త-మనాః పార్థ యోగం యుంజన్ మదాశ్రయః ।
    అసంశయం సమగ్రం మాం యథా జ్ఞాస్యసి తచ్ఛృణు ॥

2: |-
    జ్ఞానం తేఽహం స-విజ్ఞానం ఇదం వక్ష్యామ్యశేషతః ।
    యజాజ్ఞత్వా నేహ భూయోఽన్యత్ జ్ఞాతవ్యమవ-శిష్యతే ॥

3: |-
    మనుష్యాణాం సహస్రేషు కశ్చిద్ యతతి సిద్ధయే ।
    యతతామపి సిద్ధానాం కశ్చిన్మాం వేత్తి తత్త్వతః ॥

4: |-
    భూమిరాపోఽనలో వాయుః ఖం మనో బుద్ధిరేవ చ ।
    అహం-కార ఇతీయం మే భిన్నా ప్రకృతిరష్ట-ధా ॥

5: |-
    అపరేయమితస్త్వన్యాం ప్రకృతిం విద్ధి మే పరాం ।
    జీవ-భూతాం మహాబాహో యయేదం ధార్యతే జగత్ ॥

6: |-
    ఏతద్యోనీని భూతాని సర్వాణీత్యుప-ధారయ ।
    అహం కృత్స్నస్య జగతః ప్రభవః ప్రళయస్తథా ॥

7: |-
    మత్తః పర-తరం నాన్యత్ కించిదస్తి ధనం-జయ ।
    మయి సర్వమిదం ప్రోతం సూత్రే మణి-గణా ఇవ ॥

8: |-
    రసోఽహమప్సు కౌంతేయ ప్రభాఽస్మి శశి-సూర్యయోః ।
    ప్రణవః సర్వ-వేదేషు శబ్దః ఖే పౌరుషం నృషు ॥

9: |-
    పుణ్యో గంధః పృథివ్యాం చ తేజశ్చాస్మి విభావసౌ ।
    జీవనం సర్వ-భూతేషు తపశ్చాస్మి తపస్విషు ॥

10: |-
    బీజం మాం సర్వ-భూతానాం విద్ధి పార్థ సనాతనం ।
    బుద్ధిర్బుద్ధి-మతామస్మి తేజస్తేజస్వినామహం ॥

11: |-
    బలం బల-వతాం చాహం కామ-రాగ-వివర్జితం ।
    ధర్మావిరుద్ధో భూతేషు కామోఽస్మి భరతర్షభ ॥

12: |-
    యే చైవ సాత్త్వికా భావాః రాజసాస్తామసాశ్చ యే ।
    మత్త ఏవేతి తాన్ విద్ధి న త్వహం తేషు తే మయి ॥

13: |-
    త్రిభిర్గుణ-మయైర్భావైః ఏభిః సర్వమిదం జగత్ ।
    మోహితం నాభి-జానాతి మామేభ్యః పరమవ్యయం ॥

14: |-
    దైవీ హ్యేషా గుణ-మయీ మమ మాయా దురత్యయా ।
    మామేవ యే ప్ర-పద్యంతే మాయామేతాం తరంతి తే ॥

15: |-
    న మాం దుష్కృతినో మూఢాః ప్ర-పద్యంతే నరాధమాః ।
    మాయయాఽప-హృత-జ్ఞానాః ఆసురం భావమాశ్రితాః ॥

16: |-
    చతుర్విధా భజంతే మాం జనాః సు-కృతినోఽర్జున ।
    ఆర్తో జిజ్ఞాసురర్థార్థీ జ్ఞానీ చ భరతర్షభ ॥

17: |-
    తేషాం జ్ఞానీ నిత్య-యుక్తః ఏక-భక్తిర్విశిష్యతే ।
    ప్రియో హి జ్ఞానినోఽత్యర్థం అహం స చ మమ ప్రియః ॥

18: |-
    ఉదారాః సర్వ ఏవైతే జ్ఞానీ త్వాత్మైవ మే మతం ।
    ఆస్థితః స హి యుక్తాత్మా మామేవానుత్తమాం గతిం ॥

19: |-
    బహూనాం జన్మనామంతే జ్ఞాన-వాన్ మాం ప్ర-పద్యతే ।
    వాసు-దేవః సర్వమితి స మహాత్మా సు-దుర్లభః ॥

20: |-
    కామైస్తైస్తైర్హృత-జ్ఞానాః ప్ర-పద్యంతేఽన్య-దేవతాః ।
    తం-తం నియమమాస్థాయ ప్రకృత్యా నియతాః స్వయా ॥

21: |-
    యో-యో యాం-యాం తనుం భక్తః శ్రద్ధయాఽర్చితుమిచ్ఛతి ।
    తస్య-తస్యాచలాం శ్రద్ధాం తామేవ వి-దధామ్యహం ॥

22: |-
    స తయా శ్రద్ధయా యుక్తః తస్యాఽరాధనమీహతే ।
    లభతే చ తతః కామాన్ మయైవ విహితాన్ హితాన్ ॥

23: |-
    అంత-వత్తు ఫలం తేషాం తద్ భవత్యల్ప-చేతసాం ।
    దేవాన్ దేవ-యజో యాంతి మద్భక్తా యాంతి మామపి ॥

24: |-
    అవ్యక్తం వ్యక్తిమాపన్నం మన్యంతే మామబుద్ధయః ।
    పరం భావమజానంతో మమావ్యయమనుత్తమం ॥

25: |-
    నాహం ప్రకాశః సర్వస్య యోగ-మాయా-సమావృతః ।
    మూఢోఽయం నాభి-జానాతి లోకో మామజమవ్యయం ॥

26: |-
    వేదాహం సమతీతాని వర్తమానాని చార్జున ।
    భవిష్యాణి చ భూతాని మాం తు వేద న కశ్చన ॥

27: |-
    ఇచ్ఛా-ద్వేష-సముత్థేన ద్వంద్వ-మోహేన భారత ।
    సర్వ-భూతాని సమ్మోహం సర్గే యాంతి పరం తప ॥

28: |-
    యేషాం త్వంత-గతం పాపం జనానాం పుణ్య-కర్మణాం ।
    తే ద్వంద్వ-మోహ-నిర్ముక్తాః భజంతే మాం దృఢ-వ్రతాః ॥

29: |-
    జరా-మరణ-మోక్షాయ మామాశ్రిత్య యతంతి యే ।
    తే బ్రహ్మ తద్ విదుః కృత్స్నం అధ్యాత్మం కర్మ చాఖిలం ॥

30: |-
    సాధి-భూతాధి-దైవం మాం సాధి-యజ్ఞం చ యే విదుః ।
    ప్రయాణ-కాలేఽపి చ మాం తే విదుర్యుక్త-చేతసః ॥

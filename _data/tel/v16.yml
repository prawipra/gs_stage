1: |-
    అభయం సత్త్వ-సంశుద్ధిః జ్ఞాన-యోగ-వ్యవస్థితిః ।
    దానం దమశ్చ యజ్ఞశ్చ స్వాధ్యాయస్తప ఆర్జవం ॥

2: |-
    అహింసా సత్యమక్రోధః త్యాగః శాంతిరపైశునం ।
    దయా భూతేష్వలోలుత్వం మార్దవం హ్రీరచాపలం ॥

3: |-
    తేజః క్షమా ధృతిః శౌచం అద్రోహో నాతి-మానితా ।
    భవంతి సంపదం దైవీం అభి-జాతస్య భారత ॥

4: |-
    డంభో దర్పోఽభి-మానశ్చ క్రోధః పారుష్యమేవ చ ।
    అజ్ఞానం చాభి-జాతస్య పార్థ సంపదమాసురీం ॥

5: |-
    దైవీ సంపద్ విమోక్షాయ నిబంధాయాఽసురీ మతా ।
    మా శుచః సంపదం దైవీం అభి-జాతోఽసి పాండవ ॥

6: |-
    ద్వౌ భూత-సర్గౌ లోకేఽస్మిన్ దైవ ఆసుర ఏవ చ ।
    దైవో విస్తరశః ప్రోక్తః ఆసురం పార్థ మే శృణు ॥

7: |-
    ప్రవృత్తిం చ నివృత్తిం చ జనా న విదురాసురాః ।
    న శౌచం నాపి చాఽచారో న సత్యం తేషు విద్యతే ॥

8: |-
    అసత్యమప్రతిష్ఠం తే జగదాహురనీశ్వరం ।
    అపరస్పర-సంభూతం కిమన్యత్ కామ-హైతుకం ॥

9: |-
    ఏతాం దృష్టిమవష్టభ్య నష్టాత్మానోఽల్ప-బుద్ధయః ।
    ప్రభవంత్యుగ్ర-కర్మాణః క్షయాయ జగతోఽహితాః ॥

10: |-
    కామమాశ్రిత్య దుష్పూరం డంభ-మాన-మదాన్వితాః ।
    మోహాద్ గృహీత్వాఽసద్-గ్రాహాన్ ప్రవర్తంతేఽశుచి-వ్రతాః ॥

11: |-
    చింతామపరి-మేయాం చ ప్రళయాంతాముపాశ్రితాః ।
    కామోప-భోగ-పరమాః ఏతావదితి నిశ్చితాః ॥

12: |-
    ఆశా-పాశ-శతైర్బద్ధాః కామ-క్రోధ-పరాయణాః ।
    ఈహంతే కామ-భోగార్థం అన్యాయేనార్థ-సంచయాన్ ॥

13: |-
    ఇదమద్య మయా లబ్ధం ఇమం ప్రాప్స్యే మనో-రథం ।
    ఇదమస్తీదమపి మే భవిష్యతి పునర్ధనం ॥

14: |-
    అసౌ మయా హతః శత్రుః హనిష్యే చాపరానపి ।
    ఈశ్వరోఽహమహం భోగీ సిద్ధోఽహం బల-వాన్ సుఖీ ॥

15: |-
    ఆఢ్యోఽభిజన-వానస్మి కోఽన్యోఽస్తి సదృశో మయా ।
    యక్ష్యే దాస్యామి మోదిష్య ఇత్యజ్ఞాన-విమోహితాః ॥

16: |-
    అనేక-చిత్త-విభ్రాంతా మోహ-జాల-సమావృతాః ।
    ప్రసక్తాః కామ-భోగేషు పతంతి నరకేఽశుచౌ ॥

17: |-
    ఆత్మ-సంభావితాః స్తబ్ధాః ధన-మాన-మదాన్వితాః ।
    యజంతే నామ యజ్ఞైస్తే డంభేనావిధి-పూర్వకం ॥

18: |-
    అహం-కారం బలం దర్పం కామం క్రోధం చ సంశ్రితాః ।
    మామాత్మ-పర-దేహేషు ప్రద్విషంతోఽభ్యసూయకాః ॥

19: |-
    తానహం ద్విషతః క్రూరాన్ సం-సారేషు నరాధమాన్ ।
    క్షిపామ్యజస్రమశుభాన్ ఆసురీష్వేవ యోనిషు ॥

20: |-
    ఆసురీం యోనిమాపన్నా మూఢా జన్మని-జన్మని ।
    మామప్రాప్యైవ కౌంతేయ తతో యాంత్యధమాం గతిం ॥

21: |-
    త్రి-విధం నరకస్యేదం ద్వారం నాశనమాత్మనః ।
    కామః క్రోధస్తథా లోభః తస్మాదేతత్ త్రయం త్యజేత్ ॥

22: |-
    ఏతైర్విముక్తః కౌంతేయ తమో-ద్వారైస్త్రిభిర్నరః ।
    ఆచరత్యాత్మనః శ్రేయః తతో యాతి పరాం గతిం ॥

23: |-
    యః శాస్త్ర-విధిముత్సృజ్య వర్తతే కామ-కారతః ।
    న స సిద్ధిమవాప్నోతి న సుఖం న పరాం గతిం ॥

24: |-
    తస్మాచ్ఛాస్త్రం ప్రమాణం తే కార్యాకార్య-వ్యవస్థితౌ ।
    జ్ఞాత్వా శాస్త్ర-విధానోక్తం కర్మ కర్తుమిహార్హసి ॥

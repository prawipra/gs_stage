1: |-
    భూయ ఏవ మహా-బాహో శృణు మే పరమం వచః ।
    యత్ తేఽహం ప్రీయమాణాయ వక్ష్యామి హిత-కామ్యయా ॥

2: |-
    న మే విదుః సుర-గణాః ప్రభవం న మహర్షయః ।
    అహమాదిర్హి దేవానాం మహర్షీణాం చ సర్వశః ॥

3: |-
    యో మామజమనాదిం చ వేత్తి లోక-మహేశ్వరం ।
    అసమ్మూఢః స మర్త్యేషు సర్వ-పాపైః ప్రముచ్యతే ॥

4: |-
    బుద్ధిర్జ్ఞానమసమ్మోహః క్షమా సత్యం దమః శమః ।
    సుఖం దుఃఖం భవోఽభావో భయం చాభయమేవ చ ॥

5: |-
    అహింసా సమతా తుష్టిః తపో దానం యశోఽయశః ।
    భవంతి భావా భూతానాం మత్త ఏవ పృథగ్విధాః ॥

6: |-
    మహర్షయః సప్త పూర్వే చత్వారో మనవస్తథా ।
    మద్భావా మానసా జాతాః యేషాం లోక ఇమాః ప్రజాః ॥

7: |-
    ఏతాం విభూతిం యోగం చ మమ యో వేత్తి తత్త్వతః ।
    సోఽవి-కంపేన యోగేన యుజ్యతే నాత్ర సంశయః ॥

8: |-
    అహం సర్వస్య ప్రభవో మత్తః సర్వం ప్రవర్తతే ।
    ఇతి మత్వా భజంతే మాం బుధా భావ-సమన్వితాః ॥

9: |-
    మచ్చిత్తా మద్గత-ప్రాణాః బోధయంతః పరస్పరం ।
    కథయంతశ్చ మాం నిత్యం తుష్యంతి చ రమంతి చ ॥

10: |-
    తేషాం సతత-యుక్తానాం భజతాం ప్రీతి-పూర్వకం ।
    దదామి బుద్ధి-యోగం తం యేన మాముపయాంతి తే ॥

11: |-
    తేషామేవాను-కంపార్థం అహమజ్ఞాన-జం తమః ।
    నాశయామ్యాత్మ-భావస్థో జ్ఞాన-దీపేన భాస్వతా ॥

12: |-
    పరం బ్రహ్మ పరం ధామ పవిత్రం పరమం భవాన్ ।
    పురుషం శాశ్వతం దివ్యం ఆది-దేవమజం విభుం ॥

13: |-
    ఆహుస్త్వామృషయః సర్వే దేవర్షిర్నారదస్తథా ।
    అసితో దేవలో వ్యాసః స్వయం చైవ బ్రవీషి మే ॥

14: |-
    సర్వమేతదృతం మన్యే యన్మాం వదసి కేశవ ।
    నహి తే భగవన్ వ్యక్తిం విదుర్దేవా న దానవాః ॥

15: |-
    స్వయమేవాత్మనాఽఽత్మానం వేత్థ త్వం పురుషోత్తమ ।
    భూత-భావన భూతేశ దేవ-దేవ జగత్పతే ॥

16: |-
    వక్తుమర్హస్యశేషేణ దివ్యా హ్యాత్మ-విభూతయః ।
    యాభిర్విభూతిభిర్లోకాన్ ఇమాంస్త్వం వ్యాప్య తిష్ఠసి ॥

17: |-
    కథం విద్యామహం యోగిన్ త్వాం సదా పరి-చింతయన్ ।
    కేషు-కేషు చ భావేషు చింత్యోఽసి భగవన్ మయా ॥

18: |-
    విస్తరేణాత్మనో యోగం విభూతిం చ జనార్దన ।
    భూయః కథయ తృప్తిర్హి శృణ్వతో నాస్తి మేఽమృతం ॥

19: |-
    హంత తే కథయిష్యామి దివ్యా హ్యాత్మ-విభూతయః ।
    ప్రాధాన్యతః కురు-శ్రేష్ఠ నాస్త్యంతో విస్తరస్య మే ॥

20: |-
    అహమాత్మా గుడాకేశ సర్వ-భూతాశయ-స్థితః ।
    అహమాదిశ్చ మధ్యం చ భూతానామంత ఏవ చ ॥

21: |-
    ఆదిత్యానామహం విష్ణుః జ్యోతిషాం రవిరంశుమాన్ ।
    మరీచిర్మరుతామస్మి నక్షత్రాణామహం శశీ ॥

22: |-
    వేదానాం సామ-వేదోఽస్మి దేవానామస్మి వాసవః ।
    ఇంద్రియాణాం మనశ్చాస్మి భూతానామస్మి చేతనా ॥

23: |-
    రుద్రాణాం శంకరశ్చాస్మి విత్తేశో యక్ష-రక్షసాం ।
    వసూనాం పావకశ్చాస్మి మేరుః శిఖరిణామహం ॥

24: |-
    పురోధసాం చ ముఖ్యం మాం విద్ధి పార్థ బృహస్పతిం ।
    సేనానీనామహం స్కందః సరసామస్మి సాగరః ॥

25: |-
    మహర్షీణాం భృగురహం గిరామస్మ్యైకమక్షరం ।
    యజ్ఞానాం జప-యజ్ఞోఽస్మి స్థావరాణాం హిమాలయః ॥

26: |-
    అశ్వత్థః సర్వ-వృక్షాణాం దేవర్షీణాం చ నారదః ।
    గంధర్వాణాం చిత్ర-రథః సిద్ధానాం కపిలో మునిః ॥

27: |-
    ఉచ్చైఃశ్రవసమశ్వానాం విద్ధి మామమృతోద్భవం ।
    ఐరావతం గజేంద్రాణాం నరాణాం చ నరాధిపం ॥

28: |-
    ఆయుధానామహం వజ్రం ధేనూనామస్మి కామ-ధుక్ ।
    ప్రజనశ్చాస్మి కందర్పః సర్పాణామస్మి వాసుకిః ॥

29: |-
    అనంతశ్చాస్మి నాగానాం వరుణో యాదసామహం ।
    పితౄణామర్యమా చాస్మి యమః సంయమతామహం ॥

30: |-
    ప్రహ్లాదశ్చాస్మి దైత్యానాం కాలః కలయతామహం ।
    మృగాణాం చ మృగేంద్రోఽహం వైనతేయశ్చ పక్షిణాం ॥

31: |-
    పవనః పవతామస్మి రామః శస్త్ర-భృతామహం ।
    ఝషాణాం మకరశ్చాస్మి స్రోతసామస్మి జాహ్నవీ ॥

32: |-
    సర్గాణామాదిరంతశ్చ మధ్యం చైవాహమర్జున ।
    అధ్యాత్మ-విద్యా విద్యానాం వాదః ప్రవదతామహం ॥

33: |-
    అక్షరాణామకారోఽస్మి ద్వంద్వః సామాసికస్య చ ।
    అహమేవాక్షయః కాలో ధాతాఽహం విశ్వతో-ముఖః ॥

34: |-
    మృత్యుః సర్వ-హరశ్చాహం ఉద్భవశ్చ భవిష్యతాం ।
    కీర్తిః శ్రీర్వాక్ చ నారీణాం స్మృతిర్మేధా ధృతిః క్షమా ॥

35: |-
    బృహత్సామ తథా సామ్నాం గాయత్త్రీ ఛందసామహం ।
    మాసానాం మార్గ-శీర్షోఽహం ఋతూనాం కుసుమాకరః ॥

36: |-
    ద్యూతం ఛలయతామస్మి తేజస్తేజస్వినామహం ।
    జయోఽస్మి వ్యవసాయోఽస్మి సత్వం సత్త్వ-వతామహం ॥

37: |-
    వృష్ణీనాం వాసు-దేవోఽస్మి పాండవానాం ధనం-జయః ।
    మునీనామప్యహం వ్యాసః కవీనాముశనా కవిః ॥

38: |-
    దండో దమయతామస్మి నీతిరస్మి జిగీషతాం ।
    మౌనం చైవాస్మి గుహ్యానాం జ్ఞానం జ్ఞాన-వతామహం ॥

39: |-
    యచ్చాపి సర్వ-భూతానాం బీజం తదహమర్జున ।
    న తదస్తి వినా యత్ స్యాత్ మయా భూతం చరాచరం ॥

40: |-
    నాంతోఽస్తి మమ దివ్యానాం విభూతీనాం పరం తప ।
    ఏష తూద్దేశతః ప్రోక్తో విభూతేర్విస్తరో మయా ॥

41: |-
    యద్యద్ విభూతి-మత్ సత్వం శ్రీ-మదూర్జితమేవ వా ।
    తత్తదేవావ-గచ్ఛ త్వం మమ తేజోఽంశ-సంభవం ॥

42: |-
    అథవా బహునైతేన కిం జ్ఞాతేన తవార్జున ।
    విష్టభ్యాహమిదం కృత్స్నం ఏకాంశేన స్థితో జగత్ ॥

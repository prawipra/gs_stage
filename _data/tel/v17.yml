1: |-
    యే శాస్త్ర-విధిముత్సృజ్య యజంతే శ్రద్ధయాఽన్వితాః ।
    తేషాం నిష్ఠా తు కా కృష్ణ సత్త్వమాహో రజస్తమః ॥

2: |-
    త్రి-విధా భవతి శ్రద్ధా దేహినాం సా స్వ-భావ-జా ।
    సాత్త్వికీ రాజసీ చైవ తామసీ చేతి తాం శృణు ॥

3: |-
    సత్వానురూపా సర్వస్య శ్రద్ధా భవతి భారత ।
    శ్రద్ధా-మయోఽయం పురుషో యో యచ్ఛ్రద్ధః స ఏవ సః ॥

4: |-
    యజంతే సాత్త్వికా దేవాన్ యక్ష-రక్షాంసి రాజసాః ।
    ప్రేతాన్ భూత-గణాంశ్చాన్యే యజంతే తామసా జనాః ॥

5: |-
    అశాస్త్ర-విహితం ఘోరం తప్యంతే యే తపో జనాః ।
    డంభాహంకార-సంయుక్తాః కామ-రాగ-బలాన్వితాః ॥

6: |-
    కర్శయంతః శరీర-స్థం భూత-గ్రామమచేతసః ।
    మాం చైవాంతః-శరీర-స్థం తాన్ విధ్యాసుర-నిశ్చయాన్ ॥

7: |-
    ఆహారస్త్వపి సర్వస్య త్రి-విధో భవతి ప్రియః ।
    యజ్ఞస్తపస్తథా దానం తేషాం భేదమిమం శృణు ॥

8: |-
    ఆయుస్సత్త్వ-బలారోగ్య-సుఖ-ప్రీతి-వివర్ధనాః ।
    రస్యాః స్నిగ్ధాః స్థిరా హృద్యాః ఆహారాః సాత్త్విక-ప్రియాః ॥

9: |-
    కట్వమ్ల-లవణాత్యుష్ణ-తీక్ష్ణ-రూక్ష-విదాహినః ।
    ఆహారా రాజసస్యేష్టాః దుఃఖ-శోకామయ-ప్రదాః ॥

10: |-
    యాత-యామం గత-రసం పూతి పర్యుషితం చ యత్ ।
    ఉచ్ఛిష్టమపి చామేధ్యం భోజనం తామస-ప్రియం ॥

11: |-
    అఫలాకాంక్షిభిర్యజ్ఞో విధి-దృష్టో య ఇజ్యతే ।
    యష్టవ్యమేవేతి మనః సమాధాయ స సాత్త్వికః ॥

12: |-
    అభి-సంధాయ తు ఫలం డంభార్థమపి చైవ యత్ ।
    ఇజ్యతే భరత-శ్రేష్ఠ తం యజ్ఞం విద్ధి రాజసం ॥

13: |-
    విధి-హీనమసృష్టాన్నం మంత్ర-హీనమదక్షిణం ।
    శ్రద్ధా-విరహితం యజ్ఞం తామసం పరి-చక్షతే ॥

14: |-
    దేవ-ద్విజ-గురు-ప్రాజ్ఞ-పూజనం శౌచమార్జవం ।
    బ్రహ్మ-చర్యమహింసా చ శారీరం తప ఉచ్యతే ॥

15: |-
    అనుద్వేగ-కరం వాక్యం సత్యం ప్రియ-హితం చ యత్ ।
    స్వాధ్యాయాభ్యసనం చైవ వాఙ్మయం తప ఉచ్యతే ॥

16: |-
    మనః-ప్రసాదః సౌమ్యత్వం మౌనమాత్మ-వినిగ్రహః ।
    భావ-సంశుద్ధిరిత్యేతత్ తపో మానసముచ్యతే ॥

17: |-
    శ్రద్ధయా పరయా తప్తం తపస్తత్ త్రి-విధం నరైః ।
    అఫలాకాంక్షిభిర్యుక్తైః సాత్త్వికం పరి-చక్షతే ॥

18: |-
    సత్కార-మాన-పూజార్థం తపో డంభేన చైవ యత్ ।
    క్రియతే తదిహ ప్రోక్తం రాజసం చలమధ్రువం ॥

19: |-
    మూఢ-గ్రాహేణాఽత్మనో యత్ పీడయా క్రియతే తపః ।
    పరస్యోత్సాదనార్థం వా తత్తామసముదాహృతం ॥

20: |-
    దాతవ్యమితి యద్దానం దీయతేఽనుప-కారిణే ।
    దేశే కాలే చ పాత్రే చ తద్దానం సాత్త్వికం స్మృతం ॥

21: |-
    యత్తు ప్రత్యుప-కారార్థం ఫలముద్దిశ్య వా పునః ।
    దీయతే చ పరి-క్లిష్టం తద్ రాజసముదాహృతం ॥

22: |-
    అదేశ-కాలే యద్దానం అపాత్రేభ్యశ్చ దీయతే ।
    అసత్కృతమవ-జ్ఞాతం తత్తామసముదాహృతం ॥

23: |-
    ఓం తత్ సదితి నిర్దేశో బ్రహ్మణస్త్రి-విధః స్మృతః ।
    బ్రాహ్మణాస్తేన వేదాశ్చ యజ్ఞాశ్చ విహితాః పురా ॥

24: |-
    తస్మాదోమిత్యుదాహృత్య యజ్ఞ-దాన-తపః-క్రియాః ।
    ప్రవర్తంతే విధానోక్తాః సతతం బ్రహ్మ-వాదినాం ॥

25: |-
    తదిత్యనభి-సంధాయ ఫలం యజ్ఞ-తపః-క్రియాః ।
    దాన-క్రియాశ్చ వివిధాః క్రియంతే మోక్ష-కాంక్షిభిః ॥

26: |-
    సద్భావే సాధు-భావే చ సదిత్యేతత్ ప్రయుజ్యతే ।
    ప్రశస్తే కర్మణి తథా సచ్ఛబ్దః పార్థ యుజ్యతే ॥

27: |-
    యజ్ఞే తపసి దానే చ స్థితిః సదితి చోచ్యతే ।
    కర్మ చైవ తదర్థీయం సదిత్యేవాభి-ధీయతే ॥

28: |-
    అశ్రద్ధయా హుతం దత్తం తపస్తప్తం కృతం చ యత్ ।
    అసదిత్యుచ్యతే పార్థ న చ తత్ ప్రేత్య నో ఇహ ॥

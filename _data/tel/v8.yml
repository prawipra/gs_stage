1: |-
    కిం తద్ బ్రహ్మ కిమధ్యాత్మం కిం కర్మ పురుషోత్తమ ।
    అధి-భూతం చ కిం ప్రోక్తం అధి-దైవం కిముచ్యతే ॥

2: |-
    అధి-యజ్ఞః కథం కోఽత్ర దేహేఽస్మిన్ మధు-సూదన ।
    ప్రయాణ-కాలే చ కథం జ్ఞేయోఽసి నియతాత్మభిః ॥

3: |-
    అక్షరం బ్రహ్మ పరమం స్వభావోఽధ్యాత్మముచ్యతే ।
    భూత-భావోద్భవ-కరో విసర్గః కర్మ-సంజ్ఞితః ॥

4: |-
    అధి-భూతం క్షరో భావః పురుషశ్చాధి-దైవతం ।
    అధి-యజ్ఞోఽహమేవాత్ర దేహే దేహ-భృతాం వర ॥

5: |-
    అంత-కాలే చ మామేవ స్మరన్ ముక్త్వా కళేబరం ।
    యః ప్రయాతి స మద్భావం యాతి నాస్త్యత్ర సంశయః ॥

6: |-
    యం-యం వాఽపి స్మరన్ భావం త్యజత్యంతే కళేబరం ।
    తం-తమేవైతి కౌంతేయ సదా తద్భావ-భావితః ॥

7: |-
    తస్మాత్ సర్వేషు కాలేషు మామనుస్మర యుధ్య చ ।
    మయ్యర్పిత-మనో-బుద్ధిః మామేవైష్యస్యసంశయం ॥

8: |-
    అభ్యాస-యోగ-యుక్తేన చేతసాఽనన్య-గామినా ।
    పరమం పురుషం దివ్యం యాతి పార్థాను-చింతయన్ ॥

9: |-
    కవిం పురాణమను-శాసితారం
    అణోరణీయాంసమను-స్మరేద్ యః ।
    సర్వస్య ధాతారమచింత్య-రూపం
    ఆదిత్య-వర్ణం తమసః పరస్తాత్ ॥

10: |-
    ప్రయాణ-కాలే మనసాఽచలేన
    భక్త్యాయుక్తో యోగ-బలేన చైవ ।
    భ్రువోర్మధ్యే ప్రాణమావేశ్య సమ్యక్
    స తం పరం పురుషముపైతి దివ్యం ॥

11: |-
    యదక్షరం వేద-విదో వదంతి 
    విశంతి యద్ యతయో వీత-రాగాః ।
    యదిచ్ఛంతో బ్రహ్మ-చర్యం చరంతి 
    తత్ తే పదం సంగ్రహేణ ప్రవక్ష్యే ॥

12: |-
    సర్వ-ద్వారాణి సంయమ్య మనో హృది నిరుద్ధ్య చ ।
    మూర్ధ్న్యార్యధాయాఽత్మనః ప్రాణం ఆస్థితో యోగ-ధారణాం ॥

13: |-
    ఓమిత్యేకాక్షరం బ్రహ్మ వ్యాహరన్ మామను-స్మరన్ ।
    యః ప్రయాతి త్యజన్ దేహం స యాతి పరమాం గతిం ॥

14: |-
    అనన్య-చేతాః సతతం యో మాం స్మరతి నిత్యశః ।
    తస్యాహం సులభః పార్థ నిత్య-యుక్తస్య యోగినః ॥

15: |-
    మాముపేత్య పునర్జన్మ దుఃఖాలయమశాశ్వతం ।
    నాఽప్నువంతి మహాత్మానః సంసిద్ధిం పరమాం గతాః ॥

16: |-
    ఆ బ్రహ్మ-భువనాల్లోకాః పునరావర్తినోఽర్జున ।
    మాముపేత్య తు కౌంతేయ పునర్జన్మ న విద్యతే ॥

17: |-
    సహస్ర-యుగ-పర్యంతం అహర్యద్ బ్రహ్మణో విదుః ।
    రాత్రిం యుగ-సహస్రాంతాం తేఽహోరాత్ర-విదో జనాః ॥

18: |-
    అవ్యక్తాద్ వ్యక్తయః సర్వాః ప్రభవంత్యహరాగమే ।
    రాత్ర్యాగమే ప్రలీయంతే తత్రైవావ్యక్త-సంజ్ఞకే ॥

19: |-
    భూత-గ్రామః స ఏవాయం భూత్వా-భూత్వా ప్రలీయతే ।
    రాత్ర్యాగమేఽవశః పార్థ ప్రభవత్యహరాగమే ॥

20: |-
    పరస్తస్మాత్తు భావోఽన్యోఽవ్యక్తో వ్యక్తాత్ సనాతనః ।
    యః స సర్వేషు భూతేషు నశ్యత్సు న వినశ్యతి ॥

21: |-
    అవ్యక్తోఽక్షర ఇత్యుక్తః తమాహుః పరమాం గతిం ।
    యం ప్రాప్య న నివర్తంతే తద్ ధామ పరమం మమ ॥

22: |-
    పురుషః స పరః పార్థ భక్త్యా లభ్యస్త్వనన్యయా ।
    యస్యాంతఃస్థాని భూతాని యేన సర్వమిదం తతం ॥

23: |-
    యత్ర కాలే త్వనావృత్తిం ఆవృత్తిం చైవ యోగినః ।
    ప్రయాతా యాంతి తం కాలం వక్ష్యామి భరతర్షభ ॥

24: |-
    అగ్నిర్జోతిరహః శుక్లః షణ్మాసా ఉత్తరాయణం ।
    తత్ర ప్రయాతా గచ్ఛంతి బ్రహ్మ బ్రహ్మ-విదో జనాః ॥

25: |-
    ధూమో రాత్రిస్తథా కృష్ణః షణ్మాసా దక్షిణాయనం ।
    తత్ర చాంద్రమసం జ్యోతిః యోగీ ప్రాప్య నివర్తతే ॥

26: |-
    శుక్ల-కృష్ణే గతీ హ్యేతే జగతః శాశ్వతే మతే ।
    ఏకయా యాత్యనావృత్తిం అన్యయాఽఽవర్తతే పునః ॥

27: |-
    నైతే సృతీ పార్థ జానన్ యోగీ ముహ్యతి కశ్చన ।
    తస్మాత్ సర్వేషు కాలేషు యోగ-యుక్తో భవార్జున ॥

28: |-
    వేదేషు యజ్ఞేషు తపస్సు చైవ 
    దానేషు యత్పుణ్య-ఫలం ప్రదిష్టం ।
    అత్యేతి తత్ సర్వమిదం విదిత్వా 
    యోగీ పరం స్థానముపైతి చాఽద్యం ॥
    
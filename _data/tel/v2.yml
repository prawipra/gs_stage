1: |-
    తం తథా కృపయాఽఽవిష్టం అశ్రు-పూర్ణాకులేక్షణం ।
    విషీదంతమిదం వాక్యం ఉవాచ మధు-సూదనః ॥

2: |-
    కుతస్త్వా కశ్మలమిదం విషమే సముపస్థితం ।
    అనార్య-జుష్టమస్వర్గ్యం అకీర్తి-కరమర్జున ॥

3: |-
    క్లైబ్యం మాస్మ గమః పార్థ నైతత్ త్వయ్యుప-పద్యతే ।
    క్షుద్రం హృదయ-దౌర్బల్యం త్యక్త్వోత్తిష్ఠ పరం తప ॥

4: |-
    కథం భీష్మమహం సంఖే ద్రోణం చ మధు-సూదన ।
    ఇషుభిః ప్రతి-యోత్స్యామి పూజార్హావరి-సూదన ॥

5: |-
    గురూనహత్వా హి మహాను-భావాన్
    శ్రేయో భోక్తుం భైక్ష్యమపీహ లోకే ।
    హత్వాఽర్థ-కామాంస్తు గురూనిహైవ
    భుంజీయ భోగాన్ రుధిర-ప్రదిగ్ధాన్ ॥

6: |-
    న చైతద్ విద్మః కతరన్నో గరీయో
    యద్వా జయేమ యది వా నో జయేయుః ।
    యానేవ హత్వా న జిజీవిషామః
    తేఽవ-స్థితాః ప్రముఖే ధార్తరాష్ట్రాః ॥

7: |-
    కార్పణ్య-దోషోపహత-స్వభావః
    పృచ్ఛామి త్వా ధర్మ-సమ్మూఢ-చేతాః ।
    యచ్ఛ్రేయః స్యాన్నిశ్చితం బ్రూహి తన్మే
    శిష్యస్తేఽహం శాధి మాం త్వాం ప్రపన్నం ॥

8: |-
    న హి ప్ర-పశ్యామి మమాప-నుద్యాత్
    యచ్ఛోకముచ్ఛోషణమింద్రియాణాం ।
    అవాప్య భూమావసపత్నమృద్ధం
    రాజ్యం సురాణామపి చాఽధిపత్యం ॥

9: |-
    ఏవముక్త్వా హృషీకేశం గుడాకేశః పరం-తపః ।
    న యోత్స్య ఇతి గోవిందం ఉక్త్వా తూష్ణీం బభూవ హ ॥

10: |-
    తమువాచ హృషీకేశః ప్రహసన్నివ భారత ।
    సేనయోరుభయోర్మధ్యే విషీదంతమిదం వచః ॥

11: |-
    అశోచ్యానన్వశోచస్త్వం ప్రజ్ఞావాదాంశ్చ భాషసే ।
    గతాసూనగతాసూంశ్చ నాను-శోచంతి పండితాః ॥

12: |-
    నత్వేవాహం జాతు నాఽసం న త్వం నేమే జనాధి-పాః ।
    న చైవ న భవిష్యామః సర్వే వయమతః పరం ॥

13: |-
    దేహినోఽస్మిన్ యథా దేహే కౌమారం యౌవనం జరా ।
    తథా దేహాంతర-ప్రాప్తిః ధీరస్తత్ర న ముహ్యతి ॥

14: |-
    మాత్రా-స్పర్శాస్తు కౌంతేయ శీతోష్ణ-సుఖ-దుఃఖ-దాః ।
    ఆగమాపాయినోఽనిత్యాః తాంస్తితిక్షస్వ భారత ॥

15: |-
    యం హి న వ్యథయంత్యేతే పురుషం పురుషర్షభ ।
    సమ-దుఃఖ-సుఖం ధీరం సోఽమృత-త్వాయ కల్పతే ॥

16: |-
    నాసతో విద్యతేఽభావో నాభావో విద్యతే సతః ।
    ఉభయోరపి దృష్టోంఽతః త్వనయోస్తత్త్వ-దర్శిభిః ॥

17: |-
    అవినాశి తు తద్ విద్ధి యేన సర్వమిదం తతం ।
    వినాశమవ్యయస్యాస్య న కశ్చిత్ కర్తుమర్హతి ॥

18: |-
    అంత-వంత ఇమే దేహాః నిత్యస్యోక్తాః శరీరిణః ।
    అనాశినోఽప్ర-మేయస్య తస్మాద్ యుధ్యస్వ భారత ॥

19: |-
    య ఏనం వేత్తి హంతారం యశ్చైనం మన్యతే హతం ।
    ఉభౌ తౌ న విజానీతో నాయం హంతి న హన్యతే ॥

20: |-
    న జాయతే మ్రియతే వా కదాచిత్
    నాయం భూత్వా భవితా వా న భూయః ।
    అజో నిత్యః శాశ్వతోఽయం పురాణో
    న హన్యతే హన్యమానే శరీరే ॥

21: |-
    వేదావి-నాశినం నిత్యం య ఏనమజమవ్యయం ।
    కథం స పురుషః పార్థ కం ఘాతయతి హంతి కం ॥

22: |-
    వాసాంసి జీర్ణాని యథా విహాయ
    నవాని గృహ్ణాతి నరోఽపరాణి ।
    తథా శరీరాణి విహాయ జీర్ణాని
    అన్యాని సంయాతి నవాని దేహీ ॥

23: |-
    నైనం ఛిందంతి శస్త్రాణి నైనం దహతి పావకః ।
    న చైనం క్లేదయంత్యాపో న శోషయతి మారుతః ॥

24: |-
    అచ్ఛేద్యోఽయమదాహ్యోఽయం అక్లేద్యోఽశోష్య ఏవ చ ।
    నిత్యః సర్వ-గత-స్థాణుః అచలోఽయం సనాతనః ॥

25: |-
    అవ్యక్తోఽయమచింత్యోఽయం అవికార్యోఽయముచ్యతే ।
    తస్మాదేవం విదిత్వైనం నాను-శోచితుమర్హసి ॥

26: |-
    అథ చైనం నిత్య-జాతం నిత్యం వా మన్యసే మృతం ।
    తథాఽపి త్వం మహాబాహో నైనం శోచితుమర్హసి ॥

27: |-
    జాతస్య హి ధ్రువో మృత్యుః ధ్రువం జన్మ మృతస్య చ ।
    తస్మాదపరి-హార్యేఽర్థే న త్వం శోచితుమర్హసి ॥

28: |-
    అవ్యక్తాదీని భూతాని వ్యక్త-మధ్యాని భారత ।
    అవ్యక్త-నిధనాన్యేవ తత్ర కా పరి-దేవనా ॥

29: |-
    ఆశ్చర్య-వత్ పశ్యతి కశ్చిదేనం
    ఆశ్చర్య-వద్ వదతి తథైవ చాన్యః ।
    ఆశ్చర్య-వచ్చెైనమన్యః శృణోతి
    శ్రుత్వాఽప్యేనం వేద నచైవ కశ్చిత్ ॥

30: |-
    దేహీ నిత్యమవధ్యోఽయం దేహే సర్వస్య భారత ।
    తస్మాత్ సర్వాణి భూతాని న త్వం శోచితుమర్హసి ॥

31: |-
    స్వ-ధర్మమపి చావేక్ష్య న వి-కంపితుమర్హసి ।
    ధర్మ్యాద్ధి యుద్ధాచ్ఛ్రేయోఽన్యత్ క్షత్రియస్య న విద్యతే ॥

32: |-
    యదృచ్ఛయా చోప-పన్నం స్వర్గ-ద్వారమపావృతం ।
    సుఖినః క్షత్రియాః పార్థ లభంతే యుద్ధమీదృశం ॥

33: |-
    అథ చేత్ త్వం ధర్మ్యమిమం సంగ్రామం న కరిష్యసి ।
    తతః స్వ-ధర్మం కీర్తిం చ హిత్వా పాపమవాప్స్యసి ॥

34: |-
    అకీర్తిం చాపి భూతాని కథయిష్యంతి తేఽవ్యయాం ।
    సం-భావితస్య చాకీర్తిః మరణాదతి-రిచ్యతే ॥

35: |-
    భయాద్ రణాదుప-రతం మంస్యంతే త్వాం మహారథాః ।
    యేషాం చ త్వం బహు-మతో భూత్వా యాస్యసి లాఘవం ॥

36: |-
    అవాచ్య-వాదాంశ్చ బహూన్ వదిష్యంతి తవాహితాః ।
    నిందంతస్తవ సామర్థ్యం తతో దుఃఖ-తరం ను కిం ॥

37: |-
    హతో వా ప్రాప్స్యసి స్వర్గం జిత్వా వా భోక్ష్యసే మహీం ।
    తస్మాదుత్తిష్ఠ కౌంతేయ యుద్ధాయ కృత-నిశ్చయః ॥

38: |-
    సుఖ-దుఃఖే సమే కృత్వా లాభాలాభౌ జయాజయౌ ।
    తతో యుద్ధాయ యుజ్యస్వ నైవం పాపమవాప్స్యసి ॥

39: |-
    ఏషా తేఽభి-హితా సాంఖ్యే బుద్ధిర్యోగే త్విమాం శృణు ।
    బుద్ధ్యాయుక్తో యయా పార్థ కర్మ-బంధం ప్రహాస్యసి ॥

40: |-
    నేహాభి-క్రమ-నాశోఽస్తి ప్రత్యవాయో న విద్యతే ।
    స్వల్పమప్యస్య ధర్మస్య త్రాయతే మహతో భయాత్ ॥

41: |-
    వ్యవసాయాత్మికా బుద్ధిః ఏకేహ కురు-నందన ।
    బహు-శాఖా హ్యనంతాశ్చ బుద్ధయోఽవ్యవసాయినాం ॥

42: |-
    యామిమాం పుష్పితాం వాచం ప్రవదంత్యవిపశ్చితః ।
    వేద-వాద-రతాః పార్థ నాన్యదస్తీతి వాదినః ॥

43: |-
    కామాత్మానః స్వర్గ-పరా జన్మ-కర్మ-ఫల-ప్రదాం ।
    క్రియా-విశేష-బహులాం భోగైశ్వర్య-గతిం ప్రతి ॥

44: |-
    భోగైశ్వర్య-ప్రసక్తానాం తయాఽప-హృత-చేతసాం ।
    వ్యవసాయాత్మికా బుద్ధిః సమాధౌ న విధీయతే ॥

45: |-
    త్రైగుణ్య-విషయా వేదాః నిస్త్రైగుణ్యో భవార్జున ।
    నిర్ద్వంద్వో నిత్య-సత్త్వ-స్థో నిర్యోగ-క్షేమ ఆత్మ-వాన్ ॥

46: |-
    యావానర్థ ఉద-పానే సర్వతః సం-ప్లుతోదకే ।
    తావాన్ సర్వేషు వేదేషు బ్రాహ్మణస్య వి-జానతః ॥

47: |-
    కర్మణ్యేవాధి-కారస్తే మా ఫలేషు కదాచన ।
    మా కర్మ-ఫల-హేతుర్భూః మా తే సంగోఽస్త్వకర్మణి ॥

48: |-
    యోగ-స్థః కురు కర్మాణి సంగం త్యక్త్వా ధనం-జయ ।
    సిద్ధ్యసిద్ధ్యోః సమో భూత్వా సమత్వం యోగ ఉచ్యతే ॥

49: |-
    దూరేణ హ్యవరం కర్మ బుద్ధి-యోగాద్ ధనం-జయ ।
    బుద్ధౌ శరణమన్విచ్ఛ కృపణాః ఫల-హేతవః ॥

50: |-
    బుద్ధి-యుక్తో జహాతీహ ఉభే సుకృత-దుష్కృతే ।
    తస్మాద్ యోగాయ యుజ్యస్వ యోగః కర్మసు కౌశలం ॥

51: |-
    కర్మ-జం బుద్ధి-యుక్తా హి ఫలం త్యక్త్వా మనీషిణః ।
    జన్మ-బంధ-వినిర్ముక్తాః పదం గచ్ఛంత్యనామయం ॥

52: |-
    యదా తే మోహ-కలిలం బుద్ధిర్వ్యతి-తరిష్యతి ।
    తదా గంతాసి నిర్వేదం శ్రోతవ్యస్య శ్రుతస్య చ ॥

53: |-
    శ్రుతి-విప్రతి-పన్నా తే యదా స్థాస్యతి నిశ్చలా ।
    సమాధావచలా బుద్ధిః తదా యోగమవాప్స్యసి ॥

54: |-
    స్థిత-ప్రజ్ఞస్య కా భాషా సమాధి-స్థస్య కేశవ ।
    స్థిత-ధీః కిం ప్ర-భాషేత కిమాసీత వ్రజేత కిం ॥

55: |-
    ప్ర-జహాతి యదా కామాన్ సర్వాన్ పార్థ మనోగతాన్ ।
    ఆత్మన్యేవాఽత్మనా తుష్టః స్థిత-ప్రజ్ఞస్తదోచ్యతే ॥

56: |-
    దుఃఖేష్వనుద్విగ్న-మనాః సుఖేషు విగత-స్పృహః ।
    వీత-రాగ-భయ-క్రోధః స్థిత-ధీర్మునిరుచ్యతే ॥

57: |-
    యః సర్వత్రానభిస్నేహః తత్తత్ ప్రాప్య శుభాశుభం ।
    నాభి నందతి న ద్వేష్టి తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥

58: |-
    యదా సం-హరతే చాయం కూర్మోఽంగానీవ సర్వశః ।
    ఇంద్రియాణీంద్రియార్థేభ్యః తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥

59: |-
    విషయా విని-వర్తంతే నిరాహారస్య దేహినః ।
    రస-వర్జం రసోఽప్యస్య పరం దృష్ట్వా నివర్తతే ॥

60: |-
    యతతో హ్యపి కౌంతేయ పురుషస్య విపశ్చితః ।
    ఇంద్రియాణి ప్రమాథీని హరంతి ప్రసభం మనః ॥

61: |-
    తాని సర్వాణి సంయమ్య యుక్త ఆసీత మత్పరః ।
    వశే హి యస్యేంద్రియాణి తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥

62: |-
    ధ్యాయతో విషయాన్ పుంసః సంగస్తేషూప-జాయతే ।
    సంగాత్ సంజాయతే కామః కామాత్ క్రోధోఽభి-జాయతే ॥

63: |-
    క్రోధాద్ భవతి సమ్మోహః సమ్మోహాత్ స్మృతి-విభ్రమః ।
    స్మృతి-భ్రంశాద్ బుద్ధి-నాశో బుద్ధి-నాశాద్ వినశ్యతి ॥

64: |-
    రాగ-ద్వేష-విముక్తైస్తు విషయానింద్రియైశ్చరన్ ।
    ఆత్మ-వశ్శైర్విధేయాత్మా ప్రసాదమధి-గచ్ఛతి ॥

65: |-
    ప్రసాదే సర్వ-దుఃఖానాం హానిరస్యోప-జాయతే ।
    ప్రసన్న-చేతసో హ్యాశు బుద్ధిః పర్యవ-తిష్ఠతి ॥

66: |-
    నాస్తి బుద్ధిరయుక్తస్య నచాయుక్తస్య భావనా ॥
    నచాభావయతః శాంతిః అశాంతస్య కుతః సుఖం ॥

67: |-
    ఇంద్రియాణాం హి చరతాం యన్మనోఽను విధీయతే ।
    తదస్య హరతి ప్రజ్ఞాం వాయుర్నావమివాంభసి ॥

68: |-
    తస్మాద్ యస్య మహాబాహో నిగృహీతాని సర్వశః ।
    ఇంద్రియాణీంద్రియార్థేభ్యః తస్య ప్రజ్ఞా ప్రతిష్ఠితా ॥

69: |-
    యా నిశా సర్వ-భూతానాం తస్యాం జాగర్తి సంయమీ ।
    యస్యాం జాగ్రతి భూతాని సా నిశా పశ్యతో మునేః ॥

70: |-
    ఆపూర్యమాణమచల-ప్రతిష్ఠం
    సముద్రమాపః ప్రవిశంతి యద్వత్ ।
    తద్వత్ కామా యం ప్రవిశంతి సర్వే
    స శాంతిమాప్నోతి న కామ-కామీ ॥

71: |-
    విహాయ కామాన్ యః సర్వాన్ పుమాంశ్చరతి నిస్పృహః ।
    నిర్మమో నిరహంకారః స శాంతిమధి-గచ్ఛతి ॥

72: |-
    ఏషా బ్రాహ్మీ స్థితిః పార్థ నైనాం ప్రాప్య వి-ముహ్యతి ।
    స్థిత్వాఽస్యామంత-కాలేఽపి బ్రహ్మ నిర్బాణమృచ్ఛతి ॥

1: |-
    ఏవం సతత-యుక్తా యే భక్తాస్త్వాం పర్యుపాసతే ।
    యే చాప్యక్షరమవ్యక్తం తేషాం కే యోగ-విత్తమాః ॥

2: |-
    మయ్యావేశ్య మనో యే మాం నిత్య-యుక్తా ఉపాసతే ।
    శ్రద్ధయా పరయోపేతాః తే మే యుక్త-తమా మతాః ॥

3: |-
    యే త్వక్షరమనిర్దేశ్యం అవ్యక్తం పర్యుపాసతే ।
    సర్వత్ర-గమచింత్యం చ కూట-స్థమచలం ధ్రువం ॥

4: |-
    సన్నియమ్యేంద్రియ-గ్రామం సర్వత్ర సమ-బుద్ధయః ।
    తే ప్రాప్నువంతి మామేవ సర్వ-భూత-హితే రతాః ॥

5: |-
    క్లేశోఽధిక-తరస్తేషాం అవ్యక్తాసక్త-చేతసాం ।
    అవ్యక్తా హి గతిర్దుఃఖం దేహ-వద్భిరవాప్యతే ॥

6: |-
    యే తు సర్వాణి కర్మాణి మయి సంన్యస్య మత్-పరాః ।
    అనన్యేనైవ యోగేన మాం ధ్యాయంత ఉపాసతే ॥

7: |-
    తేషామహం సముద్ధర్తా మృత్యు-సంసార-సాగరాత్ ।
    భవామి న-చిరాత్ పార్థ మయ్యావేశిత-చేతసాం ॥

8: |-
    మయ్యేవ మన ఆధత్స్వ మయి బుద్ధిం నివేశయ ।
    నివసిష్యసి మయ్యేవ అత ఊర్ధ్వం న సంశయః ॥

9: |-
    అథ చిత్తం సమాధాతుం న శక్నోషి మయి స్థిరం ।
    అభ్యాస-యోగేన తతో మామిచ్ఛాsప్తుం ధనం-జయ ॥

10: |-
    అభ్యాసేఽప్యసమర్థోఽసి మత్-కర్మ-పరమో భవ ।
    మదర్థమపి కర్మాణి కుర్వన్ సిద్ధిమవాప్స్యసి ॥

11: |-
    అథైతదప్యశక్తోఽసి కర్తుం మద్యోగమాశ్రితః ।
    సర్వ-కర్మ-ఫల-త్యాగం తతః కురు యతాత్మ-వాన్ ॥

12: |-
    శ్రేయో హి జ్ఞానమభ్యాసాత్ జ్ఞానాద్ ధ్యానం విశిష్యతే ।
    ధ్యానాత్ కర్మ-ఫల-త్యాగః త్యాగాచ్ఛాంతిరనంతరం ॥

13: |-
    అద్వేష్టా సర్వ-భూతానాం మైత్రః కరుణ ఏవ చ ।
    నిర్మమో నిరహంకారః సమ-దుఃఖ-సుఖః క్షమీ ॥

14: |-
    సంతుష్టః సతతం యోగీ యతాత్మా దృఢ-నిశ్చయః ।
    మయ్యర్పిత-మనో-బుద్ధిః యో మద్భక్తః స మే ప్రియః ॥

15: |-
    యస్మాన్నోద్విజతే లోకో లోకాన్నోద్విజతే చ యః ।
    హర్షామర్ష-భయోద్వేగైః ముక్తో యః స చ మే ప్రియః ॥

16: |-
    అనపేక్షః శుచిర్దక్షః ఉదాసీనో గత-వ్యథః ।
    సర్వారంభ-పరిత్యాగీ యో మద్-భక్తః స మే ప్ర్రియః ॥

17: |-
    యో న హృష్యతి న ద్వేష్టి న శోచతి న కాంక్షతి ।
    శుభాశుభ-పరిత్యాగీ భక్తి-మాన్ యః స మే ప్రియః ॥

18: |-
    సమః శత్రౌ చ మిత్రే చ తథా మానాప-మానయోః ।
    శీతోష్ణ-సుఖ-దుఃఖేషు సమః సంగ-వివర్జితః ॥

19: |-
    తుల్య-నిందా-స్తుతిర్మౌనీ సంతుష్టో యేన-కేన-చిత్ ।
    అనికేతః స్థిర-మతిః భక్తి-మాన్ మే ప్రియో నరః ॥

20: |-
    యే తు ధర్మ్యామృతమిదం యథోక్తం పర్యుపాసతే ।
    శ్రద్దధానా మత్-పరమాః భక్తాస్తేఽతీవ మే ప్రియాః ॥

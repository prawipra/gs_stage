1: |-
    ఇదం తు తే గుహ్య-తమం ప్రవక్ష్యామ్యనసూయవే ।
    జ్ఞానం విజ్ఞాన-సహితం యజ్జ్ఞాత్వా మోక్ష్యసేఽశుభాత్ ॥

2: |-
    రాజ-విద్యా రాజ-గుహ్యం పవిత్రమిదముత్తమం ।
    ప్రత్యక్షావ-గమం ధర్మ్యం సుసుఖం కర్తుమవ్యయం ॥

3: |-
    అశ్రద్దధానాః పురుషాః ధర్మస్యాస్య పరం-తప ।
    అప్రాప్య మాం నివర్తంతే మృత్యు-సంసార-వర్త్మని ॥

4: |-
    మయా తతమిదం సర్వం జగదవ్యక్త-మూర్తినా ।
    మత్స్థాని సర్వ-భూతాని నచాహం తేష్వవస్థితః ॥

5: |-
    న చ మత్స్థాని భూతాని పశ్య మే యోగమైశ్వరం ।
    భూత-భృన్న చ భూత-స్థో మమాఽత్మా భూత-భావనః ॥

6: |-
    యథాఽఽకాశ-స్థితో నిత్యం వాయుః సర్వత్ర-గో మహాన్ ।
    తథా సర్వాణి భూతాని మత్స్థానీత్యుప-ధారయ ॥

7: |-
    సర్వ-భూతాని కౌంతేయ ప్రకృతిం యాంతి మామికాం ।
    కల్ప-క్షయే పునస్తాని కల్పాదౌ వి-సృజామ్యహం ॥

8: |-
    ప్రకృతిం స్వామవష్టభ్య వి-సృజామి పునః-పునః ।
    భూత-గ్రామమిమం కృత్స్నం అవశం ప్రకృతేర్వశాత్ ॥

9: |-
    న చ మాం తాని కర్మాణి నిబధ్నంతి ధనం-జయ ।
    ఉదాసీనవదాసీనం అసక్తం తేషు కర్మసు ॥

10: |-
    మయాఽధ్యక్షేణ ప్రకృతిః సూయతే స-చరాచరం ।
    హేతునాఽనేన కౌంతేయ జగద్ విపరి-వర్తతే ॥

11: |-
    అవ-జానంతి మాం మూఢా మానుషీం తనుమాశ్రితం ।
    పరం భావమజానంతో మమ భూత-మహేశ్వరం ॥

12: |-
    మోఘాశా మోఘ-కర్మాణో మోఘ-జ్ఞానా విచేతసః ।
    రాక్షసీమాసురీం చైవ ప్రకృతిం మోహినీం శ్రితాః ॥

13: |-
    మహాత్మానస్తు మాం పార్థ దైవీం ప్రకృతిమాశ్రితాః ।
    భజంత్యనన్య-మనసో జ్ఞాత్వా భూతాదిమవ్యయం ॥

14: |-
    సతతం కీర్తయంతో మాం యతంతశ్చ దృఢ-వ్రతాః ।
    నమస్యంతశ్చ మాం భక్త్యా నిత్య-యుక్తా ఉపాసతే ॥

15: |-
    జ్ఞాన-యజ్ఞేన చాప్యన్యే యజంతో మాముపాసతే ।
    ఏకత్వేన పృథక్త్వేన బహుధా విశ్వతో-ముఖం ॥

16: |-
    అహం క్రతురహం యజ్ఞః స్వధాఽహమహమౌషధం ।
    మంత్రోఽహమహమేవాఽజ్యం అహమగ్నిరహం హుతం ॥

17: |-
    పితాఽహమస్య జగతో మాతా ధాతా పితామహః ।
    వేద్యం పవిత్రమోంకారః ఋక్ సామ యజురేవ చ ॥

18: |-
    గతిర్భర్తా ప్రభుః సాక్షీ నివాసః శరణం సుహృత్ ।
    ప్రభవః ప్రళయః స్థానం నిధానం బీజమవ్యయం ॥

19: |-
    తపామ్యహమహం వర్షం నిగృహ్ణామ్యుత్సృజామి చ ।
    అమృతం చైవ మృత్యుశ్చ సదసచ్చాహమర్జున ॥

20: |-
    త్రైవిద్యా మాం సోమ-పాః పూత-పాపాః 
    యజ్ఞైరిష్ట్వాస్వర్గతిం ప్రార్థయంతే ।
    తే పుణ్యమాసాధ్య సురేంద్ర-లోకం 
    అశ్నంతి దివ్యాన్ దివి దేవ-భోగాన్ ॥

21: |-
    తే తం భుక్త్వా స్వర్గ-లోకం విశాలం 
    క్షీణే పుణ్యే మర్త్య-లోకం విశంతి ।
    ఏవం త్రయీ-ధర్మమను-ప్రపన్నాః 
    గతాగతం కామ-కామా లభంతే ॥

22: |-
    అనన్యాశ్చింతయంతో మాం యే జనాః పర్యుపాసతే ।
    తేషాం నిత్యాభి-యుక్తానాం యోగ-క్షేమం వహామ్యహం ॥

23: |-
    యేఽప్యన్య-దేవతా-భక్తాః యజంతే శ్రద్ధయాఽన్వితాః ।
    తేఽపి మామేవ కౌంతేయ యజంత్యవిధి-పూర్వకం ॥

24: |-
    అహం హి సర్వ-యజ్ఞానాం భోక్తా చ ప్రభురేవ చ ।
    నతు మామభి-జానంతి తత్త్వేనాతశ్చ్యవంతి తే ॥

25: |-
    యాంతి దేవ-వ్రతా దేవాన్ పితౄన్ యాంతి పితృ-వ్రతాః ।
    భూతేజ్యా యాంతి భూతాని యాంతి మద్యాజినోఽపి మాం ॥

26: |-
    పత్రం పుష్పం ఫలం తోయం యో మే భక్త్యాప్రయచ్ఛతి ।
    తదహం భక్త్యుప-హృతం అశ్నామి ప్రయతాత్మనః ॥

27: |-
    యత్ కరోషి యదశ్నాసి యజ్జుహోషి దదాసి యత్ ।
    యత్తపస్యసి కౌంతేయ తత్ కురుష్వ మదర్పణం ॥

28: |-
    శుభాశుభ-ఫలైరేవం మోక్ష్యసే కర్మ-బంధనైః ।
    సంన్యాస-యోగ-యుక్తాత్మా విముక్తో మాముపైష్యసి ॥

29: |-
    సమోఽహం సర్వ-భూతేషు న మే ద్వేష్యోఽస్తి న ప్రియః ।
    యే భజంతి తు మాం భక్త్యా మయి తే తేషు చాప్యహం ॥

30: |-
    అపి చేత్ సు-దురాచారో భజతే మామనన్య-భాక్ ।
    సాధురేవ స మంతవ్యః సమ్యగ్ వ్యవసితో హి సః ॥

31: |-
    క్షిప్రం భవతి ధర్మాత్మా శశ్వచ్ఛాంతిం నిగచ్ఛతి ।
    కౌంతేయ ప్రతి-జానీహి న మే భక్తః ప్రణశ్యతి ॥

32: |-
    మాం హి పార్థ వ్యపాశ్రిత్య యేఽపి స్యుః పాప-యోనయః ।
    స్త్రియో వైశ్యాస్తథా శూద్రాః తేఽపి యాంతి పరాం గతిం ॥

33: |-
    కిం పునర్బ్రాహ్మణాః పుణ్యాః భక్తా రాజర్షయస్తథా ।
    అనిత్యమసుఖం లోకం ఇమం ప్రాప్య భజస్వ మాం ॥

34: |-
    మన్మనా భవ మద్భక్తో మద్యాజీ మాం నమస్కురు ।
    మామేవైష్యసి యుక్త్వైవం ఆత్మానం మత్పరాయణః ॥

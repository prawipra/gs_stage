# translated languages: each main key is a unique code across all supported languages
# keys for Kannada and English must be kan and eng respectively: hardcoded elsewhere
# recommend 3-character ISO 639:2023 codes for all (other langs): automatically makes codes unique
# for this project, ISO 639-3 (even 639-2) codes should suffice (all retained in 639:2023)
# https://en.wikipedia.org/wiki/List_of_ISO_639-3_codes

# for each translated language:
# active: optional true/false flag to denote if that lang's xlation is included; omission means active
# script: ISO 15924 code for the script the text is normally written in
# region: ISO 3166 code for the region in which the language is predominant; IN for Indic languages in this app; US for english
# xlit_extension: optional custom value to denote transliteration convention (ISO 15919, IAST,...)
# name: subkeys with the name of the lang in other langs

san:
  active: false         # not xlation lang but useful to build BCP 47 value for HTML lang attr
  script: Deva
  region: IN
  name:
    kan: ಸಂಸ್ಕೃತ
    eng: Sanskrit
    hin: संस्कृत
    tam: சமஸ்கிருதம்
    tel: సంస్కృతం
    mal: സംസ്കൃതം


kan:
  active: true  # entry not needed: missing entry is treated as `active: true`
  script: Knda
  region: IN
  name:
    kan: ಕನ್ನಡ
    eng: Kannada
    hin: कन्नड़
    tam: கன்னடம்
    tel: కన్నడ
    mal: കന്നഡ


eng:
  script: Latn
  region: US
  xlit_extension: iso15919
  name:
    kan: ಇಂಗ್ಲಿಷ್
    eng: English
    hin: अंग्रेज़ी
    tam: ஆங்கிலம்
    tel: ఆంగ్లం
    mal: ഇംഗ്ലീഷ്


hin:
  script: Deva
  region: IN
  name:
    kan: ಹಿಂದಿ
    eng: Hindi
    hin: हिन्दी
    tam: இந்தி
    tel: హిందీ
    mal: ഹിന്ദി


tam:
  script: Taml
  region: IN
  name:
    kan: ತಮಿಳು
    eng: Tamil
    hin: तमिल
    tam: தமிழ்
    tel: తమిళం
    mal: തമിഴ്


tel:
  script: Telu
  region: IN
  name:
    kan: ತೆಲುಗು
    eng: Telugu
    hin: तेलुगु
    tam: தெலுங்கு
    tel: తెలుగు
    mal: തെലുങ്ക്


mal:
  active: false
  script: Mlym
  region: IN
  name:
    kan: ಮಲಯಾಳಂ
    eng: Malayalam
    hin: मलयालम
    tam: மலையாளம்
    tel: మలయాళం
    mal: മലയാളം

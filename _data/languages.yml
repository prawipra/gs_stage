# supported languages: each main key is a unique code across all supported languages
# recommed 3-character ISO 639:2023 codes: automatically makes codes unique
# for this project, ISO 639-3 (even 639-2) codes should suffice (all retained in 639:2023)
# https://en.wikipedia.org/wiki/List_of_ISO_639-3_codes

# for each supported language:
# native: language name in that language
# english: English name for the language
# script: ISO 15924 code for the script the text is normally written in
# region: ISO 3166 code for the region in which the language is predominant; IN for Indic languages in this app; US for english
# xlit_extension: optional custom value to denote transliteration convention (ISO 15919, IAST,...)
# bcp47 used to specify html page's language (lang global attribute in HTML)

san:
  native: संस्कृत
  english: Sanskrit
  script: Deva
  region: IN
  # xlit_lang_tag needed: won't be xliterating Sanskrit text in Sanskrit

kan:
  native: ಕನ್ನಡ
  english: Kannada
  script: Knda
  region: IN
  xlit_lang_tag: san-Knda-IN

eng:
  native: English
  english: English
  script: Latn
  region: US
  xlit_extension: iso15919
  xlit_lang_tag: san-Latn-IN-x-iso15919

hin:
  native: हिन्दी
  english: Hindi
  script: Deva
  region: IN
  xlit_lang_tag: san-Deva-IN

tam:
  native: தமிழ்
  english: Tamil
  script: Taml
  region: IN
  xlit_lang_tag: san-Taml-IN

tel:
  native: తెలుగు
  english: Telugu
  script: Telu
  region: IN
  xlit_lang_tag: san-Telu-IN

mal:
  native: മലയാളം
  english: Malayalam
  script: Mlym
  region: IN
  xlit_lang_tag: san-Mlym-IN
